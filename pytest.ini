[pytest]
addopts = --import-mode=importlib
markers =
    xdist_group(name): keep tests with the same resource group on one xdist worker
    validator: repository conformance item supplied by the custom collector
# Canonical full-suite run (from repo root):
#   python3 scripts/run-python-tests.py --suite full --verbose
# Single suite:
#   python3 scripts/run-python-tests.py --suite precommit
#   python3 -m pytest skills/<name>/tests
python_files = test_*.py validate_*.py
pythonpath = src
testpaths = tests hooks/tests skills src/officina/wakeup/tests validators
# initialize-tdd's generated-project test scaffold is a template, while the
# skill's own _rtx tests remain part of this repository's suite.
norecursedirs = skills/initialize-tdd/assets/python/tests .git __pycache__
