package_catalogs:
- path: src/officina/common
  summary: Cross-cutting Officina primitives.
  description: This package contains small shared utilities that do not constitute an independent subsystem. Callers import concrete owning modules.
  roles:
    atomic_files.py: Performs confined regular-file reads and atomic create/replace writes.
    codex_toml.py: Reads and updates Codex configuration without discarding unrelated TOML content.
    dates.py: Normalizes repository date values and date-oriented filenames.
    famulus_paths/: Resolves installed Famulus and repository paths across supported hosts.
    python_source_cache.py: Caches parsed Python source while preserving path and content identity.
    repository_paths.py: Resolves and normalizes paths within a repository boundary.
    toml_io.py: Provides the shared TOML parsing and serialization primitives.
- path: src/officina/blueprints
  summary: Blueprint discovery, validation, authorization, and projection.
  description: This package owns the repository-blueprint model and its mechanical consumers. Callers import concrete owning modules.
  roles:
    authorization.py: Resolves whether a module caller may use a declared blueprint export.
    graph.py: Loads registered blueprints into the canonical dependency graph.
    inventory.py: Discovers blueprint documents and their owning repository paths.
    pooled.py: Combines related blueprint records into deterministic pooled views.
    process_binding.py: Compiles declared process bindings into executable argument vectors.
    projection.py: Projects blueprint interfaces and authorization into consumer-facing records.
    search.py: Searches blueprint metadata and renders stable machine-readable results.
    template.py: Validates and expands blueprint template declarations.
- path: src/officina/certification
  summary: Certification hashing, records, and currentness views.
  description: This package owns deterministic certificate construction and inspection. Callers import concrete owning modules.
  roles:
    hashing.py: Computes canonical node hashes and certification-basis closures.
    records.py: Parses, normalizes, and writes certificate-history records.
    view.py: Evaluates certificate currentness, exports, and authorization views.
- path: src/officina/configuration
  summary: Configuration loading and repository-boundary validation.
  description: This package owns configuration-aware schemas and explicit repository configuration loading. Callers import concrete owning modules.
  roles:
    configured_schema.py: Builds and validates schemas whose constraints come from repository configuration.
    repository.py: Loads and validates the repository's Officina configuration.
    schema.json: Defines the accepted repository-configuration document shape.
- path: src/officina/controller
  summary: Controller models and invocation protocol.
  description: This package owns controller data structures and their invocation protocol. Callers import concrete owning modules.
  roles:
    model.py: Defines controller request, response, identifier, and JSON value models.
    protocol.py: Defines the lifecycle and submission protocol implemented by controllers.
- path: src/officina/credentials
  summary: Credential files, OAuth JSON, and secret storage.
  description: This package owns host-neutral credential persistence and lookup. Callers import concrete owning modules.
  roles:
    google.py: Resolves and validates Google credential-file bindings.
    oauth.py: Reads and writes OAuth client and token JSON documents safely.
    secret_store.py: Stores and retrieves namespaced secrets through the supported backend.
- path: src/officina/docstring
  summary: Docstring parsing, policy, and validation.
  description: This package owns the structured docstring format and its validators. Callers import concrete owning modules.
  roles:
    config.yaml: Configures the active structured-docstring schema and policy inputs.
    parser.py: Parses structured module, callable, graph, ownership, and pipeline sections.
    policy.py: Loads the configured docstring rules used by repository validation.
    validation.py: Applies semantic checks to parsed structured docstrings.
- path: src/officina/git
  summary: Git provenance and isolated repository snapshots.
  description: This package owns Git inspection and materialization behavior. Callers import concrete owning modules.
  roles:
    provenance.py: Captures commit readiness, provenance, and isolated Git snapshots.
- path: src/officina/standards
  summary: Pinned-standard extraction and querying.
  description: This package validates standard import closures and exposes deterministic queries over them. Callers import concrete owning modules.
  roles:
    extractor.py: Resolves a standard and its pinned import closure into one validated view.
    query.py: Answers deterministic task and requirements queries over extracted standards.
- path: src/officina/visualization
  summary: Graph extraction, payload processing, rendering, and serving.
  description: This package owns the graph model and concrete blueprint and docstring visualization pipelines. Callers import concrete owning modules.
  roles:
    artifacts.py: Defines and writes the HTML and JSON artifacts produced by visualization runs.
    base_extractor.py: Defines the common graph-source extraction contract.
    base_renderer.py: Coordinates graph payload reduction, HTML rendering, and output writing.
    base_renderer_cli.py: Implements the shared renderer command-line interface.
    base_visualizer.py: Resolves graph sources and connects extractors to renderers.
    elk_html_renderer.py: Converts graph payloads into the self-contained ELK HTML viewer.
    from_blueprint/: Extracts and presents dependency graphs from Officina blueprints.
    from_docstring/: Extracts and presents dependency graphs from structured docstrings.
    graph.py: Defines graph nodes, edges, validation, filtering, and serialization.
    graph_specification.schema.json: Defines the JSON graph payload accepted by renderers.
    html_renderer/: Owns the HTML shell, browser runtime, styles, and vendored renderer assets.
    payload.py: Validates and normalizes renderer payload mappings.
    server.py: Serves generated visualization artifacts from a bounded local HTTP server.
- path: src/officina/visualization/from_blueprint
  summary: Blueprint-to-graph extraction and visualization.
  description: This package converts repository blueprint graphs into renderable graph payloads.
  roles:
    __main__.py: Provides the blueprint visualization command-line entry point.
    catalog.py: Builds presentation catalogs for modules, sources, interfaces, and files.
    details.py: Formats detailed inspector content for blueprint graph entities.
    extractor.py: Extracts graph nodes and edges from the repository blueprint graph.
    payload_builder.py: Assembles validated renderer payloads from extracted blueprint data.
    presentation_nodes.py: Adds presentation-only grouping and explanatory nodes.
    scope.py: Selects the requested blueprint subgraph and traversal boundary.
    visualizer.py: Orchestrates blueprint extraction, payload construction, and rendering.
- path: src/officina/visualization/from_docstring
  summary: Docstring-to-graph extraction and visualization.
  description: This package converts structured Python docstrings into renderable dependency graphs.
  roles:
    __main__.py: Provides the docstring visualization command-line entry point.
    io.py: Loads Python modules and writes docstring visualization outputs.
    json_extractor.py: Converts parsed Python and docstring metadata into dependency JSON.
    parser.py: Parses Python modules and their structured graph annotations.
    payload_builder.py: Assembles validated renderer payloads for docstring graphs.
    renderer.py: Renders docstring dependency payloads through the shared HTML renderer.
    visualizer.py: Orchestrates module discovery, extraction, graph building, and rendering.
- path: src/officina/visualization/html_renderer
  summary: Browser assets for the ELK HTML renderer.
  description: This package assembles the HTML, CSS, JavaScript, and vendored runtime inputs used by graph rendering.
  roles:
    assets.py: Loads and assembles the HTML template, styles, runtime modules, and vendored scripts.
    dependencies.py: Declares renderer asset ordering and verifies vendored dependency provenance.
    page.html: Provides the static HTML shell populated by the renderer.
    viewer.css: Defines the graph canvas, controls, inspector, legend, and responsive layout styles.
- path: src/officina/repository
  summary: Repository-level inspection and conformance operations.
  description: This package groups repository test discovery, local checks, and remote check orchestration. Callers import concrete owning modules.
  roles:
    checks/: Selects and executes local, snapshot, and remote repository checks.
- path: src/officina/repository/checks
  summary: Repository test and conformance-check execution.
  description: This package owns local suite selection, validator snapshots, test discovery, and remote check helpers.
  roles:
    discovery.py: Discovers canonical repository test roots and classifies test modules.
    remote.py: Submits and monitors remote repository-check jobs.
    remote_macos_windows.py: Defines the macOS and Windows remote check matrices.
    runner.py: Selects suites and coordinates local or parallel repository checks.
- path: src/officina/validators
  summary: Validation helpers for repository code-quality checks.
  description: This package owns docstring validation and exact staged-repository snapshots. Callers import concrete owning modules.
  roles:
    docstring_validator.py: Validates structured docstrings and package file inventories.
    snapshot.py: Runs validators against an exact staged-tree snapshot.

