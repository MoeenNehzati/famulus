# Every package boundary created by these moves or their README-only catalogs
# declares its registration policy explicitly. Only standards is a module.
package_boundaries:
- path: src/officina/standards
  disposition: registered-module
  module_id: standards
  blueprint: src/officina/standards/blueprint.yaml
- path: src/officina/visualization
  disposition: unregistered-package
- path: src/officina/repository
  disposition: unregistered-package
- path: src/officina/repository/checks
  disposition: unregistered-package
- path: src/officina/validators
  disposition: unregistered-package

renames:
  python_modules:
  - from: officina.common.standard_extractor
    to: officina.standards.extractor
  - from: officina.common.standard_query
    to: officina.standards.query
  - from: officina.common.visualization
    to: officina.visualization
  - from: officina.common.discover_tests
    to: officina.repository.checks.discovery
  - from: officina.repository_checks
