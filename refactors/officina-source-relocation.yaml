  - from: officina.repo_checks.remote
    to: officina.repository.checks.remote
  - from: officina._validator_snapshot
    to: officina.validators.snapshot
  source_ids:
  - from: common.source.standard-extractor
    to: standards.source.extractor
  - from: common.source.standard-query
    to: standards.source.query
  interface_ids:
  - from: common.source.standard-extractor.interface.python-api
    to: standards.source.extractor.interface.python-api
  - from: common.source.standard-query.interface.query-standard
    to: standards.source.query.interface.query-standard
  - from: common.interface.standard-extractor
    to: standards.interface.extractor
  - from: common.interface.query-standard
    to: standards.interface.query-standard

blueprint_documents:
- path: src/officina/standards/blueprint.yaml
  document:
    authority: {owns_filesystem: []}
    children: {}
    content:
    - __init__\.py
    description: Pinned-standard closure validation and deterministic standard queries.
    exports: {}
    gateway: {language: Python, path: __init__.py}
    id: standards
    namespace_exports: {}
    node_type: module
    schema_version: 6
    sources: {}
    version: 1
- path: src/officina/configuration/blueprint.yaml
  document:
    authority: {owns_filesystem: []}
    children: {}
    content:
    - __init__\.py
    - configured_schema\.py
    - repository\.py
    - schema\.json
    description: Configuration-aware schemas and explicit repository configuration loading.
    exports:
      configuration.interface.repository:
        access: {allow_all_modules: true, allowed_callers: []}
        source_interface: configuration.source.repository.interface.python-api
    gateway: {language: Python, path: __init__.py}
    id: configuration
    namespace_exports: {}
    node_type: module
    schema_version: 6
    sources:
      configuration.source.repository:
        blueprint: {base: module-root, path: blueprints/repository.yaml}
    version: 1

ownership_transfers:
- from_blueprint: src/officina/common/blueprint.yaml
  to_blueprint: src/officina/standards/blueprint.yaml
  source: {from: common.source.standard-extractor, to: standards.source.extractor}
  export: {from: common.interface.standard-extractor, to: standards.interface.extractor}
  content: {from: 'standard_extractor\.py', to: 'extractor\.py'}
- from_blueprint: src/officina/common/blueprint.yaml
  to_blueprint: src/officina/standards/blueprint.yaml
  source: {from: common.source.standard-query, to: standards.source.query}
  export: {from: common.interface.query-standard, to: standards.interface.query-standard}
  content: {from: 'standard_query\.py', to: 'query\.py'}

caller_additions:
- blueprint: src/officina/common/blueprint.yaml
  interface: common.interface.toml-io
  caller: configuration

