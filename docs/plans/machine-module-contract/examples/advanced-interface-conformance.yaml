schema_version: 1
module: example-skill.machine-module.advanced-worker
execution_boundary:
  kind: python-adapter-v1
  sandbox_backends: {linux: linux-bwrap-v1, macos: macos-seatbelt-v1, windows: windows-appcontainer-v1}
adapters:
  filesystem: temporary-owner-root
  helpers: fixture-dispatcher
exports:
  example-skill.machine.update-record:
    outcome_coverage:
      operational-failure: {kind: not-deterministically-inducible, reason: Reserved for unexpected gateway/runtime failure; the contract requires stopping rather than retrying.}
    cases:
      - id: update-success
        caller_argv: [record.json]
        stdin_requested: false
        fixture_state:
          files:
            record.json: '{"id":"alpha","value":"new"}'
            state/records.json: '{"id":"alpha","value":"old"}'
        expected_outcome: success
        expected_streams:
          stdout: {framing: exactly-one-json-document, schema: record-receipt.schema.json}
          stderr: {empty: true}
        expected_effects:
          - {direct_io_ref: state-write, action: update, path: state/records.json}
        observation_scope: {kind: sandbox, boundaries: [filesystem, stdout, stderr]}
        timeout_seconds: 5
      - id: update-missing-input
        caller_argv: []
        stdin_requested: false
        expected_parser_result: rejected
        expected_diagnostic: missing-required-argument
        timeout_seconds: 5
  example-skill.machine.watch-records:
    cases:
      - id: watch-ready-stop
        caller_argv: []
        stdin_requested: false
        fixture_state:
          files:
            state/records.json: '{"id":"alpha","value":"one"}'
        expected_outcome: stopped
        expected_streams:
          event-stream: {framing: newline-delimited-json, schema: record-event.schema.json, first_event_kind: ready}
        expected_effects: []
        observation_scope: {kind: sandbox, boundaries: [filesystem, process, stdout, stderr]}
        timeout_seconds: 5
        readiness_deadline_seconds: 2
        stop: {kind: dispatcher-cancel}
        stop_deadline_seconds: 2
        cleanup: {kind: terminate-and-remove-fixtures}
        post_cleanup_assertions:
          - {kind: process-exited}
          - {kind: fixture-root-removed}
      - id: watch-startup-failure
        caller_argv: []
        stdin_requested: false
        fixture_state: {files: {}}
        expected_outcome: startup-failure
        expected_streams: {stdout: {empty: true}}
        expected_effects: []
        observation_scope: {kind: sandbox, boundaries: [filesystem, process, stdout, stderr]}
        timeout_seconds: 5
        readiness_deadline_seconds: 2
        stop: {kind: dispatcher-cancel}
        stop_deadline_seconds: 2
        cleanup: {kind: terminate-and-remove-fixtures}
        post_cleanup_assertions:
          - {kind: process-exited}
          - {kind: fixture-root-removed}
  example-skill.machine.inspect-account:
    outcome_coverage:
      operational-failure: {kind: not-deterministically-inducible, reason: Reserved for unexpected gateway/runtime failure; semantic review checks its accuracy.}
    cases:
      - id: inspect-known-account
        caller_argv: [--account, primary]
        stdin_requested: false
        helper_results:
          list-accounts: {outcome: success, outputs: {accounts: {accounts: [primary]}}}
        expected_outcome: success
        expected_streams:
          stdout: {framing: exactly-one-json-document, schema: account-metadata.schema.json}
          stderr: {empty: true}
        expected_effects: []
        observation_scope: {kind: sandbox, boundaries: [helper, stdout, stderr]}
        timeout_seconds: 5
      - id: no-accounts
        caller_argv: [--account, primary]
        stdin_requested: false
        helper_results:
          list-accounts: {outcome: success, outputs: {accounts: {accounts: []}}}
        expected_outcome: no-accounts
        expected_effects: []
        observation_scope: {kind: sandbox, boundaries: [helper, stdout, stderr]}
        timeout_seconds: 5
      - id: helper-failure
        caller_argv: [--account, primary]
        stdin_requested: false
        helper_results:
          list-accounts: {outcome: operational-failure, outputs: {}}
        expected_outcome: helper-failure
        expected_effects: []
        observation_scope: {kind: sandbox, boundaries: [helper, stdout, stderr]}
        timeout_seconds: 5
