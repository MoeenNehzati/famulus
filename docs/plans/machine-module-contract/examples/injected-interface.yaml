interfaces:
  inspect-records:
    id: example-skill.machine.inspect-records
    version: 1
    description: Return selected records without modifying them.
    invocation_binding:
      fixed:
        - {kind: option, name: --format, value: json, type: {kind: string, format: {named: literal}}}
    helpers: []
    direct_io:
      reads:
        - {id: records-read, medium: local-filesystem, access: read, system: filesystem, content: report, format: json, path: records.json, sensitivity: derived-private}
      writes:
        - {id: records-stdout, medium: stdout, access: write, content: report, format: json, sensitivity: user-private}
      network: []
    contract:
      arguments:
        targets:
          description: Record names selected for inspection.
          required: true
          sensitivity: user-private
          invocation_binding:
            kind: positional
            position: 0
            arity: {minimum: 1, maximum: null}
          type:
            kind: list
            element_type:
              kind: string
              sensitivity: user-private
              description: One exact record name.
              format: {named: identifier}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
        - id: records
          channel: stdout
          audience: machine
          encoding: utf-8
          framing: exactly-one-json-document
          description: JSON array containing the selected records.
          schema: {definition_ref: record-list}
          direct_io_ref: records-stdout
          cardinality: {minimum: 0, maximum: null}
          ordering: stable
          pagination: {kind: none}
          truncation: {kind: none}
          empty: An empty array means no selected record exists.
      outcomes:
        - {id: success, class: success, signal: {exit_codes: [0]}, outputs: [records], effects: [], caller_action: Consume the returned array.}
        - {id: operational-failure, class: error, signal: {exit_codes: [1]}, outputs: [], effects: [], caller_action: Report the diagnostic and do not infer any records.}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: The records file is read as one snapshot.}
        verification:
          - {method: output-schema, output_ref: records}
definitions:
  record-list:
    source_skill: example-skill
    path: record-list.schema.json
    fragment: '#'
    digest: sha256:548632510362dd9c011e79d03d19940afebd3f9b611febbaf41bf6c2d2c5bf70
    value:
      $schema: http://json-schema.org/draft-07/schema#
      type: array
      items:
        type: object
        required: [id, value]
        additionalProperties: false
        properties:
          id: {type: string, description: Stable record identifier.}
          value: {type: string, description: Record text.}
