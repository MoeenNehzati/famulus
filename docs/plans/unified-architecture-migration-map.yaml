coverage_contract:
  unit: one live path, public ID, field occurrence, caller edge, rule ID, or named family
  required_dispositions: [preserve, move, rename, derive, retire]
  path_matcher:
    root: repository root
    normalization: repository-relative POSIX paths with no dot or parent segments
    paths_semantics: a paths list is shorthand for a matcher with that include list, an empty exclude list, and allow_empty false
    include_semantics: union of matches from each include pattern using pathlib.Path.glob semantics
    exclude_semantics: subtract the union of exclude matches after includes; exclusion wins
    literal_semantics: a pattern without glob metacharacters matches only that exact normalized path
    empty_semantics: every include pattern must match a current path unless its matcher explicitly sets allow_empty true for an optional generated-artifact family
  fragment_selector:
    unit: one delimited in-file block subordinate to a parent path unit
    parent_rule: fragment paths use coverage_contract.path_matcher and each matched parent must have exactly one whole-document disposition
    precedence: resolve the parent path disposition first, then the fragment disposition refines only bytes inside its matched delimiters; the parent disposition governs the file and all bytes outside fragments
    exclusivity: fragment spans in one file must be pairwise non-overlapping and each span must match exactly one generated-artifact entry
    delimiter_rule: begin and end markers are included in the fragment and must pair exactly once by declared block ID or captured key
  validation:
    - reject every covered unit with zero dispositions
    - reject every covered unit with more than one disposition
    - reject duplicate YAML keys before interpretation
    - reject an active path not matched by this map
    - reject a proposed file without exactly one functional-predecessor entry
    - reject ambiguous gateway ownership, target-path collisions, or orphan sources
  field_enumeration:
    method: recursively enumerate every member of every object-valued properties keyword as one JSON-Pointer field occurrence
    duplicate_names: distinct pointers remain distinct covered units
    pointer_encoding: RFC 6901; escape tilde as ~0 and slash as ~1
    observed_schema_files: 34
    observed_field_occurrences: 1171
    schema_paths:
      include:
        - references/blueprint/**/*.schema.json
        - references/blueprint/schema.json
        - references/blueprint/schema-meta.json
        - references/blueprint/schema.annotated-draft.json
      exclude: []
    selector_semantics:
      schema_paths: use coverage_contract.path_matcher
      pointer_prefixes: a unit matches when its pointer equals a listed prefix or begins with that prefix plus slash
      fallback: matches only units in the selected schema paths that no non-fallback field group matches
      precedence: non-fallback groups are evaluated as an exclusive set; overlap is an error, then exactly one fallback claims each remainder
      empty_match: every non-fallback prefix and every fallback schema set must match at least one field occurrence

