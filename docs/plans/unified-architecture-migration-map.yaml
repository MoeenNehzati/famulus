certification_authority:
  contract: cooperative same-user
  status: resolved
  target_platforms: [linux, macos, windows]
  current_certificate_write_support:
    owner: src/officina/common/atomic_files.py
    implementation: POSIX directory-descriptor and no-follow primitives only
    off_posix_behavior: fail closed with AtomicWriteError
    windows_status: unsupported until the Task 3 in-place generalization and platform certificate tests pass
  certification_platform_gate:
    rule: a target platform is not v4-certified until the existing atomic_files owner provides equivalent confined atomic and no-follow certificate writes there and its platform tests pass
    windows_requirement: Task 3 must generalize atomic_files.py in place for Windows reparse-point-safe confinement, atomic replacement, durability, permissions, and post-write verification
    ownership: no parallel writer or platform provider file is authorized
  platform_contracts:
    linux: target user-scoped signing material and outputs with restrictive file modes
    macos: target user-scoped signing material and outputs with restrictive file modes
    windows: target user-scoped signing material and outputs with restrictive user ACLs, gated by the Task 3 atomic-files requirement
  os_identity:
    filesystem_owner: invoking OS user
    isolation_from_same_uid_processes: false
  writer:
    current_owner: skills/skill-audit/_rtx/_audit_certifier.py
    target_owner: skills/skill-certifier/
    multiplicity: one
    parallel_writer_or_signing_path: forbidden
    supported_request: certify a target through the certifier-owned interface, which reconstructs and validates the payload internally
    forbidden_request: caller-supplied certificate or signing payload
  signing_material:
    logical_owner: skill-certifier
    filesystem_owner: invoking OS user
    provisioner: skills/install-assistant-tools/
    verifier: skill-drift uses only the public verification key through its supported path
    permissions: user-only permissions or ACLs where the platform provides them
    security_effect: defense-in-depth only; not isolation from a malicious same-UID process
  certificate_outputs:
    logical_writer: skill-certifier
    filesystem_owner: invoking OS user
    installer_owner: skills/install-assistant-tools/
    write_contract: append-only history plus atomic no-follow current certificate and post-write verification
  installer:
    current_owner: skills/install-assistant-tools/
    target: extend the existing user-home and user-registry scoped installation to provision and verify cooperative signing material, public verification material, and output permissions
    new_service_or_elevation: false
    evidence:
      - skills/install-assistant-tools/SKILL.md declares Linux, macOS, and Windows user-scoped launcher installation
      - docs/installation.md installs PATH, config, hooks, and launchers in user homes or the Windows user registry
      - Windows launchers intentionally avoid administrator symlink privileges
  failure_behavior:
    installer: report failure if cooperative signing material or permissions cannot be provisioned and verified
    certification: issue no certificate when signing material, currentness inputs, or safe output writes are unavailable
    dispatcher: v4 dispatch remains unavailable until final cutover verification and fresh certificates
  limitation: signatures and currentness detect drift, corruption, and changes outside the cooperative writer contract, but do not defend against a malicious same-UID process that can access signing material or certificate outputs
  prohibited_artifacts: [broker, service identity, second writer, parallel signing path]

