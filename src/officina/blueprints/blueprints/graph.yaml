content:
- authorization\.py
- graph\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/inventory.yaml
  reason: Imports strict blueprint discovery and JSON value types from inventory.py.
  source: blueprints.source.inventory
  version: 1
- blueprint:
    base: repository-root
    path: src/officina/common/blueprints/repository-paths.yaml
  reason: Imports canonical equivalent-root and repository-relative path conversion
    from repository_paths.py.
  source: common.source.repository-paths
  version: 1
description: Loads versioned blueprint nodes into validated repository graphs, enforces
  topology, ownership, relationship, platform, cycle, runtime-file, and interface-authorization
  constraints, and resolves exports and runtime authority through one pure authorization
  result.
gateway:
  language: Python
  path: graph.py
id: blueprints.source.graph
interfaces:
  blueprints.source.graph.interface.python-api:
    contract:
      arguments:
        operation:
          description: Blueprint-graph operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Load one module or legacy skill graph from its root blueprint.
              value: load-skill-graph
            - description: Discover and load the complete repository blueprint graph.
              value: load-repository-graph
            - description: Resolve the repository subgraph reachable from one module.
              value: load-reachable-graph
            - description: Validate concrete schemas, content ownership, relationships,
                cycles, platform compatibility, and runtime files.
              value: validate-graph
            - description: Resolve a module export and its exact implementing source
                interface.
              value: resolve-export
            - description: Resolve one v5 caller, route, facade, terminal interface,
                diagnostic, relation, and certificate requirement result.
              value: resolve-authorization
            - description: Resolve the certified module and implementing source required
                to dispatch an export.
              value: resolve-runtime-authority
            - description: Open one graph-authorized runtime file or Python package
                without following unsafe paths.
              value: open-runtime-file
            - description: Render one legacy skill graph as an expanded declaration.
              value: expand-legacy-blueprint
        repository-root:
          description: Repository or module root from which blueprints and owned runtime
            files are resolved.
          direct_io_ref: repository-files
          required: false
          sensitivity: user-private
          type:
            access: read
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        selector:
          description: Operation-specific module ID, interface ID, version, caller
            ID, runtime path, platform, or graph value.
          required: false
          sensitivity: user-private
          type:
            description: Operation-specific Python scalar, sequence, or graph object.
            kind: string
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: module blueprints, behavioral-source sidecars, gateways, owned
            content, schemas, and authorized runtime files
          formats:
          - yaml
          - json
          - text
          - python
          - binary
          id: repository-files
          medium: repository-filesystem
          path: <repository-root>/**
          path_match: glob
          sensitivity: user-private
        writes:
        - access: write
          content: Python return value
          formats:
          - python-object
          id: return-value
          medium: local-system
          sensitivity: user-private
      execution:
        consistency:
          snapshot: Each load or validation observes the blueprint and owned-file
            state available during that call; callers should retain one loaded graph
            for a coherent dispatch decision.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use only the validated graph or resolved authority returned
          by the selected operation.
        class: success
        effects: []
        id: completed
        outputs:
        - result
      - caller_action: Correct malformed declarations, ownership overlap, unresolved
          relationships, cycles, platform incompatibility, or unsafe runtime paths
          before retrying.
        class: error
        effects: []
        id: invalid-graph
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Validated graph, export, runtime authority, opened runtime binding,
          schema diagnostics, expanded declaration, or graph-derived value.
        direct_io_ref: return-value
        empty: Lookup operations can return no value only where the Python function
          explicitly models an absent optional binding.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Operation-specific Python graph, dataclass, mapping, tuple,
            file binding, or optional value.
          kind: string
          sensitivity: user-private
      preconditions: []
    description: Loads and validates repository blueprint graphs for Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
