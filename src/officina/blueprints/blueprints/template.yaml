content:
- template\.py
dependencies: []
description: Loads bundled JSON Schemas, constructs local-reference Draft 7 validators,
  and renders or writes blueprint YAML while preserving parsed values and regenerating
  schema-owned documentation comments.
gateway:
  language: Python
  path: template.py
id: blueprints.source.template
interfaces:
  blueprints.source.template.interface.python-api:
    content:
    - template\.py
    uses_interfaces: []
    contract:
      arguments:
        inputs:
          description: Operation-specific schema, skill name, parsed values, YAML
            text, documentation mode, or explicit schema path.
          required: false
          sensitivity: user-private
          type:
            description: Operation-specific Python mapping or text value.
            kind: string
        operation:
          description: Blueprint-template operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Load one JSON Schema and its sibling schema bundle.
              value: load-schema
            - description: Construct a Draft 7 validator with bundled local references.
              value: schema-validator
            - description: Render a documented blueprint template from schema examples
                and defaults.
              value: render-template
            - description: Preserve parsed blueprint values while replacing generated
                comments.
              value: refresh-documentation
            - description: Render supplied blueprint values using one authoring schema.
              value: render-values
            - description: Validate and write a refreshed skill blueprint beneath
                the caller-selected output directory.
              value: write-regenerated-blueprint
        output-directory:
          description: Existing directory receiving a regenerated blueprint file.
          direct_io_ref: generated-blueprint
          required: false
          sensitivity: user-private
          type:
            access: write
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        repository-root:
          description: Repository containing the source blueprint and authoritative
            schema bundle.
          direct_io_ref: schema-and-blueprint
          required: false
          sensitivity: user-private
          type:
            access: read
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
      caller_warnings:
      - external-side-effect: The write operation replaces the named generated blueprint
          in the output directory after proving parsed values were preserved and schema-valid.
      direct_io:
        network: []
        reads:
        - access: read
          content: source blueprint and JSON Schema bundle
          formats:
          - yaml
          - json-schema
          id: schema-and-blueprint
          medium: repository-filesystem
          path: <repository-root>/{skills/**/blueprint.yaml,references/blueprint/*.schema.json}
          path_match: glob
          sensitivity: user-private
        writes:
        - access: write
          content: regenerated documented blueprint
          formats:
          - yaml
          id: generated-blueprint
          medium: local-filesystem
          path: <output-directory>/<skill>_blueprint.yaml
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: Python return value
          formats:
          - python-object
          - yaml
          id: return-value
          medium: local-system
          sensitivity: user-private
      execution:
        consistency:
          snapshot: Rendering uses the schema bundle and blueprint values read during
            the call; the write operation validates the rendered values before replacing
            its output.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: generated-blueprint
            kind: direct-io
          direct_io_ref: generated-blueprint
          id: write-generated-blueprint
          may_occur_in_outcomes:
          - generated
          reversibility:
            compensatable: Delete the generated copy or regenerate it from the unchanged
              source blueprint.
          value_source:
            kind: output
            output_ref: result
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: The generated file is written through the host text-file API
              rather than the shared atomic-file helper.
          concurrent_invocations:
            unsafe: Concurrent writes to the same generated destination can overwrite
              one another.
          idempotency:
            idempotent: Repeating regeneration against unchanged source values and
              schema emits the same YAML text.
          on_uncertain_completion:
            verify_then_decide: Parse and validate the destination and compare its
              values with the source blueprint before retrying.
          partial_effects_on_failure:
            possible: Host failure during write can leave a partial generated file.
          rollback_on_failure:
            unavailable: The helper does not retain any prior destination content.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Consume the loaded, validated, or rendered in-memory result.
        class: success
        effects: []
        id: rendered
        outputs:
        - result
      - caller_action: Read the returned path as the refreshed generated blueprint.
        class: success
        effects:
        - write-generated-blueprint
        id: generated
        outputs:
        - result
      - caller_action: Correct invalid YAML, JSON Schema, skill name, document mode,
          missing source blueprint, or value-preservation mismatch before retrying.
        class: error
        effects: []
        id: invalid-input
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Loaded schema, validator, rendered YAML text, or generated blueprint
          path.
        direct_io_ref: return-value
        empty: Rendered YAML is nonempty; validator and path results are always present
          on success.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Operation-specific Python schema, validator, rendered text,
            or Path.
          kind: string
          sensitivity: user-private
      preconditions: []
    description: Loads blueprint schemas and regenerates annotated blueprint YAML
      for Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
