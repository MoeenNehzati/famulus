schema_version: 6
node_type: behavioral_source
id: rutter.source.engine
version: 1
description: Binds direct Rutter definitions and owns bound validation, reduction,
  continuation, and effect recovery.
gateway:
  path: engine.py
  language: Python
content:
- engine\.py
dependencies:
- source: rutter.source.model
  version: 1
  blueprint:
    base: module-root
    path: blueprints/model.yaml
  reason: Imports immutable authoring, authority, effect, and validation values.
- source: rutter.source.storage
  version: 1
  blueprint:
    base: module-root
    path: blueprints/storage.yaml
  reason: Imports strict read, transaction, and write operations for bound Reckonings.
uses_interfaces:
- interface: rutter.source.model.interface.python-api
  version: 1
- interface: rutter.source.storage.interface.read
  version: 1
- interface: rutter.source.storage.interface.transaction
  version: 1
- interface: rutter.source.storage.interface.write
  version: 1
interfaces:
  rutter.source.engine.interface.binding:
    content:
    - engine\.py
    uses_interfaces:
    - interface: rutter.source.model.interface.python-api
      version: 1
    - interface: rutter.source.storage.interface.read
      version: 1
    - interface: rutter.source.storage.interface.transaction
      version: 1
    - interface: rutter.source.storage.interface.write
      version: 1
    version: 1
    description: Creates or opens one direct Rutter binding without granting registry
      discovery.
    contract:
      arguments:
        operation:
          description: Direct binding operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: create
              description: Validate, persist, and bind one initial Charter plus Fix.
            - value: open
              description: Strictly load and bind one existing Reckoning.
        rutter-definition:
          description: One exact direct BaseRutter subclass.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Python Rutter definition class.
            sensitivity: user-private
        reckoning-path:
          description: Absolute confined path ending with .reckoning.json; its lock
            appends .lock.
          direct_io_ref: reckoning-store
          required: true
          sensitivity: user-private
          type:
            kind: file
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read-write
            opaque_content: true
        charter:
          description: Immutable Charter required only by create.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Charter Python value.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Create atomically publishes one initial Reckoning; open
          is read-only.
      outputs:
      - id: bound-rutter
        audience: machine
        description: One exact bound direct Rutter instance.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Bound BaseRutter Python value.
          sensitivity: user-private
      outcomes:
      - id: created
        class: success
        outputs:
        - bound-rutter
        effects:
        - reckoning-create
        caller_action: Operate only the returned bound instance.
      - id: opened
        class: success
        outputs:
        - bound-rutter
        effects: []
        caller_action: Resume only from the exact persisted authority.
      - id: invalid-state
        class: error
        outputs: []
        effects: []
        caller_action: Recover a complete compatible Reckoning or correct the definition.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Create checks absence atomically and open strictly reloads complete
            bytes.
        effects:
        - id: reckoning-create
          direct_io_ref: reckoning-store
          action: create
          value_source:
            kind: argument
            argument_ref: charter
          may_occur_in_outcomes:
          - created
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: reckoning-store
          reversibility:
            irreversible: Binding retains no automatic deletion authority.
        mutation_safety:
          atomicity:
            atomic: Create publishes one complete initial Reckoning only when absent.
          concurrent_invocations:
            safe: Confined storage create is exclusive.
          idempotency:
            non_idempotent: Repeating create at the same path is rejected.
          on_uncertain_completion:
            verify_then_decide: Strictly open and compare the persisted Charter identity.
          partial_effects_on_failure:
            possible: A late durability error may occur after initial bytes are visible.
          rollback_on_failure:
            unavailable: No automatic deletion is performed.
        verification:
        - method: direct-io-state
          direct_io_ref: reckoning-store
      helpers: []
      direct_io:
        reads:
        - id: reckoning-store
          medium: local-system
          access: read
          system: rutter.source.storage
          content: Complete persisted Reckoning
          formats:
          - python-object
          sensitivity: user-private
        writes:
        - id: reckoning-store
          medium: local-system
          access: read-write
          system: rutter.source.storage
          content: Initial complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        - id: return-value
          medium: local-system
          access: write
          content: Bound direct Rutter
          formats:
          - python-object
          sensitivity: user-private
        network: []
  rutter.source.engine.interface.bound-operations:
    content:
    - engine\.py
    uses_interfaces:
    - interface: rutter.source.model.interface.python-api
      version: 1
    - interface: rutter.source.storage.interface.read
      version: 1
    - interface: rutter.source.storage.interface.transaction
      version: 1
    - interface: rutter.source.storage.interface.write
      version: 1
    version: 1
    description: Observes, validates, and advances one invoker-supplied bound Rutter
      without construction authority.
    contract:
      arguments:
        operation:
          description: Bound Rutter operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: get-instruction
              description: Return one current string instruction or structured status.
            - value: validate
              description: Purely validate one already-produced finite input.
            - value: advance
              description: Reduce one input and optionally continue callable states.
        binding:
          description: One invoker-provided bound BaseRutter instance.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Bound direct Rutter Python value.
            sensitivity: user-private
        input:
          description: Exact revision, outcome, and evidence envelope for validate
            or advance.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Finite JSON-compatible Python mapping.
            sensitivity: user-private
        continue:
          description: Whether advance settles authorized callable states.
          required: false
          default: true
          sensitivity: public
          type:
            kind: boolean
        dry-run:
          description: Whether advance previews one supplied edge without mutation.
          required: false
          default: false
          sensitivity: public
          type:
            kind: boolean
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Advance may invoke a durably planned callable effect
          that cannot be rolled back.
      outputs:
      - id: result
        audience: machine
        description: Current instruction or status, ValidationReport, or successor
          state ID.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Operation-specific public bound-Rutter result.
          sensitivity: user-private
      outcomes:
      - id: observed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Classify the public instruction or status without inferring
          a transition.
      - id: validated
        class: success
        outputs:
        - result
        effects: []
        caller_action: Advance only when the returned report is valid.
      - id: previewed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Inspect the dry-run successor without treating it as persisted
          authority.
      - id: advanced
        class: success
        outputs:
        - result
        effects:
        - reckoning-update
        caller_action: Classify the successor and public Fix before another operation.
      - id: faulted
        class: error
        outputs:
        - result
        effects:
        - reckoning-update
        caller_action: Stop and report public diagnostics.
      - id: invalid-input
        class: refusal
        outputs: []
        effects: []
        caller_action: Correct only from the validation report and current public
          authority.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Every Fix-dependent operation locks and reloads the complete authoritative
            Reckoning.
        effects:
        - id: reckoning-update
          direct_io_ref: reckoning-store
          action: update
          value_source:
            kind: direct-io
            direct_io_ref: reckoning-store
          may_occur_in_outcomes:
          - advanced
          - faulted
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: reckoning-store
          reversibility:
            irreversible: The engine retains no predecessor and cannot roll back external
              work.
        mutation_safety:
          atomicity:
            per_effect_only: Pure chains publish one replacement; effectful calls
              retain planned and completed phases.
          concurrent_invocations:
            safe: The storage owner serializes cooperating operations per Reckoning.
          idempotency:
            non_idempotent: Accepted evidence advances revision and callable effects
              may change external state.
          on_uncertain_completion:
            verify_then_decide: Inspect the public Fix and follow only displayed recovery
              authority.
          partial_effects_on_failure:
            possible: External work may complete before post-effect validation or
              persistence.
          rollback_on_failure:
            unavailable: Reckoning replacement does not roll back external effects.
        verification:
        - method: direct-io-state
          direct_io_ref: reckoning-store
      helpers: []
      direct_io:
        reads:
        - id: bound-rutter
          medium: local-system
          access: execute
          content: Invoker-provided bound Rutter public operations
          formats:
          - python-object
          sensitivity: user-private
        - id: reckoning-store
          medium: local-system
          access: read
          system: rutter.source.storage
          content: Authoritative complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        writes:
        - id: reckoning-store
          medium: local-system
          access: read-write
          system: rutter.source.storage
          content: Authoritative complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        - id: return-value
          medium: local-system
          access: write
          content: Public bound-Rutter operation result
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
