schema_version: 6
node_type: behavioral_source
id: rutter.source.engine
version: 3
description: Owns public Voyage transactions, entrance-correlated flat-response validation,
  contextual child binding, operational sequencing, effect recovery, and durable
  publication around pure reduction and authored evaluation.
gateway:
  path: engine.py
  language: Python
content:
- engine\.py
dependencies:
- source: rutter.source.authoring
  version: 1
  blueprint:
    base: module-root
    path: blueprints/authoring.yaml
  reason: Imports direct Rutter definitions, concrete evolutions, typed contexts,
    and contextual TransitionHooks.
- source: rutter.source.evaluation
  version: 1
  blueprint:
    base: module-root
    path: blueprints/evaluation.yaml
  reason: Invokes author callbacks only through the controlled evaluation boundary.
- source: rutter.source.history
  version: 1
  blueprint:
    base: module-root
    path: blueprints/history.yaml
  reason: Imports durable records, aggregate authority, and history projections.
- source: rutter.source.reducer
  version: 1
  blueprint:
    base: module-root
    path: blueprints/reducer.yaml
  reason: Applies pure active-tree and child-voyage transformations.
- source: rutter.source.storage
  version: 2
  blueprint:
    base: module-root
    path: blueprints/storage.yaml
  reason: Imports strict read, transaction, and write operations for bound Reckonings.
- source: rutter.source.values
  version: 1
  blueprint:
    base: module-root
    path: blueprints/values.yaml
  reason: Imports public operating projections, results, validation values, and errors.
uses_interfaces:
- interface: rutter.source.authoring.interface.python-api
  version: 1
- interface: rutter.source.evaluation.interface.python-api
  version: 1
- interface: rutter.source.history.interface.python-api
  version: 1
- interface: rutter.source.reducer.interface.python-api
  version: 1
- interface: rutter.source.storage.interface.read
  version: 2
- interface: rutter.source.storage.interface.transaction
  version: 2
- interface: rutter.source.storage.interface.write
  version: 2
- interface: rutter.source.values.interface.python-api
  version: 1
interfaces:
  rutter.source.engine.interface.binding:
    content:
    - engine\.py
    uses_interfaces:
    - interface: rutter.source.authoring.interface.python-api
      version: 1
    - interface: rutter.source.evaluation.interface.python-api
      version: 1
    - interface: rutter.source.history.interface.python-api
      version: 1
    - interface: rutter.source.reducer.interface.python-api
      version: 1
    - interface: rutter.source.storage.interface.read
      version: 2
    - interface: rutter.source.storage.interface.transaction
      version: 2
    - interface: rutter.source.storage.interface.write
      version: 2
    - interface: rutter.source.values.interface.python-api
      version: 1
    version: 3
    description: Creates or opens one direct Rutter binding, snapshots its authored
      graph, and exposes the definition on the resulting Voyage without granting
      registry discovery.
    contract:
      arguments:
        operation:
          description: Direct binding operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: create
              description: Validate, persist, and bind one initial Charter at its start-evolution entrance.
            - value: open
              description: Strictly load and bind one existing Reckoning.
        rutter-definition:
          description: One exact stateless Rutter definition source; a direct instance
            is preferred and legacy no-argument classes or factories remain compatible.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Python Rutter instance or compatible no-argument definition
              constructor.
            sensitivity: user-private
        reckoning-path:
          description: Absolute confined path ending with .reckoning.json; its lock
            appends .lock.
          direct_io_ref: reckoning-store
          required: true
          sensitivity: user-private
          type:
            kind: file
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read-write
            opaque_content: true
        charter:
          description: Immutable Charter required only by create.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Charter Python value.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Create atomically publishes one initial Reckoning; open
          is read-only.
      outputs:
      - id: bound-rutter
        audience: machine
        description: One exact public self-describing Voyage instance that owns execution
          and exposes its bound Rutter read-only.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Self-describing Voyage Python value with a read-only Rutter
            definition property.
          sensitivity: user-private
      outcomes:
      - id: created
        class: success
        outputs:
        - bound-rutter
        effects:
        - reckoning-create
        caller_action: Operate only the returned bound instance.
      - id: opened
        class: success
        outputs:
        - bound-rutter
        effects: []
        caller_action: Resume only from the exact persisted authority.
      - id: invalid-state
        class: error
        outputs: []
        effects: []
        caller_action: Recover a complete compatible Reckoning or correct the definition.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Create checks absence atomically and open strictly reloads complete
            bytes.
        effects:
        - id: reckoning-create
          direct_io_ref: reckoning-store
          action: create
          value_source:
            kind: argument
            argument_ref: charter
          may_occur_in_outcomes:
          - created
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: reckoning-store
          reversibility:
            irreversible: Binding retains no automatic deletion authority.
        mutation_safety:
          atomicity:
            atomic: Create publishes one complete initial Reckoning only when absent.
          concurrent_invocations:
            safe: Confined storage create is exclusive.
          idempotency:
            non_idempotent: Repeating create at the same path is rejected.
          on_uncertain_completion:
            verify_then_decide: Strictly open and compare the persisted Charter identity.
          partial_effects_on_failure:
            possible: A late durability error may occur after initial bytes are visible.
          rollback_on_failure:
            unavailable: No automatic deletion is performed.
        verification:
        - method: direct-io-state
          direct_io_ref: reckoning-store
      helpers: []
      direct_io:
        reads:
        - id: reckoning-store
          medium: local-system
          access: read
          system: rutter.source.storage
          content: Complete persisted Reckoning
          formats:
          - python-object
          sensitivity: user-private
        writes:
        - id: reckoning-store
          medium: local-system
          access: read-write
          system: rutter.source.storage
          content: Initial complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        - id: return-value
          medium: local-system
          access: write
          content: Public self-describing Voyage
          formats:
          - python-object
          sensitivity: user-private
        network: []
  rutter.source.engine.interface.bound-operations:
    content:
    - engine\.py
    uses_interfaces:
    - interface: rutter.source.authoring.interface.python-api
      version: 1
    - interface: rutter.source.evaluation.interface.python-api
      version: 1
    - interface: rutter.source.history.interface.python-api
      version: 1
    - interface: rutter.source.reducer.interface.python-api
      version: 1
    - interface: rutter.source.storage.interface.read
      version: 2
    - interface: rutter.source.storage.interface.transaction
      version: 2
    - interface: rutter.source.storage.interface.write
      version: 2
    - interface: rutter.source.values.interface.python-api
      version: 1
    version: 6
    description: Exposes the self-describing public Voyage status, entrance-correlated
      validation, and advancement operations used by thin Compass guidance and
      the inquisitive-inventory CLI without construction authority.
    contract:
      arguments:
        operation:
          description: Voyage operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: help
              description: Describe the Compass-facing methods, bound signatures,
                and public docstrings.
            - value: get-status
              description: Read one coherent VoyageStatus projection in one transaction.
            - value: validate
              description: Purely validate the operation-specific flat LLMStep response
                or MachineResult in entrance, formatting, schema, static outcome-map,
                and contextual-assessment order.
            - value: advance
              description: Advance from the active leaf and optionally settle automatic
                machine, child, terminal, or continuation work.
        binding:
          description: One invoker-provided Voyage instance.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Voyage Python value.
            sensitivity: user-private
        value:
          description: Operation-specific value comprising a complete flat finite
            JSON mapping for LLMStep validate or advance, or a MachineResult for
            MachineStep validate or advance. The LLMStep form contains an outcome
            but no public revision or evidence wrapper.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Flat finite JSON-compatible Python mapping or immutable
              MachineResult Python value.
            sensitivity: user-private
        responding-to:
          description: Exact Message evolution_entry_id that authorizes an LLMStep
            response; omit for machine or continuation work.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Stable evolution entrance token passed separately from the
              flat response.
            sensitivity: user-private
        continue:
          description: Whether advance settles automatic Python and nested work.
          required: false
          default: true
          sensitivity: public
          type:
            kind: boolean
        dry-run:
          description: Whether advance previews only the immediate parent-transition
            destination without mutation.
          required: false
          default: false
          sensitivity: public
          type:
            kind: boolean
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Advance with continuation may run automatic external
          work that cannot be rolled back.
      outputs:
      - id: result
        audience: machine
        description: Help text, VoyageStatus with explicit terminal_result and validated
          FaultSummary, ValidationReport, or immutable EvolutionView.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Operation-specific help text, validated VoyageStatus,
            ValidationReport, or EvolutionView.
          sensitivity: user-private
      outcomes:
      - id: described
        class: success
        outputs:
        - result
        effects: []
        caller_action: Follow only the returned Compass-facing method signatures
          and docstrings.
      - id: observed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use the one coherent VoyageStatus without inferring another read.
      - id: validated
        class: success
        outputs:
        - result
        effects: []
        caller_action: Call advance with the same value only when the returned report
          is valid; preserve responding-to for an LLMStep and omit it for a MachineStep.
      - id: previewed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Inspect the immediate parent-transition preview without treating
          it as entered or as work authorization.
      - id: ready
        class: success
        outputs:
        - result
        effects:
        - reckoning-update
        caller_action: Read the returned EvolutionView or a fresh VoyageStatus.
      - id: terminal
        class: success
        outputs:
        - result
        effects:
        - reckoning-update
        caller_action: Report VoyageStatus.terminal_result and stop.
      - id: faulted
        class: error
        outputs:
        - result
        effects:
        - reckoning-update
        caller_action: Stop and report the validated public FaultSummary.
      - id: uncertain
        class: error
        outputs:
        - result
        effects:
        - reckoning-update
        caller_action: Stop for manual reconciliation.
      - id: response-required
        class: refusal
        outputs:
        - result
        effects: []
        caller_action: 'On RutterValidationError: LLMStep response is required, inspect
          VoyageStatus from get_status, and perform the LLM instruction;
          this boundary does not return a ValidationReport.'
      - id: invalid-input
        class: refusal
        outputs:
        - result
        effects: []
        caller_action: Correct only from the ValidationReport; the active node and
          history remain unchanged.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Every operation resolves the deepest active evolution; advance revalidates
            accepted work under the bound Rutter's authority and exact Message entrance.
        effects:
        - id: reckoning-update
          direct_io_ref: reckoning-store
          action: update
          value_source:
            kind: direct-io
            direct_io_ref: reckoning-store
          may_occur_in_outcomes:
          - ready
          - terminal
          - faulted
          - uncertain
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: reckoning-store
          reversibility:
            irreversible: The engine retains no predecessor and cannot roll back external
              work.
        mutation_safety:
          atomicity:
            per_effect_only: Accepted traversal publishes complete durable updates;
              external work may require separate durable recovery evidence.
          concurrent_invocations:
            safe: The storage owner serializes cooperating operations per Reckoning.
          idempotency:
            non_idempotent: Accepted responses advance the internal Reckoning revision
              and automatic work may change an external system.
          on_uncertain_completion:
            verify_then_decide: Read the public VoyageStatus condition and stop for
              manual reconciliation.
          partial_effects_on_failure:
            possible: External work may complete before post-effect validation or
              persistence.
          rollback_on_failure:
            unavailable: Reckoning replacement does not roll back external effects.
        verification:
        - method: direct-io-state
          direct_io_ref: reckoning-store
      helpers: []
      direct_io:
        reads:
        - id: bound-rutter
          medium: local-system
          access: execute
          content: Invoker-provided self-describing Voyage public operations
          formats:
          - python-object
          sensitivity: user-private
        - id: reckoning-store
          medium: local-system
          access: read
          system: rutter.source.storage
          content: Authoritative complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        writes:
        - id: reckoning-store
          medium: local-system
          access: read-write
          system: rutter.source.storage
          content: Authoritative complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        - id: return-value
          medium: local-system
          access: write
          content: Public Voyage help text or operation result
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
