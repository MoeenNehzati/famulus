schema_version: 6
node_type: behavioral_source
id: rutter.source.hooks
version: 1
description: Defines immutable edge matchers and CaseMakers for record-derived transition hooks.
gateway:
  path: hooks.py
  language: Python
content:
- hooks\.py
dependencies:
- source: rutter.source.model
  version: 1
  blueprint:
    base: module-root
    path: blueprints/model.yaml
  reason: Imports immutable edge contexts, finite Charter values, and Rutter definitions.
uses_interfaces:
- interface: rutter.source.model.interface.python-api
  version: 1
interfaces:
  rutter.source.hooks.interface.python-api:
    content:
    - hooks\.py
    uses_interfaces:
    - interface: rutter.source.model.interface.python-api
      version: 1
    version: 1
    description: Constructs pure edge matchers and immutable CaseMaker definitions.
    contract:
      arguments:
        operation:
          description: Immutable hook-definition operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: edge-match
              description: Construct one wildcard or exact transition-edge matcher.
            - value: case-maker
              description: Bind one matcher, child definition, and Charter selector.
        value:
          description: Operation-specific immutable Python arguments.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Edge fields or CaseMaker definition values.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: One validated immutable matcher or CaseMaker value.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Immutable Python hook-definition value.
          sensitivity: user-private
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use the immutable definition without persisting hook control state.
      - id: invalid-definition
        class: error
        outputs: []
        effects: []
        caller_action: Correct malformed identity, matcher, child, or callback data.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          snapshot: Inputs are copied into immutable definitions during construction.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads: []
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Immutable Python hook-definition value
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
