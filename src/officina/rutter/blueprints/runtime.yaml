schema_version: 6
node_type: behavioral_source
id: rutter.source.runtime
version: 3
description: Resolves explicit Rutter definition sources, snapshots their authored
  graphs, confines Reckoning paths, and delegates durable execution ownership to
  Voyage.
gateway:
  path: runtime.py
  language: Python
content:
- runtime\.py
dependencies:
- source: rutter.source.authoring
  version: 1
  blueprint:
    base: module-root
    path: blueprints/authoring.yaml
  reason: Imports direct or legacy Rutter definitions, evolution types, and contextual
    TransitionHooks for binding.
- source: rutter.source.engine
  version: 3
  blueprint:
    base: module-root
    path: blueprints/engine.yaml
  reason: Imports the concrete Voyage, immutable bound-definition snapshot, and initial authority constructor.
- source: rutter.source.storage
  version: 2
  blueprint:
    base: module-root
    path: blueprints/storage.yaml
  reason: Confines caller paths beneath the Reckoning root.
- source: rutter.source.values
  version: 1
  blueprint:
    base: module-root
    path: blueprints/values.yaml
  reason: Imports Charter, finite JSON types, and definition and state errors.
uses_interfaces:
- interface: rutter.source.authoring.interface.python-api
  version: 1
- interface: rutter.source.engine.interface.binding
  version: 3
- interface: rutter.source.values.interface.python-api
  version: 1
interfaces:
  rutter.source.runtime.interface.binding:
    content:
    - runtime\.py
    uses_interfaces:
    - interface: rutter.source.authoring.interface.python-api
      version: 1
    - interface: rutter.source.engine.interface.binding
      version: 3
    - interface: rutter.source.values.interface.python-api
      version: 1
    version: 3
    description: Creates a named Voyage bound to one snapshotted Rutter definition
      or opens one from persisted Charter identity.
    contract:
      arguments:
        operation:
          description: Registry lifecycle operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: registry-create
              description: Create one named voyage from immutable Charter data.
            - value: registry-open
              description: Open one existing voyage from persisted identity.
        registry:
          description: Explicit name-to-Rutter-definition-source mapping and Reckoning
            root; direct instances are preferred while no-argument classes and factories
            remain compatible.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Validated RutterRegistry containing definition sources.
            sensitivity: user-private
        reckoning-path:
          description: Relative descendant ending with .reckoning.json; its lock appends
            .lock.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Relative pathlib.Path value.
            sensitivity: user-private
        charter-data:
          description: Finite JSON object used only when creating a voyage.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Python mapping of immutable undertaking data.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Creation persists one complete initial Reckoning; opening
          is read-only and never advances it.
      outputs:
      - id: result
        audience: machine
        description: One exact public Voyage instance owning execution and exposing
          its bound Rutter through a read-only property.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Self-describing Voyage instance exposing its Rutter, help,
            and advertised public methods.
          sensitivity: user-private
      outcomes:
      - id: created
        class: success
        outputs:
        - result
        effects:
        - reckoning-create
        caller_action: Operate only the returned bound instance.
      - id: opened
        class: success
        outputs:
        - result
        effects: []
        caller_action: Resume only from the exact persisted public authority.
      - id: unknown-rutter
        class: refusal
        outputs: []
        effects: []
        caller_action: Select an explicitly registered name or persisted identity.
      - id: invalid-state
        class: error
        outputs: []
        effects: []
        caller_action: Recover a compatible complete Reckoning instead of reconstructing
          progress.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Registration identity is frozen and every open strictly reads one
            complete Reckoning.
        effects:
        - id: reckoning-create
          direct_io_ref: reckoning-store
          action: create
          value_source:
            kind: argument
            argument_ref: charter-data
          may_occur_in_outcomes:
          - created
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: reckoning-store
          reversibility:
            irreversible: Runtime does not delete a created voyage automatically.
        mutation_safety:
          atomicity:
            atomic: Creation publishes one complete initial Reckoning only when absent.
          concurrent_invocations:
            safe: Confined storage create is exclusive and later operations use the
              per-Reckoning lock.
          idempotency:
            non_idempotent: Repeating create at the same path is rejected.
          on_uncertain_completion:
            verify_then_decide: Open the requested path and compare its persisted
              Charter identity.
          partial_effects_on_failure:
            possible: A late durability failure may occur after the complete creation
              is visible.
          rollback_on_failure:
            unavailable: Runtime retains no automatic deletion authority.
        verification:
        - method: direct-io-state
          direct_io_ref: reckoning-store
      helpers: []
      direct_io:
        reads:
        - id: reckoning-store
          medium: local-system
          access: read
          system: rutter.source.storage
          content: Persisted Rutter identity and complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        writes:
        - id: reckoning-store
          medium: local-system
          access: read-write
          system: rutter.source.storage
          content: Initial complete Reckoning
          formats:
          - python-object
          sensitivity: user-private
        - id: return-value
          medium: local-system
          access: write
          content: Public Voyage instance
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
