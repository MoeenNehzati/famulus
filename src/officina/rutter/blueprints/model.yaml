schema_version: 6
node_type: behavioral_source
id: rutter.source.model
version: 2
description: Provides the public facade over directly constructible Rutter definitions,
  explicit value boundaries, history, and operating projections.
gateway:
  path: model.py
  language: Python
content:
- model\.py
dependencies:
- source: rutter.source.authoring
  version: 1
  blueprint:
    base: module-root
    path: blueprints/authoring.yaml
  reason: Re-exports immutable Rutter authoring definitions and transition hooks.
- source: rutter.source.history
  version: 1
  blueprint:
    base: module-root
    path: blueprints/history.yaml
  reason: Re-exports durable records, aggregate authority, and history projections.
- source: rutter.source.values
  version: 1
  blueprint:
    base: module-root
    path: blueprints/values.yaml
  reason: Re-exports immutable operating values, results, and errors.
uses_interfaces:
- interface: rutter.source.authoring.interface.python-api
  version: 1
- interface: rutter.source.history.interface.python-api
  version: 1
- interface: rutter.source.values.interface.python-api
  version: 1
interfaces:
  rutter.source.model.interface.python-api:
    content:
    - model\.py
    uses_interfaces:
    - interface: rutter.source.authoring.interface.python-api
      version: 1
    - interface: rutter.source.history.interface.python-api
      version: 1
    - interface: rutter.source.values.interface.python-api
      version: 1
    version: 2
    description: Constructs direct Rutter definitions, explicitly routed evolutions,
      typed contexts, validated operating values, history, and persistence authority
      through one thin facade.
    contract:
      arguments:
        operation:
          description: Immutable model operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: charter
              description: Construct and freeze one undertaking Charter.
            - value: evolution
              description: Construct one LLMStep, MachineStep, contextual SubRutter,
                or explicitly fixed or contextual Terminal definition.
            - value: transition-hook
              description: Construct one immutable TransitionMatch or TransitionHook
                with contextual Rutter and Charter constructors.
            - value: history
              description: Construct one accepted-work record or immutable history view.
            - value: reckoning
              description: Construct one recursive version-3 authority rooted at an entered evolution.
            - value: instruction
              description: Construct one direct-property Message, MachineInstruction,
                result, EvolutionView, VoyageStatus, or validated FaultSummary.
            - value: validation
              description: Construct a pure validation report and its issues.
        value:
          description: Operation-specific finite Python values.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Python arguments accepted by the selected immutable value.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: One validated immutable Rutter model value.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Immutable Python Rutter value.
          sensitivity: user-private
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use the immutable value without inferring transition authority.
      - id: invalid-definition
        class: error
        outputs: []
        effects: []
        caller_action: Correct malformed identity, evolution, JSON, or validation data.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          snapshot: Inputs are copied into immutable finite values during construction.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads: []
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Immutable Python Rutter value
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
