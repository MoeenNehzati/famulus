schema_version: 6
node_type: behavioral_source
id: rutter.source.model
version: 1
description: Defines immutable authoring and persisted values for direct durable Rutters.
gateway:
  path: model.py
  language: Python
content:
- model\.py
dependencies: []
uses_interfaces: []
interfaces:
  rutter.source.model.interface.python-api:
    version: 1
    description: Constructs Charter, Fix, Reckoning, state, effect-policy, and validation values.
    contract:
      arguments:
        operation:
          description: Immutable model operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: charter
              description: Construct and freeze one undertaking Charter.
            - value: fix
              description: Construct one machine coordinate and recovery record.
            - value: reckoning
              description: Pair one Charter with one Fix under the current storage version.
            - value: state
              description: Construct a nonterminal or terminal authored state.
            - value: validation
              description: Construct a pure validation report and its issues.
        value:
          description: Operation-specific finite Python values.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Python arguments accepted by the selected immutable value.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: One validated immutable Rutter model value.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty on success.
        type:
          kind: string
          description: Immutable Python Rutter value.
          sensitivity: user-private
      outcomes:
      - id: completed
        class: success
        outputs: [result]
        effects: []
        caller_action: Use the immutable value without inferring transition authority.
      - id: invalid-definition
        class: error
        outputs: []
        effects: []
        caller_action: Correct malformed identity, state, JSON, or validation data.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          snapshot: Inputs are copied into immutable finite values during construction.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads: []
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Immutable Python Rutter value
          formats: [python-object]
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
