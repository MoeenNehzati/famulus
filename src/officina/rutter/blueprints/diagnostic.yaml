schema_version: 6
node_type: behavioral_source
id: rutter.source.diagnostic
version: 4
description: Defines exact attributed diagnostic values, ordinary diagnostic child Rutters, and reusable TransitionHook constructors.
gateway:
  path: diagnostic.py
  language: Python
content:
- diagnostic\.py
dependencies:
- source: rutter.source.authoring
  version: 1
  blueprint:
    base: module-root
    path: blueprints/authoring.yaml
  reason: Imports Rutter evolutions, contexts, TransitionHook, and hook match constructors.
- source: rutter.source.values
  version: 1
  blueprint:
    base: module-root
    path: blueprints/values.yaml
  reason: Imports immutable results, validation reports, and definition errors.
uses_interfaces:
- interface: rutter.source.authoring.interface.python-api
  version: 1
- interface: rutter.source.values.interface.python-api
  version: 1
interfaces:
  rutter.source.diagnostic.interface.python-api:
    content:
    - diagnostic\.py
    uses_interfaces:
    - interface: rutter.source.authoring.interface.python-api
      version: 1
    - interface: rutter.source.values.interface.python-api
      version: 1
    version: 4
    description: Constructs exact attributed diagnostic cases, ordinary diagnostic child Rutters, and reusable TransitionHooks.
    contract:
      arguments:
        operation:
          description: Diagnostic value, child definition, or TransitionHook construction to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: question-case
              description: Construct one exact fresh-question contract.
            - value: diagnosis-case
              description: Construct one exact supplied-answer diagnosis contract.
            - value: diagnosis-detail
              description: Construct one exact five-way attributed detail with a conditional structured gold challenge.
            - value: diagnose-answer
              description: Use the ordinary supplied-answer diagnostic child Rutter.
            - value: ask-and-diagnose
              description: Use the ordinary fresh-question diagnostic child Rutter.
            - value: transition-hook
              description: Construct one reusable diagnostic or finite-sequence TransitionHook.
        value:
          description: Operation-specific immutable Python arguments.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Exact diagnostic value or constructor arguments.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: One validated immutable diagnostic value, ordinary Rutter definition, or TransitionHook.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Immutable Python diagnostic or hook-definition value.
          sensitivity: user-private
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use the ordinary value or definition without adding diagnostic control state to the core runtime.
      - id: invalid-definition
        class: error
        outputs: []
        effects: []
        caller_action: Correct malformed case data, evaluator, matcher, child, or callback arguments.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          snapshot: Inputs are copied into immutable values and ordinary versioned definitions.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads: []
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Immutable Python diagnostic or hook-definition value
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
