schema_version: 6
node_type: behavioral_source
id: rutter.source.authoring
version: 1
description: Defines directly constructible stateless Rutter definitions, immutable
  evolutions, typed author contexts, and contextual child constructors.
gateway:
  path: authoring.py
  language: Python
content:
- authoring\.py
dependencies:
- source: rutter.source.history
  version: 1
  blueprint:
    base: module-root
    path: blueprints/history.yaml
  reason: Imports immutable history and transition projections used by author contexts.
- source: rutter.source.values
  version: 2
  blueprint:
    base: module-root
    path: blueprints/values.yaml
  reason: Imports Charters, results, validation values, and definition errors.
uses_interfaces:
- interface: rutter.source.history.interface.python-api
  version: 1
- interface: rutter.source.values.interface.python-api
  version: 2
interfaces:
  rutter.source.authoring.interface.python-api:
    version: 1
    content:
    - authoring\.py
    uses_interfaces:
    - interface: rutter.source.history.interface.python-api
      version: 1
    - interface: rutter.source.values.interface.python-api
      version: 2
    description: Constructs snapshot-backed Rutter definitions, explicitly routed
      evolutions, typed contexts, and transition hooks with named Rutter and Charter
      constructors.
    contract:
      arguments:
        operation:
          description: Selected Rutter, evolution, context, hook or transition-matcher constructor/function.
          required: true
          sensitivity: public
          type:
            kind: string
        inputs:
          description: Python constructor arguments, named routing/result modes and callback references.
            Constructors retain callable references; Terminal checks its result-constructor
            signature without invoking it.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Python arguments for the selected API call.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: Rutter definition, frozen evolution/context/hook value or transition matcher.
          Rutter attributes remain mutable; binding snapshots the authored graph.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Empty mappings are valid for empty_data; constructors return one definition or value.
        type:
          kind: string
          description: Typed Python API return value or finite JSON projection.
          sensitivity: user-private
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use the returned value according to the selected Python API operation.
      - id: invalid-input
        class: error
        outputs: []
        effects: []
        caller_action: Correct invalid identifiers, callback signatures, routing/result modes or
          declaration data reported by RutterDefinitionError.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          snapshot: Mappings and hook collections are snapshotted; frozen dataclasses retain callback
            references without executing them.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads: []
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Rutter definition, frozen evolution/context/hook value or transition matcher.
            Rutter attributes remain mutable; binding snapshots the authored graph.
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
