schema_version: 6
node_type: behavioral_source
id: rutter.source.history
version: 1
description: Owns durable Rutter records, aggregate invariants, v3 record projections,
  and immutable history queries.
gateway:
  path: history.py
  language: Python
content:
- history\.py
dependencies:
- source: rutter.source.values
  version: 2
  blueprint:
    base: module-root
    path: blueprints/values.yaml
  reason: Imports immutable JSON values, results, messages, and state errors.
uses_interfaces:
- interface: rutter.source.values.interface.python-api
  version: 2
interfaces:
  rutter.source.history.interface.python-api:
    version: 1
    content:
    - history\.py
    uses_interfaces:
    - interface: rutter.source.values.interface.python-api
      version: 2
    description: Constructs durable records, Reckonings, and immutable history projections.
    contract:
      arguments:
        operation:
          description: Selected record/Reckoning constructor, supported JSON conversion or immutable
            history query.
          required: true
          sensitivity: public
          type:
            kind: string
        inputs:
          description: Typed records, finite JSON, aggregate identities and optional evolution/hook
            filters. Public Reckoning JSON conversions exclude private recovery/fault authority.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Python arguments for the selected API call.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: Record, Reckoning, finite JSON projection, immutable history tuple/view or
          optional absent result; no files are read or written.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Empty tuples and None are valid for optional queries; required lookups raise when
          absent.
        type:
          kind: string
          description: Typed Python API return value or finite JSON projection.
          sensitivity: user-private
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use the returned value according to the selected Python API operation.
      - id: invalid-input
        class: error
        outputs: []
        effects: []
        caller_action: Correct malformed state reported by RutterStateError or invalid filters/required
          missing records reported by RutterDefinitionError. Use the storage codec for private recovery
          authority.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          snapshot: Queries observe supplied immutable records; construction and decoding check
            aggregate identities and history invariants.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads: []
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Record, Reckoning, finite JSON projection, immutable history tuple/view or optional
            absent result; no files are read or written.
          formats:
          - python-object
          sensitivity: user-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
