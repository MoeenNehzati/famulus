schema_version: 6
node_type: behavioral_source
id: rutter.source.dispenser
version: 5
description: Declares Voyage initialization modes, creates uniquely identified durable
  runs with indexed Voyages, exposes uniform ID-scoped operations, and releases one
  Voyage or run with nonterminal deletion requiring an explicit force.
gateway:
  path: dispenser.py
  language: Python
content:
- dispenser\.py
dependencies:
- source: rutter.source.engine
  version: 3
  blueprint:
    base: module-root
    path: blueprints/engine.yaml
  reason: Delegates status, validation, and advancement to authorized Voyages.
- source: rutter.source.values
  version: 1
  blueprint:
    base: module-root
    path: blueprints/values.yaml
  reason: Projects public status and validation values without exposing callbacks.
uses_interfaces:
- interface: rutter.source.engine.interface.bound-operations
  version: 6
- interface: rutter.source.values.interface.python-api
  version: 1
interfaces:
  rutter.source.dispenser.interface.python-api:
    content:
    - dispenser\.py
    uses_interfaces:
    - interface: rutter.source.engine.interface.bound-operations
      version: 6
    - interface: rutter.source.values.interface.python-api
      version: 1
    version: 5
    description: Construct one VoyageDispenser from self-describing modes, unique
      run initialization, optionally prefix-filtered ID enumeration, Voyage resolution,
      and Voyage-or-run release callbacks.
    contract:
      arguments:
        operation:
          description: Exact dispenser operation.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: help
              description: Explain mode discovery, one-time initialization, and
                one-agent-per-Voyage ownership.
            - value: get-modes
              description: Return every supported initialization mode together with its explanation and required named arguments.
            - value: initiate-voyages
              description: Generate a fresh run ID and create indexed durable Voyages
                under it in the selected mode; exposed as the initiate CLI command.
            - value: get-voyage-ids
              description: Return every currently authorized Voyage ID, or only IDs under a supplied run prefix.
            - value: get-status
              description: Read one selected Voyage's public status.
            - value: validate
              description: Validate one selected Voyage response without mutation.
            - value: advance
              description: Advance one selected Voyage without affecting another.
            - value: release
              description: Remove one selected Voyage or every Voyage in one run after terminal results have been read, or remove earlier only when explicitly forced.
            - value: cli
              description: Map modes, initiate, list, status, validate, advance,
                and release commands to finite JSON.
        mode:
          description: One exact mode returned by get-modes and consumed only by
            initiate; omission selects the first declared mode.
          required: false
          sensitivity: public
          type:
            kind: string
            sensitivity: public
        mode-arguments:
          description: Named string arguments required by the selected mode; unknown, missing, or extra names are rejected before initialization.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        run-prefix:
          description: Optional safe label placed before the generated run ID.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        run-id:
          description: Fresh identifier generated for one initialization, optionally nested under the supplied run prefix.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        voyage-id:
          description: Indexed ID under one run ID, assigned to one agent and required for every operation by that agent.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        force:
          description: Explicitly permit release before the selected Voyage has a terminal result.
          required: false
          sensitivity: public
          type:
            kind: boolean
            sensitivity: public
        value:
          description: Optional response and entrance correlation arguments.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Advance may execute effects owned by the selected Voyage.
      - external-side-effect: Release permanently removes the selected Voyage's working directory; nonterminal release requires explicit force.
      outputs:
      - id: result
        audience: both
        description: Self-describing mode configurations, initialized IDs, or one public Voyage operation result.
        direct_io_ref: result
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: derived-private
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects:
        - voyage-operation
        caller_action: Continue only from the returned public result.
      - id: unknown-voyage
        class: error
        outputs: []
        effects: []
        caller_action: Refresh the authorized Voyage IDs and do not retry an absent ID.
      - id: not-initialized
        class: error
        outputs: []
        effects: []
        caller_action: Inspect get-modes, choose one mode, and invoke initiate.
      - id: invalid-mode-arguments
        class: error
        outputs: []
        effects: []
        caller_action: Supply exactly the arguments advertised for the selected mode.
      - id: not-terminal
        class: error
        outputs: []
        effects: []
        caller_action: Read or advance the Voyage to a terminal result before releasing it, or explicitly force release to abandon it.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Every initiation generates a fresh run ID and persists sequentially indexed
            Voyages under it; list may filter the optional label, later operations resolve
            durable Voyage IDs globally, and release accepts one Voyage ID or run ID.
        effects:
        - id: voyage-operation
          direct_io_ref: voyage
          action: execute
          value_source:
            kind: argument
            argument_ref: voyage-id
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: output
            output_ref: result
          reversibility:
            irreversible: The dispenser cannot roll back effects owned by a Voyage.
        mutation_safety:
          atomicity:
            per_effect_only: Each selected Voyage owns its transaction boundary.
          concurrent_invocations:
            safe: Agents may operate distinct Voyages concurrently; exactly one agent
              owns each Voyage for the duration of its run.
          idempotency:
            non_idempotent: Advance may mutate durable state or execute external effects.
          on_uncertain_completion:
            verify_then_decide: Read the selected Voyage status before retrying.
          partial_effects_on_failure:
            possible: A selected Voyage may report uncertain external work.
          rollback_on_failure:
            unavailable: External Voyage effects cannot be rolled back by the dispenser.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads: []
        writes:
        - id: voyage
          medium: local-system
          access: execute
          system: rutter.source.engine.interface.bound-operations
          content: One authorized Voyage resolved by opaque ID.
          formats:
          - python-object
          sensitivity: user-private
        - id: result
          medium: local-system
          access: write
          content: Public IDs, status, or validation result.
          formats:
          - python-object
          - json
          sensitivity: derived-private
        network: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: stable
