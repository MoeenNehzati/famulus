schema_version: 6
node_type: module
id: rutter
version: 2
description: Direct Rutter definitions bound to immutable Charters and durably reduced
  Reckonings.
gateway:
  path: __init__.py
  language: Python
content:
- __init__\.py
- diagnostic\.py
- engine\.py
- hooks\.py
- model\.py
- runtime\.py
- storage\.py
authority:
  owns_filesystem: []
sources:
  rutter.source.diagnostic:
    blueprint:
      base: module-root
      path: blueprints/diagnostic.yaml
  rutter.source.engine:
    blueprint:
      base: module-root
      path: blueprints/engine.yaml
  rutter.source.hooks:
    blueprint:
      base: module-root
      path: blueprints/hooks.yaml
  rutter.source.model:
    blueprint:
      base: module-root
      path: blueprints/model.yaml
  rutter.source.runtime:
    blueprint:
      base: module-root
      path: blueprints/runtime.yaml
  rutter.source.storage:
    blueprint:
      base: module-root
      path: blueprints/storage.yaml
children: {}
namespace_exports: {}
exports:
  rutter.interface.binding:
    source_interface: rutter.source.runtime.interface.binding
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
  rutter.interface.bound-operations:
    source_interface: rutter.source.engine.interface.bound-operations
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
      - using-compass
  rutter.interface.diagnostic:
    source_interface: rutter.source.diagnostic.interface.python-api
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
  rutter.interface.hooks:
    source_interface: rutter.source.hooks.interface.python-api
    access:
      allow_all_modules: false
      allowed_callers: []
  rutter.interface.model:
    source_interface: rutter.source.model.interface.python-api
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
maturity: experimental
