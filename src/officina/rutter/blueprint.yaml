schema_version: 6
node_type: module
id: rutter
version: 9
description: Direct Rutter definitions bound to immutable Charters and durably reduced
  Reckonings.
gateway:
  path: __init__.py
  language: Python
content:
- __init__\.py
- authoring\.py
- diagnostic\.py
- dispenser\.py
- engine\.py
- evaluation\.py
- history\.py
- model\.py
- reducer\.py
- runtime\.py
- storage\.py
- tests/.*
- values\.py
authority:
  owns_filesystem: []
sources:
  rutter.source.authoring:
    blueprint:
      base: module-root
      path: blueprints/authoring.yaml
  rutter.source.diagnostic:
    blueprint:
      base: module-root
      path: blueprints/diagnostic.yaml
  rutter.source.dispenser:
    blueprint:
      base: module-root
      path: blueprints/dispenser.yaml
  rutter.source.engine:
    blueprint:
      base: module-root
      path: blueprints/engine.yaml
  rutter.source.evaluation:
    blueprint:
      base: module-root
      path: blueprints/evaluation.yaml
  rutter.source.history:
    blueprint:
      base: module-root
      path: blueprints/history.yaml
  rutter.source.model:
    blueprint:
      base: module-root
      path: blueprints/model.yaml
  rutter.source.reducer:
    blueprint:
      base: module-root
      path: blueprints/reducer.yaml
  rutter.source.runtime:
    blueprint:
      base: module-root
      path: blueprints/runtime.yaml
  rutter.source.storage:
    blueprint:
      base: module-root
      path: blueprints/storage.yaml
  rutter.source.values:
    blueprint:
      base: module-root
      path: blueprints/values.yaml
children: {}
namespace_exports: {}
exports:
  rutter.interface.binding:
    source_interface: rutter.source.runtime.interface.binding
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
  rutter.interface.bound-operations:
    source_interface: rutter.source.engine.interface.bound-operations
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
      - using-compass
  rutter.interface.diagnostic:
    source_interface: rutter.source.diagnostic.interface.python-api
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
  rutter.interface.dispenser:
    source_interface: rutter.source.dispenser.interface.python-api
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
      - using-compass
  rutter.interface.model:
    source_interface: rutter.source.model.interface.python-api
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph._rtx
maturity: experimental
