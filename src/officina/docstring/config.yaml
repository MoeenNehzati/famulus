allowed_abs:
  - officina
  - skills

names_for_dependency_sections:
  calls: CallsFromRepo
  instantiations: InstantiationsFromRepo
  dispatches: Dispatches

dependency_syntax:
  allow_legacy_flat: false
  require_why: true

dependency_why:
  allow_legacy_string: false
  misc_min_chars: 80
  actions:
    - reads
    - writes
    - transforms
    - validates
    - constructs
    - dispatches
    - serializes
    - parses
    - computes
    - orchestrates
    - raises
    - misc
  section_actions:
    calls:
      - reads
      - writes
      - validates
      - parses
      - computes
      - orchestrates
      - transforms
      - dispatches
      - serializes
      - misc
    instantiations:
      - constructs
      - raises
      - transforms
      - serializes
      - misc
    dispatches:
      - dispatches

pseudocode_quality:
  forbidden_variables:
    - value
    - out
    - state
    - args
    - data
  require_assigned_dependency_output_use: false

repeated_template_detection:
  enabled: false
  min_repetitions: 3
  min_normalized_chars: 40

profiles:
  production_graphable:
    applies_to:
      - src/**/*.py
      - skills/*/_rtx/*.py
      - skills/*/_rtx/**/*.py
    checks:
      dependency_why_action: true
      pseudocode_output_use: true
      repeated_template_detection: true
  tests_lightweight:
    applies_to:
      - tests/*.py
      - tests/**/*.py
      - hooks/tests/*.py
      - hooks/tests/**/*.py
      - skills/*/tests/*.py
      - skills/*/tests/**/*.py
      - skills/*/_rtx/tests/*.py
      - skills/*/_rtx/tests/**/*.py
    callable:
      require_docstrings: false
      required_sections: []
      min_pseudocode_steps: 0
    checks:
      pseudocode_output_use: false
      repeated_template_detection: false
