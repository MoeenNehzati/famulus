content:
- credential_preflight\.py
- credential_preflight_linux_osx_windows\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/init.yaml
  reason: Loads Python package support from __init__.py.
  source: install.source.init
  version: 1
description: Probes an audited native credential backend for keyring 25.6.0 either
  through the compatible one-shot API or through one explicit managed-Python worker
  that retains the exact validated backend for closed certificate verification.
gateway:
  language: Python
  path: credential_preflight.py
id: install.source.credential-preflight
interfaces:
  install.source.credential-preflight.interface.python-api:
    contract:
      arguments:
        managed-python:
          description: Absolute managed-Python executable used directly without PATH
            lookup by the context-managed retained worker.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Bounded absolute POSIX, Windows drive, or Windows UNC path.
        command-timeout-seconds:
          default: 5.0
          description: Positive finite per-command bound that excludes reserved cleanup time.
          required: false
          sensitivity: public
          type:
            kind: number
            minimum: 0
        total-timeout-seconds:
          default: 30.0
          description: Positive finite lifetime deadline shared by startup, requests,
            shutdown, emergency exact-target cleanup, and absence proof.
          required: false
          sensitivity: public
          type:
            kind: number
            minimum: 0
        backend:
          description: Optional injected SecretBackend used by deterministic tests;
            production callers omit it so the child selects the pinned host keyring.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Python object implementing the SecretBackend protocol.
        timeout-seconds:
          default: 5.0
          description: Positive bound applied independently to each probe or cleanup
            child.
          required: false
          sensitivity: public
          type:
            kind: number
            minimum: 0
        token-factory:
          description: Child-callable probe-secret factory; production uses a cryptographic
            random generator and the returned value never leaves the child.
          required: false
          sensitivity: secret
          type:
            kind: string
            description: Callable returning one non-empty secret string.
      caller_warnings:
      - external-side-effect: A successful check briefly creates and then removes
          one random entry in the native credential store.
      - external-side-effect: The managed worker holds one anonymous IPC channel
          and one contained child process until closed; abnormal paths terminate
          and prove absence before returning.
      direct_io:
        network: []
        reads:
        - access: read
          content: Selected backend identity and exact probe value.
          formats:
          - opaque-secret
          id: native-credential-store
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        - access: read
          content: Active certificate public state and matching private-key lookup
            through the exact retained backend; the signer remains child-side.
          formats:
          - pem
          id: certificate-verification-state
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        writes:
        - access: configure
          content: Ephemeral probe value followed by its verified removal.
          formats:
          - opaque-secret
          id: native-credential-store
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        - access: write
          content: Closed preflight result without backend exception text or child streams.
          formats:
          - json
          id: result
          medium: local-system
          sensitivity: public
        - access: write
          content: Versioned bounded JSON request and response frames over a parent-created
            anonymous duplex channel; child stdout and stderr are discarded.
          formats:
          - json
          id: managed-worker-protocol
          medium: subprocess
          sensitivity: public
      execution:
        consistency:
          live: Backend selection and the complete roundtrip are checked during each
            invocation.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: native-credential-store
            kind: direct-io
          direct_io_ref: native-credential-store
          id: ephemeral-probe
          may_occur_in_outcomes:
          - completed
          - roundtrip-failed
          - cleanup-failed
          reversibility:
            compensatable: A separate bounded cleanup child removes and verifies
              absence after abnormal probe exit; unverifiable absence fails closed.
          value_source:
            direct_io_ref: native-credential-store
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Store, lookup, delete, and final lookup are separate native
              backend operations.
          concurrent_invocations:
            safe: Every invocation uses a parent-owned collision-checked random target
              identifier; each managed client permits one request in flight.
          idempotency:
            idempotent: Successful and failed-cleaned probes leave the selected target
              absent.
          on_uncertain_completion:
            verify_then_decide: Launch a separate bounded cleanup/final-absence child
              through the same explicit managed executable for the exact parent-owned
              target after abnormal probe termination.
          partial_effects_on_failure:
            possible: The probe child may terminate after storing but before confirming
              deletion.
          rollback_on_failure:
            available: Exact-target cleanup is attempted and verified; failure
              returns cleanup_failed without claiming rollback.
        state_effect: mutating
        verification:
        - direct_io_ref: native-credential-store
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Continue installation while retaining the per-home install lock.
        class: success
        effects:
        - ephemeral-probe
        id: completed
        outputs:
        - result
      - caller_action: Replace the selected backend with the audited native backend
          for the current platform and pinned keyring version.
        class: error
        effects: []
        id: unsupported-backend
        outputs:
        - result
      - caller_action: Start or unlock the native credential service, then retry.
        class: error
        effects: []
        id: backend-unavailable
        outputs:
        - result
      - caller_action: Unlock the native credential store, then retry.
        class: error
        effects: []
        id: backend-locked
        outputs:
        - result
      - caller_action: Repair native credential-store permissions or service health,
          then retry.
        class: error
        effects:
        - ephemeral-probe
        id: roundtrip-failed
        outputs:
        - result
      - caller_action: Do not continue installation; inspect the native store and remove
          the reported non-secret probe target before retrying.
        class: error
        effects:
        - ephemeral-probe
        id: cleanup-failed
        outputs:
        - result
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Schema-v1 result containing only ok, one of five closed failure
          codes or null on success, and the concrete backend class name.
        direct_io_ref: result
        empty: Never empty.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Closed schema-v1 JSON-compatible CredentialPreflightResult.
          kind: string
          sensitivity: public
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 0
        description: Closed certificate verification containing only verified=true
          and the non-secret active key ID; no signer or private bytes cross IPC.
        direct_io_ref: result
        empty: Empty unless managed certificate verification is requested.
        id: certificate-verification
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Closed JSON-compatible CredentialVerificationResult.
          kind: string
          sensitivity: public
      preconditions:
      - caller_action: Run from the managed interpreter containing keyring 25.6.0 and
          a native service available in the current user session.
        check:
          argument_ref: timeout-seconds
          kind: argument
          predicate: present
        description: timeout-seconds must be positive; production backend selection
          must exactly match the current platform's audited class.
        id: supported-native-store
        unmet_outcome: backend-unavailable
    description: Provides the compatible one-shot preflight plus a context-managed,
      explicit-executable retained worker with preflight and non-mutating certificate
      verification only.
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: keyring
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Provides the audited native credential-store backend selected inside the
    isolated probe child.
  version: 25.6.0
schema_version: 6
uses_interfaces: []
version: 1
