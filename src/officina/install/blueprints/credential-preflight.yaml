content:
- credential_preflight\.py
- credential_preflight_linux_osx_windows\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/init.yaml
  reason: Loads Python package support from __init__.py.
  source: install.source.init
  version: 1
description: Probes an audited native credential backend for keyring 25.6.0 either
  through the compatible one-shot API or through one explicit managed-Python worker
  that retains the exact validated backend for closed certificate verification and
  restart-safe certificate prepare, apply, abort, commit, and recovery operations.
gateway:
  language: Python
  path: credential_preflight.py
id: install.source.credential-preflight
interfaces:
  install.source.credential-preflight.interface.python-api:
    contract:
      arguments:
        managed-python:
          description: Absolute managed-Python executable used directly without PATH
            lookup by the context-managed retained worker.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Bounded absolute POSIX, Windows drive, or Windows UNC path.
        command-timeout-seconds:
          default: 5.0
          description: Positive finite per-command bound that excludes reserved cleanup time.
          required: false
          sensitivity: public
          type:
            kind: number
        total-timeout-seconds:
          default: 30.0
          description: Positive finite lifetime deadline shared by startup, requests,
            shutdown, emergency exact-target cleanup, and absence proof.
          required: false
          sensitivity: public
          type:
            kind: number
        platform:
          description: Audited native platform identifier used by managed certificate verification.
          required: false
          sensitivity: public
          type:
            kind: string
            description: One exact key from the audited native-backend platform map.
        home:
          description: Absolute home capability used to recompute durable certificate state paths.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Bounded absolute path; not a caller-selected certificate root.
        repo:
          description: Absolute repository capability used to recompute legacy certificate state paths.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Bounded absolute path; not a caller-selected certificate root.
        transaction-id:
          description: Exact 32-lowercase-hex installer transaction identifier bound
            into certificate preparation, its canonical intent, and every ACK.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Canonical 128-bit transaction identifier.
        certificate-intent:
          description: Strict secret-free schema-v1 mutation intent returned by prepare
            or loaded from a trusted schema-v2 transaction journal for recovery.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Closed JSON-compatible CertificateMutationIntent.
        intent-ack:
          description: Exact transaction ID, intent ID, and canonical intent digest
            durably acknowledged by the parent before apply or abort.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Closed JSON-compatible CertificateIntentAck.
        selector-ack:
          description: Intent ACK plus the deterministic ID of the durably saved
            certificate_selector JournalMutation required before selector commit.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Closed JSON-compatible CertificateSelectorAck.
        directive:
          description: Closed restart-recovery decision; exactly abort or commit.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Required only by recover_certificate_intent.
        backend:
          description: Optional injected SecretBackend used by deterministic tests;
            production callers omit it so the child selects the pinned host keyring.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Python object implementing the SecretBackend protocol.
        timeout-seconds:
          default: 5.0
          description: Positive bound applied independently to each probe or cleanup
            child.
          required: false
          sensitivity: public
          type:
            kind: number
        token-factory:
          description: Child-callable probe-secret factory; production uses a cryptographic
            random generator and the returned value never leaves the child.
          required: false
          sensitivity: secret
          type:
            kind: string
            description: Callable returning one non-empty secret string.
      caller_warnings:
      - external-side-effect: A successful check briefly creates and then removes
          one random entry in the native credential store.
      - external-side-effect: The managed worker holds one anonymous IPC channel
          and one contained child process until closed; abnormal paths terminate
          and prove absence before returning.
      - external-side-effect: Certificate mutation requires a caller-held per-home
          install lock and an exact durable journal ACK before each acknowledged
          mutation step; fresh-worker recovery is restricted to a persisted intent.
      - external-side-effect: Certificate apply, abort, commit, and recovery may
          update the host credential store and the local certificate public-key,
          quarantine, deterministic selector-build, selector-stage, and active-selector
          files. Preparation performs neither class of mutation.
      direct_io:
        network: []
        reads:
        - access: read
          content: Selected backend identity and exact probe value.
          formats:
          - opaque-secret
          id: native-credential-store
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        - access: read
          content: Matching certificate private-key lookup through the exact retained
            backend; the signer and private bytes remain child-side.
          formats:
          - opaque-secret
          id: certificate-private-state
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        - access: read
          content: Canonical certificate public keys, active selector, deterministic
            selector build/stage files, and journal-addressed quarantine entries;
            recovery verifies the complete bounded name set before reading or mutating
            any expected entry.
          formats:
          - pem
          - text
          id: certificate-public-state
          medium: local-filesystem
          path: <famulus-data>/certificates/public-keys
          sensitivity: public
        - access: read
          content: Exact retained child PID/process-tree containment identity and
            final process-tree absence after graceful or abnormal completion.
          formats:
          - text
          id: managed-worker-process-state
          medium: subprocess
          sensitivity: public
        writes:
        - access: configure
          content: Ephemeral probe value followed by its verified removal.
          formats:
          - opaque-secret
          id: native-credential-store
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        - access: write
          content: Closed preflight result without backend exception text or child streams.
          formats:
          - json
          id: result
          medium: local-system
          sensitivity: public
        - access: write
          content: Versioned bounded JSON request and response frames over a parent-created
            anonymous duplex channel, including only strict secret-free certificate
            intents, ACKs, key IDs, and dispositions; child stdout and stderr are discarded.
          formats:
          - json
          id: managed-worker-protocol
          medium: subprocess
          sensitivity: public
        - access: configure
          content: Exact certificate private-key target, mutated only by the retained
            backend after matching durable ACK authority or by fresh-worker persisted-intent
            recovery.
          formats:
          - opaque-secret
          id: certificate-secret-mutation
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        - access: read-write
          content: Canonical certificate public-key files created or quarantined under
            exact intent records.
          formats:
          - pem
          id: certificate-public-file-mutation
          medium: local-filesystem
          path: <famulus-data>/certificates/public-keys/<key-id>.pub or .famulus-quarantine-<quarantine-id>
          sensitivity: public
        - access: read-write
          content: Intent-derived private selector build and published stage files.
          formats:
          - text
          id: certificate-selector-staging
          medium: local-filesystem
          path: <famulus-data>/certificates/public-keys/.famulus-build-<intent-id> or .famulus-staged-<intent-id>
          sensitivity: public
        - access: read-write
          content: Canonical active-key-id selector replaced only after the exact
            selector JournalMutation is durably saved and ACKed.
          formats:
          - text
          id: certificate-selector
          medium: local-filesystem
          path: <famulus-data>/certificates/public-keys/active-key-id
          sensitivity: public
      execution:
        consistency:
          live: Backend selection and the complete roundtrip are checked during each
            invocation.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: native-credential-store
            kind: direct-io
          direct_io_ref: native-credential-store
          id: ephemeral-probe
          may_occur_in_outcomes:
          - completed
          - roundtrip-failed
          - cleanup-failed
          reversibility:
            compensatable: A separate bounded cleanup child removes and verifies
              absence after abnormal probe exit; unverifiable absence fails closed.
          value_source:
            direct_io_ref: native-credential-store
            kind: direct-io
        - action: update
          confirmation_evidence:
            direct_io_ref: certificate-secret-mutation
            kind: direct-io
          direct_io_ref: certificate-secret-mutation
          id: acknowledged-certificate-secret-mutation
          may_occur_in_outcomes:
          - certificate-completed
          - certificate-mutation-failed
          reversibility:
            compensatable: Before selector commit, exact intent recovery can abort
              matching staged state; after selector commit, recovery verifies and
              adopts the committed identity rather than deleting it.
          value_source:
            direct_io_ref: managed-worker-protocol
            kind: direct-io
        - action: update
          confirmation_evidence:
            direct_io_ref: certificate-public-file-mutation
            kind: direct-io
          direct_io_ref: certificate-public-file-mutation
          id: acknowledged-certificate-public-mutation
          may_occur_in_outcomes:
          - certificate-completed
          - certificate-mutation-failed
          reversibility:
            compensatable: Before selector commit, exact intent recovery can remove
              or quarantine only the journaled public candidates; after selector
              commit, recovery retains the active identity.
          value_source:
            direct_io_ref: managed-worker-protocol
            kind: direct-io
        - action: update
          confirmation_evidence:
            direct_io_ref: certificate-selector-staging
            kind: direct-io
          direct_io_ref: certificate-selector-staging
          id: acknowledged-certificate-selector-staging
          may_occur_in_outcomes:
          - certificate-completed
          - certificate-mutation-failed
          reversibility:
            compensatable: Restart recovery validates and resumes or removes only
              the intent-derived build/stage names.
          value_source:
            direct_io_ref: managed-worker-protocol
            kind: direct-io
        - action: update
          confirmation_evidence:
            direct_io_ref: certificate-selector
            kind: direct-io
          direct_io_ref: certificate-selector
          id: acknowledged-certificate-selector-commit
          may_occur_in_outcomes:
          - certificate-completed
          - certificate-mutation-failed
          reversibility:
            irreversible: Once the exact active selector is committed, recovery
              verifies and adopts the active identity rather than deleting it.
          value_source:
            direct_io_ref: managed-worker-protocol
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: 'Credential probe: store, lookup, delete, and final lookup
              are separate native-backend operations. Certificate lifecycle: preparation
              is nonmutating; the durable intent ACK gates separate secret storage,
              canonical public-file publication or quarantine, deterministic selector-build
              write, stage publication, and active-selector replacement effects. A crash
              may leave physical state one acknowledged step ahead of journal progress.'
          concurrent_invocations:
            safe: 'Credential probe: each invocation uses a parent-owned collision-checked
              target and each client permits one request in flight. Certificate lifecycle:
              safety requires the caller-held per-home InstallLock continuously from
              preparation through completion or recovery, with the exact selector
              revalidated immediately before every secret, public-file, or selector
              mutation; no claim covers an uncooperative writer outside that lock.'
          idempotency:
            idempotent: 'Credential probe: success and verified cleanup leave the exact
              target absent. Certificate lifecycle: commands bind the exact retained
              preparation intent, canonical ACK digest, backend object, and durable
              journal progress. They never replay a mutation blindly; a fresh recovery
              worker accepts only the persisted intent and matching audited backend
              identity, then adopts or advances the observed exact state.'
          on_uncertain_completion:
            verify_then_decide: 'Credential probe: launch bounded exact-target cleanup
              through the same managed executable and prove process-tree and target
              absence. Certificate lifecycle: retain the durable secret-free intent,
              recompute canonical paths, inspect the actual selector, public-file,
              build/stage, quarantine, and secret state with a fresh audited worker,
              then use the actual pointer state to choose the abort or commit directive.'
          partial_effects_on_failure:
            possible: 'Credential probe: the child may terminate after storing but before
              confirmed deletion. Certificate lifecycle: failure can occur after exact
              secret storage, any public-file create or quarantine relocation, selector-build
              creation or partial write, stage publication, selector replacement, or
              post-selector verification; the journal intentionally records the last
              acknowledged step rather than assuming physical rollback.'
          rollback_on_failure:
            available: 'Credential probe: exact-target cleanup is attempted and verified,
              otherwise cleanup_failed is returned without a rollback claim. Certificate
              lifecycle: before selector replacement, exact persisted-intent abort can
              dispose the inactive secret/public/build/stage/quarantine candidate set;
              after the pointer selects the intended key, recovery must commit and verify
              the complete public/secret pair and selector rather than delete active
              material or claim rollback.'
        state_effect: mutating
        verification:
        - direct_io_ref: native-credential-store
          method: direct-io-state
        - direct_io_ref: certificate-private-state
          method: direct-io-state
        - direct_io_ref: certificate-public-state
          method: direct-io-state
        - direct_io_ref: certificate-public-file-mutation
          method: direct-io-state
        - direct_io_ref: certificate-selector-staging
          method: direct-io-state
        - direct_io_ref: certificate-selector
          method: direct-io-state
        - direct_io_ref: managed-worker-process-state
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Continue installation while retaining the per-home install lock.
        class: success
        effects:
        - ephemeral-probe
        id: completed
        outputs:
        - result
      - caller_action: Replace the selected backend with the audited native backend
          for the current platform and pinned keyring version.
        class: error
        effects: []
        id: unsupported-backend
        outputs:
        - result
      - caller_action: Durably save the acknowledged certificate progress and continue
          the locked installer transaction.
        class: success
        effects:
        - acknowledged-certificate-secret-mutation
        - acknowledged-certificate-public-mutation
        - acknowledged-certificate-selector-staging
        - acknowledged-certificate-selector-commit
        id: certificate-completed
        outputs:
        - certificate-mutation-result
      - caller_action: No certificate intent exists; repair the reported host credential
          or public-state prerequisite, then restart preparation while holding the
          per-home install lock.
        class: error
        effects: []
        id: certificate-preparation-failed
        outputs:
        - result
      - caller_action: Start or unlock the native credential service, then retry.
        class: error
        effects: []
        id: backend-unavailable
        outputs:
        - result
      - caller_action: Unlock the native credential store, then retry.
        class: error
        effects: []
        id: backend-locked
        outputs:
        - result
      - caller_action: Repair native credential-store permissions or service health,
          then retry.
        class: error
        effects:
        - ephemeral-probe
        id: roundtrip-failed
        outputs:
        - result
      - caller_action: Do not continue installation; inspect the native store and remove
          the reported non-secret probe target before retrying.
        class: error
        effects:
        - ephemeral-probe
        id: cleanup-failed
        outputs:
        - result
      - caller_action: Retain the schema-v2 transaction journal and per-home install
          lock. Task 6D must recompute and validate the canonical selector path from
          platform/home/repo before recovering with a fresh audited worker and the
          exact persisted intent; generic pending-mutation recovery is forbidden.
        class: error
        effects:
        - acknowledged-certificate-secret-mutation
        - acknowledged-certificate-public-mutation
        - acknowledged-certificate-selector-staging
        - acknowledged-certificate-selector-commit
        id: certificate-mutation-failed
        outputs:
        - result
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Schema-v1 result containing only ok, one of five closed failure
          codes or null on success, and the concrete backend class name.
        direct_io_ref: result
        empty: Never empty.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Closed schema-v1 JSON-compatible CredentialPreflightResult.
          kind: string
          sensitivity: public
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 0
        description: Secret-free preparation or mutation record containing only a
          canonical intent or null, key ID, and closed recovery disposition.
        direct_io_ref: result
        empty: Empty unless a certificate prepare, apply, abort, commit, or recovery
          command is requested.
        id: certificate-mutation-result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Closed JSON-compatible certificate lifecycle result.
          kind: string
          sensitivity: public
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 0
        description: Closed certificate verification containing only verified=true
          and the non-secret active key ID; no signer or private bytes cross IPC.
        direct_io_ref: result
        empty: Empty unless managed certificate verification is requested.
        id: certificate-verification
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Closed JSON-compatible CredentialVerificationResult.
          kind: string
          sensitivity: public
      preconditions:
      - caller_action: Run from the managed interpreter containing keyring 25.6.0 and
          a native service available in the current user session.
        check:
          argument_ref: timeout-seconds
          kind: argument
          predicate: present
        description: timeout-seconds must be positive; production backend selection
          must exactly match the current platform's audited class.
        id: supported-native-store
        unmet_outcome: backend-unavailable
    description: >-
      Provides the compatible one-shot preflight plus a context-managed,
      explicit-executable retained worker with verification and a closed journal-ACKed
      certificate lifecycle. Preparation is nonmutating; apply, abort, commit, and
      recovery reuse the exact retained backend and fail closed on order or ACK drift.
      Selector journals validate only a closed lexical path shape and exact intent-derived
      byte snapshots; Task 6D must recompute and compare the canonical selector path
      before invoking certificate-specific recovery.
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: keyring
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Provides the audited native credential-store backend selected inside the
    isolated probe child.
  version: 25.6.0
schema_version: 6
uses_interfaces:
- interface: common.interface.certificate-intents
  version: 1
version: 1
