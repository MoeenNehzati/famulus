content:
- runtime_pointer\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/init.yaml
  reason: Loads Python package support from __init__.py.
  source: install.source.init
  version: 1
description: Reads and atomically activates the current.json pointer that selects which installed runtime release is live.
gateway:
  language: Python
  path: runtime_pointer.py
id: install.source.runtime-pointer
interfaces:
  install.source.runtime-pointer.interface.python-api:
    contract:
      arguments:
        operation:
          description: Runtime-pointer function to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: load-current, description: Load and validate the current release pointer beneath runtime-root.}
            - {value: activate-release, description: Atomically point current.json at release-dir's python-bin.}
        runtime-root:
          description: Managed-runtime root directory that owns current.json and every release directory.
          required: true
          sensitivity: user-private
          direct_io_ref: pointer-file
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: false, access: read-write}
        release-dir:
          description: Release directory to activate, used only for activate-release.
          required: false
          sensitivity: user-private
          direct_io_ref: release-directory
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: false, access: read}
        python-bin:
          description: Candidate interpreter path beneath release-dir to activate, used only for activate-release.
          required: false
          sensitivity: user-private
          direct_io_ref: candidate-python
          type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: false, access: read, opaque_content: true}
      preconditions:
      - id: absolute-pointer-paths
        description: For activate-release, python-bin and release-dir must be absolute paths beneath runtime-root.
        check: {kind: argument, argument_ref: runtime-root, predicate: present}
        unmet_outcome: path-escape
        caller_action: Supply an absolute python-bin path beneath an absolute runtime-root.
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: activate-release replaces current.json, changing which installed runtime release every future launch resolves to.
      outputs:
      - id: result
        audience: machine
        description: RuntimePointer dataclass instance with release_id, runtime_source, and python_bin fields.
        direct_io_ref: return-value
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty on success.
        type: {kind: string, sensitivity: user-private, description: Python RuntimePointer dataclass instance.}
      outcomes:
      - {id: completed, class: success, outputs: [result], effects: [pointer-state], caller_action: "Use the returned RuntimePointer fields to locate the active release's interpreter."}
      - {id: missing-pointer, class: error, outputs: [], effects: [], caller_action: Run activate-release at least once before load-current.}
      - {id: invalid-pointer, class: error, outputs: [], effects: [], caller_action: Repair or regenerate current.json with activate-release.}
      - {id: path-escape, class: refusal, outputs: [], effects: [], caller_action: Supply a python-bin path that resolves beneath runtime-root.}
      - {id: missing-candidate, class: refusal, outputs: [], effects: [], caller_action: Finish installing the release so python-bin exists before activating it.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: current.json is read or replaced once during the call.}
        effects:
        - id: pointer-state
          direct_io_ref: pointer-file
          action: update
          value_source: {kind: argument, argument_ref: release-dir}
          may_occur_in_outcomes: [completed]
          confirmation_evidence: {kind: direct-io, direct_io_ref: pointer-file}
          reversibility: {irreversible: A prior pointer is only recoverable by activating its release again.}
        mutation_safety:
          atomicity: {per_effect_only: current.json is written to a temp file and replaced with an atomic rename.}
          concurrent_invocations: {safe: The temp-file-then-rename pattern leaves the last successful activation as the visible pointer.}
          idempotency: {idempotent: Activating the same release again writes the same pointer contents.}
          on_uncertain_completion: {verify_then_decide: Load the current pointer and compare release_id before retrying.}
          partial_effects_on_failure: {impossible: "A candidate that fails existence validation is rejected before current.json is touched, leaving any prior pointer untouched."}
          rollback_on_failure: {unavailable: No previous pointer is retained beyond whatever current.json held before the call.}
        verification:
        - {method: direct-io-state, direct_io_ref: pointer-file}
      helpers: []
      direct_io:
        reads:
        - {id: pointer-file, medium: local-filesystem, access: read, content: current.json pointer bytes, formats: [json], sensitivity: user-private, path: <runtime-root>/current.json}
        - {id: release-directory, medium: local-filesystem, access: read, content: release directory metadata, formats: [path], sensitivity: user-private, path: <release-dir>}
        - {id: candidate-python, medium: local-filesystem, access: read, content: candidate interpreter existence check, formats: [binary], sensitivity: user-private, path: <python-bin>}
        writes:
        - {id: pointer-file, medium: local-filesystem, access: read-write, content: current.json pointer bytes, formats: [json], sensitivity: user-private, path: <runtime-root>/current.json}
        - {id: return-value, medium: local-system, access: write, content: Python return value, formats: [text], sensitivity: user-private}
        network: []
    description: Provides atomic runtime-pointer read and activation to Python callers.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces:
- interface: common.interface.atomic-files
  version: 1
version: 1
