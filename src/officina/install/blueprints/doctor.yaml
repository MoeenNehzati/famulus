content:
- doctor\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/context.yaml
  reason: Accepts one explicitly resolved installation context.
  source: install.source.context
  version: 1
- blueprint:
    base: module-root
    path: blueprints/runtime-pointer.yaml
  reason: Validates the selected current pointer and immutable context record.
  source: install.source.runtime-pointer
  version: 1
- blueprint:
    base: module-root
    path: blueprints/managed-runtime.yaml
  reason: Reads the trusted interpreter roots selected by the deployed resolver generation.
  source: install.source.managed-runtime
  version: 1
description: Diagnoses one explicit installation context without mutation, accepts the active resolver's trusted interpreter roots, and renders human or schema-versioned JSON reports.
gateway:
  language: Python
  path: doctor.py
id: install.source.doctor
interfaces:
  install.source.doctor.interface.python-api:
    content:
    - doctor\.py
    uses_interfaces:
    - interface: install.interface.context
      version: 1
    - interface: install.interface.runtime-pointer
      version: 1
    - interface: install.interface.managed-runtime
      version: 1
    contract:
      arguments:
        context:
          description: One already resolved standard or development installation context.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        environ:
          description: Explicit environment used only for command-origin inspection.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: Pointer, active resolver trust, source, launcher selection, command origins, manifest, and informational recurring summary for the selected context.
          formats: [json, files, paths]
          id: installation-state
          medium: local-filesystem
          path: <selected-installation-context>/**
          path_match: glob
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: Immutable diagnostic report value.
          formats: [text, json]
          id: report
          medium: local-system
          sensitivity: derived-private
      execution:
        consistency:
          live: Each check reports the state read during this finite invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: report
      helpers: []
      interaction: {mode: unattended}
      outcomes:
      - caller_action: Use exact recovery guidance for failed checks or report the healthy context.
        class: success
        effects: []
        id: diagnosed
        outputs: [report]
      outputs:
      - audience: machine
        cardinality: {minimum: 1, maximum: 1}
        description: Schema-versioned diagnostic report.
        direct_io_ref: report
        empty: Never empty.
        id: report
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        type: {kind: string, sensitivity: derived-private}
      preconditions: []
    description: Diagnose one explicit installation context without mutation.
    version: 1
node_type: behavioral_source
platform_support: {linux: true, macos: true, windows: true}
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: install.interface.context
  version: 1
- interface: install.interface.runtime-pointer
  version: 1
- interface: install.interface.managed-runtime
  version: 1
version: 1
maturity: stable
