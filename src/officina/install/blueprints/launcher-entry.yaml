content:
- launcher_entry\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/runtime-pointer.yaml
  reason: main() loads and validates the active release pointer through the shared runtime-pointer source before exec-ing into it.
  source: install.source.runtime-pointer
  version: 1
- blueprint:
    base: module-root
    path: blueprints/managed-runtime.yaml
  reason: _trusted_interpreter_roots derives uv's managed-Python install directory through the shared managed-runtime source, so the resolver trusts the exact interpreter store build-candidate-release already trusted when it activated the pointer this resolver reads.
  source: install.source.managed-runtime
  version: 1
description: Stable, path-fixed launch resolver deployed at <runtime_root>/bootstrap/resolvers/v1/launch.py. Reads current.json at launch time and execs into the active managed-runtime release's interpreter, so generated launcher shims (dispatcher, invoke-skill, ...) never need to embed a release-specific repo checkout or interpreter path that goes stale when the repo moves or a new release is activated.
gateway:
  language: Python
  path: launcher_entry.py
id: install.source.launcher-entry
interfaces:
  install.source.launcher-entry.interface.cli:
    contract:
      arguments:
        argv:
          description: "Process argv as received by this file when invoked directly (argv[0] is this file's own fixed deployment path, <runtime_root>/bootstrap/resolvers/v1/launch.py; argv[1:] is forwarded unchanged, e.g. '-m officina.dispatcher.cli' plus user args)."
          required: true
          sensitivity: public
          type: {kind: list, element_type: {kind: string}}
      preconditions:
      - id: pointer-resolvable
        description: A valid current.json must exist beneath the runtime_root derived from argv[0]'s fixed deployment location (three directories above bootstrap/resolvers/v1/launch.py).
        check: {kind: argument, argument_ref: argv, predicate: present}
        unmet_outcome: unresolved-pointer
        caller_action: Finish installing/activating a managed-runtime release (officina.install.runtime_pointer.activate_release) before invoking a generated launcher.
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: "On success this process image is replaced (os.execve) by the active release's interpreter; it never returns to its caller."
      outputs:
      - id: exit-code
        audience: machine
        description: "1 if the pointer could not be resolved/validated (message printed to stderr); on success the process image is replaced and this file's own exit code is never observed."
        direct_io_ref: return-value
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty.
        type: {kind: integer, sensitivity: public, description: Process exit code.}
      outcomes:
      - {id: launched, class: success, outputs: [], effects: [], caller_action: "Not observed by the invoking shim -- os.execve replaces this process with the release interpreter running argv[1:]."}
      - {id: unresolved-pointer, class: error, outputs: [exit-code], effects: [], caller_action: "Activate a managed-runtime release so current.json exists and validates beneath this resolver's runtime_root, then retry."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: "current.json is read once per invocation, immediately before the exec."}
        verification:
        - {method: direct-io-state, direct_io_ref: pointer-file}
      helpers: []
      direct_io:
        reads:
        - {id: pointer-file, medium: local-filesystem, access: read, content: current.json pointer bytes, formats: [json], sensitivity: user-private, path: <runtime_root>/current.json}
        writes:
        - {id: return-value, medium: local-system, access: write, content: process exit code / replaced process image, formats: [text], sensitivity: public}
        network: []
    description: Fixed-path launch resolver invoked directly by generated Unix/Windows launcher shims instead of a baked-in repo/interpreter path.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
