content:
- context\.py
dependencies:
- blueprint:
    base: repository-root
    path: src/officina/common/blueprints/famulus-paths.yaml
  reason: Resolves every standard and isolated development path through the shared
    explicit-environment path contract.
  source: common.source.famulus-paths
  version: 1
- blueprint:
    base: module-root
    path: blueprints/runtime-pointer.yaml
  reason: Loads the schema-3 pointer and its immutable schema-1 or schema-2 installation-context record.
  source: install.source.runtime-pointer
  version: 1
description: Resolves immutable standard or clone-local installation facts, reads the
  active schema-3 installation without mutation, preserves the selected normal or
  isolated assistant home, validates real-path development boundaries, and creates
  or reuses the checkout installation ID.
gateway:
  language: Python
  path: context.py
id: install.source.context
interfaces:
  install.source.context.interface.python-api:
    content:
    - context\.py
    uses_interfaces:
    - interface: common.interface.famulus-paths
      version: 1
    - interface: install.interface.runtime-pointer
      version: 1
    contract:
      arguments:
        operation:
          description: Context operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: resolve
              description: Resolve an immutable standard or development context.
            - value: load-or-create-development-id
              description: Read or create the checkout-local immutable installation ID.
            - value: validate-development-boundaries
              description: Recheck real-path write containment before a mutation.
            - value: load-active
              description: Read and validate the installation selected by an absolute runtime root.
            - value: load-context-from-pointer
              description: Load exactly the immutable context record referenced by one validated RuntimePointer.
        source-root:
          description: Existing absolute source checkout used by the installation.
          required: false
          sensitivity: user-private
          direct_io_ref: source-directory
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: true
            access: read
        platform:
          description: Host platform identifier required by resolve, load-or-create-development-id,
            and validate-development-boundaries; not accepted by load-active or load-context-from-pointer.
          required: false
          sensitivity: public
          type:
            kind: string
        home:
          description: Absolute normal user home required by resolve, load-or-create-development-id,
            and validate-development-boundaries; not accepted by load-active or load-context-from-pointer.
          required: false
          sensitivity: user-private
          direct_io_ref: home-directory
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read
        environ:
          description: Explicit environment mapping required by every operation to
            recompute paths without ambient fallback and, for load-active and load-context-from-pointer,
            validate the referenced context roots and assistant homes.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Read-only string-to-string mapping.
        runtime-root:
          description: Absolute managed-runtime root required by load-active and load-context-from-pointer;
            unused by the other context operations.
          required: false
          sensitivity: user-private
          direct_io_ref: active-pointer-file
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: true
            access: read
        pointer:
          description: Validated schema-3 RuntimePointer required only by load-context-from-pointer.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Python RuntimePointer whose installation_context field names the exact record to load.
      preconditions:
      - id: absolute-existing-source
        description: Source and any development checkout must be existing absolute directories.
        check:
          kind: direct-io
          direct_io_ref: source-directory
          predicate: exists
        unmet_outcome: invalid-context
        caller_action: Supply the selected existing checkout as an absolute path.
      - id: stable-root-canaries
        description: Platform, normal home, and explicit environment must derive
          non-overlapping standard Famulus roots and assistant homes.
        check:
          kind: argument
          argument_ref: home
          predicate: present
        unmet_outcome: boundary-escape
        caller_action: Keep the checkout outside standard Famulus and assistant homes.
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: load-or-create-development-id may create .famulus/install-id.
      outputs:
      - id: result
        audience: machine
        description: InstallationContext including selected_home, validated development root, or immutable installation ID.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: user-private
          description: Python context result selected by operation.
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects:
        - installation-identity
        caller_action: Use the resolved facts without substituting ambient roots.
      - id: invalid-context
        class: refusal
        outputs: []
        effects: []
        caller_action: Correct the root, environment, mode, or installation ID.
      - id: boundary-escape
        class: refusal
        outputs: []
        effects: []
        caller_action: Remove the symlink or junction escape and retry.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Inputs, standard canaries, and real paths are resolved once per call;
            an existing ID is reused.
        effects:
        - id: installation-identity
          direct_io_ref: installation-id-file
          action: create
          value_source:
            kind: direct-io
            direct_io_ref: installation-id-file
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: installation-id-file
          reversibility:
            compensatable: The ID is deliberately preserved by uninstall and purge;
              manual removal is possible only outside the installation lifecycle.
        mutation_safety:
          atomicity:
            atomic: Exclusive file creation publishes the complete ID once.
          concurrent_invocations:
            safe: A losing creator reads and validates the already published ID.
          idempotency:
            idempotent: Existing valid IDs are returned unchanged.
          on_uncertain_completion:
            verify_then_decide: Read and validate .famulus/install-id before retrying.
          partial_effects_on_failure:
            impossible: Boundary and identity validation precede any new write.
          rollback_on_failure:
            unavailable: A published immutable identity is retained by design.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads:
        - id: source-directory
          medium: local-filesystem
          access: read
          content: Source checkout path and real-path metadata.
          formats:
          - path
          sensitivity: user-private
          path: <source-root>
        - id: active-pointer-file
          medium: local-filesystem
          access: read
          content: Active schema-3 pointer and selected immutable schema-1 or schema-2 context record.
          formats:
          - json
          sensitivity: user-private
          path: <runtime-root>/current.json
        - id: installation-id-file
          medium: local-filesystem
          access: read
          content: Immutable development installation identity.
          formats:
          - text
          sensitivity: user-private
          path: <development-root>/.famulus/install-id
        - id: home-directory
          medium: local-filesystem
          access: read
          content: Normal user home path and real-path metadata used as a protected canary.
          formats:
          - path
          sensitivity: user-private
          path: <home>
        writes:
        - id: installation-id-file
          medium: local-filesystem
          access: read-write
          content: Immutable development installation identity.
          formats:
          - text
          sensitivity: user-private
          path: <development-root>/.famulus/install-id
        - id: return-value
          medium: local-system
          access: write
          content: Python return value.
          formats:
          - text
          sensitivity: user-private
        network: []
    description: Provides explicit installation-context, identity, and containment operations.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: common.interface.famulus-paths
  version: 1
- interface: install.interface.runtime-pointer
  version: 1
version: 1
maturity: stable
