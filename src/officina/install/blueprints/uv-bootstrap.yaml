content:
- uv_bootstrap\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/init.yaml
  reason: Loads Python package support from __init__.py.
  source: install.source.init
  version: 1
description: Bootstraps a machine-local, managed uv binary at FamulusPaths.uv_bin
  from the real astral-sh/uv GitHub release for the pinned install-info.toml bootstrap.uv_version,
  so a fresh machine without uv already on PATH can still build a managed-runtime
  candidate release. No-op if a matching version is already present; otherwise downloads
  the real release-asset for a caller-resolved target-triple/archive-extension pair,
  verifies it against the real published same-origin sha256 checksum, and installs
  it atomically. Deliberately platform-name-free -- install-assistant-tools' own _install_scaffold.py
  resolves the target-triple/archive-extension pair from a platform name and CPU architecture
  before calling this.
gateway:
  language: Python
  path: uv_bootstrap.py
id: install.source.uv-bootstrap
interfaces:
  install.source.uv-bootstrap.interface.python-api:
    contract:
      arguments:
        uv-bin:
          description: Path FamulusPaths designates for the machine-local managed
            uv binary; checked for an already-matching version and, on bootstrap,
            the atomic install destination.
          required: true
          sensitivity: user-private
          direct_io_ref: uv-binary
          type:
            kind: file
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read-write
            opaque_content: true
        version:
          description: Pinned uv release version to bootstrap (install-info.toml's
            bootstrap.uv_version), e.g. "0.11.29".
          required: true
          sensitivity: public
          type:
            kind: string
        triple:
          description: Real uv release-asset target-triple (e.g. "x86_64-unknown-linux-gnu"),
            already resolved by the caller (install-assistant-tools' _install_scaffold.uv_release_target).
          required: true
          sensitivity: public
          type:
            kind: string
        archive-extension:
          description: Real uv release-asset archive extension for triple (".tar.gz"
            or ".zip"), already resolved by the caller alongside triple.
          required: true
          sensitivity: public
          type:
            kind: string
        network-timeout:
          description: Per-HTTP-request timeout in seconds for the archive and checksum
            downloads.
          required: false
          sensitivity: public
          type:
            kind: number
      preconditions:
      - id: known-release-asset
        description: triple/archive-extension must name a real published astral-sh/uv
          release asset for the pinned version.
        check:
          kind: argument
          argument_ref: triple
          predicate: present
        unmet_outcome: network-failed
        caller_action: Resolve triple/archive-extension for a platform/architecture
          combination uv actually publishes a release asset for before calling this.
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: On a real bootstrap (uv-bin missing or version-mismatched),
          this performs real network downloads from github.com and atomically overwrites
          uv-bin.
      outputs:
      - id: result
        audience: machine
        description: None on success (uv-bin now holds a binary reporting version,
          or already did).
        direct_io_ref: return-value
        cardinality:
          minimum: 0
          maximum: null
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Always empty on success.
        type:
          kind: string
          sensitivity: public
          description: Python None.
      outcomes:
      - id: completed
        class: success
        outputs: []
        effects:
        - uv-binary-state
        caller_action: Proceed to use uv-bin (e.g. officina.install.managed_runtime.build_candidate_release).
      - id: verification-failed
        class: error
        outputs: []
        effects: []
        caller_action: Retry -- a checksum mismatch usually indicates a corrupted
          or interrupted download rather than a permanent failure. No partial/bad
          binary is left at uv-bin.
      - id: network-failed
        class: error
        outputs: []
        effects: []
        caller_action: Retry once network access to github.com is available, or re-check
          that triple/archive-extension name a real published release asset.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: uv-bin's existing version is checked, and on a real bootstrap the
            archive is downloaded, verified, and installed, once during the call.
        effects:
        - id: uv-binary-state
          direct_io_ref: uv-binary
          action: update
          value_source:
            kind: argument
            argument_ref: version
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: uv-binary
          reversibility:
            irreversible: A prior uv-bin binary is only recoverable by re-bootstrapping
              that version again.
        mutation_safety:
          atomicity:
            per_effect_only: Download and checksum verification happen entirely in
              memory before the single atomic install step; the atomic install itself
              is all-or-nothing.
          concurrent_invocations:
            unsafe: Concurrent bootstrap-uv calls against the same uv-bin are not
              serialized.
          idempotency:
            idempotent: Bootstrapping the same already-matching version again is a
              no-op; bootstrapping the same mismatched version again re-downloads
              and reinstalls the same bytes.
          on_uncertain_completion:
            verify_then_decide: Run uv-bin --version and compare against the pinned
              version before retrying.
          partial_effects_on_failure:
            impossible: Verification happens entirely in memory before the atomic
              install step runs, so a failed download or checksum mismatch never touches
              uv-bin.
          rollback_on_failure:
            unavailable: A prior uv-bin binary (if any) is left untouched on any failure,
              since the atomic install step never runs until verification succeeds.
        verification:
        - method: direct-io-state
          direct_io_ref: uv-binary
      helpers: []
      direct_io:
        reads:
        - id: uv-binary
          medium: local-filesystem
          access: read
          content: existing managed uv executable (for the version no-op check)
          formats:
          - binary
          sensitivity: user-private
          path: <uv-bin>
        writes:
        - id: uv-binary
          medium: local-filesystem
          access: read-write
          content: managed uv executable
          formats:
          - binary
          sensitivity: user-private
          path: <uv-bin>
        - id: return-value
          medium: local-system
          access: write
          content: Python return value
          formats:
          - text
          sensitivity: public
        network:
        - id: uv-release-archive
          medium: network-request
          access: download
          content: real astral-sh/uv GitHub release archive and its same-origin sha256
            checksum sidecar
          formats:
          - binary
          - text
          sensitivity: public
          system: github
          endpoint: https://github.com/astral-sh/uv/releases/download/<version>/uv-<triple>.<ext>
    description: Provides the uv-bootstrap no-op-or-install decision to Python callers
      (currently install-assistant-tools' _phase_entry.py, ahead of officina.install.managed_runtime.build_candidate_release).
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: common.interface.atomic-files
  version: 1
version: 1
