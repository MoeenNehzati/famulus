authority:
  owns_filesystem:
  - allowed_readers:
    - install-assistant-tools._rtx.interface.scripts-install
    match: exact
    path: <famulus-data-root>/runtime
    reason: activate-release is the only writer of the managed-runtime current.json
      pointer and its release directories.
children: {}
content:
- __init__\.py
- install_info\.py
- context\.py
- assistant_access\.py
- development_activation\.py
- doctor\.py
- runtime_pointer\.py
- managed_runtime\.py
- runtime_lock\.py
- launcher_entry\.py
- resolvers/launch\.py
- resolvers/__init__\.py
- uv_bootstrap\.py
description: Parses pinned bootstrap/runtime versions, manages the atomic current.json
  pointer, builds verified managed releases containing the first-party Officina wheel
  plus a generated hash-checked dependency lock, provides the stable path-fixed launcher resolver,
  bootstraps a machine-local managed uv binary, and resolves and activates explicit
  standard or clone-local installation contexts, and resolves the narrow persistent
  state roots granted to managed assistants.
exports:
  install.interface.context:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
      - launchers
      - recurring-tasks._rtx
      - recurring
    source_interface: install.source.context.interface.python-api
  install.interface.assistant-access:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools._rtx
    source_interface: install.source.assistant-access.interface.python-api
  install.interface.development-activation:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
      - launchers
    source_interface: install.source.development-activation.interface.python-api
  install.interface.install-info:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: install.source.install-info.interface.python-api
  install.interface.doctor:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: install.source.doctor.interface.python-api
  install.interface.runtime-pointer:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
      - launchers
      - recurring-tasks._rtx
      - recurring
    source_interface: install.source.runtime-pointer.interface.python-api
  install.interface.managed-runtime:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: install.source.managed-runtime.interface.python-api
  install.interface.launcher-entry:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: install.source.launcher-entry.interface.cli
  install.interface.uv-bootstrap:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: install.source.uv-bootstrap.interface.python-api
gateway:
  language: Python
  path: __init__.py
id: install
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  install.source.init:
    blueprint:
      base: module-root
      path: blueprints/init.yaml
  install.source.context:
    blueprint:
      base: module-root
      path: blueprints/context.yaml
  install.source.assistant-access:
    blueprint:
      base: module-root
      path: blueprints/assistant-access.yaml
  install.source.development-activation:
    blueprint:
      base: module-root
      path: blueprints/development-activation.yaml
  install.source.install-info:
    blueprint:
      base: module-root
      path: blueprints/install-info.yaml
  install.source.doctor:
    blueprint:
      base: module-root
      path: blueprints/doctor.yaml
  install.source.runtime-pointer:
    blueprint:
      base: module-root
      path: blueprints/runtime-pointer.yaml
  install.source.managed-runtime:
    blueprint:
      base: module-root
      path: blueprints/managed-runtime.yaml
  install.source.launcher-entry:
    blueprint:
      base: module-root
      path: blueprints/launcher-entry.yaml
  install.source.uv-bootstrap:
    blueprint:
      base: module-root
      path: blueprints/uv-bootstrap.yaml
version: 1
maturity: stable
