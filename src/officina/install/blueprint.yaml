authority:
  owns_filesystem:
  - allowed_readers:
    - install-assistant-tools.interface.scripts-install
    match: exact
    path: <famulus-data-root>/runtime
    reason: activate-release is the only writer of the managed-runtime current.json pointer and its release directories.
content:
- __init__\.py
- install_info\.py
- runtime_pointer\.py
description: Parses the pinned bootstrap/runtime versions in install-info.toml and manages the atomic current.json pointer for the installed, versioned Famulus runtime.
exports:
  install.interface.install-info:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
    source_interface: install.source.install-info.interface.python-api
  install.interface.runtime-pointer:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
    source_interface: install.source.runtime-pointer.interface.python-api
gateway:
  language: Python
  path: __init__.py
id: install
node_type: module
schema_version: 4
sources:
  install.source.install-info:
    blueprint:
      base: module-root
      path: blueprints/install-info.yaml
  install.source.runtime-pointer:
    blueprint:
      base: module-root
      path: blueprints/runtime-pointer.yaml
version: 1
