authority:
  owns_filesystem: []
children: {}
content:
- __init__\.py
- atomic_files\.py
- codex_toml\.py
- dates\.py
- famulus_paths/__init__\.py
- repository_paths\.py
- toml_io\.py
description: Shared, narrowly exported Python helpers for secure file updates, project
  date keys, OAuth JSON, credential storage, and controlled TOML access.
exports:
  common.interface.atomic-files:
    access:
      allow_all_modules: false
      allowed_callers:
      - install
      - recurring-tasks
      - recurring-tasks._rtx
      - skill-certifier
      - skill-certifier._rtx
      - skill-maker
      - skill-maker._rtx
      - credentials
      - rutter
    source_interface: common.source.atomic-files.interface.python-api
  common.interface.codex-toml:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: common.source.codex-toml.interface.python-api
  common.interface.dates:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan._rtx
    source_interface: common.source.dates.interface.python-api
  common.interface.famulus-paths:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
      - email-triage._rtx
      - install-assistant-tools
      - install-assistant-tools._rtx
      - recurring-tasks
      - recurring-tasks._rtx
      - credentials
    source_interface: common.source.famulus-paths.interface.python-api
  common.interface.repository-paths:
    access:
      allow_all_modules: false
      allowed_callers:
      - skill-certifier
      - skill-certifier._rtx
      - skill-maker
    source_interface: common.source.repository-paths.interface.python-api
  common.interface.toml-io:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools._rtx
      - configuration
    source_interface: common.source.toml-io.interface.python-api
gateway:
  language: Python
  path: __init__.py
id: common
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  common.source.atomic-files:
    blueprint:
      base: module-root
      path: blueprints/atomic-files.yaml
  common.source.codex-toml:
    blueprint:
      base: module-root
      path: blueprints/codex-toml.yaml
  common.source.dates:
    blueprint:
      base: module-root
      path: blueprints/dates.yaml
  common.source.famulus-paths:
    blueprint:
      base: module-root
      path: blueprints/famulus-paths.yaml
  common.source.repository-paths:
    blueprint:
      base: module-root
      path: blueprints/repository-paths.yaml
  common.source.toml-io:
    blueprint:
      base: module-root
      path: blueprints/toml-io.yaml
version: 5
