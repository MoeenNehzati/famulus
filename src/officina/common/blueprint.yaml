      - skill-certifier._rtx
      - skill-maker
    source_interface: common.source.repository-paths.interface.python-api
  common.interface.repository-configuration:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: common.source.repository-configuration.interface.python-api
  common.interface.secret-store:
    access:
      allow_all_modules: false
      allowed_callers:
