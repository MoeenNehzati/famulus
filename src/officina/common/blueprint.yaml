  common.interface.git-provenance:
    access:
      allow_all_modules: false
      allowed_callers:
      - skill-certifier
      - skill-certifier._rtx
      - skill-drift
    source_interface: common.source.git-provenance.interface.python-api
  common.interface.google-credentials:
    access:
      allow_all_modules: false
      allowed_callers:
      - cloud-files
      - cloud-files._rtx
      - connect-google
      - connect-google._rtx
      - email-client
      - email-client._rtx
      - g-calendar
      - g-calendar._rtx
    source_interface: common.source.google-credentials.interface.python-api
  common.interface.oauth-json:
    access:
      allow_all_modules: false
      allowed_callers:
