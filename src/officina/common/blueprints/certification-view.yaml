content:
- certification_view\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/certification-hashing.yaml
  reason: Imports node-hash and certification-basis evaluation from certification_hashing.py.
  source: common.source.certification-hashing
  version: 1
- blueprint:
    base: module-root
    path: blueprints/atomic-files.yaml
  reason: Imports descriptor-safe certificate reads from atomic_files.py.
  source: common.source.atomic-files
  version: 1
- blueprint:
    base: module-root
    path: blueprints/certificate-records.yaml
  reason: Imports certificate log parsing from certificate_records.py.
  source: common.source.certificate-records
  version: 1
- blueprint:
    base: module-root
    path: blueprints/blueprint-graph.yaml
  reason: Imports graph node and repository graph types from blueprint_graph.py.
  source: common.source.blueprint-graph
  version: 1
- blueprint:
    base: module-root
    path: blueprints/blueprint-template.yaml
  reason: Imports schema loading and validation from blueprint_template.py.
  source: common.source.blueprint-template
  version: 1
- blueprint:
    base: module-root
    path: blueprints/git-provenance.yaml
  reason: Imports snapshot capture and commit readiness from git_provenance.py.
  source: common.source.git-provenance
  version: 1
- blueprint:
    base: module-root
    path: blueprints/repository-paths.yaml
  reason: Imports canonical repository-relative path serialization from repository_paths.py.
  source: common.source.repository-paths
  version: 1
description: Evaluates signed certificate logs against current v4 node hashes, dependency state, source commit, certifier identity, and checks, then exposes read-only module-export and source-certificate decisions.
gateway:
  language: Python
  path: certification_view.py
id: common.source.certification-view
interfaces:
  common.source.certification-view.interface.python-api:
    contract:
      arguments:
        operation:
          description: Certification-view operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: certificate-log-path, description: Derive the canonical append-only certificate-log path for one node.}
            - {value: evaluate-currentness, description: Evaluate every v4 node certificate against current derived graph state and Git inputs.}
            - {value: build-record-view, description: Build a read-only view over already verified current certificate records.}
            - {value: check-export, description: Require current certificates for both an exporting module and its implementing source.}
            - {value: lookup-certificate, description: Return current certificate identity for one node when available.}
        graph:
          description: Repository graph and current node-hash states required for currentness evaluation.
          required: false
          sensitivity: user-private
          type: {kind: string, description: Python RepositoryBlueprintGraph plus operation-specific mappings.}
        repository-root:
          description: Repository root containing schemas, certification-basis inputs, and node certificate logs.
          required: false
          sensitivity: user-private
          direct_io_ref: certification-inputs
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read}
        selector:
          description: Operation-specific node, module, interface, version, source ID, public-key root, commit, certifier identity, checks, or verified records.
          required: false
          sensitivity: user-private
          type: {kind: string, description: Operation-specific Python scalar or mapping.}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: Certificate-log path, currentness report, certification decision, current certificate, or read-only certification view.
        direct_io_ref: return-value
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Certificate lookup returns no value when the requested node has no admitted current certificate.
        type: {kind: string, sensitivity: user-private, description: "Operation-specific Python path, dataclass, protocol adapter, or optional certificate."}
      outcomes:
      - {id: completed, class: success, outputs: [result], effects: [], caller_action: Honor the returned currentness or export decision without bypassing missing source certification.}
      - {id: suspect-input, class: error, outputs: [], effects: [], caller_action: "Treat malformed certificate logs, invalid signatures or schemas, unsafe paths, and inconsistent derived state as uncertified."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: Currentness is evaluated against the supplied node states and source commit plus Git and certificate files observed during the call.}
        verification:
        - {method: output-schema, output_ref: result}
      helpers: []
      direct_io:
        reads:
        - {id: certification-inputs, medium: repository-filesystem, access: read, content: "certificate logs, retained public keys, certificate schema, certification-basis files, node inputs, and Git-indexed source state", formats: [jsonl, pem, json-schema, yaml, json, text, binary], sensitivity: user-private, path: "<repository-root>/**", path_match: glob}
        - {id: git-state, medium: local-system, access: read, content: "source commit, index, tracked blobs, and worktree readiness", formats: [git], sensitivity: derived-private, system: git}
        writes:
        - {id: return-value, medium: local-system, access: write, content: Python return value, formats: [python-object], sensitivity: user-private}
        network: []
    description: Evaluates current certificate state and export certification for
      Python callers.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
