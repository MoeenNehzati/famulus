content:
- famulus_paths/__init__\.py
dependencies: []
description: Resolves platform-correct durable Famulus application paths and optional
  normalized plugin context from explicit inputs without filesystem mutation.
gateway:
  language: Python
  path: famulus_paths/__init__.py
id: common.source.famulus-paths
interfaces:
  common.source.famulus-paths.interface.python-api:
    content:
    - famulus_paths/__init__\.py
    uses_interfaces: []
    contract:
      arguments:
        platform:
          description: 'Host platform identifier as returned by sys.platform: darwin,
            win32, or any other value treated as XDG-style POSIX.'
          required: true
          sensitivity: public
          type:
            kind: string
        home:
          description: Absolute path to the caller's home directory used as the base
            for non-override path resolution.
          required: true
          sensitivity: user-private
          direct_io_ref: home-metadata
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read
        environ:
          description: Explicit environment mapping containing platform root overrides
            and, together or not at all, normalized FAMULUS_HOST and
            FAMULUS_PLUGIN_DATA plugin context. Native client variable names are ignored.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Read-only string-to-string mapping; ambient os.environ
              is never consulted.
        name:
          description: Optional declared plugin path selected by FamulusPaths.get;
            omitted when resolving the complete dataclass.
          required: false
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: plugin-data, description: Client-managed persistent plugin root.}
            - {value: logging-path, description: Milestone directory below plugin data.}
            - {value: setup-status, description: Setup readiness file below plugin data.}
      preconditions:
      - id: absolute-home
        description: home must be an absolute path.
        check:
          kind: argument
          argument_ref: home
          predicate: present
        unmet_outcome: invalid-home
        caller_action: Supply an absolute home directory path.
      - id: absolute-environment-roots
        description: Every supplied root override must be non-empty and absolute.
        check:
          kind: argument
          argument_ref: environ
          predicate: present
        unmet_outcome: invalid-home
        caller_action: Remove the override or supply a non-empty absolute path.
      - id: complete-plugin-context
        description: Normalized plugin host and data variables are absent together or
          contain one supported host and an absolute data root.
        check: {kind: argument, argument_ref: environ, predicate: present}
        unmet_outcome: invalid-plugin-context
        caller_action: Supply valid FAMULUS_HOST and FAMULUS_PLUGIN_DATA together.
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: FamulusPaths with legacy roots plus all-or-none plugin fields,
          or one selected absolute plugin path from FamulusPaths.get.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: user-private
          description: Python FamulusPaths dataclass instance or selected pathlib.Path.
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use durable returned fields for application and feature paths.
      - id: invalid-home
        class: refusal
        outputs: []
        effects: []
        caller_action: Supply an absolute home directory path.
      - id: invalid-plugin-context
        class: refusal
        outputs: []
        effects: []
        caller_action: Supply supported, complete normalized plugin context.
      - id: plugin-context-required
        class: refusal
        outputs: []
        effects: []
        caller_action: Request the named path only from a hosted plugin process.
      - id: unknown-path
        class: refusal
        outputs: []
        effects: []
        caller_action: Select one of the three declared plugin path names.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          live: The explicit environment mapping is read once during the call.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads:
        - id: home-metadata
          medium: local-filesystem
          access: read
          content: home directory path used as the resolution base
          formats:
          - path
          sensitivity: user-private
          path: <home>
          path_match: exact
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Python return value
          formats:
          - path
          - text
          sensitivity: user-private
        network: []
    description: Provides complete path resolution and finite named plugin-path lookup.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
