content:
- famulus_paths/__init__\.py
dependencies: []
description: Resolves platform-correct durable Famulus application paths from an
  explicit environment mapping, avoiding ambient process state and the user's
  Documents folder on every platform. Temporary installer/runtime compatibility
  fields remain only for surviving installer callers until Task 11 removes them.
gateway:
  language: Python
  path: famulus_paths/__init__.py
id: common.source.famulus-paths
interfaces:
  common.source.famulus-paths.interface.python-api:
    content:
    - famulus_paths/__init__\.py
    uses_interfaces: []
    contract:
      arguments:
        platform:
          description: 'Host platform identifier as returned by sys.platform: darwin,
            win32, or any other value treated as XDG-style POSIX.'
          required: true
          sensitivity: public
          type:
            kind: string
        home:
          description: Absolute path to the caller's home directory used as the base
            for non-override path resolution.
          required: true
          sensitivity: user-private
          direct_io_ref: home-metadata
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read
        environ:
          description: Explicit environment mapping containing any XDG, APPDATA,
            LOCALAPPDATA, or assistant-home overrides selected by the caller. Missing
            platform path overrides use conventions below the explicit home.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Read-only string-to-string mapping; ambient os.environ
              is never consulted.
      preconditions:
      - id: absolute-home
        description: home must be an absolute path.
        check:
          kind: argument
          argument_ref: home
          predicate: present
        unmet_outcome: invalid-home
        caller_action: Supply an absolute home directory path.
      - id: absolute-environment-roots
        description: Every supplied root override must be non-empty and absolute.
        check:
          kind: argument
          argument_ref: environ
          predicate: present
        unmet_outcome: invalid-home
        caller_action: Remove the override or supply a non-empty absolute path.
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: FamulusPaths dataclass instance with durable data, config, state,
          user-bin, worker, launcher-profile, and feature-state paths. Temporary
          installer/runtime compatibility fields remain pending Task 11.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: user-private
          description: Python FamulusPaths dataclass instance.
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects: []
        caller_action: Use durable returned fields for application paths. Only the
          temporary old installer may use its retained installer/runtime fields.
      - id: invalid-home
        class: refusal
        outputs: []
        effects: []
        caller_action: Supply an absolute home directory path.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          live: The explicit environment mapping is read once during the call.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        reads:
        - id: home-metadata
          medium: local-filesystem
          access: read
          content: home directory path used as the resolution base
          formats:
          - path
          sensitivity: user-private
          path: <home>
          path_match: exact
        writes:
        - id: return-value
          medium: local-system
          access: write
          content: Python return value
          formats:
          - path
          - text
          sensitivity: user-private
        network: []
    description: Provides Famulus path resolution to Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
