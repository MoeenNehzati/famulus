content:
- audit_records\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/atomic-files.yaml
  reason: Imports confined atomic record operations from atomic_files.py.
  source: common.source.atomic-files
  version: 1
- blueprint:
    base: module-root
    path: blueprints/secret-store.yaml
  reason: Imports certification key storage from secret_store.py.
  source: common.source.secret-store
  version: 1
description: Canonicalizes and hashes audit and certificate records, authenticates health records with HMAC, manages Ed25519 certification keys, signs and verifies certificate envelopes, and validates append-only certificate chains.
gateway:
  language: Python
  path: audit_records.py
id: common.source.audit-records
interfaces:
  common.source.audit-records.interface.python-api:
    contract:
      arguments:
        operation:
          description: Record-integrity or certification-key operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: canonicalize, description: "Canonicalize a health record, certificate payload, or certificate envelope."}
            - {value: hash-or-authenticate-record, description: "Compute, attach, or verify legacy digest or HMAC record authentication."}
            - {value: load-key, description: Load an HMAC key or active Ed25519 signing or public key.}
            - {value: create-key, description: Create an absent HMAC key or initial Ed25519 signing-key pair.}
            - {value: rotate-signing-key, description: Generate a new Ed25519 pair and atomically switch the active-key selector.}
            - {value: sign-certificate, description: Sign one canonical certificate payload.}
            - {value: verify-certificate, description: Verify one certificate envelope against retained public material.}
            - {value: parse-certificate-log, description: Parse and verify one canonical hash-linked certificate log.}
        value:
          description: Record, payload, envelope, log bytes, or key material required by the selected operation.
          required: false
          sensitivity: secret
          type: {kind: string, description: Operation-specific Python mapping or bytes value.}
        key-root:
          description: Confined directory containing retained public keys and the active-key selector.
          required: false
          sensitivity: user-private
          direct_io_ref: public-key-store
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: false, access: read-write}
        key-path:
          description: Confined local HMAC key file for load or create operations.
          required: false
          sensitivity: user-private
          direct_io_ref: hmac-key
          type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: false, access: read-write, opaque_content: true}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Key creation and rotation write retained public verification material and store private key material in the configured secret backend.
      - external-side-effect: HMAC key creation creates a new private 32-byte local key file when it is absent.
      outputs:
      - id: result
        audience: machine
        description: Canonical bytes, digest, authenticated record, verification result, signing key, signed envelope, parsed certificate entries, or key bytes.
        direct_io_ref: return-value
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Verification operations can return false; successful parse returns at least one certificate entry.
        type: {kind: string, sensitivity: secret, description: Operation-specific Python return value that can contain authentication or private key material.}
      outcomes:
      - {id: completed-read-only, class: success, outputs: [result], effects: [], caller_action: "Use the returned canonical, authenticated, verified, signed, parsed, or loaded value."}
      - {id: hmac-key-created, class: success, outputs: [result], effects: [hmac-key-file], caller_action: Retain the created local HMAC key as private authentication material.}
      - {id: signing-key-created, class: success, outputs: [result], effects: [key-files, secret-material], caller_action: Use the returned signing key while retaining its public verification material.}
      - {id: signing-key-rotated, class: success, outputs: [result], effects: [key-files, secret-material], caller_action: Use the new active signing key and retain prior public keys for historical verification.}
      - {id: invalid-record, class: error, outputs: [], effects: [], caller_action: "Reject malformed JSON values, invalid hashes or signatures, broken log chains, invalid key files, or inconsistent key identifiers."}
      - {id: key-write-failed, class: partial, outputs: [], effects: [hmac-key-file, key-files, secret-material], caller_action: Inspect retained key files and the secret backend before retrying key creation or rotation.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Verification and key-loading operations use the active selector and retained key files observed during the call; pure canonicalization and authentication are deterministic for their inputs.}
        effects:
        - id: key-files
          direct_io_ref: public-key-store
          action: update
          value_source: {kind: output, output_ref: result}
          may_occur_in_outcomes: [signing-key-created, signing-key-rotated, key-write-failed]
          confirmation_evidence: {kind: direct-io, direct_io_ref: public-key-store}
          reversibility: {compensatable: Restore the previous active-key selector while retaining generated public keys for historical verification.}
        - id: secret-material
          direct_io_ref: secret-store
          action: update
          value_source: {kind: output, output_ref: result}
          may_occur_in_outcomes: [signing-key-created, signing-key-rotated, key-write-failed]
          confirmation_evidence: {kind: direct-io, direct_io_ref: secret-store}
          reversibility: {compensatable: Clear an unused generated private key from the configured secret backend.}
        - id: hmac-key-file
          direct_io_ref: hmac-key
          action: create
          value_source: {kind: output, output_ref: result}
          may_occur_in_outcomes: [hmac-key-created, key-write-failed]
          confirmation_evidence: {kind: direct-io, direct_io_ref: hmac-key}
          reversibility: {compensatable: Remove the local key only after all records authenticated by it are retired.}
        mutation_safety:
          atomicity: {per_effect_only: "Confined public files and the active selector are atomic per file, while secret-store and filesystem updates are separate effects."}
          concurrent_invocations: {safe: Exclusive public-key creation and post-write reload detect collisions; callers must still serialize intentional rotations.}
          idempotency: {non_idempotent: Rotation and absent-key creation generate fresh random key material.}
          on_uncertain_completion: {verify_then_decide: "Reload the active selector, public key, and secret-store pair before generating another key."}
          partial_effects_on_failure: {possible: A generated public or private key can remain retained when a later selector update fails.}
          rollback_on_failure: {available: Initial key creation clears its secret if public-key creation fails; rotation retains prior public material but does not automatically remove a newly stored candidate.}
        verification:
        - {method: output-schema, output_ref: result}
      helpers: []
      direct_io:
        reads:
        - {id: public-key-store, medium: local-filesystem, access: read-write, content: active key ID and retained Ed25519 public PEM files, formats: [text, pem], sensitivity: credential, path: "<key-root>/{active-key-id,*.pub}", path_match: glob, system: filesystem}
        - {id: hmac-key, medium: local-filesystem, access: read-write, content: 32-byte HMAC key, formats: [binary], sensitivity: secret, path: <key-path>, path_match: exact, system: filesystem}
        - {id: secret-store, medium: local-system, access: read, content: Ed25519 private key selected by key ID, formats: [base64], sensitivity: secret, system: configured-secret-backend}
        writes:
        - {id: public-key-store, medium: local-filesystem, access: read-write, content: active key ID and retained Ed25519 public PEM files, formats: [text, pem], sensitivity: credential, path: "<key-root>/{active-key-id,*.pub}", path_match: glob, system: filesystem}
        - {id: hmac-key, medium: local-filesystem, access: read-write, content: 32-byte HMAC key, formats: [binary], sensitivity: secret, path: <key-path>, path_match: exact, system: filesystem}
        - {id: secret-store, medium: local-system, access: write, content: Ed25519 private key selected by key ID, formats: [base64], sensitivity: secret, system: configured-secret-backend}
        - {id: return-value, medium: local-system, access: write, content: Python return value, formats: [python-object], sensitivity: secret}
        network: []
    description: Reads, authenticates, signs, and writes certification records for
      Python callers.
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: cryptography
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Implements the Ed25519 key and signature primitives imported by audit_records.py.
  version: '>=44.0.1'
schema_version: 4
uses_interfaces: []
version: 1
