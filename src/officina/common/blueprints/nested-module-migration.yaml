content:
- migration_candidate\.py
- nested_module_migration\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/atomic-files.yaml
  reason: Reuses confined atomic candidate writes.
  source: common.source.atomic-files
  version: 1
- blueprint:
    base: module-root
    path: blueprints/blueprint-graph.yaml
  reason: Validates the complete materialized candidate through the explicit v5 graph.
  source: common.source.blueprint-graph
  version: 1
- blueprint:
    base: module-root
    path: blueprints/blueprint-inventory.yaml
  reason: Reuses repository blueprint discovery while retaining a converter-owned
    frozen-v4 parser.
  source: common.source.blueprint-inventory
  version: 1
- blueprint:
    base: module-root
    path: blueprints/certificate-records.yaml
  reason: Validates canonical signed v1 history bytes before disposition.
  source: common.source.certificate-records
  version: 1
- blueprint:
    base: module-root
    path: blueprints/certification-hashing.yaml
  reason: Derives the explicit v5 certifier dependency-first closure for history disposition.
  source: common.source.certification-hashing
  version: 1
- blueprint:
    base: module-root
    path: blueprints/git-provenance.yaml
  reason: Binds planning and isolated materialization to exact Git commits and file
    modes.
  source: common.source.git-provenance
  version: 1
description: Plans a deterministic frozen-v4 to nested-module-v5 conversion, recognizes
  an exact all-v5 repository as a no-op, and materializes only an exact reviewed nonempty
  plan into an isolated Git candidate.
gateway:
  language: Python>=3.11
  path: nested_module_migration.py
id: common.source.nested-module-migration
interfaces:
  common.source.nested-module-migration.interface.python-api:
    contract:
      arguments:
        candidate-root:
          description: New output directory used only by materialize.
          direct_io_ref: candidate-tree
          required: false
          sensitivity: user-private
          type:
            access: write
            kind: dir
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
        operation:
          description: Converter operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Build the pure deterministic migration and canonical review
                manifest.
              value: plan
            - description: Materialize the exact plan into a new isolated candidate
                directory.
              value: materialize
        repository-root:
          description: Exact clean Git repository root containing either the homogeneous
            all-v4 source tree to migrate or a homogeneous all-v5 tree to validate
            as a no-op.
          direct_io_ref: source-tree
          required: true
          sensitivity: user-private
          type:
            access: read
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
      caller_warnings:
      - external-side-effect: Materialize creates and commits a new isolated candidate;
          it never writes the source repository.
      direct_io:
        network: []
        reads:
        - access: read
          content: exact homogeneous all-v4 or all-v5 Git tree, blueprint declarations,
            source bytes, histories, and verification keys
          formats:
          - git
          - yaml
          - json
          - jsonl
          - python
          id: source-tree
          medium: repository-filesystem
          path: <repository-root>/**
          path_match: glob
          sensitivity: user-private
        writes:
        - access: write
          content: exact reviewed v5 candidate tree and Git commit
          formats:
          - git
          - yaml
          - json
          - jsonl
          - python
          id: candidate-tree
          medium: local-filesystem
          path: <candidate-root>/**
          path_match: glob
          sensitivity: derived-private
        - access: write
          content: immutable Python migration plan or candidate object
          formats:
          - python-object
          id: result-value
          medium: local-system
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Planning and materialization remain bound to the same exact source
            commit and worktree-index fingerprint.
        effects:
        - action: create
          confirmation_evidence:
            kind: output
            output_ref: result
          direct_io_ref: candidate-tree
          id: candidate-tree
          may_occur_in_outcomes:
          - materialized
          reversibility:
            reversible: Delete the dedicated isolated candidate after review.
          value_source:
            argument_ref: candidate-root
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Candidate files use confined atomic writes; whole-migration
              safety comes from never writing the source tree and deleting failed
              disposable candidates.
          concurrent_invocations:
            unsafe: Two invocations must not select the same candidate-root.
          idempotency:
            idempotent: Replanning the same source is byte-identical and replanning
              the migrated candidate is empty.
          on_uncertain_completion:
            verify_then_decide: Inspect the candidate commit and compare its manifest
              hash before retrying.
          partial_effects_on_failure:
            possible: A host failure can leave a partial disposable candidate, but
              the source repository remains unchanged.
          rollback_on_failure:
            automatic: Ordinary failures remove the newly created disposable candidate
              root; after a host failure the operator may delete only that dedicated
              root.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the canonical manifest before materialization.
        class: success
        effects: []
        id: planned
        outputs:
        - result
      - caller_action: Treat the empty migration plan as confirmation that no cutover
          or materialization is required.
        class: success
        effects: []
        id: already-v5-noop
        outputs:
        - result
      - caller_action: Validate and review the committed candidate before any cutover.
        class: success
        effects:
        - candidate-tree
        id: materialized
        outputs:
        - result
      - caller_action: Resolve the reported ambiguity, collision, history failure,
          or source-state mismatch.
        class: refusal
        effects: []
        id: rejected
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Immutable migration plan or committed isolated candidate.
        direct_io_ref: result-value
        empty: Never empty on success.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Python migration-plan or candidate object.
          kind: string
          sensitivity: derived-private
      preconditions:
      - caller_action: Correct the repository state or add a reviewed migration disposition
          before retrying.
        check:
          argument_ref: repository-root
          kind: argument
          predicate: present
        description: The source is one exact clean Git state accepted as homogeneous
          all-v4 by the frozen parser or homogeneous all-v5 by the canonical v5 inventory
          and graph, with no mixed-version or unresolved ownership state.
        id: exact-homogeneous-source
        unmet_outcome: rejected
    description: Builds an immutable migration plan or materializes that exact plan
      into a new isolated candidate.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces: []
version: 1
