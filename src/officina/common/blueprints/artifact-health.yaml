content:
- artifact_health\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/atomic-files.yaml
  reason: Imports atomic file reads and errors from atomic_files.py.
  source: common.source.atomic-files
  version: 1
- blueprint:
    base: module-root
    path: blueprints/audit-records.yaml
  reason: Imports record authentication helpers from audit_records.py.
  source: common.source.audit-records
  version: 1
- blueprint:
    base: module-root
    path: blueprints/blueprint-graph.yaml
  reason: Imports graph types and resolved content paths from blueprint_graph.py.
  source: common.source.blueprint-graph
  version: 1
- blueprint:
    base: module-root
    path: blueprints/blueprint-template.yaml
  reason: Imports schema loading and validation from blueprint_template.py.
  source: common.source.blueprint-template
  version: 1
- blueprint:
    base: module-root
    path: blueprints/git-provenance.yaml
  reason: Imports Git snapshot and file provenance from git_provenance.py.
  source: common.source.git-provenance
  version: 1
- blueprint:
    base: module-root
    path: blueprints/process-binding-compiler.yaml
  reason: Imports gateway requirement parsing from process_binding_compiler.py.
  source: common.source.process-binding-compiler
  version: 1
description: Resolves certification inputs and contract references, computes deterministic node and certification-basis hashes, derives graph health topology and certifier identity, and builds or checks authenticated legacy health records.
gateway:
  language: Python
  path: artifact_health.py
id: common.source.artifact-health
interfaces:
  common.source.artifact-health.interface.python-api:
    contract:
      arguments:
        operation:
          description: Artifact-health operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: map-route-smoke, description: Map one route-smoke declaration to exact behavioral-source dependencies.}
            - {value: hash-schema, description: Hash the authoritative blueprint schema bundle.}
            - {value: resolve-certification-basis, description: Resolve the repository-owned certification-basis manifest.}
            - {value: hash-certification-basis, description: Hash the resolved certification-basis inputs.}
            - {value: derive-certifier-identity, description: Derive the certifier identity from the v4 graph and node states.}
            - {value: hash-nodes, description: Compute deterministic node hash states from a graph and node-input policy.}
            - {value: inspect-health-topology, description: "Resolve health owners, edges, postorder, local inputs, or health paths."}
            - {value: build-health-record, description: Build and authenticate one legacy node health record.}
            - {value: check-graph-health, description: Compare authenticated legacy health records with the current graph state.}
        graph:
          description: Loaded skill or repository blueprint graph required by graph-oriented operations.
          required: false
          sensitivity: user-private
          type: {kind: string, description: Python SkillBlueprintGraph or RepositoryBlueprintGraph object.}
        repository-root:
          description: Repository root used for v4 policy, Git provenance, and certification-basis operations.
          required: false
          sensitivity: user-private
          direct_io_ref: repository-inputs
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read}
        inputs:
          description: Operation-specific graph state, records, policy path, checks, hashes, source metadata, keys, or route-smoke declaration.
          required: false
          sensitivity: user-private
          type: {kind: string, description: Operation-specific Python values passed by the caller.}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - id: result
        audience: machine
        description: Deterministic hash, resolved paths, graph topology, node states, health record, or health report selected by operation.
        direct_io_ref: return-value
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Collection-valued inspection operations can return an empty collection when the graph contains no matching relationship.
        type: {kind: string, sensitivity: user-private, description: Operation-specific immutable Python value or mapping.}
      outcomes:
      - {id: completed, class: success, outputs: [result], effects: [], caller_action: Consume the deterministic result using the selected operation's Python type.}
      - {id: invalid-input, class: error, outputs: [], effects: [], caller_action: "Correct graph structure, policy, paths, records, hashes, or operation-specific arguments before retrying."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: "Each operation derives its result from the files, Git state, graph values, and records observed during that call; callers needing cross-call consistency must retain one captured source commit."}
        verification:
        - {method: output-schema, output_ref: result}
      helpers: []
      direct_io:
        reads:
        - {id: repository-inputs, medium: repository-filesystem, access: read, content: "node-owned files, blueprints, schemas, hash policy, and certification-basis inputs selected by the operation", formats: [yaml, json, text, binary], sensitivity: user-private, path: "<repository-root>/**", path_match: glob}
        - {id: git-state, medium: local-system, access: read, content: "tracked paths, ignored-path matching, commit tree, and file provenance", formats: [git], sensitivity: derived-private, system: git}
        writes:
        - {id: return-value, medium: local-system, access: write, content: Python return value, formats: [python-object], sensitivity: user-private}
        network: []
    description: Computes deterministic graph health and certification hashes for
      Python callers.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
