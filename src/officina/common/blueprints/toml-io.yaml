content:
- toml_io\.py
dependencies: []
description: Centralizes UTF-8 TOML filename validation, text-file opening with post-write
  parse validation, string serialization, key-value rendering, and profile-config
  discovery.
gateway:
  language: Python
  path: toml_io.py
id: common.source.toml-io
interfaces:
  common.source.toml-io.interface.python-api:
    contract:
      arguments:
        base-or-path:
          description: Base directory for open and discovery, or TOML file path for
            validate.
          direct_io_ref: toml-files
          required: false
          sensitivity: user-private
          type:
            access: read-write
            kind: path
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
        mode:
          default: r
          description: UTF-8 text mode accepted by builtins.open; binary modes are
            rejected.
          required: false
          sensitivity: public
          type:
            kind: string
        name:
          description: Single .toml filename for open, agent name for profile-filename,
            or key for key-value.
          required: false
          sensitivity: user-private
          type:
            kind: string
        operation:
          description: TOML helper to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Open one validated TOML filename under a base directory.
              value: open
            - description: Parse one UTF-8 TOML file.
              value: validate
            - description: Serialize a scalar string.
              value: toml-string
            - description: Render one scalar TOML assignment.
              value: key-value
            - description: Return <agent>.config.toml.
              value: profile-filename
            - description: Yield sorted profile TOML files in a directory.
              value: iter-profile-configs
        value:
          description: Scalar string or Path serialized by toml-string or key-value.
          required: false
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: Closing a write-capable TomlFile validates the resulting
          file but does not roll back invalid content.
      direct_io:
        network: []
        reads:
        - access: read
          content: UTF-8 TOML files and directory entries
          formats:
          - toml
          id: toml-files
          medium: local-filesystem
          path: caller-selected base or file path
          sensitivity: user-private
        writes:
        - access: read-write
          content: UTF-8 TOML file content
          formats:
          - toml
          id: toml-files
          medium: local-filesystem
          path: caller-selected base and validated filename
          sensitivity: user-private
        - access: write
          content: Python return value
          formats:
          - text
          - path-list
          id: return-value
          medium: local-system
          sensitivity: user-private
      execution:
        consistency:
          live: File operations and directory iteration observe state at call or iteration
            time.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: toml-files
            kind: direct-io
          direct_io_ref: toml-files
          id: toml-file-state
          may_occur_in_outcomes:
          - completed
          - invalid
          reversibility:
            irreversible: Invalid write content is not automatically restored after
              close-time parse failure.
          value_source:
            argument_ref: value
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: Writes use ordinary UTF-8 text file handles.
          concurrent_invocations:
            unsafe: No file locking or writer serialization is provided.
          idempotency:
            non_idempotent: Append and update modes can produce different state when
              repeated.
          on_uncertain_completion:
            verify_then_decide: Parse and inspect the target file before retrying.
          partial_effects_on_failure:
            possible: A file can contain written bytes even when close-time TOML validation
              raises.
          rollback_on_failure:
            unavailable: No backup is retained.
        state_effect: mutating
        verification:
        - direct_io_ref: toml-files
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Consume the returned value or continue after successful close-time
          validation.
        class: success
        effects:
        - toml-file-state
        id: completed
        outputs:
        - result
      - caller_action: Correct the filename and mode and key and agent name or TOML
          syntax.
        class: refusal
        effects: []
        id: invalid
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: null
          minimum: 0
        description: Context manager, rendered text, filename, discovered paths, or
          successful validation according to operation.
        direct_io_ref: return-value
        empty: Validation returns no value and discovery may yield no files.
        id: result
        ordering: sorted
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Operation-specific Python return value.
          kind: string
          sensitivity: user-private
      preconditions: []
    description: Provides TOML file operations to Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
