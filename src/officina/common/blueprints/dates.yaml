content:
- dates\.py
dependencies: []
description: Implements the repository's unpadded M-D-YY storage-key formatting, parsing,
  normalization, and current-date lookup.
gateway:
  language: Python
  path: dates.py
id: common.source.dates
interfaces:
  common.source.dates.interface.python-api:
    contract:
      arguments:
        operation:
          description: Date helper to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Format a date or datetime as M-D-YY.
              value: format
            - description: Parse an M-D-YY key into a date in the 2000s.
              value: parse
            - description: Normalize M-D-YY or ISO YYYY-MM-DD text to M-D-YY.
              value: normalize
            - description: Return the host's current local date as M-D-YY.
              value: today
        value:
          description: Date, datetime, or date string accepted by the selected operation;
            omitted for today.
          required: false
          sensitivity: user-private
          type:
            description: Python date or datetime object for format and otherwise text.
            kind: string
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: host local calendar date
          formats:
          - date
          id: system-date
          medium: local-system
          reason: Read only by the today operation.
          sensitivity: public
        writes:
        - access: write
          content: Python return value
          formats:
          - date
          - text
          id: return-value
          medium: local-system
          sensitivity: user-private
      execution:
        consistency:
          snapshot: The today operation samples the host local date once; other operations
            are deterministic.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the canonical key or parsed date.
        class: success
        effects: []
        id: completed
        outputs:
        - result
      - caller_action: Supply a real calendar date in M-D-YY or ISO YYYY-MM-DD form.
        class: error
        effects: []
        id: invalid-date
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Canonical M-D-YY text or a parsed Python date, according to operation.
        direct_io_ref: return-value
        empty: Never empty on success.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Canonical date key or Python date value.
          kind: string
          sensitivity: user-private
      preconditions: []
    description: Provides canonical date operations to Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
