content:
- git_provenance\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/atomic-files.yaml
  reason: Imports confined file reads and atomic source-overlay writes from atomic_files.py.
  source: common.source.atomic-files
  version: 1
- blueprint:
    base: module-root
    path: blueprints/repository-paths.yaml
  reason: Imports canonical repository-relative path serialization from repository_paths.py.
  source: common.source.repository-paths
  version: 1
description: Runs Git without ambient configuration or hooks to capture repository snapshots, classify file provenance, prove commit readiness, pin immutable migration refs, and safely materialize exact commit trees.
gateway:
  language: Python
  path: git_provenance.py
id: common.source.git-provenance
interfaces:
  common.source.git-provenance.interface.python-api:
    contract:
      arguments:
        operation:
          description: Git provenance or materialization operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: run-git, description: "Run one explicit Git command with ambient Git configuration, hooks, and prompts disabled."}
            - {value: capture-snapshot, description: Capture the repository root and exact HEAD containing a path.}
            - {value: compare-head, description: Check whether a captured repository still points to the same HEAD.}
            - {value: ignored-paths, description: Enumerate Git-ignored paths or ignored directories.}
            - {value: file-provenance, description: "Classify one repository file as tracked, ignored, or untracked."}
            - {value: file-provenance-batch, description: "Classify normalized, confined repository files as tracked, ignored, or untracked in bounded Git calls."}
            - {value: check-readiness, description: Prove selected worktree files and index entries equal their captured commit blobs and expected hashes.}
            - {value: read-migration-ref, description: Resolve the immutable mechanical or source-overlay migration ref.}
            - {value: pin-migration-ref, description: Create one reserved migration ref at an exact full commit ID.}
            - {value: materialize-commit, description: Reconstruct one exact commit tree into an existing empty private directory.}
        repository-root:
          description: Git repository root for the selected operation.
          required: true
          sensitivity: user-private
          direct_io_ref: git-repository
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read-write}
        destination:
          description: Existing empty private directory receiving an exact materialized commit tree.
          required: false
          sensitivity: user-private
          direct_io_ref: materialized-tree
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: write}
        inputs:
          description: Operation-specific Git arguments, full commit ID, snapshot, file paths, expected hashes, subprocess input bytes, or non-atomic fallback selection.
          required: false
          sensitivity: user-private
          type: {kind: string, description: Operation-specific Python values supplied by the caller.}
      preconditions:
      - id: repository-present
        description: Git-oriented operations require repository-root to be the exact discovered repository root.
        check: {kind: direct-io, direct_io_ref: git-repository, predicate: exists}
        unmet_outcome: invalid-input
        caller_action: Pass the repository top level discovered by Git.
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Pin operations create reserved refs under refs/famulus and intentionally reject replacement.
      - external-side-effect: Materialization creates the complete commit tree, including confined symlinks and executable modes, in an empty private destination.
      outputs:
      - id: result
        audience: machine
        description: Git command result, snapshot, readiness report, provenance classification, ignored paths, exact commit ID, or sorted materialized paths.
        direct_io_ref: return-value
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Snapshot capture returns no value outside a Git repository; ignored-path and materialized-path collections can be empty.
        type: {kind: string, sensitivity: user-private, description: "Operation-specific Python subprocess result, dataclass, scalar, tuple, or optional snapshot."}
      outcomes:
      - {id: inspected, class: success, outputs: [result], effects: [], caller_action: Use the captured or classified state only for the exact repository and snapshot supplied.}
      - {id: ref-pinned, class: success, outputs: [result], effects: [pin-ref], caller_action: Treat the reserved ref as immutable and do not attempt replacement.}
      - {id: materialized, class: success, outputs: [result], effects: [write-tree], caller_action: Use the destination only after the complete sorted path result is returned.}
      - {id: invalid-input, class: error, outputs: [], effects: [], caller_action: "Correct unavailable commits, unsafe paths or symlinks, nonempty or insecure destinations, repository mismatch, Git errors, or readiness mismatches before retrying."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Commit-sensitive operations first resolve an exact full commit and compare files or materialize blobs from that immutable tree; worktree readiness also observes current index and file state.}
        effects:
        - id: pin-ref
          direct_io_ref: git-refs
          action: update
          value_source: {kind: argument, argument_ref: inputs}
          may_occur_in_outcomes: [ref-pinned]
          confirmation_evidence: {kind: direct-io, direct_io_ref: git-refs}
          reversibility: {compensatable: An operator can delete an erroneously created reserved ref after proving it was never used as migration evidence.}
        - id: write-tree
          direct_io_ref: materialized-tree
          action: create
          value_source: {kind: argument, argument_ref: inputs}
          may_occur_in_outcomes: [materialized]
          confirmation_evidence: {kind: direct-io, direct_io_ref: materialized-tree}
          reversibility: {reversible: Delete the dedicated materialization directory after use.}
        mutation_safety:
          atomicity: {per_effect_only: "Reserved ref creation is one Git ref update, while commit materialization is atomic per regular file but not across the whole tree."}
          concurrent_invocations: {safe: Reserved refs use create-only semantics; materialization requires an initially empty private destination and rejects collisions.}
          idempotency: {non_idempotent: Repeating pinning rejects an existing ref and repeating materialization rejects the nonempty destination.}
          on_uncertain_completion: {verify_then_decide: Read the reserved ref or inspect the dedicated destination before retrying.}
          partial_effects_on_failure: {possible: Materialization can leave a prefix of the commit tree when a later path fails.}
          rollback_on_failure: {unavailable: The helper does not remove already materialized paths or delete a created Git ref automatically.}
        verification:
        - {method: output-schema, output_ref: result}
      helpers: []
      direct_io:
        reads:
        - {id: git-repository, medium: repository-filesystem, access: read, content: "Git worktree inputs, index entries, commit blobs, trees, ignored paths, and repository metadata", formats: [git, binary, text], sensitivity: user-private, path: "<repository-root>/**", path_match: glob}
        - {id: git-refs, medium: local-system, access: read, content: reserved Famulus migration refs, formats: [git-ref], sensitivity: derived-private, system: git}
        writes:
        - {id: git-refs, medium: local-system, access: configure, content: reserved Famulus migration ref, formats: [git-ref], sensitivity: derived-private, system: git}
        - {id: materialized-tree, medium: local-filesystem, access: write, content: exact regular files and confined symlinks from one commit tree, formats: [binary, symlink], sensitivity: user-private, path: "<destination>/**", path_match: glob, system: filesystem}
        - {id: return-value, medium: local-system, access: write, content: Python return value, formats: [python-object], sensitivity: user-private}
        network: []
    description: Captures Git snapshots, file provenance, and commit readiness for
      Python callers.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
