content:
- secret_store\.py
dependencies: []
description: Provides validated secret references and host-neutral store, lookup, require, clear, and display-name operations backed by Python keyring by default.
gateway:
  language: Python
  path: secret_store.py
id: common.source.secret-store
interfaces:
  common.source.secret-store.interface.python-api:
    contract:
      arguments:
        operation:
          description: Secret-store operation to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: store, description: Store a non-empty secret.}
            - {value: lookup, description: Return the secret or null.}
            - {value: require, description: Return the secret or raise when absent.}
            - {value: clear, description: Remove the secret and report whether one was removed.}
            - {value: target-name, description: Return the human-readable Famulus target name without accessing a backend.}
        namespace:
          description: Non-empty Famulus credential namespace without NUL bytes.
          required: true
          sensitivity: user-private
          type: {kind: string}
        key:
          description: Non-empty credential key without NUL bytes.
          required: true
          sensitivity: user-private
          type: {kind: string}
        secret:
          description: Non-empty secret required by store.
          required: false
          sensitivity: secret
          type: {kind: string, sensitivity: secret}
        backend:
          description: Optional SecretBackend instance; when omitted the host keyring backend is used.
          required: false
          sensitivity: public
          type: {kind: string, description: Python object implementing the SecretBackend protocol.}
      preconditions:
      - id: valid-reference
        description: namespace and key must be non-empty strings without NUL bytes.
        check: {kind: argument, argument_ref: namespace, predicate: present}
        unmet_outcome: invalid-reference
        caller_action: Supply valid non-empty namespace and key strings.
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Store and clear change the selected host credential backend.
      outputs:
      - id: result
        audience: machine
        description: Secret text, null, removal boolean, target name, or void according to operation.
        direct_io_ref: credential-store
        cardinality: {minimum: 0, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: lookup returns null when absent; store returns no value.
        type: {kind: string, sensitivity: secret, description: Operation-specific Python return value.}
      outcomes:
      - {id: completed, class: success, outputs: [result], effects: [credential-state], caller_action: Use the returned value without logging secret content.}
      - {id: not-found, class: no-op, outputs: [result], effects: [], caller_action: Prompt for or provision the missing secret if it is required.}
      - {id: invalid-reference, class: refusal, outputs: [], effects: [], caller_action: Correct the namespace and key or secret value.}
      - {id: backend-unavailable, class: error, outputs: [], effects: [], caller_action: Install keyring and configure a usable host credential backend.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Each operation consults the selected backend during the call.}
        effects:
        - id: credential-state
          direct_io_ref: credential-store
          action: update
          value_source: {kind: argument, argument_ref: secret}
          may_occur_in_outcomes: [completed]
          confirmation_evidence: {kind: direct-io, direct_io_ref: credential-store}
          reversibility: {compensatable: A stored secret can be cleared but overwritten prior content is not retained.}
        mutation_safety:
          atomicity: {per_effect_only: Atomicity is delegated to the selected credential backend.}
          concurrent_invocations: {unsafe: The wrapper provides no serialization across backend calls.}
          idempotency: {idempotent: Storing the same value or clearing an absent value leaves equivalent state.}
          on_uncertain_completion: {verify_then_decide: Lookup the reference before deciding whether to retry a store or clear.}
          partial_effects_on_failure: {possible: Backend behavior is host-specific and may complete before raising.}
          rollback_on_failure: {unavailable: The wrapper does not retain prior secret content.}
        verification:
        - {method: direct-io-state, direct_io_ref: credential-store}
      helpers: []
      direct_io:
        reads:
        - {id: credential-store, medium: local-system, access: read, system: host-credential-store, content: secret value and backend availability, formats: [opaque-secret], sensitivity: secret}
        writes:
        - {id: credential-store, medium: local-system, access: configure, system: host-credential-store, content: secret value, formats: [opaque-secret], sensitivity: secret}
        network: []
    description: Provides secret-store operations to Python callers.
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: keyring
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Provides the system credential-store API imported by secret_store.py.
  version: any
schema_version: 4
uses_interfaces: []
version: 1
