content:
- secret_store\.py
dependencies: []
description: Provides validated secret references and host-neutral store, lookup,
  require, clear, and display-name operations backed by Python keyring by default.
gateway:
  language: Python
  path: secret_store.py
id: common.source.secret-store
interfaces:
  common.source.secret-store.interface.python-api:
    contract:
      arguments:
        backend:
          description: Optional SecretBackend instance; when omitted the host keyring
            backend is used.
          required: false
          sensitivity: public
          type:
            description: Python object implementing the SecretBackend protocol.
            kind: string
        key:
          description: Non-empty credential key without NUL bytes.
          required: true
          sensitivity: user-private
          type:
            kind: string
        namespace:
          description: Non-empty Famulus credential namespace without NUL bytes.
          required: true
          sensitivity: user-private
          type:
            kind: string
        operation:
          description: Secret-store operation to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Store a non-empty secret.
              value: store
            - description: Return the secret or null.
              value: lookup
            - description: Return the secret or raise when absent.
              value: require
            - description: Remove the secret and report whether one was removed.
              value: clear
            - description: Return the human-readable Famulus target name without accessing
                a backend.
              value: target-name
        secret:
          description: Non-empty secret required by store.
          required: false
          sensitivity: secret
          type:
            kind: string
            sensitivity: secret
      caller_warnings:
      - external-side-effect: Store and clear change the selected host credential
          backend.
      direct_io:
        network: []
        reads:
        - access: read
          content: secret value and backend availability
          formats:
          - opaque-secret
          id: credential-store
          medium: local-system
          sensitivity: secret
          system: host-credential-store
        writes:
        - access: configure
          content: secret value
          formats:
          - opaque-secret
          id: credential-store
          medium: local-system
          sensitivity: secret
          system: host-credential-store
      execution:
        consistency:
          live: Each operation consults the selected backend during the call.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: credential-store
            kind: direct-io
          direct_io_ref: credential-store
          id: credential-state
          may_occur_in_outcomes:
          - completed
          reversibility:
            compensatable: A stored secret can be cleared but overwritten prior content
              is not retained.
          value_source:
            argument_ref: secret
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Atomicity is delegated to the selected credential backend.
          concurrent_invocations:
            unsafe: The wrapper provides no serialization across backend calls.
          idempotency:
            idempotent: Storing the same value or clearing an absent value leaves
              equivalent state.
          on_uncertain_completion:
            verify_then_decide: Lookup the reference before deciding whether to retry
              a store or clear.
          partial_effects_on_failure:
            possible: Backend behavior is host-specific and may complete before raising.
          rollback_on_failure:
            unavailable: The wrapper does not retain prior secret content.
        state_effect: mutating
        verification:
        - direct_io_ref: credential-store
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the returned value without logging secret content.
        class: success
        effects:
        - credential-state
        id: completed
        outputs:
        - result
      - caller_action: Prompt for or provision the missing secret if it is required.
        class: no-op
        effects: []
        id: not-found
        outputs:
        - result
      - caller_action: Correct the namespace and key or secret value.
        class: refusal
        effects: []
        id: invalid-reference
        outputs: []
      - caller_action: Install keyring and configure a usable host credential backend.
        class: error
        effects: []
        id: backend-unavailable
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 0
        description: Secret text, null, removal boolean, target name, or void according
          to operation.
        direct_io_ref: credential-store
        empty: lookup returns null when absent; store returns no value.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Operation-specific Python return value.
          kind: string
          sensitivity: secret
      preconditions:
      - caller_action: Supply valid non-empty namespace and key strings.
        check:
          argument_ref: namespace
          kind: argument
          predicate: present
        description: namespace and key must be non-empty strings without NUL bytes.
        id: valid-reference
        unmet_outcome: invalid-reference
    description: Provides secret-store operations to Python callers.
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: keyring
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Provides the system credential-store API imported by secret_store.py.
  version: any
schema_version: 6
uses_interfaces: []
version: 1
