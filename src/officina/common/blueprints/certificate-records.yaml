content:
- certificate_records\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/atomic-files.yaml
  reason: Imports confined atomic public-key operations from atomic_files.py.
  source: common.source.atomic-files
  version: 1
- blueprint:
    base: module-root
    path: blueprints/secret-store.yaml
  reason: Imports private certification-key storage from secret_store.py.
  source: common.source.secret-store
  version: 1
- blueprint:
    base: module-root
    path: blueprints/famulus-paths.yaml
  reason: Resolves durable per-home certificate state outside replaceable plugin sources.
  source: common.source.famulus-paths
  version: 1
- blueprint:
    base: module-root
    path: blueprints/certificate-intents.yaml
  reason: Imports the closed secret-free mutation intent used for durable restart recovery.
  source: common.source.certificate-intents
  version: 1
description: Canonicalizes certificate payloads and envelopes, transactionally stages,
  commits, and exactly aborts Ed25519 certification keys in durable Famulus state,
  prepares secret-free restart intents, applies and recovers their exact create or legacy-copy
  lifecycle, migrates matching legacy public state without rotation, signs and verifies
  certificates, and validates append-only hash-linked certificate logs.
gateway:
  language: Python
  path: certificate_records.py
id: common.source.certificate-records
interfaces:
  common.source.certificate-records.interface.python-api:
    contract:
      arguments:
        key-root:
          description: Confined durable Famulus directory containing retained public
            keys and the active-key selector.
          direct_io_ref: public-key-store
          required: false
          sensitivity: user-private
          type:
            access: read-write
            kind: dir
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
        operation:
          description: Certificate-record or signing-key operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Canonicalize a certificate payload or complete envelope.
              value: canonicalize-certificate
            - description: Hash one canonical complete certificate envelope.
              value: hash-envelope
            - description: Load the active Ed25519 signing key or one retained public
                key.
              value: load-key
            - description: Create or verify the initial Ed25519 signing material.
              value: provision-signing-material
            - description: Stage one exact inactive Ed25519 pair without changing the
                active selector.
              value: stage-signing-material
            - description: Commit or resume a staged pair through the active selector.
              value: commit-staged-signing-material
            - description: Remove one exact inactive staged pair and prove private-secret
                absence.
              value: abort-staged-signing-material
            - description: Inspect durable and legacy state without mutation and return
                a reusable identity or one secret-free certificate intent.
              value: prepare-certificate-mutation
            - description: Apply one exact live acknowledged intent without changing
                the active selector.
              value: apply-certificate-mutation
            - description: Commit or resume one exact live intent through the active
                selector.
              value: commit-certificate-mutation
            - description: Abort one exact live pre-selector intent through retained
                backend and public-file authority.
              value: abort-certificate-mutation
            - description: Recover one persisted intent through a newly audited backend
                of the exact journaled concrete identity.
              value: recover-certificate-mutation
            - description: Fail closed or atomically migrate matching repository-local
                public state into durable Famulus state.
              value: migrate-legacy-state
            - description: Generate a new Ed25519 pair and atomically switch the active-key
                selector.
              value: rotate-signing-key
            - description: Sign one canonical certificate payload.
              value: sign-certificate
            - description: Verify one certificate envelope against retained public
                material.
              value: verify-certificate
            - description: Parse and verify one canonical hash-linked certificate
                log.
              value: parse-certificate-log
        value:
          description: Payload, envelope, log bytes, or key identifier required by
            the selected operation.
          required: false
          sensitivity: secret
          type:
            description: Operation-specific Python mapping, string, or bytes value.
            kind: string
      caller_warnings:
      - external-side-effect: Provisioning and rotation write retained public verification
          material and store private key material in the configured secret backend.
      - external-side-effect: The caller must hold the per-home install lock and reuse
          the exact concrete secret-backend object throughout stage, commit, verification,
          abort, and purge.
      - external-side-effect: Transactional stage, commit, and abort require that backend
          object explicitly and expose no non-atomic fallback; selector replacement always
          uses the secure atomic path.
      - external-side-effect: Intent preparation is nonmutating. Apply, commit, abort,
          and recovery require the caller-held per-home install lock; live operations
          require the exact intent and backend objects retained at preparation.
      - external-side-effect: The caller-held install lock must exclude every cooperative
          selector writer across observation and mutation. Each secret, public-file,
          and selector mutation immediately revalidates the selector, but separate
          secret-store and filesystem APIs cannot protect against an uncooperative
          concurrent selector writer outside the held lock.
      - external-side-effect: Recovery recomputes paths from caller capabilities,
          retains one bounded native directory authority across classification and
          every mutation, rejects unexpected names before reading expected entries,
          bounds selector reads to its exact grammar plus one byte and public reads
          to the journaled size plus one byte, and accepts a new backend adapter only
          when its audited concrete identity exactly matches the persisted intent.
          Immediately before each secret clear, relocation, disposal, or selector
          replacement, recovery revalidates the live root identity, complete current
          name set, and exact selector through that same retained authority.
      - external-side-effect: >-
          Live commit and restart recovery share one deterministic retained-root
          selector state machine. The persisted intent ID derives a private build and
          a published stage. A lone regular build may be partial and is securely
          truncated and rewritten; only an exact stage advances to the active selector.
          Build-plus-stage ambiguity, mismatched stage, symbolic link, special entry,
          malformed or third canonical selector, or any unjournaled name fails closed.
          Abort disposes a lone partial build or exact stage before inactive-pair cleanup.
      direct_io:
        network: []
        reads:
        - access: read-write
          content: active key ID and retained Ed25519 public PEM files
          formats:
          - text
          - pem
          id: public-key-store
          medium: local-filesystem
          path: <key-root>/{active-key-id,*.pub}
          path_match: glob
          sensitivity: credential
          system: filesystem
        - access: read
          content: one-time repository-local active key ID and retained public PEM files
          formats:
          - text
          - pem
          id: legacy-public-key-store
          medium: local-filesystem
          path: $repo/skills/skill-certifier/.certificates/public-keys/{active-key-id,*.pub}
          path_match: glob
          sensitivity: credential
          system: filesystem
        - access: read
          content: Ed25519 private key selected by key ID
          formats:
          - base64
          id: secret-store
          medium: local-system
          sensitivity: secret
          system: configured-secret-backend
        writes:
        - access: read-write
          content: active key ID and retained Ed25519 public PEM files
          formats:
          - text
          - pem
          id: public-key-store
          medium: local-filesystem
          path: <famulus-data>/certificates/public-keys/{active-key-id,*.pub}
          path_match: glob
          sensitivity: credential
          system: filesystem
        - access: write
          content: Ed25519 private key selected by key ID
          formats:
          - base64
          id: secret-store
          medium: local-system
          sensitivity: secret
          system: configured-secret-backend
        - access: write
          content: Python return value
          formats:
          - python-object
          id: return-value
          medium: local-system
          sensitivity: secret
      execution:
        consistency:
          live: Verification and key loading use the active selector and retained
            public files observed during the call; staged transactions bind the exact
            backend object and tracked public-file identity; live intents bind the exact
            intent and backend objects, while restart recovery binds a fresh audited adapter
            by exact concrete identity and keeps one retained bounded-directory authority
            from classification through final verification or cleanup; canonicalization
            is deterministic.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: public-key-store
            kind: direct-io
          direct_io_ref: public-key-store
          id: key-files
          may_occur_in_outcomes:
          - signing-key-created
          - signing-key-rotated
          - signing-key-staged
          - certificate-intent-lifecycle
          - key-write-failed
          reversibility:
            compensatable: Before selector replacement, abort the exact inactive candidate;
              after replacement, retain the pair as committed and claim no rollback.
          value_source:
            kind: output
            output_ref: result
        - action: update
          confirmation_evidence:
            direct_io_ref: secret-store
            kind: direct-io
          direct_io_ref: secret-store
          id: secret-material
          may_occur_in_outcomes:
          - signing-key-created
          - signing-key-rotated
          - signing-key-staged
          - certificate-intent-lifecycle
          - key-write-failed
          reversibility:
            compensatable: Clear an unused generated private key from the configured
              secret backend.
          value_source:
            kind: output
            output_ref: result
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: A unique private/public pair is verified before one atomic
              selector replacement; secret-store and filesystem writes remain separate
              effects whose exact inactive candidate is compensatable.
          concurrent_invocations:
            safe: The caller holds the one per-home install lock across staging,
              commit or abort, and post-commit verification; explicit rotation uses the
              same serialization requirement.
          idempotency:
            idempotent: A valid active identity returns created false without rotation;
              absent-key staging and explicit rotation generate fresh random material.
          on_uncertain_completion:
            verify_then_decide: A selector naming the staged key resumes as committed;
              a prior selector permits exact abort; a malformed or third selector fails
              closed without deleting either potentially active pair. Restart recovery
              applies the same selector rule after validating every intended public file
              and the exact private-key identity before any cleanup.
              A lone intent-derived build is rewritten and published on commit or
              discarded on pre-selector abort. An exact stage resumes the active rename
              on commit or is exactly disposed on abort; canonical intended plus a lone
              build or exact stage completes the same chain before committed verification.
          partial_effects_on_failure:
            possible: A pair remains retained after selector replacement or when selector
              state is ambiguous so recovery never claims rollback.
          rollback_on_failure:
            available: Before selector replacement, abort clears and verifies absence
              of the exact secret, removes only the identity-bound public candidate, and
              durably syncs its parent; after replacement the pair is retained as committed.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the returned canonical, verified, parsed, or loaded value.
        class: success
        effects: []
        id: completed-read-only
        outputs:
        - result
      - caller_action: Retain public verification material and protect the private
          secret.
        class: success
        effects:
        - key-files
        - secret-material
        id: signing-key-created
        outputs:
        - result
      - caller_action: Retain prior public keys for historical verification.
        class: success
        effects:
        - key-files
        - secret-material
        id: signing-key-rotated
        outputs:
        - result
      - caller_action: Journal the non-secret staged identity and later commit or abort
          it through the same backend object while holding the install lock.
        class: success
        effects:
        - key-files
        - secret-material
        id: signing-key-staged
        outputs:
        - result
      - caller_action: Durably journal the secret-free intent before apply, or persist
          the closed abandoned, aborted, staged, or committed recovery disposition.
        class: success
        effects:
        - key-files
        - secret-material
        id: certificate-intent-lifecycle
        outputs:
        - result
      - caller_action: Reject malformed values, invalid hashes or signatures, broken
          chains, or inconsistent key identifiers.
        class: error
        effects: []
        id: invalid-certificate
        outputs: []
      - caller_action: Inspect retained public files and the secret backend before
          retrying.
        class: partial
        effects:
        - key-files
        - secret-material
        id: key-write-failed
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Canonical bytes, envelope hash, verification result, signing
          key, signed envelope, parsed certificate entries, public key, secret-free
          mutation intent, or closed mutation disposition.
        direct_io_ref: return-value
        empty: Verification can return false; successful log parsing returns at least
          one entry.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Operation-specific Python return value that can contain private
            key material.
          kind: string
          sensitivity: secret
      preconditions: []
    description: Manages Ed25519 keys and canonical append-only certificate records
      for Python callers.
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: cryptography
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Implements Ed25519 key and signature primitives.
  version: '>=44.0.1'
schema_version: 6
uses_interfaces: []
version: 1
