content:
- atomic_files\.py
dependencies: []
description: Implements confined regular-file reads and secure replace, create, append,
  compare-and-append, bounded name-only directory enumeration, retained bounded-directory
  inventory authority, platform-scoped existing-file recovery authority, and deterministic
  mutation-ID-addressed file, symlink, empty-directory, and exact-symlink-deletion
  publication, with an explicit non-atomic fallback only for ordinary file operations.
gateway:
  language: Python
  path: atomic_files.py
id: common.source.atomic-files
interfaces:
  common.source.atomic-files.interface.python-api:
    contract:
      arguments:
        allow-non-atomic:
          default: false
          description: Permit the confined fallback only when secure native operations
            are unavailable.
          required: false
          sensitivity: public
          type:
            kind: boolean
        build-id:
          description: Durable mutation ID used to derive the only accepted deterministic
            sibling build name for restartable publication.
          required: false
          sensitivity: user-private
          type:
            description: Exactly 32 lowercase hexadecimal characters.
            kind: string
        allowed-root:
          description: Directory boundary that must contain path.
          direct_io_ref: allowed-root-namespace
          required: true
          sensitivity: user-private
          type:
            access: read-write
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        data:
          description: Bytes written or appended by mutation operations.
          required: false
          sensitivity: user-private
          type:
            description: Python bytes value; omitted for read.
            kind: string
        directory-root:
          description: Retained no-follow directory authority whose child names are
            enumerated by read-bounded-directory-names.
          direct_io_ref: directory-names
          required: false
          sensitivity: user-private
          type:
            access: read
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        expected-previous-bytes:
          description: Complete expected predecessor bytes, or null when absence is
            expected, for compare-and-append.
          required: false
          sensitivity: user-private
          type:
            description: Python bytes value or null.
            kind: string
        expected-before:
          description: Complete closed target state that deterministic publication
            validates while holding caller-supplied namespace isolation; it is not
            a conditional compare-and-swap token for POSIX rename or unlink. Observed
            file and directory modes may include all bits through 0o7777.
          required: false
          sensitivity: user-private
          type:
            description: Python mapping in the caller's closed filesystem-state schema.
            kind: string
        expected-bytes:
          description: Complete expected bytes required before retaining native cleanup
            authority for an existing regular file.
          required: false
          sensitivity: user-private
          type:
            description: Python bytes value used only by track-existing.
            kind: string
        mode:
          default: 384
          description: Publishable POSIX permission bits through 0o777; callers must
            remove set-id and sticky bits before recording durable intent. On Windows the helper
            normalizes these to the closed observable read-only policy for files
            or directories and verifies that normalized attribute state.
          required: false
          sensitivity: public
          type:
            kind: integer
            maximum: 511
            minimum: 0
        max-entries:
          description: Positive caller-selected bound on names returned by name-only
            directory enumeration.
          required: false
          sensitivity: public
          type:
            kind: integer
            maximum: 4096
            minimum: 1
        max-name-bytes:
          description: Positive caller-selected filesystem-encoded byte bound for
            every returned directory component.
          required: false
          sensitivity: public
          type:
            kind: integer
            maximum: 4096
            minimum: 1
        maximum-bytes:
          description: Caller-selected upper bound for a direct bounded read or a
            retained-inventory relative regular-file read.
          required: false
          sensitivity: public
          type:
            kind: integer
            minimum: 0
        quarantine-id:
          description: Durable 128-bit capability used to derive the only confined
            quarantine name accepted by track-existing.
          required: false
          sensitivity: user-private
          type:
            description: Exactly 32 lowercase hexadecimal characters.
            kind: string
        staging-capability:
          description: Durable 128-bit capability used to derive the only confined,
            restart-addressable private build and published-stage names accepted by
            retained-inventory replacement or selector-transaction disposal.
          required: false
          sensitivity: user-private
          type:
            description: Exactly 32 lowercase hexadecimal characters.
            kind: string
        operation:
          description: Atomic-files function to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Read one confined regular file as bytes.
              value: read
            - description: Replace one confined file with supplied bytes.
              value: replace
            - description: Create one confined file only if absent.
              value: create
            - description: Append one complete byte frame.
              value: append
            - description: Append only when the complete predecessor bytes match.
              value: compare-and-append
            - description: Enumerate only bounded child names through one retained
                no-follow native directory authority, without opening or reading any
                child payload.
              value: read-bounded-directory-names
            - description: Retain one no-follow or no-reparse root authority and its
                bounded closed name set; allow bounded reads of expected relative
                regular files, complete-set and live-root identity revalidation,
                same-root tracked-file acquisition, restart-addressable deterministic
                build, stage, and replacement, private transaction disposal, and explicit
                release or context management.
              value: retain-bounded-directory-inventory
            - description: Open an existing confined regular file, verify its complete
                bounded bytes and native identity at exactly the canonical name or the
                quarantine name derived from quarantine-id. Return stateful authority
                for resumable no-replace relocation, separate quarantine-only disposal,
                or release. Both-name ambiguity and third state fail closed.
              value: track-existing
            - description: Rewrite one deterministic regular build, revalidate the
                exact retained target state, then atomically publish supplied bytes.
              value: publish-bytes
            - description: Validate or create one deterministic exact lexical symlink
                build, revalidate the target, then atomically replace its name.
              value: publish-symlink
            - description: Validate or create one deterministic empty directory build
                and publish it only to an exactly absent leaf without creating ancestors.
              value: publish-empty-directory
            - description: Revalidate and remove only one exact confined lexical symlink.
              value: unlink-exact-symlink
        path:
          description: Destination or source leaf confined beneath allowed-root;
            the operation selects byte-file, symlink, directory, or exact symlink
            semantics before any deterministic build effect.
          direct_io_ref: target-file
          required: false
          sensitivity: user-private
          type:
            access: read-write
            kind: file
            must_exist: false
            opaque_content: true
            relative_to: caller-cwd
            syntax: literal
      caller_warnings:
      - external-side-effect: Mutation operations create or change a local file; compare-and-append
          may fail when another writer changes it. Track-existing relocation leaves
          the file at its one journal-derived quarantine after uncertain completion;
          disposal is allowed only from verified quarantine and release retains it.
      - external-side-effect: >-
          On POSIX, track-existing requires a private state root and caller-held
          install lock that exclude uncooperative same-identity processes retaining
          writable descriptors or reading, guessing, or replacing the quarantine
          capability name. Canonical-path replacement before or during relocation
          remains fail-closed. Portable POSIX APIs cannot conditionally unlink by
          inode, so disposal makes no exact-deletion claim against the excluded class.
          Windows retains its verified-handle deletion guarantee: relocation flushes
          the writable retained file handle and verifies the live name and bytes;
          disposal closes the delete-marked handle and proves the quarantine name
          absent through the retained parent. This implementation does not fsync
          Windows directory metadata and therefore does not claim power-loss
          durability for those namespace transitions.
      - external-side-effect: Name-only enumeration fails closed when either caller
          bound is exceeded and never opens or reads a child entry; callers must reject
          unexpected names before selecting expected entries for payload reads.
      - external-side-effect: Retained bounded-directory inventory keeps one securely
          opened native root identity across classification and mutation. Reads are
          limited to initially observed names and caller bounds; revalidation compares
          both the complete current name set and the live path identity. Relative
          tracking and replacement remain anchored to the retained root. Callers must
          release the authority, normally with its context manager, after releasing
          child tracked-file authorities.
      - external-side-effect: >-
          Retained-inventory replacement derives deterministic private build and
          published-stage names from staging-capability. An absent or interrupted
          regular build is securely created or truncated and rewritten, bounded-reread,
          file-synced, and directory-synced before a no-replace build-to-stage rename.
          Only an exact stage advances atomically to the destination. Build-plus-stage,
          mismatched stage, symbolic link, special entry, or third private name fails
          closed. Every build creation, build-to-stage publish, stage-to-destination
          rename, and build-or-stage disposal updates the complete expected names.
          Windows mirrors the retained-handle state machine and does not rely on live
          process cleanup for restart recovery.
      - external-side-effect: >-
          Deterministic publication derives exactly one sibling build name from build-id.
          A regular build is accepted only with link count one before truncation and
          is revalidated by identity, content, mode, and link count through publication.
          Existing POSIX builds are no-follow classified by their retained parent before
          any permission change; owner read/write bits are restored only on that validated
          single-link identity, the writable reopen is revalidated, and its descriptor is
          retained through rewrite, final-mode restoration, exact verification, and rename.
          This remains restartable when the requested final mode is 0444 or 0000, including
          after death immediately following temporary permission repair. Existing native
          builds are first opened without write-data rights and validated by identity, live
          name, bounded bytes, attributes, and ACL; READONLY is cleared only afterward, and
          the inspection handle must report link count one again immediately before
          READONLY is cleared. Both the inspection and write-data handles must report link count one before
          permission or byte mutation. The write-data reopen must identify the same writable object before rewrite. The
          requested closed mode is restored and verified before publication. Regular partial builds are securely truncated and rewritten; wrong-type builds,
          mismatched symlink builds, nonempty or wrong-mode directory builds, changed
          targets, unsafe ancestors, and unsupported Windows symlink capability fail
          closed before an ineligible target can create or change a build. POSIX callers
          must hold the per-home InstallLock and use a private user-owned parent namespace;
          the contract excludes uncooperative writers to the final or deterministic build
          name, same-identity writers, and retained writable source descriptors. POSIX
          rename and unlink are not conditional by inode. Windows symlink publication and
          exact unlink retain no-reparse handles, validate the lexical target and live name,
          and either prove completion or raise a typed capability failure. File bytes and
          directory entries are synchronized where the native platform supports it. A crash
          leaves an inspectable target/build state and the same durable request can resume.
      direct_io:
        network: []
        reads:
        - access: read
          content: retained no-follow namespace authority and ancestor metadata
          formats:
          - directory-entry
          id: allowed-root-namespace
          medium: local-filesystem
          path: <allowed-root>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: bounded child entry names without child payloads
          formats:
          - text
          id: directory-names
          medium: local-filesystem
          path: <directory-root> immediate children
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: confined regular-file bytes
          formats:
          - binary
          id: target-file
          medium: local-filesystem
          path: <path> beneath <allowed-root>
          sensitivity: user-private
        writes:
        - access: read-write
          content: confined regular-file bytes
          formats:
          - binary
          id: target-file
          medium: local-filesystem
          path: <path> beneath <allowed-root>
          sensitivity: user-private
        - access: read-write
          content: one exact lexical symbolic-link target
          formats:
          - text
          id: target-symlink
          medium: local-filesystem
          path: <path> beneath <allowed-root>
          sensitivity: user-private
        - access: read-write
          content: one empty directory entry with platform-observable mode
          formats:
          - directory-entry
          id: target-directory
          medium: local-filesystem
          path: <path> beneath <allowed-root>
          sensitivity: user-private
      execution:
        consistency:
          live: Reads and mutations operate on the file state observed during the
            call. Name-only enumeration returns one bounded snapshot. Retained inventory
            keeps the same no-follow or no-reparse root authority across bounded expected-file
            reads, complete-set and root-identity revalidation, and relative mutations.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: target-file
            kind: direct-io
          direct_io_ref: target-file
          id: byte-file-state
          may_occur_in_outcomes:
          - completed
          reversibility:
            irreversible: The helper does not retain the previous bytes for rollback.
          value_source:
            argument_ref: data
            kind: argument
        - action: update
          confirmation_evidence:
            direct_io_ref: target-symlink
            kind: direct-io
          direct_io_ref: target-symlink
          id: symlink-state
          may_occur_in_outcomes:
          - completed
          reversibility:
            irreversible: The helper does not retain the previous lexical target.
          value_source:
            argument_ref: data
            kind: argument
        - action: update
          confirmation_evidence:
            direct_io_ref: target-directory
            kind: direct-io
          direct_io_ref: target-directory
          id: directory-state
          may_occur_in_outcomes:
          - completed
          reversibility:
            irreversible: The helper does not retain a replaced namespace entry.
          value_source:
            argument_ref: mode
            kind: argument
        - action: delete
          confirmation_evidence:
            direct_io_ref: target-symlink
            kind: direct-io
          direct_io_ref: target-symlink
          id: symlink-deletion
          may_occur_in_outcomes:
          - completed
          reversibility:
            irreversible: The helper does not retain the removed lexical target.
          value_source:
            argument_ref: expected-before
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Secure operations are atomic per namespace publication;
              deterministic publication never uses the explicit fallback. The fallback
              for ordinary file operations is confined but non-atomic.
          concurrent_invocations:
            unsafe: Concurrent use is outside this low-level interface's standalone
              guarantee. Deterministic POSIX publication and exact unlink require the
              caller-held per-home InstallLock and private user-owned parent namespace
              described in caller warnings; uncooperative same-identity or name writers
              are outside the contract. Ordinary native file operations still use their
              documented platform synchronization and final-state checks.
          idempotency:
            non_idempotent: Append operations add another frame when repeated.
          on_uncertain_completion:
            verify_then_decide: For track-existing, inspect the canonical name and the
              one quarantine name derived from the durable capability. For retained-inventory
              replacement, inspect the canonical destination and deterministic build
              and stage derived from staging-capability; a lone build is repairable,
              exact staged bytes resume rename, and build-plus-stage or mismatched
              stage fails closed. For deterministic publication, inspect the canonical
              destination and the sole build derived from build-id; resume only from
              expected-before or adopt the exact intended state. For other operations,
              read the confined file and compare its complete bytes.
          partial_effects_on_failure:
            possible: The explicit non-atomic fallback or a late durability failure
              can leave changed file state.
          rollback_on_failure:
            unavailable: No previous content is retained.
        state_effect: mutating
        verification:
        - direct_io_ref: target-file
          method: direct-io-state
        - direct_io_ref: target-symlink
          method: direct-io-state
        - direct_io_ref: target-directory
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the returned bytes or boolean and continue after a void
          mutation.
        class: success
        effects:
        - byte-file-state
        - symlink-state
        - directory-state
        - symlink-deletion
        id: completed
        outputs:
        - result
      - caller_action: Correct confinement and path type and argument type and platform-capability
          requirements before retrying.
        class: refusal
        effects: []
        id: rejected
        outputs: []
      - caller_action: Reread the file and decide whether to retry compare-and-append.
        class: error
        effects: []
        id: conflict
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Read bytes, the create boolean, stateful platform-scoped file
          or retained-directory authority, or successful completion for void mutation
          operations.
        direct_io_ref: target-file
        empty: Void mutation operations return no value after verification.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Python return value whose concrete type depends on operation,
            including TrackedExistingFile for track-existing and RetainedBoundedDirectoryInventory
            for retain-bounded-directory-inventory.
          kind: string
          sensitivity: user-private
      preconditions:
      - caller_action: For path-based operations, pass a canonical leaf beneath an
          existing allowed root; byte operations accept absent, regular, or the
          documented legacy-link case, symlink publication accepts absent or symlink,
          directory publication accepts absent or directory, and exact unlink accepts
          only a symlink. Directory-inventory operations use directory-root instead.
        check:
          argument_ref: path
          kind: argument
          predicate: present
        description: path must resolve beneath allowed-root without an unsafe ancestor,
          and its leaf kind must be eligible for the selected operation before build work.
        id: confined-path
        unmet_outcome: rejected
    description: Provides atomic file operations to Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
