content:
- atomic_files\.py
dependencies: []
description: Implements confined regular-file reads, secure replace, create, append,
  compare-and-append, compare-and-replace, compare-and-delete, and advisory sidecar
  locking on POSIX and Windows, with an explicit non-atomic fallback.
gateway:
  language: Python
  path: atomic_files.py
id: common.source.atomic-files
interfaces:
  common.source.atomic-files.interface.python-api:
    content:
    - atomic_files\.py
    uses_interfaces: []
    contract:
      arguments:
        allow-non-atomic:
          default: false
          description: Permit the confined fallback only when secure native operations
            are unavailable.
          required: false
          sensitivity: public
          type:
            kind: boolean
        allowed-root:
          description: Directory boundary that must contain path.
          direct_io_ref: target-file
          required: true
          sensitivity: user-private
          type:
            access: read-write
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        data:
          description: Bytes written or appended by mutation operations.
          required: false
          sensitivity: user-private
          type:
            description: Python bytes value; omitted for read.
            kind: string
        expected-previous-bytes:
          description: Complete expected predecessor bytes for compare-and-append,
            compare-and-replace, or compare-and-delete; compare-and-replace alone
            also accepts null when absence is expected.
          required: false
          sensitivity: user-private
          type:
            description: Python bytes value or null.
            kind: string
        expected-previous-mode:
          description: Exact predecessor permission bits required by compare-and-replace
            when a file is expected and by compare-and-delete.
          required: false
          sensitivity: public
          type:
            kind: integer
            maximum: 4095
            minimum: 0
        mode:
          default: 384
          description: Requested file permission bits for mutation operations.
          required: false
          sensitivity: public
          type:
            kind: integer
            maximum: 4095
            minimum: 0
        operation:
          description: Atomic-files function to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Read one confined regular file as bytes.
              value: read
            - description: Replace one confined file with supplied bytes.
              value: replace
            - description: Create one confined file only if absent.
              value: create
            - description: Append one complete byte frame.
              value: append
            - description: Append only when the complete predecessor bytes match.
              value: compare-and-append
            - description: Publish complete replacement bytes after checking predecessor bytes and POSIX mode; Windows verifies a restrictive native DACL instead of treating coarse st_mode bits as ACL identity.
              value: compare-and-replace
            - description: Remove one file after checking predecessor bytes and POSIX mode; Windows verifies native handles and ACLs rather than coarse st_mode bits.
              value: compare-and-delete
            - description: Hold one confined regular sidecar as a cooperative process lock.
              value: exclusive-lock
        path:
          description: Destination or source file confined beneath allowed-root.
          direct_io_ref: target-file
          required: true
          sensitivity: user-private
          type:
            access: read-write
            kind: file
            must_exist: false
            opaque_content: true
            relative_to: caller-cwd
            syntax: literal
      caller_warnings:
      - external-side-effect: Mutation operations create, change, or remove a local file;
          compare operations may fail when another writer changes it. Exclusive locking serializes only callers
          that acquire the same stable sidecar; it does not govern direct edits or external
          systems. Handle confinement rejects path and symlink swaps, but a noncooperating
          already-open writer can race the separate final comparison and publication steps;
          callers must verify post-state and recover when required.
      direct_io:
        network: []
        reads:
        - access: read
          content: confined regular-file bytes
          formats:
          - binary
          id: target-file
          medium: local-filesystem
          path: <path> beneath <allowed-root>
          sensitivity: user-private
        writes:
        - access: read-write
          content: confined regular-file bytes
          formats:
          - binary
          id: target-file
          medium: local-filesystem
          path: <path> beneath <allowed-root>
          sensitivity: user-private
      execution:
        consistency:
          live: Reads and mutations operate on the file state observed during the
            call; an exclusive-lock operation retains its sidecar lock for the caller's
            context-manager scope.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: target-file
            kind: direct-io
          direct_io_ref: target-file
          id: file-state
          may_occur_in_outcomes:
          - completed
          reversibility:
            irreversible: The helper does not retain the previous bytes for rollback.
          value_source:
            argument_ref: data
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Secure operations are atomic per file; the explicit fallback
              is confined but non-atomic, and comparison plus publication is not a portable
              byte compare-and-swap transaction.
          concurrent_invocations:
            unsafe: Handle confinement rejects path and symlink swaps, and exclusive-lock
              callers serialize cooperating operations through one stable sidecar. A
              noncooperating already-open writer can race the separate final comparison
              and publication steps, so callers must verify post-state and recover.
          idempotency:
            non_idempotent: Append operations add another frame when repeated.
          on_uncertain_completion:
            verify_then_decide: Read the confined file and compare its complete bytes
              before retrying.
          partial_effects_on_failure:
            possible: The explicit non-atomic fallback or a late durability failure
              can leave changed file state.
          rollback_on_failure:
            unavailable: No previous content is retained.
        state_effect: mutating
        verification:
        - direct_io_ref: target-file
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the returned bytes or boolean and continue after a void
          mutation.
        class: success
        effects:
        - file-state
        id: completed
        outputs:
        - result
      - caller_action: Correct confinement and path type and argument type and platform-capability
          requirements before retrying.
        class: refusal
        effects: []
        id: rejected
        outputs: []
      - caller_action: Reread the file and decide whether to retry the compare-and-append,
          compare-and-replace, or compare-and-delete operation.
        class: error
        effects: []
        id: conflict
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Read bytes, the create boolean, or successful completion for
          void mutation operations.
        direct_io_ref: target-file
        empty: Void mutation operations return no value after verification.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Python return value whose concrete type depends on operation.
          kind: string
          sensitivity: user-private
      preconditions:
      - caller_action: Pass a regular-file path beneath an existing allowed root.
        check:
          argument_ref: path
          kind: argument
          predicate: present
        description: path must resolve beneath allowed-root without an unsafe symlink
          or non-regular final entry.
        id: confined-path
        unmet_outcome: rejected
    description: Provides atomic file operations to Python callers.
    version: 2
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 2
maturity: stable
