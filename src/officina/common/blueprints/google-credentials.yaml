content:
- google_credentials\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/famulus-paths.yaml
  reason: Resolves the canonical Google client and credential-registry paths under
    the Famulus config root.
  source: common.source.famulus-paths
  version: 1
- blueprint:
    base: module-root
    path: blueprints/secret-store.yaml
  reason: Stores the Google OAuth client secret and per-account refresh tokens through
    the host credential store instead of plaintext.
  source: common.source.secret-store
  version: 1
- blueprint:
    base: module-root
    path: blueprints/oauth-json.yaml
  reason: Atomically writes the canonical client JSON (with client_secret replaced
    by client_secret_ref) using the shared secure writer.
  source: common.source.oauth-json
  version: 1
description: Resolves the canonical Google Desktop OAuth client path, stores its client
  secret in the host secret store instead of plaintext, and maintains a per-account
  Google credential registry shared by connect-google's service consumers.
gateway:
  language: Python
  path: google_credentials.py
id: common.source.google-credentials
interfaces:
  common.source.google-credentials.interface.python-api:
    contract:
      arguments:
        operation:
          description: Google-credentials operation to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: normalize-services
              description: Validate and dedupe a requested service list.
            - value: scope-union-for-services
              description: Return the OAuth scope union for the requested services
                plus identity scopes.
            - value: install-client
              description: Store the client secret in the secret store and write the
                remaining client JSON to the canonical path.
            - value: client-status
              description: Report whether the canonical client is installed without
                exposing secrets.
            - value: store-credential
              description: Store a per-account refresh token under a unique opaque
                reference and atomically publish a schema-version-2 registry record.
            - value: load-credential
              description: Load a per-account credential registry record.
            - value: refresh-access-token
              description: Exchange a stored refresh token for a fresh access token
                after checking granted scopes locally.
        home:
          description: Home directory used to resolve the canonical client, credential
            registry, and Famulus config paths.
          required: true
          sensitivity: user-private
          direct_io_ref: home-metadata
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read
        platform:
          description: 'Host platform identifier as returned by sys.platform: darwin,
            win32, or any other value treated as XDG-style POSIX.'
          required: true
          sensitivity: public
          type:
            kind: string
        payload:
          description: Validated Google Desktop OAuth client JSON (a mapping with
            a top-level installed object) required by install-client.
          required: false
          sensitivity: credential
          type:
            kind: string
            sensitivity: credential
            description: Python mapping with JSON-serializable values.
        replace:
          description: Permit replacement when a different canonical client already
            exists, required by install-client.
          required: false
          sensitivity: public
          type:
            kind: flag
        services:
          description: Requested service names, required by normalize-services and
            scope-union-for-services.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Sequence of service name strings.
        credential-id:
          description: Credential identifier, required by load-credential and refresh-access-token.
          required: false
          sensitivity: user-private
          type:
            kind: string
        required-scopes:
          description: OAuth scopes the caller needs, required by refresh-access-token.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Collection of scope strings.
        subject:
          description: Stable Google account subject identifier, required by store-credential.
          required: false
          sensitivity: user-private
          type:
            kind: string
        account:
          description: Human-readable Google account address, required by store-credential.
          required: false
          sensitivity: user-private
          type:
            kind: string
        client-id:
          description: OAuth client id associated with the credential, required by
            store-credential.
          required: false
          sensitivity: public
          type:
            kind: string
        client-secret-ref:
          description: Exact opaque client-secret reference associated with a newly
            stored schema-version-2 credential; omitted legacy callers derive the
            historical client-id-based reference.
          required: false
          sensitivity: credential
          type:
            kind: string
            sensitivity: credential
        token-uri:
          description: Legacy-compatible parameter retained by store-credential;
            persisted and contacted token endpoints are pinned by the implementation.
          required: false
          sensitivity: public
          type:
            kind: string
        granted-scopes:
          description: OAuth scopes the user granted, required by store-credential.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Collection of scope strings.
        refresh-token:
          description: OAuth refresh token to store, required by store-credential.
          required: false
          sensitivity: secret
          type:
            kind: string
            sensitivity: secret
        backend:
          description: Optional SecretBackend instance; when omitted the host keyring
            backend is used.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Python object implementing the SecretBackend protocol.
      preconditions:
      - id: absolute-home
        description: home must be an absolute path.
        check:
          kind: argument
          argument_ref: home
          predicate: present
        unmet_outcome: invalid-home
        caller_action: Supply an absolute home directory path.
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: install-client and store-credential write the canonical
          client JSON, the credential registry, and host credential-store secrets.
      outputs:
      - id: result
        audience: machine
        description: Operation-specific Python return value (tuple, frozenset, dict,
          or GoogleCredentialRef) containing no plaintext client secret or refresh
          token.
        direct_io_ref: return-value
        cardinality:
          minimum: 0
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: user-private
          description: Operation-specific Python return value.
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects:
        - client-file-state
        - credential-registry-state
        - credential-store-state
        caller_action: Use the returned value without logging secret content.
      - id: invalid-home
        class: refusal
        outputs: []
        effects: []
        caller_action: Supply an absolute home directory path.
      - id: invalid-request
        class: refusal
        outputs: []
        effects: []
        caller_action: Correct the requested services, scopes, or client payload.
      - id: scope-denied
        class: refusal
        outputs: []
        effects: []
        caller_action: Request only scopes already granted, or re-run consent to grant
          additional scopes.
      - id: conflict
        class: error
        outputs: []
        effects: []
        caller_action: Pass replace=True to overwrite a different existing canonical
          client.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Each operation consults the credential store and on-disk registry
            during the call.
        effects:
        - id: client-file-state
          direct_io_ref: client-file
          action: update
          value_source:
            kind: argument
            argument_ref: payload
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: client-file
          reversibility:
            irreversible: A replaced prior canonical client is not retained.
        - id: credential-registry-state
          direct_io_ref: credential-registry-file
          action: update
          value_source:
            kind: argument
            argument_ref: refresh-token
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: credential-registry-file
          reversibility:
            compensatable: A registry record can be overwritten by a later store-credential
              call.
        - id: credential-store-state
          direct_io_ref: credential-store
          action: update
          value_source:
            kind: argument
            argument_ref: refresh-token
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: credential-store
          reversibility:
            compensatable: A stored secret can be cleared but overwritten prior content
              is not retained.
        mutation_safety:
          atomicity:
            atomic: The client file and credential registry are each replaced through
              the shared secure atomic writer. Credential publication classifies
              exact-old, exact-new, and ambiguous post-write state across the registry
              and secret store; ambiguous publication raises a typed uncertainty
              failure without deleting a possibly committed secret.
          concurrent_invocations:
            unsafe: Concurrent client installers are not serialized. Credential
              registry read-modify-write publication is serialized by its cross-platform
              sidecar lock.
          idempotency:
            non_idempotent: Reinstalling equivalent validated client JSON returns
              unchanged, but every credential publication intentionally generates
              a fresh refresh-secret reference.
          on_uncertain_completion:
            verify_then_decide: Run client-status or load-credential before retrying;
              a returned publication warning means the exact new registry record is
              already visible and its new secret was retained.
          partial_effects_on_failure:
            possible: Parent directories or an unreachable new secret may remain.
              Exact-old state clears the new secret best-effort; exact-new and ambiguous
              states retain it to protect possibly published credentials.
          rollback_on_failure:
            available: Definitely unreferenced new secrets are cleared best-effort,
              and validated unreferenced prior refresh secrets are cleared only after
              a normal registry-writer return.
        verification:
        - method: output-schema
          output_ref: result
        - method: direct-io-state
          direct_io_ref: client-file
      helpers: []
      direct_io:
        reads:
        - id: home-metadata
          medium: local-filesystem
          access: read
          content: home directory path used as the resolution base
          formats:
          - path
          sensitivity: user-private
          path: <home>
          path_match: exact
        - id: client-file
          medium: local-filesystem
          access: read
          content: canonical Google Desktop OAuth client JSON without its plaintext
            client secret
          formats:
          - json
          sensitivity: credential
          path: <client-file>
        - id: credential-registry-file
          medium: local-filesystem
          access: read
          content: schema-version-2 per-account Google credential registry with
            exact client_secret_ref, unique refresh_secret_ref, and no plaintext
            secrets; older records remain readable through derived legacy references
          formats:
          - json
          sensitivity: user-private
          path: <credential-registry-file>
        - id: credential-store
          medium: local-system
          access: read
          system: host-credential-store
          content: client secret and refresh-token values
          formats:
          - opaque-secret
          sensitivity: secret
        writes:
        - id: client-file
          medium: local-filesystem
          access: write
          content: canonical Google Desktop OAuth client JSON with client_secret replaced
            by client_secret_ref
          formats:
          - json
          sensitivity: credential
          path: <client-file>
        - id: credential-registry-file
          medium: local-filesystem
          access: write
          content: per-account Google credential registry without plaintext secrets
          formats:
          - json
          sensitivity: user-private
          path: <credential-registry-file>
        - id: credential-store
          medium: local-system
          access: configure
          system: host-credential-store
          content: client secret and refresh-token values
          formats:
          - opaque-secret
          sensitivity: secret
        - id: return-value
          medium: local-system
          access: write
          content: Python return value
          formats:
          - path
          - text
          sensitivity: user-private
        network:
        - id: token-endpoint
          medium: network
          access: read-write
          system: google-oauth-token-endpoint
          content: refresh_token grant exchange
          formats:
          - json
          sensitivity: secret
          endpoint: https://oauth2.googleapis.com/token
          reason: Exchanges a stored refresh token for a fresh access token during
            refresh-access-token.
    description: Provides canonical Google client discovery, secret-store client-secret
      storage, and per-account credential registry operations to Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: common.source.famulus-paths.interface.python-api
  version: 1
- interface: common.source.secret-store.interface.python-api
  version: 1
- interface: common.source.oauth-json.interface.python-api
  version: 1
version: 1
