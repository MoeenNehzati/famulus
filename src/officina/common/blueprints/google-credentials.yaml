content:
- google_credentials\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/famulus-paths.yaml
  reason: Resolves the canonical Google client and credential-registry paths under
    the Famulus config root.
  source: common.source.famulus-paths
  version: 1
- blueprint:
    base: module-root
    path: blueprints/secret-store.yaml
  reason: Stores the Google OAuth client secret and per-account refresh tokens through
    the host credential store instead of plaintext.
  source: common.source.secret-store
  version: 1
- blueprint:
    base: module-root
    path: blueprints/oauth-json.yaml
  reason: Atomically writes the canonical client JSON (with client_secret replaced
    by client_secret_ref) using the shared secure writer.
  source: common.source.oauth-json
  version: 1
description: Resolves the canonical Google Desktop OAuth client path, stores OAuth
  secrets in the host secret store instead of plaintext, creates immutable per-authorization
  credential descriptors, and retains the legacy per-account credential registry for
  runtime compatibility.
gateway:
  language: Python
  path: google_credentials.py
id: common.source.google-credentials
interfaces:
  common.source.google-credentials.interface.python-api:
    contract:
      arguments:
        operation:
          description: Google-credentials operation to call.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: normalize-services
              description: Validate and dedupe a requested service list.
            - value: scope-union-for-services
              description: Return the OAuth scope union for the requested services
                plus identity scopes.
            - value: install-client
              description: Store the client secret in the secret store and write the
                remaining client JSON to the canonical path.
            - value: client-status
              description: Report whether the canonical client is installed without
                exposing secrets.
            - value: load-credential
              description: Load a per-account credential registry record.
            - value: refresh-access-token
              description: Exchange a stored refresh token for a fresh access token
                after checking granted scopes locally.
            - value: create-credential-file
              description: Create one exclusive timestamped descriptor whose OAuth
                secrets remain in the host credential store.
            - value: load-credential-file
              description: Load and strictly validate one credential descriptor from
                its direct filesystem path.
            - value: refresh-access-token-from-file
              description: Exchange the refresh token referenced by a credential
                descriptor after checking granted scopes locally.
        home:
          description: Home directory used to resolve the canonical client, credential
            registry, and Famulus config paths.
          required: true
          sensitivity: user-private
          direct_io_ref: home-metadata
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: read
        platform:
          description: 'Host platform identifier as returned by sys.platform: darwin,
            win32, or any other value treated as XDG-style POSIX.'
          required: true
          sensitivity: public
          type:
            kind: string
        payload:
          description: Validated Google Desktop OAuth client JSON (a mapping with
            a top-level installed object) required by install-client.
          required: false
          sensitivity: credential
          type:
            kind: string
            sensitivity: credential
            description: Python mapping with JSON-serializable values.
        replace:
          description: Permit replacement when a different canonical client already
            exists, required by install-client.
          required: false
          sensitivity: public
          type:
            kind: flag
        services:
          description: Requested service names, required by normalize-services and
            scope-union-for-services.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Sequence of service name strings.
        credential-id:
          description: Credential identifier, required by load-credential and refresh-access-token.
          required: false
          sensitivity: user-private
          type:
            kind: string
        credential-file:
          description: Direct path to a generated credential descriptor, required
            by load-credential-file and refresh-access-token-from-file.
          required: false
          sensitivity: user-private
          direct_io_ref: credential-descriptor-file
          type:
            kind: file
            syntax: literal
            relative_to: caller-cwd
            must_exist: true
            access: read
            opaque_content: true
        required-scopes:
          description: OAuth scopes the caller needs, required by both refresh operations.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Collection of scope strings.
        subject:
          description: Stable Google account subject identifier, required by create-credential-file.
          required: false
          sensitivity: user-private
          type:
            kind: string
        account:
          description: Human-readable Google account address, required by create-credential-file.
          required: false
          sensitivity: user-private
          type:
            kind: string
        client-id:
          description: OAuth client id associated with the credential, required by
            create-credential-file.
          required: false
          sensitivity: public
          type:
            kind: string
        client-secret-ref:
          description: Exact opaque client-secret reference associated with a new
            credential file; omitted callers derive the historical client-id-based
            reference.
          required: false
          sensitivity: credential
          type:
            kind: string
            sensitivity: credential
        token-uri:
          description: OAuth token endpoint associated with the credential, required
            by create-credential-file; contacted endpoints are pinned by the implementation.
          required: false
          sensitivity: public
          type:
            kind: string
        granted-scopes:
          description: OAuth scopes the user granted, required by create-credential-file.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Collection of scope strings.
        granted-services:
          description: Granted Google service names recorded by create-credential-file.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Ordered sequence of service name strings.
        refresh-token:
          description: OAuth refresh token to store, required by create-credential-file.
          required: false
          sensitivity: secret
          type:
            kind: string
            sensitivity: secret
        now:
          description: Optional timezone-aware creation time injection used by deterministic
            tests; production callers omit it.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Python datetime value.
        unique-id:
          description: Optional eight-character lowercase hexadecimal artifact ID injection
            used by deterministic tests; production callers omit it.
          required: false
          sensitivity: public
          type:
            kind: string
        backend:
          description: Optional SecretBackend instance; when omitted the host keyring
            backend is used.
          required: false
          sensitivity: public
          type:
            kind: string
            description: Python object implementing the SecretBackend protocol.
      preconditions:
      - id: absolute-home
        description: home must be an absolute path.
        check:
          kind: argument
          argument_ref: home
          predicate: present
        unmet_outcome: invalid-home
        caller_action: Supply an absolute home directory path.
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: install-client and create-credential-file
          write canonical credential metadata and host credential-store secrets.
      outputs:
      - id: result
        audience: machine
        description: Operation-specific Python return value (tuple, frozenset, dict,
          GoogleCredentialRef, or GoogleCredentialFile) containing no plaintext client
          secret, refresh token, or access token except the explicit ephemeral access-token
          return of a refresh operation.
        direct_io_ref: return-value
        cardinality:
          minimum: 0
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: user-private
          description: Operation-specific Python return value.
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects:
        - client-file-state
        - credential-descriptor-state
        - credential-store-state
        caller_action: Use the returned value without logging secret content.
      - id: invalid-home
        class: refusal
        outputs: []
        effects: []
        caller_action: Supply an absolute home directory path.
      - id: invalid-request
        class: refusal
        outputs: []
        effects: []
        caller_action: Correct the requested services, scopes, or client payload.
      - id: scope-denied
        class: refusal
        outputs: []
        effects: []
        caller_action: Request only scopes already granted, or re-run consent to grant
          additional scopes.
      - id: conflict
        class: error
        outputs: []
        effects: []
        caller_action: Pass replace=True to overwrite a different existing canonical
          client.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Each operation consults its current credential-store, registry, or
            descriptor state during the call.
        effects:
        - id: client-file-state
          direct_io_ref: client-file
          action: update
          value_source:
            kind: argument
            argument_ref: payload
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: client-file
          reversibility:
            irreversible: A replaced prior canonical client is not retained.
        - id: credential-store-state
          direct_io_ref: credential-store
          action: update
          value_source:
            kind: argument
            argument_ref: refresh-token
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: credential-store
          reversibility:
            compensatable: A stored secret can be cleared but overwritten prior content
              is not retained.
        - id: credential-descriptor-state
          direct_io_ref: credential-descriptor-file
          action: create
          value_source:
            kind: argument
            argument_ref: granted-services
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: credential-descriptor-file
          reversibility:
            compensatable: The uniquely created descriptor can be explicitly removed;
              no earlier descriptor is overwritten.
        mutation_safety:
          atomicity:
            atomic: The client file is replaced through the shared secure atomic writer;
              descriptor filenames are created exclusively and a new descriptor is
              removed if its secret-store write fails.
          concurrent_invocations:
            unsafe: Concurrent client installers are not serialized; descriptor creation
              is collision-safe but independent calls intentionally create separate files.
          idempotency:
            non_idempotent: Each create-credential-file call creates a new timestamped
              artifact; equivalent client installation retains its existing behavior.
          on_uncertain_completion:
            verify_then_decide: Run client-status, load-credential, or load-credential-file
              before retrying the corresponding operation.
          partial_effects_on_failure:
            possible: Parent directories may remain even when a final replacement
              fails.
          rollback_on_failure:
            unavailable: No prior client backup is retained; a failed new descriptor
              is cleaned up when its secret-store write fails.
        verification:
        - method: output-schema
          output_ref: result
        - method: direct-io-state
          direct_io_ref: client-file
      helpers: []
      direct_io:
        reads:
        - id: home-metadata
          medium: local-filesystem
          access: read
          content: home directory path used as the resolution base
          formats:
          - path
          sensitivity: user-private
          path: <home>
          path_match: exact
        - id: client-file
          medium: local-filesystem
          access: read
          content: canonical Google Desktop OAuth client JSON without its plaintext
            client secret
          formats:
          - json
          sensitivity: credential
          path: <client-file>
        - id: credential-registry-file
          medium: local-filesystem
          access: read
          content: schema-version-2 per-account Google credential registry with
            exact client_secret_ref, unique refresh_secret_ref, and no plaintext
            secrets; older records remain readable through derived legacy references
          formats:
          - json
          sensitivity: user-private
          path: <credential-registry-file>
        - id: credential-store
          medium: local-system
          access: read
          system: host-credential-store
          content: client secret and refresh-token values
          formats:
          - opaque-secret
          sensitivity: secret
        - id: credential-descriptor-file
          medium: local-filesystem
          access: read
          content: immutable per-authorization Google credential metadata and secret-store
            references without raw secrets
          formats:
          - json
          sensitivity: credential
          path: <credential-file>
          path_match: exact
        writes:
        - id: client-file
          medium: local-filesystem
          access: write
          content: canonical Google Desktop OAuth client JSON with client_secret replaced
            by client_secret_ref
          formats:
          - json
          sensitivity: credential
          path: <client-file>
        - id: credential-store
          medium: local-system
          access: configure
          system: host-credential-store
          content: client secret and refresh-token values
          formats:
          - opaque-secret
          sensitivity: secret
        - id: credential-descriptor-file
          medium: local-filesystem
          access: write
          content: immutable per-authorization Google credential metadata and secret-store
            references without raw secrets
          formats:
          - json
          sensitivity: credential
          path: <credential-file>
          path_match: exact
        - id: return-value
          medium: local-system
          access: write
          content: Python return value
          formats:
          - path
          - text
          sensitivity: user-private
        network:
        - id: token-endpoint
          medium: network
          access: read-write
          system: google-oauth-token-endpoint
          content: refresh_token grant exchange
          formats:
          - json
          sensitivity: secret
          endpoint: https://oauth2.googleapis.com/token
          reason: Exchanges a stored refresh token for a fresh access token during
            refresh-access-token or refresh-access-token-from-file.
    description: Provides canonical Google client discovery, secret-store OAuth secret
      storage, immutable credential descriptor operations, and legacy per-account registry
      reads to Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: common.source.famulus-paths.interface.python-api
  version: 1
- interface: common.source.secret-store.interface.python-api
  version: 1
- interface: common.source.oauth-json.interface.python-api
  version: 1
version: 1
