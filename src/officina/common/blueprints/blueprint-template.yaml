content:
- blueprint_template\.py
dependencies: []
description: Loads bundled JSON Schemas, constructs local-reference Draft 7 validators, and renders or writes blueprint YAML while preserving parsed values and regenerating schema-owned documentation comments.
gateway:
  language: Python
  path: blueprint_template.py
id: common.source.blueprint-template
interfaces:
  common.source.blueprint-template.interface.python-api:
    contract:
      arguments:
        operation:
          description: Blueprint-template operation to perform.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - {value: load-schema, description: Load one JSON Schema and its sibling schema bundle.}
            - {value: schema-validator, description: Construct a Draft 7 validator with bundled local references.}
            - {value: render-template, description: Render a documented blueprint template from schema examples and defaults.}
            - {value: refresh-documentation, description: Preserve parsed blueprint values while replacing generated comments.}
            - {value: render-values, description: Render supplied blueprint values using one authoring schema.}
            - {value: write-regenerated-blueprint, description: Validate and write a refreshed skill blueprint beneath the caller-selected output directory.}
        repository-root:
          description: Repository containing the source blueprint and authoritative schema bundle.
          required: false
          sensitivity: user-private
          direct_io_ref: schema-and-blueprint
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read}
        output-directory:
          description: Existing directory receiving a regenerated blueprint file.
          required: false
          sensitivity: user-private
          direct_io_ref: generated-blueprint
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: write}
        inputs:
          description: Operation-specific schema, skill name, parsed values, YAML text, documentation mode, or explicit schema path.
          required: false
          sensitivity: user-private
          type: {kind: string, description: Operation-specific Python mapping or text value.}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: The write operation replaces the named generated blueprint in the output directory after proving parsed values were preserved and schema-valid.
      outputs:
      - id: result
        audience: machine
        description: Loaded schema, validator, rendered YAML text, or generated blueprint path.
        direct_io_ref: return-value
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Rendered YAML is nonempty; validator and path results are always present on success.
        type: {kind: string, sensitivity: user-private, description: "Operation-specific Python schema, validator, rendered text, or Path."}
      outcomes:
      - {id: rendered, class: success, outputs: [result], effects: [], caller_action: "Consume the loaded, validated, or rendered in-memory result."}
      - {id: generated, class: success, outputs: [result], effects: [write-generated-blueprint], caller_action: Read the returned path as the refreshed generated blueprint.}
      - {id: invalid-input, class: error, outputs: [], effects: [], caller_action: "Correct invalid YAML, JSON Schema, skill name, document mode, missing source blueprint, or value-preservation mismatch before retrying."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Rendering uses the schema bundle and blueprint values read during the call; the write operation validates the rendered values before replacing its output.}
        effects:
        - id: write-generated-blueprint
          direct_io_ref: generated-blueprint
          action: update
          value_source: {kind: output, output_ref: result}
          may_occur_in_outcomes: [generated]
          confirmation_evidence: {kind: direct-io, direct_io_ref: generated-blueprint}
          reversibility: {compensatable: Delete the generated copy or regenerate it from the unchanged source blueprint.}
        mutation_safety:
          atomicity: {non_atomic: The generated file is written through the host text-file API rather than the shared atomic-file helper.}
          concurrent_invocations: {unsafe: Concurrent writes to the same generated destination can overwrite one another.}
          idempotency: {idempotent: Repeating regeneration against unchanged source values and schema emits the same YAML text.}
          on_uncertain_completion: {verify_then_decide: Parse and validate the destination and compare its values with the source blueprint before retrying.}
          partial_effects_on_failure: {possible: Host failure during write can leave a partial generated file.}
          rollback_on_failure: {unavailable: The helper does not retain any prior destination content.}
        verification:
        - {method: output-schema, output_ref: result}
      helpers: []
      direct_io:
        reads:
        - {id: schema-and-blueprint, medium: repository-filesystem, access: read, content: source blueprint and JSON Schema bundle, formats: [yaml, json-schema], sensitivity: user-private, path: "<repository-root>/{skills/**/blueprint.yaml,references/blueprint/*.schema.json}", path_match: glob}
        writes:
        - {id: generated-blueprint, medium: local-filesystem, access: write, content: regenerated documented blueprint, formats: [yaml], sensitivity: user-private, path: <output-directory>/<skill>_blueprint.yaml, path_match: exact, system: filesystem}
        - {id: return-value, medium: local-system, access: write, content: Python return value, formats: [python-object, yaml], sensitivity: user-private}
        network: []
    description: Loads blueprint schemas and regenerates annotated blueprint YAML
      for Python callers.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
