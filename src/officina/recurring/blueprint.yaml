schema_version: 6
id: recurring
version: 1
maturity: experimental
node_type: module
description: Recurring-owned control, execution, healthcheck, and shared native scheduler rendering.
gateway: {language: Python, path: __init__.py}
content:
- __init__\.py
- control\.py
- executor\.py
- healthcheck\.py
- jobs\.py
- native\.py
- records\.py
- runtime\.py
- state\.py
- default_jobs\.yaml
exports:
  recurring.interface.control:
    source_interface: recurring.source.control.interface.cli
    access: {allow_all_modules: false, allowed_callers: [recurring-tasks._rtx]}
  recurring.interface.executor:
    source_interface: recurring.source.executor.interface.cli
    access: {allow_all_modules: false, allowed_callers: [recurring-tasks._rtx]}
  recurring.interface.healthcheck:
    source_interface: recurring.source.healthcheck.interface.cli
    access: {allow_all_modules: false, allowed_callers: [recurring-tasks._rtx]}
namespace_exports: {}
sources:
  recurring.source.runtime:
    blueprint: {base: module-root, path: blueprints/runtime.yaml}
  recurring.source.control:
    blueprint: {base: module-root, path: blueprints/control.yaml}
  recurring.source.executor:
    blueprint: {base: module-root, path: blueprints/executor.yaml}
  recurring.source.healthcheck:
    blueprint: {base: module-root, path: blueprints/healthcheck.yaml}
children: {}
authority:
  owns_filesystem:
  - {path: '^\$famulus-recurring-config-root/.*$', match: regex, allowed_readers: [recurring.interface.control, recurring.interface.executor, recurring.interface.healthcheck], reason: Recurring control owns canonical configuration and descriptor writes.}
  - {path: '^\$famulus-recurring-state-root/.*$', match: regex, allowed_readers: [recurring.interface.control, recurring.interface.executor, recurring.interface.healthcheck], reason: Recurring execution owns durable logs and records.}
  - {path: '^\$host-account-home/\.config/systemd/user/ai-.*$', match: regex, allowed_readers: [recurring.interface.control, recurring.interface.healthcheck], reason: Recurring control owns the shared systemd user registrations.}
  - {path: '^\$host-account-home/\.config/systemd/user/install-owner\.json$', match: regex, allowed_readers: [recurring.interface.control], reason: Recurring control records the current owner of the shared systemd set.}
  - {path: '^\$host-account-home/Library/LaunchAgents/ai-.*\.plist$', match: regex, allowed_readers: [recurring.interface.control, recurring.interface.healthcheck], reason: Recurring control owns the shared launchd registrations.}
  - {path: '^\$host-account-home/Library/LaunchAgents/install-owner\.json$', match: regex, allowed_readers: [recurring.interface.control], reason: Recurring control records the current owner of the shared launchd set.}
  - {path: '^\$host-account-local-app-data/Famulus/recurring-tasks/native/.*$', match: regex, allowed_readers: [recurring.interface.control, recurring.interface.healthcheck], reason: Recurring control owns the shared Windows task wrappers and owner record.}
