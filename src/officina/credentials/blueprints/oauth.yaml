content:
- oauth\.py
dependencies: []
description: Serializes a mapping as private indented JSON and replaces one OAuth
  client file using the secure atomic-files helper on POSIX or a restrictive temporary
  file elsewhere.
gateway:
  language: Python
  path: oauth.py
id: credentials.source.oauth
interfaces:
  credentials.source.oauth.interface.python-api:
    content:
    - oauth\.py
    uses_interfaces:
    - interface: common.interface.atomic-files
      version: 2
    contract:
      arguments:
        path:
          description: OAuth JSON destination; its parent directories are created
            when absent.
          direct_io_ref: oauth-file
          required: true
          sensitivity: credential
          type:
            access: write
            content_type:
              format:
                named: json
              kind: string
              sensitivity: credential
            kind: file
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
        payload:
          description: Mapping serialized as indented UTF-8 JSON with a trailing newline.
          required: true
          sensitivity: credential
          type:
            description: Python mapping with JSON-serializable values.
            kind: string
            sensitivity: credential
      caller_warnings:
      - external-side-effect: Creates parent directories and replaces the credential
          file with mode 0600 where supported.
      direct_io:
        network: []
        reads:
        - access: read
          content: existing destination type and final JSON state
          formats:
          - json
          id: oauth-file
          medium: local-filesystem
          path: <path>
          sensitivity: credential
        writes:
        - access: write
          content: OAuth Desktop client JSON
          formats:
          - json
          id: oauth-file
          medium: local-filesystem
          path: <path>
          sensitivity: credential
      execution:
        consistency:
          live: The implementation rechecks the destination before replacement.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: oauth-file
            kind: direct-io
          direct_io_ref: oauth-file
          id: oauth-file-state
          may_occur_in_outcomes:
          - completed
          reversibility:
            irreversible: The previous credential JSON is replaced without a retained
              backup.
          value_source:
            argument_ref: payload
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: The final file replacement is atomic on supported POSIX and Windows
              filesystems.
          concurrent_invocations:
            unsafe: Concurrent writers are not serialized and the last replacement
              wins.
          idempotency:
            idempotent: Repeating the same path and payload leaves equivalent JSON
              content.
          on_uncertain_completion:
            verify_then_decide: Read and validate the destination JSON before retrying.
          partial_effects_on_failure:
            possible: Parent directories may remain even if file replacement fails.
          rollback_on_failure:
            unavailable: No prior file backup is retained.
        state_effect: mutating
        verification:
        - direct_io_ref: oauth-file
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Continue with the service-specific OAuth flow.
        class: success
        effects:
        - oauth-file-state
        id: completed
        outputs: []
      - caller_action: Remove the unsafe symlink or select a safe destination.
        class: refusal
        effects: []
        id: rejected
        outputs: []
      - caller_action: Inspect the OAuthJsonError and filesystem permissions before
          retrying.
        class: error
        effects: []
        id: write-failed
        outputs: []
      outputs: []
      preconditions:
      - caller_action: Choose a normal file path in a caller-controlled configuration
          directory.
        check:
          direct_io_ref: oauth-file
          kind: direct-io
          predicate: writable
        description: The final destination must not be a symbolic link.
        id: destination-not-symlink
        unmet_outcome: rejected
    description: Writes confined OAuth client JSON for Python callers.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: common.interface.atomic-files
  version: 2
version: 1
maturity: stable
