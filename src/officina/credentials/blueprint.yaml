authority:
  owns_filesystem: []
children: {}
content:
- __init__\.py
- google\.py
- oauth\.py
- secret_store\.py
description: Google credential management, private OAuth JSON persistence, and host-neutral
  secret storage.
exports:
  credentials.interface.google:
    access:
      allow_all_modules: false
      allowed_callers:
      - cloud-files
      - cloud-files._rtx
      - connect-google
      - connect-google._rtx
      - email-client
      - email-client._rtx
      - g-calendar
      - g-calendar._rtx
    source_interface: credentials.source.google.interface.python-api
  credentials.interface.oauth:
    access:
      allow_all_modules: false
      allowed_callers:
      - cloud-files
      - cloud-files._rtx
      - connect-google
      - connect-google._rtx
      - g-calendar
      - g-calendar._rtx
    source_interface: credentials.source.oauth.interface.python-api
  credentials.interface.secret-store:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-client
      - email-client._rtx
    source_interface: credentials.source.secret-store.interface.python-api
gateway:
  language: Python
  path: __init__.py
id: credentials
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  credentials.source.google:
    blueprint:
      base: module-root
      path: blueprints/google.yaml
  credentials.source.oauth:
    blueprint:
      base: module-root
      path: blueprints/oauth.yaml
  credentials.source.secret-store:
    blueprint:
      base: module-root
      path: blueprints/secret-store.yaml
version: 1
maturity: stable
