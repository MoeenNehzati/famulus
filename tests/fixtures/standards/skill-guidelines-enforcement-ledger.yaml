references:
- path: .githooks/pre-commit
  kind: validation-entrypoint
  integration_point: precommit
  description: Git pre-commit entrypoint that invokes the repository validation runner.
- path: references/blueprint/*.schema.json
  kind: schema-authority
- path: references/blueprint/runtime_dependencies.json
