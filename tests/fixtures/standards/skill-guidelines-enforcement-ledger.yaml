- path: tests/validate_skill_runtime_doc_references.py
  kind: validator-or-test
- path: tests/validate_skill_runtime_files.py
  kind: validator-or-test
- path: tests/validate_subprocess_text_encoding.py
  kind: validator-or-test
- path: tests/validate_toml_io_boundary.py
  kind: validator-or-test
- path: validators/<name>.py
  kind: validator-or-test
- path: validators/platform_neutral.py
