  content_digest: sha256:d564f0fc0c11b8bd275d5e4d8566daee25088182c64c14591368d858afae7fb5
  target:
    target_ref: skill-guidelines.dispatcher-role.example-001
    field: /statement
    expected: "```bash\ndispatcher --dry-run --caller-skill daily-plan \\\n  list-manager.interface.read-list\
      \ /tmp/todo.yaml\n```"
- id: guidelines-semantic-034
  kind: semantic
  start: 114
  end: 116
  text: 'Every `DispatchCall(...)` declaration must include `caller_skill` set to the

    owning skill''s exact name; that value must be a string literal or a module-level

    string constant that resolves statically.'
  content_digest: sha256:1f0d6f32203188e362f536f552412ad5f2cab393937cc75e035619a7ed109efd
  target:
    target_ref: skill-guidelines.dispatcher-role.requirement-003#source-block
    field: /statement
    expected: 'Every `DispatchCall(...)` declaration must include `caller_skill` set to the

      owning skill''s exact name; that value must be a string literal or a module-level

      string constant that resolves statically.'
- id: guidelines-semantic-035
  kind: semantic
  start: 118
  end: 118
  text: '**Private runtime files**'
  content_digest: sha256:57b85bab91629dc6f9c450dadb4f42917d52ecd734f55873b68fb868ddbec70d
  target:
    target_ref: skill-guidelines.private-runtime-files.guidance-001
    field: /statement
    expected: '**Private runtime files**'
- id: guidelines-semantic-036
  kind: semantic
  start: 120
  end: 123
  text: 'Skill implementation files live under the private runtime-execution package

    `skills/<skill-name>/_rtx/`. `_rtx` is an implementation namespace, not public

    documentation vocabulary. Public skill docs must describe interfaces, not

    runtime files.'
  content_digest: sha256:49e56a78214dbc0eda70a0d119357e37ca9b52a80e168b762e149e1c5ea73c6f
  target:
    target_ref: skill-guidelines.private-runtime-files.requirement-001#source-block
    field: /statement
    expected: 'Skill implementation files live under the private runtime-execution package

      `skills/<skill-name>/_rtx/`. `_rtx` is an implementation namespace, not public

      documentation vocabulary. Public skill docs must describe interfaces, not

      runtime files.'
- id: guidelines-semantic-037
  kind: semantic
  start: 125
  end: 128
  text: 'Every non-exempt file or package directory under `_rtx/` must use a private

    multi-part stem. The rule cascades through nested packages: every directory

    component below `_rtx/` and every runtime filename stem must match the same

    private naming convention.'
  content_digest: sha256:a99d829a71ea5f950af5d7b88dd37fe68ebff80b11095b677f615e1f3aa5dc45
  target:
    target_ref: skill-guidelines.private-runtime-files.requirement-002#source-block
    field: /statement
    expected: 'Every non-exempt file or package directory under `_rtx/` must use a private

      multi-part stem. The rule cascades through nested packages: every directory

      component below `_rtx/` and every runtime filename stem must match the same

      private naming convention.'
- id: guidelines-semantic-038
  kind: semantic
  start: 130
  end: 134
  text: '```text

    _rtx/_Calendar_Gateway.py

    _rtx/_mail_transport.py

    _rtx/_platform_adapter/_windows_adapter.py

    ```'
  content_digest: sha256:24251219eab47d210335ba48f1f79253e25d3ad179944ce6b21a67dedf245a58
  target:
    target_ref: skill-guidelines.private-runtime-files.example-001
    field: /statement
    expected: '```text

      _rtx/_Calendar_Gateway.py

      _rtx/_mail_transport.py

      _rtx/_platform_adapter/_windows_adapter.py

      ```'
- id: guidelines-semantic-039
  kind: semantic
  start: 136
  end: 136
  text: 'Every private directory name and every runtime filename stem must match:'
  content_digest: sha256:f5b3903bd0b5d6f556183c3620128c2995942d671ff4d1cf91c2aada3a5773ba
  target:
    target_ref: skill-guidelines.private-runtime-files.requirement-003#source-block
    field: /statement
    expected: 'Every private directory name and every runtime filename stem must match:'
- id: guidelines-semantic-040
  kind: semantic
  start: 138
  end: 140
  text: '```regex

    ^_[A-Za-z0-9]+(?:_[A-Za-z0-9]+)+$

    ```'
  content_digest: sha256:61b6af62737fa74e58c98e156a12fd6a958db0033d8fe8aa0c12a60dd616164c
  target:
    target_ref: skill-guidelines.private-runtime-files.example-002
    field: /statement
    expected: '```regex

      ^_[A-Za-z0-9]+(?:_[A-Za-z0-9]+)+$

      ```'
- id: guidelines-semantic-041
  kind: semantic
  start: 142
  end: 147
  text: 'That means each private runtime path component starts with `_` and has at

    least two underscore-separated segments after it. Case is allowed, but

    case-only path collisions are forbidden among siblings. `__init__.py` is the

    only exempt package marker; package directories themselves are not exempt. The

    allowed runtime file suffix list currently contains `.py`; add to that list

    deliberately only if this policy is relaxed later.'
  content_digest: sha256:6bc0bf7da22680421483d33e781442c247ab2f361f17e58f49f9729cbb3911a1
  target:
    target_ref: skill-guidelines.private-runtime-files.requirement-004#source-block
    field: /statement
    expected: 'That means each private runtime path component starts with `_` and has at

      least two underscore-separated segments after it. Case is allowed, but

      case-only path collisions are forbidden among siblings. `__init__.py` is the

      only exempt package marker; package directories themselves are not exempt. The

      allowed runtime file suffix list currently contains `.py`; add to that list

      deliberately only if this policy is relaxed later.'
- id: guidelines-semantic-042
  kind: semantic
  start: 149
  end: 150
  text: 'Skill-facing Markdown (`SKILL.md` and skill-local Markdown outside tests and

    assets) must not mention:'
  content_digest: sha256:c6af387c55f1f5145eda8bd882e54bb7fa9fa090db5581f105b29ed71ce9eefa
  target:
    target_ref: skill-guidelines.private-runtime-files.requirement-005#source-block
    field: /statement
    expected: 'Skill-facing Markdown (`SKILL.md` and skill-local Markdown outside tests and

      assets) must not mention:'
- id: guidelines-semantic-043
  kind: semantic
  start: 152
  end: 152
  text: '- `_rtx`'
