- id: guidelines-semantic-017
  kind: semantic
  start: 52
  end: 55
  text: 'For blueprint skills, the top-of-file contract block in `SKILL.md` is generated

    from the canonical graph. Authored root and subordinate blueprints are

    canonical; generated blocks, pooled reviews, health records, and repo-level

    manifests are not graph authority and must match the authored graph exactly.'
  content_digest: sha256:3fa45c246a9bd7c8af892b0bd2a19f18df580c498590cc3d3d88d35662a4a600
  target:
    target_ref: skill-guidelines.identity-contract.requirement-005#source-block
    field: /statement
    expected: 'For blueprint skills, the top-of-file contract block in `SKILL.md` is generated

      from the canonical graph. Authored root and subordinate blueprints are

      canonical; generated blocks, pooled reviews, health records, and repo-level

      manifests are not graph authority and must match the authored graph exactly.'
- id: guidelines-semantic-018
  kind: semantic
  start: 57
  end: 65
  text: 'Cross-skill use is declared on the interface that performs it, through

    `uses_interfaces`. Do not add top-level skill dependency lists. If an LLM

    surface delegates to another skill, point to that skill''s LLM interface. If a

    machine interface calls another machine interface, declare that exact

    version-pinned machine interface edge.

    In schema-version-2 LLM-interface and behavior-source bodies, use canonical

    `skill.llm.name` or `skill.machine.name` IDs, never bare cross-skill names.

    Every interface ID named in the body must be declared by that same node''s

    `uses_interfaces`.'
  content_digest: sha256:f25596fe491e214366c84d3e5634bb76620069845923d2ae9fa179aed99a5a9a
  target:
    target_ref: skill-guidelines.identity-contract.requirement-006#source-block
    field: /statement
    expected: 'Cross-skill use is declared on the interface that performs it, through

      `uses_interfaces`. Do not add top-level skill dependency lists. If an LLM

      surface delegates to another skill, point to that skill''s LLM interface. If a

      machine interface calls another machine interface, declare that exact

      version-pinned machine interface edge.

      In schema-version-2 LLM-interface and behavior-source bodies, use canonical

      `skill.llm.name` or `skill.machine.name` IDs, never bare cross-skill names.

      Every interface ID named in the body must be declared by that same node''s

      `uses_interfaces`.'
