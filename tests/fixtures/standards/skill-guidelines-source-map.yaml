units:
- id: guidelines-semantic-001
  kind: semantic
  start: 1
  end: 1
  text: '# Skill Module Standards'
  content_digest: sha256:dadbeb0c260af9a465a98bbc738792b9e38607c1202a2bdbf378f2c81426017b
  target:
    target_ref: skill-guidelines.module-boundary.guidance-001
    field: /statement
    expected: '# Skill Module Standards'
- id: guidelines-semantic-002
  kind: semantic
  start: 3
  end: 5
  text: '**A skill is a software module.** The standards below define the module

    boundary: identity, interfaces, allowed dependencies, runtime ownership, and

    import discipline. They are structural requirements, not style preferences.'
  content_digest: sha256:1b56e6b09b469e87c12e67715fb85b43d6ee7045e96ce48ecc7577447b27f0af
  target:
    target_ref: skill-guidelines.module-boundary.guidance-002
    field: /statement
    expected: '**A skill is a software module.** The standards below define the module

      boundary: identity, interfaces, allowed dependencies, runtime ownership, and

      import discipline. They are structural requirements, not style preferences.'
- id: guidelines-semantic-003
  kind: semantic
  start: 7
  end: 9
  text: "**1. Skill identity and contract come first** \u2014 every skill has a stable\ndash-separated\
    \ name and declares its dependency and interface contract before\nworkflow instructions."
  content_digest: sha256:bfaf0b3fe22932eae81ae12a533d2b34e38d1ffb4b390fc2d267e3dbef3b1e66
  target:
    target_ref: skill-guidelines.identity-contract.guidance-001
    field: /statement
    expected: "**1. Skill identity and contract come first** \u2014 every skill has a stable\n\
      dash-separated name and declares its dependency and interface contract before\nworkflow\
      \ instructions."
- id: guidelines-semantic-004
  kind: semantic
  start: 11
  end: 12
  text: 'The skill directory name and frontmatter `name:` must match exactly. Skill names

