  content_digest: sha256:16f5cff2f03c5f5a66dbdd5e640d1ca58ae3e16ed3626eed19f057b446f93190
  target:
    target_ref: skill-guidelines.canonical-interface-names.requirement-001#source-block
    field: /statement
    expected: 'The local `<name>` is the final component of the interface ID.

      It must be dash-separated and must **not** contain `.`.'
- id: guidelines-semantic-014
  kind: semantic
  start: 41
  end: 41
  text: 'The canonical invocation form for a process-bound module export is:'
  content_digest: sha256:6b5110349981cd3c302a87e9f04602050782a72eb0005aad13e6c3c5b9ab0c73
  target:
    target_ref: skill-guidelines.canonical-interface-names.guidance-005
    field: /statement
    expected: 'The canonical invocation form for a process-bound module export is:'
- id: guidelines-semantic-015
  kind: semantic
  start: 43
  end: 45
  text: '```bash

    dispatcher --caller-skill daily-plan list-manager.interface.read-list /tmp/todo.yaml

    ```'
  content_digest: sha256:8508c19ea1bab91561b02fb6b83a89616bda50390ec3b3621096c9d23403be0d
  target:
    target_ref: skill-guidelines.canonical-interface-names.example-001
    field: /statement
    expected: '```bash

      dispatcher --caller-skill daily-plan list-manager.interface.read-list /tmp/todo.yaml

      ```'
- id: guidelines-semantic-016
  kind: semantic
  start: 47
  end: 49
  text: 'Every Python behavioral-source gateway that may invoke another

    module must define a declared dispatch menu. Runtime code calls

    only entries from that menu, never raw dispatcher APIs:'
  content_digest: sha256:039c03ae8e6fe5284ab9f24c3dda990f51f6135f582ca5c90fa5bd896544bbb7
  target:
    target_ref: skill-guidelines.canonical-interface-names.requirement-002#source-block
    field: /statement
    expected: 'Every Python behavioral-source gateway that may invoke another

      module must define a declared dispatch menu. Runtime code calls

      only entries from that menu, never raw dispatcher APIs:'
- id: guidelines-semantic-017
  kind: semantic
  start: 51
  end: 63
  text: "```python\nfrom officina.runtime.python_machine_interface import DispatchCall, PythonMachineInterface\n\
    \n\nclass Interface(PythonMachineInterface):\n    dispatches = {\n        \"read-list\"\
    : DispatchCall(\n            caller_skill=\"daily-plan\",\n            target_skill=\"\
    list-manager\",\n            interface=\"read-list\",\n        )\n    }\n```"
  content_digest: sha256:d9c333ccfacec7e9a9b7272d221c5aa2cdf659c71b58790e252313c5c3c9971d
  target:
    target_ref: skill-guidelines.canonical-interface-names.example-002
    field: /statement
    expected: "```python\nfrom officina.runtime.python_machine_interface import DispatchCall,\
      \ PythonMachineInterface\n\n\nclass Interface(PythonMachineInterface):\n    dispatches\
      \ = {\n        \"read-list\": DispatchCall(\n            caller_skill=\"daily-plan\"\
      ,\n            target_skill=\"list-manager\",\n            interface=\"read-list\",\n\
      \        )\n    }\n```"
- id: guidelines-semantic-018
  kind: semantic
  start: 65
  end: 65
  text: 'Then execute by key:'
  content_digest: sha256:10f0382f5a5c380e519d5da76b725cd6de432824eb3b510f1d1a342e18fec48f
  target:
    target_ref: skill-guidelines.canonical-interface-names.guidance-006
    field: /statement
    expected: 'Then execute by key:'
- id: guidelines-semantic-019
  kind: semantic
  start: 67
  end: 69
  text: '```python

    self.dispatch("read-list", args=["/tmp/todo.yaml"])

    ```'
  content_digest: sha256:51b69efb86f9fdff58f7ebb99a4d387aef0e3a56dac58350c723349aa04eff84
  target:
    target_ref: skill-guidelines.canonical-interface-names.example-003
    field: /statement
    expected: '```python

      self.dispatch("read-list", args=["/tmp/todo.yaml"])

      ```'
- id: guidelines-semantic-020
  kind: semantic
  start: 71
  end: 73
  text: 'Do not import or call `officina.dispatcher` from skill runtime code. Do not

    invoke the `dispatcher` CLI from Python skill code, and do not modify `sys.path`

    to reach dispatcher internals.'
  content_digest: sha256:6a9a0ea305165045a3ba69eff5a71a61c3a0a0ee6d2c87672d4881a65316239e
  target:
    target_ref: skill-guidelines.canonical-interface-names.requirement-003#source-block
    field: /statement
    expected: 'Do not import or call `officina.dispatcher` from skill runtime code. Do not

      invoke the `dispatcher` CLI from Python skill code, and do not modify `sys.path`

      to reach dispatcher internals.'
- id: guidelines-semantic-021
  kind: semantic
  start: 75
  end: 79
  text: 'This is mechanically checked by

    `skills/skill-maker/validators/dispatcher_usage.py`, which rejects raw

    dispatcher imports and CLI dispatch from skill runtime code, and

    `skills/skill-maker/validators/dispatch_caller_skill.py`, which verifies every

    `DispatchCall(caller_skill=...)` statically resolves to the owning skill name.'
  content_digest: sha256:ca296da7c3ba882f134bddc856f674056e5a645c237a7dd7caac5f7ab9f037a8
  target:
    target_ref: skill-guidelines.canonical-interface-names.guidance-007
    field: /statement
    expected: 'This is mechanically checked by

      `skills/skill-maker/validators/dispatcher_usage.py`, which rejects raw

      dispatcher imports and CLI dispatch from skill runtime code, and

      `skills/skill-maker/validators/dispatch_caller_skill.py`, which verifies every

      `DispatchCall(caller_skill=...)` statically resolves to the owning skill name.'
- id: guidelines-semantic-022
  kind: semantic
  start: 81
  end: 81
  text: '**Dispatcher role**'
  content_digest: sha256:f147ba81493028880ff9296971e01b01c9ba535226c1726fbdc562f8230e5b00
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-001
    field: /statement
    expected: '**Dispatcher role**'
- id: guidelines-semantic-023
  kind: semantic
  start: 83
  end: 87
  text: 'The installed `dispatcher` command and the shared dispatcher runtime are the

    only sanctioned local cross-module process boundary. Python behavioral-source

    runtime code must reach that boundary through declared

    `DispatchCall` entries and `PythonMachineInterface.dispatch()`. The

    dispatcher runtime''s job is to:'
  content_digest: sha256:d589530ab2133b2a1f01e5affd9fa163b010f1f829df22273ecbc43741cdcb49
  target:
    target_ref: skill-guidelines.dispatcher-role.requirement-001#source-block
    field: /statement
    expected: 'The installed `dispatcher` command and the shared dispatcher runtime are the

      only sanctioned local cross-module process boundary. Python behavioral-source

      runtime code must reach that boundary through declared

      `DispatchCall` entries and `PythonMachineInterface.dispatch()`. The

      dispatcher runtime''s job is to:'
- id: guidelines-semantic-024
  kind: semantic
  start: 89
  end: 89
  text: 1. Parse the canonical target `<module>.interface.<name>`
  content_digest: sha256:42abf0c6d64057b5772d656d70202ab799e35ee23315e69281823b46c30232dd
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-002
    field: /statement
    expected: 1. Parse the canonical target `<module>.interface.<name>`
- id: guidelines-semantic-025
  kind: semantic
  start: 91
  end: 91
  text: 2. Load the callee's version 4 module graph and resolve the export
  content_digest: sha256:5276b55cb2d6a2900e4faf29b5ad660f9efa8198b2247a5000ca37ebe02260ea
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-003
    field: /statement
    expected: 2. Load the callee's version 4 module graph and resolve the export
- id: guidelines-semantic-026
  kind: semantic
  start: 93
  end: 93
  text: 3. Verify the export's module-level access policy
  content_digest: sha256:217fc7943d06e8781e4271772cf06ee145e84e6c787f838be8ddc4c9af721e6b
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-004
    field: /statement
    expected: 3. Verify the export's module-level access policy
- id: guidelines-semantic-027
  kind: semantic
  start: 95
  end: 95
  text: 4. Parse caller arguments against the source-owned interface contract
  content_digest: sha256:70c2c6f4a721b8633786486acc0e080a8b9e1cd9b1816481c0438685ed2759e7
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-005
    field: /statement
    expected: 4. Parse caller arguments against the source-owned interface contract
- id: guidelines-semantic-028
  kind: semantic
  start: 97
  end: 97
  text: 5. Compile the interface's process binding against its source gateway
  content_digest: sha256:bdce32d9dad81087fc1fd084e876fbd6811e351a92794b59000cdba21497930d
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-006
    field: /statement
    expected: 5. Compile the interface's process binding against its source gateway
- id: guidelines-semantic-029
  kind: semantic
  start: 99
  end: 99
  text: 6. Build an invocation plan without depending on the caller's working directory
  content_digest: sha256:04c9011856eb06d6a3f63a4e39e137e3fec0576d6ce066b2b3eb041fbf63f3b1
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-007
    field: /statement
    expected: 6. Build an invocation plan without depending on the caller's working directory
- id: guidelines-semantic-030
  kind: semantic
  start: 101
  end: 101
  text: 7. Return the dry-run plan or execute it
  content_digest: sha256:aa779903078827375be74d99905d560bf971ccd2fe0212720effabcc0aebfd66
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-008
    field: /statement
    expected: 7. Return the dry-run plan or execute it
- id: guidelines-semantic-031
  kind: semantic
  start: 103
  end: 105
  text: 'The graph and process-binding approach enables static validation: git hooks verify

    that only authorized modules use restricted exports, catching misuse

    before deployment rather than only at runtime.'
  content_digest: sha256:c4f6e8a5b97d5c3d558af44d4d86d376904e2c90376cbf7b7e88c69c8253e356
  target:
    target_ref: skill-guidelines.dispatcher-role.requirement-002#source-block
    field: /statement
    expected: 'The graph and process-binding approach enables static validation: git hooks
      verify

      that only authorized modules use restricted exports, catching misuse

      before deployment rather than only at runtime.'
- id: guidelines-semantic-032
  kind: semantic
  start: 107
  end: 107
  text: 'Use `--dry-run` to inspect the resolved invocation without executing it:'
  content_digest: sha256:e8bfc22075793d7019ba512c552b0cab375341457e7ce024659e34bbc1b55421
  target:
    target_ref: skill-guidelines.dispatcher-role.guidance-009
    field: /statement
    expected: 'Use `--dry-run` to inspect the resolved invocation without executing it:'
- id: guidelines-semantic-033
  kind: semantic
  start: 109
  end: 112
  text: "```bash\ndispatcher --dry-run --caller-skill daily-plan \\\n  list-manager.interface.read-list\
