  kind: semantic
  start: 36
  end: 36
  text: '- source-owned interface: `<module>.source.<source>.interface.<name>`'
  content_digest: sha256:1a6b2e84efd1f1e1e6551f0f79830ca315b54d74465932a2ef85632776dd8751
  target:
