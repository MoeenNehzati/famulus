- id: guidelines-semantic-030
  kind: semantic
  start: 98
  end: 104
  text: 'Every subordinate blueprint binds exactly one existing regular file and is

    hidden beside it. A single node bound to `foo.py` uses

    `.foo.py.blueprint.yaml`; multiple nodes on the same file use qualified names

    such as `.foo.py.read.blueprint.yaml`. Generated health uses the corresponding

    `.health.json` suffix. The skill root alone keeps `blueprint.yaml` and

    `.last_audit.json`. The inline default is part of the root rather than a

    subordinate sidecar. Directories never receive blueprints.'
  content_digest: sha256:ed22fb55e53966a31c10859516f8914c0e26911fdd04e0bc267ec8d334b9af09
  target:
    target_ref: skill-guidelines.blueprint-authoring-notes.requirement-006#source-block
    field: /statement
    expected: 'Every subordinate blueprint binds exactly one existing regular file and is

      hidden beside it. A single node bound to `foo.py` uses

      `.foo.py.blueprint.yaml`; multiple nodes on the same file use qualified names

      such as `.foo.py.read.blueprint.yaml`. Generated health uses the corresponding

      `.health.json` suffix. The skill root alone keeps `blueprint.yaml` and

      `.last_audit.json`. The inline default is part of the root rather than a

      subordinate sidecar. Directories never receive blueprints.'
- id: guidelines-semantic-031
  kind: semantic
  start: 106
  end: 110
  text: 'In schema version 3, every node declares `content`: case-sensitive regular

    expressions that resolve to the behavior-defining files owned by that node.

    Exactly one resolved content file is the node''s `gateway`. Content ownership is

    exclusive across the repository: two nodes must not claim the same file, and an

    `owns_filesystem` entry must not overlap content owned by another node.'
  content_digest: sha256:6008864f56650ae2e4bf7e2b79cc1991dd2eab0ee36c7e77f64e876b4b6c10d9
  target:
    target_ref: skill-guidelines.blueprint-authoring-notes.requirement-007#source-block
    field: /statement
    expected: 'In schema version 3, every node declares `content`: case-sensitive regular

      expressions that resolve to the behavior-defining files owned by that node.

      Exactly one resolved content file is the node''s `gateway`. Content ownership is

      exclusive across the repository: two nodes must not claim the same file, and an

      `owns_filesystem` entry must not overlap content owned by another node.'
- id: guidelines-semantic-032
  kind: semantic
  start: 112
  end: 118
  text: '`skill-audit` generates node health bottom-up and may generate

    `.pooled-blueprint-review.yaml` plus its health file for review. Pooled files

    are never graph inputs. The schema family defines canonical health fields,

    SHA-256 projections, HMAC-SHA-256 authentication, and which authored fields

    participate in contract hashes. Health, pool, and key files are ignored local

    state. The inline default and `SKILL.md` are certified by root skill health;

    they do not receive a second health identity. Do not hand-author health files.'
  content_digest: sha256:92386be523f61717ac5ffa25695919c83b2705bcea4594611dd2f714d52731b7
  target:
    target_ref: skill-guidelines.blueprint-authoring-notes.requirement-008#source-block
    field: /statement
    expected: '`skill-audit` generates node health bottom-up and may generate

      `.pooled-blueprint-review.yaml` plus its health file for review. Pooled files

      are never graph inputs. The schema family defines canonical health fields,

      SHA-256 projections, HMAC-SHA-256 authentication, and which authored fields

      participate in contract hashes. Health, pool, and key files are ignored local

      state. The inline default and `SKILL.md` are certified by root skill health;

      they do not receive a second health identity. Do not hand-author health files.'
