families:
  A skill is a software module.: skill-guidelines.module-boundary
  1. Skill identity and contract come first: skill-guidelines.identity-contract
  "Blueprint authoring \u2014 REQUIRED: Use the concrete schema": skill-guidelines.blueprint-authoring
  Blueprint authoring notes: skill-guidelines.blueprint-authoring-notes
  Canonical interface names: skill-guidelines.canonical-interface-names
  Machine interfaces: skill-guidelines.machine-interfaces
  LLM interfaces: skill-guidelines.llm-interfaces
  Dispatcher role: skill-guidelines.dispatcher-role
  Private runtime files: skill-guidelines.private-runtime-files
  Import discipline: skill-guidelines.import-discipline
  TOML IO boundary: skill-guidelines.toml-io-boundary
  Subprocess text boundaries: skill-guidelines.subprocess-text-boundaries
  Injection lifecycle: skill-guidelines.injection-lifecycle
  2. Skill taxonomy: skill-guidelines.skill-taxonomy
  3. `my-X` naming and structure: skill-guidelines.personal-override-structure
  4. `suggested_permissions`: skill-guidelines.suggested-permissions
  5. Frontmatter `description:` is a trigger declaration, not a summary: skill-guidelines.trigger-description
  6. Output-focused, terse writing: skill-guidelines.output-focused-writing
  7. The canonical blueprint graph owns all interface definitions: skill-guidelines.canonical-blueprint-ownership
  8. Commit and push after every skill change: skill-guidelines.change-publication-workflow
  "9. Skills are components in an evolving system \u2014 design accordingly.": skill-guidelines.system-evolution
  "10. No code in SKILL.md \u2014 runtime files only, with one exception": skill-guidelines.runtime-code-boundary
  11. State data lives under the skill's directory: skill-guidelines.state-ownership
  12. Sensitive configs live under `~/.config/<skill-name>/`: skill-guidelines.sensitive-configs
  13. Prefer widely available, cross-platform tools at every layer: skill-guidelines.cross-platform-tools
  ? 14. Shared skill content must stay neutral about which specific AI-assistant host it runs under, and must mention operating systems only in explicit platform-support metadata or platform-named implementation files.
  : skill-guidelines.assistant-neutrality
  Validator and test conventions: skill-guidelines.validator-test-conventions
  Adding a new validator: skill-guidelines.adding-validator
  Test file conventions: skill-guidelines.test-file-conventions
