schema_version: 4
node_type: module
id: producer
version: 3
description: Code-bearing skill parent.
gateway:
  path: SKILL.md
  language: Markdown
content:
  - (?:SKILL\.md|_rtx/.*|tests/.*|state/.*)
discovery:
  mechanism: skill
authority:
  owns_filesystem:
    - match: regex
      path: state/.*
      allowed_readers:
        - producer.interface.execute
      reason: Runtime cache owned by the code child after migration.
sources:
  producer.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  producer.source.runtime:
    blueprint:
      base: module-root
      path: blueprints/runtime.yaml
  producer.source.caller:
    blueprint:
      base: module-root
      path: blueprints/caller.yaml
exports:
  producer.interface.execute:
    source_interface: producer.source.runtime.interface.execute
    access:
      allow_all_modules: false
      allowed_callers:
        - producer
  producer.interface.status:
    source_interface: producer.source.runtime.interface.status
    access:
      allow_all_modules: false
      allowed_callers:
        - consumer
  producer.interface.ping:
    source_interface: producer.source.runtime.interface.ping
    access:
      allow_all_modules: true
      allowed_callers: []
