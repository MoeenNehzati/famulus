schema_version: 4
node_type: module
id: guide
version: 4
description: Instruction-only skill parent.
category: skill-making-development-assistant
role: meta-skill
kind: guide
gateway:
  path: SKILL.md
  language: Markdown
content:
  - SKILL\.md
discovery:
  mechanism: skill
authority:
  owns_filesystem: []
sources:
  guide.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
exports:
  guide.interface.read:
    source_interface: guide.source.gateway.interface.read
    access:
      allow_all_modules: false
      allowed_callers:
        - producer
