# Shadow fixture template; tests materialize this as blueprint.yaml.
schema_version: 5
node_type: module
id: demo
version: 1
gateway:
  path: SKILL.md
  language: Markdown
content:
  - (?:SKILL\.md|_rtx/.*)
discovery:
  mechanism: skill
authority:
  owns_filesystem: []
sources:
  demo.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
children:
  demo-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
namespace_exports: {}
exports:
  demo.interface.execute:
    facade_interface:
      interface: demo-rtx.interface.execute
      version: 3
    access:
      allow_all_modules: false
      allowed_callers:
        - ._rtx
