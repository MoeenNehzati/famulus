# Shadow fixture template; tests materialize this as blueprint.yaml.
schema_version: 5
node_type: module
id: leaf
version: 1
gateway:
  path: README.md
  language: Markdown
content:
  - (?:README\.md|runtime\.py|caller\.py)
authority:
  owns_filesystem: []
sources:
  leaf.source.runtime:
    blueprint:
      base: module-root
      path: blueprints/runtime.yaml
  leaf.source.caller:
    blueprint:
      base: module-root
      path: blueprints/caller.yaml
children: {}
namespace_exports: {}
exports:
  leaf.interface.run:
    source_interface: leaf.source.runtime.interface.run
    access:
      allow_all_modules: false
      allowed_callers:
        - alpha
        - root
        - ...beta
        - ...beta.beta-leaf
        - outsider
  leaf.interface.hidden:
    source_interface: leaf.source.runtime.interface.hidden
    access:
      allow_all_modules: false
      allowed_callers:
        - ...beta
