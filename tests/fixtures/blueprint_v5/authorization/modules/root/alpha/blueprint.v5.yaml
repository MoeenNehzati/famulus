# Shadow fixture template; tests materialize this as blueprint.yaml.
schema_version: 5
node_type: module
id: alpha
version: 1
gateway:
  path: README.md
  language: Markdown
content:
  - (?:README\.md|caller\.py|leaf/.*)
authority:
  owns_filesystem: []
sources:
  alpha.source.caller:
    blueprint:
      base: module-root
      path: blueprints/caller.yaml
children:
  leaf:
    base: module-root
    path: leaf/blueprint.yaml
namespace_exports:
  leaf:
    version: 1
    access:
      allow_all_modules: false
      allowed_callers:
        - root
        - ..beta
        - ..beta.beta-leaf
        - outsider
    surface:
      all: true
    interface_access:
      leaf.interface.hidden:
        allow_all_modules: false
        allowed_callers:
          - ..beta
exports:
  alpha.interface.status:
    source_interface: alpha.source.caller.interface.status
    access:
      allow_all_modules: false
      allowed_callers:
        - ..beta
