filesystem/read:
  request: {operation_version: 1, parameters: {path: state/input.txt}}
  success: {ok: true, result: {content: hello, encoding: utf-8}}
filesystem/write:
  request: {operation_version: 1, parameters: {path: state/output.txt, content: hello, encoding: utf-8}}
  success: {ok: true, result: {bytes_written: 5}}
filesystem/stat:
  request: {operation_version: 1, parameters: {path: state/input.txt}}
  success: {ok: true, result: {kind: file, size: 5}}
filesystem/list:
  request: {operation_version: 1, parameters: {path: state}}
  success: {ok: true, result: {entries: [input.txt]}}
filesystem/delete:
  request: {operation_version: 1, parameters: {path: state/output.txt}}
  success: {ok: true, result: {deleted: true}}
clock/now:
  request: {operation_version: 1, parameters: {}}
  success: {ok: true, result: {instant: '2026-07-19T12:00:00Z'}}
clock/advance:
  request: {operation_version: 1, parameters: {seconds: 1}}
  success: {ok: true, result: {instant: '2026-07-19T12:00:01Z'}}
network/request:
  request: {operation_version: 1, parameters: {method: GET, url: 'https://fixture.invalid/resource'}}
  success: {ok: true, result: {status: 200, headers: {}, body: '{}'}}
helpers/invoke:
  request: {operation_version: 1, parameters: {helper: list-records, arguments: {}}}
  success: {ok: true, result: {outcome: success, outputs: {records: []}}}
subprocess/run:
  request: {operation_version: 1, parameters: {fixture: formatter, argv: [--version], timeout_seconds: 5}}
  success: {ok: true, result: {exit_code: 0, stdout: '1.0', stderr: ''}}
calendar/list:
  request: {operation_version: 1, parameters: {calendar: primary, start: '2026-07-19T00:00:00Z', end: '2026-07-20T00:00:00Z'}}
  success: {ok: true, result: {events: []}}
calendar/create:
  request: {operation_version: 1, parameters: {calendar: primary, event: {id: event-1, title: Review, start: '2026-07-19T12:00:00Z', end: '2026-07-19T13:00:00Z'}}}
  success: {ok: true, result: {event: {id: event-1, title: Review, start: '2026-07-19T12:00:00Z', end: '2026-07-19T13:00:00Z'}}}
calendar/update:
  request: {operation_version: 1, parameters: {calendar: primary, event: {id: event-1, title: Revised, start: '2026-07-19T12:00:00Z', end: '2026-07-19T13:00:00Z'}}}
  success: {ok: true, result: {event: {id: event-1, title: Revised, start: '2026-07-19T12:00:00Z', end: '2026-07-19T13:00:00Z'}}}
calendar/delete:
  request: {operation_version: 1, parameters: {calendar: primary, event_id: event-1}}
  success: {ok: true, result: {deleted: true}}
email/list:
  request: {operation_version: 1, parameters: {account: work, mailbox: inbox}}
  success: {ok: true, result: {messages: []}}
email/read:
  request: {operation_version: 1, parameters: {account: work, message_id: message-1}}
  success: {ok: true, result: {message: {id: message-1, from: sender@example.invalid, to: [user@example.invalid], subject: Test, body: Hello}}}
email/search:
  request: {operation_version: 1, parameters: {account: work, query: 'subject:Test'}}
  success: {ok: true, result: {messages: []}}
email/send:
  request: {operation_version: 1, parameters: {account: work, to: [recipient@example.invalid], subject: Test, body: Hello}}
  success: {ok: true, result: {message_id: message-2}}
