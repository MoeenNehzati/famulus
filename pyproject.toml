[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "famulus-officina"
version = "0.0.0"
description = "Shared Famulus MCP and blueprint-authorized Dispatcher implementation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "jsonschema>=4,<5", "mcp>=1,<2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["officina*"]

[tool.setuptools.package-data]
officina = ["**/*"]

[tool.setuptools.exclude-package-data]
officina = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
