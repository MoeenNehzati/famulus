authority:
  owns_filesystem: []
children:
  pdf-to-markdown-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Obtains readable research-paper source by preferring extracted LaTeX
  archives and otherwise guiding PDF-to-Markdown conversion.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - scholarly-documents
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  pdf-to-markdown.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: pdf-to-markdown.source.gateway.interface.default
  pdf-to-markdown.interface.scripts-check-marker-models:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: pdf-to-markdown-rtx.interface.scripts-check-marker-models
      version: 1
  pdf-to-markdown.interface.scripts-fetch-arxiv-source:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: pdf-to-markdown-rtx.interface.scripts-fetch-arxiv-source
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: pdf-to-markdown
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  pdf-to-markdown.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
