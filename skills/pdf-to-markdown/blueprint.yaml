authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Obtains readable research-paper source by preferring extracted LaTeX
  archives and otherwise guiding PDF-to-Markdown conversion.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - scholarly-documents
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  pdf-to-markdown.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: pdf-to-markdown.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: pdf-to-markdown
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        pdf-to-markdown._rtx.interface.scripts-check-marker-models: 1
        pdf-to-markdown._rtx.interface.scripts-fetch-arxiv-source: 1
    interface_access:
      pdf-to-markdown._rtx.interface.scripts-check-marker-models:
        allow_all_modules: false
        allowed_callers: []
      pdf-to-markdown._rtx.interface.scripts-fetch-arxiv-source:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  pdf-to-markdown.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
