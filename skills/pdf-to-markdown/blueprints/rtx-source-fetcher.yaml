content:
- _rtx/_source_fetcher\.py
dependencies: []
description: Downloads one arXiv source response, rejects non-gzip responses, and otherwise extracts the archive and lists discovered TeX files.
gateway:
  language: Python
  path: _rtx/_source_fetcher.py
id: pdf-to-markdown.source.rtx-source-fetcher
interfaces:
  pdf-to-markdown.source.rtx-source-fetcher.interface.scripts-fetch-arxiv-source:
    contract:
      arguments:
        arxiv-id:
          description: arXiv identifier appended to the source-download endpoint.
          required: true
          sensitivity: public
          type:
            kind: string
            format:
              named: identifier
        output-dir:
          description: Destination directory for the downloaded source archive contents.
          required: false
          default: .
          sensitivity: user-private
          direct_io_ref: write-1
          type:
            kind: dir
            syntax: literal
            relative_to: caller-cwd
            must_exist: false
            access: write
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: The interface creates the output directory and extraction can replace existing paths with names from the downloaded archive.
      - may-wait: The arXiv source request has a 60-second network timeout before archive extraction begins.
      outputs:
      - id: report
        audience: both
        description: Extraction destination followed by the sorted TeX files found recursively.
        direct_io_ref: write-2
        type:
          kind: string
          sensitivity: derived-private
        cardinality:
          minimum: 0
          maximum: 1
        ordering: sorted
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Empty when arXiv returns a non-source response or the request fails.
      - id: diagnostic
        audience: human
        description: Explanation that the requested arXiv submission has no downloadable LaTeX source.
        direct_io_ref: write-3
        type:
          kind: string
          sensitivity: derived-private
        cardinality:
          minimum: 0
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Empty after successful extraction.
      outcomes:
      - id: extracted
        class: success
        outputs: [report]
        effects: [prepare-output-directory, extract-source]
        caller_action: Inspect the listed TeX files and select the document root.
      - id: source-unavailable
        class: refusal
        outputs: [diagnostic]
        effects: [prepare-output-directory]
        caller_action: Continue to another source location or the PDF fallback.
      - id: failed
        class: error
        outputs: []
        effects: [prepare-output-directory]
        caller_action: Report the network or extraction failure and inspect the destination before retrying.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Downloads the current source response served for the requested arXiv identifier.
        effects:
        - id: prepare-output-directory
          direct_io_ref: write-1
          action: create
          value_source:
            kind: argument
            argument_ref: output-dir
          may_occur_in_outcomes: [extracted, source-unavailable, failed]
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-1
          reversibility:
            compensatable: Remove the newly created directory only when it did not exist before the invocation.
        - id: extract-source
          direct_io_ref: write-1
          action: update
          value_source:
            kind: direct-io
            direct_io_ref: network-1
          may_occur_in_outcomes: [extracted]
          confirmation_evidence:
            kind: output
            output_ref: report
          reversibility:
            compensatable: Restore any retained prior destination files or remove newly extracted files.
        mutation_safety:
          atomicity:
            non_atomic: Directory creation, download, and archive-member extraction occur as separate writes.
          concurrent_invocations:
            unsafe: Concurrent calls targeting the same directory can replace or remove one another's temporary archive and extracted files.
          idempotency:
            non_idempotent: Repeated calls can overwrite existing archive-member paths and the remote source response may change.
          on_uncertain_completion:
            verify_then_decide: Inspect the destination directory and listed TeX files before retrying.
          partial_effects_on_failure:
            possible: The destination directory or a subset of archive members can remain after a failed extraction.
          rollback_on_failure:
            unavailable: The interface does not retain backups or remove partially extracted archive members.
        verification:
        - method: output-schema
          output_ref: report
        - method: direct-io-state
          direct_io_ref: write-1
      helpers: []
      direct_io:
        network:
        - access: download
          content: source
          formats:
          - gzip
          - html
          id: network-1
          medium: network-request
          sensitivity: public
          system: arxiv
          endpoint: https://arxiv.org/src/<arxiv-id>
        reads: []
        writes:
        - access: write
          content: source
          formats:
          - binary
          id: write-1
          medium: local-filesystem
          path: <output-dir>
          path_match: exact
          sensitivity: public
          system: filesystem
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-3
          medium: stderr
          sensitivity: derived-private
    description: Download and extract the LaTeX source tarball for a paper from arXiv.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - max_positionals: 2
        min_positionals: 1
        name: owner
    usage: <arxiv-id> <output-dir>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: false
  windows: false
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
