authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Provides the dedicated Python 3.11+ runtime the dispatcher server executes in, and repairs only the declared packages inside it, without depending on MCP.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics: [assistant-installation, system-maintenance]
    visibility: listed
  activated_by: [user-request, skill-workflow]
  persistent_modifier: false
exports:
  setup-dispatcher-runtime.interface.repair-selected-packages:
    access: {allow_all_modules: true, allowed_callers: []}
    source_interface: setup-dispatcher-runtime.source.gateway.interface.default
  setup-dispatcher-runtime.interface.setup:
    access: {allow_all_modules: true, allowed_callers: []}
    setup_requires_setup_of: []
    source_interface: setup-dispatcher-runtime.source.gateway.interface.default
gateway: {language: Markdown, path: SKILL.md}
id: setup-dispatcher-runtime
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  setup-dispatcher-runtime.source.gateway:
    blueprint: {base: module-root, path: blueprints/gateway.yaml}
version: 1
maturity: stable
installation_tier: core
personal_preference:
  applies: false
