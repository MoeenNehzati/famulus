content:
- _browser_helper\.py
- _loopback_oauth\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-client-config.yaml
  reason: Loads and preflights the canonical redacted client and its exact client-secret
    reference before opening the callback listener.
  source: connect-google._rtx.source.rtx-client-config
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: connect-google._rtx.source.rtx-init
  version: 1
description: Requests one combined Google OAuth 2.0 PKCE grant covering every selected
  service's scope, creates a new timestamped credential descriptor, and stores secrets
  only in the host secret store.
gateway:
  language: Python
  path: _loopback_oauth.py
id: connect-google._rtx.source.rtx-authorize-services
interfaces:
  connect-google._rtx.source.rtx-authorize-services.interface.authorize-services:
    contract:
      arguments:
        services:
          description: Comma-separated Google services to request in one combined
            grant (drive, calendar, gmail).
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        account-hint:
          description: Expected Google account email; the grant is rejected without
            storing a credential if the authorized account differs.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        home:
          description: Home directory used to resolve the canonical client and descriptor
            directory; defaults to the host home.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        no-open-browser:
          default: false
          description: Print the manual authorization URL and same-port forwarding
            guidance without attempting to launch a local browser.
          required: false
          sensitivity: public
          type:
            kind: flag
        callback-port:
          description: Explicit TCP port for the loopback listener; omit to let the
            operating system choose an available port.
          required: false
          sensitivity: public
          type:
            kind: integer
      preconditions: []
      interaction:
        mode: interactive
        channel: tty
        unattended_outcome: failed
      caller_warnings:
      - external-side-effect: Prints a manual consent URL, optionally launches the
          host browser in an isolated helper process, starts a bounded local loopback
          listener, and stores a refresh token in the host secret store plus a new
          secret-free timestamped credential descriptor file.
      outputs:
      - id: result
        audience: machine
        description: One JSON object reporting the authorized account, absolute credential
          descriptor path, requested services, and which services were actually granted
          versus denied.
        direct_io_ref: write-3
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: user-private
          format:
            named: json
      outcomes:
      - id: authorized
        class: success
        outputs:
        - result
        effects:
        - credential-descriptor
        caller_action: Pass credential_file to the coordinator for service-owned binding.
      - id: partial-grant
        class: success
        outputs:
        - result
        effects:
        - credential-descriptor
        caller_action: Report denied services to the user; the granted subset is already
          usable.
      - id: refused
        class: refusal
        outputs: []
        effects: []
        caller_action: Ask the user to request an unknown service by its supported
          name, or retry authorization.
      - id: failed
        class: error
        outputs: []
        effects: []
        caller_action: Report the stable phase and code without exposing OAuth secrets;
          do not retry consent unless the failure requires a new authorization.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: The authorization code, state, and granted scopes are all validated
            during this single invocation.
        effects:
        - id: credential-descriptor
          direct_io_ref: write-1
          action: create
          value_source:
            kind: direct-io
            direct_io_ref: token-endpoint
          may_occur_in_outcomes:
          - authorized
          - partial-grant
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-1
          reversibility:
            irreversible: The new descriptor and its new refresh-token secret remain
              until explicitly removed.
        mutation_safety:
          atomicity:
            per_effect_only: The descriptor is exclusively created before its uniquely
              keyed refresh-token secret is stored; a secret-store failure removes
              the newly created descriptor.
          concurrent_invocations:
            safe: Each authorization uses a distinct timestamp-and-random descriptor
              filename and secret reference.
          idempotency:
            non_idempotent: Each run performs a fresh consent exchange and may return
              a different set of granted scopes.
          on_uncertain_completion:
            verify_then_decide: Retain the returned credential_file and use bind-credential-file
              before considering another authorization.
          partial_effects_on_failure:
            possible: A host secret-store failure can occur after exclusive descriptor
              creation; the implementation removes that new descriptor before returning
              failure.
          rollback_on_failure:
            automatic: A secret-store failure removes only the descriptor created by
              this invocation; earlier descriptors are never changed.
        verification:
        - method: output-schema
          output_ref: result
        - method: direct-io-state
          direct_io_ref: write-1
      helpers: []
      direct_io:
        network:
        - id: authorization-endpoint
          medium: network
          access: read-write
          system: google-oauth-authorization-endpoint
          content: PKCE authorization request and user consent
          formats:
          - url-query
          sensitivity: user-private
          endpoint: https://accounts.google.com/o/oauth2/v2/auth
          reason: Present the pinned authorization request in the user's browser;
            client-supplied authorization endpoints are ignored.
        - id: token-endpoint
          medium: network
          access: read-write
          system: google-oauth-token-endpoint
          content: authorization_code PKCE grant exchange
          formats:
          - json
          sensitivity: secret
          endpoint: https://oauth2.googleapis.com/token
          reason: Exchanges the loopback-captured authorization code and PKCE verifier
            for an access token and refresh token.
        - id: userinfo-endpoint
          medium: network
          access: read
          system: google-openid-userinfo-endpoint
          content: OpenID UserInfo claims
          formats:
          - json
          sensitivity: user-private
          endpoint: https://openidconnect.googleapis.com/v1/userinfo
          reason: Confirms the authorized account's verified email before any credential
            is stored.
        - id: browser-consent
          medium: network
          access: read-write
          system: local-loopback-http
          content: one-time OAuth redirect callback with authorization code and state
          formats:
          - url-query
          sensitivity: secret
          endpoint: http://127.0.0.1:<port>/
          reason: Receives one valid root-path browser redirect callback on an operating-system-selected
            or explicit same port, ignoring malformed or unknown-error requests until
            the monotonic consent deadline expires.
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: platform Famulus config root (see credentials.interface.google)
            / connect-google/client.json
          reason: Read the installed client_id and exact client_secret_ref after the
            secret reference resolves; endpoint values and plaintext secrets are
            rejected or ignored rather than trusted from this file.
          sensitivity: secret
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: platform Famulus config root (see credentials.interface.google)
            / connect-google/credentials/<timestamp>-<random>.json
          reason: Create one immutable descriptor recording identity, client, token
            endpoint, granted services/scopes, and opaque secret references. Tokens
            are never written to this file.
          sensitivity: user-private
          system: filesystem
        - access: write
          content: secret
          formats:
          - opaque-secret
          id: write-2
          medium: local-system
          path: host secret store
          reason: Store the new refresh token via credentials.interface.google,
            keyed by the unique credential descriptor filename stem.
          sensitivity: secret
          system: host-credential-store
        - access: write
          content: metadata
          formats:
          - json
          id: write-3
          medium: stdout
          reason: Return the authorization result only -- account, subject, absolute
            credential_file, and per-service grant status, never a token or client
            secret.
          sensitivity: user-private
          system: agent-runtime
        - id: diagnostic-stream
          medium: stderr
          access: write
          system: agent-runtime
          content: oauth-phase-diagnostics
          formats:
          - jsonl
          sensitivity: user-private
          reason: Emit stable phase and code events, the manual authorization URL,
            same-port SSH forwarding guidance, and browser-launch status without
            OAuth secrets.
        - id: browser-helper
          medium: subprocess
          access: execute
          system: default-browser
          content: browser-launch-request
          formats:
          - url-via-stdin
          sensitivity: user-private
          reason: Attempt browser opening without allowing host browser-library hangs
            to block callback handling; the helper is bounded and reaped on every
            terminal path.
    description: Request one combined Google OAuth 2.0 PKCE grant across every selected
      service and return a new timestamped credential descriptor path covering exactly
      the scopes Google granted.
    process_binding:
      entry: AuthorizeServicesInterface
      kind: process
      patterns:
      - allowed_flags:
        - --services
        - --account-hint
        - --home
        - --no-open-browser
        - --callback-port
        flag_patterns:
          --services: ^.+$
          --account-hint: ^.+$
          --home: ^.+$
          --callback-port: ^[0-9]+$
        max_positionals: 0
        min_positionals: 0
        required_flags:
        - --services
    usage: --services <list> [--account-hint <email>] [--home <dir>] [--no-open-browser]
      [--callback-port <port>]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: credentials.interface.google
  version: 1
version: 1
