content:
- _selected_credential\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: connect-google._rtx.source.rtx-init
  version: 1
description: Manage credential selection.
gateway:
  language: Python
  path: _selected_credential.py
id: connect-google._rtx.source.rtx-selected-credential
interfaces:
  connect-google._rtx.source.rtx-selected-credential.interface.select-shared-credential:
    content:
    - _selected_credential\.py
    uses_interfaces:
    - interface: credentials.interface.google
      version: 1
    contract:
      arguments:
        credential-file:
          description: Path to descriptor.
          required: true
          sensitivity: user-private
          type:
            kind: string
      interaction:
        mode: unattended
      outputs:
      - audience: machine
        cardinality: {maximum: 1, minimum: 1}
        description: Credential.
        direct_io_ref: write-1
        empty: Never empty.
        id: result
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        type:
          kind: string
          format:
            named: json
          sensitivity: user-private
      outcomes:
      - caller_action: The selected credential is now active.
        class: success
        effects:
        - selection-pointer
        id: selected
        outputs:
        - result
      - caller_action: Report the failure and ask the user to verify their credentials.
        class: error
        effects: []
        id: failed
        outputs: []
      execution:
        consistency: {live: Updates the credential selection immediately.}
        state_effect: mutating
        lifecycle: finite
        effects:
        - action: create
          confirmation_evidence: {kind: output, output_ref: result}
          direct_io_ref: write-1
          id: selection-pointer
          may_occur_in_outcomes:
          - selected
          reversibility: {reversible: The credential selection file can be deleted.}
          value_source: {kind: output, output_ref: result}
        mutation_safety:
          atomicity:
            per_effect_only: Atomic write.
          concurrent_invocations:
            safe: os.replace() atomic.
          idempotency:
            idempotent: Same inputs same result.
          on_uncertain_completion:
            verify_then_decide: Read to verify.
          partial_effects_on_failure:
            impossible: Atomic.
          rollback_on_failure:
            unavailable: N/A.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: --credential-file argument
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: connect-google/selected-credential.json
          sensitivity: user-private
          system: filesystem
    description: Select credential.
    process_binding:
      entry: SelectSharedCredentialInterface
      kind: process
      patterns:
      - allowed_flags:
        - --credential-file
        - --home
        flag_patterns:
          --credential-file: ^.+$
          --home: ^.+$
        required_flags:
        - --credential-file
    usage: --credential-file <path> [--home <dir>]
    version: 1
  connect-google._rtx.source.rtx-selected-credential.interface.shared-credential:
    content:
    - _selected_credential\.py
    uses_interfaces:
    - interface: credentials.interface.google
      version: 1
    contract:
      arguments: {}
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - audience: machine
        cardinality: {maximum: 1, minimum: 1}
        description: Selected credential with grants or error.
        direct_io_ref: write-1
        empty: Never empty.
        id: result
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        type:
          kind: string
          format:
            named: json
          sensitivity: user-private
      outcomes:
      - caller_action: The selected credential is available.
        class: success
        effects: []
        id: selected
        outputs:
        - result
      - caller_action: Report the failure and ask the user to select a credential.
        class: error
        effects: []
        id: failed
        outputs:
        - result
      execution:
        consistency: {live: Returns the currently selected credential without changes.}
        state_effect: read-only
        lifecycle: finite
        verification:
        - method: output-schema
          output_ref: result
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: platform Famulus config root / connect-google/selected-credential.json
          reason: Load pointer.
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: metadata
          formats:
          - json
          id: write-1
          medium: stdout
          reason: Report credential.
          sensitivity: user-private
          system: agent-runtime
    description: Read credential.
    process_binding:
      entry: SharedCredentialInterface
      kind: process
      patterns:
      - allowed_flags:
        - --home
        flag_patterns:
          --home: ^.+$
    usage: '[--home <dir>]'
    version: 1
node_type: behavioral_source
platform_support: {linux: true, macos: true, windows: true}
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: credentials.interface.google
  version: 1
version: 1
