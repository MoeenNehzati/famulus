authority:
  owns_filesystem:
  - allowed_readers:
    - cloud-files.interface.setup-oauth
    - connect-google.interface.client-status
    - email-client.interface.accounts-setup-oauth
    - g-calendar.interface.setup-oauth
    match: exact
    path: $HOME/.config/connect-google/client.json
    reason: This interface is the only writer of the shared OAuth client; service
      setup interfaces may read it for authorization.
children: {}
content:
- _client_config\.py
- __init__\.py
- tests/.*
description: Code module for the connect-google skill.
exports:
  connect-google-rtx.interface.client-status:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google-rtx.source.rtx-client-config.interface.client-status
  connect-google-rtx.interface.install-client:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google-rtx.source.rtx-client-config.interface.install-client
gateway:
  language: Python>=3.11
  path: __init__.py
id: connect-google-rtx
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  connect-google-rtx.source.rtx-client-config:
    blueprint:
      base: module-root
      path: blueprints/rtx-client-config.yaml
  connect-google-rtx.source.rtx-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-init.yaml
version: 1
