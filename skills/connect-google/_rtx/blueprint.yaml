authority:
  owns_filesystem:
  - allowed_readers:
    - cloud-files._rtx.interface.setup-oauth
    - connect-google._rtx.interface.connect-services
    - connect-google._rtx.interface.client-status
    - email-client._rtx.interface.accounts-setup-oauth
    - online-calendar._rtx.interface.setup-oauth
    match: exact
    path: platform Famulus config root (see credentials.interface.google) /
      connect-google/client.json
    reason: This interface is the only writer of the shared OAuth client; service
      setup interfaces may read it for authorization.
children: {}
content:
- _browser_helper\.py
- _client_config\.py
- _connect_services\.py
- _loopback_oauth\.py
- __init__\.py
- tests/.*
description: Code module for the connect-google skill.
exports:
  connect-google._rtx.interface.bind-credential-file:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google._rtx.source.rtx-connect-services.interface.bind-credential-file
  connect-google._rtx.interface.client-status:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: connect-google._rtx.source.rtx-client-config.interface.client-status
  connect-google._rtx.interface.connect-services:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
      - install-assistant-tools
      - install-assistant-tools._rtx
    source_interface: connect-google._rtx.source.rtx-connect-services.interface.connect-services
  connect-google._rtx.interface.install-client:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google._rtx.source.rtx-client-config.interface.install-client
gateway:
  language: Python>=3.11
  path: __init__.py
id: connect-google._rtx
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  connect-google._rtx.source.rtx-authorize-services:
    blueprint:
      base: module-root
      path: blueprints/rtx-authorize-services.yaml
  connect-google._rtx.source.rtx-client-config:
    blueprint:
      base: module-root
      path: blueprints/rtx-client-config.yaml
  connect-google._rtx.source.rtx-connect-services:
    blueprint:
      base: module-root
      path: blueprints/rtx-connect-services.yaml
  connect-google._rtx.source.rtx-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-init.yaml
version: 1
maturity: experimental
