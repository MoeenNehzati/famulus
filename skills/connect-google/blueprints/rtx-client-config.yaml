content:
- _rtx/_client_config\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: connect-google.source.rtx-init
  version: 1
description: Validates, reports, and atomically installs the canonical Google Desktop OAuth client configuration without printing credential values.
gateway:
  language: Python
  path: _rtx/_client_config.py
id: connect-google.source.rtx-client-config
interfaces:
  connect-google.source.rtx-client-config.interface.client-status:
    contract:
      arguments:
        home: {description: Home directory used to resolve canonical and legacy client paths; defaults to the host home., required: false, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - {id: status, audience: machine, description: One JSON object containing status and client_type and canonical path and optional legacy-candidate metadata without secret values., direct_io_ref: write-1, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty., type: {kind: string, sensitivity: user-private, format: {named: json}}}
      outcomes:
      - {id: reported, class: success, outputs: [status], effects: [], caller_action: Route valid or missing or invalid status without exposing client-file contents.}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: Canonical and legacy candidate files are checked during this invocation.}
        verification: [{method: output-schema, output_ref: status}]
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: platform Famulus config root (see common.interface.google-credentials) / connect-google/client.json
          reason: Validate the installed OAuth client without returning its contents.
          sensitivity: secret
          system: filesystem
        - access: read
          content: config
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: $HOME/.config/cloud-files/client.json
          path_match: exact
          reason: Discover a valid legacy Drive OAuth client that the user may choose
            to import.
          sensitivity: secret
          system: filesystem
        - access: read
          content: config
          formats:
          - json
          id: read-3
          medium: local-filesystem
          path: $HOME/.config/g-calendar/client.json
          path_match: exact
          reason: Discover a valid legacy Calendar OAuth client that the user may
            choose to import.
          sensitivity: secret
          system: filesystem
        writes:
        - access: write
          content: metadata
          formats:
          - json
          id: write-1
          medium: stdout
          reason: Return status, client type, and canonical path only.
          sensitivity: user-private
          system: agent-runtime
    description: Report whether the canonical Google Desktop OAuth client is missing,
      valid, or invalid without exposing its secrets.
    process_binding:
      entry: ClientStatusInterface
      kind: process
      patterns:
      - allowed_flags:
        - --home
        flag_patterns:
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
    usage: '[--home <dir>]'
    version: 1
  connect-google.source.rtx-client-config.interface.install-client:
    contract:
      arguments:
        from-json: {description: Existing Google Desktop OAuth client JSON to validate and install., required: true, sensitivity: secret, direct_io_ref: read-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string, sensitivity: secret, format: {named: json}}}}
        replace: {description: Permit replacement when a different or invalid canonical client already exists., required: false, default: false, sensitivity: public, type: {kind: flag}}
        home: {description: Home directory used to resolve the canonical client destination; defaults to the host home., required: false, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Installs or replaces the private canonical OAuth client file.
      outputs:
      - {id: status, audience: machine, description: One JSON object reporting installed or replaced or unchanged status and desktop client type and canonical path., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty on success., type: {kind: string, sensitivity: user-private, format: {named: json}}}
      outcomes:
      - {id: installed, class: success, outputs: [status], effects: [client-file], caller_action: Continue with service-specific authorization.}
      - {id: unchanged, class: no-op, outputs: [status], effects: [], caller_action: Reuse the already equivalent canonical client.}
      - {id: rejected, class: refusal, outputs: [], effects: [], caller_action: Supply a Desktop client without token fields or explicitly approve replacement.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Source and destination are validated immediately before installation.}
        effects:
        - {id: client-file, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: from-json}, may_occur_in_outcomes: [installed], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {irreversible: A replaced prior client is not retained.}}
        mutation_safety:
          atomicity: {atomic: The canonical JSON is replaced through the shared secure atomic writer.}
          concurrent_invocations: {unsafe: Concurrent installers are not serialized.}
          idempotency: {idempotent: Reinstalling equivalent validated JSON returns unchanged.}
          on_uncertain_completion: {verify_then_decide: Run client-status before retrying.}
          partial_effects_on_failure: {possible: Parent directories may remain even when final replacement fails.}
          rollback_on_failure: {unavailable: No prior client backup is retained.}
        verification:
        - {method: output-schema, output_ref: status}
        - {method: direct-io-state, direct_io_ref: write-1}
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: <client-json>
          path_match: exact
          reason: Validate the user-selected Desktop OAuth client.
          sensitivity: secret
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: platform Famulus config root (see common.interface.google-credentials) / connect-google/client.json
          reason: Install the canonical private client atomically. The client secret is stored via common.interface.google-credentials in the host secret store, not written to this file.
          sensitivity: secret
          system: filesystem
        - access: write
          content: metadata
          formats:
          - json
          id: write-2
          medium: stdout
          reason: Return installation status, client type, and canonical path only.
          sensitivity: user-private
          system: agent-runtime
    description: Validate a Google Desktop OAuth client JSON and atomically install
      a private canonical copy.
    process_binding:
      entry: InstallClientInterface
      kind: process
      patterns:
      - allowed_flags:
        - --from-json
        - --replace
        - --home
        flag_patterns:
          --from-json: ^.+$
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
        required_flags:
        - --from-json
    usage: --from-json <client-json> [--replace] [--home <dir>]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces:
- interface: common.interface.google-credentials
  version: 1
version: 1
