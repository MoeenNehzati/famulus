content:
- SKILL\.md
dependencies:
- blueprint:
    base: module-root
    path: blueprints/personal-preferences-default.yaml
  reason: Apply the user's optional routing preferences.
  source: connect-google.source.personal-preferences-default
  version: 1
description: Selects client creation or service connection based on the canonical
  client-status check and optional user routing preferences.
gateway:
  language: Markdown
  path: SKILL.md
id: connect-google.source.gateway
interfaces:
  connect-google.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: User request to prepare Google authentication or connect one
            or more supported services.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Delegated service owners may open browser authorization
          and write private OAuth configuration.
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - text
          id: read-1
          medium: prompt
          reason: Determine whether the user has a client JSON and which services
            they want.
          sensitivity: user-private
          system: agent-runtime
        writes:
        - access: write
          content: onboarding response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          per_source: Client status and delegated service results are observed at
            invocation time.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: clarification-required
      outcomes:
      - caller_action: Continue with the connected service.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Identify the target services or supply the local Desktop-client
          JSON path.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      - caller_action: Report the failing owner skill and retain the private client
          file.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: The selected Google onboarding route and its result or next required
          action.
        direct_io_ref: write-1
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Route Google OAuth-client preparation according to whether a valid
      Desktop client is already installed.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces:
- interface: connect-google.interface.authorize-services
  version: 1
- interface: connect-google.interface.client-status
  version: 1
- interface: connect-google.source.instructions-connect-services.interface.connect-services
  version: 1
- interface: connect-google.source.instructions-create-client.interface.create-client
  version: 1
- interface: connect-google.interface.install-client
  version: 1
version: 2
