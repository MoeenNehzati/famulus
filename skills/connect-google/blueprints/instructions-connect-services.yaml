content:
- instructions/connect\-services\.md
dependencies:
- blueprint:
    base: module-root
    path: blueprints/personal-preferences-connect-services.yaml
  reason: Apply the user's optional client-installation and service-selection preferences.
  source: connect-google.source.personal-preferences-connect-services
  version: 1
description: Instructs the agent to install or reuse the shared Desktop OAuth client
  and delegate each selected service's authorization setup.
gateway:
  language: Markdown
  path: instructions/connect-services.md
id: connect-google.source.instructions-connect-services
interfaces:
  connect-google.source.instructions-connect-services.interface.connect-services:
    contract:
      arguments:
        client-json-path:
          description: Local Desktop OAuth client JSON path when no valid canonical
            client is installed.
          direct_io_ref: read-1
          required: false
          sensitivity: secret
          type:
            access: read
            content_type:
              format:
                named: json
              kind: string
              sensitivity: secret
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        services:
          description: Supported Google services the user wants to connect.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Service owners may write credentials and open a browser
          authorization flow.
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - text
          id: read-1
          medium: prompt
          reason: Obtain the local path of a Desktop OAuth client when installation
            is needed.
          sensitivity: user-private
          system: agent-runtime
        writes:
        - access: write
          content: service connection response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          per_source: Each service owner reports the connection state it observes.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: clarification-required
      outcomes:
      - caller_action: Continue with each connected service.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Supply target services or the missing client JSON path.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      - caller_action: Report the owning service and failure without exposing OAuth
          secrets.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Per-service connection result and next action.
        direct_io_ref: write-1
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Install or reuse a Google Desktop OAuth client and hand selected
      Google services to their owning skills.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: connect-google._rtx.interface.authorize-services
  version: 1
- interface: connect-google._rtx.interface.client-status
  version: 1
- interface: connect-google._rtx.interface.install-client
  version: 1
version: 2
