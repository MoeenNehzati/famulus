authority:
  owns_filesystem:
  - allowed_readers:
    - cloud-files.interface.setup-oauth
    - connect-google.interface.authorize-services
    - connect-google.interface.client-status
    - email-client.interface.accounts-setup-oauth
    - g-calendar.interface.setup-oauth
    match: exact
    path: platform Famulus config root (see common.interface.google-credentials) / connect-google/client.json
    reason: This interface is the only writer of the shared OAuth client; service
      setup interfaces may read it for authorization.
category: workflow-general-assistant
description: Prepares a shared Google Desktop OAuth client and routes service-specific connection setup without exposing client credentials in prompts.
content:
- SKILL\.md
- _rtx/__init__\.py
- _rtx/_loopback_oauth\.py
- _rtx/_client_config\.py
- instructions/connect\-services\.md
- instructions/create\-client\.md
- personal\-preferences/connect\-services\.md
- personal\-preferences/create\-client\.md
- personal\-preferences/default\.md
- tests/test_authorize_services\.py
- tests/test_client_config\.py
- tests/test_connect_google_llm_routing\.py
- tests/test_service_delegation\.py
discovery:
  mechanism: skill
exports:
  connect-google.interface.authorize-services:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
      - install-assistant-tools
    source_interface: connect-google.source.rtx-authorize-services.interface.authorize-services
  connect-google.interface.client-status:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
      - install-assistant-tools
    source_interface: connect-google.source.rtx-client-config.interface.client-status
  connect-google.interface.connect-services:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google.source.instructions-connect-services.interface.connect-services
  connect-google.interface.create-client:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google.source.instructions-create-client.interface.create-client
  connect-google.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: connect-google.source.gateway.interface.default
  connect-google.interface.install-client:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google.source.rtx-client-config.interface.install-client
gateway:
  language: Markdown
  path: SKILL.md
id: connect-google
kind: setup
node_type: module
role: integration
schema_version: 4
sources:
  connect-google.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  connect-google.source.instructions-connect-services:
    blueprint:
      base: module-root
      path: blueprints/instructions-connect-services.yaml
  connect-google.source.instructions-create-client:
    blueprint:
      base: module-root
      path: blueprints/instructions-create-client.yaml
  connect-google.source.personal-preferences-connect-services:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-connect-services.yaml
  connect-google.source.personal-preferences-create-client:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-create-client.yaml
  connect-google.source.personal-preferences-default:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-default.yaml
  connect-google.source.rtx-authorize-services:
    blueprint:
      base: module-root
      path: blueprints/rtx-authorize-services.yaml
  connect-google.source.rtx-client-config:
    blueprint:
      base: module-root
      path: blueprints/rtx-client-config.yaml
  connect-google.source.rtx-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-init.yaml
version: 1
