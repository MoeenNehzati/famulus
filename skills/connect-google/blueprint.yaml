authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|instructions/connect\-services\.md|instructions/create\-client\.md|personal\-preferences/google\-service\-connection\.md|personal\-preferences/create\-client\.md|personal\-preferences/default\.md)
description: Prepares a shared Google Desktop OAuth client and routes service-specific
  connection setup without exposing client credentials in prompts.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - external-integrations
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  connect-google.interface.connect-services:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google.source.instructions-connect-services.interface.connect-services
  connect-google.interface.create-client:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google.source.instructions-create-client.interface.create-client
  connect-google.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: connect-google.source.gateway.interface.default
  connect-google.interface.setup:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: connect-google.source.gateway.interface.default
    setup_requires_setup_of: []
gateway:
  language: Markdown
  path: SKILL.md
id: connect-google
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        connect-google._rtx.interface.bind-credential-file: 1
        connect-google._rtx.interface.client-status: 1
        connect-google._rtx.interface.connect-services: 1
        connect-google._rtx.interface.install-client: 1
    interface_access:
      connect-google._rtx.interface.bind-credential-file:
        allow_all_modules: false
        allowed_callers:
        - connect-google
      connect-google._rtx.interface.client-status:
        allow_all_modules: false
        allowed_callers:
        - connect-google
        - install-assistant-tools
        - install-assistant-tools._rtx
      connect-google._rtx.interface.connect-services:
        allow_all_modules: false
        allowed_callers:
        - connect-google
        - install-assistant-tools
        - install-assistant-tools._rtx
      connect-google._rtx.interface.install-client:
        allow_all_modules: false
        allowed_callers:
        - connect-google
node_type: module
schema_version: 6
sources:
  connect-google.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  connect-google.source.instructions-connect-services:
    blueprint:
      base: module-root
      path: blueprints/instructions-connect-services.yaml
  connect-google.source.instructions-create-client:
    blueprint:
      base: module-root
      path: blueprints/instructions-create-client.yaml
  connect-google.source.personal-preferences-connect-services:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-connect-services.yaml
  connect-google.source.personal-preferences-create-client:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-create-client.yaml
  connect-google.source.personal-preferences-default:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-default.yaml
version: 2
maturity: experimental
installation_tier: core
personal_preference:
  applies: false
