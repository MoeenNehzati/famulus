authority:
  owns_filesystem: []
category: workflow-general-assistant
children:
  connect-google-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:SKILL\.md|instructions/connect\-services\.md|instructions/create\-client\.md|personal\-preferences/connect\-services\.md|personal\-preferences/create\-client\.md|personal\-preferences/default\.md)
description: Prepares a shared Google Desktop OAuth client and routes service-specific
  connection setup without exposing client credentials in prompts.
discovery:
  mechanism: skill
exports:
  connect-google.interface.authorize-services:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
      - install-assistant-tools
      - install-assistant-tools-rtx
    facade_interface:
      interface: connect-google-rtx.interface.authorize-services
      version: 1
  connect-google.interface.client-status:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
      - install-assistant-tools
      - install-assistant-tools-rtx
    facade_interface:
      interface: connect-google-rtx.interface.client-status
      version: 1
  connect-google.interface.connect-services:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google.source.instructions-connect-services.interface.connect-services
  connect-google.interface.create-client:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    source_interface: connect-google.source.instructions-create-client.interface.create-client
  connect-google.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: connect-google.source.gateway.interface.default
  connect-google.interface.install-client:
    access:
      allow_all_modules: false
      allowed_callers:
      - connect-google
    facade_interface:
      interface: connect-google-rtx.interface.install-client
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: connect-google
kind: setup
namespace_exports: {}
node_type: module
role: integration
schema_version: 5
sources:
  connect-google.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  connect-google.source.instructions-connect-services:
    blueprint:
      base: module-root
      path: blueprints/instructions-connect-services.yaml
  connect-google.source.instructions-create-client:
    blueprint:
      base: module-root
      path: blueprints/instructions-create-client.yaml
  connect-google.source.personal-preferences-connect-services:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-connect-services.yaml
  connect-google.source.personal-preferences-create-client:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-create-client.yaml
  connect-google.source.personal-preferences-default:
    blueprint:
      base: module-root
      path: blueprints/personal-preferences-default.yaml
version: 2
