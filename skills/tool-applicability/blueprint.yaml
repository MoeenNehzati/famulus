authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: workflow-general-assistant
children: {}
content:
- SKILL\.md
description: Determines whether a mathematical tool reaches a stated target under
  current assumptions and identifies the exact nearest valid result or repair.
discovery:
  mechanism: skill
exports:
  tool-applicability.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: tool-applicability.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: tool-applicability
kind: analyzer
namespace_exports: {}
node_type: module
role: math-reasoning
schema_version: 5
sources:
  tool-applicability.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
