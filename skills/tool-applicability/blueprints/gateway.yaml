content:
- SKILL\.md
dependencies: []
description: Implements assumption-provenance and tool-version analysis that separates
  invocation requirements from the stronger steps needed to reach the target.
gateway:
  language: Markdown
  path: SKILL.md
id: tool-applicability.source.gateway
interfaces:
  tool-applicability.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Applicability question identifying or supplying the current
            mathematical setting, target objective, and candidate theorem, framework,
            or method.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network:
        - access: request
          content: Exact theorem or framework statement and hypotheses when external
            verification is needed.
          endpoint: Authoritative source selected for the candidate mathematical tool
          formats:
          - html
          - pdf
          - markdown
          - text
          id: authoritative-source
          medium: network-request
          reason: Avoid treating an approximate recollection as a verified tool contract.
          sensitivity: public
          system: web
        reads:
        - access: read
          content: Applicability request and supplied setting, target, assumptions,
            and tool statement.
          formats:
          - text
          - tex
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Named document sections containing established assumptions, local
            results, the target, or the candidate tool statement.
          formats:
          - tex
          - markdown
          - text
          - pdf
          id: document
          medium: local-filesystem
          reason: Distinguish available assumptions and local results from newly proposed
            hypotheses.
          sensitivity: user-private
        writes:
        - access: write
          content: Applicability diagnosis and nearest valid result.
          formats:
          - markdown
          - tex
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The verdict reflects the assumptions, target, tool version, and
            evidence available in this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the stated verdict class and do not promote an adjacent
          result or speculative route to the requested target.
        class: success
        effects: []
        id: assessed
        outputs:
        - response
      - caller_action: Supply the missing setting, target, candidate tool, or exact
          theorem version.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Concise applicability verdict, assumption provenance, exact tool
          deliverable, gap from the target, weakest plausible repair, and nearby routes
          when useful.
        direct_io_ref: response
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Determine the exact role and deliverable of a candidate mathematical
      tool without blurring current assumptions, added hypotheses, or target strength.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
