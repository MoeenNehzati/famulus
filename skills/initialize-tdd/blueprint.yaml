authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|assets/common/\.gitignore|assets/common/AGENTS\.md|assets/common/README\.md|assets/python/\.gitignore|assets/python/AGENTS\.md|assets/python/README\.md|assets/python/install\.sh|assets/python/logs/\.gitkeep|assets/python/pyproject\.toml|assets/python/requirements\.txt|assets/python/src/project/__init__\.py|assets/python/src/project/config\.py|assets/python/src/project/logger\.py|assets/python/tests/__init__\.py|assets/python/tests/conftest\.py|assets/python/tests/test_logger\.py)
description: Scaffolds a new project with staged TDD instructions, common project
  files, host-compatible instruction aliases, Git initialization, and an optional
  verified Python starter environment.
discovery:
  mechanism: skill
  catalog:
    domain: software-development
    topics:
    - repository-workflow
    - assistant-assurance
    visibility: listed
  activated_by:
  - user-request
  persistent_modifier: false
exports:
  initialize-tdd.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: initialize-tdd.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: initialize-tdd
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        initialize-tdd._rtx.interface.setup-compat-aliases: 1
    interface_access:
      initialize-tdd._rtx.interface.setup-compat-aliases:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  initialize-tdd.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
