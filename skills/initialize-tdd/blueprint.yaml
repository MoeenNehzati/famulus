authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - git
      reason: Suggested approval for project initialization.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_host_links.py
      - Interface
      reason: Creates host compatibility alias symlinks in the newly scaffolded project
        directory only; no writes outside it, no network.
    network: []
category: coding-development-assistant
description: Scaffolds a new project with staged TDD instructions, common project files,
  host-compatible instruction aliases, Git initialization, and an optional verified
  Python starter environment.
content:
- SKILL\.md
- _rtx/_claude_compat_symlink\.py
- _rtx/_host_links\.py
- assets/common/\.gitignore
- assets/common/AGENTS\.md
- assets/common/README\.md
- assets/python/\.gitignore
- assets/python/AGENTS\.md
- assets/python/README\.md
- assets/python/install\.sh
- assets/python/logs/\.gitkeep
- assets/python/pyproject\.toml
- assets/python/requirements\.txt
- assets/python/src/project/__init__\.py
- assets/python/src/project/config\.py
- assets/python/src/project/logger\.py
- assets/python/tests/__init__\.py
- assets/python/tests/conftest\.py
- assets/python/tests/test_logger\.py
- tests/test_host_links_interface\.py
discovery:
  mechanism: skill
exports:
  initialize-tdd.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: initialize-tdd.source.gateway.interface.default
  initialize-tdd.interface.setup-compat-aliases:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: initialize-tdd.source.rtx-host-links.interface.setup-compat-aliases
gateway:
  language: Markdown
  path: SKILL.md
id: initialize-tdd
kind: scaffold
node_type: module
role: development-assistant
schema_version: 4
sources:
  initialize-tdd.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  initialize-tdd.source.rtx-host-links:
    blueprint:
      base: module-root
      path: blueprints/rtx-host-links.yaml
version: 1
