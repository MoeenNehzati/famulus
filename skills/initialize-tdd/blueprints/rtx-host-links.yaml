content:
- _rtx/_claude_compat_symlink\.py
- _rtx/_host_links\.py
dependencies: []
description: Discovers every sibling compatibility-alias helper by filename, loads
  each helper in-process, and applies it to one scaffolded project directory.
gateway:
  language: Python
  path: _rtx/_host_links.py
id: initialize-tdd.source.rtx-host-links
interfaces:
  initialize-tdd.source.rtx-host-links.interface.setup-compat-aliases:
    contract:
      arguments:
        project-dir:
          description: Existing scaffolded project directory in which compatibility
            instruction aliases are created or replaced.
          required: true
          sensitivity: user-private
          direct_io_ref: write-1
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read-write}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Each discovered helper may remove an existing alias path
          before creating its replacement; the current helper replaces CLAUDE.md with
          a symlink to AGENTS.md.
      outputs:
      - id: alias-state
        audience: machine
        description: Compatibility aliases present in the project directory after every
          discovered helper returns successfully.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: user-private, description: Verified filesystem state; successful execution emits no stdout payload}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: The interface emits no stdout; success is represented by exit status and alias state.
      outcomes:
      - {id: completed, class: success, outputs: [alias-state], effects: [compatibility-aliases], caller_action: Continue scaffolding after the aliases exist.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Report the load or filesystem error and do not claim the scaffold is complete.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Helpers are discovered and applied against the filesystem state visible during this invocation.}
        effects:
        - id: compatibility-aliases
          direct_io_ref: write-1
          action: update
          value_source: {kind: argument, argument_ref: project-dir}
          may_occur_in_outcomes: [completed]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {irreversible: Any prior file or symlink at a helper-owned alias path is removed without backup.}
        mutation_safety:
          atomicity: {per_effect_only: Each helper updates its own alias; the full helper sequence is not transactional.}
          concurrent_invocations: {unsafe: Concurrent invocations can race while replacing the same alias paths.}
          idempotency: {idempotent: Re-running against an unchanged project recreates the same aliases.}
          on_uncertain_completion: {verify_then_decide: Inspect the helper-owned alias paths before retrying.}
          partial_effects_on_failure: {possible: Earlier helpers remain applied if a later helper fails.}
          rollback_on_failure: {unavailable: Removed prior alias-path contents are not retained.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: compatibility helper modules
          formats: [python]
          id: read-1
          medium: local-filesystem
          path: $module/_rtx/*_compat_symlink.py
          path_match: glob
          reason: Discover and load every host-specific alias helper in deterministic filename order.
          sensitivity: public
          system: filesystem
        writes:
        - access: read-write
          content: compatibility instruction aliases
          id: write-1
          medium: local-filesystem
          path: <project-dir>/*
          path_match: glob
          reason: The discovered helpers inspect, remove, and recreate their owned alias
            paths; the current helper writes CLAUDE.md as a symlink to AGENTS.md.
          sensitivity: user-private
          system: filesystem
    description: Create every host compatibility alias symlink (e.g. a legacy filename
      some host looks for specifically) in a freshly scaffolded project directory.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        max_positionals: 1
        min_positionals: 1
        notes: First positional is the scaffolded project's directory path. Discovers
          and runs every compat-alias helper next to this script; adding a new host's
          alias later needs no change here.
    usage: <project-dir>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
