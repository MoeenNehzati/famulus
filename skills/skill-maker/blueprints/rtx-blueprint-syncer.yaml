content:
- _rtx/_blueprint_syncer\.py
- tests/test_blueprint_tools\.py
dependencies: []
description: Loads every skill blueprint, validates cross-skill interface and runtime
  declarations, and either checks or refreshes generated SKILL.md contract blocks and
  the runtime-dependency manifest.
gateway:
  language: Python
  path: _rtx/_blueprint_syncer.py
id: skill-maker.source.rtx-blueprint-syncer
interfaces:
  skill-maker.source.rtx-blueprint-syncer.interface.sync-blueprints:
    contract:
      arguments:
        check:
          description: Validate all blueprints and generated artifacts without writing changes.
          required: false
          default: false
          sensitivity: public
          type: {kind: flag}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Without --check, generated contract/interface blocks in
          every skill SKILL.md and the repository runtime-dependency manifest may be replaced.
      outputs:
      - id: diagnostics
        audience: human
        description: Validation or out-of-sync diagnostics written to stderr; successful
          invocations are silent.
        direct_io_ref: write-3
        type: {kind: string, sensitivity: derived-private}
        cardinality: {minimum: 0, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Empty when all blueprints and generated artifacts are valid and synchronized.
      outcomes:
      - {id: checked, class: success, outputs: [], effects: [], caller_action: Continue because all declarations and generated artifacts are synchronized.}
      - {id: synchronized, class: success, outputs: [], effects: [skill-contracts, runtime-manifest], caller_action: Review the refreshed generated artifacts.}
      - {id: invalid, class: error, outputs: [diagnostics], effects: [], caller_action: Correct every reported blueprint or synchronization error before retrying.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Validation and generated content are derived from the blueprint and skill files read during this invocation.}
        effects:
        - id: skill-contracts
          direct_io_ref: write-1
          action: update
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [synchronized]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {irreversible: Previous generated blocks are replaced in place without separate backups.}
        - id: runtime-manifest
          direct_io_ref: write-2
          action: update
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [synchronized]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}
          reversibility: {irreversible: The prior generated manifest is replaced without a separate backup.}
        mutation_safety:
          atomicity: {per_effect_only: "Consumer interface blocks use atomic replacement, while root SKILL.md blocks and the runtime manifest use direct text writes."}
          concurrent_invocations: {unsafe: Concurrent sync invocations are not serialized and may race on generated files.}
          idempotency: {idempotent: Re-running against unchanged blueprints produces the same generated artifacts.}
          on_uncertain_completion: {verify_then_decide: Re-run with --check to determine whether another synchronization is needed.}
          partial_effects_on_failure: {possible: Earlier SKILL.md files may be refreshed before a later write or validation result fails.}
          rollback_on_failure: {unavailable: The syncer does not restore files already replaced during the invocation.}
        verification:
        - {method: direct-io-state, direct_io_ref: read-1}
        - {method: direct-io-state, direct_io_ref: write-2}
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: skill blueprints and generated contracts
          formats: [yaml, markdown]
          id: read-1
          medium: repository-filesystem
          path: $repo/skills/*
          path_match: glob
          reason: Load every root blueprint, reachable declaration, and SKILL.md needed
            for validation and deterministic generation.
          sensitivity: public
          system: filesystem
        - access: read
          content: blueprint schemas and runtime dependency manifest
          formats: [json]
          id: read-2
          medium: repository-filesystem
          path: $repo/references/blueprint/*
          path_match: glob
          reason: Validate blueprint graphs and compare the generated runtime dependency manifest.
          sensitivity: public
          system: filesystem
        writes:
        - access: write
          content: generated skill contract and interface blocks
          formats: [markdown]
          id: write-1
          medium: repository-filesystem
          path: $repo/skills/*/SKILL.md
          path_match: glob
          reason: Refresh generated blueprint blocks when --check is absent.
          sensitivity: public
          system: filesystem
        - access: write
          content: runtime dependency manifest
          formats: [json]
          id: write-2
          medium: repository-filesystem
          path: $repo/references/blueprint/runtime_dependencies.json
          path_match: exact
          reason: Refresh the deterministic runtime dependency manifest when --check is absent.
          sensitivity: public
          system: filesystem
        - access: write
          content: validation diagnostics
          formats: [text]
          id: write-3
          medium: stderr
          reason: Report invalid blueprints or out-of-sync generated artifacts.
          sensitivity: derived-private
          system: agent-runtime
    description: Validate every skill blueprint and either check or refresh generated
      SKILL.md contract blocks and the runtime-dependency manifest.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        forbidden_flags:
        - --check
        max_positionals: 0
        min_positionals: 0
        name: sync
        notes: Refresh generated files from blueprint.yaml.
      - allow_stdin: false
        allowed_flags:
        - --check
        max_positionals: 0
        min_positionals: 0
        name: check
        notes: Validate blueprints and fail if generated files are out of sync.
        required_flags:
        - --check
    usage: '[--check]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses skill blueprint YAML files.
  version: any
schema_version: 4
uses_interfaces:
- interface: common.interface.atomic-files
  version: 1
- interface: common.interface.blueprint-graph
  version: 1
version: 1
