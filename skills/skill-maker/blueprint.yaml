authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Defines the personal skill-authoring workflow and owns repository skill
  conformance validators plus generated blueprint-contract synchronization.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-authoring
    - assistant-architecture
    - assistant-assurance
    - repository-workflow
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  skill-maker.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-maker.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: skill-maker
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        skill-maker._rtx.interface.sync-blueprints: 1
    interface_access:
      skill-maker._rtx.interface.sync-blueprints:
        allow_all_modules: false
        allowed_callers:
        - skill-certifier
node_type: module
schema_version: 6
sources:
  skill-maker.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 5
maturity: stable
installation_tier: core
personal_preference:
  applies: false
