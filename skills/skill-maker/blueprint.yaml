authority:
  owns_filesystem: []
children:
  skill-maker-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Defines the personal skill-authoring workflow and owns repository skill
  conformance validators plus generated blueprint-contract synchronization.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-authoring
    - assistant-architecture
    - assistant-assurance
    - repository-workflow
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  skill-maker.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-maker.source.gateway.interface.default
  skill-maker.interface.sync-blueprints:
    access:
      allow_all_modules: false
      allowed_callers:
      - skill-certifier
    facade_interface:
      interface: skill-maker-rtx.interface.sync-blueprints
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: skill-maker
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  skill-maker.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 3
