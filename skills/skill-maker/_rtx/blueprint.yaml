authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- _blueprint_syncer\.py
- tests/test_blueprint_tools\.py
- __init__\.py
description: Code module for the skill-maker skill.
exports:
  skill-maker._rtx.interface.sync-blueprints:
    access:
      allow_all_modules: false
      allowed_callers:
      - skill-certifier
      - skill-maker
      - relocate-nodes._rtx
    source_interface: skill-maker._rtx.source.rtx-blueprint-syncer.interface.sync-blueprints
gateway:
  language: Python>=3.11
  path: __init__.py
id: skill-maker._rtx
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  skill-maker._rtx.source.rtx-blueprint-syncer:
    blueprint:
      base: module-root
      path: blueprints/rtx-blueprint-syncer.yaml
version: 1
