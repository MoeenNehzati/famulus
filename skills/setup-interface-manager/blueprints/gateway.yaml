- {interface: setup-interface-manager._rtx.interface.run-python, version: 1}
- {interface: setup-interface-manager._rtx.interface.settle, version: 1}
- {interface: setup-interface-manager._rtx.interface.invalidate, version: 1}
- {interface: setup-interface-manager._rtx.interface.teardown-all, version: 1}
- {interface: setup-interface-manager._rtx.interface.recover, version: 1}
version: 1
