        direct_io_ref: response
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Explore a request breadth-first, label uncertainty, and present concise
      strategic structure without silently leaving loose mode.
