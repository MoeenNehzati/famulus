  path: SKILL.md
id: loose-mode.source.gateway
interfaces:
  loose-mode.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Question or task to explore broadly and quickly under loose-mode
            epistemic and presentation rules.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: Broad exploration request and conversation context.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        writes:
        - access: write
          content: Loose-mode strategic exploration.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
