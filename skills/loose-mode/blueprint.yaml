authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Provides a breadth-first reasoning mode for fast strategy, decomposition,
  options, and clearly labeled levels of certainty.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-interaction
    topics:
    - reasoning-control
    visibility: featured
  activated_by:
  - user-request
  persistent_modifier: true
exports:
  loose-mode.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: loose-mode.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: loose-mode
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  loose-mode.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
