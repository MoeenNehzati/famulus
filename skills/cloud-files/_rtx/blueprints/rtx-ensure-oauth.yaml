content:
- _ensure_oauth\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: cloud-files._rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-oauth-bootstrap.yaml
  reason: Executes the sibling OAuth bootstrap gateway when credentials are absent.
  source: cloud-files._rtx.source.rtx-oauth-bootstrap
  version: 1
description: Checks cloud-files OAuth readiness and writes the non-secret cloud-files
  service configuration.
gateway:
  language: Python
  path: _ensure_oauth.py
id: cloud-files._rtx.source.rtx-ensure-oauth
interfaces:
  cloud-files._rtx.source.rtx-ensure-oauth.interface.ensure-oauth:
    content:
    - _ensure_oauth\.py
    uses_interfaces:
    - interface: credentials.interface.google
      version: 1
    contract:
      arguments:
        dry-run:
          default: false
          description: Report the action without launching authorization or writing
            credentials
          required: false
          sensitivity: public
          type:
            kind: flag
        home:
          description: Home directory whose cloud-files configuration is checked
          required: true
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: When client.json is available, the interface may launch
          browser authorization and replace cloud-files credentials.
      direct_io:
        network:
        - access: request
          auth:
            kind: google-drive-oauth
            mode: checks
          content: credential
          endpoint: https://accounts.google.com/o/oauth2/v2/auth
          formats:
          - text
          id: network-1
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth:
            kind: google-drive-oauth
            mode: checks
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats:
          - json
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth:
            kind: google-drive-oauth
            mode: checks
          content: account
          endpoint: https://www.googleapis.com/drive/v3/about?fields=user
          formats:
          - json
          id: network-3
          medium: network-request
          sensitivity: user-private
          system: google-drive
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: $home/.config/cloud-files/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          auth:
            kind: google-drive-oauth
            mode: checks
          content: credential
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: $home/.config/cloud-files/credentials.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        writes:
        - access: write
          content: response
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - access: write
          auth:
            kind: google-drive-oauth
            mode: creates
          content: credential
          formats:
          - json
          id: write-2
          medium: local-filesystem
          path: $home/.config/cloud-files/credentials.json
          path_match: exact
          sensitivity: secret
          system: filesystem
      execution:
        consistency:
          live: Checks current local credential files and, when needed, performs a
            live Google OAuth flow.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: store-credentials
          may_occur_in_outcomes:
          - configured
          reversibility:
            compensatable: Restore a previously retained credentials file.
          value_source:
            direct_io_ref: write-2
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Verified credentials are written as one file after authorization
              succeeds.
          concurrent_invocations:
            unsafe: Concurrent authorization flows can race when replacing the credentials
              file.
          idempotency:
            non_idempotent: Reauthorization issues a fresh OAuth grant and may replace
              the refresh token.
          on_uncertain_completion:
            verify_then_decide: Check the credentials file and Drive access before
              rerunning authorization.
          partial_effects_on_failure:
            possible: Browser authorization can succeed before credential persistence
              fails.
          rollback_on_failure:
            unavailable: The wrapper does not restore a prior credentials file automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: status
      helpers: []
      interaction:
        channel: stdin
        mode: interactive
        unattended_outcome: needs-client-json
      outcomes:
      - caller_action: Continue with Drive operations.
        class: success
        effects:
        - store-credentials
        id: configured
        outputs:
        - status
      - caller_action: Continue with Drive operations.
        class: no-op
        effects: []
        id: already-configured
        outputs:
        - status
      - caller_action: Install a Desktop OAuth client JSON and rerun.
        class: refusal
        effects: []
        id: needs-client-json
        outputs:
        - status
      - caller_action: Continue without cloud-files authorization.
        class: refusal
        effects: []
        id: skipped
        outputs:
        - status
      - caller_action: Report the authorization failure and keep prior credentials
          unchanged.
        class: error
        effects: []
        id: failed
        outputs:
        - status
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Setup guidance followed by the final cloud-files OAuth status
        direct_io_ref: write-1
        empty: A final status line is always printed.
        id: status
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Check cloud-files OAuth status; print setup guidance or launch browser
      authorization as needed. Relocated from install-assistant-tools — invoke directly
      (caller-skill cloud-files) as part of connecting remotes.
    process_binding:
      args_prefix:
      - ensure-oauth
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --home
        - --dry-run
        flag_patterns:
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
        notes: Check OAuth status and guide setup for cloud-files.
        required_flags:
        - --home
    usage: --home <dir> [--dry-run]
    version: 1
  cloud-files._rtx.source.rtx-ensure-oauth.interface.use-google-credential-file:
    content:
    - _ensure_oauth\.py
    uses_interfaces:
    - interface: credentials.interface.google
      version: 1
    contract:
      arguments:
        credential-file:
          description: Credential descriptor path created by connect-google.
          direct_io_ref: read-credential
          required: true
          sensitivity: user-private
          type:
            access: read
            kind: file
            must_exist: true
            opaque_content: true
            relative_to: caller-cwd
            syntax: literal
        home:
          description: Home directory under which cloud-files config is written.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        allow-account-change:
          default: false
          description: Explicit approval to replace prior Drive OAuth state when
            its stable Google subject differs or cannot be established.
          required: false
          sensitivity: user-private
          type:
            kind: flag
      caller_warnings:
      - external-side-effect: Performs a live Drive read and writes credential_file
          only after scope, account-change, refresh, and probe checks succeed.
      direct_io:
        network:
        - access: read
          content: access-token refresh and Drive files probe
          endpoint: Google OAuth token endpoint from the descriptor and Drive API
            /files?pageSize=1&fields=files(id)
          formats:
          - json
          id: drive-probe
          medium: network
          reason: Verify live Drive access before changing service configuration.
          sensitivity: secret
          system: google-drive-api
        reads:
        - access: read
          content: credential descriptor
          formats:
          - json
          id: read-credential
          medium: local-filesystem
          path: caller-supplied credential descriptor path
          reason: Validate identity and Drive scope and resolve secret references.
          sensitivity: user-private
          system: filesystem
        - access: read
          content: config
          formats:
          - json
          id: read-config
          medium: local-filesystem
          path: $home/.config/cloud-files/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-config-file
          medium: local-filesystem
          path: $home/.config/cloud-files/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: binding result
          formats:
          - json
          id: write-result
          medium: stdout
          sensitivity: user-private
          system: agent-runtime
      execution:
        consistency:
          live: The descriptor, prior binding identity, token refresh, and Drive
            probe are checked before the config write.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-result
            kind: direct-io
          direct_io_ref: write-config-file
          id: bind-file
          may_occur_in_outcomes:
          - bound
          reversibility:
            reversible: A later explicitly approved binding may replace credential_file.
          value_source:
            argument_ref: credential-file
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: One config file is written only after all verification succeeds.
          concurrent_invocations:
            unsafe: Concurrent config writers can overwrite preserved fields.
          idempotency:
            idempotent: Rebinding the same verified path converges to the same value.
          on_uncertain_completion:
            verify_then_decide: Read config.json before retrying.
          partial_effects_on_failure:
            impossible: Scope, identity, refresh, and probe failures occur before writing.
          rollback_on_failure:
            unavailable: A low-level failure during the direct file write has no retained backup.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use Drive with the recorded credential_file path.
        class: success
        effects:
        - bind-file
        id: bound
        outputs:
        - result
      - caller_action: Correct the file, scope, account approval, or live access before retrying.
        class: error
        effects: []
        id: failed
        outputs:
        - result
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Stable JSON reporting service, normalized path, account, bound,
          verified, or a stable error.
        direct_io_ref: write-result
        empty: Never empty.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      preconditions: []
    description: Validate and live-probe a Drive credential descriptor before
      storing only its normalized absolute path in cloud-files config.
    process_binding:
      args_prefix:
      - use-google-credential-file
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --credential-file
        - --home
        - --allow-account-change
        flag_patterns:
          --credential-file: ^.+$
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
        required_flags:
        - --credential-file
        - --home
    usage: --credential-file <path> --home <dir> [--allow-account-change]
    version: 1
  cloud-files._rtx.source.rtx-ensure-oauth.interface.use-google-credential:
    content:
    - _ensure_oauth\.py
    uses_interfaces:
    - interface: credentials.interface.google
      version: 1
    contract:
      arguments:
        credential-id:
          description: Opaque shared credential identifier issued by connect-google's
            authorize_services flow
          required: true
          sensitivity: user-private
          type:
            kind: string
        home:
          description: Home directory under which cloud-files config is written
          required: true
          sensitivity: user-private
          type:
            kind: string
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Replaces cloud-files config.json's credential_id, binding
          cloud-files to the shared credential going forward.
      outputs: []
      outcomes:
      - id: bound
        class: success
        outputs: []
        effects:
        - write-config
        caller_action: Cloud-files now authenticates using the shared credential.
      - id: insufficient-scope
        class: refusal
        outputs: []
        effects: []
        caller_action: Re-run connect-google's authorization with Drive scope included,
          then retry.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Loads the current credential registry entry and validates granted
            scopes before writing.
        effects:
        - id: write-config
          direct_io_ref: write-1
          action: update
          value_source:
            kind: argument
            argument_ref: credential-id
          may_occur_in_outcomes:
          - bound
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-1
          reversibility:
            compensatable: Restore a previously retained config.json or call write-config
              again.
        mutation_safety:
          atomicity:
            per_effect_only: One config file is rewritten after scope validation succeeds.
          concurrent_invocations:
            unsafe: Concurrent writers can overwrite one another's preserved settings.
          idempotency:
            idempotent: Repeating the same credential-id converges to the same configuration
              value.
          on_uncertain_completion:
            verify_then_decide: Read config.json before deciding whether to retry.
          partial_effects_on_failure:
            possible: A direct file write can be interrupted after truncation.
          rollback_on_failure:
            unavailable: The interface does not retain an automatic backup.
        verification:
        - method: direct-io-state
          direct_io_ref: write-1
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: $home/.config/cloud-files/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: $home/.config/cloud-files/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
    description: Bind cloud-files to a shared connect-google credential_id after validating
      it carries Drive scope, storing only the opaque identifier (never the client
      secret or refresh token) in cloud-files' own config.json. The pre-existing per-service
      OAuth path (ensure-oauth/write-config) remains the unchanged fallback for callers
      who have not adopted the shared credential.
    process_binding:
      args_prefix:
      - use-google-credential
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --credential-id
        - --home
        flag_patterns:
          --credential-id: ^.+$
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
        notes: Bind cloud-files to a shared Google credential_id.
        required_flags:
        - --credential-id
        - --home
    usage: --credential-id <id> --home <dir>
    version: 1
  cloud-files._rtx.source.rtx-ensure-oauth.interface.write-config:
    content:
    - _ensure_oauth\.py
    uses_interfaces:
    - interface: credentials.interface.google
      version: 1
    contract:
      arguments:
        dry-run:
          default: false
          description: Report the target without changing config.json
          required: false
          sensitivity: public
          type:
            kind: flag
        home:
          description: Home directory under which cloud-files config is written
          required: true
          sensitivity: user-private
          type:
            kind: string
        remote-llm-root:
          default: assistant/
          description: Relative Drive folder used as the LLM root
          required: false
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: A non-dry-run call creates or replaces cloud-files config.json
          while preserving selected existing settings.
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: <home>/.config/cloud-files/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: $home/.config/cloud-files/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: response
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-3
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Reads the current config before replacing it with normalized settings.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: write-config
          may_occur_in_outcomes:
          - configured
          reversibility:
            compensatable: Restore a previously retained config.json.
          value_source:
            argument_ref: remote-llm-root
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: One config file is rewritten after input normalization.
          concurrent_invocations:
            unsafe: Concurrent writers can overwrite one another's preserved settings.
          idempotency:
            idempotent: Repeating the same options converges to the same configuration
              values.
          on_uncertain_completion:
            verify_then_decide: Read config.json before deciding whether to retry.
          partial_effects_on_failure:
            possible: A direct file write can be interrupted after truncation.
          rollback_on_failure:
            unavailable: The interface does not retain an automatic backup.
        state_effect: mutating
        verification:
        - direct_io_ref: write-1
          method: direct-io-state
        - method: output-schema
          output_ref: status
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the configured Drive root.
        class: success
        effects:
        - write-config
        id: configured
        outputs: []
      - caller_action: Review the dry-run target and rerun without --dry-run to apply
          it.
        class: no-op
        effects: []
        id: previewed
        outputs:
        - status
      - caller_action: Supply a relative root without parent-directory segments.
        class: error
        effects: []
        id: invalid-root
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Dry-run message naming the config path that would be written.
        direct_io_ref: write-2
        empty: Printed only for a successful dry-run preview.
        id: status
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Invalid-root diagnostic emitted on stderr.
        direct_io_ref: write-3
        empty: Printed only when root normalization fails.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Write ~/.config/cloud-files/config.json with the given remote LLM
      root. Relocated from install-assistant-tools.
    process_binding:
      args_prefix:
      - write-config
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --home
        - --remote-llm-root
        - --dry-run
        flag_patterns:
          --home: ^.+$
          --remote-llm-root: ^.+$
        max_positionals: 0
        min_positionals: 0
        notes: Write cloud-files config.json.
        required_flags:
        - --home
    usage: --home <dir> [--remote-llm-root <path>] [--dry-run]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: credentials.interface.google
  version: 1
version: 1
