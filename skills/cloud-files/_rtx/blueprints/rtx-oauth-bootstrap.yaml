content:
- _oauth_bootstrap\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: cloud-files._rtx.source.rtx-init
  version: 1
description: Runs the interactive Google Drive OAuth authorization-code flow, verifies
  access, and stores refresh credentials.
gateway:
  language: Python
  path: _oauth_bootstrap.py
id: cloud-files._rtx.source.rtx-oauth-bootstrap
interfaces:
  cloud-files._rtx.source.rtx-oauth-bootstrap.interface.setup-oauth:
    contract:
      arguments:
        client-id:
          default: ''
          description: OAuth client identifier used when no client JSON is supplied
          required: false
          sensitivity: credential
          type:
            kind: string
        client-secret:
          default: ''
          description: OAuth client secret paired with client-id
          required: false
          sensitivity: secret
          type:
            kind: string
        from-json:
          default: $home/.config/cloud-files/client.json
          description: Optional Google Desktop OAuth client JSON path
          required: false
          sensitivity: secret
          type:
            kind: string
        port:
          default: 8765
          description: Local callback server port
          required: false
          sensitivity: public
          type:
            kind: integer
            maximum: 65535
            minimum: 1
      caller_warnings:
      - external-side-effect: Opens a browser, creates an OAuth grant, and replaces
          the stored cloud-files credentials after verification.
      direct_io:
        network:
        - access: request
          auth:
            kind: google-drive-oauth
            mode: creates
          content: credential
          endpoint: https://accounts.google.com/o/oauth2/v2/auth
          formats:
          - text
          id: network-1
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth:
            kind: google-drive-oauth
            mode: creates
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats:
          - json
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth:
            kind: google-drive-oauth
            mode: checks
          content: account
          endpoint: https://www.googleapis.com/drive/v3/about?fields=user
          formats:
          - json
          id: network-3
          medium: network-request
          sensitivity: user-private
          system: google-drive
        reads:
        - access: read
          content: credential
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: $home/.config/cloud-files/client.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        writes:
        - access: write
          auth:
            kind: google-drive-oauth
            mode: creates
          content: credential
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: $home/.config/cloud-files/credentials.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        - access: write
          content: response
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          live: Exchanges a one-time browser authorization code and verifies the returned
            access token against Drive.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: store-credentials
          may_occur_in_outcomes:
          - configured
          reversibility:
            compensatable: Restore a retained prior credential file or revoke the
              grant.
          value_source:
            direct_io_ref: write-1
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: Credential JSON is atomically replaced only after token exchange
              and Drive verification succeed.
          concurrent_invocations:
            unsafe: Concurrent callback servers or credential replacements can conflict.
          idempotency:
            non_idempotent: Each successful run creates or refreshes an OAuth grant.
          on_uncertain_completion:
            verify_then_decide: Verify Drive access with the stored credential before
              rerunning.
          partial_effects_on_failure:
            possible: Google may record consent even when local persistence later
              fails.
          rollback_on_failure:
            unavailable: The interface cannot automatically revoke a remotely created
              grant.
        state_effect: mutating
        verification:
        - direct_io_ref: write-1
          method: direct-io-state
        - method: output-schema
          output_ref: status
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: failed
      outcomes:
      - caller_action: Continue with Drive operations and retain the reported credential
          path.
        class: success
        effects:
        - store-credentials
        id: configured
        outputs:
        - status
      - caller_action: Report that authorization was denied without changing credentials.
        class: refusal
        effects: []
        id: denied
        outputs:
        - status
      - caller_action: Report the setup failure and keep prior credentials unchanged.
        class: error
        effects: []
        id: failed
        outputs:
        - status
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Browser guidance, authorization URL, and saved-credentials confirmation
          emitted on stdout.
        direct_io_ref: write-2
        empty: Validation can fail before guidance is printed.
        id: status
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Run one-time OAuth2 setup for Google Drive access.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --client-id
        - --client-secret
        - --from-json
        - --port
        flag_patterns:
          --client-id: ^.+$
          --client-secret: ^.+$
          --from-json: ^.+$
          --port: ^\d+$
        max_positionals: 0
        min_positionals: 0
        notes: OAuth setup for Google Drive access.
    usage: '[--from-json <client_json_path>] [--client-id <id> --client-secret <secret>]
      [--port <port>]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: credentials.interface.oauth
  version: 1
version: 1
maturity: experimental
