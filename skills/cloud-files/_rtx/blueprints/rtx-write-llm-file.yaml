content:
- _write_llm_file\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: cloud-files._rtx.source.rtx-init
  version: 1
description: Reads text from standard input and uploads it to a caller-authorized
  list or plan file beneath the configured Google Drive root.
gateway:
  language: Python
  path: _write_llm_file.py
id: cloud-files._rtx.source.rtx-write-llm-file
interfaces:
  cloud-files._rtx.source.rtx-write-llm-file.interface.lists-write:
    content:
    - _write_llm_file\.py
    uses_interfaces: []
    contract:
      arguments:
        content:
          description: Complete UTF-8 text to store
          required: true
          sensitivity: user-private
          type:
            kind: string
        path:
          description: Relative list path beginning with lists/.
          required: true
          sensitivity: user-private
          type:
            format:
              regex:
                dialect: python
                example: lists/todo.yaml
                matching: full
                pattern: ^lists/.+
            kind: string
      caller_warnings:
      - external-side-effect: Replaces an existing remote file at the same path.
      - rate-limited: Google Drive API quotas apply.
      direct_io:
        network:
        - access: upload
          auth:
            kind: google-drive-oauth
            mode: uses-existing
          content: list
          endpoint: https://www.googleapis.com/upload/drive/v3/files
          formats:
          - text
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: google-drive
        - access: request
          auth:
            kind: google-drive-oauth
            mode: uses-existing
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats:
          - json
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        reads:
        - access: read
          content: list
          formats:
          - text
          id: read-1
          medium: stdin
          sensitivity: user-private
        writes:
        - access: write
          auth:
            kind: google-drive-oauth
            mode: uses-existing
          content: list
          formats:
          - text
          id: write-1
          medium: remote-filesystem
          path: lists/<path>
          path_match: exact
          sensitivity: user-private
          system: google-drive
      execution:
        consistency:
          live: Writes current Google Drive state during this invocation.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: store-file
          may_occur_in_outcomes:
          - written
          reversibility:
            compensatable: Restore a previously retained value or delete the new file.
          value_source:
            argument_ref: content
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: The interface performs one Drive file create-or-update
              request after resolving the path.
          concurrent_invocations:
            unsafe: Concurrent writes to the same remote path can overwrite one another.
          idempotency:
            idempotent: Repeating the same path and content converges to the same
              stored text.
          on_uncertain_completion:
            verify_then_decide: Read the remote file before deciding whether to retry.
          partial_effects_on_failure:
            possible: A network interruption can leave remote completion uncertain.
          rollback_on_failure:
            unavailable: The interface keeps no previous remote value for automatic
              rollback.
        state_effect: mutating
        verification:
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Treat the file as written.
        class: success
        effects:
        - store-file
        id: written
        outputs: []
      - caller_action: Report stderr and verify remote state before retrying an interrupted
          request.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs: []
      preconditions: []
    description: Write content (from stdin) to a file in cloud storage under the lists/
      directory.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: true
        max_positionals: 1
        min_positionals: 1
        notes: Write list files to cloud storage. Restricted to lists/ directory.
        positional_patterns:
          '0': ^lists/.*
    usage: lists/<path>
    version: 1
