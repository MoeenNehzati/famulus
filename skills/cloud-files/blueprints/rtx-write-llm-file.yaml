content:
- _rtx/_write_llm_file\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: cloud-files.source.rtx-init
  version: 1
description: Reads text from standard input and uploads it to a caller-authorized list or plan file beneath the configured Google Drive root.
gateway:
  language: Python
  path: _rtx/_write_llm_file.py
id: cloud-files.source.rtx-write-llm-file
interfaces:
  cloud-files.source.rtx-write-llm-file.interface.lists-write:
    contract:
      arguments:
        path: {description: Relative list path beginning with lists/., required: true, sensitivity: user-private, type: {kind: string, format: {regex: {pattern: '^lists/.+', dialect: python, matching: full, example: lists/todo.yaml}}}}
        content: {description: Complete UTF-8 text to store, required: true, sensitivity: user-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Replaces an existing remote file at the same path.
      - rate-limited: Google Drive API quotas apply.
      outputs: []
      outcomes:
      - {id: written, class: success, outputs: [], effects: [store-file], caller_action: Treat the file as written.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Report stderr and verify remote state before retrying an interrupted request.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Writes current Google Drive state during this invocation.}
        effects:
        - {id: store-file, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: content}, may_occur_in_outcomes: [written], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Restore a previously retained value or delete the new file.}}
        mutation_safety:
          atomicity: {per_effect_only: The interface performs one Drive file create-or-update request after resolving the path.}
          concurrent_invocations: {unsafe: Concurrent writes to the same remote path can overwrite one another.}
          idempotency: {idempotent: Repeating the same path and content converges to the same stored text.}
          on_uncertain_completion: {verify_then_decide: Read the remote file before deciding whether to retry.}
          partial_effects_on_failure: {possible: A network interruption can leave remote completion uncertain.}
          rollback_on_failure: {unavailable: The interface keeps no previous remote value for automatic rollback.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
      direct_io:
        network:
        - access: upload
          auth:
            kind: google-drive-oauth
            mode: uses-existing
          content: list
          endpoint: https://www.googleapis.com/upload/drive/v3/files
          formats:
          - text
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: google-drive
        - access: request
          auth: {kind: google-drive-oauth, mode: uses-existing}
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats: [json]
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        reads:
        - access: read
          content: list
          formats:
          - text
          id: read-1
          medium: stdin
          sensitivity: user-private
        writes:
        - access: write
          auth:
            kind: google-drive-oauth
            mode: uses-existing
          content: list
          formats:
          - text
          id: write-1
          medium: remote-filesystem
          path: lists/<path>
          path_match: exact
          sensitivity: user-private
          system: google-drive
    description: Write content (from stdin) to a file in cloud storage under the lists/
      directory.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: true
        max_positionals: 1
        min_positionals: 1
        notes: Write list files to cloud storage. Restricted to lists/ directory.
        positional_patterns:
          '0': ^lists/.*
    usage: lists/<path>
    version: 1
  cloud-files.source.rtx-write-llm-file.interface.plans-write:
    contract:
      arguments:
        path: {description: Relative plan path beginning with plans/., required: true, sensitivity: user-private, type: {kind: string, format: {regex: {pattern: '^plans/.+', dialect: python, matching: full, example: plans/2026-07-22.md}}}}
        content: {description: Complete UTF-8 text to store, required: true, sensitivity: user-private, type: {kind: string}}
