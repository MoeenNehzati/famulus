content:
- SKILL\.md
dependencies: []
description: Owns the LLM-facing cloud-files instructions and routes storage requests
  to caller-scoped machine interfaces.
gateway:
  language: Markdown
  path: SKILL.md
id: cloud-files.source.gateway
interfaces:
  cloud-files.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: connect-google.interface.default
      version: 1
    - interface: cloud-files._rtx.interface.lists-delete
      version: 1
    - interface: cloud-files._rtx.interface.lists-read
      version: 1
    - interface: cloud-files._rtx.interface.lists-write
      version: 1
    - interface: cloud-files._rtx.interface.plans-delete
      version: 1
    - interface: cloud-files._rtx.interface.plans-read
      version: 1
    - interface: cloud-files._rtx.interface.plans-write
      version: 1
    - interface: cloud-files._rtx.interface.write-config
      version: 1
    contract:
      arguments:
        request:
          description: User request for cloud-file setup or storage guidance.
          required: true
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: Storage workflows may create, replace, or delete remote
          files through separately declared interfaces.
      direct_io:
        network: []
        reads:
        - access: read
          content: document
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          live: The response reflects the workflow state observed during this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the response and any separately returned file content.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Report the setup or storage failure.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Markdown response describing or reporting the requested cloud-files
          workflow.
        direct_io_ref: write-1
        empty: The interface always returns a response.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: connect-google.interface.default
  version: 1
- interface: cloud-files._rtx.interface.lists-delete
  version: 1
- interface: cloud-files._rtx.interface.lists-read
  version: 1
- interface: cloud-files._rtx.interface.lists-write
  version: 1
- interface: cloud-files._rtx.interface.plans-delete
  version: 1
- interface: cloud-files._rtx.interface.plans-read
  version: 1
- interface: cloud-files._rtx.interface.plans-write
  version: 1
- interface: cloud-files._rtx.interface.write-config
  version: 1
version: 2
maturity: experimental
