content:
- _rtx/_delete_llm_file\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: cloud-files.source.rtx-init
  version: 1
description: Deletes a caller-authorized list or plan file beneath the configured Google Drive root.
gateway:
  language: Python
  path: _rtx/_delete_llm_file.py
id: cloud-files.source.rtx-delete-llm-file
interfaces:
  cloud-files.source.rtx-delete-llm-file.interface.lists-delete:
    contract:
      arguments:
        path: {description: Relative list path beginning with lists/., required: true, sensitivity: user-private, type: {kind: string, format: {regex: {pattern: '^lists/.+', dialect: python, matching: full, example: lists/todo.yaml}}}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Permanently deletes the selected Google Drive file; no backup is made.
      - rate-limited: Google Drive API quotas apply.
      outputs: []
      outcomes:
      - {id: deleted, class: success, outputs: [], effects: [delete-file], caller_action: Remove any local reference that assumed the file still exists.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Report stderr and verify remote state before retrying an interrupted request.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Resolves and deletes against current Google Drive state.}
        effects:
        - {id: delete-file, direct_io_ref: write-1, action: delete, value_source: {kind: argument, argument_ref: path}, may_occur_in_outcomes: [deleted], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {irreversible: This interface does not retain deleted content or expose restoration.}}
        mutation_safety:
          atomicity: {per_effect_only: One resolved Drive file is deleted.}
          concurrent_invocations: {unsafe: Concurrent operations can race with path resolution or deletion.}
          idempotency: {non_idempotent: Repeating deletion after success reports the file as absent.}
          on_uncertain_completion: {verify_then_decide: Attempt a read or listing before retrying.}
          partial_effects_on_failure: {possible: Network interruption can leave deletion completion uncertain.}
          rollback_on_failure: {unavailable: Deleted content is not retained by this interface.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
      direct_io:
        network:
        - access: delete
          auth:
            kind: google-drive-oauth
            mode: uses-existing
          content: list
          endpoint: https://www.googleapis.com/drive/v3/files
          formats:
          - text
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: google-drive
        - access: request
          auth: {kind: google-drive-oauth, mode: uses-existing}
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats: [json]
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        reads: []
        writes:
        - access: delete
          auth:
            kind: google-drive-oauth
            mode: uses-existing
          content: list
          formats:
          - text
          id: write-1
          medium: remote-filesystem
          path: lists/<path>
          path_match: exact
          sensitivity: user-private
          system: google-drive
    description: Delete a file from cloud storage under the lists/ directory.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        max_positionals: 1
        min_positionals: 1
        notes: Delete list files from cloud storage. Restricted to lists/ directory.
        positional_patterns:
          '0': ^lists/.*
    usage: lists/<path>
    version: 1
