content:
- _rtx/_oauth_bootstrap\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: cloud-files.source.rtx-init
  version: 1
description: Runs the interactive Google Drive OAuth authorization-code flow, verifies access, and stores refresh credentials.
gateway:
  language: Python
  path: _rtx/_oauth_bootstrap.py
id: cloud-files.source.rtx-oauth-bootstrap
interfaces:
  cloud-files.source.rtx-oauth-bootstrap.interface.setup-oauth:
    contract:
      arguments:
        from-json: {description: Optional Google Desktop OAuth client JSON path, required: false, default: $home/.config/cloud-files/client.json, sensitivity: secret, type: {kind: string}}
        client-id: {description: OAuth client identifier used when no client JSON is supplied, required: false, default: '', sensitivity: credential, type: {kind: string}}
        client-secret: {description: OAuth client secret paired with client-id, required: false, default: '', sensitivity: secret, type: {kind: string}}
        port: {description: Local callback server port, required: false, default: 8765, sensitivity: public, type: {kind: integer, minimum: 1, maximum: 65535}}
      preconditions: []
      interaction: {mode: interactive, channel: tty, unattended_outcome: failed}
      caller_warnings:
      - external-side-effect: Opens a browser, creates an OAuth grant, and replaces the stored cloud-files credentials after verification.
      outputs:
      - {id: status, audience: both, description: "Browser guidance, authorization URL, and saved-credentials confirmation emitted on stdout.", direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Validation can fail before guidance is printed., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: configured, class: success, outputs: [status], effects: [store-credentials], caller_action: Continue with Drive operations and retain the reported credential path.}
      - {id: denied, class: refusal, outputs: [status], effects: [], caller_action: Report that authorization was denied without changing credentials.}
      - {id: failed, class: error, outputs: [status], effects: [], caller_action: Report the setup failure and keep prior credentials unchanged.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Exchanges a one-time browser authorization code and verifies the returned access token against Drive.}
        effects:
        - {id: store-credentials, direct_io_ref: write-1, action: update, value_source: {kind: direct-io, direct_io_ref: write-1}, may_occur_in_outcomes: [configured], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Restore a retained prior credential file or revoke the grant.}}
        mutation_safety:
          atomicity: {atomic: Credential JSON is atomically replaced only after token exchange and Drive verification succeed.}
          concurrent_invocations: {unsafe: Concurrent callback servers or credential replacements can conflict.}
          idempotency: {non_idempotent: Each successful run creates or refreshes an OAuth grant.}
          on_uncertain_completion: {verify_then_decide: Verify Drive access with the stored credential before rerunning.}
          partial_effects_on_failure: {possible: Google may record consent even when local persistence later fails.}
          rollback_on_failure: {unavailable: The interface cannot automatically revoke a remotely created grant.}
        verification:
        - {method: direct-io-state, direct_io_ref: write-1}
        - {method: output-schema, output_ref: status}
      helpers: []
      direct_io:
        network:
        - access: request
          auth:
            kind: google-drive-oauth
            mode: creates
          content: credential
          endpoint: https://accounts.google.com/o/oauth2/v2/auth
          formats:
          - text
          id: network-1
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth: {kind: google-drive-oauth, mode: creates}
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats: [json]
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth: {kind: google-drive-oauth, mode: checks}
          content: account
          endpoint: https://www.googleapis.com/drive/v3/about?fields=user
          formats: [json]
          id: network-3
          medium: network-request
          sensitivity: user-private
          system: google-drive
        reads:
        - access: read
          content: credential
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: $home/.config/cloud-files/client.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        writes:
        - access: write
          auth:
            kind: google-drive-oauth
            mode: creates
          content: credential
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: $home/.config/cloud-files/credentials.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        - access: write
          content: response
          formats: [text]
          id: write-2
          medium: stdout
          sensitivity: derived-private
    description: Run one-time OAuth2 setup for Google Drive access.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --client-id
        - --client-secret
        - --from-json
        - --port
        flag_patterns:
          --client-id: ^.+$
          --client-secret: ^.+$
          --from-json: ^.+$
          --port: ^\d+$
        max_positionals: 0
        min_positionals: 0
        notes: OAuth setup for Google Drive access.
    usage: '[--from-json <client_json_path>] [--client-id <id> --client-secret <secret>]
      [--port <port>]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces:
- interface: common.interface.oauth-json
  version: 1
version: 1
