authority:
  owns_filesystem: []
children:
  cloud-files-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Provides caller-scoped read, write, and delete access to list and plan
  files stored under the configured Google Drive root.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - external-integrations
    - storage-and-sync
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  cloud-files.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: cloud-files.source.gateway.interface.default
  cloud-files.interface.ensure-oauth:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: cloud-files-rtx.interface.ensure-oauth
      version: 1
  cloud-files.interface.lists-delete:
    access:
      allow_all_modules: false
      allowed_callers:
      - list-manager
    facade_interface:
      interface: cloud-files-rtx.interface.lists-delete
      version: 1
  cloud-files.interface.lists-read:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan-rtx
      - list-manager
      - list-manager-rtx
    facade_interface:
      interface: cloud-files-rtx.interface.lists-read
      version: 1
  cloud-files.interface.lists-write:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan-rtx
      - list-manager
      - list-manager-rtx
    facade_interface:
      interface: cloud-files-rtx.interface.lists-write
      version: 1
  cloud-files.interface.plans-delete:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
    facade_interface:
      interface: cloud-files-rtx.interface.plans-delete
      version: 1
  cloud-files.interface.plans-read:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan-rtx
    facade_interface:
      interface: cloud-files-rtx.interface.plans-read
      version: 1
  cloud-files.interface.plans-write:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan-rtx
    facade_interface:
      interface: cloud-files-rtx.interface.plans-write
      version: 1
  cloud-files.interface.setup-oauth:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: cloud-files-rtx.interface.setup-oauth
      version: 1
  cloud-files.interface.write-config:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: cloud-files-rtx.interface.write-config
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: cloud-files
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  cloud-files.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
