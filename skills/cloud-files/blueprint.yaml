authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Provides caller-scoped read, write, and delete access to list and plan
  files stored under the configured Google Drive root.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - external-integrations
    - storage-and-sync
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  cloud-files.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: cloud-files.source.gateway.interface.default
  cloud-files.interface.setup:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: cloud-files.source.gateway.interface.default
    setup_requires_setup_of:
    - interface: connect-google.interface.setup
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: cloud-files
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        cloud-files._rtx.interface.ensure-oauth: 1
        cloud-files._rtx.interface.lists-delete: 1
        cloud-files._rtx.interface.lists-read: 1
        cloud-files._rtx.interface.lists-write: 1
        cloud-files._rtx.interface.plans-delete: 1
        cloud-files._rtx.interface.plans-read: 1
        cloud-files._rtx.interface.plans-write: 1
        cloud-files._rtx.interface.setup-oauth: 1
        cloud-files._rtx.interface.use-google-credential: 1
        cloud-files._rtx.interface.use-google-credential-file: 1
        cloud-files._rtx.interface.write-config: 1
    interface_access:
      cloud-files._rtx.interface.ensure-oauth:
        allow_all_modules: false
        allowed_callers: []
      cloud-files._rtx.interface.lists-delete:
        allow_all_modules: false
        allowed_callers:
        - list-manager
      cloud-files._rtx.interface.lists-read:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
        - daily-plan._rtx
        - list-manager
        - list-manager._rtx
      cloud-files._rtx.interface.lists-write:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
        - daily-plan._rtx
        - list-manager
        - list-manager._rtx
      cloud-files._rtx.interface.plans-delete:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
      cloud-files._rtx.interface.plans-read:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
        - daily-plan._rtx
      cloud-files._rtx.interface.plans-write:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
        - daily-plan._rtx
      cloud-files._rtx.interface.setup-oauth:
        allow_all_modules: false
        allowed_callers: []
      cloud-files._rtx.interface.use-google-credential:
        allow_all_modules: false
        allowed_callers: []
      cloud-files._rtx.interface.use-google-credential-file:
        allow_all_modules: false
        allowed_callers:
        - connect-google
        - connect-google._rtx
      cloud-files._rtx.interface.write-config:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  cloud-files.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: experimental
installation_tier: core
personal_preference:
  applies: false
