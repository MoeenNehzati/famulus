content:
- SKILL\.md
dependencies: []
description: Implements the persistent certainty-first response policy, evidence labels,
  edge-case checks, and agreement gate between diagnosis and repair.
gateway:
  language: Markdown
  path: SKILL.md
id: tight-mode.source.gateway
interfaces:
  tight-mode.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Question or task to answer under rigorous tight-mode verification
            and uncertainty-labeling rules.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: Tight-mode request, conversation context, and supplied evidence.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Named mathematical, code, configuration, test, or documentation
            evidence required to verify the request.
          formats:
          - text
          - markdown
          - tex
          - code
          - json
          - yaml
          - log
          id: evidence
          medium: local-filesystem
          reason: Justify nontrivial claims and check relevant failure cases.
          sensitivity: user-private
        writes:
        - access: write
          content: Rigor-first diagnosis or answer with calibrated status labels.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The answer reflects evidence and preconditions checked for the
            current request while tight mode remains active in conversation state.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: diagnosis-only
      outcomes:
      - caller_action: Use only claims carrying the certainty justified by the presented
          evidence.
        class: success
        effects: []
        id: answered
        outputs:
        - response
      - caller_action: Confirm the diagnosed gap or bug before requesting a detailed
          repair.
        class: success
        effects: []
        id: diagnosis-only
        outputs:
        - response
      - caller_action: Supply the missing evidence, hypothesis, or context needed
          for verification.
        class: refusal
        effects: []
        id: insufficient-evidence
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Short decisive answer with justified claims, checked edge cases,
          and explicit Verified, Likely, Speculative, Gap, or Needs hypothesis labels
          where useful.
        direct_io_ref: response
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Answer under persistent tight-mode rules and stop at diagnosis when
      a material gap requires user agreement before repair.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
