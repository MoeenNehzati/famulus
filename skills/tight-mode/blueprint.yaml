authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: workflow-general-assistant
content:
- SKILL\.md
description: Applies a persistent rigor-first reasoning mode that verifies nontrivial
  claims, labels uncertainty, and separates diagnosis from approved repair.
discovery:
  mechanism: skill
exports:
  tight-mode.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: tight-mode.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: tight-mode
kind: mode
node_type: module
role: mode
schema_version: 4
sources:
  tight-mode.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 1
