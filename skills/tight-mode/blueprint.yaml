authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Applies a persistent rigor-first reasoning mode that verifies nontrivial
  claims, labels uncertainty, and separates diagnosis from approved repair.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-interaction
    topics:
    - reasoning-control
    visibility: featured
  activated_by:
  - user-request
  persistent_modifier: true
exports:
  tight-mode.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: tight-mode.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: tight-mode
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  tight-mode.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
