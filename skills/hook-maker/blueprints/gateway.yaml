content:
- SKILL\.md
- references/cross\-host\-hook\-scaffold\.md
dependencies: []
description: Implements cross-host hook design and changes using the live scaffold,
  registration paths, and host-specific golden tests.
gateway:
  language: Markdown
  path: SKILL.md
id: hook-maker.source.gateway
interfaces:
  hook-maker.source.gateway.interface.default:
    content:
    - SKILL\.md
    - references/cross\-host\-hook\-scaffold\.md
    uses_interfaces: []
    contract:
      arguments:
        request:
          description: Hook purpose, supported hosts, lifecycle requirements, and
            requested design, implementation, installation, or refactor scope.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Implementation or installation can change hook source,
          tests, registries, installers, and host configuration.
      direct_io:
        network: []
        reads:
        - access: read
          content: Cross-host hook request and constraints.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Hook source, scaffold, registry, installers, host contracts, and
            tests.
          formats:
          - python
          - markdown
          - json
          - configuration
          id: hook-read
          medium: repository-filesystem
          reason: Derive behavior from live artifacts.
          sensitivity: user-private
        writes:
        - access: write
          content: Hook design or verified implementation report.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: Hook implementation, tests, registry, installer, and host configuration
            changes.
          formats:
          - python
          - json
          - configuration
          - text
          id: hook-write
          medium: repository-filesystem
          reason: Keep purpose, bindings, adapters, and registration aligned.
          sensitivity: user-private
        - access: execute
          content: Host-specific golden and installer-resolution tests.
          formats:
          - argv
          - text
          id: test-command
          medium: subprocess
          reason: Verify parsing, output schemas, environment isolation, and installation.
          sensitivity: user-private
          system: project test runner
      execution:
        consistency:
          snapshot: Design and edits use the live scaffold, registry, installers,
            and host contracts.
        effects:
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: hook-write
          id: hook-change
          may_occur_in_outcomes:
          - implemented
          - partial
          reversibility:
            reversible: Restore the reviewed hook-related diff.
          value_source:
            argument_ref: request
            kind: argument
        - action: execute
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: test-command
          id: verification-run
          may_occur_in_outcomes:
          - implemented
          - partial
          reversibility:
            reversible: Tests are observational apart from disposable artifacts.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: Source, tests, registry, installers, and configuration are
              separate updates.
          concurrent_invocations:
            unsafe: Parallel edits can conflict or leave hosts inconsistent.
          idempotency:
            non_idempotent: Reapplying installation changes can duplicate registrations.
          on_uncertain_completion:
            verify_then_decide: Inspect all changed paths and rerun golden tests.
          partial_effects_on_failure:
            possible: Some files may change before a later test fails.
          rollback_on_failure:
            available: Restore only the reviewed hook-related diff after checking
              overlap.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: hook-read
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review purpose, bindings, adapters, registration, and tests.
        class: success
        effects: []
        id: designed
        outputs:
        - response
      - caller_action: Review changed files and host-specific test evidence.
        class: success
        effects:
        - hook-change
        - verification-run
        id: implemented
        outputs:
        - response
      - caller_action: Resolve the named host or test gap before installation.
        class: partial
        effects:
        - hook-change
        - verification-run
        id: partial
        outputs:
        - response
      - caller_action: Supply missing host contracts or fix the reported scaffold
          error.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Cross-host design, changed-file summary, test evidence, or unresolved
          lifecycle or adapter gap.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Design or implement a hook from semantic purpose through explicit
      host bindings, adapters, registration, and golden verification.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
