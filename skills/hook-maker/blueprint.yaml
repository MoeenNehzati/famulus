authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- (?:SKILL\.md|references/cross\-host\-hook\-scaffold\.md)
description: Designs and implements cross-host assistant hooks by separating semantic
  purpose, lifecycle binding, and host-specific adapters.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-authoring
    - assistant-architecture
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  hook-maker.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: hook-maker.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: hook-maker
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  hook-maker.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
