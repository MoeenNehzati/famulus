authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: skill-making-development-assistant
children:
  hook-maker-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:SKILL\.md|references/cross\-host\-hook\-scaffold\.md)
description: Designs and implements cross-host assistant hooks by separating semantic
  purpose, lifecycle binding, and host-specific adapters.
discovery:
  mechanism: skill
exports:
  hook-maker.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: hook-maker.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: hook-maker
kind: generator
namespace_exports: {}
node_type: module
role: meta-skill
schema_version: 5
sources:
  hook-maker.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
