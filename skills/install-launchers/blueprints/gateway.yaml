content: [SKILL\.md]
dependencies:
- blueprint: {base: repository-root, path: skills/setup-python-environment/blueprints/gateway.yaml}
  reason: Follows the selected-owner exact-Python checks with empty package actions as no-ops.
  source: setup-python-environment.source.gateway
  version: 1
- blueprint: {base: module-root, path: _rtx/blueprints/agent-launchers.yaml}
  reason: Applies the explicit subset using the already-selected executable and plugin root.
  source: install-launchers._rtx.source.agent-launchers
  version: 1
description: Composes selected-environment checks and the empty-package no-op with explicit optional launcher setup.
gateway: {language: Markdown, path: SKILL.md}
id: install-launchers.source.gateway
interfaces:
  install-launchers.source.gateway.interface.default:
    content: [SKILL\.md]
    uses_interfaces:
    - {interface: setup-python-environment.interface.repair-selected-packages, version: 1}
    - {interface: install-launchers._rtx.interface.agent-launchers, version: 1}
    contract:
      arguments:
        request:
          description: Explicit requested subset of assistant, collab, coauthor, and tw.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
      caller_warnings:
      - external-side-effect: Selected launcher files, profiles, worker directories, and launcher configuration may be written.
      direct_io:
        network: []
        reads:
        - {access: read, content: launcher request, formats: [text], id: read-1, medium: prompt, sensitivity: user-private}
        writes:
        - id: selected-targets
          medium: home-filesystem
          access: configure
          content: selected command files, profiles, worker directories, and launcher configuration
          formats: [python, shell, batch, toml, json, directory]
          sensitivity: user-private
          path: selected platform launcher targets
        - {access: write, content: launcher result, formats: [markdown], id: write-1, medium: prompt, sensitivity: derived-private}
      execution:
        consistency: {live: The selected Python fingerprint and plugin root are observed during this invocation.}
        lifecycle: finite
        state_effect: mutating
        effects:
        - id: launcher-state
          direct_io_ref: selected-targets
          action: configure
          value_source: {kind: argument, argument_ref: request}
          may_occur_in_outcomes: [completed, failed]
          confirmation_evidence: {kind: direct-io, direct_io_ref: selected-targets}
          reversibility: {compensatable: The feature-owned selected files can be removed separately.}
        mutation_safety:
          atomicity: {per_effect_only: Each selected file is written independently.}
          concurrent_invocations: {unsafe: Concurrent setup calls are not serialized.}
          idempotency: {idempotent: Rerunning the same subset repairs only those selected targets.}
          on_uncertain_completion: {verify_then_decide: Inspect only selected outputs before retrying.}
          partial_effects_on_failure: {possible: Earlier selected outputs remain when a later write fails.}
          rollback_on_failure: {unavailable: Earlier selected writes are retained and reported.}
        verification: [{method: output-schema, output_ref: response}]
      helpers: []
      interaction: {channel: tty, mode: interactive, unattended_outcome: clarification-required}
      outcomes:
      - {id: completed, class: success, outputs: [response], effects: [launcher-state], caller_action: Report only the selected launcher results.}
      - {id: clarification-required, class: refusal, outputs: [response], effects: [], caller_action: Ask for an explicit launcher subset.}
      - {id: failed, class: error, outputs: [response], effects: [launcher-state], caller_action: Report the failed preflight or selected target.}
      outputs:
      - id: response
        audience: human
        description: Selected launcher installation result or explicit-selection prompt.
        direct_io_ref: write-1
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty.
        type: {kind: string, sensitivity: derived-private}
      preconditions: []
    description: Install or repair only an explicitly requested interactive launcher subset.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- {interface: setup-python-environment.interface.repair-selected-packages, version: 1}
- {interface: install-launchers._rtx.interface.agent-launchers, version: 1}
version: 1
maturity: stable
