content:
- SKILL\.md
dependencies: []
description: Directs mechanical preflight, occurrence-by-occurrence semantic review,
  accepted application, and target-side postflight through the private machine
  interface.
gateway:
  language: Markdown
  path: SKILL.md
id: relocate-nodes.source.gateway
interfaces:
  relocate-nodes.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: relocate-nodes._rtx.interface.relocate
      version: 2
    contract:
      arguments:
        request:
          description: Exact registered-node relocation request and manifest location.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Applying an accepted manifest changes the selected
          repository with per-file atomic replacements, not a repository-wide transaction
          or rollback; persisted-state, compatibility, and behavioral choices require
          explicit user review before a semantic decision is recorded.
      direct_io:
        network: []
        reads:
        - id: request
          medium: prompt
          system: agent-runtime
          access: read
          content: Relocation request and exact manifest location.
          formats:
          - text
          sensitivity: user-private
        writes:
        - id: repository-change
          medium: repository-filesystem
          system: selected repository
          access: write
          content: Reviewed per-file relocation replacements and deletions.
          formats:
          - yaml
          - markdown
          - python
          - text
          sensitivity: user-private
          reason: Apply the explicitly reviewed relocation manifest.
        - id: response
          medium: prompt
          system: agent-runtime
          access: write
          content: Preflight, application, or empty-postflight result.
          formats:
          - markdown
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Each response reflects the exact manifest and repository state
            observed by its delegated invocation.
        effects:
        - id: relocation-change
          action: update
          direct_io_ref: repository-change
          may_occur_in_outcomes:
          - completed
          - failed
          confirmation_evidence:
            kind: output
            output_ref: response
          reversibility:
            compensatable: Repair any reported partial publish from version-control
              evidence; the route does not promise repository-wide rollback.
          value_source:
            kind: argument
            argument_ref: request
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Each file replacement is atomic, but the complete relocation
              is not a repository-wide transaction.
          concurrent_invocations:
            unsafe: Any included physical inventory change after planning aborts before
              publish; concurrent publish faults can still leave completed files.
          idempotency:
            non_idempotent: Apply only after reviewed preflight; use the identical manifest
              without apply for target-side postflight.
          on_uncertain_completion:
            verify_then_decide: Inspect the report and repository state, then rerun the
              identical manifest as read-only postflight before deciding on repair.
          partial_effects_on_failure:
            possible: A mid-publish fault may leave already replaced files in place.
          rollback_on_failure:
            unavailable: The route cleans staging files but does not roll back published
              repository files.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - method: direct-io-state
          direct_io_ref: repository-change
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: failed
      outcomes:
      - id: completed
        class: success
        effects:
        - relocation-change
        outputs:
        - response
        caller_action: Review the report categories and use the private route only
          as prescribed by this workflow.
      - id: failed
        class: error
        effects:
        - relocation-change
        outputs:
        - response
        caller_action: Correct the manifest or unresolved reference before retrying.
      outputs:
      - id: response
        audience: human
        cardinality:
          minimum: 1
          maximum: 1
        description: Relocation workflow result and required next action.
        direct_io_ref: response
        empty: Never empty.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Require mechanical preflight, complete semantic occurrence adjudication,
      accepted application, and an empty target-side postflight.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: relocate-nodes._rtx.interface.relocate
  version: 2
version: 1
maturity: stable
