content:
- SKILL\.md
dependencies: []
description: Directs mechanical preflight, grouped user-assisted semantic review,
  recovery-backed application, and target-side postflight through the private
  machine interface.
gateway:
  language: Markdown
  path: SKILL.md
id: relocate-nodes.source.gateway
interfaces:
  relocate-nodes.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: relocate-nodes._rtx.interface.build-review-packet
      version: 1
    - interface: relocate-nodes._rtx.interface.relocate
      version: 2
    contract:
      arguments:
        request:
          description: Exact registered-node relocation request and manifest location.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Applying an accepted manifest changes the selected
          repository through a recovery-backed failure-atomic transaction;
          persisted-state, compatibility, and behavioral choices require explicit
          user review before a semantic decision is recorded.
      direct_io:
        network: []
        reads:
        - id: request
          medium: prompt
          system: agent-runtime
          access: read
          content: Relocation request and exact manifest location.
          formats:
          - text
          sensitivity: user-private
        writes:
        - id: repository-change
          medium: repository-filesystem
          system: selected repository
          access: write
          content: Reviewed per-file relocation replacements and deletions.
          formats:
          - yaml
          - markdown
          - python
          - text
          sensitivity: user-private
          reason: Apply the explicitly reviewed relocation manifest.
        - id: response
          medium: prompt
          system: agent-runtime
          access: write
          content: Preflight, application, or empty-postflight result.
          formats:
          - markdown
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Each response reflects the exact manifest and repository state
            observed by its delegated invocation.
        effects:
        - id: relocation-change
          action: update
          direct_io_ref: repository-change
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: output
            output_ref: response
          reversibility:
            compensatable: Automatic rollback restores the pre-publication baseline
              before a caught failure returns.
          value_source:
            kind: argument
            argument_ref: request
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: The complete reviewed change set passes target-side postflight or
              is restored from the durable baseline marker.
          concurrent_invocations:
            safe: A repository-specific publication lock serializes concurrent apply calls.
          idempotency:
            idempotent: A completed relocation has an empty identical postflight.
          on_uncertain_completion:
            verify_then_decide: The next invocation restores an interrupted marker
              before planning and then reports the recovered repository state.
          partial_effects_on_failure:
            impossible: Caught publication or postflight failures restore the complete
              captured baseline before returning.
          rollback_on_failure:
            automatic: An external durable baseline marker restores caught or interrupted
              publication effects.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - method: direct-io-state
          direct_io_ref: repository-change
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: failed
      outcomes:
      - id: completed
        class: success
        effects:
        - relocation-change
        outputs:
        - response
        caller_action: Review the report categories and use the private route only
          as prescribed by this workflow.
      - id: failed
        class: error
        effects: []
        outputs:
        - response
        caller_action: Correct the manifest or unresolved reference before retrying.
      outputs:
      - id: response
        audience: human
        cardinality:
          minimum: 1
          maximum: 1
        description: Relocation workflow result and required next action.
        direct_io_ref: response
        empty: Never empty.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Require mechanical preflight, complete semantic occurrence adjudication,
      accepted application, and an empty target-side postflight.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: relocate-nodes._rtx.interface.build-review-packet
  version: 1
- interface: relocate-nodes._rtx.interface.relocate
  version: 2
version: 1
maturity: stable
