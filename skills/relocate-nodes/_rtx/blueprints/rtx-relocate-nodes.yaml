content:
- _compact_relocation\.py
- _relocate_nodes\.py
- schemas/relocation\.schema\.json
- tests/test_compact_relocation\.py
dependencies: []
description: Owns schema-v3 relocation projection, semantic-decision preflight, and
  recovery-backed failure-atomic publication.
gateway:
  language: Python>=3.11
  path: _relocate_nodes.py
id: relocate-nodes._rtx.source.rtx-relocate-nodes
interfaces:
  relocate-nodes._rtx.source.rtx-relocate-nodes.interface.relocate:
    content:
    - _compact_relocation\.py
    - _relocate_nodes\.py
    - schemas/relocation\.schema\.json
    - tests/test_compact_relocation\.py
    uses_interfaces:
    - interface: blueprints.interface.graph
      version: 1
    - interface: configuration.interface.repository
      version: 1
    contract:
      arguments:
        root:
          description: Existing repository root to preflight or update.
          direct_io_ref: repository
          required: false
          sensitivity: user-private
          type:
            kind: dir
            access: read-write
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        manifest:
          description: Exact schema-v3 relocation manifest and semantic decisions to
            validate and apply.
          direct_io_ref: manifest
          required: true
          sensitivity: user-private
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            opaque_content: true
        report:
          description: Optional external-only destination for the JSON relocation
            report.
          direct_io_ref: report-file
          required: false
          sensitivity: user-private
          type:
            kind: file
            access: write
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
            opaque_content: true
        apply:
          default: false
          description: Publish the accepted change set as one recovery-backed failure-atomic transaction.
          required: false
          sensitivity: public
          type:
            kind: flag
      caller_warnings:
      - external-side-effect: --apply locks the repository, records rollback state
          outside it, and restores the complete baseline on a caught failure; an
          interrupted marker is recovered before the next invocation.
      direct_io:
        network: []
        reads:
        - id: manifest
          medium: local-filesystem
          system: filesystem
          access: read
          path: <manifest>
          path_match: exact
          content: Exact relocation manifest.
          formats:
          - yaml
          sensitivity: user-private
        - id: repository
          medium: local-filesystem
          system: filesystem
          access: read
          path: <root>/**
          path_match: glob
          content: Selected repository files and metadata needed for relocation planning.
          formats:
          - source-code
          - json
          - yaml
          - markdown
          - text
          - git-metadata
          sensitivity: user-private
        writes:
        - id: report
          medium: stdout
          system: agent-runtime
          access: write
          content: Stable JSON relocation report.
          formats:
          - json
          sensitivity: derived-private
        - id: report-file
          medium: local-filesystem
          system: filesystem
          access: write
          path: <report>
          path_match: exact
          content: Optional stable JSON relocation report outside the selected repository.
          formats:
          - json
          sensitivity: derived-private
        - id: error
          medium: stderr
          system: agent-runtime
          access: write
          content: Manifest, repository, preflight, or application error.
          formats:
          - text
          sensitivity: derived-private
        - id: repository-change-set
          medium: local-filesystem
          system: filesystem
          access: write
          path: <root>/**
          path_match: glob
          content: Repository change set published through one recovery-backed
            failure-atomic transaction.
          formats:
          - source-code
          - json
          - yaml
          - markdown
          - text
          sensitivity: user-private
      execution:
        consistency:
          snapshot: Application holds one publication lock, verifies every preflight
            input remains unchanged, and keeps target-side postflight inside the transaction.
        effects:
        - id: repository-change-set
          action: update
          direct_io_ref: repository-change-set
          may_occur_in_outcomes:
          - applied
          confirmation_evidence:
            kind: output
            output_ref: report
          reversibility:
            compensatable: Automatic rollback restores the captured baseline before a
              failed invocation returns.
          value_source:
            kind: argument
            argument_ref: manifest
        lifecycle: finite
        state_effect: mutating
        mutation_safety:
          atomicity:
            atomic: The complete repository change set either passes target-side
              postflight or is restored from the durable baseline marker.
          concurrent_invocations:
            safe: A repository-specific shared lock serializes publishers.
          idempotency:
            idempotent: An unchanged manifest has an empty postflight after its accepted
              change set is applied.
          on_uncertain_completion:
            verify_then_decide: The next invocation restores any durable in-progress
              marker before planning, then reruns the requested preflight.
          partial_effects_on_failure:
            impossible: Caught publication and postflight failures restore every captured
              regular file, mode, and directory baseline before returning; address-bearing
              symlinks are rejected during preflight.
          rollback_on_failure:
            automatic: Rollback uses an external durable marker containing the captured
              baseline; the next invocation restores an interrupted publication.
        verification:
        - method: output-schema
          output_ref: report
        - method: direct-io-state
          direct_io_ref: repository-change-set
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - id: preflighted
        class: success
        effects: []
        outputs:
        - report
        caller_action: Review every nonempty report category and stop on unresolved
          references before applying.
      - id: applied
        class: success
        effects:
        - repository-change-set
        outputs:
        - report
        caller_action: Run the same preflight again and require every change category
          to be empty.
      - id: failed
        class: error
        effects: []
        outputs:
        - error
        caller_action: Correct the manifest, repository path, or unresolved reference
          before retrying.
      - id: rejected-apply
        class: error
        effects: []
        outputs:
        - error
        caller_action: Review every unaccounted semantic occurrence, add complete
          rewrite or preserve decisions, and rerun preflight before applying.
      outputs:
      - id: report
        audience: both
        cardinality:
          minimum: 1
          maximum: 1
        description: Stable JSON report of planned or applied relocation changes.
        direct_io_ref: report
        empty: Never empty after a successful preflight or application.
        ordering: sorted
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      - id: error
        audience: human
        cardinality:
          minimum: 0
          maximum: 1
        description: Manifest, repository, preflight, or application error.
        direct_io_ref: error
        empty: Empty on success.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Preflight or publish one manifest-driven registered-node relocation
      as one recovery-backed failure-atomic change set.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        min_positionals: 0
        max_positionals: 0
        allowed_flags:
        - --root
        - --manifest
        - --report
        - --apply
        required_flags:
        - --manifest
        flag_patterns:
          --root: ^.+$
          --manifest: ^.+$
          --report: ^.+$
    usage: --manifest MANIFEST [--root ROOT] [--report REPORT] [--apply]
    version: 2
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses caller-selected relocation manifests in the skill-owned engine.
  version: any
schema_version: 6
uses_interfaces:
- interface: blueprints.interface.graph
  version: 1
- interface: configuration.interface.repository
  version: 1
version: 1
maturity: stable
