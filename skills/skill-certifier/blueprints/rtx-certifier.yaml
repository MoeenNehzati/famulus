content:
- _rtx/_node_certifier\.py
dependencies: []
description: Runs the public v4 certification gate and the private candidate-review transition, derives every certificate field internally, and appends signed Ed25519 certificates for exact reviewed commits.
gateway:
  language: Python
  path: _rtx/_node_certifier.py
id: skill-certifier.source.rtx-certifier
interfaces:
  skill-certifier.source.rtx-certifier.interface.certify:
    contract:
      arguments:
        targets:
          description: Optional module ids, names, or exact module-root paths in the reviewed repository; omission certifies every module in that graph.
          required: false
          default: []
          sensitivity: user-private
          type: {kind: list, element_type: {kind: string, sensitivity: user-private}}
        json:
          description: Emit one machine-readable JSON document instead of Markdown.
          required: false
          default: false
          sensitivity: public
          type: {kind: flag}
        allow-non-atomic:
          description: Explicitly permit the existing confined non-atomic file fallback when secure atomic primitives are unavailable.
          required: false
          default: false
          sensitivity: public
          type: {kind: flag}
        reviewed-repository:
          description: Exact repository root whose v4 blueprints the invoking LLM reviewed.
          required: true
          sensitivity: user-private
          direct_io_ref: read-1
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read}
        reviewed-commit:
          description: Exact commit attested by the invoking LLM after semantic review.
          required: true
          sensitivity: public
          type: {kind: string, sensitivity: public}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Runs blueprint synchronization, structural validators, and the scoped route-smoke dependency audit before signing.
      - external-side-effect: Creates or reuses certifier signing material and appends signed records to affected node histories.
      - external-side-effect: Regenerates each selected module's certificate-backed pooled review after certificate currentness verification.
      - external-side-effect: Requires an explicit repository-bound reviewed commit; the machine path never substitutes HEAD for missing review attestation.
      - external-side-effect: --allow-non-atomic explicitly weakens per-file atomicity and is never selected by default.
      outputs:
      - id: certification-report
        audience: both
        description: JSON or Markdown containing mechanical evidence and exact certificates issued for each selected module.
        direct_io_ref: write-3
        type: {kind: string, sensitivity: derived-private, description: "JSON when --json is present, otherwise Markdown."}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty after the mechanical gate completes.
      - id: error
        audience: human
        description: Mechanical-gate, target-resolution, review-attestation, signing, or verification failure.
        direct_io_ref: write-4
        type: {kind: string, sensitivity: derived-private}
        cardinality: {minimum: 0, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Empty on success.
      outcomes:
      - {id: certified, class: success, outputs: [certification-report], effects: [certificate-signing-material, certificate-history, pooled-review], caller_action: Treat only the listed node histories as newly certified.}
      - {id: partial, class: partial, outputs: [error], effects: [certificate-signing-material, certificate-history, pooled-review], caller_action: Retain earlier valid append-only entries and report the exact failure; do not claim unlisted nodes are certified.}
      - {id: failed, class: error, outputs: [error], effects: [], caller_action: "Resolve the mechanical, review, target, or signing failure and do not claim certification."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Every payload is reconstructed from one exact reviewed Git commit and rederived before and after each append.}
        effects:
        - id: certificate-signing-material
          direct_io_ref: write-1
          action: configure
          value_source: {kind: direct-io, direct_io_ref: write-1}
          may_occur_in_outcomes: [certified, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {irreversible: Removing retained keys prevents future signing or historical verification.}
        - id: certificate-history
          direct_io_ref: write-2
          action: append
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [certified, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}
          reversibility: {irreversible: Certificate history is append-only and is never rewritten or truncated.}
        - id: pooled-review
          direct_io_ref: write-6
          action: update
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [certified, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-6}
          reversibility: {reversible: Regenerate the pooled review from the current certificate view.}
        mutation_safety:
          atomicity: {per_effect_only: "Secure operations are atomic per file and each certificate entry uses compare-and-append; the explicit fallback is confined but non-atomic, and multi-node certification is incremental."}
          concurrent_invocations: {safe: Concurrent appends against the same predecessor conflict instead of silently forking history.}
          idempotency: {non_idempotent: A successful repeated certification appends another signed history entry.}
          on_uncertain_completion: {verify_then_decide: Read certificate currentness and the append-only history before retrying.}
          partial_effects_on_failure: {possible: Earlier valid node entries and signing material remain when a later node fails.}
          rollback_on_failure: {unavailable: Valid append-only history is intentionally retained.}
        verification:
        - {method: output-schema, output_ref: certification-report}
        - {method: direct-io-state, direct_io_ref: write-2}
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: blueprint declarations, gateways, node inputs, hash policy, certification basis, schemas, public keys, and certificate histories
          formats: [yaml, json, markdown, python, text, binary, pem, jsonl]
          id: read-1
          medium: local-filesystem
          path: $target/**
          path_match: glob
          reason: Reconstruct exact v4 graph, hash, certifier, predecessor, and certificate-currentness state.
          sensitivity: user-private
          system: filesystem
        - access: read
          content: repository identity, source commit, index, tracked blobs, and worktree readiness
          formats: [git]
          id: read-2
          medium: local-system
          path: $target/repository
          path_match: exact
          reason: Bind certification to the reviewed commit and detect changes before and after appends.
          sensitivity: derived-private
          system: git
        writes:
        - access: write
          content: certificate signing material
          formats: [pem, text, secret-store-entry]
          id: write-1
          medium: local-filesystem
          path: skills/skill-certifier/.certificates/public-keys
          path_match: exact
          reason: Create or reuse retained Ed25519 verification material and the active-key selector while storing private material through the configured secret backend.
          sensitivity: credential
          system: filesystem
        - access: write
          content: certificate history
          formats: [jsonl]
          id: write-2
          medium: local-filesystem
          path: $target/.certificates/*.jsonl
          path_match: glob
          reason: Append one complete signed certificate envelope and verify the resulting chain.
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: certification report
          formats: [json, markdown]
          id: write-3
          medium: stdout
          reason: Return mechanical evidence and exact node certificate paths.
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: error
          formats: [text]
          id: write-4
          medium: stderr
          reason: Report an invocation-wide certification failure.
          sensitivity: derived-private
          system: agent-runtime
        - access: execute
          content: blueprint synchronization and repository validators
          id: write-5
          medium: subprocess
          path: $repo/validators/runner.py
          path_match: exact
          reason: Run certifier-owned structural checks and the declared blueprint-sync call before signing.
          sensitivity: derived-private
          system: python
        - access: write
          content: deterministic certificate-backed pooled blueprint review
          formats: [yaml]
          id: write-6
          medium: local-filesystem
          path: $target/.pooled-blueprint-review.yaml
          path_match: exact
          reason: Replace the selected module's generated review only after its requested certificates verify as current.
          sensitivity: derived-private
          system: filesystem
    description: Certify exact v4 module closures by appending signed certificate histories for an explicit reviewed repository commit.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        allowed_flags:
        - --allow-non-atomic
        - --json
        - --reviewed-repository
        - --reviewed-commit
        flag_patterns:
          --reviewed-repository: ^.+$
          --reviewed-commit: ^[0-9a-fA-F]{40,64}$
        min_positionals: 1
        positional_patterns:
          '0': ^certify$
    usage: certify [target ...] --reviewed-repository ROOT --reviewed-commit COMMIT [--json] [--allow-non-atomic]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses v4 blueprint declarations during semantic inspection.
  version: any
schema_version: 4
uses_interfaces:
- interface: common.interface.certification-hashing
  version: 1
- interface: common.interface.atomic-files
  version: 1
- interface: common.interface.certificate-records
  version: 1
- interface: common.interface.blueprint-graph
  version: 1
- interface: common.interface.certification-view
  version: 1
- interface: common.interface.pooled-blueprint
  version: 1
- interface: common.interface.git-provenance
  version: 1
- interface: skill-maker.interface.sync-blueprints
  version: 1
version: 1
