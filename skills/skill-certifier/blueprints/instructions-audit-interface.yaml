content:
- instructions/audit-interface\.md
dependencies: []
description: Owns semantic review of one source interface against its contract, selected content, binding,
  dependencies, and observed behavior.
gateway:
  language: Markdown
  path: instructions/audit-interface.md
id: skill-certifier.source.audit-interface
interfaces:
  skill-certifier.source.audit-interface.interface.audit:
    content:
    - instructions/audit-interface\.md
    uses_interfaces: []
    contract:
      arguments:
        request:
          description: One skill-certifier.semantic-audit-task/v1 packet with selected declaration and
            content, exact identity, prerequisite reports and machine-authenticated reusable evidence.
            Judge semantics only.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: bounded interface audit request and evidence
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - id: selected-content
          medium: local-filesystem
          access: read
          system: filesystem
          content: Only the packet-selected declaration, gateway and input-manifest paths needed for this
            semantic audit
          formats:
          - yaml
          - text
          - binary
          sensitivity: user-private
          path: <reviewed_repository>/<input_manifest.path>
          path_match: glob
        - id: selected-blueprint-path
          medium: local-filesystem
          access: read
          system: filesystem
          content: Exact packet-selected blueprint_path when non-null
          formats:
          - yaml
          - text
          sensitivity: user-private
          path: <selected_content.blueprint_path>
          path_match: exact
        - id: selected-gateway
          medium: local-filesystem
          access: read
          system: filesystem
          content: Exact packet-selected gateway when non-null
          formats:
          - yaml
          - text
          sensitivity: user-private
          path: <selected_content.gateway>
          path_match: exact
        writes:
        - access: write
          content: structured interface audit result
          formats:
          - json
          id: write-1
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The result applies only to the supplied interface declaration and evidence snapshot.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: audit-result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Forward the exact raw JSON result to the Voyage; machines validate and decide subsequent
          work.
        class: success
        effects: []
        id: audited
        outputs:
        - audit-result
      - caller_action: Forward the exact raw abort result to the Voyage; its machine step stops the run.
        class: error
        effects: []
        id: invalid-request
        outputs:
        - audit-result
      outputs:
      - audience: both
        cardinality:
          minimum: 1
          maximum: 1
        description: Exact JSON pass, reject, or abort result for one interface.
        direct_io_ref: write-1
        empty: Never empty.
        id: audit-result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Audit one source interface and return bounded semantic evidence and a verdict.
    version: 3
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 3
maturity: stable
