authority:
  owns_filesystem:
  - allowed_readers:
    - skill-drift._rtx.interface.drift-status
    match: regex
    path: ^\.certificates/public-keys/(active-key-id|[0-9a-f]{64}\.pub)$
    reason: Retained Ed25519 public keys are read-only verification material for certificate
      consumers.
  - allowed_readers:
    - skill-drift._rtx.interface.drift-status
    match: regex
    path: ^\.certificates/[^/]+\.jsonl$
    reason: The certifier is the sole writer of append-only node certificate histories.
children:
  _rtx: {}
content:
- SKILL\.md
description: Certifies exact v5 module targets after mechanical checks and semantic
  review, then issues append-only Ed25519 certificates for the exact reviewed commit.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-assurance
    - assistant-architecture
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  skill-certifier.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-certifier.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: skill-certifier
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        skill-certifier._rtx.interface.certify: 1
    interface_access:
      skill-certifier._rtx.interface.certify:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  skill-certifier.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: stable
installation_tier: core
personal_preference:
  applies: false
