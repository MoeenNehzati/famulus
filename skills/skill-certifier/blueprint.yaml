authority:
  owns_filesystem:
  - allowed_readers:
    - skill-drift.interface.drift-status
    match: regex
    path: ^\.certificates/public-keys/(active-key-id|[0-9a-f]{64}\.pub)$
    reason: Retained Ed25519 public keys are read-only verification material for certificate consumers.
  - allowed_readers:
    - skill-drift.interface.drift-status
    match: regex
    path: ^\.certificates/[^/]+\.jsonl$
    reason: The certifier is the sole writer of append-only node certificate histories.
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_node_certifier.py
      - Interface
      reason: Run mechanical certification checks and append signed certificates.
    network: []
category: skill-making-development-assistant
description: Certifies exact v4 module targets after mechanical checks and semantic review, then issues append-only Ed25519 certificates for the exact reviewed commit.
content:
- SKILL\.md
- _rtx/_node_certifier\.py
- tests/test_certifier\.py
discovery:
  mechanism: skill
exports:
  skill-certifier.interface.certify:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: skill-certifier.source.rtx-certifier.interface.certify
  skill-certifier.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-certifier.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: skill-certifier
kind: certifier
node_type: module
role: meta-skill
schema_version: 4
sources:
  skill-certifier.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  skill-certifier.source.rtx-certifier:
    blueprint:
      base: module-root
      path: blueprints/rtx-certifier.yaml
version: 1
