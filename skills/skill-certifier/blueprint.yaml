authority:
  owns_filesystem:
  - allowed_readers:
    - skill-drift._rtx.interface.drift-status
    match: regex
    path: ^\.certificates/public-keys/(active-key-id|[0-9a-f]{64}\.pub)$
    reason: Retained Ed25519 public keys are read-only verification material for certificate
      consumers.
  - allowed_readers:
    - skill-drift._rtx.interface.drift-status
    match: regex
    path: ^\.certificates/[^/]+\.jsonl$
    reason: The certifier is the sole writer of append-only node certificate histories.
children:
  _rtx: {}
content:
- (?:SKILL\.md|instructions/audit-(?:behavioral-source|interface|module)\.md)
description: Orchestrates drift-selected interface, behavioral-source, and module
  semantic audits, then issues append-only certificates for exact reviewed targets.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-assurance
    - assistant-architecture
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports: {}
gateway:
  language: Markdown
  path: SKILL.md
id: skill-certifier
namespace_exports:
  _rtx:
    version: 3
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        skill-certifier._rtx.interface.certify: 2
        skill-certifier._rtx.interface.semantic-audit-scheduler: 1
    interface_access:
      skill-certifier._rtx.interface.certify:
        allow_all_modules: false
        allowed_callers: []
      skill-certifier._rtx.interface.semantic-audit-scheduler:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  skill-certifier.source.audit-behavioral-source:
    blueprint:
      base: module-root
      path: blueprints/instructions-audit-behavioral-source.yaml
  skill-certifier.source.audit-interface:
    blueprint:
      base: module-root
      path: blueprints/instructions-audit-interface.yaml
  skill-certifier.source.audit-module:
    blueprint:
      base: module-root
      path: blueprints/instructions-audit-module.yaml
  skill-certifier.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 6
maturity: stable
installation_tier: core
personal_preference:
  applies: false
