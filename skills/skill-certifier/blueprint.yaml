authority:
  owns_filesystem:
  - allowed_readers:
    - skill-drift.interface.drift-status
    match: regex
    path: ^\.certificates/public-keys/(active-key-id|[0-9a-f]{64}\.pub)$
    reason: Retained Ed25519 public keys are read-only verification material for certificate
      consumers.
  - allowed_readers:
    - skill-drift.interface.drift-status
    match: regex
    path: ^\.certificates/[^/]+\.jsonl$
    reason: The certifier is the sole writer of append-only node certificate histories.
category: skill-making-development-assistant
children:
  skill-certifier-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Certifies exact v5 module targets after mechanical checks and semantic
  review, then issues append-only Ed25519 certificates for the exact reviewed commit.
discovery:
  mechanism: skill
exports:
  skill-certifier.interface.certify:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: skill-certifier-rtx.interface.certify
      version: 1
  skill-certifier.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-certifier.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: skill-certifier
kind: certifier
namespace_exports: {}
node_type: module
role: meta-skill
schema_version: 5
sources:
  skill-certifier.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
