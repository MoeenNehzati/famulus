authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _node_certifier.py
      - Interface
      reason: Run mechanical certification checks and append signed certificates.
    network: []
children: {}
content:
- _node_certifier\.py
- tests/.*
- __init__\.py
description: Code module for the skill-certifier skill.
exports:
  skill-certifier-rtx.interface.certify:
    access:
      allow_all_modules: false
      allowed_callers:
      - skill-certifier
    source_interface: skill-certifier-rtx.source.rtx-certifier.interface.certify
gateway:
  language: Python>=3.11
  path: __init__.py
id: skill-certifier-rtx
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  skill-certifier-rtx.source.rtx-certifier:
    blueprint:
      base: module-root
      path: blueprints/rtx-certifier.yaml
version: 1
