content:
- _node_certifier\.py
- __init__\.py
dependencies: []
description: Runs the public v6 certification gate and the frozen candidate-review
  transition, derives every certificate field internally, skips current nodes,
  and appends signed Ed25519 certificates for stale nodes at exact reviewed commits.
gateway:
  language: Python
  path: _node_certifier.py
id: skill-certifier._rtx.source.rtx-certifier
interfaces:
  skill-certifier._rtx.source.rtx-certifier.interface.certify:
    content:
    - _node_certifier\.py
    - __init__\.py
    uses_interfaces:
    - interface: certification.interface.hashing
      version: 1
    - interface: common.interface.atomic-files
      version: 1
    - interface: certification.interface.records
      version: 1
    - interface: blueprints.interface.graph
      version: 1
    - interface: certification.interface.view
      version: 1
    - interface: blueprints.interface.pooled
      version: 1
    - interface: git.interface.provenance
      version: 1
    - interface: common.interface.repository-paths
      version: 1
    contract:
      arguments:
        allow-non-atomic:
          default: false
          description: Explicitly permit the existing confined non-atomic file fallback
            when secure atomic primitives are unavailable.
          required: false
          sensitivity: public
          type:
            kind: flag
        json:
          default: false
          description: Emit one machine-readable JSON document instead of Markdown.
          required: false
          sensitivity: public
          type:
            kind: flag
        reviewed-commit:
          description: Exact commit attested by the invoking LLM after semantic review.
          required: true
          sensitivity: public
          type:
            kind: string
            sensitivity: public
        reviewed-repository:
          description: Exact repository root whose v6 blueprints the invoking LLM
            reviewed.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            access: read
            kind: dir
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        targets:
          default: []
          description: Optional module ids, names, or exact module-root paths in the
            reviewed repository; omission certifies every module in that graph.
          required: false
          sensitivity: user-private
          type:
            element_type:
              kind: string
              sensitivity: user-private
            kind: list
      caller_warnings:
      - external-side-effect: Runs the repository validator runner, including blueprint
          synchronization checks, and route-smokes only stale nodes before signing.
      - external-side-effect: Creates or reuses certifier signing material and appends
          signed records only to stale node histories.
      - external-side-effect: Regenerates a selected module's certificate-backed
          pooled review only when at least one node in its closure was issued.
      - external-side-effect: Requires an explicit repository-bound reviewed commit;
          the machine path never substitutes HEAD for missing review attestation.
      - external-side-effect: --allow-non-atomic explicitly weakens per-file atomicity
          and is never selected by default.
      direct_io:
        network: []
        reads:
        - access: read
          content: blueprint declarations, gateways, node inputs, hash policy, certification
            basis, schemas, public keys, and certificate histories
          formats:
          - yaml
          - json
          - markdown
          - python
          - text
          - binary
          - pem
          - jsonl
          id: read-1
          medium: local-filesystem
          path: $target/**
          path_match: glob
          reason: Reconstruct exact v6 graph, hash, certifier, predecessor, and certificate-currentness
            state, then derive the stale issuance worklist.
          sensitivity: user-private
          system: filesystem
        - access: read
          content: repository identity, source commit, index, tracked blobs, and worktree
            readiness
          formats:
          - git
          id: read-2
          medium: local-system
          path: $target/repository
          path_match: exact
          reason: Bind certification to the reviewed commit and detect changes before
            and after appends.
          sensitivity: derived-private
          system: git
        writes:
        - access: write
          content: certificate signing material
          formats:
          - pem
          - text
          - secret-store-entry
          id: write-1
          medium: local-filesystem
          path: skills/skill-certifier/.certificates/public-keys
          path_match: exact
          reason: Create or reuse retained Ed25519 verification material and the active-key
            selector while storing private material through the configured secret
            backend.
          sensitivity: credential
          system: filesystem
        - access: write
          content: certificate history
          formats:
          - jsonl
          id: write-2
          medium: local-filesystem
          path: $target/.certificates/*.jsonl
          path_match: glob
          reason: Append one complete signed certificate envelope and verify the resulting
            chain.
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: certification report
          formats:
          - json
          - markdown
          id: write-3
          medium: stdout
          reason: Return mechanical evidence, exact node certificate paths, and whether
            each node was issued or already current.
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: error
          formats:
          - text
          id: write-4
          medium: stderr
          reason: Report an invocation-wide certification failure.
          sensitivity: derived-private
          system: agent-runtime
        - access: execute
          content: blueprint synchronization and repository validators
          id: write-5
          medium: subprocess
          path: $repo/repo_checks.py
          path_match: exact
          reason: Run certifier-owned structural checks and the declared blueprint-sync
            call before signing.
          sensitivity: derived-private
          system: python
        - access: write
          content: deterministic certificate-backed pooled blueprint review
          formats:
          - yaml
          id: write-6
          medium: local-filesystem
          path: $target/.pooled-blueprint-review.yaml
          path_match: exact
          reason: Replace the selected module's generated review only after its requested
            certificates verify as current.
          sensitivity: derived-private
          system: filesystem
      execution:
        consistency:
          snapshot: Every payload is reconstructed from one exact reviewed Git commit
            and rederived before and after each append.
        effects:
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: certificate-signing-material
          may_occur_in_outcomes:
          - certified
          - partial
          reversibility:
            irreversible: Removing retained keys prevents future signing or historical
              verification.
          value_source:
            direct_io_ref: write-1
            kind: direct-io
        - action: append
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: certificate-history
          may_occur_in_outcomes:
          - certified
          - partial
          reversibility:
            irreversible: Certificate history is append-only and is never rewritten
              or truncated.
          value_source:
            direct_io_ref: read-1
            kind: direct-io
        - action: update
          confirmation_evidence:
            direct_io_ref: write-6
            kind: direct-io
          direct_io_ref: write-6
          id: pooled-review
          may_occur_in_outcomes:
          - certified
          - partial
          reversibility:
            reversible: Regenerate the pooled review from the current certificate
              view.
          value_source:
            direct_io_ref: read-1
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Secure operations are atomic per file and each certificate
              entry uses compare-and-append; the explicit fallback is confined but
              non-atomic, and multi-node certification is incremental.
          concurrent_invocations:
            safe: Concurrent appends against the same predecessor conflict instead
              of silently forking history.
          idempotency:
            idempotent: Repeating against an unchanged successfully certified repository
              performs no further certificate or pooled-review writes.
          on_uncertain_completion:
            verify_then_decide: Read certificate currentness and the append-only history
              before retrying.
          partial_effects_on_failure:
            possible: Earlier valid node entries and signing material remain when
              a later node fails.
          rollback_on_failure:
            unavailable: Valid append-only history is intentionally retained.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: certification-report
        - direct_io_ref: write-2
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Treat every selected node as already current; no certificate
          history or pooled review was written.
        class: success
        effects: []
        id: current
        outputs:
        - certification-report
      - caller_action: Treat only the listed node histories as newly certified.
        class: success
        effects:
        - certificate-signing-material
        - certificate-history
        - pooled-review
        id: certified
        outputs:
        - certification-report
      - caller_action: Retain earlier valid append-only entries and report the exact
          failure; do not claim unlisted nodes are certified.
        class: partial
        effects:
        - certificate-signing-material
        - certificate-history
        - pooled-review
        id: partial
        outputs:
        - error
      - caller_action: Resolve the mechanical, review, target, or signing failure
          and do not claim certification.
        class: error
        effects: []
        id: failed
        outputs:
        - error
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON or Markdown containing mechanical evidence, exact certificate
          paths, and issued-versus-current status for every selected node and module.
        direct_io_ref: write-3
        empty: Never empty after the mechanical gate completes.
        id: certification-report
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: JSON when --json is present, otherwise Markdown.
          kind: string
          sensitivity: derived-private
      - audience: human
        cardinality:
          maximum: 1
          minimum: 0
        description: Mechanical-gate, target-resolution, review-attestation, signing,
          or verification failure.
        direct_io_ref: write-4
        empty: Empty on success.
        id: error
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Certify exact v6 module closures by skipping current nodes and appending
      signed certificate histories for stale nodes at an explicit reviewed repository
      commit.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        allowed_flags:
        - --allow-non-atomic
        - --json
        - --reviewed-repository
        - --reviewed-commit
        flag_patterns:
          --reviewed-commit: ^[0-9a-fA-F]{40,64}$
          --reviewed-repository: ^.+$
        min_positionals: 1
        positional_patterns:
          '0': ^certify$
    usage: certify [target ...] --reviewed-repository ROOT --reviewed-commit COMMIT
      [--json] [--allow-non-atomic]
    version: 2
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses v6 blueprint declarations during semantic inspection.
  version: any
- kind: python-package
  name: pyflakes
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Provides the undefined-name analysis used by the repository validator gate.
  version: ==3.2.0
- kind: python-package
  name: pytest
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Executes the repository validator gate before any certificate is signed.
  version: ==8.3.4
- kind: python-package
  name: pytest-xdist
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Provides the parallel pytest worker support used by the repository validator runner.
  version: ==3.8.0
schema_version: 6
uses_interfaces:
- interface: certification.interface.hashing
  version: 1
- interface: common.interface.atomic-files
  version: 1
- interface: certification.interface.records
  version: 1
- interface: blueprints.interface.graph
  version: 1
- interface: certification.interface.view
  version: 1
- interface: blueprints.interface.pooled
  version: 1
- interface: git.interface.provenance
  version: 1
- interface: common.interface.repository-paths
  version: 1
version: 2
