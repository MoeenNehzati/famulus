content:
- SKILL\.md
dependencies: []
description: Interprets calendar requests, invokes the calendar client, and routes
  missing OAuth setup through connect-google and the local bootstrap interface.
gateway:
  language: Markdown
  path: SKILL.md
id: online-calendar.source.gateway
interfaces:
  online-calendar.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: connect-google.interface.default
      version: 1
    - interface: online-calendar._rtx.interface.scripts-gcal
      version: 1
    contract:
      arguments:
        request:
          description: User calendar request including relevant calendar and event
            and date or time details.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Create, update, move, and delete requests change Google
          Calendar after the required user details are known.
      direct_io:
        network: []
        reads:
        - access: read
          content: document
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          per_source: Calendar and OAuth state are observed by the delegated interfaces
            at invocation time.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: clarification-required
      outcomes:
      - caller_action: Present the calendar result and identify any changed event.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Supply the missing event identity and calendar and time or
          mutation detail.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      - caller_action: Report the calendar or OAuth failure without inventing event
          state.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Calendar information and mutation confirmation or OAuth setup
          guidance.
        direct_io_ref: write-1
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: connect-google.interface.default
  version: 1
- interface: online-calendar._rtx.interface.scripts-gcal
  version: 1
version: 2
maturity: experimental
