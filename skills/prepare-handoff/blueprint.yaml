authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- (?:SKILL\.md|agents/openai\.yaml)
description: Prepares approval-gated project handoffs by separating repository workflow
  and documentation updates, residual lessons, and optional memory candidates.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-interaction
    topics:
    - session-management
    - repository-workflow
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  prepare-handoff.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: prepare-handoff.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: prepare-handoff
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  prepare-handoff.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
