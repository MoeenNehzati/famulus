authority:
  owns_filesystem: []
children:
  g-calendar-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Reads and modifies Google Calendar events and owns the service-specific
  OAuth credential setup used by its calendar client.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - planning
    - personal-organization
    - external-integrations
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  g-calendar.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: g-calendar.source.gateway.interface.default
  g-calendar.interface.ensure-oauth:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: g-calendar-rtx.interface.ensure-oauth
      version: 1
  g-calendar.interface.scripts-gcal:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan-rtx
    facade_interface:
      interface: g-calendar-rtx.interface.scripts-gcal
      version: 1
  g-calendar.interface.setup-oauth:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: g-calendar-rtx.interface.setup-oauth
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: g-calendar
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  g-calendar.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
