authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Reads and modifies Google Calendar events and owns the service-specific
  OAuth credential setup used by its calendar client.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - planning
    - personal-organization
    - external-integrations
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  g-calendar.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: g-calendar.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: g-calendar
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        g-calendar._rtx.interface.ensure-oauth: 1
        g-calendar._rtx.interface.scripts-gcal: 1
        g-calendar._rtx.interface.setup-oauth: 1
        g-calendar._rtx.interface.use-google-credential: 1
    interface_access:
      g-calendar._rtx.interface.ensure-oauth:
        allow_all_modules: false
        allowed_callers: []
      g-calendar._rtx.interface.scripts-gcal:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
        - daily-plan._rtx
      g-calendar._rtx.interface.setup-oauth:
        allow_all_modules: false
        allowed_callers: []
      g-calendar._rtx.interface.use-google-credential:
        allow_all_modules: false
        allowed_callers:
        - install-assistant-tools
        - install-assistant-tools._rtx
node_type: module
schema_version: 6
sources:
  g-calendar.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
