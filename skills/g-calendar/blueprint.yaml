authority:
  owns_filesystem:
  - allowed_readers:
    - g-calendar.interface.ensure-oauth
    - g-calendar.interface.scripts-gcal
    match: exact
    path: $home/.config/g-calendar/credentials.json
    reason: setup-oauth is the declared writer for regenerated calendar OAuth credentials.
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_oauth_bootstrap.py:Interface
      reason: OAuth setup tool.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_ensure_oauth.py:Interface
      reason: Check OAuth status and guide setup (relocated from install-assistant-tools).
    network: []
category: productivity-general-assistant
description: Reads and modifies Google Calendar events and owns the service-specific OAuth credential setup used by its calendar client.
content:
- SKILL\.md
- _rtx/__init__\.py
- _rtx/_ensure_oauth\.py
- _rtx/_gcal_client\.py
- _rtx/_oauth_bootstrap\.py
- tests/test_calendar_oauth_transaction\.py
- tests/test_g_calendar_ensure_oauth\.py
- tests/test_gcal\.py
discovery:
  mechanism: skill
exports:
  g-calendar.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: g-calendar.source.gateway.interface.default
  g-calendar.interface.ensure-oauth:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: g-calendar.source.rtx-ensure-oauth.interface.ensure-oauth
  g-calendar.interface.scripts-gcal:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
    source_interface: g-calendar.source.rtx-gcal-client.interface.scripts-gcal
  g-calendar.interface.setup-oauth:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: g-calendar.source.rtx-oauth-bootstrap.interface.setup-oauth
gateway:
  language: Markdown
  path: SKILL.md
id: g-calendar
kind: client
node_type: module
role: productivity
schema_version: 4
sources:
  g-calendar.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  g-calendar.source.rtx-ensure-oauth:
    blueprint:
      base: module-root
      path: blueprints/rtx-ensure-oauth.yaml
  g-calendar.source.rtx-gcal-client:
    blueprint:
      base: module-root
      path: blueprints/rtx-gcal-client.yaml
  g-calendar.source.rtx-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-init.yaml
  g-calendar.source.rtx-oauth-bootstrap:
    blueprint:
      base: module-root
      path: blueprints/rtx-oauth-bootstrap.yaml
version: 1
