content:
- _ensure_oauth\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: g-calendar._rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-oauth-bootstrap.yaml
  reason: Executes the sibling OAuth bootstrap gateway when credentials are absent.
  source: g-calendar._rtx.source.rtx-oauth-bootstrap
  version: 1
description: Checks calendar credential status and either reports readiness, prints
  setup guidance, or launches delegated setup when authorized.
gateway:
  language: Python
  path: _ensure_oauth.py
id: g-calendar._rtx.source.rtx-ensure-oauth
interfaces:
  g-calendar._rtx.source.rtx-ensure-oauth.interface.ensure-oauth:
    contract:
      arguments:
        dry-run:
          default: false
          description: Report the action without launching authorization.
          required: false
          sensitivity: public
          type:
            kind: flag
        home:
          description: Home directory used to resolve g-calendar client and credentials
            files.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: When a client is present and dry-run is false, the interface
          may launch browser authorization through the OAuth bootstrap.
      direct_io:
        network:
        - access: request
          auth:
            kind: google-calendar-oauth
            mode: creates
          content: credential
          endpoint: https://accounts.google.com/o/oauth2/v2/auth
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth:
            kind: google-calendar-oauth
            mode: creates
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats:
          - json
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth:
            kind: google-calendar-oauth
            mode: creates
          content: credential verification
          endpoint: https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=1
          formats:
          - json
          id: network-3
          medium: network-request
          sensitivity: secret
          system: google-calendar
        - access: request
          content: authorization callback
          endpoint: http://localhost:8765
          formats:
          - http
          id: network-4
          medium: network-request
          sensitivity: secret
          system: localhost-callback
        reads:
        - access: read
          auth:
            kind: google-calendar-oauth
            mode: checks
          content: credential
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: <home>/.config/g-calendar/credentials.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        - access: read
          content: credential
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: <home>/.config/g-calendar/client.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        - access: read
          content: credential
          formats:
          - json
          id: read-3
          medium: local-filesystem
          path: $home/.config/g-calendar/client.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        writes:
        - access: write
          content: response
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - access: write
          auth:
            kind: google-calendar-oauth
            mode: creates
          content: credential
          formats:
          - json
          id: write-2
          medium: local-filesystem
          path: $home/.config/g-calendar/credentials.json
          path_match: exact
          sensitivity: secret
          system: filesystem
      execution:
        consistency:
          live: Credential and client-file existence are checked during this invocation.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: store-credentials
          may_occur_in_outcomes:
          - configured
          reversibility:
            compensatable: Reauthorization can replace credentials; prior credentials
              are not retained.
          value_source:
            direct_io_ref: network-2
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: The delegated bootstrap atomically replaces verified credential
              JSON.
          concurrent_invocations:
            unsafe: Concurrent browser flows and credential writers are not serialized.
          idempotency:
            non_idempotent: Reauthorization can issue a new refresh token.
          on_uncertain_completion:
            verify_then_decide: Check the credential file and run a Calendar request
              before retrying.
          partial_effects_on_failure:
            possible: OAuth consent may complete remotely even when local credential
              persistence fails.
          rollback_on_failure:
            unavailable: Remote grants are not revoked automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: status
        - direct_io_ref: write-2
          method: direct-io-state
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: needs-client
      outcomes:
      - caller_action: Continue with calendar operations.
        class: no-op
        effects: []
        id: already-configured
        outputs:
        - status
      - caller_action: Continue with calendar operations.
        class: success
        effects:
        - store-credentials
        id: configured
        outputs:
        - status
      - caller_action: Rerun without --dry-run to launch authorization.
        class: no-op
        effects: []
        id: would-run
        outputs:
        - status
      - caller_action: Install a Desktop OAuth client JSON before retrying.
        class: refusal
        effects: []
        id: needs-client
        outputs:
        - status
      - caller_action: Continue without Calendar authorization.
        class: refusal
        effects: []
        id: skipped
        outputs:
        - status
      - caller_action: Report the bootstrap failure and preserve existing credentials.
        class: error
        effects: []
        id: failed
        outputs:
        - status
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Human-readable guidance and final OAuth status.
        direct_io_ref: write-1
        empty: Never empty.
        id: status
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Check g-calendar OAuth status; print setup guidance or launch browser
      authorization as needed. Relocated from install-assistant-tools — invoke directly
      (caller-skill g-calendar) as part of connecting remotes.
    process_binding:
      args_prefix:
      - ensure-oauth
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --home
        - --dry-run
        flag_patterns:
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
        notes: Check OAuth status and guide setup for g-calendar.
        required_flags:
        - --home
    usage: --home <dir> [--dry-run]
    version: 1
  g-calendar._rtx.source.rtx-ensure-oauth.interface.use-google-credential-file:
    contract:
      arguments:
        credential-file:
          description: Credential descriptor path created by connect-google.
          direct_io_ref: read-credential
          required: true
          sensitivity: user-private
          type:
            access: read
            kind: file
            must_exist: true
            opaque_content: true
            relative_to: caller-cwd
            syntax: literal
        home:
          description: Home directory under which g-calendar config is written.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        allow-account-change:
          default: false
          description: Explicit approval to replace prior Calendar OAuth state when
            its stable Google subject differs or cannot be established.
          required: false
          sensitivity: user-private
          type:
            kind: flag
      caller_warnings:
      - external-side-effect: Performs a live Calendar read and writes credential_file
          only after scope, account-change, refresh, and probe checks succeed.
      direct_io:
        network:
        - access: read
          content: access-token refresh and Calendar list probe
          endpoint: Google OAuth token endpoint from the descriptor and Calendar API
            /users/me/calendarList?maxResults=1
          formats:
          - json
          id: calendar-probe
          medium: network
          reason: Verify live Calendar access before changing service configuration.
          sensitivity: secret
          system: google-calendar-api
        reads:
        - access: read
          content: credential descriptor
          formats:
          - json
          id: read-credential
          medium: local-filesystem
          path: caller-supplied credential descriptor path
          reason: Validate identity and Calendar scope and resolve secret references.
          sensitivity: user-private
          system: filesystem
        - access: read
          content: config
          formats:
          - json
          id: read-config
          medium: local-filesystem
          path: $home/.config/g-calendar/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-config-file
          medium: local-filesystem
          path: $home/.config/g-calendar/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: binding result
          formats:
          - json
          id: write-result
          medium: stdout
          sensitivity: user-private
          system: agent-runtime
      execution:
        consistency:
          live: The descriptor, prior binding identity, token refresh, and Calendar
            probe are checked before the config write.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-result
            kind: direct-io
          direct_io_ref: write-config-file
          id: bind-file
          may_occur_in_outcomes:
          - bound
          reversibility:
            reversible: A later explicitly approved binding may replace credential_file.
          value_source:
            argument_ref: credential-file
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: One config file is written only after all verification succeeds.
          concurrent_invocations:
            unsafe: Concurrent config writers can overwrite preserved fields.
          idempotency:
            idempotent: Rebinding the same verified path converges to the same value.
          on_uncertain_completion:
            verify_then_decide: Read config.json before retrying.
          partial_effects_on_failure:
            impossible: Scope, identity, refresh, and probe failures occur before writing.
          rollback_on_failure:
            unavailable: A low-level failure during the direct file write has no retained backup.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use Calendar with the recorded credential_file path.
        class: success
        effects:
        - bind-file
        id: bound
        outputs:
        - result
      - caller_action: Correct the file, scope, account approval, or live access before retrying.
        class: error
        effects: []
        id: failed
        outputs:
        - result
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Stable JSON reporting service, normalized path, account, bound,
          verified, or a stable error.
        direct_io_ref: write-result
        empty: Never empty.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      preconditions: []
    description: Validate and live-probe a Calendar credential descriptor before
      storing only its normalized absolute path in g-calendar config.
    process_binding:
      args_prefix:
      - use-google-credential-file
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --credential-file
        - --home
        - --allow-account-change
        flag_patterns:
          --credential-file: ^.+$
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
        required_flags:
        - --credential-file
        - --home
    usage: --credential-file <path> --home <dir> [--allow-account-change]
    version: 1
  g-calendar._rtx.source.rtx-ensure-oauth.interface.use-google-credential:
    contract:
      arguments:
        credential-id:
          description: Opaque shared credential identifier issued by connect-google's
            authorize_services flow
          required: true
          sensitivity: user-private
          type:
            kind: string
        home:
          description: Home directory under which g-calendar config is written
          required: true
          sensitivity: user-private
          type:
            kind: string
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Replaces g-calendar config.json's credential_id, binding
          g-calendar to the shared credential going forward.
      outputs: []
      outcomes:
      - id: bound
        class: success
        outputs: []
        effects:
        - write-config
        caller_action: G-calendar now authenticates using the shared credential.
      - id: insufficient-scope
        class: refusal
        outputs: []
        effects: []
        caller_action: Re-run connect-google's authorization with Calendar scope included,
          then retry.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Loads the current credential registry entry and validates granted
            scopes before writing.
        effects:
        - id: write-config
          direct_io_ref: write-1
          action: update
          value_source:
            kind: argument
            argument_ref: credential-id
          may_occur_in_outcomes:
          - bound
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-1
          reversibility:
            compensatable: Restore a previously retained config.json or call use-google-credential
              again with a valid credential.
        mutation_safety:
          atomicity:
            per_effect_only: One config file is rewritten after scope validation succeeds.
          concurrent_invocations:
            unsafe: Concurrent writers can overwrite one another's preserved settings.
          idempotency:
            idempotent: Repeating the same credential-id converges to the same configuration
              value.
          on_uncertain_completion:
            verify_then_decide: Read config.json before deciding whether to retry.
          partial_effects_on_failure:
            possible: A direct file write can be interrupted after truncation.
          rollback_on_failure:
            unavailable: The interface does not retain an automatic backup.
        verification:
        - method: direct-io-state
          direct_io_ref: write-1
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: $home/.config/g-calendar/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: $home/.config/g-calendar/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
    description: Bind g-calendar to a shared connect-google credential_id after validating
      it carries Calendar scope, storing only the opaque identifier (never the client
      secret or refresh token) in g-calendar's own config.json. The pre-existing per-service
      OAuth path (ensure-oauth) remains the unchanged fallback for callers who have
      not adopted the shared credential.
    process_binding:
      args_prefix:
      - use-google-credential
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --credential-id
        - --home
        flag_patterns:
          --credential-id: ^.+$
          --home: ^.+$
        max_positionals: 0
        min_positionals: 0
        notes: Bind g-calendar to a shared Google credential_id.
        required_flags:
        - --credential-id
        - --home
    usage: --credential-id <id> --home <dir>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: common.interface.google-credentials
  version: 1
version: 1
