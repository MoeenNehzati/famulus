content:
- _gcal_client\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: g-calendar._rtx.source.rtx-init
  version: 1
description: Implements the agenda, search, list, create, update, and delete operations
  of the Google Calendar command interface. Mints access tokens via the shared connect-google
  credential when config.json carries a credential_id, falling back unchanged to the
  legacy per-service credentials.json refresh flow otherwise.
gateway:
  language: Python
  path: _gcal_client.py
id: g-calendar._rtx.source.rtx-gcal-client
interfaces:
  g-calendar._rtx.source.rtx-gcal-client.interface.scripts-gcal:
    contract:
      arguments:
        command:
          description: Calendar CLI command and its command-specific options.
          required: true
          sensitivity: user-private
          type:
            kind: enum
            values:
            - description: Mint and print an access token.
              value: token
            - description: List accessible calendars.
              value: calendars
            - description: Create a calendar.
              value: create-calendar
            - description: List events in a time range.
              value: agenda
            - description: Search events.
              value: search
            - description: Fetch one event.
              value: get
            - description: Create an event.
              value: create
            - description: Patch an event.
              value: update
            - description: Delete an event.
              value: delete
            - description: Move an event between calendars.
              value: move
        options:
          description: Command-specific calendar and event and query and date-time
            and content options.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Create-calendar, create, update, delete, and move change
          Google Calendar state.
      - rate-limited: Google Calendar and OAuth token endpoints enforce service quotas.
      direct_io:
        network:
        - access: request
          auth:
            kind: google-calendar-oauth
            mode: uses-existing
          content: event
          endpoint: https://www.googleapis.com/calendar/v3
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: google-calendar
        - access: request
          auth:
            kind: google-calendar-oauth
            mode: uses-existing
          content: credential
          endpoint: https://oauth2.googleapis.com/token
          formats:
          - json
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        reads:
        - access: read
          auth:
            kind: google-calendar-oauth
            mode: uses-existing
          content: event
          formats:
          - json
          id: read-1
          medium: network-request
          sensitivity: user-private
          system: google-calendar
        - access: read
          auth:
            kind: google-calendar-oauth
            mode: uses-existing
          content: credential
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: $home/.config/g-calendar/credentials.json
          path_match: exact
          sensitivity: secret
          system: filesystem
        - access: read
          content: config
          formats:
          - json
          id: read-3
          medium: local-filesystem
          path: $home/.config/g-calendar/config.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          auth:
            kind: google-calendar-oauth
            mode: uses-existing
          content: event
          formats:
          - json
          id: write-1
          medium: network-request
          sensitivity: user-private
          system: google-calendar
        - access: write
          content: event
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-3
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: OAuth and Calendar API requests operate on current service state.
        effects:
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: result
          direct_io_ref: write-1
          id: calendar-state
          may_occur_in_outcomes:
          - mutated
          reversibility:
            compensatable: A later update or move or delete may compensate; previous
              event fields are not retained.
          value_source:
            argument_ref: options
            kind: argument
        - action: delete
          confirmation_evidence:
            kind: output
            output_ref: result
          direct_io_ref: write-1
          id: calendar-delete
          may_occur_in_outcomes:
          - deleted
          reversibility:
            irreversible: Deleted event content is not retained by this interface.
          value_source:
            argument_ref: options
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Each Calendar API request is one remote effect.
          concurrent_invocations:
            unsafe: Concurrent mutations of the same resource are not serialized.
          idempotency:
            non_idempotent: Repeating create can create duplicates.
          on_uncertain_completion:
            verify_then_decide: Query the event or calendar before retrying a mutation.
          partial_effects_on_failure:
            possible: A remote mutation may complete before a local network error
              is reported.
          rollback_on_failure:
            unavailable: The CLI does not retain prior remote values.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Consume the returned calendar information.
        class: success
        effects: []
        id: queried
        outputs:
        - result
      - caller_action: Record the returned event or calendar identifier.
        class: success
        effects:
        - calendar-state
        id: mutated
        outputs:
        - result
      - caller_action: Record the deletion confirmation.
        class: success
        effects:
        - calendar-delete
        id: deleted
        outputs:
        - result
      - caller_action: Report the API error and do not infer remote state.
        class: error
        effects: []
        id: failed
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Requested calendar rows and event detail and access token or
          mutation confirmation.
        direct_io_ref: write-2
        empty: Agenda and search print '(no events)' when empty.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: bounded
          limit: 50
        type:
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-3
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Query or modify Google Calendar events via the Python calendar CLI
      (agenda, search, create, update, delete, etc.).
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        max_positionals: 1
        min_positionals: 1
        name: token-or-calendars
        positional_patterns:
          '0': ^(token|calendars)$
      - allow_stdin: false
        allowed_flags:
        - --summary
        - --description
        - --color-id
        - --timezone
        flag_patterns:
          --color-id: ^.*$
          --description: ^.*$
          --summary: ^.+$
          --timezone: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: create-calendar
        positional_patterns:
          '0': ^create-calendar$
        required_flags:
        - --summary
      - allow_stdin: false
        allowed_flags:
        - --calendar
        - --from
        - --to
        - --days
        - --all-calendars
        flag_patterns:
          --calendar: ^.+$
          --days: ^.+$
          --from: ^.+$
          --to: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: agenda
        positional_patterns:
          '0': ^agenda$
      - allow_stdin: false
        allowed_flags:
        - --calendar
        - --from
        - --to
        - --days
        - --all-calendars
        flag_patterns:
          --calendar: ^.+$
          --days: ^.+$
          --from: ^.+$
          --to: ^.+$
        max_positionals: 2
        min_positionals: 2
        name: search
        positional_patterns:
          '0': ^search$
      - allow_stdin: false
        allowed_flags:
        - --calendar
        - --event-id
        flag_patterns:
          --calendar: ^.+$
          --event-id: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: get
        positional_patterns:
          '0': ^get$
        required_flags:
        - --event-id
      - allow_stdin: false
        allowed_flags:
        - --calendar
        - --summary
        - --start
        - --end
        - --description
        - --location
        - --all-day
        - --timezone
        flag_patterns:
          --calendar: ^.+$
          --description: ^.*$
          --end: ^.+$
          --location: ^.*$
          --start: ^.+$
          --summary: ^.+$
          --timezone: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: create
        positional_patterns:
          '0': ^create$
        required_flags:
        - --summary
        - --start
        - --end
      - allow_stdin: false
        allowed_flags:
        - --calendar
        - --event-id
        - --summary
        - --description
        - --location
        - --start
        - --end
        - --timezone
        flag_patterns:
          --calendar: ^.+$
          --description: ^.*$
          --end: ^.+$
          --event-id: ^.+$
          --location: ^.*$
          --start: ^.+$
          --summary: ^.*$
          --timezone: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: update
        positional_patterns:
          '0': ^update$
        required_flags:
        - --event-id
      - allow_stdin: false
        allowed_flags:
        - --calendar
        - --event-id
        flag_patterns:
          --calendar: ^.+$
          --event-id: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: delete
        positional_patterns:
          '0': ^delete$
        required_flags:
        - --event-id
      - allow_stdin: false
        allowed_flags:
        - --event-id
        - --from
        - --to
        flag_patterns:
          --event-id: ^.+$
          --from: ^.+$
          --to: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: move
        positional_patterns:
          '0': ^move$
        required_flags:
        - --event-id
        - --to
    usage: <command> [options]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: common.interface.google-credentials
  version: 1
version: 1
