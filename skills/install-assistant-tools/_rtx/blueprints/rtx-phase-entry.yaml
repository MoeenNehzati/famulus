description: Resolves one installation context and runs the confirmed five-stage
  idempotent apply workflow, deriving managed-runtime editability from development
  mode and including recoverable user-level Codex and Claude access reconciliation.
gateway:
  language: Python
  path: _phase_entry.py
id: install-assistant-tools._rtx.source.rtx-phase-entry
interfaces:
  install-assistant-tools._rtx.source.rtx-phase-entry.interface.scripts-install:
    content:
    - _phase_entry\.py
    uses_interfaces:
    - interface: common.interface.famulus-paths
      version: 1
    - interface: install.interface.install-info
      version: 1
    - interface: install.interface.context
      version: 1
    - interface: install.interface.assistant-access
      version: 1
    - interface: install-assistant-tools._rtx.source.rtx-assistant-access-config.interface.python-api
      version: 1
    - interface: install.interface.doctor
      version: 1
    - interface: install.interface.managed-runtime
      version: 1
    - interface: install.interface.uv-bootstrap
      version: 1
    contract:
      arguments:
        options:
          description: Explicit mode, optional development checkout, helpers, backend,
            dry-run, interaction, and confirmation choices.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Non-dry-run execution can install launchers and bridge
          live development configuration across multiple installer phases.
      - external-side-effect: Apply reconciles separate owned values in user-level
          Codex and Claude settings; the recurring config root grants scheduled-command authority.
      direct_io:
        network: []
        reads:
        - access: read
          content: development-mode choice
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: configure
          content: managed assistant installation state, including a separately marked
            Codex writable_roots block and recorded Claude additionalDirectories values
          formats:
          - files
          - symlinks
          - shell
          - git-config
          id: write-1
          medium: home-filesystem
          path: caller-selected installation targets
          sensitivity: user-private
          system: filesystem
        - access: write
          content: phase status
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          per_source: Candidate, scaffold, projections, helpers, and doctor share one resolved context;
            candidate editability is derived from that context's mode.
        effects:
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: installation-state
          may_occur_in_outcomes:
          - installed
          - failed
          reversibility:
            compensatable: The companion uninstaller can remove managed installation
              artifacts.
          value_source:
            argument_ref: options
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: The ordered installer phases commit separate effects.
          concurrent_invocations:
            unsafe: Concurrent phase-one installations are not serialized.
          idempotency:
            idempotent: Repeating the same resolved choices reconciles managed targets.
          on_uncertain_completion:
            verify_then_decide: Inspect phase output and target files before retrying.
          partial_effects_on_failure:
            possible: Scaffold or bridge effects can remain when a later phase fails.
          rollback_on_failure:
            unavailable: Earlier phases are not automatically undone.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: status
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: mode-required
      outcomes:
      - caller_action: Review the five stages and diagnostic report.
        class: success
        effects:
        - installation-state
        id: installed
        outputs:
        - status
      - caller_action: Pass explicit mode, required development checkout, and --yes for non-interactive execution.
        class: refusal
        effects: []
        id: mode-required
        outputs: []
      - caller_action: Report the failed phase and preserve the evidence for earlier
          completed phases.
        class: partial
        effects:
        - installation-state
        id: failed
        outputs:
        - status
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Exactly five user-visible stages and the final diagnostic result.
        direct_io_ref: write-2
        empty: Never empty.
        id: status
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Choose mode, confirm choices, apply once, diagnose the same context, and explain optional next steps without invoking them.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags: [--dry-run, --non-interactive, --yes, --dev-mode, --no-dev-mode,
          --repo-path, --agents, --default-llm, --optional-modules, --home, --bin-dir,
          --shell-rc, --codex-home, --claude-home]
        flag_patterns:
          --repo-path: ^.+$
          --agents: ^.*$
          --default-llm: ^(claude|codex)$
          --optional-modules: ^.*$
          --home: ^.+$
          --bin-dir: ^.+$
          --shell-rc: ^.+$
          --codex-home: ^.+$
          --claude-home: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
    usage: '[--dry-run] [--non-interactive --yes] [--dev-mode --repo-path DIR|--no-dev-mode]
      [--agents LIST] [--default-llm {claude,codex}] [--optional-modules LIST]
      [--home DIR] [--bin-dir DIR] [--shell-rc FILE] [--codex-home DIR] [--claude-home DIR]'
    version: 2
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: binary
  name: git
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Configures repository hook settings during development installs.
  version: any
schema_version: 6
uses_interfaces:
- interface: common.interface.famulus-paths
  version: 1
- interface: install.interface.context
  version: 1
- interface: install.interface.assistant-access
  version: 1
- interface: install-assistant-tools._rtx.source.rtx-assistant-access-config.interface.python-api
  version: 1
- interface: install.interface.doctor
  version: 1
- interface: install.interface.install-info
  version: 1
- interface: install.interface.managed-runtime
  version: 1
- interface: install.interface.uv-bootstrap
  version: 1
version: 1
maturity: stable
