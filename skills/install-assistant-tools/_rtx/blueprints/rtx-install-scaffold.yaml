content:
- _install_scaffold\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: install-assistant-tools._rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-install-launcher-init.yaml
  reason: Imports Python source from _rtx/_install_launcher/__init__.py.
  source: install-assistant-tools._rtx.source.rtx-install-launcher-init
  version: 1
description: Installs dispatcher and invoke-skill launchers, provisions the shared
  certifier signing material, and ensures the installation bin directory is present
  in the user's shell path.
gateway:
  language: Python
  path: _install_scaffold.py
id: install-assistant-tools._rtx.source.rtx-install-scaffold
interfaces:
  install-assistant-tools._rtx.source.rtx-install-scaffold.interface.scripts-scaffold:
    content:
    - _install_scaffold\.py
    uses_interfaces:
    - interface: certification.interface.records
      version: 1
    - interface: install.interface.managed-runtime
      version: 1
    contract:
      arguments:
        options:
          description: Optional home and bin and shell paths plus dry-run choice.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        repo-root:
          description: AI repository checkout containing dispatcher package and launcher
            sources.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Non-dry-run execution installs the dispatcher package
          and launchers and may update PATH in a shell startup file.
      - external-side-effect: When the v4 cryptography dependency is present, provisioning
          creates or verifies the certifier's public-key files and private key in
          the configured user secret store.
      direct_io:
        network: []
        reads:
        - access: read
          content: dispatcher package and launcher sources
          formats:
          - python
          - shell
          - toml
          id: read-1
          medium: repository-filesystem
          path: <repo-root>
          path_match: exact
          sensitivity: public
          system: filesystem
        writes:
        - access: configure
          content: installed package launchers and managed PATH block
          formats:
          - python-package
          - shell
          - batch
          id: write-1
          medium: home-filesystem
          path: caller-selected bin and shell startup paths; the bin dir defaults
            to the platform Famulus user-bin dir (never under Documents) when --bin-dir
            is omitted
          sensitivity: user-private
          system: filesystem
        - access: write
          content: scaffold status
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - access: configure
          content: Ed25519 public verification files and private key selected through
            the configured secret store
          formats:
          - pem
          - text
          - secret-store-entry
          id: write-3
          medium: local-filesystem
          path: <repo-root>/skills/skill-certifier/.certificates/public-keys
          sensitivity: credential
          system: filesystem
      execution:
        consistency:
          live: Repository source and target path state is observed during installation.
        effects:
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: scaffold-state
          may_occur_in_outcomes:
          - installed
          reversibility:
            compensatable: Installed launchers and the managed PATH block can be removed.
          value_source:
            argument_ref: repo-root
            kind: argument
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-3
            kind: direct-io
          direct_io_ref: write-3
          id: certificate-signing-material
          may_occur_in_outcomes:
          - installed
          reversibility:
            irreversible: Removing the active private key prevents future signing
              and removing retained public keys invalidates historical verification.
          value_source:
            argument_ref: repo-root
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: The declared Python package set installs in one atomic
              batch call (via officina.install.managed-runtime) rather than per-package;
              certificate-key provisioning, launcher writes, and shell configuration
              remain separate effects.
          concurrent_invocations:
            unsafe: Concurrent scaffold installers are not serialized.
          idempotency:
            idempotent: Repeating with the same source and targets reconciles equivalent
              files and managed shell blocks.
          on_uncertain_completion:
            verify_then_decide: Resolve the launcher commands and inspect the managed
              PATH block before retrying.
          partial_effects_on_failure:
            possible: Package, certificate-key, or launcher installation may complete
              before a later shell update fails.
          rollback_on_failure:
            unavailable: Earlier completed effects are not rolled back automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: status
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Verify dispatcher, invoke-skill, and the reported certificate-signing-material
          capability.
        class: success
        effects:
        - scaffold-state
        - certificate-signing-material
        id: installed
        outputs:
        - status
      - caller_action: Review the dry-run actions.
        class: no-op
        effects: []
        id: planned
        outputs:
        - status
      - caller_action: Report the failed package or launcher or shell-path action.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Ordered scaffold actions or dry-run plan.
        direct_io_ref: write-2
        empty: Never empty.
        id: status
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Install the dispatcher + invoke-skill launchers and put the bin dir
      on PATH. Universal floor, mode-independent.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --repo-root
        - --home
        - --bin-dir
        - --shell-rc
        - --dry-run
        flag_patterns:
          --bin-dir: ^.+$
          --home: ^.+$
          --repo-root: ^.+$
          --shell-rc: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --repo-root
    usage: --repo-root DIR [--home DIR] [--bin-dir DIR] [--shell-rc FILE] [--dry-run]
    version: 2
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: certification.interface.records
  version: 1
- interface: install.interface.managed-runtime
  version: 1
version: 1
