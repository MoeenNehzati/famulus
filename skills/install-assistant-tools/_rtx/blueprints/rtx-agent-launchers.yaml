content:
- _agent_launchers\.py
- assets/bin/_agent_launch\.py
- assets/bin/assistant
- assets/bin/assistant\.bat
- assets/bin/coauthor
- assets/bin/coauthor\.bat
- assets/bin/collab
- assets/bin/collab\.bat
- assets/bin/tmux\-workspace
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: install-assistant-tools-rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-install-launcher-init.yaml
  reason: Imports Python source from _rtx/_install_launcher/__init__.py.
  source: install-assistant-tools-rtx.source.rtx-install-launcher-init
  version: 1
description: Installs selected assistant command launchers, profile configuration, worker directories, and default-assistant configuration.
gateway:
  language: Python
  path: _agent_launchers.py
id: install-assistant-tools-rtx.source.rtx-agent-launchers
interfaces:
  install-assistant-tools-rtx.source.rtx-agent-launchers.interface.scripts-launchers:
    contract:
      arguments:
        agents:
          description: Comma-separated assistant and collab and coauthor selection. Only the listed agents are installed by direct invocation of this interface; the phase-entry orchestrator additionally forces assistant into every installation it runs regardless of this selection, because assistant is a required invoke-skill prerequisite.
          required: true
          sensitivity: public
          type:
            kind: string
        options:
          description: Optional home and bin and host-config paths plus default LLM and install mode and dry-run choice.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        repo-root:
          description: AI repository checkout containing launcher and agent profile sources.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Non-dry-run execution installs selected launchers and profiles and may update the shell startup file.
      direct_io:
        network: []
        reads:
        - access: read
          content: launcher and agent profile sources
          formats:
          - python
          - shell
          - yaml
          id: read-1
          medium: repository-filesystem
          path: <repo-root>
          path_match: exact
          sensitivity: public
          system: filesystem
        writes:
        - access: configure
          content: launchers and profile configuration and worker directories and shell default
          formats:
          - python
          - shell
          - toml
          - directory
          id: write-1
          medium: home-filesystem
          path: caller-selected home and bin and assistant config paths; worker directories default to the platform Famulus state dir in plugin mode and to <repo-root>/workers in development mode
          sensitivity: user-private
          system: filesystem
        - access: write
          content: installation status
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          live: Target paths and existing files are checked during execution.
        effects:
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: launcher-state
          may_occur_in_outcomes:
          - installed
          reversibility:
            compensatable: Installed launchers and profiles can be removed by the companion uninstaller.
          value_source:
            argument_ref: agents
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Each launcher and profile and startup block is written separately.
          concurrent_invocations:
            unsafe: Concurrent installers are not serialized.
          idempotency:
            idempotent: Repeating the same selection reconciles equivalent target files and startup configuration.
          on_uncertain_completion:
            verify_then_decide: Inspect reported targets before retrying.
          partial_effects_on_failure:
            possible: Earlier selected launchers may be installed before a later target fails.
          rollback_on_failure:
            unavailable: Completed earlier writes are not rolled back automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: status
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Verify the selected launcher commands from the reported bin directory.
        class: success
        effects:
        - launcher-state
        id: installed
        outputs:
        - status
      - caller_action: Review the dry-run actions before rerunning without dry-run.
        class: no-op
        effects: []
        id: planned
        outputs:
        - status
      - caller_action: Report the failed target and retain earlier completed targets.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: both
        cardinality:
          maximum:
          minimum: 1
        description: Ordered installation actions or dry-run plan.
        direct_io_ref: write-2
        empty: Never empty.
        id: status
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Install per-agent bin launcher, profile config, worker dir, and ASSISTANT_DEFAULT for the given agents. Direct invocation of this interface installs exactly the --agents selection; when this launcher installation runs as part of the phase-entry orchestrator, assistant is additionally forced into the installed set regardless of selection, because it is a required invoke-skill prerequisite (feedback item 18) and is not user-selectable. Worker directories are created under the platform Famulus state dir in plugin mode (--mode plugin, the default plugin-cache checkout is a public/immutable tree) or under <repo-root>/workers in development mode (--mode development, an explicit live checkout).
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --repo-root
        - --agents
        - --home
        - --bin-dir
        - --codex-home
        - --claude-home
        - --shell-rc
        - --default-llm
        - --dry-run
        - --mode
        flag_patterns:
          --agents: ^.*$
          --bin-dir: ^.+$
          --claude-home: ^.+$
          --codex-home: ^.+$
          --default-llm: ^(claude|codex)$
          --home: ^.+$
          --repo-root: ^.+$
          --shell-rc: ^.+$
          --mode: ^(development|plugin)$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --repo-root
    usage: --repo-root DIR --agents LIST [--home DIR] [--bin-dir DIR] [--codex-home DIR] [--claude-home DIR] [--shell-rc FILE] [--default-llm {claude,codex}] [--mode {development,plugin}] [--dry-run]
    version: 3
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 5
uses_interfaces:
- interface: common.interface.toml-io
  version: 1
- interface: common.interface.famulus-paths
  version: 1
version: 1
