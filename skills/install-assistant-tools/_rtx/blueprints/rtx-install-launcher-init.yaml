- _install_launcher/_linux_launcher\.py
- _install_launcher/_osx_launcher\.py
- _install_launcher/_windows_launcher\.py
dependencies: []
description: Marks the platform-launcher implementation directory as a Python package
  and exposes no callable interface. _linux_launcher.py and _windows_launcher.py generate
  shims that reference the fixed <runtime_root>/bootstrap/resolvers/v1/launch.py resolver
  contract (see officina.install.resolvers.launch, a dependency-free stdlib-only script)
  instead of embedding a release-specific repo checkout or interpreter path.
gateway:
