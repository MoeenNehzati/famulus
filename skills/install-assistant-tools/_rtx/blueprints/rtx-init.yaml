dependencies:
- blueprint:
    base: repository-root
    path: src/officina/common/blueprints/atomic-files.yaml
  reason: Imports deterministic byte and symlink publication for recorded owner mutations.
  source: common.source.atomic-files
  version: 1
description: >-
  Marks the installer runtime directory as a Python package and owns
  the durable manifest plus schema-v3 transaction journal and mandatory mutation
  recorder. Generic mutation IDs bind the transaction, stable operation key, semantic
  kind, logical resource kind and ID, intended closed state, and exact none/upsert/forget
  ownership delta; the observed before-state remains durable but is deliberately outside
  the deterministic request ID. The recorder durably saves pending before re-observation,
  passes that exact JournalMutation to apply so the effect can derive its only build name
  and revalidate expected_before, verifies the intended state, saves the manifest delta first, and only then
  clears pending and records completion. Its own atomic journal and manifest writes are
  internal bookkeeping exempt from recursive recording. Generic recovery only classifies:
  intended state is adopted, expected state remains pending for an identical recorder
  request to resume, and every third state is refused. Filesystem regular-file observation
  and journal states share a 1,048,576-byte cap, enforced before reads and while streaming
  and before recorder pending publication or apply.
  Windows registry string values and local Git-config values allow empty strings but are
  capped at 65,536 UTF-8 bytes; registry observation accepts only exact integer REG_SZ or
  REG_EXPAND_SZ types, and converts non-not-found OS failures to static diagnostics. Git
  observation requires a finite positive non-boolean timeout, binds `git config --local`
  to the validated repository, scrubs all repository/config-selection environment, and
  concurrently drains pipes while retaining at most 65,537 stdout bytes including the
  required NUL delimiter and 65,536 stderr bytes. Overflow or timeout terminates and, if
  needed, kills and reaps the direct child. Capture uses the public low-level asyncio
  subprocess transport/protocol contract: callback buffers are capped independently,
  the first overflowing channel is paused before cleanup, parent pipe transports are
  explicitly closed, and no blocking synchronous Windows pipe probe or reader thread
  exists. The synchronous CLI boundary rejects an already-active
  event loop before spawning; unsupported platform subprocess loops fail with static
  diagnostics. Async transport setup, capture, bounded drain, and cleanup share one
  absolute deadline budget. A direct child that exits while a descendant retains either
  pipe is refused after a bounded drain grace. This helper does not own or claim
  termination of descendant process trees. Callers must supply
  absolute lexically normalized filesystem IDs with no dot segments and independently
  validate their authorized semantic target. Git repository IDs are lexical absolute
  paths; Git key identity lowercases only the case-insensitive section and terminal
  variable while preserving case-sensitive subsection spelling. Supported registry
  identity accepts only nonempty printable ASCII names, canonicalizes HKCU and ASCII-case
  equivalents, and treats only a literal backslash as a subkey separator; a forward slash
  remains literal name data.
  Logical identities are canonical JSON, never fake paths. Valid schema-v2 certificate-only records are
  normalized to the filesystem resource representation, while version 1 and v2 generic
  pending mutations are rejected. Certificate-selector validation remains specialized:
  it binds the lexical active-key-id basename, exact snapshots, and prior Task-6B ID;
  generic recovery refuses it before observation, and Task 6D must recompute its canonical
  path before certificate recovery.
  Filesystem link, copy, and managed shell-block owners require a recorder keyword for
  every live call; dry-run alone may pass null. They render exact intended state before
  mutate, publish through the common deterministic primitives under the caller-held
  per-home InstallLock and private user-owned parent namespace, and contain no direct
  manifest record, forget, or save fallback. Durable intended regular-file modes must
  retain owner-read permission because completion requires a fresh descriptor-bound
  digest observation after publication; owner-unreadable modes are rejected before any
  pending record or effect. The POSIX contract excludes uncooperative
  same-identity writers to final or build names and retained writable source descriptors;
  compare-then-replace is not an inode-conditional namespace primitive. Link publication
  revalidates the no-follow source type and identity immediately before publish, while
  immutable-release authority remains Task 6D and developer-link semantics remain Task
  6C3. Managed rc replacement accepts each update only as one exact `export KEY=...` line
  for its matching key, rejects CR, LF, NUL, marker injection, malformed keys, and
  mismatches, then reparses the rendered block before recording. It preserves normalized
  ordinary permission bits from an existing regular file while removing special bits,
  uses private mode for an absent file, and owns only the exact marker block.
