authority:
  owns_filesystem:
  - allowed_readers:
    - install.interface.doctor
    match: exact
    path: <codex-home>/config.toml
    reason: The installer owns only its separately marked writable_roots entries;
      foreign Codex configuration remains user-owned.
  - allowed_readers:
    - install.interface.doctor
    match: exact
    path: <claude-home>/settings.json
    reason: The installer owns only its recorded permissions.additionalDirectories
      values; foreign Claude settings remain user-owned.
  - allowed_readers:
    - install.interface.doctor
    match: exact
    path: <famulus-install-state-root>/install-manifest.json
    reason: The manifest journals exact installer ownership, including recoverable
      assistant configuration transactions.
  - allowed_readers: []
    match: exact
    path: <famulus-install-state-root>/assistant-access.lock
    reason: The installer owns the stable empty sidecar that serializes cooperating
      assistant-access apply and uninstall operations.
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _phase_entry.py
      - Interface
      reason: Run the five-stage installer orchestrator through the shared Python machine-interface
        runner.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _install_scaffold.py
      - Interface
      reason: Install dispatcher and invoke-skill launchers through the shared Python
        machine-interface runner.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _config_bridge.py
      - Interface
      reason: Wire dev-mode config links and hooks through the shared Python machine-interface
        runner.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _scripts_doctor.py
      - Interface
      reason: Diagnose one explicitly selected installation context without mutation.
    network: []
children: {}
content:
- assets/bin/milestone
- assets/bin/agent\-timeline
- _config_bridge\.py
- __init__\.py
- _fs_links\.py
- _scripts_doctor\.py
- _install_uninstall\.py
- _shell_block\.py
- _state_record\.py
- _install_launcher/__init__\.py
- _install_launcher/_linux_launcher\.py
- _install_launcher/_osx_launcher\.py
- _install_launcher/_windows_launcher\.py
- _install_scaffold\.py
- _phase_entry\.py
- _assistant_access_config\.py
- tests/.*
description: Code module for the install-assistant-tools skill.
