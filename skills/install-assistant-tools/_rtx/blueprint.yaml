authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _phase_entry.py
      - Interface
      reason: Run the phase-1 installer orchestrator through the shared Python machine-interface
        runner.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _install_scaffold.py
      - Interface
      reason: Install dispatcher and invoke-skill launchers through the shared Python
        machine-interface runner.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _config_bridge.py
      - Interface
      reason: Wire dev-mode config links and hooks through the shared Python machine-interface
        runner.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _agent_launchers.py
      - Interface
      reason: Install selected assistant launchers through the shared Python machine-interface
        runner.
    network: []
children: {}
content:
- _agent_launchers\.py
- assets/bin/_agent_launch\.py
- assets/bin/assistant
- assets/bin/assistant\.bat
- assets/bin/coauthor
- assets/bin/coauthor\.bat
- assets/bin/collab
- assets/bin/collab\.bat
- assets/bin/tmux\-workspace
- _config_bridge\.py
- __init__\.py
- _fs_links\.py
- _google_onboarding\.py
- _install_uninstall\.py
- _shell_block\.py
- _state_record\.py
- _install_launcher/__init__\.py
- _install_launcher/_base_launcher\.py
- _install_launcher/_linux_launcher\.py
- _install_launcher/_osx_launcher\.py
- _install_launcher/_windows_launcher\.py
- _install_scaffold\.py
- _phase_entry\.py
- tests/.*
description: Code module for the install-assistant-tools skill.
exports:
  install-assistant-tools-rtx.interface.scripts-dev-link:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
    source_interface: install-assistant-tools-rtx.source.rtx-config-bridge.interface.scripts-dev-link
  install-assistant-tools-rtx.interface.scripts-install:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
    source_interface: install-assistant-tools-rtx.source.rtx-phase-entry.interface.scripts-install
  install-assistant-tools-rtx.interface.scripts-launchers:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
    source_interface: install-assistant-tools-rtx.source.rtx-agent-launchers.interface.scripts-launchers
  install-assistant-tools-rtx.interface.scripts-scaffold:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
    source_interface: install-assistant-tools-rtx.source.rtx-install-scaffold.interface.scripts-scaffold
gateway:
  language: Python>=3.11
  path: __init__.py
id: install-assistant-tools-rtx
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  install-assistant-tools-rtx.source.rtx-agent-launchers:
    blueprint:
      base: module-root
      path: blueprints/rtx-agent-launchers.yaml
  install-assistant-tools-rtx.source.rtx-config-bridge:
    blueprint:
      base: module-root
      path: blueprints/rtx-config-bridge.yaml
  install-assistant-tools-rtx.source.rtx-google-onboarding:
    blueprint:
      base: module-root
      path: blueprints/rtx-google-onboarding.yaml
  install-assistant-tools-rtx.source.rtx-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-init.yaml
  install-assistant-tools-rtx.source.rtx-install-launcher-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-install-launcher-init.yaml
  install-assistant-tools-rtx.source.rtx-install-scaffold:
    blueprint:
      base: module-root
      path: blueprints/rtx-install-scaffold.yaml
  install-assistant-tools-rtx.source.rtx-phase-entry:
    blueprint:
      base: module-root
      path: blueprints/rtx-phase-entry.yaml
version: 1
