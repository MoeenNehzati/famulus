authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|agents/openai\.yaml)
description: Installs or refreshes assistant launchers, shared dispatcher tooling,
  and optional development-checkout configuration links across supported hosts.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - assistant-installation
    - system-maintenance
    visibility: listed
  activated_by:
  - user-request
  persistent_modifier: false
exports:
  install-assistant-tools.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: install-assistant-tools.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: install-assistant-tools
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        install-assistant-tools._rtx.interface.scripts-dev-link: 2
        install-assistant-tools._rtx.interface.scripts-install: 2
        install-assistant-tools._rtx.interface.scripts-launchers: 3
        install-assistant-tools._rtx.interface.scripts-scaffold: 2
    interface_access:
      install-assistant-tools._rtx.interface.scripts-dev-link:
        allow_all_modules: false
        allowed_callers: []
      install-assistant-tools._rtx.interface.scripts-install:
        allow_all_modules: false
        allowed_callers: []
      install-assistant-tools._rtx.interface.scripts-launchers:
        allow_all_modules: false
        allowed_callers: []
      install-assistant-tools._rtx.interface.scripts-scaffold:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  install-assistant-tools.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 3
maturity: stable
installation_tier: core
personal_preference:
  applies: false
