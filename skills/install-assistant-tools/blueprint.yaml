authority:
  owns_filesystem: []
children:
  install-assistant-tools-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:SKILL\.md|agents/openai\.yaml)
description: Installs or refreshes assistant launchers, shared dispatcher tooling,
  and optional development-checkout configuration links across supported hosts.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - assistant-installation
    - system-maintenance
    visibility: listed
  activated_by:
  - user-request
  persistent_modifier: false
exports:
  install-assistant-tools.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: install-assistant-tools.source.gateway.interface.default
  install-assistant-tools.interface.scripts-dev-link:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: install-assistant-tools-rtx.interface.scripts-dev-link
      version: 2
  install-assistant-tools.interface.scripts-install:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: install-assistant-tools-rtx.interface.scripts-install
      version: 2
  install-assistant-tools.interface.scripts-launchers:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: install-assistant-tools-rtx.interface.scripts-launchers
      version: 2
  install-assistant-tools.interface.scripts-scaffold:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: install-assistant-tools-rtx.interface.scripts-scaffold
      version: 2
gateway:
  language: Markdown
  path: SKILL.md
id: install-assistant-tools
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  install-assistant-tools.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 3
