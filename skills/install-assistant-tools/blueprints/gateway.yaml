content:
- SKILL\.md
dependencies: []
description: Guides one explicit five-stage installation workflow and read-only diagnosis route.
gateway:
  language: Markdown
  path: SKILL.md
id: install-assistant-tools.source.gateway
interfaces:
  install-assistant-tools.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: connect-google.interface.default
      version: 1
    - interface: install-assistant-tools._rtx.interface.scripts-dev-link
      version: 2
    - interface: install-assistant-tools._rtx.interface.scripts-install
      version: 2
    - interface: install-assistant-tools._rtx.interface.scripts-doctor
      version: 1
    - interface: install-assistant-tools._rtx.interface.scripts-scaffold
      version: 2
    - interface: recurring-tasks.interface.default
      version: 1
    contract:
      arguments:
        request:
          description: User request to install or update or repair or propagate the
            assistant tools.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: After explicit confirmation, apply may create a managed runtime,
          shared commands, standard PATH configuration, or development-only projections and Git hook settings.
      direct_io:
        network: []
        reads:
        - access: read
          content: installation request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: installation response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          per_source: Apply receives one resolved context; diagnosis reads that same explicit context.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: clarification-required
      outcomes:
      - caller_action: Review the reported installed paths and any follow-up instructions.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Supply the missing explicit mode, development checkout, or confirmation.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      - caller_action: Report the failed installer phase without claiming later phases
          completed.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Five-stage choices, apply and verification result, or read-only diagnosis.
        direct_io_ref: write-1
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 2
  install-assistant-tools.source.gateway.interface.diagnose:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: install-assistant-tools._rtx.interface.scripts-doctor
      version: 1
    contract:
      arguments:
        request:
          description: Explicit standard or development installation context to diagnose,
            including the absolute checkout for development and whether JSON output is requested.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: explicit installation context and current local installation state
          formats:
          - text
          id: read-diagnose
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: read-only installation diagnosis
          formats:
          - markdown
          id: write-diagnose
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          per_source: Diagnosis reads one explicitly selected context and delegates to
            the canonical child diagnostic route without mutation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: diagnosis
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: failed
      outcomes:
      - caller_action: Report the selected context's diagnostic status and exact recovery command.
        class: success
        effects: []
        id: diagnosed
        outputs:
        - diagnosis
      - caller_action: Report the invalid or unreadable explicit context without changing it.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Human-readable or JSON diagnosis for the explicitly selected context.
        direct_io_ref: write-diagnose
        empty: Never empty.
        id: diagnosis
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Diagnose one explicitly selected Famulus installation context through
      the canonical read-only child diagnostic route.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: connect-google.interface.default
  version: 1
- interface: install-assistant-tools._rtx.interface.scripts-dev-link
  version: 2
- interface: install-assistant-tools._rtx.interface.scripts-doctor
  version: 1
- interface: install-assistant-tools._rtx.interface.scripts-install
  version: 2
- interface: install-assistant-tools._rtx.interface.scripts-scaffold
  version: 2
- interface: recurring-tasks.interface.default
  version: 1
version: 1
maturity: stable
