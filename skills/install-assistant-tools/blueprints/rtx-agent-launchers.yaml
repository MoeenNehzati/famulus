content:
- _rtx/_agent_launchers\.py
- bin/_agent_launch\.py
- bin/assistant
- bin/assistant\.bat
- bin/coauthor
- bin/coauthor\.bat
- bin/collab
- bin/collab\.bat
- bin/tmux\-workspace
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: install-assistant-tools.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-install-launcher-init.yaml
  reason: Imports Python source from _rtx/_install_launcher/__init__.py.
  source: install-assistant-tools.source.rtx-install-launcher-init
  version: 1
description: Installs selected assistant command launchers, profile configuration, worker directories, and default-assistant configuration.
gateway:
  language: Python
  path: _rtx/_agent_launchers.py
id: install-assistant-tools.source.rtx-agent-launchers
interfaces:
  install-assistant-tools.source.rtx-agent-launchers.interface.scripts-launchers:
    contract:
      arguments:
        repo-root: {description: AI repository checkout containing launcher and agent profile sources., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
        agents: {description: Comma-separated assistant and collab and coauthor selection., required: true, sensitivity: public, type: {kind: string}}
        options: {description: Optional home and bin and host-config paths plus default LLM and dry-run choice., required: false, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Non-dry-run execution installs selected launchers and profiles and may update the shell startup file.
      outputs:
      - {id: status, audience: both, description: Ordered installation actions or dry-run plan., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: null}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: installed, class: success, outputs: [status], effects: [launcher-state], caller_action: Verify the selected launcher commands from the reported bin directory.}
      - {id: planned, class: no-op, outputs: [status], effects: [], caller_action: Review the dry-run actions before rerunning without dry-run.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Report the failed target and retain earlier completed targets.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Target paths and existing files are checked during execution.}
        effects:
        - {id: launcher-state, direct_io_ref: write-1, action: configure, value_source: {kind: argument, argument_ref: agents}, may_occur_in_outcomes: [installed], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Installed launchers and profiles can be removed by the companion uninstaller.}}
        mutation_safety:
          atomicity: {per_effect_only: Each launcher and profile and startup block is written separately.}
          concurrent_invocations: {unsafe: Concurrent installers are not serialized.}
          idempotency: {idempotent: Repeating the same selection reconciles equivalent target files and startup configuration.}
          on_uncertain_completion: {verify_then_decide: Inspect reported targets before retrying.}
          partial_effects_on_failure: {possible: Earlier selected launchers may be installed before a later target fails.}
          rollback_on_failure: {unavailable: Completed earlier writes are not rolled back automatically.}
        verification: [{method: output-schema, output_ref: status}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {id: read-1, medium: repository-filesystem, access: read, system: filesystem, content: launcher and agent profile sources, formats: [python, shell, yaml], sensitivity: public, path: <repo-root>, path_match: exact}
        writes:
        - {id: write-1, medium: home-filesystem, access: configure, system: filesystem, content: launchers and profile configuration and worker directories and shell default, formats: [python, shell, toml, directory], sensitivity: user-private, path: caller-selected home and bin and assistant config paths}
        - {id: write-2, medium: stdout, access: write, content: installation status, formats: [text], sensitivity: derived-private}
    description: Install per-agent bin launcher, profile config, worker dir, and ASSISTANT_DEFAULT
      for the given agents.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --repo-root
        - --agents
        - --home
        - --bin-dir
        - --codex-home
        - --claude-home
        - --shell-rc
        - --default-llm
        - --dry-run
        flag_patterns:
          --agents: ^.*$
          --bin-dir: ^.+$
          --claude-home: ^.+$
          --codex-home: ^.+$
          --default-llm: ^(claude|codex)$
          --home: ^.+$
          --repo-root: ^.+$
          --shell-rc: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --repo-root
    usage: --repo-root DIR --agents LIST [--home DIR] [--bin-dir DIR] [--codex-home
      DIR] [--claude-home DIR] [--shell-rc FILE] [--default-llm {claude,codex}] [--dry-run]
    version: 2
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces:
- interface: common.interface.toml-io
  version: 1
version: 1
