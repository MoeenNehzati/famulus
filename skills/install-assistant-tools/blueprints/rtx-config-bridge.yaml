content:
- _rtx/_config_bridge\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: install-assistant-tools.source.rtx-init
  version: 1
description: Links Claude and Codex configuration directories to a development checkout and installs repository hook configuration where supported.
gateway:
  language: Python
  path: _rtx/_config_bridge.py
id: install-assistant-tools.source.rtx-config-bridge
interfaces:
  install-assistant-tools.source.rtx-config-bridge.interface.scripts-dev-link:
    contract:
      arguments:
        repo-root: {description: Explicit live AI repository checkout to link., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
        options: {description: Optional home and host-config and shell paths plus skip-host and dry-run choices., required: false, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Non-dry-run execution replaces eligible host configuration paths with links and configures repository hooks.
      outputs:
      - {id: status, audience: both, description: Ordered bridge actions or dry-run plan., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: null}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: linked, class: success, outputs: [status], effects: [bridge-state], caller_action: Verify the reported host links and Git hook configuration.}
      - {id: planned, class: no-op, outputs: [status], effects: [], caller_action: Review the dry-run actions.}
      - {id: refused, class: refusal, outputs: [], effects: [], caller_action: Resolve a conflicting non-link host path before retrying.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Repository and host path state is checked immediately before each action.}
        effects:
        - {id: bridge-state, direct_io_ref: write-1, action: configure, value_source: {kind: argument, argument_ref: repo-root}, may_occur_in_outcomes: [linked], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: The links and shell block and Git hook setting can be removed by the uninstaller.}}
        mutation_safety:
          atomicity: {per_effect_only: Links and shell configuration and Git hook configuration are applied separately.}
          concurrent_invocations: {unsafe: Concurrent bridge operations are not serialized.}
          idempotency: {idempotent: Repeating against the same checkout reconciles equivalent links and configuration.}
          on_uncertain_completion: {verify_then_decide: Inspect the reported links and Git hooksPath before retrying.}
          partial_effects_on_failure: {possible: Some host links or settings may be applied before a later conflict.}
          rollback_on_failure: {unavailable: Earlier successful effects are not rolled back automatically.}
        verification: [{method: output-schema, output_ref: status}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {id: read-1, medium: repository-filesystem, access: read, system: filesystem, content: live assistant configuration and hooks, formats: [directory, json, toml, shell], sensitivity: user-private, path: <repo-root>, path_match: exact}
        writes:
        - {id: write-1, medium: home-filesystem, access: configure, system: filesystem, content: Claude and Codex configuration links and shell environment and Git hook setting, formats: [symlink, shell, git-config], sensitivity: user-private, path: caller-selected host configuration and shell paths}
        - {id: write-2, medium: stdout, access: write, content: bridge status, formats: [text], sensitivity: derived-private}
    description: Symlink Claude/Codex config dirs to a live repo checkout, register
      dev-mode hooks, set git hooksPath, export $AI. Requires an explicit repo path.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --repo-root
        - --home
        - --claude-home
        - --codex-home
        - --shell-rc
        - --no-claude
        - --no-codex
        - --dry-run
        flag_patterns:
          --claude-home: ^.+$
          --codex-home: ^.+$
          --home: ^.+$
          --repo-root: ^.+$
          --shell-rc: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --repo-root
    usage: --repo-root DIR [--no-claude] [--no-codex] [--home DIR] [--claude-home
      DIR] [--codex-home DIR] [--shell-rc FILE] [--dry-run]
    version: 2
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: binary
  name: git
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Configures repository hook settings during development installs.
  version: any
schema_version: 4
uses_interfaces:
- interface: common.interface.codex-toml
  version: 1
- interface: common.interface.toml-io
  version: 1
version: 1
