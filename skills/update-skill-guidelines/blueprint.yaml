authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: skill-making-development-assistant
children:
  update-skill-guidelines-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:SKILL\.md|agents/openai\.yaml)
description: Maintains the canonical skill-writing standard, its generated view, and
  the mechanical skill-hook enforcement that must remain aligned with it.
discovery:
  mechanism: skill
exports:
  update-skill-guidelines.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: update-skill-guidelines.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: update-skill-guidelines
kind: maintenance
namespace_exports: {}
node_type: module
role: meta-skill
schema_version: 5
sources:
  update-skill-guidelines.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
