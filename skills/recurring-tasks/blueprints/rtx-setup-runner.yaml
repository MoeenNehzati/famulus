content:
- _rtx/_setup_runner\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-ensure-agent-env.yaml
  reason: Imports Python source from _rtx/_ensure_agent_env.py.
  source: recurring-tasks.source.rtx-ensure-agent-env
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-healthcheck-probe.yaml
  reason: Installs a cron entry that executes the healthcheck probe gateway.
  source: recurring-tasks.source.rtx-healthcheck-probe
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: recurring-tasks.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-schedule-backend-init.yaml
  reason: Imports Python source from _rtx/_schedule_backend/__init__.py.
  source: recurring-tasks.source.rtx-schedule-backend-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-unit-writer.yaml
  reason: Imports Python source from _rtx/_unit_writer.py.
  source: recurring-tasks.source.rtx-unit-writer
  version: 1
description: Performs host setup by ensuring agent environment, syncing scheduler entries, installing the healthcheck cron entry, and reporting status.
gateway:
  language: Python
  path: _rtx/_setup_runner.py
id: recurring-tasks.source.rtx-setup-runner
interfaces:
  recurring-tasks.source.rtx-setup-runner.interface.scripts-setup:
    contract:
      arguments:
        migrate-cron: {description: Remove obsolete ai-recurring cron lines before installing the healthcheck entry, required: false, default: false, sensitivity: public, type: {kind: flag}}
        unit-dir: {description: Optional scheduler-entry directory passed through to synchronization, required: false, default: '', sensitivity: user-private, type: {kind: string}}
        jobs-file: {description: Optional jobs YAML path passed through to synchronization, required: false, default: jobs.yaml, sensitivity: user-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Configures the agent environment native scheduler entries and a recurring healthcheck cron line.
      outputs:
      - {id: report, audience: both, description: Setup progress followed by active native scheduler status, direct_io_ref: write-4, type: {kind: string}, cardinality: {minimum: 1, maximum: null}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Prerequisite and setup headings are always printed.}
      outcomes:
      - {id: configured, class: success, outputs: [report], effects: [configure-environment, sync-scheduler, install-healthcheck], caller_action: Use the reported scheduler status to confirm active jobs.}
      - {id: failed, class: error, outputs: [], effects: [configure-environment, sync-scheduler, install-healthcheck], caller_action: Inspect each setup stage and repair partial host state before retrying.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Applies setup sequentially against current host environment scheduler and crontab state.}
        effects:
        - {id: configure-environment, direct_io_ref: write-1, action: configure, value_source: {kind: direct-io, direct_io_ref: write-1}, may_occur_in_outcomes: [configured, failed], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: Restore or remove the installed agent environment setting.}}
        - {id: sync-scheduler, direct_io_ref: write-2, action: configure, value_source: {kind: direct-io, direct_io_ref: read-1}, may_occur_in_outcomes: [configured, failed], confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}, reversibility: {reversible: Restore jobs.yaml and synchronize again.}}
        - {id: install-healthcheck, direct_io_ref: write-3, action: configure, value_source: {kind: argument, argument_ref: migrate-cron}, may_occur_in_outcomes: [configured, failed], confirmation_evidence: {kind: direct-io, direct_io_ref: write-3}, reversibility: {reversible: Remove the marked healthcheck line from the user crontab.}}
        mutation_safety:
          atomicity: {non_atomic: Environment scheduler and crontab changes occur in separate stages.}
          concurrent_invocations: {unsafe: Concurrent setup calls can race on scheduler entries and crontab content.}
          idempotency: {idempotent: Repeating with unchanged inputs converges to one healthcheck entry and matching scheduler state.}
          on_uncertain_completion: {verify_then_decide: Inspect environment scheduler and crontab state before retrying.}
          partial_effects_on_failure: {possible: Earlier setup stages remain applied if a later stage fails.}
          rollback_on_failure: {unavailable: The interface does not roll back completed setup stages automatically.}
        verification: [{method: output-schema, output_ref: report}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {access: read, content: config, formats: [yaml], id: read-1, medium: local-filesystem, path: jobs.yaml, path_match: exact, sensitivity: user-private, system: filesystem}
        - {access: read, content: scheduler-config, formats: [text], id: read-2, medium: local-system, sensitivity: user-private, system: crontab}
        writes:
        - {access: configure, content: config, formats: [text], id: write-1, medium: local-system, sensitivity: user-private, system: agent-environment}
        - {access: configure, content: scheduler-config, formats: [text], id: write-2, medium: local-system, sensitivity: user-private, system: native-scheduler}
        - {access: configure, content: scheduler-config, formats: [text], id: write-3, medium: local-system, sensitivity: user-private, system: crontab}
        - {access: write, content: response, formats: [text], id: write-4, medium: stdout, sensitivity: derived-private}
    description: Verify prerequisites, sync native scheduler entries from jobs.yaml,
      install recurring health checks, and list active timers/tasks.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        name: owner
    usage: '[--migrate-cron]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: binary
  name: crontab
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Installs the recurring healthcheck cron entry.
  version: any
- kind: binary
  name: launchctl
  platforms:
    linux: false
    macos: true
    windows: false
  reason: Lists and manages generated user scheduler entries.
  version: any
- kind: binary
  name: schtasks
  platforms:
    linux: false
    macos: false
    windows: true
  reason: Lists and manages generated user scheduler entries.
  version: any
- kind: binary
  name: systemctl
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Lists and manages generated user timers.
  version: any
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Validates that jobs.yaml tooling can load YAML.
  version: '>=6'
- kind: system-service
  name: launchd
  platforms:
    linux: false
    macos: true
    windows: false
  reason: Provides the per-user scheduler configured during setup.
  version: any
- kind: system-service
  name: systemd-user
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Provides the user timer manager configured during setup.
  version: any
- kind: system-service
  name: task-scheduler
  platforms:
    linux: false
    macos: false
    windows: true
  reason: Provides the per-user scheduler configured during setup.
  version: any
schema_version: 4
uses_interfaces: []
version: 1
