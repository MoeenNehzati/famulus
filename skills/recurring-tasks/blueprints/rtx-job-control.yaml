content:
- _rtx/_job_control\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/jobs-config.yaml
  reason: Reads and mutates the shared jobs configuration.
  source: recurring-tasks.source.jobs-config
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: recurring-tasks.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-schedule-backend-init.yaml
  reason: Imports Python source from _rtx/_schedule_backend/__init__.py.
  source: recurring-tasks.source.rtx-schedule-backend-init
  version: 1
description: Implements enable, disable, immediate-run, status, and log-view operations for configured recurring jobs.
gateway:
  language: Python
  path: _rtx/_job_control.py
id: recurring-tasks.source.rtx-job-control
interfaces:
  recurring-tasks.source.rtx-job-control.interface.scripts-disable:
    contract:
      arguments:
        name: {description: Configured job name to disable, required: true, sensitivity: user-private, type: {kind: string}}
        jobs-file: {description: Optional jobs YAML path used for testing or an alternate configuration, required: false, default: jobs.yaml, sensitivity: user-private, type: {kind: string}}
        no-sync: {description: Skip native scheduler reconciliation after editing jobs YAML, required: false, default: false, sensitivity: public, type: {kind: flag}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Rewrites jobs YAML and normally removes or disables native scheduler entries.
      outputs:
      - {id: result, audience: both, description: Confirmation of the disabled job, direct_io_ref: write-3, type: {kind: string}, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A confirmation line is printed on success.}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-4, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: disabled, class: success, outputs: [result], effects: [write-jobs, sync-scheduler], caller_action: Treat the job as disabled.}
      - {id: disabled-no-sync, class: partial, outputs: [result], effects: [write-jobs], caller_action: Run scheduler sync before relying on native state.}
      - {id: not-found, class: error, outputs: [diagnostic], effects: [], caller_action: Check jobs.yaml for the requested name.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Loads the selected jobs file before changing the matching enabled flag.}
        effects:
        - {id: write-jobs, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: name}, may_occur_in_outcomes: [disabled, disabled-no-sync], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: Enable the same job again.}}
        - {id: sync-scheduler, direct_io_ref: write-2, action: configure, value_source: {kind: argument, argument_ref: name}, may_occur_in_outcomes: [disabled], confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}, reversibility: {reversible: Enable and resync the same job.}}
        mutation_safety:
          atomicity: {non_atomic: jobs.yaml is written before native scheduler reconciliation.}
          concurrent_invocations: {unsafe: Concurrent job edits can overwrite YAML or scheduler state.}
          idempotency: {idempotent: Repeated disable calls converge to disabled state when the job remains present.}
          on_uncertain_completion: {verify_then_decide: Inspect jobs.yaml and native scheduler state before retrying.}
          partial_effects_on_failure: {possible: YAML can be updated when scheduler sync later fails.}
          rollback_on_failure: {unavailable: The interface does not automatically restore prior YAML.}
        verification: [{method: output-schema, output_ref: result}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {access: read, content: config, formats: [yaml], id: read-1, medium: local-filesystem, path: jobs.yaml, path_match: exact, sensitivity: user-private, system: filesystem}
        writes:
        - {access: write, content: config, formats: [yaml], id: write-1, medium: local-filesystem, path: jobs.yaml, path_match: exact, sensitivity: user-private, system: filesystem}
        - {access: configure, content: scheduler-config, formats: [text], id: write-2, medium: local-system, sensitivity: user-private, system: native-scheduler}
        - {access: write, content: response, formats: [text], id: write-3, medium: stdout, sensitivity: derived-private}
        - {access: write, content: diagnostic-report, formats: [text], id: write-4, medium: stderr, sensitivity: derived-private}
    description: 'Disable a job by setting enabled: false in jobs.yaml and syncing
      native scheduler entries.'
    process_binding:
      args_prefix:
      - disable
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --jobs-file
        - --no-sync
        flag_patterns:
          --jobs-file: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <name>
    version: 1
  recurring-tasks.source.rtx-job-control.interface.scripts-enable:
    contract:
      arguments:
        name: {description: Configured job name to enable, required: true, sensitivity: user-private, type: {kind: string}}
        jobs-file: {description: Optional jobs YAML path used for testing or an alternate configuration, required: false, default: jobs.yaml, sensitivity: user-private, type: {kind: string}}
        no-sync: {description: Skip native scheduler reconciliation after editing jobs YAML, required: false, default: false, sensitivity: public, type: {kind: flag}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Rewrites jobs YAML and normally creates and starts native scheduler entries.
      outputs:
      - {id: result, audience: both, description: Confirmation of the enabled job, direct_io_ref: write-3, type: {kind: string}, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A confirmation line is printed on success.}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-4, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: enabled, class: success, outputs: [result], effects: [write-jobs, sync-scheduler], caller_action: Treat the job as enabled.}
      - {id: enabled-no-sync, class: partial, outputs: [result], effects: [write-jobs], caller_action: Run scheduler sync before relying on native state.}
      - {id: not-found, class: error, outputs: [diagnostic], effects: [], caller_action: Check jobs.yaml for the requested name.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Loads the selected jobs file before changing the matching enabled flag.}
        effects:
        - {id: write-jobs, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: name}, may_occur_in_outcomes: [enabled, enabled-no-sync], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: Disable the same job again.}}
        - {id: sync-scheduler, direct_io_ref: write-2, action: configure, value_source: {kind: argument, argument_ref: name}, may_occur_in_outcomes: [enabled], confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}, reversibility: {reversible: Disable and resync the same job.}}
        mutation_safety:
          atomicity: {non_atomic: jobs.yaml is written before native scheduler reconciliation.}
          concurrent_invocations: {unsafe: Concurrent job edits can overwrite YAML or scheduler state.}
          idempotency: {idempotent: Repeated enable calls converge to enabled state when the job remains present.}
          on_uncertain_completion: {verify_then_decide: Inspect jobs.yaml and native scheduler state before retrying.}
          partial_effects_on_failure: {possible: YAML can be updated when scheduler sync later fails.}
          rollback_on_failure: {unavailable: The interface does not automatically restore prior YAML.}
        verification: [{method: output-schema, output_ref: result}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {access: read, content: config, formats: [yaml], id: read-1, medium: local-filesystem, path: jobs.yaml, path_match: exact, sensitivity: user-private, system: filesystem}
        writes:
        - {access: write, content: config, formats: [yaml], id: write-1, medium: local-filesystem, path: jobs.yaml, path_match: exact, sensitivity: user-private, system: filesystem}
        - {access: configure, content: scheduler-config, formats: [text], id: write-2, medium: local-system, sensitivity: user-private, system: native-scheduler}
        - {access: write, content: response, formats: [text], id: write-3, medium: stdout, sensitivity: derived-private}
        - {access: write, content: diagnostic-report, formats: [text], id: write-4, medium: stderr, sensitivity: derived-private}
    description: 'Enable a job by setting enabled: true in jobs.yaml and syncing native
      scheduler entries.'
    process_binding:
      args_prefix:
      - enable
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --jobs-file
        - --no-sync
        flag_patterns:
          --jobs-file: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <name>
    version: 1
  recurring-tasks.source.rtx-job-control.interface.scripts-status:
    contract:
      arguments: {}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - {id: status, audience: both, description: Native scheduler status text for recurring jobs, direct_io_ref: write-1, type: {kind: string}, cardinality: {minimum: 0, maximum: null}, ordering: unspecified, pagination: {kind: none}, truncation: {kind: none}, empty: No text is printed when the backend reports no entries.}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: reported, class: success, outputs: [status], effects: [], caller_action: Use the native status to assess scheduled jobs.}
      - {id: failed, class: error, outputs: [diagnostic], effects: [], caller_action: Report the backend failure.}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: Queries native scheduler state during this invocation.}
        verification: [{method: output-schema, output_ref: status}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {access: read, content: scheduler-status, formats: [text], id: read-1, medium: local-system, sensitivity: derived-private, system: native-scheduler}
        writes:
        - {access: write, content: scheduler-status, formats: [text], id: write-1, medium: stdout, sensitivity: derived-private}
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
    description: List active recurring scheduler entries, next fire times, and service
      status.
    process_binding:
      args_prefix:
      - status
      entry: Interface
      kind: process
      patterns:
      - max_positionals: 0
        min_positionals: 0
        name: owner
    usage: ''
    version: 1
  recurring-tasks.source.rtx-job-control.interface.scripts-test:
    contract:
      arguments:
        name: {description: Configured job name to trigger through the native scheduler, required: true, sensitivity: user-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Starts the configured job immediately through the native scheduler.
      outputs:
      - {id: result, audience: both, description: Pass or fail message from the immediate scheduler trigger, direct_io_ref: write-2, type: {kind: string}, cardinality: {minimum: 1, maximum: null}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A pass or fail line is always printed.}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-3, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: passed, class: success, outputs: [result], effects: [start-job], caller_action: Treat the immediate scheduler run as successful.}
      - {id: failed, class: error, outputs: [result], effects: [start-job], caller_action: Inspect service and run logs.}
      - {id: execution-error, class: error, outputs: [diagnostic], effects: [start-job], caller_action: Report the scheduler exception and inspect native scheduler state before retrying.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Requests an immediate native scheduler run and waits for the backend command result.}
        effects:
        - {id: start-job, direct_io_ref: write-1, action: execute, value_source: {kind: argument, argument_ref: name}, may_occur_in_outcomes: [passed, failed, execution-error], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {irreversible: Work already performed by the started job cannot be recalled generically.}}
        mutation_safety:
          atomicity: {per_effect_only: One scheduler start request is issued.}
          concurrent_invocations: {unsafe: Multiple calls may overlap executions of the same job.}
          idempotency: {non_idempotent: Repeating the call starts another job run.}
          on_uncertain_completion: {verify_then_decide: Inspect scheduler and run-log state before retrying.}
          partial_effects_on_failure: {possible: The job may start even when status collection fails.}
          rollback_on_failure: {unavailable: The interface has no generic compensation for job work.}
        verification: [{method: output-schema, output_ref: result}]
      helpers: []
      direct_io:
        network: []
        reads: []
        writes:
        - {access: execute, content: recurring-job, formats: [text], id: write-1, medium: local-system, sensitivity: user-private, system: native-scheduler}
        - {access: write, content: response, formats: [text], id: write-2, medium: stdout, sensitivity: derived-private}
        - {access: write, content: diagnostic-report, formats: [text], id: write-3, medium: stderr, sensitivity: derived-private}
    description: Trigger a job immediately through the native scheduler, show output
      and status.
    process_binding:
      args_prefix:
      - test
      entry: Interface
      kind: process
      patterns:
      - max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <name>
    version: 1
  recurring-tasks.source.rtx-job-control.interface.scripts-view-logs:
    contract:
      arguments:
        job-name: {description: Configured job whose run log should be shown, required: true, sensitivity: user-private, type: {kind: string}}
        lines: {description: Maximum trailing lines to print, required: false, default: 50, sensitivity: public, type: {kind: integer, minimum: 1, unit: count}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - {id: log-tail, audience: both, description: Requested tail of the job run log or a no-log message, direct_io_ref: write-1, type: {kind: string, sensitivity: user-private}, cardinality: {minimum: 1, maximum: null}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A no-log message is printed when the file is absent.}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: shown, class: success, outputs: [log-tail], effects: [], caller_action: Use the lines for diagnosis.}
      - {id: absent, class: no-op, outputs: [log-tail], effects: [], caller_action: Confirm whether the job has ever run.}
      - {id: failed, class: error, outputs: [diagnostic], effects: [], caller_action: Report the log read failure.}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: Reads the selected log once and prints its trailing lines.}
        verification: [{method: output-schema, output_ref: log-tail}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {access: read, content: log, formats: [text], id: read-1, medium: local-filesystem, path: logs/*/run.log, path_match: glob, sensitivity: user-private, system: filesystem}
        writes:
        - {access: write, content: log, formats: [text], id: write-1, medium: stdout, sensitivity: user-private}
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
    description: Tail the run log for a job (default 50 lines).
    process_binding:
      args_prefix:
      - view-logs
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --lines
        flag_patterns:
          --lines: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <job-name> [--lines N]
    version: 1
