content:
- SKILL\.md
dependencies: []
description: Owns the LLM-facing instructions for managing and diagnosing recurring
  assistant jobs.
gateway:
  language: Markdown
  path: SKILL.md
id: recurring-tasks.source.gateway
interfaces:
  recurring-tasks.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: User request to define, manage, inspect, or diagnose recurring
            jobs.
          required: true
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: Management workflows can change jobs.yaml and host scheduler
          state through separately declared interfaces.
      direct_io:
        network: []
        reads:
        - access: read
          content: request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          live: The response reflects scheduler state observed during this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the reported result.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Report the failed scheduler operation without claiming success.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Markdown guidance or operation result produced by the skill workflow.
        direct_io_ref: write-1
        empty: The interface always returns a response.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: install-assistant-tools.interface.default
  version: 2
- interface: recurring-tasks._rtx.interface.scripts-disable
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-enable
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-ensure-agent-env
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-healthcheck
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-setup
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-status
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-sync
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-test
  version: 1
- interface: recurring-tasks._rtx.interface.scripts-view-logs
  version: 1
version: 1
