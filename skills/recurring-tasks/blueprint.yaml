    path: _rtx/blueprint.yaml
content:
- (?:\.gitignore|SKILL\.md|lessons/2026\-07\-06\.md|skill\.mmd)
description: Defines, installs, controls, and health-checks recurring assistant jobs
  through the host's native per-user scheduler.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - task-automation
    - system-maintenance
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  - scheduled-job
  persistent_modifier: false
