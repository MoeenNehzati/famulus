authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:\.gitignore|SKILL\.md|lessons/2026\-07\-06\.md)
description: Defines, installs, controls, and health-checks recurring assistant jobs
  through the host's native per-user scheduler.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - task-automation
    - system-maintenance
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  - scheduled-job
  persistent_modifier: false
exports:
  recurring-tasks.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: recurring-tasks.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: recurring-tasks
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        recurring-tasks._rtx.interface.scripts-disable: 1
        recurring-tasks._rtx.interface.scripts-enable: 1
        recurring-tasks._rtx.interface.scripts-healthcheck: 1
        recurring-tasks._rtx.interface.scripts-remove-context: 1
        recurring-tasks._rtx.interface.scripts-setup: 1
        recurring-tasks._rtx.interface.scripts-status: 1
        recurring-tasks._rtx.interface.scripts-sync: 1
        recurring-tasks._rtx.interface.scripts-test: 1
        recurring-tasks._rtx.interface.scripts-view-logs: 1
    interface_access:
      recurring-tasks._rtx.interface.scripts-disable:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-enable:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-healthcheck:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-remove-context:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-setup:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-status:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-sync:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-test:
        allow_all_modules: false
        allowed_callers: []
      recurring-tasks._rtx.interface.scripts-view-logs:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  recurring-tasks.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 3
maturity: experimental
installation_tier: core
personal_preference:
  applies: false
