jobs:
- name: email-triage
  description: Triage new emails into todo and triage lists
  command: ASSISTANT_DEFAULT=codex invoke-skill email-triage
  schedule: 0 */3 * * *
  enabled: true
  # email-triage's own scripts (_watermark_floor.py, _watermark_writer.py,
  # _failure_clearer.py) write state/status.json with result: ok|error|warning
  # as part of their existing watermark-safety mechanism, so its success can
  # be checked beyond a bare exit code.
  success:
    require_inner_status: ok
    ignore_exit_codes: [1]
    ignore_exit_log_patterns:
      - "You've hit your usage limit"
      - "Please try again"
- name: daily-plan
  description: Generate or show today's daily plan, including potential-actions triage
  command: invoke-skill daily-plan
  schedule: 0 7 * * *
  enabled: true
  # daily-plan now self-reports: _plan_storage writes state/status.json with
  # result: ok when a plan is actually persisted, which is the job's real
  # deliverable. Exit code alone was not enough -- the agent CLI exits 0 even
  # when it accomplishes nothing, so runs that could not reach the skill's
  # interfaces at all recorded success:true for days while producing no plan.
  # read_inner_status scopes the file to the current run, so a previous day's
  # status cannot vouch for a run that never wrote its own.
  success:
    require_inner_status: ok
- name: llm-wakeup
  description: Deliver any wakeups that have come due
  command: launch.py -m officina.wakeup.cli run-due
  schedule: '*/10 * * * *'
  enabled: true
  # No success block: this job is a deterministic script, not an agent
  # session, so its exit code already means what it says. The rule in
  # SKILL.md applies to agent-driven jobs, which exit 0 regardless of
  # whether they accomplished anything.

