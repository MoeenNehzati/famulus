content:
- _setup_runner\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-managed-control.yaml
  reason: Delegates setup through the recurring-owned command helper.
  source: recurring-tasks._rtx.source.rtx-managed-control
  version: 1
description: Captures caller-selected Python and plugin values in recurring-owned setup.
gateway:
  language: Python
  path: _setup_runner.py
id: recurring-tasks._rtx.source.rtx-setup-runner
interfaces:
  recurring-tasks._rtx.source.rtx-setup-runner.interface.scripts-setup:
    content:
    - _setup_runner\.py
    uses_interfaces:
    - interface: recurring.interface.control
      version: 1
    contract:
      arguments:
        canonical-python:
          description: Canonical absolute executable returned by the complete Task 2 fingerprint procedure.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        plugin-root:
          description: Absolute root of the current host-selected Famulus plugin implementation.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
      caller_warnings:
      - external-side-effect: Writes recurring-owned descriptor and jobs state and reconciles the one shared native scheduler set and healthcheck sentinel.
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: jobs.yaml
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: scheduler-config
          formats:
          - text
          id: read-2
          medium: local-system
          sensitivity: user-private
          system: crontab
        writes:
        - access: configure
          content: recurring descriptor and jobs state
          formats:
          - json
          - yaml
          id: write-1
          medium: local-filesystem
          sensitivity: user-private
          system: filesystem
        - access: configure
          content: scheduler-config
          formats:
          - text
          id: write-2
          medium: local-system
          sensitivity: user-private
          system: native-scheduler
        - access: configure
          content: scheduler-config
          formats:
          - text
          id: write-3
          medium: local-system
          sensitivity: user-private
          system: crontab
        - access: write
          content: response
          formats:
          - text
          id: write-4
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          live: Applies caller-selected Python and plugin values to durable recurring state and current scheduler state.
        effects:
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: configure-recurring
          may_occur_in_outcomes:
          - configured
          - failed
          reversibility:
            reversible: Rerun setup with the intended selected Python and plugin root.
          value_source:
            argument_ref: canonical-python
            kind: argument
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: sync-scheduler
          may_occur_in_outcomes:
          - configured
          - failed
          reversibility:
            reversible: Restore jobs.yaml and synchronize again.
          value_source:
            direct_io_ref: read-1
            kind: direct-io
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-3
            kind: direct-io
          direct_io_ref: write-3
          id: install-healthcheck
          may_occur_in_outcomes:
          - configured
          - failed
          reversibility:
            reversible: Owner-checked recurring teardown removes the managed sentinel.
          value_source:
            argument_ref: plugin-root
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: Environment scheduler and crontab changes occur in separate
              stages.
          concurrent_invocations:
            unsafe: Concurrent setup calls can race on scheduler entries and crontab
              content.
          idempotency:
            idempotent: Repeating with unchanged inputs converges to one shared healthcheck entry and matching scheduler state.
          on_uncertain_completion:
            verify_then_decide: Inspect environment scheduler and crontab state before
              retrying.
          partial_effects_on_failure:
            possible: Earlier setup stages remain applied if a later stage fails.
          rollback_on_failure:
            unavailable: The interface does not roll back completed setup stages automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: report
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the reported scheduler status to confirm active jobs.
        class: success
        effects:
        - configure-recurring
        - sync-scheduler
        - install-healthcheck
        id: configured
        outputs:
        - report
      - caller_action: Inspect each setup stage and repair partial host state before
          retrying.
        class: error
        effects:
        - configure-recurring
        - sync-scheduler
        - install-healthcheck
        id: failed
        outputs: []
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Setup progress followed by active native scheduler status
        direct_io_ref: write-4
        empty: Prerequisite and setup headings are always printed.
        id: report
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Capture the selected Python and plugin root, initialize recurring-owned state without default jobs, and reconcile the shared scheduler set.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --canonical-python
        - --plugin-root
        required_flags:
        - --canonical-python
        - --plugin-root
        flag_patterns:
          --canonical-python: ^.+$
          --plugin-root: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
    usage: --canonical-python FILE --plugin-root DIR
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: binary
  name: crontab
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Installs the recurring healthcheck cron entry.
  version: any
- kind: binary
  name: launchctl
  platforms:
    linux: false
    macos: true
    windows: false
  reason: Lists and manages generated user scheduler entries.
  version: any
- kind: binary
  name: schtasks
  platforms:
    linux: false
    macos: false
    windows: true
  reason: Lists and manages generated user scheduler entries.
  version: any
- kind: binary
  name: systemctl
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Lists and manages generated user timers.
  version: any
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Validates that jobs.yaml tooling can load YAML.
  version: '>=6'
- kind: system-service
  name: launchd
  platforms:
    linux: false
    macos: true
    windows: false
  reason: Provides the per-user scheduler configured during setup.
  version: any
- kind: system-service
  name: systemd-user
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Provides the user timer manager configured during setup.
  version: any
- kind: system-service
  name: task-scheduler
  platforms:
    linux: false
    macos: false
    windows: true
  reason: Provides the per-user scheduler configured during setup.
  version: any
schema_version: 6
uses_interfaces:
- interface: recurring.interface.control
  version: 1
version: 1
maturity: experimental
