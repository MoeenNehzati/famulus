content:
- _setup_runner\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-ensure-agent-env.yaml
  reason: Imports Python source from _rtx/_ensure_agent_env.py.
  source: recurring-tasks-rtx.source.rtx-ensure-agent-env
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-healthcheck-probe.yaml
  reason: Installs a cron entry that executes the healthcheck probe gateway.
  source: recurring-tasks-rtx.source.rtx-healthcheck-probe
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: recurring-tasks-rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-schedule-backend-init.yaml
  reason: Imports Python source from _rtx/_schedule_backend/__init__.py.
  source: recurring-tasks-rtx.source.rtx-schedule-backend-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-unit-writer.yaml
  reason: Imports Python source from _rtx/_unit_writer.py.
  source: recurring-tasks-rtx.source.rtx-unit-writer
  version: 1
description: Performs host setup by ensuring agent environment, syncing scheduler
  entries, installing the healthcheck cron entry, and reporting status.
gateway:
  language: Python
  path: _setup_runner.py
id: recurring-tasks-rtx.source.rtx-setup-runner
interfaces:
  recurring-tasks-rtx.source.rtx-setup-runner.interface.scripts-setup:
    contract:
      arguments:
        jobs-file:
          default: jobs.yaml
          description: Optional jobs YAML path passed through to synchronization
          required: false
          sensitivity: user-private
          type:
            kind: string
        migrate-cron:
          default: false
          description: Remove obsolete ai-recurring cron lines before installing the
            healthcheck entry
          required: false
          sensitivity: public
          type:
            kind: flag
        unit-dir:
          default: ''
          description: Optional scheduler-entry directory passed through to synchronization
          required: false
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: Configures the agent environment native scheduler entries
          and a recurring healthcheck cron line.
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: jobs.yaml
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: scheduler-config
          formats:
          - text
          id: read-2
          medium: local-system
          sensitivity: user-private
          system: crontab
        writes:
        - access: configure
          content: config
          formats:
          - text
          id: write-1
          medium: local-system
          sensitivity: user-private
          system: agent-environment
        - access: configure
          content: scheduler-config
          formats:
          - text
          id: write-2
          medium: local-system
          sensitivity: user-private
          system: native-scheduler
        - access: configure
          content: scheduler-config
          formats:
          - text
          id: write-3
          medium: local-system
          sensitivity: user-private
          system: crontab
        - access: write
          content: response
          formats:
          - text
          id: write-4
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          live: Applies setup sequentially against current host environment scheduler
            and crontab state.
        effects:
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: configure-environment
          may_occur_in_outcomes:
          - configured
          - failed
          reversibility:
            reversible: Restore or remove the installed agent environment setting.
          value_source:
            direct_io_ref: write-1
            kind: direct-io
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: sync-scheduler
          may_occur_in_outcomes:
          - configured
          - failed
          reversibility:
            reversible: Restore jobs.yaml and synchronize again.
          value_source:
            direct_io_ref: read-1
            kind: direct-io
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-3
            kind: direct-io
          direct_io_ref: write-3
          id: install-healthcheck
          may_occur_in_outcomes:
          - configured
          - failed
          reversibility:
            reversible: Remove the marked healthcheck line from the user crontab.
          value_source:
            argument_ref: migrate-cron
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: Environment scheduler and crontab changes occur in separate
              stages.
          concurrent_invocations:
            unsafe: Concurrent setup calls can race on scheduler entries and crontab
              content.
          idempotency:
            idempotent: Repeating with unchanged inputs converges to one healthcheck
              entry and matching scheduler state.
          on_uncertain_completion:
            verify_then_decide: Inspect environment scheduler and crontab state before
              retrying.
          partial_effects_on_failure:
            possible: Earlier setup stages remain applied if a later stage fails.
          rollback_on_failure:
            unavailable: The interface does not roll back completed setup stages automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: report
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the reported scheduler status to confirm active jobs.
        class: success
        effects:
        - configure-environment
        - sync-scheduler
        - install-healthcheck
        id: configured
        outputs:
        - report
      - caller_action: Inspect each setup stage and repair partial host state before
          retrying.
        class: error
        effects:
        - configure-environment
        - sync-scheduler
        - install-healthcheck
        id: failed
        outputs: []
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Setup progress followed by active native scheduler status
        direct_io_ref: write-4
        empty: Prerequisite and setup headings are always printed.
        id: report
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Verify prerequisites, sync native scheduler entries from jobs.yaml,
      install recurring health checks, and list active timers/tasks.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        name: owner
    usage: '[--migrate-cron]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: binary
  name: crontab
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Installs the recurring healthcheck cron entry.
  version: any
- kind: binary
  name: launchctl
  platforms:
    linux: false
    macos: true
    windows: false
  reason: Lists and manages generated user scheduler entries.
  version: any
- kind: binary
  name: schtasks
  platforms:
    linux: false
    macos: false
    windows: true
  reason: Lists and manages generated user scheduler entries.
  version: any
- kind: binary
  name: systemctl
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Lists and manages generated user timers.
  version: any
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Validates that jobs.yaml tooling can load YAML.
  version: '>=6'
- kind: system-service
  name: launchd
  platforms:
    linux: false
    macos: true
    windows: false
  reason: Provides the per-user scheduler configured during setup.
  version: any
- kind: system-service
  name: systemd-user
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Provides the user timer manager configured during setup.
  version: any
- kind: system-service
  name: task-scheduler
  platforms:
    linux: false
    macos: false
    windows: true
  reason: Provides the per-user scheduler configured during setup.
  version: any
schema_version: 5
uses_interfaces: []
version: 1
