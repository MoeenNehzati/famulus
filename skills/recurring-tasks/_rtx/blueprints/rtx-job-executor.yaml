content:
- _job_executor\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-jobs-config.yaml
  reason: Imports the shared validated jobs configuration loader.
  source: recurring-tasks._rtx.source.rtx-jobs-config
  version: 1
- blueprint:
    base: module-root
    path: blueprints/jobs-config.yaml
  reason: Loads the recurring job definition selected from the shared jobs configuration.
  source: recurring-tasks._rtx.source.jobs-config
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: recurring-tasks._rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-run-record.yaml
  reason: Evaluates the job's success contract from its exit code and self-reported
    inner status, and persists the resulting run record.
  source: recurring-tasks._rtx.source.rtx-run-record
  version: 1
description: Loads one named recurring-job definition, parses its command into environment
  assignments and argv, executes it without a shell between run-boundary markers,
  appends combined output to the job's run log, and writes a run record recording
  whether the job's declared success contract (not just its exit code) was actually
  met.
gateway:
  language: Python
  path: _job_executor.py
id: recurring-tasks._rtx.source.rtx-job-executor
interfaces:
  recurring-tasks._rtx.source.rtx-job-executor.interface.execute-job:
    contract:
      arguments:
        job:
          description: Exact configured job name to load and execute.
          required: true
          sensitivity: user-private
          type:
            kind: string
        jobs-file:
          description: YAML file containing the recurring job definition.
          direct_io_ref: jobs-file
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              format:
                named: yaml
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
      caller_warnings:
      - external-side-effect: Executes the command authored in the selected job definition
          with inherited process environment plus its leading environment assignments.
      - external-side-effect: Creates the per-job log directory when absent and appends
          run-boundary markers plus combined child stdout and stderr to run.log.
      - external-side-effect: Replaces the per-job logs/<job>/latest.json run record
          with the outcome of evaluating the job's success contract against its exit
          code and self-reported inner status.
      direct_io:
        network: []
        reads:
        - access: read
          content: recurring job configuration including its optional success contract
          formats:
          - yaml
          id: jobs-file
          medium: local-filesystem
          path: <jobs-file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: inherited environment and executable search path
          formats:
          - environment
          id: process-environment
          medium: local-system
          sensitivity: user-private
          system: host-process-environment
        - id: status-file
          medium: local-filesystem
          access: read
          content: job-reported inner status
          formats:
          - json
          sensitivity: derived-private
          path: <skills-root>/<job>/state/status.json
          path_match: exact
          system: filesystem
        writes:
        - access: execute
          content: configured job command with environment overrides
          formats:
          - argv
          id: child-process
          medium: subprocess
          sensitivity: user-private
          system: host-process-manager
        - access: write
          content: run-boundary markers plus combined child stdout and stderr
          formats:
          - text
          id: job-log
          medium: local-filesystem
          path: logs/<job>/run.log
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - id: run-record-file
          medium: local-filesystem
          access: write
          content: job run record with process exit code, inner status, and evaluated
            success
          formats:
          - json
          sensitivity: derived-private
          path: logs/<job>/latest.json
          path_match: exact
          system: filesystem
        - access: write
          content: wrapper diagnostic
          formats:
          - text
          id: stderr
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Loads the selected job once, then executes the resulting argv
            with one environment snapshot.
        effects:
        - action: execute
          confirmation_evidence:
            direct_io_ref: child-process
            kind: direct-io
          direct_io_ref: child-process
          id: execute-job
          may_occur_in_outcomes:
          - completed
          - child-failed
          reversibility:
            irreversible: Effects performed by the configured child command are outside
              this executor's rollback control.
          value_source:
            argument_ref: job
            kind: argument
        - action: append
          confirmation_evidence:
            direct_io_ref: job-log
            kind: direct-io
          direct_io_ref: job-log
          id: append-log
          may_occur_in_outcomes:
          - completed
          - child-failed
          reversibility:
            compensatable: Remove the appended run segment manually if its retention
              is not wanted.
          value_source:
            direct_io_ref: child-process
            kind: direct-io
        - id: write-run-record
          direct_io_ref: run-record-file
          action: update
          value_source:
            kind: direct-io
            direct_io_ref: child-process
          may_occur_in_outcomes:
          - completed
          - child-failed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: run-record-file
          reversibility:
            irreversible: The previous run record is overwritten, not retained.
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: Child execution, log appends, and the run-record write are
              not one atomic transaction.
          concurrent_invocations:
            unsafe: Concurrent runs of the same job can interleave bytes in the shared
              append-only log, duplicate child effects, and race the shared run-record
              file.
          idempotency:
            non_idempotent: Repeating a call executes the configured command again,
              appends another log segment, and replaces the run record.
          on_uncertain_completion:
            verify_then_decide: Inspect the per-job log and run record, and the invoked
              job's own state, before retrying.
          partial_effects_on_failure:
            possible: The child can perform effects or write partial output before
              exiting nonzero or being interrupted.
          rollback_on_failure:
            unavailable: The executor neither reverses child effects nor truncates
              the log or run record.
        state_effect: mutating
        verification:
        - direct_io_ref: job-log
          method: direct-io-state
        - method: direct-io-state
          direct_io_ref: run-record-file
        - method: output-schema
          output_ref: diagnostic
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Treat the child process as launched and completed; check the
          written run record's success field before treating the underlying task as
          successful, since a zero exit code alone does not guarantee the job's declared
          success contract was met.
        class: success
        effects:
        - execute-job
        - append-log
        - write-run-record
        id: completed
        outputs: []
      - caller_action: Inspect the per-job run log and the returned child exit status
          before retrying.
        class: error
        effects:
        - execute-job
        - append-log
        - write-run-record
        id: child-failed
        outputs: []
      - caller_action: Correct the jobs file, requested name, command, executable
          resolution, or log path and retry.
        class: error
        effects: []
        id: config-error
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Wrapper error describing a missing job, invalid command, unreadable
          configuration, or failed launch.
        direct_io_ref: stderr
        empty: No diagnostic is emitted after a child process is successfully launched,
          including when that child exits nonzero.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions:
      - caller_action: Pass an existing readable jobs YAML file.
        check:
          direct_io_ref: jobs-file
          kind: direct-io
          predicate: readable
        description: The selected jobs YAML file must exist and be readable.
        id: jobs-readable
        unmet_outcome: config-error
      - caller_action: Select a configured job whose command contains an executable.
        check:
          argument_ref: job
          kind: argument
          predicate: present
        description: The jobs file must contain the requested name with a nonempty
          command.
        id: job-present
        unmet_outcome: config-error
    description: Execute one named recurring job from an explicit jobs file without
      invoking a shell.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --jobs-file
        - --job
        flag_patterns:
          --job: ^[a-zA-Z0-9_-]+$
          --jobs-file: ^.+$
        max_positionals: 0
        min_positionals: 0
        required_flags:
        - --jobs-file
        - --job
    usage: --jobs-file FILE --job NAME
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Loads the selected recurring job from jobs.yaml.
  version: '>=6'
schema_version: 6
uses_interfaces: []
version: 1
maturity: experimental
