content:
- _job_control\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-managed-control.yaml
  reason: Delegates each public job-control operation through recurring-owned direct command construction.
  source: recurring-tasks._rtx.source.rtx-managed-control
  version: 1
description: Delegates enable, disable, immediate-run, status, log-view, synchronization,
  and owner-checked teardown to recurring-owned control.
gateway:
  language: Python
  path: _job_control.py
id: recurring-tasks._rtx.source.rtx-job-control
interfaces:
  recurring-tasks._rtx.source.rtx-job-control.interface.scripts-disable:
    content:
    - _job_control\.py
    uses_interfaces:
    - interface: recurring.interface.control
      version: 1
    contract:
      arguments:
        name:
          description: Configured job name to disable
          required: true
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: Rewrites jobs YAML and normally removes or disables
          native scheduler entries.
      direct_io:
        network: []
        reads:
        - access: read
          content: config
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: jobs.yaml
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: config
          formats:
          - yaml
          id: write-1
          medium: local-filesystem
          path: jobs.yaml
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: configure
          content: scheduler-config
          formats:
          - text
          id: write-2
          medium: local-system
          sensitivity: user-private
          system: native-scheduler
        - access: write
          content: response
          formats:
          - text
          id: write-3
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-4
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Loads the canonical jobs file before changing the matching enabled flag.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: write-jobs
          may_occur_in_outcomes:
          - disabled
          reversibility:
            reversible: Enable the same job again.
          value_source:
            argument_ref: name
            kind: argument
        - action: configure
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: sync-scheduler
          may_occur_in_outcomes:
          - disabled
          reversibility:
            reversible: Enable and resync the same job.
          value_source:
            argument_ref: name
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: jobs.yaml is written before native scheduler reconciliation.
          concurrent_invocations:
            unsafe: Concurrent job edits can overwrite YAML or scheduler state.
          idempotency:
            idempotent: Repeated disable calls converge to disabled state when the
              job remains present.
          on_uncertain_completion:
            verify_then_decide: Inspect jobs.yaml and native scheduler state before
              retrying.
          partial_effects_on_failure:
            possible: YAML can be updated when scheduler sync later fails.
          rollback_on_failure:
            unavailable: The interface does not automatically restore prior YAML.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Treat the job as disabled.
        class: success
        effects:
        - write-jobs
        - sync-scheduler
        id: disabled
        outputs:
        - result
      - caller_action: Check jobs.yaml for the requested name.
        class: error
        effects: []
        id: not-found
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Confirmation of the disabled job
        direct_io_ref: write-3
        empty: A confirmation line is printed on success.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-4
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: 'Disable a job by setting enabled: false in jobs.yaml and syncing
      native scheduler entries.'
    process_binding:
      args_prefix:
      - disable
      entry: Interface
      kind: process
      patterns:
      - allowed_flags: []
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <name>
    version: 1
  recurring-tasks._rtx.source.rtx-job-control.interface.scripts-enable:
