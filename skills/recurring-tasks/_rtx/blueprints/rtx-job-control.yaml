      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Treat the job as enabled.
        class: success
        effects:
        - write-jobs
        - sync-scheduler
        id: enabled
        outputs:
        - result
      - caller_action: Check jobs.yaml for the requested name.
        class: error
