        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Confirmation of the enabled job
        direct_io_ref: write-3
        empty: A confirmation line is printed on success.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-4
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: 'Enable a job by setting enabled: true in jobs.yaml and syncing native
      scheduler entries.'
    process_binding:
      args_prefix:
      - enable
      entry: Interface
      kind: process
      patterns:
      - allowed_flags: []
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <name>
    version: 1
  recurring-tasks._rtx.source.rtx-job-control.interface.scripts-remove-context:
    content:
    - _job_control\.py
    uses_interfaces:
    - interface: recurring.interface.control
      version: 1
    contract:
      arguments: {}
      caller_warnings:
      - external-side-effect: Removes the shared registrations, sentinel, and owner record only when the selected durable config root is the persisted owner.
      direct_io:
        network: []
        reads:
        - access: read
          content: recurring-owned authority
          formats: [json, yaml]
          id: read-1
          medium: local-filesystem
          path: $famulus-recurring-config-root/schedule-descriptor.json
          path_match: exact
          sensitivity: user-private
        writes:
        - access: configure
          content: shared owner-checked scheduler state
          formats: [files]
          id: write-1
          medium: local-system
          sensitivity: user-private
          system: native-scheduler
        - access: write
          content: operation result
          formats: [text]
          id: write-2
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          live: Revalidates the recurring-owned descriptor and persisted shared owner under the scheduler lock.
        effects:
        - action: delete
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          direct_io_ref: write-1
          id: remove-native-state
          may_occur_in_outcomes: [removed]
          reversibility:
            reversible: Run recurring setup to recreate registrations from preserved jobs.
          value_source: {kind: direct-io, direct_io_ref: read-1}
        lifecycle: finite
        mutation_safety:
          atomicity: {per_effect_only: Owner record replacement is atomic; host teardown consists of separate shared-set effects.}
          concurrent_invocations: {serialized: Teardown uses the same shared scheduler lock as reconciliation.}
          idempotency: {idempotent: Repeated owner teardown converges on no shared native state; non-owner teardown is a no-op.}
          on_uncertain_completion: {verify_then_decide: Inspect the shared owner and registration set before retrying.}
          partial_effects_on_failure: {possible: A host command may fail after another exact-context artifact was removed.}
          rollback_on_failure: {unavailable: Retry teardown or setup after correcting the reported host error.}
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      interaction: {mode: unattended}
      outcomes:
      - caller_action: Confirm whether owner-checked removal changed the shared set.
        class: success
        effects: [remove-native-state]
        id: removed
        outputs: [result]
      - caller_action: Correct the named host failure and retry remove-context.
        class: error
        effects: []
        id: failed
        outputs: [result]
      outputs:
      - audience: both
        cardinality: {minimum: 0, maximum: 1}
        description: Teardown result or diagnostic.
        direct_io_ref: write-2
        empty: Successful teardown may be silent.
        id: result
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        type: {kind: string, sensitivity: derived-private}
      preconditions: []
    description: Remove the shared native set only when the selected recurring config root is its current owner.
    process_binding:
      args_prefix: [remove-context]
      entry: Interface
      kind: process
      patterns:
      - allowed_flags: []
        max_positionals: 0
        min_positionals: 0
        name: owner
    usage: ''
    version: 1
  recurring-tasks._rtx.source.rtx-job-control.interface.scripts-status:
    content:
    - _job_control\.py
    uses_interfaces:
    - interface: recurring.interface.control
      version: 1
    contract:
      arguments: {}
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: scheduler-status
          formats:
          - text
          id: read-1
          medium: local-system
          sensitivity: derived-private
          system: native-scheduler
        writes:
        - access: write
          content: scheduler-status
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Queries native scheduler state during this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: status
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the native status to assess scheduled jobs.
        class: success
        effects: []
        id: reported
        outputs:
        - status
      - caller_action: Report the backend failure.
        class: error
        effects: []
        id: failed
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 0
        description: Native scheduler status text for recurring jobs
        direct_io_ref: write-1
        empty: No text is printed when the backend reports no entries.
        id: status
        ordering: unspecified
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: List active recurring scheduler entries, next fire times, and service
      status.
    process_binding:
      args_prefix:
      - status
      entry: Interface
      kind: process
      patterns:
      - max_positionals: 0
        min_positionals: 0
        name: owner
    usage: ''
    version: 1
  recurring-tasks._rtx.source.rtx-job-control.interface.scripts-test:
    content:
    - _job_control\.py
    uses_interfaces:
    - interface: recurring.interface.control
      version: 1
    contract:
      arguments:
        name:
          description: Configured job name to trigger through the native scheduler
          required: true
          sensitivity: user-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: Starts the configured job immediately through the native
          scheduler.
      - external-side-effect: Polls logs/<name>/latest.json for up to a bounded timeout
          after triggering, rather than trusting the scheduler's own trigger-acceptance
          result, since some native scheduler backends return immediately without
          waiting for the job to finish.
      direct_io:
        network: []
        reads:
        - access: read
          content: run-record
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: logs/<name>/latest.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        writes:
        - access: execute
          content: recurring-job
          formats:
          - text
          id: write-1
          medium: local-system
          sensitivity: user-private
          system: native-scheduler
        - access: write
          content: response
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-3
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Requests an immediate native scheduler run, then polls the job's run-record
            file until a fresh record appears or the bounded timeout elapses.
        effects:
        - action: execute
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: start-job
          may_occur_in_outcomes:
          - passed
          - failed
          - timed-out
          - execution-error
          reversibility:
            irreversible: Work already performed by the started job cannot be recalled
              generically.
          value_source:
            argument_ref: name
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: One scheduler start request is issued.
          concurrent_invocations:
            unsafe: Multiple calls may overlap executions of the same job.
          idempotency:
            non_idempotent: Repeating the call starts another job run.
          on_uncertain_completion:
            verify_then_decide: Inspect scheduler and run-log state before retrying.
          partial_effects_on_failure:
            possible: The job may start even when status collection fails.
          rollback_on_failure:
            unavailable: The interface has no generic compensation for job work.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: result
        - method: direct-io-state
          direct_io_ref: read-2
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Treat the job's actual run, not just the trigger, as successful.
        class: success
        effects:
        - start-job
        id: passed
        outputs:
        - result
      - caller_action: Inspect service and run logs; the trigger may have been accepted
          even though the job's own success contract was not met.
        class: error
        effects:
        - start-job
        id: failed
        outputs:
        - result
      - caller_action: Inspect service and run logs; no fresh run record appeared
          within the bounded wait.
        class: error
        effects:
        - start-job
        id: timed-out
        outputs:
        - result
      - caller_action: Report the scheduler exception and inspect native scheduler
          state before retrying.
        class: error
        effects:
        - start-job
        id: execution-error
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Pass or fail message reflecting the triggered job's run record
          (its declared success contract), not merely whether the scheduler accepted
          the trigger.
        direct_io_ref: write-2
        empty: A pass or fail line is always printed.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-3
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Trigger a job immediately through the native scheduler, then wait
      (bounded) for its run record and report whether the job actually succeeded.
    process_binding:
      args_prefix:
      - test
      entry: Interface
      kind: process
      patterns:
      - max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <name>
    version: 1
  recurring-tasks._rtx.source.rtx-job-control.interface.scripts-view-logs:
    content:
    - _job_control\.py
    uses_interfaces:
    - interface: recurring.interface.control
      version: 1
    contract:
      arguments:
        job-name:
          description: Configured job whose run log should be shown
          required: true
          sensitivity: user-private
          type:
            kind: string
        lines:
          default: 50
          description: Maximum trailing lines to print
          required: false
          sensitivity: public
          type:
            kind: integer
            minimum: 1
            unit: count
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: log
          formats:
          - text
          id: read-1
          medium: local-filesystem
          path: logs/*/run.log
          path_match: glob
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: log
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Reads the selected log once and prints its trailing lines.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: log-tail
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the lines for diagnosis.
        class: success
        effects: []
        id: shown
        outputs:
        - log-tail
      - caller_action: Confirm whether the job has ever run.
        class: no-op
        effects: []
        id: absent
        outputs:
        - log-tail
      - caller_action: Report the log read failure.
        class: error
        effects: []
        id: failed
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: null
          minimum: 1
        description: Requested tail of the job run log or a no-log message
        direct_io_ref: write-1
        empty: A no-log message is printed when the file is absent.
        id: log-tail
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Tail the run log for a job (default 50 lines).
    process_binding:
      args_prefix:
      - view-logs
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --lines
        flag_patterns:
          --lines: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <job-name> [--lines N]
    version: 1
