authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _setup_runner.py
      - Interface
      reason: 'Initial setup: syncs unit files, installs healthcheck cron entry.'
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _unit_writer.py
      - Interface
      reason: Write/remove systemd user unit files to match jobs.yaml.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _job_control.py
      - Interface
      reason: 'Consolidated interface: enable/disable/test/view-logs jobs.'
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _healthcheck_probe.py
      - Interface
      reason: Run pre-flight and per-job health checks.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _ensure_agent_env.py
      - Interface
      reason: Ensure recurring-tasks' systemd AI_AGENT_COMMAND_TEMPLATE is in place.
    - command:
      - systemctl
      reason: Manage systemd user units.
    - command:
      - journalctl
      reason: Read systemd journal for job diagnostics.
children: {}
content:
- jobs\.yaml
- _ensure_agent_env\.py
- _healthcheck_probe\.py
- _install_owner\.py
- __init__\.py
- _assistant_desktop_notify\.py
- _job_control\.py
- _job_executor\.py
- _jobs_config\.py
- _run_record\.py
- _schedule_backend/__init__\.py
- _schedule_backend/_base_backend\.py
- _schedule_backend/_linux_backend\.py
- _schedule_backend/_linux_registration_check\.py
- _schedule_backend/_osx_backend\.py
- _schedule_backend/_windows_backend\.py
- _setup_runner\.py
- _unit_writer\.py
- tests/.*
