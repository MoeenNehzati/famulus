authority:
  owns_filesystem:
  - allowed_readers:
    - recurring-tasks._rtx.interface.scripts-disable
    - recurring-tasks._rtx.interface.scripts-enable
    - recurring-tasks._rtx.interface.scripts-healthcheck
    - recurring-tasks._rtx.interface.scripts-remove-context
    - recurring-tasks._rtx.interface.scripts-setup
    - recurring-tasks._rtx.interface.scripts-status
    - recurring-tasks._rtx.interface.scripts-sync
    - recurring-tasks._rtx.interface.scripts-test
    - recurring-tasks._rtx.interface.scripts-view-logs
    match: exact
    path: $famulus-recurring-config-root/schedule-descriptor.json
    reason: recurring-tasks is the sole writer of the sealed installation schedule descriptor.
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _setup_runner.py
      - Interface
      reason: 'Initial setup: syncs unit files, installs healthcheck cron entry.'
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _unit_writer.py
      - Interface
      reason: Write/remove systemd user unit files to match jobs.yaml.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _job_control.py
      - Interface
      reason: 'Consolidated interface: enable/disable/test/view-logs jobs.'
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _healthcheck_probe.py
      - Interface
      reason: Run pre-flight and per-job health checks.
    - command:
      - systemctl
      reason: Manage systemd user units.
    - command:
      - journalctl
      reason: Read systemd journal for job diagnostics.
children: {}
content:
- default_jobs\.yaml
- _healthcheck_probe\.py
- __init__\.py
- _assistant_desktop_notify\.py
- _job_control\.py
- _managed_control\.py
- _job_executor\.py
- _jobs_config\.py
- _run_record\.py
- _setup_runner\.py
- _unit_writer\.py
- tests/.*
description: Code module for the recurring-tasks skill.
