jobs:
- name: email-triage
  description: Triage new emails into todo and triage lists
  command: invoke-skill email-triage
  backend: codex
  schedule: 0 */3 * * *
  enabled: true
  success:
    require_inner_status: ok
    ignore_exit_codes: [1]
    ignore_exit_log_patterns:
    - You've hit your usage limit
    - Please try again
- name: daily-plan
  description: Generate or show today's daily plan, including potential-actions triage
  command: invoke-skill daily-plan
  backend: claude
  schedule: 0 7 * * *
  enabled: true
  success:
    require_inner_status: ok
