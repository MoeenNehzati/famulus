authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: research-assistant
content:
- SKILL\.md
description: Reviews technical prose for concise formal presentation while preserving notation, claims, assumptions, and mathematical structure.
discovery:
  mechanism: skill
exports:
  formal-prose-review.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: formal-prose-review.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: formal-prose-review
kind: reviewer
node_type: module
role: research-writing
schema_version: 4
sources:
  formal-prose-review.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 1
