authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Reviews technical prose for concise formal presentation while preserving
  notation, claims, assumptions, and mathematical structure.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - research-writing
    - scholarly-documents
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  formal-prose-review.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: formal-prose-review.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: formal-prose-review
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  formal-prose-review.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: stable
installation_tier: core
personal_preference:
  applies: false
