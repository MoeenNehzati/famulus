      arguments:
        request: {description: Technical passage or document-review request with any profile context and local wording preferences., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - {id: response, audience: human, description: 'Concise prose diagnosis, minimal corrections, or a requested polished version that preserves substantive content.', direct_io_ref: response, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty on success., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: reviewed, class: success, outputs: [response], effects: [], caller_action: Apply the proposed surface edits after confirming that notation and claim strength remain unchanged.}
      - {id: clarification-required, class: refusal, outputs: [response], effects: [], caller_action: 'Supply the missing passage, document profile, or requested degree of rewriting.'}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: The review reflects the supplied passage or document state and the preferences available in this invocation.}
