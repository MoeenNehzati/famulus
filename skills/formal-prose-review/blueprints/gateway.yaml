content:
- SKILL\.md
dependencies: []
description: Implements diagnosis-first sentence-level prose review calibrated to
  the document profile and the user's settled wording preferences.
gateway:
  language: Markdown
  path: SKILL.md
id: formal-prose-review.source.gateway
interfaces:
  formal-prose-review.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Technical passage or document-review request with any profile
            context and local wording preferences.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: Prose-review request and supplied text or context.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Target technical document and any top-of-document profile comment
            when a file is named.
          formats:
          - text
          - tex
          - markdown
          id: document
          medium: local-filesystem
          reason: Review exact prose and calibrate style without altering mathematical
            substance.
          sensitivity: user-private
        - access: read
          content: Canonical document-profile schema.
          formats:
          - markdown
          id: profile-standard
          medium: repository-filesystem
          path: references/document-standards/document-profile.md
          path_match: exact
          reason: Validate a profile block before using it.
          sensitivity: public
        writes:
        - access: write
          content: Prose findings and proposed edits.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The review reflects the supplied passage or document state and
            the preferences available in this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Apply the proposed surface edits after confirming that notation
          and claim strength remain unchanged.
        class: success
        effects: []
        id: reviewed
        outputs:
        - response
      - caller_action: Supply the missing passage, document profile, or requested
          degree of rewriting.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Concise prose diagnosis, minimal corrections, or a requested
          polished version that preserves substantive content.
        direct_io_ref: response
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Review grammar, clarity, concision, and formal tone without silently
      changing mathematical or substantive content.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces: []
version: 1
