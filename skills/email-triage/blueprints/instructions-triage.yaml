content:
- instructions/triage\.md
dependencies: []
description: Owns the LLM-directed, watermark-safe email triage workflow and its routing
  decisions.
gateway:
  language: Markdown
  path: instructions/triage.md
id: email-triage.source.instructions-triage
interfaces:
  email-triage.source.instructions-triage.interface.triage:
    contract:
      arguments: {}
      caller_warnings:
      - external-side-effect: The workflow may add action items, append decisions,
          update status, and advance the watermark through separately declared interfaces.
      direct_io:
        network: []
        reads: []
        writes:
        - access: write
          content: response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          live: The summary reflects the emails and interface results observed during
            this run.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Present the triage summary.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Preserve the watermark and report the failed step.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Markdown triage summary and any failure information.
        direct_io_ref: write-1
        empty: The workflow always reports its result.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Scans emails received since the last triage run and routes extracted
      action items to the right list.
    version: 2
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: email-client.interface.default
  version: 3
- interface: email-triage._rtx.interface.fetch-filtered-envelopes
  version: 1
- interface: email-triage._rtx.interface.scripts-clear-failure
  version: 1
- interface: email-triage._rtx.interface.scripts-get-cutoff
  version: 1
- interface: email-triage._rtx.interface.scripts-log-decision
  version: 1
- interface: email-triage._rtx.interface.scripts-mark-failure
  version: 1
- interface: email-triage._rtx.interface.scripts-finalize-triage
  version: 1
- interface: email-triage._rtx.interface.scripts-prune-log
  version: 1
- interface: list-manager.interface.default
  version: 1
version: 2
