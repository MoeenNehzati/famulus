content:
- _rtx/_failure_clearer\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-triage.source.rtx-init
  version: 1
description: Clears a latched triage error while deliberately leaving the mail watermark unchanged.
gateway:
  language: Python
  path: _rtx/_failure_clearer.py
id: email-triage.source.rtx-failure-clearer
interfaces:
  email-triage.source.rtx-failure-clearer.interface.scripts-clear-failure:
    contract:
      arguments:
        reason: {description: Operator recovery explanation stored in status.json, required: false, default: operator confirmed recovery, sensitivity: derived-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Clears the latched error status but deliberately leaves the mail watermark unchanged.
      outputs:
      - {id: result, audience: both, description: Success confirmation written to stdout., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A confirmation line is emitted on success., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: cleared, class: success, outputs: [result], effects: [clear-failure], caller_action: Start a fresh triage run without advancing the old watermark first.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Keep the failure latched and report the write error.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Replaces the current status document with an operator-confirmed recovery message.}
        effects:
        - {id: clear-failure, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: reason}, may_occur_in_outcomes: [cleared], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: The failure can be marked again with the original reason.}}
        mutation_safety:
          atomicity: {per_effect_only: One status document is rewritten.}
          concurrent_invocations: {unsafe: Concurrent status writers can overwrite one another.}
          idempotency: {idempotent: Repeating the same reason converges to the same recovery document.}
          on_uncertain_completion: {verify_then_decide: Read status.json before retrying.}
          partial_effects_on_failure: {possible: A direct write can leave malformed status after interruption.}
          rollback_on_failure: {unavailable: No prior status backup is retained.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: diagnostic-report
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        writes:
        - access: write
          content: diagnostic-report
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - {access: write, content: response, formats: [text], id: write-2, medium: stdout, sensitivity: derived-private}
    description: Clear a latched triage failure after its cause is fixed, without
      advancing the watermark.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        name: owner
    usage: '[reason]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces:
- interface: common.interface.famulus-paths
  version: 1
version: 1
