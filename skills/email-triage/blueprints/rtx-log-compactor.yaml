content:
- _rtx/_log_compactor\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-triage.source.rtx-init
  version: 1
description: Rewrites the skill-local triage log after retaining recent and unparseable entries.
gateway:
  language: Python
  path: _rtx/_log_compactor.py
id: email-triage.source.rtx-log-compactor
interfaces:
  email-triage.source.rtx-log-compactor.interface.scripts-prune-log:
    contract:
      arguments: {}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Permanently removes parseable triage-log entries older than 30 days.
      outputs:
      - {id: summary, audience: both, description: One-line count of pruned and retained log entries, direct_io_ref: write-2, type: {kind: string}, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A zero-count summary is printed when the log is absent.}
      outcomes:
      - {id: pruned, class: success, outputs: [summary], effects: [rewrite-log], caller_action: Retain the summary for run reporting.}
      - {id: absent, class: no-op, outputs: [summary], effects: [], caller_action: Continue because there was no log to prune.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Report the file error without claiming old entries were removed.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Reads the log once and rewrites the entries retained by that snapshot.}
        effects:
        - {id: rewrite-log, direct_io_ref: write-1, action: update, value_source: {kind: direct-io, direct_io_ref: read-1}, may_occur_in_outcomes: [pruned], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {irreversible: Removed log lines are not retained by this interface.}}
        mutation_safety:
          atomicity: {per_effect_only: The complete retained line set is written in one direct rewrite.}
          concurrent_invocations: {unsafe: Concurrent appends can be lost during the read-then-rewrite window.}
          idempotency: {idempotent: Repeating immediately preserves the already-pruned set.}
          on_uncertain_completion: {verify_then_decide: Inspect triage.log before retrying.}
          partial_effects_on_failure: {possible: An interrupted direct rewrite can truncate the log.}
          rollback_on_failure: {unavailable: Pruned lines are not backed up.}
        verification: [{method: output-schema, output_ref: summary}]
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: log
          formats:
          - text
          id: read-1
          medium: local-filesystem
          path: triage.log
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: log
          formats:
          - text
          id: write-1
          medium: local-filesystem
          path: triage.log
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: response
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
    description: Drop triage.log entries older than 30 days and print a one-line summary.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        name: owner
    usage: ''
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
