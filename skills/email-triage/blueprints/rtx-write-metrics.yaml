content:
- _rtx/_write_metrics\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-triage.source.rtx-init
  version: 1
description: Merges run counters and account names into the skill-local triage status document.
gateway:
  language: Python
  path: _rtx/_write_metrics.py
id: email-triage.source.rtx-write-metrics
interfaces:
  email-triage.source.rtx-write-metrics.interface.scripts-write-metrics:
    contract:
      arguments:
        total-scanned: {description: Total envelopes classified in the run, required: true, sensitivity: derived-private, type: {kind: integer, minimum: 0, unit: count}}
        added-todo: {description: Count classified as directed todo actions, required: true, sensitivity: derived-private, type: {kind: integer, minimum: 0, unit: count}}
        added-triage: {description: Count classified as potential triage actions, required: true, sensitivity: derived-private, type: {kind: integer, minimum: 0, unit: count}}
        skipped: {description: Count skipped without body action, required: true, sensitivity: derived-private, type: {kind: integer, minimum: 0, unit: count}}
        deduped: {description: Count matched to existing destination items, required: false, default: 0, sensitivity: derived-private, type: {kind: integer, minimum: 0, unit: count}}
        accounts: {description: Comma-separated account nicknames included in the run, required: false, default: '', sensitivity: user-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Merges new run metrics into status.json while preserving any existing failure state.
      outputs:
      - {id: summary, audience: both, description: One-line rendering of the stored metric counts, direct_io_ref: write-1, type: {kind: string}, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A summary line is always printed after a successful write.}
      outcomes:
      - {id: written, class: success, outputs: [summary], effects: [write-metrics], caller_action: Continue to watermark advancement.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Report the metrics failure and do not advance the watermark.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Merges metrics into the status document read during this invocation.}
        effects:
        - {id: write-metrics, direct_io_ref: write-2, action: update, value_source: {kind: direct-io, direct_io_ref: write-2}, may_occur_in_outcomes: [written], confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}, reversibility: {compensatable: Restore a previously retained status document.}}
        mutation_safety:
          atomicity: {per_effect_only: One status document is rewritten with the merged metric fields.}
          concurrent_invocations: {unsafe: Concurrent status writers can overwrite one another.}
          idempotency: {non_idempotent: The stored metrics timestamp changes on every successful call.}
          on_uncertain_completion: {verify_then_decide: Read status.json before deciding whether to retry.}
          partial_effects_on_failure: {possible: A direct write can leave malformed status after interruption.}
          rollback_on_failure: {unavailable: No automatic status backup is retained.}
        verification: [{method: output-schema, output_ref: summary}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {access: read, content: diagnostic-report, formats: [json], id: read-1, medium: local-filesystem, path: state/status.json, path_match: exact, sensitivity: derived-private, system: filesystem}
        writes:
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - json
          id: write-2
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
    description: Write metrics from a triage run (emails scanned, added to lists,
      skipped, deduped) to status.json for visibility and debugging.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --total-scanned
        - --added-todo
        - --added-triage
        - --skipped
        - --deduped
        - --accounts
        flag_patterns:
          --accounts: ^.*$
          --added-todo: ^-?\d+$
          --added-triage: ^-?\d+$
          --deduped: ^-?\d+$
          --skipped: ^-?\d+$
          --total-scanned: ^-?\d+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --total-scanned
        - --added-todo
        - --added-triage
        - --skipped
    usage: Write the triage run metrics (counts) to state/status.json with timestamps
      for post-run reporting.
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
