content:
- SKILL\.md
- tests/test_llm_routing\.py
dependencies:
- blueprint:
    base: repository-root
    path: skills/setup-dispatcher-runtime/blueprints/gateway.yaml
  reason: Repair only email-triage's residual declaration before triage routing.
  source: setup-dispatcher-runtime.source.gateway
  version: 1
description: Owns the primary email-triage instructions and routes a matching user
  request to the detailed triage workflow.
gateway:
  language: Markdown
  path: SKILL.md
id: email-triage.source.gateway
interfaces:
  email-triage.source.gateway.interface.default:
    content:
    - SKILL\.md
    - tests/test_llm_routing\.py
    uses_interfaces:
    - interface: setup-dispatcher-runtime.interface.repair-selected-packages
      version: 1
    - interface: email-triage.source.instructions-triage.interface.triage
      version: 2
    - interface: email-triage._rtx.interface.fetch-filtered-envelopes
      version: 1
    - interface: email-triage._rtx.interface.scripts-clear-failure
      version: 1
    - interface: email-triage._rtx.interface.scripts-filter-envelopes
      version: 1
    - interface: email-triage._rtx.interface.scripts-finalize-triage
      version: 1
    - interface: email-triage._rtx.interface.scripts-get-cutoff
      version: 1
    - interface: email-triage._rtx.interface.scripts-log-decision
      version: 1
    - interface: email-triage._rtx.interface.scripts-mark-failure
      version: 1
    - interface: email-triage._rtx.interface.scripts-prune-log
      version: 1
    - interface: email-triage._rtx.interface.scripts-update-watermark
      version: 1
    - interface: email-triage._rtx.interface.scripts-write-metrics
      version: 1
    contract:
      arguments:
        request:
          description: User request that triggered email-triage.
          required: true
          sensitivity: user-private
          type:
            kind: string
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: message
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          live: The response reflects the workflow execution performed for this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the response and any separately reported interface results.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Report the failing workflow step and preserve the current watermark.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Markdown response produced by following the email-triage instructions.
        direct_io_ref: write-1
        empty: The interface always returns a response.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 2
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: setup-dispatcher-runtime.interface.repair-selected-packages
  version: 1
- interface: email-triage.source.instructions-triage.interface.triage
  version: 2
- interface: email-triage._rtx.interface.fetch-filtered-envelopes
  version: 1
- interface: email-triage._rtx.interface.scripts-clear-failure
  version: 1
- interface: email-triage._rtx.interface.scripts-filter-envelopes
  version: 1
- interface: email-triage._rtx.interface.scripts-finalize-triage
  version: 1
- interface: email-triage._rtx.interface.scripts-get-cutoff
  version: 1
- interface: email-triage._rtx.interface.scripts-log-decision
  version: 1
- interface: email-triage._rtx.interface.scripts-mark-failure
  version: 1
- interface: email-triage._rtx.interface.scripts-prune-log
  version: 1
- interface: email-triage._rtx.interface.scripts-update-watermark
  version: 1
- interface: email-triage._rtx.interface.scripts-write-metrics
  version: 1
version: 2
maturity: stable
