authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _envelope_gate.py
      - Interface
      reason: Filters email-client mail-list JSON to strictly-after-watermark envelopes.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _mail_envelope_stream.py
      - Interface
      reason: Fetches mail-list envelopes through the declared boundary and emits
        only strictly-after-watermark results.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _watermark_floor.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _watermark_writer.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _decision_sink.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _log_compactor.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _failure_sentinel.py
      - Interface
      reason: Records a failed triage run so update-watermark refuses to advance and
        the scheduled health check can report it.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _failure_clearer.py
      - Interface
      reason: Clears a latched triage failure after its cause is fixed without advancing
        the watermark.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _write_metrics.py
      - Interface
      reason: Writes metrics (scanned, added, skipped counts) from a triage run to
        status.json for visibility.
    network: []
children: {}
content:
- _decision_sink\.py
- _envelope_gate\.py
- _failure_clearer\.py
- _failure_sentinel\.py
- __init__\.py
- _log_compactor\.py
- _mail_envelope_stream\.py
- _watermark_floor\.py
- _watermark_writer\.py
- _write_metrics\.py
- tests/.*
description: Code module for the email-triage skill.
exports:
  email-triage-rtx.interface.fetch-filtered-envelopes:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-mail-envelope-stream.interface.fetch-filtered-envelopes
  email-triage-rtx.interface.scripts-clear-failure:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-failure-clearer.interface.scripts-clear-failure
  email-triage-rtx.interface.scripts-filter-envelopes:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-envelope-gate.interface.scripts-filter-envelopes
  email-triage-rtx.interface.scripts-get-cutoff:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-watermark-floor.interface.scripts-get-cutoff
  email-triage-rtx.interface.scripts-log-decision:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-decision-sink.interface.scripts-log-decision
  email-triage-rtx.interface.scripts-mark-failure:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-failure-sentinel.interface.scripts-mark-failure
  email-triage-rtx.interface.scripts-prune-log:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-log-compactor.interface.scripts-prune-log
  email-triage-rtx.interface.scripts-update-watermark:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-watermark-writer.interface.scripts-update-watermark
  email-triage-rtx.interface.scripts-write-metrics:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
    source_interface: email-triage-rtx.source.rtx-write-metrics.interface.scripts-write-metrics
