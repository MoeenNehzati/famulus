content:
- _finalize_run\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-write-metrics.yaml
  reason: Imports and calls write_metrics.main() in-process to record run counters
    before the watermark step.
  source: email-triage._rtx.source.rtx-write-metrics
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-watermark-writer.yaml
  reason: Imports and calls watermark_writer.main() in-process with the run id, only
    after metrics recording succeeds; watermark_writer itself commits the run id atomically
    with the watermark result.
  source: email-triage._rtx.source.rtx-watermark-writer
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-triage._rtx.source.rtx-init
  version: 1
description: Ordered, idempotent, replay-safe finalization of one triage run — writes
  metrics, then advances the watermark, refusing to double-apply a repeated run id.
gateway:
  language: Python
  path: _finalize_run.py
id: email-triage._rtx.source.rtx-finalize-run
interfaces:
  email-triage._rtx.source.rtx-finalize-run.interface.scripts-finalize-triage:
    contract:
      arguments:
        run-id:
          description: Caller-chosen unique id for this triage run; a repeat call
            with the same id is a replay-safe no-op
          required: true
          sensitivity: derived-private
          type:
            kind: string
        total-scanned:
          description: Total envelopes classified in the run
          required: true
          sensitivity: derived-private
          type:
            kind: integer
            minimum: 0
            unit: count
        added-todo:
          description: Count classified as directed todo actions
          required: true
          sensitivity: derived-private
          type:
            kind: integer
            minimum: 0
            unit: count
        added-triage:
          description: Count classified as potential triage actions
          required: true
          sensitivity: derived-private
          type:
            kind: integer
            minimum: 0
            unit: count
        skipped:
          description: Count skipped without body action
          required: true
          sensitivity: derived-private
          type:
            kind: integer
            minimum: 0
            unit: count
        deduped:
          description: Count matched to existing destination items
          required: false
          default: 0
          sensitivity: derived-private
          type:
            kind: integer
            minimum: 0
            unit: count
        accounts:
          description: Comma-separated account nicknames included in the run
          required: false
          default: ''
          sensitivity: user-private
          type:
            kind: string
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Merges run metrics into status.json and, only if that
          succeeds and no failure is latched, advances the watermark timestamp.
      outputs:
      - id: summary
        audience: both
        description: One-line confirmation of what finalize did (committed, refused,
          or replayed as a no-op).
        direct_io_ref: write-1
        type:
          kind: string
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: A summary line is always printed.
      - id: diagnostic
        audience: both
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        cardinality:
          minimum: 0
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: No stderr is emitted on the fully-committed or replay-no-op paths.
        type:
          kind: string
          sensitivity: derived-private
      outcomes:
      - id: committed
        class: success
        outputs:
        - summary
        effects:
        - write-metrics
        - commit-watermark-and-run-id
        - advance-watermark
        caller_action: Continue to log pruning.
      - id: replayed
        class: success
        outputs:
        - summary
        effects: []
        caller_action: Treat as already finalized; continue to log pruning.
      - id: blocked
        class: refusal
        outputs:
        - summary
        - diagnostic
        effects:
        - write-metrics
        caller_action: Resolve the latched failure (or the metrics argument error)
          and retry with the same run id.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Reads status.json once to short-circuit a prior finalize of this run
            id, then writes metrics, then delegates the watermark step (with the run
            id forwarded) to the composed watermark-writer interface, which itself
            commits status.json — result, watermark timestamp, and the run id, all
            in one write — before writing the watermark file.
        effects:
        - id: write-metrics
          direct_io_ref: write-3
          action: update
          value_source:
            kind: direct-io
            direct_io_ref: write-3
          may_occur_in_outcomes:
          - committed
          - blocked
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-3
          reversibility:
            compensatable: Restore a previously retained status document.
        - id: commit-watermark-and-run-id
          direct_io_ref: write-3
          action: update
          value_source:
            kind: argument
            argument_ref: run-id
          may_occur_in_outcomes:
          - committed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-3
          reversibility:
            compensatable: Restore a previously retained status document.
        - id: advance-watermark
          direct_io_ref: write-4
          action: update
          value_source:
            kind: direct-io
            direct_io_ref: write-4
          may_occur_in_outcomes:
          - committed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-4
          reversibility:
            compensatable: Restore a previously retained watermark timestamp.
        mutation_safety:
          atomicity:
            per_effect_only: Metrics is one write; the watermark step is then delegated
              whole to the composed watermark-writer interface, which itself commits
              status (result, new timestamp, and run id) in a single write strictly
              before writing the watermark file — so there is no window in this interface's
              own code where the watermark step has partially applied without the
              run id already being durable.
          concurrent_invocations:
            unsafe: Concurrent finalize calls for different run ids can still overwrite
              one another's status writes; this interface only guards ordering and
              replay of a single run id, not cross-run concurrency.
          idempotency:
            idempotent: A repeated call with the same run id that was already recorded
              as finalized performs no writes and returns the same committed outcome.
              This holds even if the prior call crashed after status.json committed
              the run id but before the watermark file itself was written — the replay
              is still recognized and still does not re-advance the watermark to a
              later timestamp.
          on_uncertain_completion:
            verify_then_decide: Retry with the identical run id; read status.json's
              last_finalized_run_id field before assuming the call did not land.
          partial_effects_on_failure:
            possible: A blocked call may have merged fresh metrics into status.json
              while the watermark and run id remain untouched — this is expected,
              not corruption, and the same run id remains safely retryable. A crash
              during the watermark step can leave status.json committed for this run
              id while the watermark file itself still holds the prior timestamp;
              this is the deliberately safe direction and self-heals on the next run.
          rollback_on_failure:
            unavailable: No automatic status or watermark backup is retained.
        verification:
        - method: output-schema
          output_ref: summary
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: diagnostic-report
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        writes:
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - json
          id: write-3
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: watermark
          formats:
          - text
          id: write-4
          medium: local-filesystem
          path: state/last_run
          path_match: exact
          sensitivity: user-private
          system: filesystem
    description: Ordered, idempotent finalization of one triage run — writes metrics,
      then (only on success and only if no failure is latched) advances the watermark,
      recording the run id so a replayed call is a safe no-op.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --run-id
        - --total-scanned
        - --added-todo
        - --added-triage
        - --skipped
        - --deduped
        - --accounts
        flag_patterns:
          --accounts: ^.*$
          --added-todo: ^-?\d+$
          --added-triage: ^-?\d+$
          --deduped: ^-?\d+$
          --run-id: ^.+$
          --skipped: ^-?\d+$
          --total-scanned: ^-?\d+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --run-id
        - --total-scanned
        - --added-todo
        - --added-triage
        - --skipped
    usage: --run-id <id> --total-scanned N --added-todo N --added-triage N --skipped
      N [--deduped N] [--accounts a,b]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: common.interface.famulus-paths
  version: 1
version: 1
maturity: stable
