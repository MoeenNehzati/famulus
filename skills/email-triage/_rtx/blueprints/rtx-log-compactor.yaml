content:
- _log_compactor\.py
dependencies:
- blueprint:
    base: repository-root
    path: src/officina/common/blueprints/famulus-paths.yaml
  reason: Resolves the managed email-triage state root containing the log to prune.
  source: common.source.famulus-paths
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-triage._rtx.source.rtx-init
  version: 1
description: Optionally copies a legacy module-local log into the platform-resolved
  email-triage state root, then rewrites the selected log after retaining recent
  and unparseable entries.
gateway:
  language: Python
  path: _log_compactor.py
id: email-triage._rtx.source.rtx-log-compactor
interfaces:
  email-triage._rtx.source.rtx-log-compactor.interface.scripts-prune-log:
    content:
    - _log_compactor\.py
    uses_interfaces:
    - interface: common.interface.famulus-paths
      version: 1
    contract:
      arguments: {}
      caller_warnings:
      - external-side-effect: Permanently removes parseable triage-log entries older
          than 30 days.
      - external-side-effect: Without an EMAIL_TRIAGE_STATE_DIR override, an absent
          managed log is initialized by copying an existing legacy <module-root>/triage.log
          before pruning; migration and pruning are separate writes.
      - external-side-effect: Setting EMAIL_TRIAGE_STATE_DIR selects an explicit
          unmanaged log and disables legacy migration.
      direct_io:
        network: []
        reads:
        - access: read
          content: Optional legacy email-triage decisions copied only when the canonical managed log is absent.
          formats: [text]
          id: legacy-log
          medium: local-filesystem
          path: <module-root>/triage.log
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: log
          formats:
          - text
          id: read-1
          medium: local-filesystem
          path: <email_triage_state_root>/triage.log
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: Guarded legacy-log copy into the canonical managed log before pruning.
          formats: [text]
          id: migration-write
          medium: local-filesystem
          path: <email_triage_state_root>/triage.log
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: Migrated or pre-existing log rewritten with old parseable entries removed.
          formats:
          - text
          id: write-1
          medium: local-filesystem
          path: <email_triage_state_root>/triage.log
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: response
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Optionally copies the legacy log first, then reads the selected
            log once and rewrites the entries retained by that snapshot.
        effects:
        - action: create
          confirmation_evidence:
            direct_io_ref: migration-write
            kind: direct-io
          direct_io_ref: migration-write
          id: migrate-legacy-log
          may_occur_in_outcomes:
          - pruned
          reversibility:
            irreversible: Migration and the subsequent pruning rewrite are not retained as separable states.
          value_source:
            direct_io_ref: legacy-log
            kind: direct-io
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: rewrite-log
          may_occur_in_outcomes:
          - pruned
          reversibility:
            irreversible: Removed log lines are not retained by this interface.
          value_source:
            direct_io_ref: read-1
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Guarded legacy copy and pruning rewrite are separate;
              the complete retained line set is written in one direct rewrite.
          concurrent_invocations:
            unsafe: Concurrent appends can be lost during the read-then-rewrite window.
          idempotency:
            idempotent: Repeating immediately preserves the already-pruned set.
          on_uncertain_completion:
            verify_then_decide: Inspect triage.log before retrying.
          partial_effects_on_failure:
            possible: A migrated managed log can remain unpruned if failure occurs
              before rewrite, and an interrupted pruning rewrite can truncate the log.
          rollback_on_failure:
            unavailable: Pruned lines are not backed up.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: summary
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Retain the summary for run reporting.
        class: success
        effects:
        - migrate-legacy-log
        - rewrite-log
        id: pruned
        outputs:
        - summary
      - caller_action: Continue because there was no log to prune.
        class: no-op
        effects: []
        id: absent
        outputs:
        - summary
      - caller_action: Report the file error without claiming old entries were removed.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: One-line count of pruned and retained log entries
        direct_io_ref: write-2
        empty: A zero-count summary is printed when the log is absent.
        id: summary
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      preconditions: []
    description: Drop triage.log entries older than 30 days and print a one-line summary.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        name: owner
    usage: ''
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: common.interface.famulus-paths
  version: 1
version: 1
maturity: stable
