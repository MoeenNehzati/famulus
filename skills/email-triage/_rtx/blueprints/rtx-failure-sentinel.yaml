content:
- _failure_sentinel\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-triage._rtx.source.rtx-init
  version: 1
description: Latches a failed triage-run status that prevents later watermark advancement.
gateway:
  language: Python
  path: _failure_sentinel.py
id: email-triage._rtx.source.rtx-failure-sentinel
interfaces:
  email-triage._rtx.source.rtx-failure-sentinel.interface.scripts-mark-failure:
    contract:
      arguments:
        reason:
          default: triage run failed (no reason given)
          description: Failure reason stored for the operator and watermark guard
          required: false
          sensitivity: derived-private
          type:
            kind: string
      caller_warnings:
      - external-side-effect: Replaces status.json with an error latch that blocks
          watermark advancement.
      direct_io:
        network: []
        reads: []
        writes:
        - access: write
          content: diagnostic-report
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Replaces the current triage status with the supplied failure reason.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: mark-failed
          may_occur_in_outcomes:
          - marked
          reversibility:
            compensatable: Invoke the separate failure-clearer after correcting the
              underlying problem.
          value_source:
            argument_ref: reason
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: One status document is rewritten.
          concurrent_invocations:
            unsafe: Concurrent status writers can overwrite one another.
          idempotency:
            idempotent: Repeating the same reason converges to the same error document.
          on_uncertain_completion:
            verify_then_decide: Read status.json before deciding whether to retry.
          partial_effects_on_failure:
            possible: A direct write can leave malformed status after interruption.
          rollback_on_failure:
            unavailable: No prior status backup is retained.
        state_effect: mutating
        verification:
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Stop the run without advancing the watermark.
        class: success
        effects:
        - mark-failed
        id: marked
        outputs:
        - diagnostic
      - caller_action: Report that failure state could not be persisted and do not
          advance the watermark.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Record that this triage run failed, so update-watermark refuses to
      advance and the scheduled health check reports it.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        name: owner
    usage: <reason>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces:
- interface: common.interface.famulus-paths
  version: 1
version: 1
