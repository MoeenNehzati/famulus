content:
- _mail_envelope_stream\.py
- _rescan_filter\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-envelope-gate.yaml
  reason: Imports Python source from _rtx/_envelope_gate.py.
  source: email-triage._rtx.source.rtx-envelope-gate
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-triage._rtx.source.rtx-init
  version: 1
description: Calls email-client for account envelopes and emits only records newer
  than the exact triage watermark.
gateway:
  language: Python
  path: _mail_envelope_stream.py
id: email-triage._rtx.source.rtx-mail-envelope-stream
interfaces:
  email-triage._rtx.source.rtx-mail-envelope-stream.interface.fetch-filtered-envelopes:
    content:
    - _mail_envelope_stream\.py
    - _rescan_filter\.py
    uses_interfaces:
    - interface: email-client._rtx.interface.mail-list
      version: 1
    - interface: list-manager._rtx.interface.cloud-read
      version: 1
    contract:
      arguments:
        account:
          description: Configured email-client account nickname
          required: true
          sensitivity: user-private
          type:
            kind: string
        after:
          description: Coarse date cutoff passed to email-client mail-list
          required: true
          sensitivity: derived-private
          type:
            date_formats:
            - YYYY-MM-DD
            kind: date
        rescan-after:
          description: Explicit ISO cutoff overriding the stored watermark for this
            call only, used for a manual historical rescan.
          required: false
          sensitivity: derived-private
          type:
            kind: string
        dedup-against:
          description: Destination list name to filter results against by source.message_id
            via list-manager._rtx.interface.cloud-read before returning them.
          required: false
          sensitivity: user-private
          type:
            kind: enum
            values:
            - value: todo
              description: Filter against the todo list.
            - value: triage
              description: Filter against the triage list.
      caller_warnings:
      - rate-limited: The delegated email-client mail-list request may be subject
          to provider limits.
      direct_io:
        network: []
        reads:
        - access: read
          content: watermark
          formats:
          - text
          id: read-1
          medium: local-filesystem
          path: state/last_run
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: diagnostic-report
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        writes:
        - access: write
          content: email
          formats:
          - json
          - text
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - json
          id: write-2
          medium: local-filesystem
          path: state/status.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-3
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Delegates a live envelope listing and filters it against the current
            exact watermark.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: update-status
          may_occur_in_outcomes:
          - fetched
          reversibility:
            reversible: A later successful run may replace warning or stale-error
              status.
          value_source:
            direct_io_ref: write-2
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: At most one status document is rewritten while filtering.
          concurrent_invocations:
            unsafe: Concurrent triage runs can overwrite shared status state.
          idempotency:
            non_idempotent: Delegated mailbox state and fallback time can change between
              calls.
          on_uncertain_completion:
            verify_then_decide: Inspect status and preserve the watermark before retrying.
          partial_effects_on_failure:
            possible: Status may change after a successful delegated fetch but before
              output completes.
          rollback_on_failure:
            unavailable: The prior status document is not retained.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: filtered-envelopes
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Process only the returned envelopes.
        class: success
        effects:
        - update-status
        id: fetched
        outputs:
        - filtered-envelopes
        - diagnostic
      - caller_action: Report the delegated failure and preserve the watermark.
        class: error
        effects: []
        id: mail-list-failed
        outputs:
        - diagnostic
      - caller_action: Report invalid email-client JSON and preserve the watermark.
        class: error
        effects: []
        id: invalid-response
        outputs:
        - diagnostic
      - id: dedup-read-failed
        class: error
        outputs:
        - diagnostic
        effects: []
        caller_action: Report the delegated list-manager cloud-read failure; retry
          the rescan once the destination list is readable.
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Envelopes newer than the exact watermark or a no-new-email message
        direct_io_ref: write-1
        empty: A no-new-email message is emitted when no envelopes remain.
        id: filtered-envelopes
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-3
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Fetch email envelopes for one account through email-client and emit
      only envelopes strictly after the triage watermark.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - -a
        - --after
        - --rescan-after
        - --dedup-against
        flag_patterns:
          --after: ^.+$
          -a: ^.+$
          --rescan-after: ^.+$
          --dedup-against: ^(todo|triage)$
        forbidden_flags:
        - --account
        max_positionals: 0
        min_positionals: 0
        name: short-account
        required_flags:
        - -a
        - --after
      - allowed_flags:
        - --account
        - --after
        - --rescan-after
        - --dedup-against
        flag_patterns:
          --account: ^.+$
          --after: ^.+$
          --rescan-after: ^.+$
          --dedup-against: ^(todo|triage)$
        forbidden_flags:
        - -a
        max_positionals: 0
        min_positionals: 0
        name: long-account
        required_flags:
        - --account
        - --after
    usage: -a <account> --after YYYY-MM-DD [--rescan-after ISO_CUTOFF] [--dedup-against
      todo|triage]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses the destination list YAML fetched via list-manager._rtx.interface.cloud-read
    for --dedup-against.
  version: '>=6'
schema_version: 6
uses_interfaces:
- interface: email-client._rtx.interface.mail-list
  version: 1
- interface: list-manager._rtx.interface.cloud-read
  version: 1
version: 1
maturity: stable
