authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:CHANGES\.md|DEBUGGING\.md|SKILL\.md|instructions/triage\.md|tests/test_finalize_run\.py|tests/test_llm_routing\.py|tests/test_rescan\.py)
description: Coordinates watermark-safe email triage, classification logging, failure
  recovery, and routing of extracted action items.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - communications
    - personal-organization
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  email-triage.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: email-triage.source.gateway.interface.default
  email-triage.interface.triage:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.instructions-triage.interface.triage
gateway:
  language: Markdown
  path: SKILL.md
id: email-triage
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        email-triage._rtx.interface.fetch-filtered-envelopes: 1
        email-triage._rtx.interface.scripts-clear-failure: 1
        email-triage._rtx.interface.scripts-filter-envelopes: 1
        email-triage._rtx.interface.scripts-finalize-triage: 1
        email-triage._rtx.interface.scripts-get-cutoff: 1
        email-triage._rtx.interface.scripts-log-decision: 1
        email-triage._rtx.interface.scripts-mark-failure: 1
        email-triage._rtx.interface.scripts-prune-log: 1
        email-triage._rtx.interface.scripts-update-watermark: 1
        email-triage._rtx.interface.scripts-write-metrics: 1
    interface_access:
      email-triage._rtx.interface.fetch-filtered-envelopes:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-clear-failure:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-filter-envelopes:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-finalize-triage:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-get-cutoff:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-log-decision:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-mark-failure:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-prune-log:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-update-watermark:
        allow_all_modules: false
        allowed_callers: []
      email-triage._rtx.interface.scripts-write-metrics:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  email-triage.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  email-triage.source.instructions-triage:
    blueprint:
      base: module-root
      path: blueprints/instructions-triage.yaml
version: 3
maturity: stable
installation_tier: optional
personal_preference:
  applies: false
