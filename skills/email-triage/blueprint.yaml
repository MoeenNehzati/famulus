authority:
  owns_filesystem: []
children:
  email-triage-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:CHANGES\.md|DEBUGGING\.md|SKILL\.md|instructions/triage\.md|tests/test_llm_routing\.py)
description: Coordinates watermark-safe email triage, classification logging, failure
  recovery, and routing of extracted action items.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - communications
    - personal-organization
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  email-triage.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: email-triage.source.gateway.interface.default
  email-triage.interface.fetch-filtered-envelopes:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.fetch-filtered-envelopes
      version: 1
  email-triage.interface.scripts-clear-failure:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-clear-failure
      version: 1
  email-triage.interface.scripts-filter-envelopes:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-filter-envelopes
      version: 1
  email-triage.interface.scripts-get-cutoff:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-get-cutoff
      version: 1
  email-triage.interface.scripts-log-decision:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-log-decision
      version: 1
  email-triage.interface.scripts-mark-failure:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-mark-failure
      version: 1
  email-triage.interface.scripts-prune-log:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-prune-log
      version: 1
  email-triage.interface.scripts-update-watermark:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-update-watermark
      version: 1
  email-triage.interface.scripts-write-metrics:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-triage-rtx.interface.scripts-write-metrics
      version: 1
  email-triage.interface.triage:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.instructions-triage.interface.triage
gateway:
  language: Markdown
  path: SKILL.md
id: email-triage
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  email-triage.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  email-triage.source.instructions-triage:
    blueprint:
      base: module-root
      path: blueprints/instructions-triage.yaml
version: 3
