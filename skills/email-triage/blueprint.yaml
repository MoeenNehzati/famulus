authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_envelope_gate.py
      - Interface
      reason: Filters email-client mail-list JSON to strictly-after-watermark envelopes.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_mail_envelope_stream.py
      - Interface
      reason: Fetches mail-list envelopes through the declared boundary and emits
        only strictly-after-watermark results.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_watermark_floor.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_watermark_writer.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_decision_sink.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_log_compactor.py
      - Interface
      reason: Suggested approval for the email triage runtime.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_failure_sentinel.py
      - Interface
      reason: Records a failed triage run so update-watermark refuses to advance and
        the scheduled health check can report it.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_failure_clearer.py
      - Interface
      reason: Clears a latched triage failure after its cause is fixed without advancing
        the watermark.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_write_metrics.py
      - Interface
      reason: Writes metrics (scanned, added, skipped counts) from a triage run to
        status.json for visibility.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_finalize_run.py
      - Interface
      reason: Ordered, idempotent finalization of a triage run — writes metrics then
        advances the watermark as one replay-safe step.
    network: []
category: productivity-general-assistant
description: Coordinates watermark-safe email triage, classification logging, failure recovery, and routing of extracted action items.
content:
- CHANGES\.md
- DEBUGGING\.md
- SKILL\.md
- _rtx/__init__\.py
- _rtx/_decision_sink\.py
- _rtx/_envelope_gate\.py
- _rtx/_failure_clearer\.py
- _rtx/_failure_sentinel\.py
- _rtx/_finalize_run\.py
- _rtx/_log_compactor\.py
- _rtx/_mail_envelope_stream\.py
- _rtx/_watermark_floor\.py
- _rtx/_watermark_writer\.py
- _rtx/_write_metrics\.py
- check\-triage\-status\.sh
- instructions/triage\.md
- tests/test_fetch_filtered_envelopes\.py
- tests/test_filter_envelopes\.py
- tests/test_llm_routing\.py
- tests/test_finalize_run\.py
- tests/test_watermark\.py
discovery:
  mechanism: skill
exports:
  email-triage.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: email-triage.source.gateway.interface.default
  email-triage.interface.fetch-filtered-envelopes:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-mail-envelope-stream.interface.fetch-filtered-envelopes
  email-triage.interface.scripts-clear-failure:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-failure-clearer.interface.scripts-clear-failure
  email-triage.interface.scripts-filter-envelopes:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-envelope-gate.interface.scripts-filter-envelopes
  email-triage.interface.scripts-finalize-triage:
