      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-finalize-run.interface.scripts-finalize-triage
  email-triage.interface.scripts-get-cutoff:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-watermark-floor.interface.scripts-get-cutoff
  email-triage.interface.scripts-log-decision:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-decision-sink.interface.scripts-log-decision
  email-triage.interface.scripts-mark-failure:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-failure-sentinel.interface.scripts-mark-failure
  email-triage.interface.scripts-prune-log:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-log-compactor.interface.scripts-prune-log
  email-triage.interface.scripts-update-watermark:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-watermark-writer.interface.scripts-update-watermark
  email-triage.interface.scripts-write-metrics:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.rtx-write-metrics.interface.scripts-write-metrics
  email-triage.interface.triage:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: email-triage.source.instructions-triage.interface.triage
gateway:
