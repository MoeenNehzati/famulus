content:
- SKILL\.md
dependencies: []
description: Implements context-first referee-style proof decomposition and separate
  soundness, coherence, redundancy, theorem-use, and corner-case passes.
gateway:
  language: Markdown
  path: SKILL.md
id: proof-audit.source.gateway
interfaces:
  proof-audit.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Proof-audit request plus the statement, argument, surrounding
            document, and any facts the user explicitly asks to treat as given.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: Proof-audit request and supplied mathematical context.
          formats:
          - text
          - tex
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Target statement, proof, standing assumptions, notation, and earlier
            local results when a document is named.
          formats:
          - tex
          - markdown
          - text
          id: document
          medium: local-filesystem
          reason: Audit the argument in its actual scope before alleging a missing
            hypothesis or invoking an external theorem.
          sensitivity: user-private
        writes:
        - access: write
          content: Labeled proof-audit verdict and diagnosis.
          formats:
          - markdown
          - tex
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The verdict reflects the supplied proof, active standing assumptions,
            and local results available in this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: diagnosis-only
      outcomes:
      - caller_action: Use the verdict and exact diagnosis before deciding whether
          to request a repaired proof.
        class: success
        effects: []
        id: audited
        outputs:
        - response
      - caller_action: Confirm or reject the diagnosed gap before asking for a detailed
          repair.
        class: success
        effects: []
        id: diagnosis-only
        outputs:
        - response
      - caller_action: Supply the missing statement, proof component, standing assumptions,
          or surrounding scope.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Concise labeled verdict separating soundness, coherence, and
          redundancy, with decomposition, exact gaps, edge cases, counterexamples,
          or a candidate repair direction as needed.
        direct_io_ref: response
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Audit a proof in its document context and diagnose the first material
      issue without silently rewriting the argument.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces: []
version: 1
