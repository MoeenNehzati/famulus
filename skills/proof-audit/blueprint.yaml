authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: research-assistant
children:
  proof-audit-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Audits mathematical arguments for soundness, coherence, redundancy, hidden
  assumptions, theorem-use gaps, and edge cases before proposing repairs.
discovery:
  mechanism: skill
exports:
  proof-audit.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: proof-audit.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: proof-audit
kind: auditor
namespace_exports: {}
node_type: module
role: math-reasoning
schema_version: 5
sources:
  proof-audit.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
