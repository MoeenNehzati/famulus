authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Audits mathematical arguments for soundness, coherence, redundancy, hidden
  assumptions, theorem-use gaps, and edge cases before proposing repairs.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - mathematical-reasoning
    - research-writing
    - scholarly-documents
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  proof-audit.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: proof-audit.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: proof-audit
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  proof-audit.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
