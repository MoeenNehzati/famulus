content:
- SKILL\.md
dependencies: []
description: Implements the approval-gated diagnostic, prevention, repair, and empirical
  verification workflow for a configured rclone bisync job.
gateway:
  language: Markdown
  path: SKILL.md
id: fix-bisync.source.gateway
interfaces:
  fix-bisync.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Bisync failure request plus known job, wrapper, and repair
            preference.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Approved prevention can edit configuration and approved
          repair can reconcile local and remote files.
      - external-side-effect: The wrong resync mode can overwrite the actively edited
          side; compare dry runs before a real repair.
      direct_io:
        network:
        - access: read-write
          content: Remote listings, hashes, and files used in diagnosis or repair.
          endpoint: Remote configured by the active bisync job
          formats:
          - filesystem-objects
          - checksums
          id: bisync-remote
          medium: network
          reason: Diagnose and verify or perform approved reconciliation.
          sensitivity: user-private
          system: rclone
        reads:
        - access: read
          content: Failure report, job context, and approvals.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Wrapper, filters, logs, state listings, mtimes, conflicts, and
            local checksums.
          formats:
          - shell
          - text
          - log
          - filesystem-metadata
          - checksums
          id: bisync-state
          medium: local-filesystem
          reason: Find the first failure and verify resulting state.
          sensitivity: user-private
        writes:
        - access: write
          content: Diagnosis, prevention decision, repair command, and verification
            report.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: Approved wrapper, filter, or preventive configuration.
          formats:
          - shell
          - text
          - configuration
          id: prevention-write
          medium: local-filesystem
          reason: Apply only approved prevention.
          sensitivity: user-private
        - access: execute
          content: Diagnostic, dry-run, checksum, or approved real bisync command.
          formats:
          - argv
          - text
          id: bisync-command
          medium: subprocess
          reason: Inspect and when requested repair the job.
          sensitivity: user-private
          system: shell and rclone
      execution:
        consistency:
          live: Logs, listings, local files, and remote state are inspected at each
            step.
        effects:
        - action: configure
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: prevention-write
          id: prevention-change
          may_occur_in_outcomes:
          - prevention-applied
          reversibility:
            reversible: Restore prior wrapper, filter, or build configuration.
          value_source:
            argument_ref: request
            kind: argument
        - action: execute
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: bisync-command
          id: repair-run
          may_occur_in_outcomes:
          - repaired
          - repair-partial
          reversibility:
            irreversible: Transfers and reconciliation have no automatic rollback.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: Prevention edits and transfers are separate and failures can
              leave partial effects.
          concurrent_invocations:
            unsafe: Do not run competing repairs for one job.
          idempotency:
            non_idempotent: Repeating repair observes changed state and can transfer
              more files.
          on_uncertain_completion:
            verify_then_decide: Inspect listings, logs, checksums, and conflicts before
              retrying.
          partial_effects_on_failure:
            possible: Edits or transfers may finish before a later failure.
          rollback_on_failure:
            unavailable: Preserve evidence and repair from resulting state.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: bisync-state
          method: direct-io-state
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: approval-required
      outcomes:
      - caller_action: Review the first failure and choose whether to approve prevention
          or repair.
        class: success
        effects: []
        id: diagnosed
        outputs:
        - response
      - caller_action: Approve a specific prevention or request command-only or executed
          repair.
        class: refusal
        effects: []
        id: approval-required
        outputs:
        - response
      - caller_action: Review the verified change before repair.
        class: success
        effects:
        - prevention-change
        id: prevention-applied
        outputs:
        - response
      - caller_action: Review fresh listings, log suffix, checksums, and new conflicts.
        class: success
        effects:
        - repair-run
        id: repaired
        outputs:
        - response
      - caller_action: Preserve state and investigate the remaining error before retrying.
        class: partial
        effects:
        - repair-run
        id: repair-partial
        outputs:
        - response
      - caller_action: Supply missing job inputs or correct the inspection failure.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Diagnosis, culprit evidence, prevention choices, exact repair
          command, or verified repair result.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Diagnose a live bisync job and gate preventive edits and repair execution
      on explicit user choice.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces: []
version: 1
