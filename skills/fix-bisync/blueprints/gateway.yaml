content:
- SKILL\.md
dependencies: []
description: Implements the approval-gated diagnostic, prevention, repair, and empirical verification workflow for a configured rclone bisync job.
gateway:
  language: Markdown
  path: SKILL.md
id: fix-bisync.source.gateway
interfaces:
  fix-bisync.source.gateway.interface.default:
    contract:
      arguments:
        request: {description: 'Bisync failure request plus known job, wrapper, and repair preference.', required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: interactive, channel: tty, unattended_outcome: approval-required}
      caller_warnings:
      - external-side-effect: Approved prevention can edit configuration and approved repair can reconcile local and remote files.
      - external-side-effect: The wrong resync mode can overwrite the actively edited side; compare dry runs before a real repair.
      outputs:
      - {id: response, audience: human, description: 'Diagnosis, culprit evidence, prevention choices, exact repair command, or verified repair result.', direct_io_ref: response, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: diagnosed, class: success, outputs: [response], effects: [], caller_action: Review the first failure and choose whether to approve prevention or repair.}
      - {id: approval-required, class: refusal, outputs: [response], effects: [], caller_action: Approve a specific prevention or request command-only or executed repair.}
      - {id: prevention-applied, class: success, outputs: [response], effects: [prevention-change], caller_action: Review the verified change before repair.}
      - {id: repaired, class: success, outputs: [response], effects: [repair-run], caller_action: 'Review fresh listings, log suffix, checksums, and new conflicts.'}
      - {id: repair-partial, class: partial, outputs: [response], effects: [repair-run], caller_action: Preserve state and investigate the remaining error before retrying.}
      - {id: failed, class: error, outputs: [response], effects: [], caller_action: Supply missing job inputs or correct the inspection failure.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: 'Logs, listings, local files, and remote state are inspected at each step.'}
        effects:
        - {id: prevention-change, direct_io_ref: prevention-write, action: configure, value_source: {kind: argument, argument_ref: request}, may_occur_in_outcomes: [prevention-applied], confirmation_evidence: {kind: output, output_ref: response}, reversibility: {reversible: 'Restore prior wrapper, filter, or build configuration.'}}
        - {id: repair-run, direct_io_ref: bisync-command, action: execute, value_source: {kind: argument, argument_ref: request}, may_occur_in_outcomes: [repaired, repair-partial], confirmation_evidence: {kind: output, output_ref: response}, reversibility: {irreversible: Transfers and reconciliation have no automatic rollback.}}
        mutation_safety:
          atomicity: {non_atomic: Prevention edits and transfers are separate and failures can leave partial effects.}
          concurrent_invocations: {unsafe: Do not run competing repairs for one job.}
          idempotency: {non_idempotent: Repeating repair observes changed state and can transfer more files.}
          on_uncertain_completion: {verify_then_decide: 'Inspect listings, logs, checksums, and conflicts before retrying.'}
          partial_effects_on_failure: {possible: Edits or transfers may finish before a later failure.}
          rollback_on_failure: {unavailable: Preserve evidence and repair from resulting state.}
        verification:
        - {method: output-schema, output_ref: response}
        - {method: direct-io-state, direct_io_ref: bisync-state}
      helpers: []
      direct_io:
        network:
        - {id: bisync-remote, medium: network, access: read-write, system: rclone, endpoint: Remote configured by the active bisync job, content: 'Remote listings, hashes, and files used in diagnosis or repair.', formats: [filesystem-objects, checksums], sensitivity: user-private, reason: Diagnose and verify or perform approved reconciliation.}
        reads:
        - {id: request, medium: prompt, access: read, system: agent-runtime, content: 'Failure report, job context, and approvals.', formats: [text], sensitivity: user-private}
        - {id: bisync-state, medium: local-filesystem, access: read, content: 'Wrapper, filters, logs, state listings, mtimes, conflicts, and local checksums.', formats: [shell, text, log, filesystem-metadata, checksums], sensitivity: user-private, reason: Find the first failure and verify resulting state.}
        writes:
        - {id: response, medium: prompt, access: write, system: agent-runtime, content: 'Diagnosis, prevention decision, repair command, and verification report.', formats: [markdown], sensitivity: derived-private}
        - {id: prevention-write, medium: local-filesystem, access: write, content: 'Approved wrapper, filter, or preventive configuration.', formats: [shell, text, configuration], sensitivity: user-private, reason: Apply only approved prevention.}
        - {id: bisync-command, medium: subprocess, access: execute, system: shell and rclone, content: 'Diagnostic, dry-run, checksum, or approved real bisync command.', formats: [argv, text], sensitivity: user-private, reason: Inspect and when requested repair the job.}
    description: Diagnose a live bisync job and gate preventive edits and repair execution on explicit user choice.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
