authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: system-assistant
children:
  fix-bisync-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Diagnoses rclone bisync failures, proposes bounded prevention, and performs
  an explicitly approved repair with post-run state verification.
discovery:
  mechanism: skill
exports:
  fix-bisync.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: fix-bisync.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: fix-bisync
kind: diagnostic
namespace_exports: {}
node_type: module
role: system-operations
schema_version: 5
sources:
  fix-bisync.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
