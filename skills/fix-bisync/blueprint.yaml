authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: system-assistant
content:
- SKILL\.md
description: Diagnoses rclone bisync failures, proposes bounded prevention, and performs an explicitly approved repair with post-run state verification.
discovery:
  mechanism: skill
exports:
  fix-bisync.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: fix-bisync.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: fix-bisync
kind: diagnostic
node_type: module
role: system-operations
schema_version: 4
sources:
  fix-bisync.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 1
