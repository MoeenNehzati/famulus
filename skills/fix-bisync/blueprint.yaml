authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Diagnoses rclone bisync failures, proposes bounded prevention, and performs
  an explicitly approved repair with post-run state verification.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - storage-and-sync
    - system-maintenance
    visibility: listed
  activated_by:
  - user-request
  persistent_modifier: false
exports:
  fix-bisync.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: fix-bisync.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: fix-bisync
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  fix-bisync.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
