description: Dependency-free Python infrastructure for monitoring local Claude and
  Codex quota signals and scheduling guarded continuation messages after usage limits
  reset, with persistent JSON jobs, transcript-progress suppression, provider-log
  inference, retry handling, and journald-oriented worker events.
exports:
  llm-wakeup._rtx.interface.auto-policy:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: llm-wakeup._rtx.source.cli.interface.auto-policy
  llm-wakeup._rtx.interface.infer-schedule:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: llm-wakeup._rtx.source.cli.interface.infer-schedule
  llm-wakeup._rtx.interface.explicit-schedule:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: llm-wakeup._rtx.source.cli.interface.explicit-schedule
  llm-wakeup._rtx.interface.setup:
    access:
      allow_all_modules: true
      allowed_callers: []
    setup_requires_setup_of: []
    verifier: {interface: llm-wakeup._rtx.interface.setup-status, version: 1}
    source_interface: llm-wakeup._rtx.source.setup-lifecycle.interface.setup
  llm-wakeup._rtx.interface.teardown:
    access:
      allow_all_modules: true
      allowed_callers: []
    verifier: {interface: llm-wakeup._rtx.interface.teardown-status, version: 1}
    source_interface: llm-wakeup._rtx.source.teardown-lifecycle.interface.teardown
  llm-wakeup._rtx.interface.setup-status:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: llm-wakeup._rtx.source.setup-lifecycle.interface.setup-status
  llm-wakeup._rtx.interface.teardown-status:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: llm-wakeup._rtx.source.teardown-lifecycle.interface.teardown-status
