authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Routes assistant requests to guarded supported-session wakeup scheduling
  and per-session automatic scheduling policy at a refusal-gated or forced level.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-interaction
    topics:
    - session-management
    - task-automation
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  - scheduled-job
  persistent_modifier: false
exports:
  llm-wakeup.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: llm-wakeup.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: llm-wakeup
namespace_exports:
  _rtx:
    version: 1
    access: {allow_all_modules: true, allowed_callers: []}
    surface:
      only:
        llm-wakeup._rtx.interface.auto-policy: 1
        llm-wakeup._rtx.interface.infer-schedule: 1
        llm-wakeup._rtx.interface.explicit-schedule: 1
        llm-wakeup._rtx.interface.setup: 1
        llm-wakeup._rtx.interface.teardown: 1
        llm-wakeup._rtx.interface.setup-status: 1
        llm-wakeup._rtx.interface.teardown-status: 1
    interface_access:
      llm-wakeup._rtx.interface.auto-policy: {allow_all_modules: true, allowed_callers: []}
      llm-wakeup._rtx.interface.infer-schedule: {allow_all_modules: true, allowed_callers: []}
      llm-wakeup._rtx.interface.explicit-schedule: {allow_all_modules: true, allowed_callers: []}
      llm-wakeup._rtx.interface.setup: {allow_all_modules: true, allowed_callers: []}
      llm-wakeup._rtx.interface.teardown: {allow_all_modules: true, allowed_callers: []}
      llm-wakeup._rtx.interface.setup-status: {allow_all_modules: true, allowed_callers: []}
      llm-wakeup._rtx.interface.teardown-status: {allow_all_modules: true, allowed_callers: []}
node_type: module
schema_version: 6
sources:
  llm-wakeup.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 1
maturity: stable
installation_tier: core
personal_preference:
  applies: false
