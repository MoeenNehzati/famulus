authority:
  owns_filesystem: []
children: {}
content:
- SKILL\.md
description: Routes assistant requests to guarded supported-session wakeup scheduling
  and per-session automatic scheduling policy at a refusal-gated or forced level.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-interaction
    topics:
    - session-management
    - task-automation
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  - scheduled-job
  persistent_modifier: false
exports:
  llm-wakeup.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: llm-wakeup.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: llm-wakeup
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  llm-wakeup.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 1
