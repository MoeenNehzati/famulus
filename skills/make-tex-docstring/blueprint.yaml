authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Creates a canonical top-of-document TeX profile block from reliable document
  evidence and inserts it only with user approval.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - scholarly-documents
    - research-writing
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  make-tex-docstring.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: make-tex-docstring.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: make-tex-docstring
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  make-tex-docstring.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
