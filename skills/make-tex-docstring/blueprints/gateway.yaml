content:
- SKILL\.md
dependencies: []
description: Implements document-profile inspection, reliable field inference, clarification,
  canonical block proposal, and approval-gated TeX insertion.
gateway:
  language: Markdown
  path: SKILL.md
id: make-tex-docstring.source.gateway
interfaces:
  make-tex-docstring.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Target TeX document or supplied content plus the request to
            inspect, create, standardize, or insert its profile comment.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Inserting or revising the profile block changes the
          TeX source and occurs only after explicit user approval.
      direct_io:
        network: []
        reads:
        - access: read
          content: TeX profile request and conversation evidence.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Target TeX source and existing top-of-document comments.
          formats:
          - tex
          - text
          id: tex-read
          medium: local-filesystem
          reason: Detect a suitable profile and infer only supported fields.
          sensitivity: user-private
        - access: read
          content: Canonical profile fields, TeX template, and inference rules.
          formats:
          - markdown
          id: profile-standard
          medium: repository-filesystem
          path: references/document-standards/document-profile.md
          path_match: exact
          reason: Produce the shared canonical block.
          sensitivity: public
        writes:
        - access: write
          content: Profile assessment, canonical block, and insertion result.
          formats:
          - markdown
          - tex
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: User-approved canonical top-of-document TeX profile comment.
          formats:
          - tex
          - text
          id: tex-write
          medium: local-filesystem
          reason: Insert or revise the profile only after approval.
          sensitivity: user-private
      execution:
        consistency:
          snapshot: Inference and insertion use the target document and canonical
            standard read during this invocation.
        effects:
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: tex-write
          id: profile-update
          may_occur_in_outcomes:
          - inserted
          reversibility:
            reversible: Remove or restore the reviewed top-of-document comment block.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: The approved source edit is one coherent file update.
          concurrent_invocations:
            unsafe: Concurrent edits to the same TeX source can overwrite one another.
          idempotency:
            idempotent: A suitable existing canonical block produces no additional
              insertion.
          on_uncertain_completion:
            verify_then_decide: Re-read the top of the target file before retrying.
          partial_effects_on_failure:
            impossible: The intended update is one file edit and success is checked
              by reading it back.
          rollback_on_failure:
            available: Restore the prior reviewed file content if the edit is incorrect.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: tex-read
          method: direct-io-state
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: approval-required
      outcomes:
      - caller_action: Preserve the existing suitable profile block.
        class: no-op
        effects: []
        id: already-suitable
        outputs:
        - response
      - caller_action: Review the canonical block and approve insertion if desired.
        class: success
        effects: []
        id: proposed
        outputs:
        - response
      - caller_action: Supply unresolved fields or explicitly approve insertion or
          revision.
        class: refusal
        effects: []
        id: approval-required
        outputs:
        - response
      - caller_action: Review the top-of-document block and file verification.
        class: success
        effects:
        - profile-update
        id: inserted
        outputs:
        - response
      - caller_action: Correct the target or unresolved profile information before
          retrying.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Existing-docstring assessment, missing fields, canonical proposed
          block, approval request, or verified insertion result.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Inspect a TeX document against the canonical profile standard, infer
      cautiously, and gate any edit on approval.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces: []
version: 1
