content:
- _handoff_calibrate\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-handoff-scan.yaml
  reason: Imports Python source from _rtx/_handoff_scan.py.
  source: find-handoff-candidates._rtx.source.rtx-handoff-scan
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: find-handoff-candidates._rtx.source.rtx-init
  version: 1
description: Reads recent configured session transcripts and prints per-source net-character
  and line-count statistics against current scan thresholds.
gateway:
  language: Python
  path: _handoff_calibrate.py
id: find-handoff-candidates._rtx.source.rtx-handoff-calibrate
interfaces:
  find-handoff-candidates._rtx.source.rtx-handoff-calibrate.interface.calibrate:
    contract:
      arguments:
        days:
          default: 5
          description: Lookback window in days used to select session files by modification
            time.
          required: false
          sensitivity: public
          type:
            kind: integer
            minimum: 0
            unit: days
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: session-transcript
          formats:
          - jsonl
          id: read-1
          medium: home-filesystem
          path: <configured-project-session-home>/projects/**/*.jsonl
          path_match: glob
          sensitivity: user-private
          system: session-store
        - access: read
          content: session-transcript
          formats:
          - jsonl
          id: read-2
          medium: home-filesystem
          path: <configured-rollout-session-home>/sessions/**/*.jsonl
          path_match: glob
          sensitivity: user-private
          system: session-store
        writes:
        - access: write
          content: threshold-calibration-report
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          best_effort: Files that disappear or become unreadable during collection
            are skipped; statistics cover successfully read recent sessions.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: statistics
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Compare the statistics with current thresholds and make any
          parser-default edit manually.
        class: success
        effects: []
        id: completed
        outputs:
        - statistics
      - caller_action: Report the diagnostic failure; no threshold file was modified.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Per-source session counts, net-character and line-count statistics,
          current thresholds, and counts exceeding them.
        direct_io_ref: write-1
        empty: A per-source no-sessions message is printed when a source has no files
          in the lookback window.
        id: statistics
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Re-derive reference median/p75/p90 gap-size statistics per host from
      real transcripts in a lookback window, to check whether scan's default thresholds
      still make sense. Diagnostic only -- does not modify any parser file; read the
      output and edit the relevant parser's default_threshold by hand if it suggests
      new numbers.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --days
        flag_patterns:
          --days: ^[0-9]+$
        max_positionals: 0
        min_positionals: 0
        notes: No positionals. --days sets the lookback window (default 5). Output
          is human-readable per-host stats to stdout, not JSON -- this is a manual
          diagnostic tool, not meant for programmatic consumption.
    usage: '[--days N]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
