authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Mechanically identifies session transcripts with substantial work since
  their last completed handoff and provides threshold-calibration diagnostics.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-interaction
    topics:
    - session-management
    - task-automation
    visibility: hidden
  activated_by:
  - skill-workflow
  persistent_modifier: false
exports:
  find-handoff-candidates.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: find-handoff-candidates.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: find-handoff-candidates
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        find-handoff-candidates._rtx.interface.calibrate: 1
        find-handoff-candidates._rtx.interface.scan: 1
    interface_access:
      find-handoff-candidates._rtx.interface.calibrate:
        allow_all_modules: false
        allowed_callers: []
      find-handoff-candidates._rtx.interface.scan:
        allow_all_modules: true
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  find-handoff-candidates.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: stable
installation_tier: core
personal_preference:
  applies: false
