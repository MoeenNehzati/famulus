authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - args_prefix:
      - --caller-skill
      - find-handoff-candidates
      - find-handoff-candidates.machine.scan
      command:
      - dispatcher
      reason: Read-only scan of local session transcript files; no writes, no network.
    - args_prefix:
      - --caller-skill
      - find-handoff-candidates
      - find-handoff-candidates.machine.calibrate
      command:
      - dispatcher
      reason: Read-only diagnostic tool for re-deriving default threshold reference
        numbers; no writes, no network.
    network: []
category: workflow-general-assistant
content:
- SKILL\.md
- _rtx/__init__\.py
- _rtx/_claude_parser\.py
- _rtx/_codex_parser\.py
- _rtx/_handoff_calibrate\.py
- _rtx/_handoff_scan\.py
- tests/test_parsers\.py
- tests/test_scan\.py
description: Mechanically identifies session transcripts with substantial work since their last completed handoff and provides threshold-calibration diagnostics.
discovery:
  mechanism: skill
exports:
  find-handoff-candidates.interface.calibrate:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: find-handoff-candidates.source.rtx-handoff-calibrate.interface.calibrate
  find-handoff-candidates.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: find-handoff-candidates.source.gateway.interface.default
  find-handoff-candidates.interface.scan:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: find-handoff-candidates.source.rtx-handoff-scan.interface.scan
gateway:
  language: Markdown
  path: SKILL.md
id: find-handoff-candidates
kind: analyzer
node_type: module
role: automation
schema_version: 4
sources:
  find-handoff-candidates.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  find-handoff-candidates.source.rtx-handoff-calibrate:
    blueprint:
      base: module-root
      path: blueprints/rtx-handoff-calibrate.yaml
  find-handoff-candidates.source.rtx-handoff-scan:
    blueprint:
      base: module-root
      path: blueprints/rtx-handoff-scan.yaml
  find-handoff-candidates.source.rtx-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-init.yaml
version: 1
