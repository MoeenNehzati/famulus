authority:
  owns_filesystem: []
children:
  find-handoff-candidates-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Mechanically identifies session transcripts with substantial work since
  their last completed handoff and provides threshold-calibration diagnostics.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-interaction
    topics:
    - session-management
    - task-automation
    visibility: hidden
  activated_by:
  - skill-workflow
  persistent_modifier: false
exports:
  find-handoff-candidates.interface.calibrate:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: find-handoff-candidates-rtx.interface.calibrate
      version: 1
  find-handoff-candidates.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: find-handoff-candidates.source.gateway.interface.default
  find-handoff-candidates.interface.scan:
    access:
      allow_all_modules: true
      allowed_callers: []
    facade_interface:
      interface: find-handoff-candidates-rtx.interface.scan
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: find-handoff-candidates
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  find-handoff-candidates.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
