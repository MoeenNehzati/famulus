authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Prepares evidence-faithful, redacted Famulus problem reports and delivers
  them only after review, as a public issue on the repository-configured project or
  to the repository-configured feedback address.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - communications
    - assistant-assurance
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  send-feedback.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: send-feedback.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: send-feedback
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        send-feedback._rtx.interface.check-route: 1
        send-feedback._rtx.interface.file-issue: 1
    interface_access:
      send-feedback._rtx.interface.check-route:
        allow_all_modules: true
        allowed_callers: []
      send-feedback._rtx.interface.file-issue:
        allow_all_modules: true
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  send-feedback.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
