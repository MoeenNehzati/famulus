content:
- _github_issue\.py
dependencies: []
description: Reports the available feedback delivery route and files a reviewed report
  as a public issue on the repository-configured code-hosting project.
gateway:
  language: Python
  path: _github_issue.py
id: send-feedback._rtx.source.rtx-github-issue
interfaces:
  send-feedback._rtx.source.rtx-github-issue.interface.check-route:
    contract:
      arguments: {}
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: Feedback repository and address from the exact owning repository
            configuration resolved through this source's real filesystem path.
          formats:
          - toml
          id: feedback-config
          medium: repository-filesystem
          path: officina.toml
          path_match: exact
          sensitivity: user-private
        - access: read
          content: Local availability and authentication state of the configured
            issue-filing command.
          formats:
          - text
          id: route-probe
          medium: subprocess
          sensitivity: user-private
        writes:
        - access: write
          content: Resolved repository and delivery route.
          formats:
          - json
          id: route-report
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: route-diagnostic
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: The route reflects the command availability and authentication state
            observed during this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: route
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Present the resolved repository and route in the delivery
          preview, and relay the remediation text when the direct route is
          unavailable, before requesting approval.
        class: success
        effects: []
        id: completed
        outputs:
        - route
      - caller_action: Repair the missing or invalid feedback repository value in the
          owning repository's exact configuration before retrying.
        class: error
        effects: []
        id: configuration-error
        outputs:
        - diagnostic
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 0
        description: One JSON object naming the configured repository and feedback
          address, whether the issue-filing command is installed and authenticated,
          the authenticated account when known, the resulting route, and the
          remediation text to relay when the direct route is unavailable.
        direct_io_ref: route-report
        empty: Empty when the configured repository cannot be resolved.
        id: route
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      - audience: human
        cardinality:
          maximum: 1
          minimum: 0
        description: Plain error identifying the missing or invalid feedback repository
          configuration.
        direct_io_ref: route-diagnostic
        empty: Empty after a successful route report.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Report the configured feedback repository and which delivery route
      is currently available.
    process_binding:
      entry: CheckRoute
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags: []
        max_positionals: 0
        min_positionals: 0
    usage: ''
    version: 1
  send-feedback._rtx.source.rtx-github-issue.interface.file-issue:
    contract:
      arguments:
        body-file:
          description: Path to the reviewed report file used as the issue body.
          direct_io_ref: report-body
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        title:
          description: Issue title summarizing the reported problem.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: On the command route this publishes the report as a
          public issue on the configured repository, which cannot be recalled by this
          interface.
      direct_io:
        network: []
        reads:
        - access: read
          content: Feedback repository from the exact owning repository configuration
            resolved through this source's real filesystem path.
          formats:
          - toml
          id: issue-config
          medium: repository-filesystem
          path: officina.toml
          path_match: exact
          sensitivity: user-private
        - access: read
          content: Reviewed report used as the issue body.
          formats:
          - text
          id: report-body
          medium: local-filesystem
          path: caller-supplied report file
          sensitivity: user-private
        writes:
        - access: write
          content: Filed issue location or prepared submission URL.
          formats:
          - json
          id: issue-result
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: issue-diagnostic
          medium: stderr
          sensitivity: derived-private
        - access: send
          content: Reviewed report published as a public issue on the configured
            repository.
          formats:
          - text
          id: published-issue
          medium: network
          sensitivity: user-private
      execution:
        consistency:
          per_source: The result reflects the repository and route resolved during
            this invocation.
        effects:
        - action: create
          confirmation_evidence:
            direct_io_ref: issue-result
            kind: direct-io
          direct_io_ref: published-issue
          id: publish-issue
          may_occur_in_outcomes:
          - filed
          reversibility:
            irreversible: A published public issue cannot be recalled by this
              interface.
          value_source:
            argument_ref: body-file
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: One invocation files at most one issue.
          concurrent_invocations:
            unsafe: Concurrent invocations of the same report can publish duplicate
              issues.
          idempotency:
            non_idempotent: Repeating a successful invocation files another issue.
          on_uncertain_completion:
            stop: Do not retry when the command fails or the issue location is
              unconfirmed.
          partial_effects_on_failure:
            impossible: A failed invocation publishes nothing.
          rollback_on_failure:
            unavailable: A published issue cannot be withdrawn by this interface.
        state_effect: mutating
        verification:
        - direct_io_ref: issue-result
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Report the filed issue location to the user.
        class: success
        effects:
        - publish-issue
        id: filed
        outputs:
        - result
      - caller_action: Relay the remediation text so the user can install or sign in
          to the issue-filing command, then give the prepared submission URL to review
          and submit, saying when the body did not fit so they paste the retained
          report.
        class: partial
        effects: []
        id: submission-prepared
        outputs:
        - result
      - caller_action: Preserve the report, resolve the configuration or filing
          failure, and do not retry automatically.
        class: error
        effects: []
        id: filing-failed
        outputs:
        - diagnostic
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 0
        description: One JSON object naming the route taken, the repository, the filed
          issue or prepared submission URL, whether the body was included, the
          authenticated account when known, and the remediation text to relay when
          the direct route is unavailable.
        direct_io_ref: issue-result
        empty: Empty when configuration resolution or filing fails.
        id: result
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      - audience: human
        cardinality:
          maximum: 1
          minimum: 0
        description: Plain error identifying the invalid configuration, missing report
          file, or unconfirmed filing attempt.
        direct_io_ref: issue-diagnostic
        empty: Empty after a filed issue or a prepared submission URL.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions:
      - caller_action: Supply the reviewed report file the user approved.
        check:
          direct_io_ref: report-body
          kind: direct-io
          predicate: readable
        description: The report file exists and holds the text the user approved.
        id: report-readable
        unmet_outcome: filing-failed
    description: File a reviewed report as a public issue, or return a prepared
      submission URL when the issue-filing command is unavailable.
    process_binding:
      entry: FileIssue
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --title
        - --body-file
        flag_patterns:
          --body-file: ^.+$
          --title: ^.+$
        max_positionals: 0
        min_positionals: 0
    usage: --title <title> --body-file <path>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces: []
version: 1
