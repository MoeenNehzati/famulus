authority:
  owns_filesystem: []
children:
  get-weather-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Resolves a current or named location and returns planning-oriented weather
  forecasts for requested dates.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - planning
    - external-integrations
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  get-weather.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: get-weather.source.gateway.interface.default
  get-weather.interface.scripts-weather:
    access:
      allow_all_modules: true
      allowed_callers: []
    facade_interface:
      interface: get-weather-rtx.interface.scripts-weather
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: get-weather
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  get-weather.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
