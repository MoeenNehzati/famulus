authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_weather_client.py:Interface
      reason: Weather lookup tool.
    network: []
category: productivity-general-assistant
content:
- SKILL\.md
- _rtx/_weather_client\.py
description: Resolves a current or named location and returns planning-oriented weather forecasts for requested dates.
discovery:
  mechanism: skill
exports:
  get-weather.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: get-weather.source.gateway.interface.default
  get-weather.interface.scripts-weather:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: get-weather.source.rtx-weather-client.interface.scripts-weather
gateway:
  language: Markdown
  path: SKILL.md
id: get-weather
kind: client
node_type: module
role: productivity
schema_version: 4
sources:
  get-weather.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  get-weather.source.rtx-weather-client:
    blueprint:
      base: module-root
      path: blueprints/rtx-weather-client.yaml
version: 1
