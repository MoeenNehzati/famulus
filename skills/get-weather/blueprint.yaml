authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Resolves a current or named location and returns planning-oriented weather
  forecasts for requested dates.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - planning
    - external-integrations
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  get-weather.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: get-weather.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: get-weather
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        get-weather._rtx.interface.scripts-weather: 1
    interface_access:
      get-weather._rtx.interface.scripts-weather:
        allow_all_modules: true
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  get-weather.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
