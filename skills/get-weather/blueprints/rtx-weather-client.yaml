content:
- _rtx/_weather_client\.py
dependencies: []
description: Resolves a named place or the caller's current IP location and requests hourly Open-Meteo forecast data for an inclusive date range.
gateway:
  language: Python
  path: _rtx/_weather_client.py
id: get-weather.source.rtx-weather-client
interfaces:
  get-weather.source.rtx-weather-client.interface.scripts-weather:
    contract:
      arguments:
        date:
          description: Inclusive forecast start date, defaulting to the local current date.
          required: false
          default: current-local-date
          sensitivity: public
          type:
            kind: date
            date_formats: [YYYY-MM-DD]
        end-date:
          description: Inclusive forecast end date, defaulting to the start date.
          required: false
          sensitivity: public
          type:
            kind: date
            date_formats: [YYYY-MM-DD]
        location:
          description: Optional named location; when omitted, the interface geolocates the caller's public IP address.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: forecast
        audience: machine
        description: One compact JSON object containing resolved dates, place, coordinates, timezone, and hourly weather arrays.
        direct_io_ref: write-1
        type:
          kind: string
          sensitivity: user-private
          format:
            named: json
        cardinality:
          minimum: 0
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Empty when validation, geolocation, geocoding, or forecast retrieval fails.
      - id: diagnostic
        audience: human
        description: Plain error identifying an invalid date range, unresolved location, geolocation failure, or forecast-service failure.
        direct_io_ref: write-2
        type:
          kind: string
          sensitivity: derived-private
        cardinality:
          minimum: 0
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Empty after a successful forecast lookup.
      outcomes:
      - id: completed
        class: success
        outputs: [forecast]
        effects: []
        caller_action: Interpret the hourly arrays into the requested planning-oriented summary.
      - id: invalid-date-range
        class: error
        outputs: [diagnostic]
        effects: []
        caller_action: Supply an end date that is not before the start date.
      - id: location-not-found
        class: error
        outputs: [diagnostic]
        effects: []
        caller_action: Report the unresolved named location without substituting another result.
      - id: service-failed
        class: error
        outputs: [diagnostic]
        effects: []
        caller_action: Report the geolocation, forecast, or network error and stop.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          live: Location and forecast values are obtained from the external services during this invocation.
        verification:
        - method: output-schema
          output_ref: forecast
      helpers: []
      direct_io:
        network:
        - access: request
          content: location
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: open-meteo-geocoding
          endpoint: https://geocoding-api.open-meteo.com/v1/search?name=<location>&count=1
        - access: request
          content: location
          formats:
          - json
          id: network-2
          medium: network-request
          sensitivity: user-private
          system: ip-geolocation
          endpoint: http://ip-api.com/json/
        - access: request
          content: forecast
          formats:
          - json
          id: network-3
          medium: network-request
          sensitivity: user-private
          system: open-meteo-forecast
          endpoint: https://api.open-meteo.com/v1/forecast
        reads: []
        writes:
        - access: write
          content: forecast
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
    description: Fetch weather data for a location and date range, returning hourly
      forecast JSON.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --date
        - --end-date
        - --location
        flag_patterns:
          --date: ^\d{4}-\d{2}-\d{2}$
          --end-date: ^\d{4}-\d{2}-\d{2}$
          --location: ^.+$
        max_positionals: 0
        min_positionals: 0
    usage: '[--date <YYYY-MM-DD>] [--end-date <YYYY-MM-DD>] [--location <loc>]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
