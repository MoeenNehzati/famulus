content:
- SKILL\.md
dependencies: []
description: Converts a natural-language weather request into concrete dates and location arguments, then summarizes hourly forecast JSON for practical planning.
gateway:
  language: Markdown
  path: SKILL.md
id: get-weather.source.gateway
interfaces:
  get-weather.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: User weather request including any named location, relative or exact dates, and planning context.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings: []
      outputs:
      - id: response
        audience: human
        description: Concise day-by-day forecast summary with conditions, temperature range, notable rain or wind, and practical guidance.
        direct_io_ref: write-1
        type:
          kind: string
          sensitivity: derived-private
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
      outcomes:
      - id: completed
        class: success
        outputs: [response]
        effects: []
        caller_action: Present the forecast and echo resolved dates and location when the user supplied them.
      - id: lookup-failed
        class: error
        outputs: []
        effects: []
        caller_action: Report the interface error plainly without guessing another date or location.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          live: The summary is derived from the live location resolution and hourly forecast returned for this request.
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      direct_io:
        network: []
        reads:
        - access: read
          content: plan-request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: forecast
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
    description: Primary LLM-facing skill instructions.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
