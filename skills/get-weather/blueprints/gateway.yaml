content:
- SKILL\.md
dependencies: []
description: Converts a natural-language weather request into concrete dates and location
  arguments, then summarizes hourly forecast JSON for practical planning.
gateway:
  language: Markdown
  path: SKILL.md
id: get-weather.source.gateway
interfaces:
  get-weather.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: get-weather._rtx.interface.scripts-weather
      version: 1
    contract:
      arguments:
        request:
          description: User weather request including any named location, relative
            or exact dates, and planning context.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: plan-request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: forecast
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          live: The summary is derived from the live location resolution and hourly
            forecast returned for this request.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Present the forecast and echo resolved dates and location when
          the user supplied them.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Report the interface error plainly without guessing another
          date or location.
        class: error
        effects: []
        id: lookup-failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Concise day-by-day forecast summary with conditions, temperature
          range, notable rain or wind, and practical guidance.
        direct_io_ref: write-1
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: get-weather._rtx.interface.scripts-weather
  version: 1
version: 1
maturity: stable
