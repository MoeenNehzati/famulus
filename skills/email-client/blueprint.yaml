authority:
  owns_filesystem: []
children:
  email-client-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Read, search, download from, configure, verify, and send email through
  registered IMAP and SMTP accounts while keeping credentials in the host credential
  store.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - communications
    - external-integrations
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  email-client.interface.accounts-add:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.accounts-add
      version: 1
  email-client.interface.accounts-list:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.accounts-list
      version: 1
  email-client.interface.accounts-remove:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.accounts-remove
      version: 1
  email-client.interface.accounts-set-password:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.accounts-set-password
      version: 1
  email-client.interface.accounts-setup-oauth:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.accounts-setup-oauth
      version: 1
  email-client.interface.accounts-update:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.accounts-update
      version: 1
  email-client.interface.accounts-use-google-credential:
    access:
      allow_all_modules: false
      allowed_callers:
      - install-assistant-tools
      - install-assistant-tools-rtx
    facade_interface:
      interface: email-client-rtx.interface.accounts-use-google-credential
      version: 1
  email-client.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: email-client.source.gateway.interface.default
  email-client.interface.live-smoke:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.live-smoke
      version: 1
  email-client.interface.mail-attachments:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.mail-attachments
      version: 1
  email-client.interface.mail-folders:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.mail-folders
      version: 1
  email-client.interface.mail-list:
    access:
      allow_all_modules: false
      allowed_callers:
      - email-triage
      - email-triage-rtx
    facade_interface:
      interface: email-client-rtx.interface.mail-list
      version: 1
  email-client.interface.mail-read:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.mail-read
      version: 1
  email-client.interface.mail-save-attachments:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.mail-save-attachments
      version: 1
  email-client.interface.send-email:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: email-client-rtx.interface.send-email
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: email-client
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  email-client.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
