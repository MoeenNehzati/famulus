authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_smtp_transport.py
      - Interface
      reason: Send-side SMTP client (compose/send), stdlib SMTP plus shared secret
        store.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_imap_gateway.py
      - Interface
      reason: Read-side IMAP client (list/read/folders), stdlib-only, no external
        binary.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_email_accounts.py
      - Interface
      reason: 'Account registry: add/update/remove/list nicknames and set credentials.'
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_email_smoke.py
      - Interface
      reason: Explicit live provider smoke checks for configured email accounts.
    network: []
category: productivity-general-assistant
content:
- SKILL\.md
- _rtx/__init__\.py
- _rtx/_email_accounts\.py
- _rtx/_email_smoke\.py
- _rtx/_imap_gateway\.py
- _rtx/_oauth_tokens\.py
- _rtx/_smtp_transport\.py
- tests/test_accounts\.py
- tests/test_mail\.py
- tests/test_oauth_tokens\.py
- tests/test_smoke\.py
discovery:
  mechanism: skill
description: Read, search, download from, configure, verify, and send email through
  registered IMAP and SMTP accounts while keeping credentials in the host credential
  store.
exports:
  email-client.interface.accounts-add:
