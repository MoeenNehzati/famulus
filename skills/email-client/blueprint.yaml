authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|instructions/setup\.md)
description: Read, search, download from, configure, verify, and send email through
  registered IMAP and SMTP accounts while keeping credentials in the host credential
  store.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - communications
    - external-integrations
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  email-client.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: email-client.source.gateway.interface.default
  email-client.interface.setup:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: email-client.source.setup.interface.setup
    setup_requires_setup_of:
    - {interface: connect-google.interface.setup, version: 1}
gateway:
  language: Markdown
  path: SKILL.md
id: email-client
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        email-client._rtx.interface.accounts-add: 1
        email-client._rtx.interface.accounts-list: 1
        email-client._rtx.interface.accounts-remove: 1
        email-client._rtx.interface.accounts-set-password: 1
        email-client._rtx.interface.accounts-setup-oauth: 1
        email-client._rtx.interface.accounts-update: 1
        email-client._rtx.interface.accounts-use-google-credential: 1
        email-client._rtx.interface.accounts-use-google-credential-file: 1
        email-client._rtx.interface.live-smoke: 1
        email-client._rtx.interface.mail-attachments: 1
        email-client._rtx.interface.mail-folders: 1
        email-client._rtx.interface.mail-list: 1
        email-client._rtx.interface.mail-read: 1
        email-client._rtx.interface.mail-save-attachments: 1
        email-client._rtx.interface.send-email: 1
    interface_access:
      email-client._rtx.interface.accounts-add:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.accounts-list:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.accounts-remove:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.accounts-set-password:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.accounts-setup-oauth:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.accounts-update:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.accounts-use-google-credential:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.accounts-use-google-credential-file:
        allow_all_modules: false
        allowed_callers:
        - connect-google
        - connect-google._rtx
      email-client._rtx.interface.live-smoke:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.mail-attachments:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.mail-folders:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.mail-list:
        allow_all_modules: false
        allowed_callers:
        - email-triage
        - email-triage._rtx
      email-client._rtx.interface.mail-read:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.mail-save-attachments:
        allow_all_modules: false
        allowed_callers: []
      email-client._rtx.interface.send-email:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  email-client.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  email-client.source.setup:
    blueprint:
      base: module-root
      path: blueprints/setup.yaml
version: 2
maturity: stable
installation_tier: optional
personal_preference:
  applies: false
