content:
- _imap_gateway\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-email-accounts.yaml
  reason: Executes the sibling account gateway to resolve the selected account.
  source: email-client._rtx.source.rtx-email-accounts
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-client._rtx.source.rtx-init
  version: 1
description: Python IMAP source for listing folders and envelopes, reading messages,
  inspecting attachment metadata, and saving selected attachments.
gateway:
  language: Python
  path: _imap_gateway.py
id: email-client._rtx.source.rtx-imap-gateway
interfaces:
  email-client._rtx.source.rtx-imap-gateway.interface.mail-attachments:
    contract:
      arguments:
        account:
          description: Registered account nickname used for IMAP authentication
          required: true
          sensitivity: user-private
          type:
            format:
              named: identifier
            kind: string
        folder:
          default: inbox
          description: Folder alias or literal IMAP folder name
          required: false
          sensitivity: user-private
          type:
            kind: string
        uids:
          description: One or more IMAP UIDs whose attachment metadata should be returned
          required: true
          sensitivity: user-private
          type:
            element_type:
              format:
                regex:
                  dialect: python
                  example: '42'
                  matching: full
                  pattern: ^[0-9]+$
              kind: string
            kind: list
      caller_warnings:
      - may-wait: Retrieves and parses each requested message from the live IMAP server.
      - rate-limited: Provider IMAP limits and connection policies apply.
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: email-attachment
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email-attachment
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Reads current message content from the selected IMAP folder.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: attachments
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Consume the returned JSON records.
        class: success
        effects: []
        id: success
        outputs:
        - attachments
      - caller_action: Correct the account, folder, UID, credential, or provider error
          before retrying.
        class: error
        effects: []
        id: error
        outputs:
        - diagnostic
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON array with one record per UID and structured attachment
          metadata.
        direct_io_ref: write-1
        empty: Messages with no attachments are represented by records containing
          empty attachment arrays.
        id: attachments
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: List attachment metadata for one or more emails as JSON. Returns
      one record per requested UID with attachment entries containing filename, content_type,
      size_bytes, size_human, and disposition.
    process_binding:
      args_prefix:
      - attachments
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        flag_patterns:
          --folder: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        min_positionals: 1
        name: short-account
        required_flags:
        - -a
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
        flag_patterns:
          --account: ^.+$
          --folder: ^.+$
        forbidden_flags:
        - -a
        min_positionals: 1
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname> [--folder inbox|sent|drafts|trash|all|<literal>] <uid> [<uid>
      ...]
    version: 1
  email-client._rtx.source.rtx-imap-gateway.interface.mail-folders:
    contract:
      arguments:
        account:
          description: Registered account nickname used for IMAP authentication
          required: true
          sensitivity: user-private
          type:
            format:
              named: identifier
            kind: string
      caller_warnings:
      - rate-limited: Provider IMAP limits and connection policies apply.
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: mailbox
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: mailbox
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Lists folders from the current IMAP account state.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: folders
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use a returned folder name or a supported alias in later reads.
        class: success
        effects: []
        id: success
        outputs:
        - folders
      - caller_action: Correct the account, credential, or provider error before retrying.
        class: error
        effects: []
        id: error
        outputs:
        - diagnostic
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON array of folder names returned by IMAP LIST.
        direct_io_ref: write-1
        empty: An account with no visible folders returns an empty JSON array.
        id: folders
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: List IMAP folders for an account (JSON).
    process_binding:
      args_prefix:
      - folders
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - -a
        flag_patterns:
          -a: ^.+$
        forbidden_flags:
        - --account
        max_positionals: 0
        min_positionals: 0
        name: short-account
        required_flags:
        - -a
      - allowed_flags:
        - --account
        flag_patterns:
          --account: ^.+$
        forbidden_flags:
        - -a
        max_positionals: 0
        min_positionals: 0
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname>
    version: 1
  email-client._rtx.source.rtx-imap-gateway.interface.mail-list:
    contract:
      arguments:
        account:
          description: Registered account nickname used for IMAP authentication
          required: true
          sensitivity: user-private
          type:
            format:
              named: identifier
            kind: string
        after:
          description: Optional inclusive server-side IMAP SINCE date
          required: false
          sensitivity: user-private
          type:
            date_formats:
            - YYYY-MM-DD
            kind: date
        filters:
          default: []
          description: Optional exact or case-insensitive regular-expression envelope
            filters
          required: false
          sensitivity: user-private
          type:
            element_type:
              kind: string
            kind: list
        folder:
          default: inbox
          description: Folder alias or literal IMAP folder name
          required: false
          sensitivity: user-private
          type:
            kind: string
        limit:
          description: Optional maximum number of newest matching envelopes
          required: false
          sensitivity: public
          type:
            kind: integer
            minimum: 1
            unit: count
      caller_warnings:
      - may-wait: An unfiltered and undated request scans and fetches headers for
          the whole selected folder.
      - rate-limited: Provider IMAP limits and connection policies apply.
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: email
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Searches and fetches headers from current IMAP folder state during
            the invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: envelopes
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Consume the returned envelopes and use their id fields as IMAP
          UIDs.
        class: success
        effects: []
        id: success
        outputs:
        - envelopes
      - caller_action: Correct the account, folder, date, filter, credential, or provider
          error before retrying.
        class: error
        effects: []
        id: error
        outputs:
        - diagnostic
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON array of matching envelopes sorted by ascending numeric
          UID.
        direct_io_ref: write-1
        empty: No matching messages returns an empty JSON array.
        id: envelopes
        ordering: sorted
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: 'List email envelopes for an account as JSON (fields: id, flags,
      subject, from, date, message_id). --folder accepts aliases inbox|sent|drafts|trash|all
      or any literal IMAP folder name (default inbox). --after narrows server-side
      by day (IMAP SINCE). Filters are key=value (exact, comma-separated=OR) or key~=value
      (regex, case-insensitive) over id/subject/from/date/message_id/flags, ANDed
      across distinct keys, applied client-side after fetch. Unfiltered + undated
      scans the whole folder (slow on large mailboxes) — pair filters with --after.'
    process_binding:
      args_prefix:
      - list
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        - --after
        - --limit
        flag_patterns:
          --after: ^.+$
          --folder: ^.+$
          --limit: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        min_positionals: 0
        name: short-account
        required_flags:
        - -a
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
        - --after
        - --limit
        flag_patterns:
          --account: ^.+$
          --after: ^.+$
          --folder: ^.+$
          --limit: ^.+$
        forbidden_flags:
        - -a
        min_positionals: 0
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname> [--folder inbox|sent|drafts|trash|all|<literal>] [--after
      YYYY-MM-DD] [key=value|key~=value ...] [--limit N]
    version: 1
  email-client._rtx.source.rtx-imap-gateway.interface.mail-read:
    contract:
      arguments:
        account:
          description: Registered account nickname used for IMAP authentication
          required: true
          sensitivity: user-private
          type:
            format:
              named: identifier
            kind: string
        folder:
          default: inbox
          description: Folder alias or literal IMAP folder name
          required: false
          sensitivity: user-private
          type:
            kind: string
        uid:
          description: IMAP UID from mail-list identifying the message to read
          required: true
          sensitivity: user-private
          type:
            format:
              regex:
                dialect: python
                example: '42'
                matching: full
                pattern: ^[0-9]+$
            kind: string
      caller_warnings:
      - rate-limited: Provider IMAP limits and connection policies apply.
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: email
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - rfc822
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Fetches the selected message from current IMAP folder state.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: message
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Present or analyze the returned message text as requested.
        class: success
        effects: []
        id: success
        outputs:
        - message
      - caller_action: Correct the account, folder, UID, credential, or provider error
          before retrying.
        class: error
        effects: []
        id: error
        outputs:
        - diagnostic
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Decoded message headers, attachment summary, and readable body
          text.
        direct_io_ref: write-1
        empty: A message without a readable MIME body includes an explicit no-readable-body
          marker.
        id: message
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Human-readable email view
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Read one email by UID (the "id" field from mail-list). Prints Subject/From/To/
      Date/Message-ID, then In-Reply-To/References only if the message is a reply,
      then an Attachments section (none or one line per attachment with filename,
      MIME type, and size), then a blank line, then the decoded body (text/plain preferred;
      falls back to HTML with tags stripped).
    process_binding:
      args_prefix:
      - read
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - -a
        - --folder
        flag_patterns:
          --folder: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        max_positionals: 1
        min_positionals: 1
        name: short-account
        required_flags:
        - -a
      - allowed_flags:
        - --account
        - --folder
        flag_patterns:
          --account: ^.+$
          --folder: ^.+$
        forbidden_flags:
        - -a
        max_positionals: 1
        min_positionals: 1
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname> [--folder inbox|sent|drafts|trash|all|<literal>] <uid>
    version: 1
  email-client._rtx.source.rtx-imap-gateway.interface.mail-save-attachments:
    contract:
      arguments:
        account:
          description: Registered account nickname used for IMAP authentication
          required: true
          sensitivity: user-private
          type:
            format:
              named: identifier
            kind: string
        all:
          default: false
          description: Save every attachment in each requested message
          required: false
          sensitivity: public
          type:
            kind: flag
        folder:
          default: inbox
          description: Folder alias or literal IMAP folder name
          required: false
          sensitivity: user-private
          type:
            kind: string
        names:
          default: []
          description: Repeated attachment filenames to save when all is false
          required: false
          sensitivity: user-private
          type:
            element_type:
              kind: string
            kind: list
        out:
          description: Destination directory for saved attachments
          direct_io_ref: write-1
          required: true
          sensitivity: user-private
          type:
            access: write
            entry_type:
              access: write
              kind: file
              must_exist: false
              opaque_content: true
              relative_to: caller-cwd
              syntax: literal
            kind: dir
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
        uids:
          description: One or more IMAP UIDs whose attachments should be saved
          required: true
          sensitivity: user-private
          type:
            element_type:
              format:
                regex:
                  dialect: python
                  example: '42'
                  matching: full
                  pattern: ^[0-9]+$
              kind: string
            kind: list
      caller_warnings:
      - external-side-effect: Creates attachment files in the selected output directory
          and adds numeric suffixes to avoid overwriting collisions.
      - rate-limited: Provider IMAP limits and connection policies apply.
      direct_io:
        network:
        - access: download
          auth:
            kind: email-account
            mode: uses-existing
          content: email-attachment
          endpoint: Configured IMAP host and port for the selected account
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email-attachment
          id: write-1
          medium: local-filesystem
          path: <dir>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: email-attachment
          formats:
          - json
          id: write-2
          medium: stdout
          sensitivity: user-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-3
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          live: Fetches current message content before saving selected attachments
            locally.
        effects:
        - action: create
          confirmation_evidence:
            kind: output
            output_ref: saved
          direct_io_ref: write-1
          id: attachment-create
          may_occur_in_outcomes:
          - success
          reversibility:
            reversible: Delete the reported saved files to undo the local download.
          value_source:
            direct_io_ref: network-1
            kind: direct-io
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Each attachment file is written separately; a multi-file
              save is not transactional.
          concurrent_invocations:
            unsafe: Concurrent saves into the same directory can race when selecting
              collision suffixes.
          idempotency:
            non_idempotent: Repeating the request creates additional suffixed files
              rather than replacing earlier downloads.
          on_uncertain_completion:
            verify_then_decide: Inspect the JSON output and destination directory
              before retrying.
          partial_effects_on_failure:
            possible: Earlier attachment files can remain if a later fetch or write
              fails.
          rollback_on_failure:
            unavailable: The interface does not remove files already written when
              a later save fails.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: saved
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use only the file paths reported in the JSON output.
        class: success
        effects:
        - attachment-create
        id: success
        outputs:
        - saved
      - caller_action: Correct the account, folder, UID, selection, destination, credential,
          or provider error before retrying.
        class: error
        effects: []
        id: error
        outputs:
        - diagnostic
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON array describing every saved attachment file.
        direct_io_ref: write-2
        empty: The interface fails rather than returning an empty array when no attachment
          matches.
        id: saved
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-3
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Save attachments from one or more emails into a directory. Use --all
      to save every attachment, or repeat --name to save only selected filenames.
      Returns JSON describing the saved files.
    process_binding:
      args_prefix:
      - save-attachments
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        - --out
        - --all
        flag_patterns:
          --folder: ^.+$
          --out: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        - --name
        min_positionals: 1
        name: short-account-all
        required_flags:
        - -a
        - --out
        - --all
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
        - --out
        - --all
        flag_patterns:
          --account: ^.+$
          --folder: ^.+$
          --out: ^.+$
        forbidden_flags:
        - -a
        - --name
        min_positionals: 1
        name: long-account-all
        required_flags:
        - --account
        - --out
        - --all
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        - --out
        - --name
        flag_patterns:
          --folder: ^.+$
          --name: ^.+$
          --out: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        - --all
        min_positionals: 1
        name: short-account-name
        required_flags:
        - -a
        - --out
        - --name
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
