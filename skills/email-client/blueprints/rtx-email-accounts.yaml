content:
- _rtx/_email_accounts\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-client.source.rtx-init
  version: 1
description: Python source for the per-machine email account registry, credential storage,
  credential purging, and Gmail OAuth setup.
gateway:
  language: Python
  path: _rtx/_email_accounts.py
id: email-client.source.rtx-email-accounts
interfaces:
  email-client.source.rtx-email-accounts.interface.accounts-add:
    contract:
      direct_io:
        network: []
        reads: []
        writes:
        - access: write
          content: email-account
          id: write-1
          medium: local-system
          sensitivity: user-private
          system: keyring
        - access: write
          content: response
          formats: [text]
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-3, medium: stderr, sensitivity: derived-private}
      arguments:
        nickname: {description: New unique account nickname, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        email: {description: Email address associated with the account, required: true, sensitivity: user-private, type: {kind: string, format: {named: email}}}
        display-name: {description: Optional display name used when composing messages, required: false, sensitivity: user-private, type: {kind: string}}
        imap-host: {description: Optional IMAP host; Gmail is the default, required: false, sensitivity: public, type: {kind: string}}
        imap-port: {description: Optional IMAP port, required: false, sensitivity: public, type: {kind: integer, minimum: 1, maximum: 65535}}
        smtp-host: {description: Optional SMTP host; Gmail is the default, required: false, sensitivity: public, type: {kind: string}}
        smtp-port: {description: Optional SMTP port, required: false, sensitivity: public, type: {kind: integer, minimum: 1, maximum: 65535}}
        starttls: {description: Use SMTP STARTTLS instead of implicit TLS, required: false, default: false, sensitivity: public, type: {kind: flag}}
        auth: {description: Account authentication method, required: false, default: app-password, sensitivity: public, type: {kind: enum, values: [{value: app-password, description: Use stored IMAP and SMTP app passwords}, {value: gmail-oauth, description: Use Gmail OAuth XOAUTH2}]}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Creates a persistent account-registry entry; an existing nickname is rejected rather than replaced.
      outputs:
      - {id: result, audience: both, description: Account-created confirmation and next authentication setup guidance., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Always printed on success., type: {kind: string, sensitivity: derived-private}}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-3, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [result], effects: [account-write], caller_action: Configure the declared authentication method before using the account.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the reported nickname, address, or option error before retrying."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: "The registry is loaded once, modified in memory, and then written."}
        effects:
        - id: account-write
          direct_io_ref: write-1
          action: create
          value_source: {kind: direct-io, direct_io_ref: write-1}
          may_occur_in_outcomes: [success]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {compensatable: Remove the nickname with accounts-remove.}
        mutation_safety:
          atomicity: {non_atomic: The implementation writes the registry directly and does not provide an atomic replacement guarantee.}
          concurrent_invocations: {unsafe: Concurrent registry writers can overwrite one another.}
          idempotency: {non_idempotent: Repeating the call after success is rejected because the nickname exists.}
          on_uncertain_completion: {verify_then_decide: Run accounts-list and retry only if the nickname is absent.}
          partial_effects_on_failure: {possible: A process or filesystem failure can occur while persisting the registry.}
          rollback_on_failure: {unavailable: No automatic rollback is supplied.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
    description: Register a new account nickname. Gmail IMAP/SMTP settings are the
      default; pass explicit host/port flags for other providers. App-password auth
      is the default; use --auth gmail-oauth for Gmail OAuth.
    process_binding:
      args_prefix:
      - add
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --nickname
        - --email
        - --display-name
        - --imap-host
        - --imap-port
        - --smtp-host
        - --smtp-port
        - --starttls
        - --auth
        flag_patterns:
          --auth: ^(app-password|gmail-oauth)$
          --display-name: ^.+$
          --email: ^.+$
          --imap-host: ^.+$
          --imap-port: ^.+$
          --nickname: ^.+$
          --smtp-host: ^.+$
          --smtp-port: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --nickname
        - --email
    usage: --nickname <nick> --email <addr> [--display-name <name>] [--imap-host H]
      [--imap-port P] [--smtp-host H] [--smtp-port P] [--starttls] [--auth app-password|gmail-oauth]
    version: 1
  email-client.source.rtx-email-accounts.interface.accounts-list:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: email-account
          id: read-1
          medium: local-system
          sensitivity: user-private
          system: keyring
        writes:
        - access: write
          content: email-account
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments: {}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - id: accounts
        audience: machine
        description: One JSON object mapping each nickname to its email address and display name; credentials are omitted.
        direct_io_ref: write-1
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: An empty registry is returned as an empty JSON object.
        type: {kind: string, sensitivity: user-private, description: JSON account summary, format: {named: json}}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [accounts], effects: [], caller_action: Use only a returned nickname for later account operations.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: Resolve the reported registry read or decoding failure before retrying.}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: The account registry is read once for this listing.}
        verification: [{method: output-schema, output_ref: accounts}]
      helpers: []
    description: List registered account nicknames with their email/display name (no
      secrets).
    process_binding:
      args_prefix:
      - list
      entry: Interface
      kind: process
      patterns:
      - max_positionals: 0
        min_positionals: 0
        name: owner
    usage: ''
    version: 1
  email-client.source.rtx-email-accounts.interface.accounts-remove:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: email-account
          id: read-1
          medium: local-system
          sensitivity: user-private
          system: keyring
        writes:
        - access: delete
          content: email-account
          id: write-1
          medium: local-system
          sensitivity: user-private
          system: keyring
        - access: delete
          content: credential
          id: write-2
          medium: local-system
          sensitivity: secret
          system: keyring
        - access: write
          content: response
          formats: [text]
          id: write-3
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-4, medium: stderr, sensitivity: derived-private}
      arguments:
        nickname: {description: Existing account nickname to remove, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        purge-credentials: {description: "Delete stored IMAP, SMTP, and OAuth credential keys after registry removal", required: false, default: false, sensitivity: public, type: {kind: flag}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Removes the registry entry; with credential purge, registry removal occurs before credential deletion and is not rolled back if purge fails.
      outputs:
      - {id: result, audience: both, description: Confirmation distinguishing registry-only removal from removal with credential purge., direct_io_ref: write-3, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Always printed on success., type: {kind: string, sensitivity: derived-private}}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-4, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: removed, class: success, outputs: [result], effects: [account-delete], caller_action: Retain or separately clear credentials as intended.}
      - {id: removed-and-purged, class: success, outputs: [result], effects: [account-delete, credential-delete], caller_action: No further action is required.}
      - {id: partial, class: partial, outputs: [diagnostic], effects: [account-delete, credential-delete], caller_action: Treat the nickname as removed and manually verify or clear any remaining credentials.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: Correct an unknown nickname before retrying.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: The registry record is loaded once and removed before any requested credential purge.}
        effects:
        - id: account-delete
          direct_io_ref: write-1
          action: delete
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [removed, removed-and-purged, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {irreversible: The removed registry record is not archived.}
        - id: credential-delete
          direct_io_ref: write-2
          action: delete
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [removed-and-purged, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}
          reversibility: {irreversible: Deleted credentials cannot be recovered by this interface.}
        mutation_safety:
          atomicity: {non_atomic: Registry removal and credential deletions are separate operations.}
          concurrent_invocations: {unsafe: Concurrent registry or credential changes are not serialized.}
          idempotency: {non_idempotent: Repeating the call is rejected because the nickname is already absent.}
          on_uncertain_completion: {verify_then_decide: Run accounts-list and inspect the credential store before deciding whether any manual cleanup remains.}
          partial_effects_on_failure: {possible: "Registry removal can succeed before credential purge fails, and a multi-key purge can itself be partial."}
          rollback_on_failure: {unavailable: Removed registry data and credentials are not restored automatically.}
        verification:
        - {method: direct-io-state, direct_io_ref: write-1}
        - {method: direct-io-state, direct_io_ref: write-2}
      helpers: []
    description: Remove an account nickname from the registry; optionally purge its
      stored credentials too.
    process_binding:
      args_prefix:
      - remove
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --nickname
        - --purge-credentials
        flag_patterns:
          --nickname: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --nickname
    usage: --nickname <nick> [--purge-credentials]
    version: 1
  email-client.source.rtx-email-accounts.interface.accounts-set-password:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: credential
          formats:
          - text
          id: read-1
          medium: stdin
          sensitivity: secret
        writes:
        - access: write
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: write-1
          medium: local-system
          sensitivity: secret
          system: keyring
        - access: write
          content: response
          formats: [text]
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-3, medium: stderr, sensitivity: derived-private}
      arguments:
        nickname: {description: Existing account nickname whose credential should be stored, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        purpose: {description: Credential purpose to store, required: true, sensitivity: public, type: {kind: enum, values: [{value: imap, description: IMAP authentication credential}, {value: smtp, description: SMTP authentication credential}]}}
        secret: {description: Nonempty credential read from standard input, required: true, sensitivity: secret, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Replaces the stored IMAP or SMTP credential for the selected account and purpose.
      outputs:
      - {id: result, audience: both, description: Confirmation naming the account and credential purpose stored., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Always printed on success., type: {kind: string, sensitivity: derived-private}}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-3, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [result], effects: [credential-write], caller_action: Use a live smoke check if provider authentication must be verified.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Supply a nonempty stdin secret for an existing nickname and valid purpose, then retry."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: The account registry is read once before the supplied secret is written.}
        effects:
        - id: credential-write
          direct_io_ref: write-1
          action: configure
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [success]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {compensatable: A later set-password call can replace the stored value.}
        mutation_safety:
          atomicity: {per_effect_only: The credential-store operation is delegated to the host backend; no cross-key transaction is claimed.}
          concurrent_invocations: {unsafe: Concurrent writes to the same credential key are not serialized.}
          idempotency: {idempotent: "Repeating the same nickname, purpose, and secret leaves the same stored value."}
          on_uncertain_completion: {verify_then_decide: Run the appropriate authentication-only live smoke check before writing again.}
          partial_effects_on_failure: {possible: Legacy compatibility can write more than one credential key without a transaction.}
          rollback_on_failure: {unavailable: The previous secret is not retained for rollback.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
    description: Store the IMAP or SMTP credential for an account in the host credential
      store. The secret is read from stdin, never a CLI argument.
    process_binding:
      args_prefix:
      - set-password
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: true
        allowed_flags:
        - --nickname
        - --purpose
        flag_patterns:
          --nickname: ^.+$
          --purpose: ^(imap|smtp)$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --nickname
        - --purpose
    usage: --nickname <nick> --purpose imap|smtp
    version: 1
  email-client.source.rtx-email-accounts.interface.accounts-setup-oauth:
    contract:
      direct_io:
        network:
        - access: request
          auth:
            kind: gmail-oauth
            mode: creates
          content: credential
          endpoint: <auth_uri from client configuration or https://accounts.google.com/o/oauth2/v2/auth>
          id: network-1
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          auth:
            kind: gmail-oauth
            mode: creates
          content: credential
          endpoint: <token_uri from client configuration or https://oauth2.googleapis.com/token>
          formats: [json]
          id: network-2
          medium: network-request
          sensitivity: secret
          system: oauth
        - access: request
          content: authorization callback
          endpoint: http://127.0.0.1:<ephemeral-port>/oauth2/callback
          formats: [http]
          id: network-3
          medium: network-request
          sensitivity: secret
          system: localhost-callback
        reads:
        - access: read
          content: config
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: <path>
          path_match: exact
          sensitivity: secret
          system: filesystem
        - access: read
          content: email-account
          formats: [json]
          id: read-2
          medium: local-filesystem
          path: $EMAIL_CLIENT_CONFIG_DIR/accounts.json or $home/.config/email-client/accounts.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          auth:
            kind: gmail-oauth
            mode: creates
          content: credential
          id: write-1
          medium: local-system
          sensitivity: secret
          system: keyring
        - access: write
          auth:
            kind: gmail-oauth
            mode: creates
          content: credential
          id: write-2
          medium: local-system
          sensitivity: secret
          system: keyring
        - access: write
          content: email-account
          formats: [json]
          id: write-3
          medium: local-filesystem
          path: $EMAIL_CLIENT_CONFIG_DIR/accounts.json or $home/.config/email-client/accounts.json
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: response
          formats: [text]
          id: write-4
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats: [text]
          id: write-5
          medium: stderr
          sensitivity: derived-private
      arguments:
        nickname: {description: Existing Gmail account nickname to authorize, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        client-config: {description: Google Desktop OAuth client JSON file, required: true, sensitivity: secret, direct_io_ref: read-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string, format: {named: json}}}}
        no-open-browser: {description: Print the authorization URL for manual opening instead of launching a browser, required: false, default: false, sensitivity: public, type: {kind: flag}}
      preconditions: []
      interaction:
        mode: interactive
        channel: tty
        unattended_outcome: error
        timeout_seconds: 300
      caller_warnings:
      - may-wait: Waits up to five minutes for the browser or manually opened authorization URL to return to the local callback.
      - external-side-effect: Changes the registry account to Gmail OAuth, stores separate OAuth client-secret and refresh-token entries, and may open a browser.
      outputs:
      - {id: status, audience: both, description: Authorization guidance and URL followed by the stored-credentials confirmation on success., direct_io_ref: write-4, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Validation can fail before the authorization URL is printed., type: {kind: string, sensitivity: derived-private}}
      - {id: diagnostic, audience: both, description: OAuth setup failure emitted on stderr., direct_io_ref: write-5, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Empty on success., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [status], effects: [client-secret-write, refresh-token-write, account-registry-update], caller_action: Run live-smoke with IMAP and SMTP authentication to verify the setup.}
      - {id: error, class: error, outputs: [status, diagnostic], effects: [], caller_action: "Resolve the reported client-config, consent, callback, token, scope, or credential-store failure before retrying."}
      - {id: partial, class: partial, outputs: [status, diagnostic], effects: [client-secret-write, refresh-token-write, account-registry-update], caller_action: Inspect both OAuth secret keys and accounts.json before retrying or cleaning up.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: OAuth authorization and token exchange use live provider state during this invocation.}
        effects:
        - id: client-secret-write
          direct_io_ref: write-1
          action: configure
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [success, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {compensatable: Removing the account with credential purge clears the stored OAuth credentials.}
        - id: refresh-token-write
          direct_io_ref: write-2
          action: configure
          value_source: {kind: direct-io, direct_io_ref: network-2}
          may_occur_in_outcomes: [success, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}
          reversibility: {compensatable: Removing the account with credential purge clears the stored OAuth credentials.}
        - id: account-registry-update
          direct_io_ref: write-3
          action: update
          value_source: {kind: direct-io, direct_io_ref: read-1}
          may_occur_in_outcomes: [success, partial]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-3}
          reversibility: {compensatable: A later account update can restore known prior authentication metadata.}
        mutation_safety:
          atomicity: {non_atomic: "Provider authorization, two credential writes, and registry persistence are separate operations."}
          concurrent_invocations: {unsafe: Concurrent OAuth setup for the same nickname is not serialized.}
          idempotency: {non_idempotent: Each run creates new authorization state and may issue a different refresh token.}
          on_uncertain_completion: {verify_then_decide: Run live-smoke before repeating authorization.}
          partial_effects_on_failure: {possible: "The provider grant, either secret, or registry metadata can exist even if a later step fails."}
          rollback_on_failure: {unavailable: No automatic provider revocation or credential rollback is supplied.}
        verification:
        - {method: output-schema, output_ref: status}
        - {method: direct-io-state, direct_io_ref: write-1}
        - {method: direct-io-state, direct_io_ref: write-2}
        - {method: direct-io-state, direct_io_ref: write-3}
      helpers: []
    description: Complete Gmail OAuth setup for an account using a Google desktop
      OAuth client JSON file. Prints the authorization URL and completion status,
      stores refresh-token and client-secret keys, and persists Gmail OAuth metadata
      in accounts.json.
    process_binding:
      args_prefix:
      - setup-oauth
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --nickname
        - --client-config
        - --no-open-browser
        flag_patterns:
          --client-config: ^.+$
          --nickname: ^.+$
        max_positionals: 0
        min_positionals: 0
        name: owner
        required_flags:
        - --nickname
        - --client-config
    usage: --nickname <nick> --client-config <path> [--no-open-browser]
    version: 1
  email-client.source.rtx-email-accounts.interface.accounts-update:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: email-account
          id: read-1
          medium: local-system
          sensitivity: user-private
          system: keyring
        writes:
        - access: write
          content: email-account
          id: write-1
          medium: local-system
          sensitivity: user-private
          system: keyring
        - access: write
          content: response
          formats: [text]
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-3, medium: stderr, sensitivity: derived-private}
      arguments:
        nickname: {description: Existing account nickname to update, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        email: {description: Replacement email address, required: false, sensitivity: user-private, type: {kind: string, format: {named: email}}}
        display-name: {description: Replacement display name, required: false, sensitivity: user-private, type: {kind: string}}
        imap-host: {description: Replacement IMAP host, required: false, sensitivity: public, type: {kind: string}}
        imap-port: {description: Replacement IMAP port, required: false, sensitivity: public, type: {kind: integer, minimum: 1, maximum: 65535}}
