content:
- _rtx/_imap_gateway\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-email-accounts.yaml
  reason: Executes the sibling account gateway to resolve the selected account.
  source: email-client.source.rtx-email-accounts
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: email-client.source.rtx-init
  version: 1
description: Python IMAP source for listing folders and envelopes, reading messages,
  inspecting attachment metadata, and saving selected attachments.
gateway:
  language: Python
  path: _rtx/_imap_gateway.py
id: email-client.source.rtx-imap-gateway
interfaces:
  email-client.source.rtx-imap-gateway.interface.mail-attachments:
    contract:
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: email-attachment
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email-attachment
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        account: {description: Registered account nickname used for IMAP authentication, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        folder: {description: Folder alias or literal IMAP folder name, required: false, default: inbox, sensitivity: user-private, type: {kind: string}}
        uids: {description: One or more IMAP UIDs whose attachment metadata should be returned, required: true, sensitivity: user-private, type: {kind: list, element_type: {kind: string, format: {regex: {pattern: '^[0-9]+$', dialect: python, matching: full, example: '42'}}}}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - may-wait: Retrieves and parses each requested message from the live IMAP server.
      - rate-limited: Provider IMAP limits and connection policies apply.
      outputs:
      - id: attachments
        audience: machine
        description: JSON array with one record per UID and structured attachment metadata.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: user-private, format: {named: json}}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Messages with no attachments are represented by records containing empty attachment arrays.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [attachments], effects: [], caller_action: Consume the returned JSON records.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the account, folder, UID, credential, or provider error before retrying."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: Reads current message content from the selected IMAP folder.}
        verification: [{method: output-schema, output_ref: attachments}]
      helpers: []
    description: List attachment metadata for one or more emails as JSON. Returns
      one record per requested UID with attachment entries containing filename, content_type,
      size_bytes, size_human, and disposition.
    process_binding:
      args_prefix:
      - attachments
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        flag_patterns:
          --folder: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        min_positionals: 1
        name: short-account
        required_flags:
        - -a
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
        flag_patterns:
          --account: ^.+$
          --folder: ^.+$
        forbidden_flags:
        - -a
        min_positionals: 1
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname> [--folder inbox|sent|drafts|trash|all|<literal>] <uid> [<uid>
      ...]
    version: 1
  email-client.source.rtx-imap-gateway.interface.mail-folders:
    contract:
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: mailbox
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: mailbox
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        account: {description: Registered account nickname used for IMAP authentication, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - rate-limited: Provider IMAP limits and connection policies apply.
      outputs:
      - id: folders
        audience: machine
        description: JSON array of folder names returned by IMAP LIST.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: user-private, format: {named: json}}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: An account with no visible folders returns an empty JSON array.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [folders], effects: [], caller_action: Use a returned folder name or a supported alias in later reads.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the account, credential, or provider error before retrying."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: Lists folders from the current IMAP account state.}
        verification: [{method: output-schema, output_ref: folders}]
      helpers: []
    description: List IMAP folders for an account (JSON).
    process_binding:
      args_prefix:
      - folders
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - -a
        flag_patterns:
          -a: ^.+$
        forbidden_flags:
        - --account
        max_positionals: 0
        min_positionals: 0
        name: short-account
        required_flags:
        - -a
      - allowed_flags:
        - --account
        flag_patterns:
          --account: ^.+$
        forbidden_flags:
        - -a
        max_positionals: 0
        min_positionals: 0
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname>
    version: 1
  email-client.source.rtx-imap-gateway.interface.mail-list:
    contract:
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: email
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - json
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        account: {description: Registered account nickname used for IMAP authentication, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        folder: {description: Folder alias or literal IMAP folder name, required: false, default: inbox, sensitivity: user-private, type: {kind: string}}
        after: {description: Optional inclusive server-side IMAP SINCE date, required: false, sensitivity: user-private, type: {kind: date, date_formats: [YYYY-MM-DD]}}
        filters: {description: Optional exact or case-insensitive regular-expression envelope filters, required: false, default: [], sensitivity: user-private, type: {kind: list, element_type: {kind: string}}}
        limit: {description: Optional maximum number of newest matching envelopes, required: false, sensitivity: public, type: {kind: integer, minimum: 1, unit: count}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - may-wait: An unfiltered and undated request scans and fetches headers for the whole selected folder.
      - rate-limited: Provider IMAP limits and connection policies apply.
      outputs:
      - id: envelopes
        audience: machine
        description: JSON array of matching envelopes sorted by ascending numeric UID.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: user-private, format: {named: json}}
        cardinality: {minimum: 1, maximum: 1}
        ordering: sorted
        pagination: {kind: none}
        truncation: {kind: none}
        empty: No matching messages returns an empty JSON array.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [envelopes], effects: [], caller_action: Consume the returned envelopes and use their id fields as IMAP UIDs.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the account, folder, date, filter, credential, or provider error before retrying."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: Searches and fetches headers from current IMAP folder state during the invocation.}
        verification: [{method: output-schema, output_ref: envelopes}]
      helpers: []
    description: 'List email envelopes for an account as JSON (fields: id, flags,
      subject, from, date, message_id). --folder accepts aliases inbox|sent|drafts|trash|all
      or any literal IMAP folder name (default inbox). --after narrows server-side
      by day (IMAP SINCE). Filters are key=value (exact, comma-separated=OR) or key~=value
      (regex, case-insensitive) over id/subject/from/date/message_id/flags, ANDed
      across distinct keys, applied client-side after fetch. Unfiltered + undated
      scans the whole folder (slow on large mailboxes) — pair filters with --after.'
    process_binding:
      args_prefix:
      - list
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        - --after
        - --limit
        flag_patterns:
          --after: ^.+$
          --folder: ^.+$
          --limit: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        min_positionals: 0
        name: short-account
        required_flags:
        - -a
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
        - --after
        - --limit
        flag_patterns:
          --account: ^.+$
          --after: ^.+$
          --folder: ^.+$
          --limit: ^.+$
        forbidden_flags:
        - -a
        min_positionals: 0
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname> [--folder inbox|sent|drafts|trash|all|<literal>] [--after
      YYYY-MM-DD] [key=value|key~=value ...] [--limit N]
    version: 1
  email-client.source.rtx-imap-gateway.interface.mail-read:
    contract:
      direct_io:
        network:
        - access: read
          auth:
            kind: email-account
            mode: uses-existing
          content: email
          endpoint: Configured IMAP host and port for the selected account
          formats:
          - rfc822
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        account: {description: Registered account nickname used for IMAP authentication, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        folder: {description: Folder alias or literal IMAP folder name, required: false, default: inbox, sensitivity: user-private, type: {kind: string}}
        uid: {description: IMAP UID from mail-list identifying the message to read, required: true, sensitivity: user-private, type: {kind: string, format: {regex: {pattern: '^[0-9]+$', dialect: python, matching: full, example: '42'}}}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - rate-limited: Provider IMAP limits and connection policies apply.
      outputs:
      - id: message
        audience: human
        description: Decoded message headers, attachment summary, and readable body text.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: user-private, description: Human-readable email view}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: A message without a readable MIME body includes an explicit no-readable-body marker.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [message], effects: [], caller_action: Present or analyze the returned message text as requested.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the account, folder, UID, credential, or provider error before retrying."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: Fetches the selected message from current IMAP folder state.}
        verification: [{method: output-schema, output_ref: message}]
      helpers: []
    description: Read one email by UID (the "id" field from mail-list). Prints Subject/From/To/
      Date/Message-ID, then In-Reply-To/References only if the message is a reply,
      then an Attachments section (none or one line per attachment with filename,
      MIME type, and size), then a blank line, then the decoded body (text/plain preferred;
      falls back to HTML with tags stripped).
    process_binding:
      args_prefix:
      - read
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - -a
        - --folder
        flag_patterns:
          --folder: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        max_positionals: 1
        min_positionals: 1
        name: short-account
        required_flags:
        - -a
      - allowed_flags:
        - --account
        - --folder
        flag_patterns:
          --account: ^.+$
          --folder: ^.+$
        forbidden_flags:
        - -a
        max_positionals: 1
        min_positionals: 1
        name: long-account
        required_flags:
        - --account
    usage: -a <nickname> [--folder inbox|sent|drafts|trash|all|<literal>] <uid>
    version: 1
  email-client.source.rtx-imap-gateway.interface.mail-save-attachments:
    contract:
      direct_io:
        network:
        - access: download
          auth:
            kind: email-account
            mode: uses-existing
          content: email-attachment
          endpoint: Configured IMAP host and port for the selected account
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: email-imap
        reads:
        - access: read
          auth:
            kind: keyring-entry
            mode: uses-existing
          content: credential
          id: read-1
          medium: local-system
          sensitivity: secret
          system: keyring
        writes:
        - access: write
          content: email-attachment
          id: write-1
          medium: local-filesystem
          path: <dir>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: email-attachment
          formats:
          - json
          id: write-2
          medium: stdout
          sensitivity: user-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-3, medium: stderr, sensitivity: derived-private}
      arguments:
        account: {description: Registered account nickname used for IMAP authentication, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        folder: {description: Folder alias or literal IMAP folder name, required: false, default: inbox, sensitivity: user-private, type: {kind: string}}
        uids: {description: One or more IMAP UIDs whose attachments should be saved, required: true, sensitivity: user-private, type: {kind: list, element_type: {kind: string, format: {regex: {pattern: '^[0-9]+$', dialect: python, matching: full, example: '42'}}}}}
        out: {description: Destination directory for saved attachments, required: true, sensitivity: user-private, direct_io_ref: write-1, type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: false, access: write, entry_type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: false, access: write, opaque_content: true}}}
        all: {description: Save every attachment in each requested message, required: false, default: false, sensitivity: public, type: {kind: flag}}
        names: {description: Repeated attachment filenames to save when all is false, required: false, default: [], sensitivity: user-private, type: {kind: list, element_type: {kind: string}}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Creates attachment files in the selected output directory and adds numeric suffixes to avoid overwriting collisions.
      - rate-limited: Provider IMAP limits and connection policies apply.
      outputs:
      - id: saved
        audience: machine
        description: JSON array describing every saved attachment file.
        direct_io_ref: write-2
        type: {kind: string, sensitivity: user-private, format: {named: json}}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: The interface fails rather than returning an empty array when no attachment matches.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-3, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [saved], effects: [attachment-create], caller_action: Use only the file paths reported in the JSON output.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the account, folder, UID, selection, destination, credential, or provider error before retrying."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Fetches current message content before saving selected attachments locally.}
        effects:
        - {id: attachment-create, direct_io_ref: write-1, action: create, value_source: {kind: direct-io, direct_io_ref: network-1}, may_occur_in_outcomes: [success], confirmation_evidence: {kind: output, output_ref: saved}, reversibility: {reversible: Delete the reported saved files to undo the local download.}}
        mutation_safety:
          atomicity: {per_effect_only: Each attachment file is written separately; a multi-file save is not transactional.}
          concurrent_invocations: {unsafe: Concurrent saves into the same directory can race when selecting collision suffixes.}
          idempotency: {non_idempotent: Repeating the request creates additional suffixed files rather than replacing earlier downloads.}
          on_uncertain_completion: {verify_then_decide: Inspect the JSON output and destination directory before retrying.}
          partial_effects_on_failure: {possible: Earlier attachment files can remain if a later fetch or write fails.}
          rollback_on_failure: {unavailable: The interface does not remove files already written when a later save fails.}
        verification:
        - {method: output-schema, output_ref: saved}
        - {method: direct-io-state, direct_io_ref: write-1}
      helpers: []
    description: Save attachments from one or more emails into a directory. Use --all
      to save every attachment, or repeat --name to save only selected filenames.
      Returns JSON describing the saved files.
    process_binding:
      args_prefix:
      - save-attachments
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        - --out
        - --all
        flag_patterns:
          --folder: ^.+$
          --out: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        - --name
        min_positionals: 1
        name: short-account-all
        required_flags:
        - -a
        - --out
        - --all
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
        - --out
        - --all
        flag_patterns:
          --account: ^.+$
          --folder: ^.+$
          --out: ^.+$
        forbidden_flags:
        - -a
        - --name
        min_positionals: 1
        name: long-account-all
        required_flags:
        - --account
        - --out
        - --all
      - allow_extra_positionals: true
        allowed_flags:
        - -a
        - --folder
        - --out
        - --name
        flag_patterns:
          --folder: ^.+$
          --name: ^.+$
          --out: ^.+$
          -a: ^.+$
        forbidden_flags:
        - --account
        - --all
        min_positionals: 1
        name: short-account-name
        required_flags:
        - -a
        - --out
        - --name
      - allow_extra_positionals: true
        allowed_flags:
        - --account
        - --folder
        - --out
        - --name
        flag_patterns:
          --account: ^.+$
          --folder: ^.+$
          --name: ^.+$
          --out: ^.+$
        forbidden_flags:
        - -a
        - --all
        min_positionals: 1
        name: long-account-name
        required_flags:
        - --account
        - --out
        - --name
    usage: -a <nickname> [--folder inbox|sent|drafts|trash|all|<literal>] <uid> [<uid>
      ...] --out <dir> (--all | --name <filename> [--name <filename> ...])
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: keyring
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Retrieves the IMAP credential from the host credential store.
  version: any
schema_version: 4
uses_interfaces:
- interface: common.interface.secret-store
  version: 1
version: 1
