authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Audits mathematical notation for lightness, coherent families, scope
  consistency, semantic transparency, and field-appropriate conventions.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - mathematical-reasoning
    - research-writing
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  notation-review.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: notation-review.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: notation-review
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  notation-review.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
