content:
- SKILL\.md
dependencies:
- blueprint:
    base: repository-root
    path: skills/skill-certifier/blueprints/gateway.yaml
  reason: Defines the exclusive certification writer whose state this read-only module
    inspects.
  source: skill-certifier.source.gateway
  version: 4
description: Defines the LLM-facing rules for reading exact signed-certificate currentness,
  stale worklists, and canonical v6 node hashes.
gateway:
  language: Markdown
  path: SKILL.md
id: skill-drift.source.gateway
interfaces:
  skill-drift.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: skill-drift._rtx.interface.compute-hashes
      version: 1
    - interface: skill-drift._rtx.interface.drift-status
      version: 2
    contract:
      arguments:
        request:
          description: Request to inspect installed module certificate drift or compute
            canonical node hashes.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Human-readable status mode writes a timestamped certificate-drift
          Markdown report.
      direct_io:
        network: []
        reads:
        - access: read
          content: drift or hash request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        writes:
        - access: write
          content: drift or hash result
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The response reflects the shared repository certification-state
            snapshot observed during this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Report the generated result without writing or reinterpreting
          certificate state.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Report the target-resolution, safe-read, hashing, or status
          error.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Exact certificate-currentness, stale-worklist, or canonical-hash
          result.
        direct_io_ref: write-1
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Instructions for exact-target certificate drift, stale worklists,
      and canonical node-hash checks.
    version: 2
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: skill-drift._rtx.interface.compute-hashes
  version: 1
- interface: skill-drift._rtx.interface.drift-status
  version: 2
version: 3
