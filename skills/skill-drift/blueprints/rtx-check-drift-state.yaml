content:
- _rtx/_check_drift_state\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-skill-sources-init.yaml
  reason: Imports installed-source discovery from _rtx/_skill_sources/__init__.py.
  source: skill-drift.source.rtx-skill-sources-init
  version: 1
description: Resolves exact or installed v4 modules, derives canonical node hashes and certificate currentness through the shared certification view, and optionally saves a Markdown report.
gateway:
  language: Python
  path: _rtx/_check_drift_state.py
id: skill-drift.source.rtx-check-drift-state
interfaces:
  skill-drift.source.rtx-check-drift-state.interface.compute-hashes:
    contract:
      arguments:
        targets:
          description: Optional installed module names or path-like exact module roots; omission scans every observed blueprint-backed module.
          required: false
          default: []
          sensitivity: user-private
          type: {kind: list, element_type: {kind: string, sensitivity: user-private}}
        json:
          description: Emit one machine-readable JSON document instead of Markdown.
          required: false
          default: false
          sensitivity: public
          type: {kind: flag}
        skill-root:
          description: Exact installed module root to hash instead of discovering installed copies.
          required: false
          sensitivity: user-private
          direct_io_ref: read-1
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - id: hash-report
        audience: both
        description: Deterministically ordered JSON or Markdown containing each target's certification-basis hash and canonical node hashes.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: derived-private, description: "JSON when --json is present, otherwise Markdown."}
        cardinality: {minimum: 1, maximum: 1}
        ordering: sorted
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty when at least one module resolves.
      - id: error
        audience: human
        description: Target-resolution or per-target hash failure.
        direct_io_ref: write-2
        type: {kind: string, sensitivity: derived-private}
        cardinality: {minimum: 0, maximum: null}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Empty when every requested target hashes successfully.
      outcomes:
      - {id: computed, class: success, outputs: [hash-report], effects: [], caller_action: Consume the canonical hashes without reading certificate records directly.}
      - {id: partial, class: partial, outputs: [hash-report, error], effects: [], caller_action: Use successful target hashes and report each failed target; the process exits nonzero.}
      - {id: failed, class: error, outputs: [error], effects: [], caller_action: "Correct target discovery, v4 blueprint, Git, or safe-read failures before retrying."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: Hashes are derived through one shared repository certification-state snapshot per source.}
        verification: [{method: output-schema, output_ref: hash-report}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {id: read-1, medium: local-filesystem, access: read, system: filesystem, content: "selected v4 graph, node inputs, hash policy, certification basis, and certificate verification material", formats: [yaml, json, markdown, python, text, binary, pem, jsonl], sensitivity: derived-private, path: $target/**, path_match: glob, reason: Derive canonical repository node hashes without importing target code.}
        - {id: read-2, medium: home-filesystem, access: read, system: filesystem, content: "installed module roots and active plugin registry", formats: [json, directory], sensitivity: user-private, path: "$HOME/{.codex/skills,.claude/skills,.claude/plugins/installed_plugins.json}", path_match: glob, reason: Resolve installed copies when exact overrides are absent.}
        - {id: read-3, medium: local-system, access: read, system: git, content: "repository identity, source commit, index, and tracked source state", formats: [git], sensitivity: derived-private, path: $target/repository, path_match: exact, reason: Derive commit-backed hash inputs.}
        writes:
        - {id: write-1, medium: stdout, access: write, system: agent-runtime, content: hash report, formats: [json, markdown], sensitivity: derived-private, reason: Return canonical node hashes.}
        - {id: write-2, medium: stderr, access: write, system: agent-runtime, content: error, formats: [text], sensitivity: derived-private, reason: Report hash failures.}
    description: Compute canonical certification-basis and v4 node hashes for exact or installed modules.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        allowed_flags: [--json, --skill-root]
        flag_patterns:
          --skill-root: ^.+$
        min_positionals: 1
        positional_patterns:
          '0': ^compute-hashes$
    usage: compute-hashes [target ...] [--skill-root ROOT] [--json]
    version: 1
  skill-drift.source.rtx-check-drift-state.interface.drift-status:
    contract:
      arguments:
        targets:
          description: Optional installed module names or path-like exact module roots; omission scans every observed installed module.
          required: false
          default: []
          sensitivity: user-private
          type: {kind: list, element_type: {kind: string, sensitivity: user-private}}
        all:
          description: Check all observed installed modules and reject combination with named targets.
          required: false
          default: false
          sensitivity: public
          type: {kind: flag}
        json:
          description: Emit JSON and suppress the saved Markdown report.
          required: false
          default: false
          sensitivity: public
          type: {kind: flag}
        skill-root:
          description: Exact installed module root to inspect instead of discovering installed copies.
          required: false
          sensitivity: user-private
          direct_io_ref: read-1
          type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Non-JSON mode writes a timestamped derived Markdown report below skill-drift/_build.
      outputs:
      - id: status-report
        audience: both
        description: JSON or Markdown containing certificate currentness and exact concerns for each selected module and node.
        direct_io_ref: write-2
        type: {kind: string, sensitivity: derived-private, description: "JSON when --json is present, otherwise Markdown plus the saved-report path."}
        cardinality: {minimum: 1, maximum: 1}
        ordering: sorted
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty when at least one module resolves.
      - id: error
        audience: human
        description: Invocation-wide target, discovery, Git, blueprint, or certificate-read error.
        direct_io_ref: write-3
        type: {kind: string, sensitivity: derived-private}
        cardinality: {minimum: 0, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Empty on success.
      outcomes:
      - {id: reported, class: success, outputs: [status-report], effects: [markdown-report], caller_action: Relay certificate-current or certificate-stale with exact node concerns.}
      - {id: reported-json, class: success, outputs: [status-report], effects: [], caller_action: Consume the JSON result; no Markdown report was written.}
      - {id: failed, class: error, outputs: [error], effects: [], caller_action: Report the error without writing or certifying certificate state.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Certificate currentness and hashes come from one shared repository certification-state snapshot per source.}
        effects:
        - id: markdown-report
          direct_io_ref: write-1
          action: create
          value_source: {kind: output, output_ref: status-report}
          may_occur_in_outcomes: [reported]
          confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}
          reversibility: {reversible: The derived local report can be deleted without changing certification state.}
        mutation_safety:
          atomicity: {non_atomic: The report directory and timestamped report are written directly.}
          concurrent_invocations: {unsafe: Invocations in the same second can target the same derived report path.}
          idempotency: {non_idempotent: Repeated non-JSON invocations normally create timestamp-named reports.}
          on_uncertain_completion: {verify_then_decide: Inspect the reported _build path before rerunning.}
          partial_effects_on_failure: {possible: Report-directory creation can precede a write error.}
          rollback_on_failure: {unavailable: The checker does not remove an already written derived report.}
        verification:
        - {method: output-schema, output_ref: status-report}
        - {method: direct-io-state, direct_io_ref: write-1}
      helpers: []
      direct_io:
        network: []
        reads:
        - {id: read-1, medium: local-filesystem, access: read, system: filesystem, content: "selected v4 graph, node inputs, hash policy, certification basis, retained public keys, and certificate histories", formats: [yaml, json, markdown, python, text, binary, pem, jsonl], sensitivity: derived-private, path: $target/**, path_match: glob, reason: Evaluate signed certificate currentness without private-key access or certificate writes.}
        - {id: read-2, medium: home-filesystem, access: read, system: filesystem, content: "installed module roots and active plugin registry", formats: [json, directory], sensitivity: user-private, path: "$HOME/{.codex/skills,.claude/skills,.claude/plugins/installed_plugins.json}", path_match: glob, reason: Resolve installed copies when exact overrides are absent.}
        - {id: read-3, medium: local-system, access: read, system: git, content: "repository identity, source commit, index, and tracked source state", formats: [git], sensitivity: derived-private, path: $target/repository, path_match: exact, reason: Evaluate commit-backed certificate inputs.}
        writes:
        - {id: write-1, medium: local-filesystem, access: write, system: filesystem, content: derived certificate drift report, formats: [markdown], sensitivity: derived-private, path: _build/certificate-drift-*.md, path_match: glob, reason: Save the optional human-readable report.}
        - {id: write-2, medium: stdout, access: write, system: agent-runtime, content: certificate status report, formats: [json, markdown], sensitivity: derived-private, reason: Return exact module and node currentness.}
        - {id: write-3, medium: stderr, access: write, system: agent-runtime, content: error, formats: [text], sensitivity: derived-private, reason: Report invocation-wide failures.}
    description: Read signed certificate currentness for exact or installed v4 modules without writing certification state.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        allowed_flags: [--json, --all, --skill-root]
        flag_patterns:
          --skill-root: ^.+$
        min_positionals: 1
        positional_patterns:
          '0': ^status$
    usage: status [target ...] [--all] [--skill-root ROOT] [--json]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces:
- interface: common.interface.certification-hashing
  version: 1
- interface: common.interface.certificate-records
  version: 1
- interface: common.interface.blueprint-graph
  version: 1
- interface: common.interface.certification-view
  version: 1
version: 1
