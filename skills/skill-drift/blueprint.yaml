authority:
  owns_filesystem:
  - allowed_readers: []
    match: regex
    path: ^_build/certificate-drift-[0-9]{8}-[0-9]{6}\.md$
    reason: Drift status is the sole writer of its generated Markdown reports.
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _rtx/_check_drift_state.py
      - Interface
      reason: Read certificate currentness and canonical node hashes.
    network: []
category: skill-making-development-assistant
description: Computes canonical v4 node hashes and reports whether installed modules
  have current signed certificates.
content:
- README\.md
- SKILL\.md
- _rtx/_check_drift_state\.py
- _rtx/_skill_sources/__init__\.py
- _rtx/_skill_sources/_claude_skill_source\.py
- _rtx/_skill_sources/_codex_skill_source\.py
- _rtx/_skill_sources/_skill_source_common\.py
- references/certification\-basis\-roots\.json
- tests/test_drift_check\.py
discovery:
  mechanism: skill
exports:
  skill-drift.interface.compute-hashes:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-drift.source.rtx-check-drift-state.interface.compute-hashes
  skill-drift.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-drift.source.gateway.interface.default
  skill-drift.interface.drift-status:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-drift.source.rtx-check-drift-state.interface.drift-status
gateway:
  language: Markdown
  path: SKILL.md
id: skill-drift
kind: diagnostic
node_type: module
role: meta-skill
schema_version: 4
sources:
  skill-drift.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  skill-drift.source.rtx-check-drift-state:
    blueprint:
      base: module-root
      path: blueprints/rtx-check-drift-state.yaml
  skill-drift.source.rtx-skill-sources-init:
    blueprint:
      base: module-root
      path: blueprints/rtx-skill-sources-init.yaml
version: 1
