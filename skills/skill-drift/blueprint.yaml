authority:
  owns_filesystem: []
children:
  skill-drift-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:README\.md|SKILL\.md)
description: Computes canonical v5 node hashes and reports whether installed modules
  have current signed certificates.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-assurance
    - assistant-architecture
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  skill-drift.interface.compute-hashes:
    access:
      allow_all_modules: true
      allowed_callers: []
    facade_interface:
      interface: skill-drift-rtx.interface.compute-hashes
      version: 1
  skill-drift.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-drift.source.gateway.interface.default
  skill-drift.interface.drift-status:
    access:
      allow_all_modules: true
      allowed_callers: []
    facade_interface:
      interface: skill-drift-rtx.interface.drift-status
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: skill-drift
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  skill-drift.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
