authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:README\.md|SKILL\.md)
description: Computes canonical v4 node hashes and reports whether installed modules
  have current signed certificates.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-assurance
    - assistant-architecture
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  skill-drift.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: skill-drift.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: skill-drift
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        skill-drift._rtx.interface.compute-hashes: 1
        skill-drift._rtx.interface.drift-status: 1
    interface_access:
      skill-drift._rtx.interface.compute-hashes:
        allow_all_modules: true
        allowed_callers: []
      skill-drift._rtx.interface.drift-status:
        allow_all_modules: true
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  skill-drift.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
