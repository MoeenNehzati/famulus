content:
- SKILL\.md
dependencies: []
description: Implements the staged end-of-day orchestration across daily planning,
  list mutation, mechanical handoff-candidate scanning, and deduplicated triage capture.
gateway:
  language: Markdown
  path: SKILL.md
id: wrap-up.source.gateway
interfaces:
  wrap-up.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: daily-plan.interface.default
      version: 1
    - interface: find-handoff-candidates._rtx.interface.scan
      version: 1
    - interface: list-manager.interface.default
      version: 1
    - interface: prepare-handoff.interface.default
      version: 1
    contract:
      arguments:
        request:
          description: End-of-day wrap-up request and, after the consolidated prompt,
            the user's completion, unplanned-work, calendar-note, and new-item answers.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: After the user answers the consolidated prompt, delegated
          daily-plan and list-manager interfaces may update plan, todo, and triage
          state.
      direct_io:
        network: []
        reads:
        - access: read
          content: Wrap-up request and the user's consolidated answers.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        writes:
        - access: write
          content: Consolidated wrap-up questions or final orchestration summary.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          per_source: The final summary reflects each delegated daily-plan, list-manager,
            and handoff-scan result at the time that source is invoked.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: response-required
      outcomes:
      - caller_action: Answer all completion, unplanned-work, calendar-note, new-item,
          and commit-reminder questions before updates continue.
        class: refusal
        effects: []
        id: response-required
        outputs:
        - response
      - caller_action: Review the concise summary of checked actions, unmatched todo
          items, new list items, and any added triage count.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Review list and handoff-triage results; no daily-plan state
          was available to update.
        class: success
        effects: []
        id: completed-without-plan
        outputs:
        - response
      - caller_action: Preserve successful delegated updates and resolve the specifically
          reported plan, list, or scan failure without guessing.
        class: partial
        effects: []
        id: partial
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Numbered incomplete actions and consolidated questions, or a
          brief final summary of plan, list, and triage results.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Collect one consolidated user response, orchestrate declared planning
      and list interfaces, relay mechanical handoff candidates without transcript
      inspection, and summarize results.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: daily-plan.interface.default
  version: 1
- interface: find-handoff-candidates._rtx.interface.scan
  version: 1
- interface: list-manager.interface.default
  version: 1
- interface: prepare-handoff.interface.default
  version: 1
version: 1
maturity: stable
