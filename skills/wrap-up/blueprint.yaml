authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Orchestrates an interactive end-of-day review that updates completed
  plan and list work and queues deduplicated handoff candidates via
  find-handoff-candidates.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - planning
    - personal-organization
    - session-management
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  wrap-up.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: wrap-up.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: wrap-up
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  wrap-up.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: stable
installation_tier: core
personal_preference:
  applies: false
