authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: workflow-general-assistant
children:
  wrap-up-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Orchestrates an interactive end-of-day review that updates completed
  plan and list work and queues deduplicated sessions needing handoff attention.
discovery:
  mechanism: skill
exports:
  wrap-up.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: wrap-up.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: wrap-up
kind: workflow
namespace_exports: {}
node_type: module
role: productivity
schema_version: 5
sources:
  wrap-up.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
