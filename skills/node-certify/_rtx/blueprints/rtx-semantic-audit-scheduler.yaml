schema_version: 6
node_type: behavioral_source
id: node-certify._rtx.source.certification-voyage
version: 1
maturity: stable
description: Initiate and operate one certification Voyage; machines schedule audits, validate raw worker
  reports and sign exact nodes.
gateway:
  path: _certification_voyage.py
  language: Python
content: &id001
- _certification_voyage\.py
- _certification_support\.py
- _semantic_audit_scheduler\.py
- schemas/semantic-audit-(?:task|result)\.schema\.json
dependencies: []
uses_interfaces: &id002
- interface: certification.interface.hashing
  version: 2
- interface: certification.interface.view
  version: 2
- interface: certification.interface.dependency-dag
  version: 1
- interface: certification.interface.records
  version: 1
- interface: rutter.interface.binding
  version: 3
- interface: rutter.interface.model
  version: 3
- interface: rutter.interface.bound-operations
  version: 7
- interface: rutter.interface.dispenser
  version: 6
- interface: node-certify._rtx.source.rtx-certifier.interface.exact-node
  version: 1
interfaces:
  node-certify._rtx.source.certification-voyage.interface.voyage:
    version: 1
    description: Initiate and operate one certification Voyage; machines schedule audits, validate raw
      worker reports and sign exact nodes.
    usage: initiate [default] --repository PATH --worker-capacity K [--targets IDS] [--retry-interval-seconds
      N] [--run-prefix PREFIX] | next VOYAGE_ID [--response-file PATH --responding-to ENTRY] | <help|modes|list|status|validate|advance|release>
      [arguments]
    content: *id001
    uses_interfaces: *id002
    process_binding:
      kind: process
      entry: Interface
      patterns:
      - name: discovery
        notes: '`help|modes`'
        min_positionals: 1
        max_positionals: 1
        positional_patterns:
          '0': ^(help|modes)$
        allowed_flags: []
        required_flags: []
        flag_patterns: {}
      - name: list
        notes: '`list [--run-prefix PREFIX]`'
        min_positionals: 1
        max_positionals: 1
        positional_patterns:
          '0': ^list$
        allowed_flags:
        - --run-prefix
        required_flags: []
        flag_patterns:
          --run-prefix: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      - name: initiate-default-implicit
        notes: '`initiate --repository PATH --worker-capacity K [--targets IDS] [--retry-interval-seconds N] [--run-prefix PREFIX]`'
        min_positionals: 1
        max_positionals: 1
        positional_patterns:
          '0': ^initiate$
        allowed_flags:
        - --run-prefix
        - --repository
        - --worker-capacity
        - --targets
        - --retry-interval-seconds
        required_flags:
        - --repository
        - --worker-capacity
        flag_patterns:
          --run-prefix: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          --repository: ^.+$
          --worker-capacity: ^[1-9][0-9]*$
          --targets: ^.+$
          --retry-interval-seconds: ^[1-9][0-9]*$
      - name: initiate-default-explicit
        notes: '`initiate default --repository PATH --worker-capacity K [--targets IDS] [--retry-interval-seconds N] [--run-prefix PREFIX]`'
        min_positionals: 2
        max_positionals: 2
        positional_patterns:
          '0': ^initiate$
          '1': ^default$
        allowed_flags:
        - --run-prefix
        - --repository
        - --worker-capacity
        - --targets
        - --retry-interval-seconds
        required_flags:
        - --repository
        - --worker-capacity
        flag_patterns:
          --run-prefix: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          --repository: ^.+$
          --worker-capacity: ^[1-9][0-9]*$
          --targets: ^.+$
          --retry-interval-seconds: ^[1-9][0-9]*$
      - name: operation
        notes: '`status|validate|advance|next VOYAGE_ID [--response-file PATH --responding-to ENTRY]`'
        min_positionals: 2
        max_positionals: 2
        positional_patterns:
          '0': ^(status|validate|advance|next)$
        allowed_flags:
        - --response-file
        - --responding-to
        required_flags: []
        flag_patterns:
          --response-file: ^.+$
          --responding-to: ^.+$
      - name: release
        notes: '`release RUN_ID [--force]`'
        min_positionals: 2
        max_positionals: 2
        positional_patterns:
          '0': ^release$
        allowed_flags:
        - --force
        required_flags: []
        flag_patterns: {}
    contract:
      arguments:
        operation:
          description: Discovery, initialization, or one standard dispenser operation.
          required: true
          sensitivity: public
          type:
            kind: string
            sensitivity: public
        run-prefix:
          description: Optional safe label placed before the freshly generated run ID.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        run-id:
          description: Fresh identifier returned implicitly as the parent of each initialized Voyage ID
            and accepted by release.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        voyage-id:
          description: Indexed Voyage ID under the freshly generated run ID.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        repository:
          description: Exact reviewed repository root.
          required: false
          sensitivity: user-private
          type:
            kind: dir
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
          direct_io_ref: repository
        worker-capacity:
          description: Worker slots excluding the controller, between 1 and 64.
          required: false
          sensitivity: user-private
          type:
            kind: integer
            minimum: 1
            maximum: 64
        targets:
          description: Optional space-separated exact module or source IDs; omission selects the whole
            graph.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        retry-interval-seconds:
          description: Optional positive retry delay, default 10 seconds.
          required: false
          sensitivity: user-private
          type:
            kind: integer
            minimum: 1
        response-file:
          description: Raw worker event envelope JSON.
          required: false
          sensitivity: user-private
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            opaque_content: true
          direct_io_ref: response
        responding-to:
          description: Exact message entrance from next.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        force:
          description: Explicitly abandon a nonterminal run when releasing.
          required: false
          sensitivity: user-private
          type:
            kind: flag
      preconditions: []
      caller_warnings:
      - external-side-effect: Initiation freezes reviewed inputs in one Reckoning. Advancement runs mechanical
          checks and may append exact-node certificates. Release removes terminal run state; force permits
          abandoning a nonterminal run.
      interaction:
        mode: unattended
      outputs:
      - id: result
        audience: machine
        description: Finite JSON initialization or standard dispenser result.
        direct_io_ref: stdout
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          sensitivity: derived-private
          format:
            named: json
      outcomes:
      - id: completed
        class: success
        outputs:
        - result
        effects:
        - voyage-state
        - certificate
        caller_action: Relay supplied packets to fresh semantic workers; forward raw events with next.
          On terminal or fault cancel and reap remaining workers and report the machine result.
      - id: invalid-input
        class: error
        outputs: []
        effects: []
        caller_action: Report the exact input error; do not repair worker output.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          snapshot: An immutable Charter binds repository, commit, canonical input identities, DAG, capacity
            and retry interval. Each next validates and advances under the Reckoning lock; the exact signer
            checks audited inputs inside its frozen-input path.
        effects:
        - id: voyage-state
          direct_io_ref: voyage-state
          action: update
          value_source:
            kind: output
            output_ref: result
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: output
            output_ref: result
          reversibility:
            reversible: Release terminal Reckonings after retaining the machine result.
        - id: certificate
          direct_io_ref: certificates
          action: append
          value_source:
            kind: output
            output_ref: result
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: certificates
          reversibility:
            irreversible: Earlier valid append-only certificates remain after later failure.
        mutation_safety:
          atomicity:
            per_effect_only: Reckoning updates and each certificate append are atomic; external signing
              is not rolled back.
          concurrent_invocations:
            serialized: One Reckoning lock serializes next; one live controller owns worker handles.
          idempotency:
            non_idempotent: Fresh initiation creates a run; accepted entrances and assignment IDs are
              single-use.
          on_uncertain_completion:
            verify_then_decide: Resume next with the unchanged envelope and entrance; stale responses
              are rejected without mutation.
          partial_effects_on_failure:
            possible: Previously issued certificates remain current when a later audit fails.
          rollback_on_failure:
            unavailable: Stop workers and report the machine failure.
        verification:
        - method: output-schema
          output_ref: result
      helpers: []
      direct_io:
        network: []
        reads:
        - id: repository
          medium: local-filesystem
          access: read
          system: filesystem
          content: Reviewed graph, selected content, manifests and authenticated certificate evidence
          formats:
          - yaml
          - json
          - text
          - binary
          sensitivity: user-private
          path: <repository>/**
          path_match: glob
        - id: response
          medium: local-filesystem
          access: read
          system: filesystem
          content: Raw host event envelope
          formats:
          - json
          sensitivity: user-private
          path: <response-file>
          path_match: exact
        writes:
        - id: voyage-state
          medium: local-filesystem
          access: write
          system: filesystem
          content: Sole durable certification Reckoning and its lock
          formats:
          - json
          sensitivity: derived-private
          path: skills/node-certify/_build/certification-voyages/**
          path_match: glob
        - id: certificates
          medium: local-filesystem
          access: write
          system: filesystem
          content: Exact-node certificate histories, signing material and pooled review outputs through
            the declared exact-node signer
          formats:
          - jsonl
          - text
          - binary
          sensitivity: derived-private
          path: <repository>/**
          path_match: glob
        - id: stdout
          medium: stdout
          access: write
          content: Finite operation result; next uses rutter.voyage-next/v1
          formats:
          - json
          sensitivity: derived-private
        - id: stderr
          medium: stderr
          access: write
          content: Operation error
          formats:
          - json
          sensitivity: derived-private
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
