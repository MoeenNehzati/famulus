authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Regenerates schema-documented YAML comments for an existing skill blueprint
  into a validated temporary candidate without changing the source blueprint's parsed
  values.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-authoring
    - assistant-architecture
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  regenerate-blueprints.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: regenerate-blueprints.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: regenerate-blueprints
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        regenerate-blueprints._rtx.interface.regenerate-blueprint: 1
    interface_access:
      regenerate-blueprints._rtx.interface.regenerate-blueprint:
        allow_all_modules: true
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  regenerate-blueprints.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: stable
installation_tier: core
personal_preference:
  applies: false
