authority:
  owns_filesystem: []
children:
  regenerate-blueprints-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Regenerates schema-documented YAML comments for an existing skill blueprint
  into a validated temporary candidate without changing the source blueprint's parsed
  values.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-development
    topics:
    - assistant-authoring
    - assistant-architecture
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  regenerate-blueprints.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: regenerate-blueprints.source.gateway.interface.default
  regenerate-blueprints.interface.regenerate-blueprint:
    access:
      allow_all_modules: true
      allowed_callers: []
    facade_interface:
      interface: regenerate-blueprints-rtx.interface.regenerate-blueprint
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: regenerate-blueprints
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  regenerate-blueprints.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
