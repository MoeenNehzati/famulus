authority:
  owns_filesystem:
  - allowed_readers: []
    match: regex
    path: ^\$tmp/[A-Za-z0-9-]+_blueprint\.yaml$
    reason: Candidate regenerated blueprints are outputs of this interface.
  suggested_permissions:
    bash: []
    network: []
category: skill-making-development-assistant
description: Regenerates schema-documented YAML comments for an existing skill blueprint
  into a validated temporary candidate without changing the source blueprint's parsed values.
content:
- SKILL\.md
- _rtx/_blueprint_regenerator\.py
discovery:
  mechanism: skill
exports:
  regenerate-blueprints.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: regenerate-blueprints.source.gateway.interface.default
  regenerate-blueprints.interface.regenerate-blueprint:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: regenerate-blueprints.source.rtx-blueprint-regenerator.interface.regenerate-blueprint
gateway:
  language: Markdown
  path: SKILL.md
id: regenerate-blueprints
kind: generator
node_type: module
role: meta-skill
schema_version: 4
sources:
  regenerate-blueprints.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  regenerate-blueprints.source.rtx-blueprint-regenerator:
    blueprint:
      base: module-root
      path: blueprints/rtx-blueprint-regenerator.yaml
version: 1
