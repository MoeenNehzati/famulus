content:
- _blueprint_regenerator\.py
dependencies:
- blueprint:
    base: repository-root
    path: references/blueprint/blueprints/schema-annotated-draft.yaml
  reason: Supplies schema documentation and validation rules for regenerated output.
  source: blueprint.source.schema-annotated-draft
  version: 1
description: Loads one existing skill root blueprint, selects its authoring schema,
  refreshes only generated YAML documentation comments, validates the preserved parsed
  values, and writes the candidate under /tmp.
gateway:
  language: Python
  path: _blueprint_regenerator.py
id: regenerate-blueprints-rtx.source.rtx-blueprint-regenerator
interfaces:
  regenerate-blueprints-rtx.source.rtx-blueprint-regenerator.interface.regenerate-blueprint:
    contract:
      arguments:
        skill-name:
          description: Exact dash-separated directory name below the repository skills
            directory.
          required: true
          sensitivity: public
          type:
            format:
              regex:
                dialect: python
                example: skill-maker
                matching: full
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)+$
            kind: string
      caller_warnings:
      - external-side-effect: Replaces /tmp/<skill-name>_blueprint.yaml after schema
          validation; the source blueprint is never written.
      direct_io:
        network: []
        reads:
        - access: read
          content: blueprint
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: $repo/skills/*/blueprint.yaml
          path_match: glob
          reason: Reads the source skill blueprint values to preserve them.
          sensitivity: public
          system: filesystem
        - access: read
          content: blueprint
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: $repo/references/blueprint/*.schema.json
          path_match: glob
          reason: Loads the selected authoring schema and every sibling schema needed
            to resolve local JSON Schema references.
          sensitivity: public
          system: filesystem
        writes:
        - access: write
          content: blueprint
          formats:
          - yaml
          id: write-1
          medium: local-filesystem
          path: $tmp/*_blueprint.yaml
          path_match: glob
          reason: Writes the regenerated candidate blueprint.
          sensitivity: public
          system: filesystem
        - access: write
          content: candidate path
          formats:
          - text
          id: write-2
          medium: stdout
          reason: Print the absolute regenerated candidate path.
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: error
          formats:
          - text
          id: write-3
          medium: stderr
          reason: Report parser, source, validation, or filesystem failure.
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The candidate preserves the parsed source blueprint values read
            during this invocation.
        effects:
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: candidate-path
          direct_io_ref: write-1
          id: candidate-file
          may_occur_in_outcomes:
          - generated
          reversibility:
            irreversible: A prior temporary candidate at the same path is overwritten
              without backup.
          value_source:
            argument_ref: skill-name
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: The candidate is written with Path.write_text rather than
              an atomic replacement.
          concurrent_invocations:
            unsafe: Concurrent regeneration of the same skill can overwrite the same
              temporary path.
          idempotency:
            idempotent: Unchanged source values and schemas produce the same parsed
              candidate values and documentation.
          on_uncertain_completion:
            verify_then_decide: Validate and inspect the reported temporary path before
              retrying.
          partial_effects_on_failure:
            possible: A filesystem failure can leave an incomplete prior-path replacement.
          rollback_on_failure:
            unavailable: The interface retains no backup of a prior temporary candidate.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: candidate-path
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the temporary candidate; do not assume the source blueprint
          changed.
        class: success
        effects:
        - candidate-file
        id: generated
        outputs:
        - candidate-path
      - caller_action: Correct the named skill or reported schema/value failure before
          retrying.
        class: error
        effects: []
        id: failed
        outputs:
        - error
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Absolute path of the regenerated candidate printed to stdout.
        direct_io_ref: write-2
        empty: Never empty on success.
        id: candidate-path
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          description: Absolute temporary blueprint path
          kind: string
          sensitivity: derived-private
      - audience: human
        cardinality:
          maximum: 1
          minimum: 0
        description: Parser, missing-blueprint, YAML, schema, value-preservation,
          or filesystem failure emitted by the runtime.
        direct_io_ref: write-3
        empty: Empty on success.
        id: error
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Generate a refreshed blueprint YAML for one existing skill under
      /tmp.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        max_positionals: 1
        min_positionals: 1
        name: skill-name
        positional_patterns:
          '0': ^[a-z0-9]+(?:-[a-z0-9]+)+$
    usage: <skill-name>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses and emits blueprint YAML.
  version: any
- kind: python-package
  name: jsonschema
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Validates regenerated blueprints before writing output.
  version: any
schema_version: 5
uses_interfaces:
- interface: common.interface.blueprint-template
  version: 1
version: 1
