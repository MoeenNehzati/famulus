content:
- SKILL\.md
dependencies: []
description: Owns the LLM-facing rules for requesting one temporary, schema-documented
  replacement blueprint while leaving the source skill unchanged.
gateway:
  language: Markdown
  path: SKILL.md
id: regenerate-blueprints.source.gateway
interfaces:
  regenerate-blueprints.source.gateway.interface.default:
    contract:
      arguments:
        skill-name:
          description: Exact dash-separated directory name of the existing skill whose
            blueprint should be regenerated.
          required: true
          sensitivity: public
          type:
            format:
              regex:
                dialect: python
                example: skill-maker
                matching: full
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)+$
            kind: string
      caller_warnings:
      - external-side-effect: The delegated regenerator writes one candidate YAML
          file under /tmp and does not edit the source skill.
      direct_io:
        network: []
        reads:
        - access: read
          content: regeneration request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        writes:
        - access: write
          content: regeneration result
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The response reports the delegated regeneration result for the
            source blueprint read during this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the candidate path; the live blueprint remains unchanged.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Report the validation or missing-blueprint error.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Generated candidate path or a validation failure.
        direct_io_ref: write-1
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Regenerate one existing skill blueprint into /tmp, report its path
      or validation failure, and never modify the source blueprint.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: regenerate-blueprints._rtx.interface.regenerate-blueprint
  version: 1
version: 1
maturity: stable
