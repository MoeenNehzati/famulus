authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
description: Builds, persists, refreshes, renders, and mutates a daily plan from calendar,
  weather, todo, and triage data.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - planning
    - personal-organization
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  daily-plan.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: daily-plan.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: daily-plan
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        daily-plan._rtx.interface.mutate-plan: 1
        daily-plan._rtx.interface.orchestrate: 1
        daily-plan._rtx.interface.plan-storage: 1
        daily-plan._rtx.interface.render-plan: 1
    interface_access:
      daily-plan._rtx.interface.mutate-plan:
        allow_all_modules: false
        allowed_callers: []
      daily-plan._rtx.interface.orchestrate:
        allow_all_modules: false
        allowed_callers: []
      daily-plan._rtx.interface.plan-storage:
        allow_all_modules: false
        allowed_callers: []
      daily-plan._rtx.interface.render-plan:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  daily-plan.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
