authority:
  owns_filesystem: []
children:
  daily-plan-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Builds, persists, refreshes, renders, and mutates a daily plan from calendar,
  weather, todo, and triage data.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - planning
    - personal-organization
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  daily-plan.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: daily-plan.source.gateway.interface.default
  daily-plan.interface.mutate-plan:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: daily-plan-rtx.interface.mutate-plan
      version: 1
  daily-plan.interface.orchestrate:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: daily-plan-rtx.interface.orchestrate
      version: 1
  daily-plan.interface.plan-storage:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: daily-plan-rtx.interface.plan-storage
      version: 1
  daily-plan.interface.render-plan:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: daily-plan-rtx.interface.render-plan
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: daily-plan
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  daily-plan.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
