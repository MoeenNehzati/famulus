content:
- _state_patch\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: daily-plan-rtx.source.rtx-init
  version: 1
description: Applies one supported dated-plan mutation, propagates master-list changes
  where required, and prints the refreshed plan.
gateway:
  language: Python
  path: _state_patch.py
id: daily-plan-rtx.source.rtx-state-patch
interfaces:
  daily-plan-rtx.source.rtx-state-patch.interface.mutate-plan:
    contract:
      arguments:
        command:
          description: Plan mutation command and command-specific operands.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        date:
          description: Optional plan date in M-D-YY or YYYY-MM-DD form; defaults to
            today.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Delegated storage and list interfaces may update the
          dated plan or master list.
      direct_io:
        network: []
        reads:
        - access: read
          content: dated plan
          formats:
          - markdown
          id: read-1
          medium: remote-filesystem
          path: plans/<date>.md
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: read
          content: plan metadata
          formats:
          - json
          id: read-2
          medium: remote-filesystem
          path: plans/<date>.meta.json
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: read
          content: master list
          formats:
          - yaml
          id: read-3
          medium: remote-filesystem
          path: lists/<todo-or-triage>.yaml
          path_match: exact
          sensitivity: user-private
          system: google-drive
        writes:
        - access: write
          content: plan
          formats:
          - markdown
          id: write-1
          medium: stdout
          sensitivity: user-private
        - access: write
          content: dated plan
          formats:
          - markdown
          id: write-2
          medium: remote-filesystem
          path: plans/<date>.md
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: write
          content: plan metadata
          formats:
          - json
          id: write-3
          medium: remote-filesystem
          path: plans/<date>.meta.json
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: write
          content: master list
          formats:
          - yaml
          id: write-4
          medium: remote-filesystem
          path: lists/<todo-or-triage>.yaml
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-5
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          per_source: The plan and list sources are read and updated by delegated
            interfaces during this invocation.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-4
            kind: direct-io
          direct_io_ref: write-4
          id: master-list-update
          may_occur_in_outcomes:
          - plan-and-list-updated
          - partial
          reversibility:
            compensatable: A later list update can restore known prior values, but
              this interface retains no previous list snapshot.
          value_source:
            argument_ref: command
            kind: argument
        - action: update
          confirmation_evidence:
            direct_io_ref: write-3
            kind: direct-io
          direct_io_ref: write-3
          id: plan-metadata-update
          may_occur_in_outcomes:
          - plan-updated
          - plan-and-list-updated
          - partial
          reversibility:
            compensatable: A later plan mutation can rewrite metadata, but this interface
              retains no previous metadata.
          value_source:
            direct_io_ref: write-3
            kind: direct-io
        - action: update
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: dated-plan-update
          may_occur_in_outcomes:
          - plan-updated
          - plan-and-list-updated
          - partial
          reversibility:
            compensatable: A later refresh can rewrite the plan, but this interface
              retains no previous Markdown.
          value_source:
            kind: output
            output_ref: plan
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: Optional master-list update, metadata write, and plan write
              are separate delegated operations.
          concurrent_invocations:
            unsafe: Concurrent mutations can derive writes from stale plan metadata
              or master-list snapshots.
          idempotency:
            non_idempotent: Repeating visible-index operations such as remove can
              target different entries after the first mutation.
          on_uncertain_completion:
            verify_then_decide: Re-read the plan and metadata and any affected master
              list before retrying.
          partial_effects_on_failure:
            possible: A master-list or metadata write can succeed before a later delegated
              write fails.
          rollback_on_failure:
            unavailable: Previous remote plan, metadata, and list values are not retained
              for automatic restoration.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: plan
        - direct_io_ref: write-2
          method: direct-io-state
        - direct_io_ref: write-3
          method: direct-io-state
        - direct_io_ref: write-4
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Present the refreshed plan after a plan-local command.
        class: success
        effects:
        - plan-metadata-update
        - dated-plan-update
        id: plan-updated
        outputs:
        - plan
      - caller_action: Present the refreshed plan after a master-list-backed command.
        class: success
        effects:
        - master-list-update
        - plan-metadata-update
        - dated-plan-update
        id: plan-and-list-updated
        outputs:
        - plan
      - caller_action: Correct the date and command and section and visible indices
          and deadline or item identifier.
        class: refusal
        effects: []
        id: invalid
        outputs:
        - diagnostic
      - caller_action: Correct or report the delegated read or validation failure
          without claiming state changed.
        class: error
        effects: []
        id: failed
        outputs:
        - diagnostic
      - caller_action: Re-read the dated plan and metadata and, for master-list-backed
          commands, the affected list before deciding whether to retry.
        class: partial
        effects:
        - master-list-update
        - plan-metadata-update
        - dated-plan-update
        id: partial
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Refreshed plan after the requested mutation.
        direct_io_ref: write-1
        empty: Never empty on success.
        id: plan
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: user-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-5
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Apply a mutation (hide, show, keep, remove, mark-done, reject, set-deadline,
      add) to a dated plan and display the refreshed result. Defaults to today when
      --date is omitted.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --date
        flag_patterns:
          --date: ^(\d{1,2}-\d{1,2}-\d{2}|\d{4}-\d{2}-\d{2})$
        max_positionals: 3
        min_positionals: 3
        name: indexed-or-add
        positional_patterns:
          '0': ^(hide|show|keep|remove|mark-done|reject|add)$
          '1': ^(actions|triage)$
      - allow_stdin: false
        allowed_flags:
        - --date
        flag_patterns:
          --date: ^(\d{1,2}-\d{1,2}-\d{2}|\d{4}-\d{2}-\d{2})$
        max_positionals: 4
        min_positionals: 4
        name: set-deadline
        positional_patterns:
          '0': ^set-deadline$
          '1': ^(actions|triage)$
    usage: '[--date <M-D-YY|YYYY-MM-DD>] {hide,show,keep,remove,mark-done,reject,set-deadline,add}
      ...'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Reads and writes YAML plan/list data through plan_runtime.
  version: '>=6'
schema_version: 5
uses_interfaces:
- interface: cloud-files.interface.lists-read
  version: 1
- interface: cloud-files.interface.lists-write
  version: 1
- interface: cloud-files.interface.plans-read
  version: 1
- interface: cloud-files.interface.plans-write
  version: 1
- interface: common.interface.dates
  version: 1
- interface: g-calendar.interface.scripts-gcal
  version: 1
- interface: get-weather.interface.scripts-weather
  version: 1
- interface: list-manager.interface.read-beautify
  version: 1
- interface: list-manager.interface.update-list
  version: 1
version: 1
