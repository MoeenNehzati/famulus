content:
- _plan_storage\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: daily-plan-rtx.source.rtx-init
  version: 1
description: Implements read, write, existence, and delete operations for dated plan
  Markdown on the configured Google Drive remote.
gateway:
  language: Python
  path: _plan_storage.py
id: daily-plan-rtx.source.rtx-plan-storage
interfaces:
  daily-plan-rtx.source.rtx-plan-storage.interface.plan-storage:
    contract:
      arguments:
        content:
          description: UTF-8 plan Markdown supplied on stdin for write.
          required: false
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        date:
          description: Plan date key accepted by the shared date normalizer.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        operation:
          description: Cloud-plan operation.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - description: Return the plan Markdown.
              value: read
            - description: Store stdin as the plan.
              value: write
            - description: Report whether the plan exists.
              value: exists
            - description: Delete the plan.
              value: delete
      caller_warnings:
      - external-side-effect: Write and delete change the dated plan in the configured
          Google Drive remote.
      - rate-limited: The configured rclone remote and Google Drive service may throttle
          requests.
      direct_io:
        network:
        - access: read-write
          auth:
            kind: rclone-config
            mode: uses-existing
          content: plan
          endpoint: GDrive:assistant/plans/<date>.md
          formats:
          - markdown
          id: network-1
          medium: network-request
          sensitivity: user-private
          system: google-drive
        reads:
        - access: read
          auth:
            kind: rclone-config
            mode: uses-existing
          content: plan
          formats:
          - markdown
          id: read-1
          medium: remote-filesystem
          path: plans/<date>.md
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: read
          content: plan
          formats:
          - markdown
          id: read-2
          medium: stdin
          sensitivity: user-private
        writes:
        - access: write
          auth:
            kind: rclone-config
            mode: uses-existing
          content: plan
          formats:
          - markdown
          id: write-1
          medium: remote-filesystem
          path: plans/<date>.md
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: delete
          auth:
            kind: rclone-config
            mode: uses-existing
          content: plan
          formats:
          - markdown
          id: write-2
          medium: remote-filesystem
          path: plans/<date>.md
          path_match: exact
          sensitivity: user-private
          system: google-drive
        - access: write
          content: response
          formats:
          - text
          id: write-3
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          live: Each operation targets current state in the configured remote.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: plan-write
          may_occur_in_outcomes:
          - stored
          reversibility:
            compensatable: A later write or delete can compensate but previous content
              is not retained.
          value_source:
            argument_ref: content
            kind: argument
        - action: delete
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: plan-delete
          may_occur_in_outcomes:
          - delete-attempted
          reversibility:
            irreversible: Deleted plan content is not retained by this interface.
          value_source:
            argument_ref: date
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Each rclone operation is issued separately.
          concurrent_invocations:
            unsafe: Concurrent operations on the same dated plan are not serialized.
          idempotency:
            idempotent: Repeating an identical write or deleting an already absent
              file leaves equivalent remote state.
          on_uncertain_completion:
            verify_then_decide: Run exists or read before retrying.
          partial_effects_on_failure:
            possible: The remote may complete an operation before the local command
              reports failure.
          rollback_on_failure:
            unavailable: Previous plan content is not retained.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Consume returned Markdown; empty stdout does not distinguish
          an empty file from a suppressed rclone read failure.
        class: success
        effects: []
        id: read
        outputs:
        - response
      - caller_action: Interpret the returned existence result.
        class: success
        effects: []
        id: exists
        outputs:
        - response
      - caller_action: Treat the dated plan as absent.
        class: no-op
        effects: []
        id: absent
        outputs:
        - response
      - caller_action: Continue after verifying remote plan state.
        class: success
        effects:
        - plan-write
        id: stored
        outputs: []
      - caller_action: Verify absence explicitly because the implementation suppresses
          the rclone delete status.
        class: partial
        effects:
        - plan-delete
        id: delete-attempted
        outputs: []
      - caller_action: Report the rclone write error and verify remote state before
          retrying.
        class: error
        effects: []
        id: write-failed
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 0
        description: Plan Markdown for read or a textual existence result.
        direct_io_ref: write-3
        empty: Write and delete complete without a response body.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: user-private
      preconditions: []
    description: Read, write, check existence of, or delete a plan file in cloud storage
      by date.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        max_positionals: 2
        min_positionals: 2
        name: read
        positional_patterns:
          '0': ^read$
      - allow_stdin: true
        max_positionals: 2
        min_positionals: 2
        name: write
        positional_patterns:
          '0': ^write$
      - allow_stdin: false
        max_positionals: 2
        min_positionals: 2
        name: exists
        positional_patterns:
          '0': ^exists$
      - allow_stdin: false
        max_positionals: 2
        min_positionals: 2
        name: delete
        positional_patterns:
          '0': ^delete$
    usage: read|write|exists|delete <date>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: binary
  name: rclone
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Reads and writes plan files in the configured GDrive remote.
  version: any
schema_version: 5
uses_interfaces: []
version: 1
