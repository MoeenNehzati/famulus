content:
- _rtx/_state_patch\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: daily-plan.source.rtx-init
  version: 1
description: Applies one supported dated-plan mutation, propagates master-list changes where required, and prints the refreshed plan.
gateway:
  language: Python
  path: _rtx/_state_patch.py
id: daily-plan.source.rtx-state-patch
interfaces:
  daily-plan.source.rtx-state-patch.interface.mutate-plan:
    contract:
      arguments:
        date: {description: Optional plan date in M-D-YY or YYYY-MM-DD form; defaults to today., required: false, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
        command: {description: Plan mutation command and command-specific operands., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Delegated storage and list interfaces may update the dated plan or master list.
      outputs:
      - {id: plan, audience: both, description: Refreshed plan after the requested mutation., direct_io_ref: write-1, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty on success., type: {kind: string, sensitivity: user-private}}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-5, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: plan-updated, class: success, outputs: [plan], effects: [plan-metadata-update, dated-plan-update], caller_action: Present the refreshed plan after a plan-local command.}
      - {id: plan-and-list-updated, class: success, outputs: [plan], effects: [master-list-update, plan-metadata-update, dated-plan-update], caller_action: Present the refreshed plan after a master-list-backed command.}
      - {id: invalid, class: refusal, outputs: [diagnostic], effects: [], caller_action: Correct the date and command and section and visible indices and deadline or item identifier.}
      - {id: failed, class: error, outputs: [diagnostic], effects: [], caller_action: Correct or report the delegated read or validation failure without claiming state changed.}
      - {id: partial, class: partial, outputs: [diagnostic], effects: [master-list-update, plan-metadata-update, dated-plan-update], caller_action: "Re-read the dated plan and metadata and, for master-list-backed commands, the affected list before deciding whether to retry."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {per_source: The plan and list sources are read and updated by delegated interfaces during this invocation.}
        effects:
        - {id: master-list-update, direct_io_ref: write-4, action: update, value_source: {kind: argument, argument_ref: command}, may_occur_in_outcomes: [plan-and-list-updated, partial], confirmation_evidence: {kind: direct-io, direct_io_ref: write-4}, reversibility: {compensatable: "A later list update can restore known prior values, but this interface retains no previous list snapshot."}}
        - {id: plan-metadata-update, direct_io_ref: write-3, action: update, value_source: {kind: direct-io, direct_io_ref: write-3}, may_occur_in_outcomes: [plan-updated, plan-and-list-updated, partial], confirmation_evidence: {kind: direct-io, direct_io_ref: write-3}, reversibility: {compensatable: "A later plan mutation can rewrite metadata, but this interface retains no previous metadata."}}
        - {id: dated-plan-update, direct_io_ref: write-2, action: update, value_source: {kind: output, output_ref: plan}, may_occur_in_outcomes: [plan-updated, plan-and-list-updated, partial], confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}, reversibility: {compensatable: "A later refresh can rewrite the plan, but this interface retains no previous Markdown."}}
        mutation_safety:
          atomicity: {non_atomic: "Optional master-list update, metadata write, and plan write are separate delegated operations."}
          concurrent_invocations: {unsafe: Concurrent mutations can derive writes from stale plan metadata or master-list snapshots.}
          idempotency: {non_idempotent: Repeating visible-index operations such as remove can target different entries after the first mutation.}
          on_uncertain_completion: {verify_then_decide: Re-read the plan and metadata and any affected master list before retrying.}
          partial_effects_on_failure: {possible: A master-list or metadata write can succeed before a later delegated write fails.}
          rollback_on_failure: {unavailable: "Previous remote plan, metadata, and list values are not retained for automatic restoration."}
        verification:
        - {method: output-schema, output_ref: plan}
        - {method: direct-io-state, direct_io_ref: write-2}
        - {method: direct-io-state, direct_io_ref: write-3}
        - {method: direct-io-state, direct_io_ref: write-4}
      helpers: []
      direct_io:
        network: []
        reads:
        - {id: read-1, medium: remote-filesystem, access: read, system: google-drive, content: dated plan, formats: [markdown], sensitivity: user-private, path: plans/<date>.md, path_match: exact}
        - {id: read-2, medium: remote-filesystem, access: read, system: google-drive, content: plan metadata, formats: [json], sensitivity: user-private, path: plans/<date>.meta.json, path_match: exact}
        - {id: read-3, medium: remote-filesystem, access: read, system: google-drive, content: master list, formats: [yaml], sensitivity: user-private, path: lists/<todo-or-triage>.yaml, path_match: exact}
        writes:
        - access: write
          content: plan
          formats:
          - markdown
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {id: write-2, medium: remote-filesystem, access: write, system: google-drive, content: dated plan, formats: [markdown], sensitivity: user-private, path: plans/<date>.md, path_match: exact}
        - {id: write-3, medium: remote-filesystem, access: write, system: google-drive, content: plan metadata, formats: [json], sensitivity: user-private, path: plans/<date>.meta.json, path_match: exact}
        - {id: write-4, medium: remote-filesystem, access: write, system: google-drive, content: master list, formats: [yaml], sensitivity: user-private, path: lists/<todo-or-triage>.yaml, path_match: exact}
        - {access: write, content: diagnostic-report, formats: [text], id: write-5, medium: stderr, sensitivity: derived-private}
    description: Apply a mutation (hide, show, keep, remove, mark-done, reject, set-deadline,
      add) to a dated plan and display the refreshed result. Defaults to today when
      --date is omitted.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --date
        flag_patterns:
          --date: ^(\d{1,2}-\d{1,2}-\d{2}|\d{4}-\d{2}-\d{2})$
        max_positionals: 3
        min_positionals: 3
        name: indexed-or-add
        positional_patterns:
          '0': ^(hide|show|keep|remove|mark-done|reject|add)$
          '1': ^(actions|triage)$
      - allow_stdin: false
        allowed_flags:
        - --date
        flag_patterns:
          --date: ^(\d{1,2}-\d{1,2}-\d{2}|\d{4}-\d{2}-\d{2})$
        max_positionals: 4
        min_positionals: 4
        name: set-deadline
        positional_patterns:
          '0': ^set-deadline$
          '1': ^(actions|triage)$
    usage: '[--date <M-D-YY|YYYY-MM-DD>] {hide,show,keep,remove,mark-done,reject,set-deadline,add}
      ...'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Reads and writes YAML plan/list data through plan_runtime.
  version: '>=6'
schema_version: 4
uses_interfaces: []
version: 1
