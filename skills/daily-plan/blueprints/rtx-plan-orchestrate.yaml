content:
- _rtx/_plan_orchestrate\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: daily-plan.source.rtx-init
  version: 1
description: Generates today's plan when absent or forced, otherwise refreshes its rendered list sections and prints it.
gateway:
  language: Python
  path: _rtx/_plan_orchestrate.py
id: daily-plan.source.rtx-plan-orchestrate
interfaces:
  daily-plan.source.rtx-plan-orchestrate.interface.orchestrate:
    contract:
      arguments:
        forced: {description: Regenerate even when today's plan already exists., required: false, default: false, sensitivity: public, type: {kind: flag}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Every successful invocation rewrites today's plan metadata and rendered Markdown through delegated storage.
      outputs:
      - {id: plan, audience: both, description: Current display-ready daily plan Markdown., direct_io_ref: write-1, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty on success., type: {kind: string, sensitivity: user-private}}
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-4, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: completed, class: success, outputs: [plan], effects: [plan-metadata-update, dated-plan-update], caller_action: Present the plan exactly as returned.}
      - {id: failed, class: error, outputs: [diagnostic], effects: [], caller_action: Report the failing calendar or weather or list or storage dependency.}
      - {id: partial, class: partial, outputs: [diagnostic], effects: [plan-metadata-update, dated-plan-update], caller_action: Re-read today's metadata and plan before deciding whether to retry.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {per_source: Calendar and weather and list and stored-plan inputs are observed during their delegated calls.}
        effects:
        - {id: plan-metadata-update, direct_io_ref: write-3, action: update, value_source: {kind: direct-io, direct_io_ref: write-3}, may_occur_in_outcomes: [completed, partial], confirmation_evidence: {kind: direct-io, direct_io_ref: write-3}, reversibility: {compensatable: "A later orchestration can rewrite metadata, but this interface retains no previous metadata."}}
        - {id: dated-plan-update, direct_io_ref: write-2, action: update, value_source: {kind: output, output_ref: plan}, may_occur_in_outcomes: [completed, partial], confirmation_evidence: {kind: direct-io, direct_io_ref: write-2}, reversibility: {compensatable: "A later orchestration can rewrite the plan, but this interface retains no previous Markdown."}}
        mutation_safety:
          atomicity: {non_atomic: Metadata and rendered plan are written as separate delegated operations.}
          concurrent_invocations: {unsafe: Concurrent runs can derive and write plans from different upstream snapshots.}
          idempotency: {idempotent: "Repeating against unchanged calendar, weather, list, and stored-plan inputs produces equivalent persisted state."}
          on_uncertain_completion: {verify_then_decide: Re-read today's metadata and plan before retrying.}
          partial_effects_on_failure: {possible: Metadata can be written before a later rendered-plan write fails.}
          rollback_on_failure: {unavailable: Previous remote metadata and plan values are not retained.}
        verification:
        - {method: output-schema, output_ref: plan}
        - {method: direct-io-state, direct_io_ref: write-2}
        - {method: direct-io-state, direct_io_ref: write-3}
      helpers: []
      direct_io:
        network: []
        reads:
        - {id: read-1, medium: remote-filesystem, access: read, system: google-drive, content: dated plan, formats: [markdown], sensitivity: user-private, path: plans/<today>.md, path_match: exact}
        - {id: read-2, medium: remote-filesystem, access: read, system: google-drive, content: plan metadata, formats: [json], sensitivity: user-private, path: plans/<today>.meta.json, path_match: exact}
        - {id: read-3, medium: remote-filesystem, access: read, system: google-drive, content: master list, formats: [yaml], sensitivity: user-private, path: lists/<todo-or-triage>.yaml, path_match: exact}
        writes:
        - access: write
          content: plan
          formats:
          - markdown
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {id: write-2, medium: remote-filesystem, access: write, system: google-drive, content: dated plan, formats: [markdown], sensitivity: user-private, path: plans/<today>.md, path_match: exact}
        - {id: write-3, medium: remote-filesystem, access: write, system: google-drive, content: plan metadata, formats: [json], sensitivity: user-private, path: plans/<today>.meta.json, path_match: exact}
        - {access: write, content: diagnostic-report, formats: [text], id: write-4, medium: stderr, sensitivity: derived-private}
    description: Generate today's plan (or show the existing one, refreshing its Todo/Triage
      blocks from current list state). Pass --forced to regenerate even if a plan
      already exists.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags: []
        max_positionals: 0
        min_positionals: 0
      - allow_stdin: false
        allowed_flags:
        - --forced
        max_positionals: 0
        min_positionals: 0
        required_flags:
        - --forced
    usage: '[--forced]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: false
  windows: false
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: false
    windows: false
  reason: Reads and writes YAML plan/list data through plan_runtime.
  version: '>=6'
schema_version: 4
uses_interfaces: []
version: 1
