content:
- SKILL\.md
dependencies:
- blueprint:
    base: repository-root
    path: references/skill-standards/blueprints/interface-design.yaml
  reason: Defines source-owned interface contracts and when to decompose natural-language
    instruction sources.
  source: skill-standards.source.interface-design
  version: 1
- blueprint:
    base: repository-root
    path: references/skill-standards/blueprints/skill-guidelines.yaml
  reason: Defines repository skill-module standards used during refactoring.
  source: skill-standards.source.skill-guidelines
  version: 1
- blueprint:
    base: repository-root
    path: references/skill-standards/blueprints/skill-refactoring.yaml
  reason: Defines both diagnostic signals and behavior-preserving refactoring moves.
  source: skill-standards.source.skill-refactoring
  version: 1
description: Implements characterization-first skill refactoring, complete smell and
  interface-boundary audits, approval-gated moves, and behavior-preservation checks.
gateway:
  language: Markdown
  path: SKILL.md
id: refactor-skills.source.gateway
interfaces:
  refactor-skills.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Skill review or refactoring request naming the target skill
            and desired convention or structural improvement.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Approved refactoring may edit, move, create, or remove
          skill files and generated contract artifacts.
      - external-side-effect: The final convention step may commit and push only after
          the user confirms the exact diff and publication.
      direct_io:
        network:
        - access: upload
          content: Explicitly approved commit and branch-ref publication.
          endpoint: Configured repository remote
          formats:
          - git-pack
          - git-refs
          id: git-remote
          medium: network
          reason: Complete the separately confirmed commit-and-push convention step.
          sensitivity: user-private
          system: git
        reads:
        - access: read
          content: Refactoring target, requested scope, approvals, and user decisions.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Target SKILL.md, blueprint graph, generated contract blocks, current
            diff, and any approved private runtime implementation.
          formats:
          - markdown
          - yaml
          - json
          - python
          - shell
          - git-metadata
          - text
          id: repository-state
          medium: repository-filesystem
          reason: Characterize observable behavior, preserve public contracts, and
            verify each move.
          sensitivity: user-private
        - access: read
          content: Canonical smell catalog and ordered behavior-preserving refactoring
            moves.
          formats:
          - markdown
          id: refactoring-standards
          medium: repository-filesystem
          path: references/skill-standards/skill-refactoring.md
          path_match: exact
          reason: Audit every smell and choose the prescribed move.
          sensitivity: public
        - access: read
          content: Source-owned interface and conditional instruction-source decomposition
            standard.
          formats:
          - markdown
          id: interface-guide
          medium: repository-filesystem
          path: references/skill-standards/interface-design.md
          path_match: exact
          reason: Evaluate substantial distinct use cases or read-only and mutating
            paths when decomposition signals are present.
          sensitivity: public
        writes:
        - access: write
          content: Characterization, findings, plan, approval gate, and verified result.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: Approved skill source, runtime, blueprint, generated contract,
            and Git metadata changes.
          formats:
          - markdown
          - yaml
          - json
          - python
          - shell
          - git-metadata
          - text
          id: repository-write
          medium: repository-filesystem
          reason: Apply one approved behavior-preserving move at a time and optionally
            record the confirmed commit.
          sensitivity: user-private
        - access: execute
          content: Inspection, generation, validation, test, commit, and push commands
            selected by the approved workflow.
          formats:
          - argv
          - text
          id: refactor-command
          medium: subprocess
          reason: Verify each move and perform only separately confirmed Git actions.
          sensitivity: user-private
          system: repository tools and git
      execution:
        consistency:
          live: Each move is checked against the characterization and current repository
            state before the next move begins.
        effects:
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: repository-write
          id: repository-change
          may_occur_in_outcomes:
          - refactored
          - published
          - partial
          reversibility:
            reversible: Restore only the current move after checking the exact diff
              and unrelated work.
          value_source:
            argument_ref: request
            kind: argument
        - action: send
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: git-remote
          id: remote-push
          may_occur_in_outcomes:
          - published
          reversibility:
            compensatable: Remote publication requires a coordinated follow-up and
              is not automatically rolled back.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Refactoring moves, generated artifacts, commits, and
              pushes are separate effects.
          concurrent_invocations:
            unsafe: Concurrent edits can invalidate the characterization, exact diff,
              or verification of a move.
          idempotency:
            non_idempotent: Repeating structural moves or Git publication can change
              or duplicate state.
          on_uncertain_completion:
            verify_then_decide: Re-read the exact target diff, generated contracts,
              tests, branch, and remote evidence before proceeding.
          partial_effects_on_failure:
            possible: A verified earlier move may remain after a later move, validation,
              commit, or push fails.
          rollback_on_failure:
            available: Revert only the failed current-session move after checking
              ownership and overlap.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: repository-state
          method: direct-io-state
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: approval-required
      outcomes:
      - caller_action: Confirm the full ordered refactoring plan before any move is
          applied.
        class: success
        effects: []
        id: plan-ready
        outputs:
        - response
      - caller_action: Approve the exact plan, any private-runtime inspection, and
          any later Git publication separately.
        class: refusal
        effects: []
        id: approval-required
        outputs:
        - response
      - caller_action: Review the verified behavioral invariant and exact diff before
          deciding whether to commit.
        class: success
        effects:
        - repository-change
        id: refactored
        outputs:
        - response
      - caller_action: Verify the commit identity, branch, remote ref, and remaining
          dirty state.
        class: success
        effects:
        - repository-change
        - remote-push
        id: published
        outputs:
        - response
      - caller_action: Preserve the last verified move and resolve or revert the failed
          move before continuing.
        class: partial
        effects:
        - repository-change
        id: partial
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Behavioral characterization, quoted smell findings, interface-decomposition
          decision, ordered plan, approval request, or verified refactoring result.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Characterize and audit a skill, obtain approval for an ordered plan,
      then apply and verify one behavior-preserving move at a time.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces: []
version: 1
