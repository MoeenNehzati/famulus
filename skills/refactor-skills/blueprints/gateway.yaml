content:
- SKILL\.md
dependencies:
- blueprint:
    base: repository-root
    path: references/skill-standards/blueprints/interface-design.yaml
  reason: Defines source-owned interface contracts and when to decompose natural-language instruction sources.
  source: skill-standards.source.interface-design
  version: 1
- blueprint:
    base: repository-root
    path: references/skill-standards/blueprints/skill-guidelines.yaml
  reason: Defines repository skill-module standards used during refactoring.
  source: skill-standards.source.skill-guidelines
  version: 1
- blueprint:
    base: repository-root
    path: references/skill-standards/blueprints/skill-refactoring.yaml
  reason: Defines both diagnostic signals and behavior-preserving refactoring moves.
  source: skill-standards.source.skill-refactoring
  version: 1
description: Implements characterization-first skill refactoring, complete smell
  and interface-boundary audits, approval-gated moves, and behavior-preservation checks.
gateway:
  language: Markdown
  path: SKILL.md
id: refactor-skills.source.gateway
interfaces:
  refactor-skills.source.gateway.interface.default:
    contract:
      arguments:
        request: {description: Skill-audit or refactoring request naming the target skill and desired convention or structural improvement., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      preconditions: []
      interaction: {mode: interactive, channel: tty, unattended_outcome: approval-required}
      caller_warnings:
      - external-side-effect: Approved refactoring may edit, move, create, or remove skill files and generated contract artifacts.
      - external-side-effect: The final convention step may commit and push only after the user confirms the exact diff and publication.
      outputs:
      - {id: response, audience: human, description: 'Behavioral characterization, quoted smell findings, interface-decomposition decision, ordered plan, approval request, or verified refactoring result.', direct_io_ref: response, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: plan-ready, class: success, outputs: [response], effects: [], caller_action: Confirm the full ordered refactoring plan before any move is applied.}
      - {id: approval-required, class: refusal, outputs: [response], effects: [], caller_action: "Approve the exact plan, any private-runtime inspection, and any later Git publication separately."}
      - {id: refactored, class: success, outputs: [response], effects: [repository-change], caller_action: Review the verified behavioral invariant and exact diff before deciding whether to commit.}
      - {id: published, class: success, outputs: [response], effects: [repository-change, remote-push], caller_action: "Verify the commit identity, branch, remote ref, and remaining dirty state."}
      - {id: partial, class: partial, outputs: [response], effects: [repository-change], caller_action: Preserve the last verified move and resolve or revert the failed move before continuing.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: Each move is checked against the characterization and current repository state before the next move begins.}
        effects:
        - {id: repository-change, direct_io_ref: repository-write, action: update, value_source: {kind: argument, argument_ref: request}, may_occur_in_outcomes: [refactored, published, partial], confirmation_evidence: {kind: output, output_ref: response}, reversibility: {reversible: Restore only the current move after checking the exact diff and unrelated work.}}
        - {id: remote-push, direct_io_ref: git-remote, action: send, value_source: {kind: argument, argument_ref: request}, may_occur_in_outcomes: [published], confirmation_evidence: {kind: output, output_ref: response}, reversibility: {compensatable: Remote publication requires a coordinated follow-up and is not automatically rolled back.}}
        mutation_safety:
          atomicity: {per_effect_only: "Refactoring moves, generated artifacts, commits, and pushes are separate effects."}
          concurrent_invocations: {unsafe: "Concurrent edits can invalidate the characterization, exact diff, or verification of a move."}
          idempotency: {non_idempotent: Repeating structural moves or Git publication can change or duplicate state.}
          on_uncertain_completion: {verify_then_decide: "Re-read the exact target diff, generated contracts, tests, branch, and remote evidence before proceeding."}
          partial_effects_on_failure: {possible: "A verified earlier move may remain after a later move, validation, commit, or push fails."}
          rollback_on_failure: {available: Revert only the failed current-session move after checking ownership and overlap.}
        verification:
        - {method: output-schema, output_ref: response}
        - {method: direct-io-state, direct_io_ref: repository-state}
      helpers: []
      direct_io:
        network:
        - {id: git-remote, medium: network, access: upload, system: git, endpoint: Configured repository remote, content: Explicitly approved commit and branch-ref publication., formats: [git-pack, git-refs], sensitivity: user-private, reason: Complete the separately confirmed commit-and-push convention step.}
        reads:
        - {id: request, medium: prompt, access: read, system: agent-runtime, content: "Refactoring target, requested scope, approvals, and user decisions.", formats: [text], sensitivity: user-private}
        - {id: repository-state, medium: repository-filesystem, access: read, content: 'Target SKILL.md, blueprint graph, generated contract blocks, current diff, and any approved private runtime implementation.', formats: [markdown, yaml, json, python, shell, git-metadata, text], sensitivity: user-private, reason: "Characterize observable behavior, preserve public contracts, and verify each move."}
        - {id: refactoring-standards, medium: repository-filesystem, access: read, path: references/skill-standards/skill-refactoring.md, path_match: exact, content: Canonical smell catalog and ordered behavior-preserving refactoring moves., formats: [markdown], sensitivity: public, reason: Audit every smell and choose the prescribed move.}
        - {id: interface-guide, medium: repository-filesystem, access: read, path: references/skill-standards/interface-design.md, path_match: exact, content: Source-owned interface and conditional instruction-source decomposition standard., formats: [markdown], sensitivity: public, reason: Evaluate substantial distinct use cases or read-only and mutating paths when decomposition signals are present.}
        writes:
        - {id: response, medium: prompt, access: write, system: agent-runtime, content: "Characterization, findings, plan, approval gate, and verified result.", formats: [markdown], sensitivity: derived-private}
        - {id: repository-write, medium: repository-filesystem, access: write, content: 'Approved skill source, runtime, blueprint, generated contract, and Git metadata changes.', formats: [markdown, yaml, json, python, shell, git-metadata, text], sensitivity: user-private, reason: Apply one approved behavior-preserving move at a time and optionally record the confirmed commit.}
        - {id: refactor-command, medium: subprocess, access: execute, system: repository tools and git, content: 'Inspection, generation, validation, test, commit, and push commands selected by the approved workflow.', formats: [argv, text], sensitivity: user-private, reason: Verify each move and perform only separately confirmed Git actions.}
    description: Characterize and audit a skill, obtain approval for an ordered plan, then apply and verify one behavior-preserving move at a time.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
