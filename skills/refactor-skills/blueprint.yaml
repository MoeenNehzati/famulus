authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
category: skill-making-development-assistant
children:
  refactor-skills-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Characterizes existing skill behavior, diagnoses structural smells, and
  applies approved behavior-preserving refactoring moves with verification.
discovery:
  mechanism: skill
exports:
  refactor-skills.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: refactor-skills.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: refactor-skills
kind: maintenance
namespace_exports: {}
node_type: module
role: meta-skill
schema_version: 5
sources:
  refactor-skills.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
