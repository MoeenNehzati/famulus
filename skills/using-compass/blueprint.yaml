schema_version: 6
node_type: module
id: using-compass
version: 5
description: Operates one authorized bound Rutter through its public reduction API and current instruction.
gateway:
  path: SKILL.md
  language: Markdown
content:
- (?:SKILL\.md|tests/test_using_compass_instructions\.py)
authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - task-automation
    - session-management
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
sources:
  using-compass.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
children: {}
namespace_exports: {}
exports:
  using-compass.interface.default:
    source_interface: using-compass.source.gateway.interface.default
    access:
      allow_all_modules: true
      allowed_callers: []
