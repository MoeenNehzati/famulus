schema_version: 6
node_type: behavioral_source
id: using-compass.source.gateway
version: 7
description: Defines the thin bootstrap for operating one authorized,
  self-describing Voyage.
gateway:
  path: SKILL.md
  language: Markdown
content:
- SKILL\.md
dependencies: []
uses_interfaces:
- interface: rutter.interface.bound-operations
  version: 6
interfaces:
  using-compass.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: rutter.interface.bound-operations
      version: 6
    version: 7
    description: Ask one authorized Voyage for its public operating interface and
      follow only the methods it advertises.
    usage: request=<Use compass on rutter-name>; binding=<one authorized Voyage>
    contract:
      arguments:
        request:
          description: Literal Compass request naming the Rutter undertaking to operate.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        binding:
          description: Invoker-provided runtime value containing one authorized,
            self-describing Voyage.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Voyage value supplied by the authorized invoker.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Normal continuation may execute automatic external work
          through the Voyage; that work cannot be rolled back by Compass.
      outputs:
      - id: response
        audience: both
        cardinality:
          minimum: 1
          maximum: 1
        description: Result of following the Voyage's advertised public interface,
          or a public-interface gap.
        direct_io_ref: response
        empty: Never empty.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      outcomes:
      - id: completed
        class: success
        outputs:
        - response
        effects:
        - voyage-operation
        caller_action: Return the result obtained by following the advertised public
          interface.
      - id: interface-gap
        class: refusal
        outputs:
        - response
        effects: []
        caller_action: Repair the public Rutter interface or binding instead of searching
          internals.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
            live: Help and every subsequently advertised operation come from the
              same authorized Voyage.
        effects:
        - id: voyage-operation
          direct_io_ref: voyage
          action: execute
          value_source:
            kind: argument
            argument_ref: binding
          may_occur_in_outcomes:
          - completed
          confirmation_evidence:
            kind: output
            output_ref: response
          reversibility:
            irreversible: The caller has no rollback authority for state or external
              effects encapsulated by the Voyage interface.
        mutation_safety:
          atomicity:
            per_effect_only: Each advertised operation owns its own atomicity contract.
          concurrent_invocations:
            safe: Cooperating Voyage callers serialize operations through the
              same Reckoning transaction.
          idempotency:
            non_idempotent: Advertised operations may advance durable state or affect
              external systems.
          on_uncertain_completion:
            verify_then_decide: Follow the Voyage's advertised public guidance and
              stop if it does not establish a safe continuation.
          partial_effects_on_failure:
            possible: A late durability failure may leave a whole successor visible;
              an interrupted external effect may leave planned or uncertain recovery
              authority.
          rollback_on_failure:
            unavailable: Reckoning replacement cannot roll back external systems.
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      direct_io:
        reads:
        - id: request
          medium: prompt
          system: agent-runtime
          access: read
          content: Literal Compass request for the Voyage undertaking.
          formats:
          - text
          sensitivity: user-private
        writes:
        - id: response
          medium: prompt
          system: agent-runtime
          access: write
          content: Result obtained through the advertised interface, or an
            interface-gap report.
          formats:
          - markdown
          sensitivity: derived-private
        - id: voyage
          medium: local-system
          access: execute
          system: rutter.interface.bound-operations
          content: The authorized Voyage's self-described public operations; durable
            traversal is encapsulated by the consumed interface.
          formats:
          - python-object
          sensitivity: user-private
        network: []
maturity: stable
