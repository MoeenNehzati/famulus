schema_version: 6
node_type: behavioral_source
id: using-compass.source.gateway
version: 5
description: Defines thin LLM-facing rules for operating one authorized bound Rutter
  through its four public operations and two-part Message.
gateway:
  path: SKILL.md
  language: Markdown
content:
- SKILL\.md
dependencies: []
uses_interfaces:
- interface: rutter.interface.bound-operations
  version: 3
interfaces:
  using-compass.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - interface: rutter.interface.bound-operations
      version: 3
    version: 5
    description: Settle one authorized bound Rutter to its deepest active leaf, follow
      one two-part Message, and submit its Response through the sole advancing operation.
    usage: request=<Use compass on rutter-name>; binding=<one authorized bound Rutter
      instance>
    contract:
      arguments:
        request:
          description: Literal Compass request naming the Rutter undertaking to operate.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        binding:
          description: Invoker-provided runtime value containing one authorized bound
            Rutter instance with four public operations.
          required: true
          sensitivity: user-private
          type:
            kind: string
            description: Bound Rutter value supplied by the authorized invoker.
            sensitivity: user-private
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Normal continuation may execute automatic external work
          through the bound Rutter; that work cannot be rolled back by Compass.
      outputs:
      - id: response
        audience: both
        cardinality:
          minimum: 1
          maximum: 1
        description: Current Message evidence, ready NodeView, terminal result, fault,
          uncertainty, validation failure, or public-interface gap.
        direct_io_ref: response
        empty: Never empty.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      outcomes:
      - id: ready
        class: success
        outputs:
        - response
        effects:
        - bound-rutter-operation
        caller_action: Read the exact two-part Message and submit its validated Response
          through next.
      - id: terminal
        class: success
        outputs:
        - response
        effects:
        - bound-rutter-operation
        caller_action: Stop and report the authoritative terminal status.
      - id: faulted
        class: error
        outputs:
        - response
        effects:
        - bound-rutter-operation
        caller_action: Stop and report the authoritative fault diagnostics.
      - id: uncertain
        class: error
        outputs:
        - response
        effects:
        - bound-rutter-operation
        caller_action: Stop for manual reconciliation without inventing a recovery
          transition.
      - id: response-required
        class: refusal
        outputs:
        - response
        effects: []
        caller_action: 'On RutterValidationError: Prompt response is required, inspect
          the current NodeView, call get_instruction, and perform the LLM instruction;
          this boundary does not return a ValidationReport.'
      - id: validation-failed
        class: refusal
        outputs:
        - response
        effects: []
        caller_action: Repair only from the returned public issues; the current
          active leaf remains unchanged.
      - id: interface-gap
        class: refusal
        outputs:
        - response
        effects: []
        caller_action: Repair the public Rutter interface or binding instead of searching
          internals.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Every operation resolves the deepest active leaf through the same
            bound Rutter; durable traversal remains encapsulated by that interface.
        effects:
        - id: bound-rutter-operation
          direct_io_ref: bound-rutter
          action: execute
          value_source:
            kind: argument
            argument_ref: binding
          may_occur_in_outcomes:
          - ready
          - terminal
          - faulted
          - uncertain
          confirmation_evidence:
            kind: output
            output_ref: response
          reversibility:
            irreversible: The caller has no rollback authority for state or external
              effects encapsulated by the bound Rutter interface.
        mutation_safety:
          atomicity:
            per_effect_only: Accepted traversal is durable, while external automatic
              work may require separate completion evidence.
          concurrent_invocations:
            safe: Cooperating bound Rutter callers serialize operations through the
              same Reckoning transaction.
          idempotency:
            non_idempotent: An accepted Response or automatic continuation can advance
              the durable revision and active node.
          on_uncertain_completion:
            verify_then_decide: Read the public current-node condition and stop for
              manual reconciliation.
          partial_effects_on_failure:
            possible: A late durability failure may leave a whole successor visible;
              an interrupted external effect may leave planned or uncertain recovery
              authority.
          rollback_on_failure:
            unavailable: Reckoning replacement cannot roll back external systems.
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      direct_io:
        reads:
        - id: request
          medium: prompt
          system: agent-runtime
          access: read
          content: Literal Compass request for the bound Rutter undertaking.
          formats:
          - text
          sensitivity: user-private
        writes:
        - id: response
          medium: prompt
          system: agent-runtime
          access: write
          content: Current Message evidence, validation issues, ready node, terminal
            result, fault, uncertainty, or interface-gap report.
          formats:
          - markdown
          sensitivity: derived-private
        - id: bound-rutter
          medium: local-system
          access: execute
          system: rutter.interface.bound-operations
          content: The authorized bound Rutter's get_instruction, validate, next,
            and get_current_node operations; durable traversal is encapsulated by
            the consumed interface.
          formats:
          - python-object
          sensitivity: user-private
        network: []
maturity: stable
