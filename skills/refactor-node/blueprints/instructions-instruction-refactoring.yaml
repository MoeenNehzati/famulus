content:
- instructions/instruction\-refactoring\.md
dependencies: []
description: Refactors an owned Markdown instruction source from its applicable standard
  closure.
gateway:
  language: Markdown
  path: instructions/instruction-refactoring.md
id: refactor-node.source.instruction-refactoring
interfaces:
  refactor-node.source.instruction-refactoring.interface.refactor-instructions:
    content:
    - instructions/instruction\-refactoring\.md
    uses_interfaces: []
    contract:
      arguments:
        request:
          description: Resolved owner, selected instruction scope, applicable standard
            closure, objective, constraints, and any approval to apply a proposal.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Approved moves may edit instruction and declaration
          files within the selected ownership boundary.
      direct_io:
        network: []
        reads:
        - access: read
          content: Resolved target, selected scope, objective, constraints, and approval.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Selected instruction source, generated boundaries, repository instructions,
            callers, tests, query-resolved ownership metadata, current diff, and validated
            standard closure.
          formats:
          - markdown
          - yaml
          - json
          - git-metadata
          - text
          id: repository-state
          medium: repository-filesystem
          reason: Compare the selected source with applicable desired behavior and
            evidence.
          sensitivity: user-private
        writes:
        - access: write
          content: Standard-backed diagnosis, proposal, approval request, exact diff,
            verification result, and stop reason.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
        - access: write
          content: Approved behavior-preserving instruction and declaration changes
            within the selected scope.
          formats:
          - markdown
          - yaml
          - json
          - text
          id: repository-write
          medium: repository-filesystem
          reason: Apply one approved standards-backed repair at a time.
          sensitivity: user-private
        - access: execute
          content: Focused tests, generators, validators, and diff inspection required
            by the selected standards.
          formats:
          - argv
          - text
          id: refactor-command
          medium: subprocess
          reason: Establish the baseline and verify each approved repair.
          sensitivity: user-private
          system: repository tools
      execution:
        consistency:
          per_source: Re-check the selected scope and applicable assertions after
            every move.
        effects:
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: repository-write
          id: repository-change
          may_occur_in_outcomes:
          - refactored
          - partial
          reversibility:
            reversible: Restore only the failed move after checking the exact diff
              and unrelated work.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Each repair and its generated consequences are verified
              before another repair.
          concurrent_invocations:
            unsafe: Concurrent edits can invalidate scope, standards, or verification.
          idempotency:
            non_idempotent: Repeating a repair can duplicate or further alter repository
              state.
          on_uncertain_completion:
            verify_then_decide: Re-read the exact diff and rerun selected verification
              before proceeding.
          partial_effects_on_failure:
            possible: Earlier verified repairs may remain when a later repair fails.
          rollback_on_failure:
            available: Revert only the failed current move without disturbing unrelated
              work.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: repository-state
          method: direct-io-state
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: approval-required
      outcomes:
      - caller_action: Review the standard-backed diagnosis and ordered proposal.
        class: success
        effects: []
        id: proposal-ready
        outputs:
        - response
      - caller_action: Approve the exact proposal before repository mutation.
        class: refusal
        effects: []
        id: approval-required
        outputs:
        - response
      - caller_action: Review the exact diff and verification evidence.
        class: success
        effects:
        - repository-change
        id: refactored
        outputs:
        - response
      - caller_action: Preserve verified repairs and resolve or revert only the failed
          move.
        class: partial
        effects:
        - repository-change
        id: partial
        outputs:
        - response
      - caller_action: Resolve the reported scope, standard, baseline, or verification
          failure.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Scope, applicable assertions, evidence, proposal, approval gate,
          diff, and verification result.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Diagnose and repair an owned instruction source from its applicable
      standards.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
