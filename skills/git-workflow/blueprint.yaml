authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- SKILL\.md
description: Enforces branch safety, change ownership, approval gates, and exact-scope
  hygiene for Git inspection, staging, commits, and pushes.
discovery:
  mechanism: skill
  catalog:
    domain: software-development
    topics:
    - repository-workflow
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  git-workflow.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: git-workflow.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: git-workflow
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  git-workflow.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
