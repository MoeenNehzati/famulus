content:
- SKILL\.md
dependencies: []
description: Implements repository safety checks and explicitly approved index, commit,
  and remote publication changes.
gateway:
  language: Markdown
  path: SKILL.md
id: git-workflow.source.gateway
interfaces:
  git-workflow.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces: []
    contract:
      arguments:
        request:
          description: Repository task and any explicit authorization to stage, commit,
            amend, restore, stash, or push selected changes.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Git mutations require exact scope and explicit authorization;
          publishing can affect collaborators.
      direct_io:
        network:
        - access: upload
          content: Approved commits and branch ref updates.
          endpoint: Configured repository remote
          formats:
          - git-pack
          - git-refs
          id: git-remote
          medium: network
          reason: Publish exact approved state.
          sensitivity: user-private
          system: git
        reads:
        - access: read
          content: Git task and authorization boundaries.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Symbolic HEAD, status, diffs, index, refs, commits, and remotes.
          formats:
          - git-metadata
          - text
          id: git-read
          medium: repository-filesystem
          reason: Establish safety and verify actions.
          sensitivity: user-private
        writes:
        - access: write
          content: Git diagnosis or verified result.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
        - access: configure
          content: Approved index, object, ref, stash, or worktree metadata changes.
          formats:
          - git-metadata
          id: git-write
          medium: repository-filesystem
          reason: Perform only authorized Git operations.
          sensitivity: user-private
        - access: execute
          content: Git inspection or authorized mutation commands.
          formats:
          - argv
          - text
          id: git-command
          medium: subprocess
          reason: Operate under branch and scope gates.
          sensitivity: user-private
          system: git
      execution:
        consistency:
          live: Branch, index, worktree, refs, and remotes are checked at each operation.
        effects:
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: git-write
          id: git-change
          may_occur_in_outcomes:
          - local-changed
          - published
          reversibility:
            compensatable: Recovery depends on the exact action and current repository
              state.
          value_source:
            argument_ref: request
            kind: argument
        - action: send
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: git-remote
          id: remote-push
          may_occur_in_outcomes:
          - published
          reversibility:
            compensatable: Remote publication needs a coordinated follow-up; it is
              not automatically rolled back.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: A multi-command workflow is not one transaction.
          concurrent_invocations:
            unsafe: Concurrent index or ref changes can invalidate scope and evidence.
          idempotency:
            non_idempotent: Repeating Git mutations can create different state or
              fail.
          on_uncertain_completion:
            verify_then_decide: Re-read status, refs, commit identity, and remote
              evidence.
          partial_effects_on_failure:
            possible: An earlier Git command may succeed before a later one fails.
          rollback_on_failure:
            unavailable: Inspect and ask before any compensating action.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: git-read
          method: direct-io-state
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: approval-required
      outcomes:
      - caller_action: Review branch safety, ownership, and proposed scope.
        class: success
        effects: []
        id: inspected
        outputs:
        - response
      - caller_action: Authorize the exact Git mutation.
        class: refusal
        effects: []
        id: approval-required
        outputs:
        - response
      - caller_action: Verify index, commit, refs, and remaining dirty state.
        class: success
        effects:
        - git-change
        id: local-changed
        outputs:
        - response
      - caller_action: Verify the remote branch and commit evidence.
        class: success
        effects:
        - git-change
        - remote-push
        id: published
        outputs:
        - response
      - caller_action: Preserve unrelated state and resolve the reported failure.
        class: error
        effects: []
        id: failed
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Branch and dirty-state diagnosis, scoped action result, or exact
          approval still required.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Check branch and ownership boundaries first, then perform only explicitly
      authorized and exactly scoped Git mutations.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
