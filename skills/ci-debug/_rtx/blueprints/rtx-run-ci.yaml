content:
- _run_ci\.py
- tests/test_runner_interfaces\.py
dependencies:
- blueprint: {base: module-root, path: blueprints/rtx-init.yaml}
  reason: Uses the shared repository-runner invocation boundary.
  source: ci-debug._rtx.source.rtx-init
  version: 1
description: Delegates the complete remote CI matrix to the canonical repository runner.
gateway: {language: Python>=3.11, path: _run_ci.py}
id: ci-debug._rtx.source.rtx-run-ci
interfaces:
  ci-debug._rtx.source.rtx-run-ci.interface.run-ci:
    contract:
      arguments:
        repo-root: {description: Repository containing the public check runner., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
        ref: {description: Pushed candidate reference., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
        expected-sha: {description: Exact candidate commit SHA., required: true, sensitivity: public, type: {kind: string, sensitivity: public}}
        output-dir: {description: Local directory for runner reports., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
        timeout: {default: 7200, description: Maximum runner wait in seconds., required: false, sensitivity: public, type: {kind: integer}}
      caller_warnings:
      - external-side-effect: The repository runner may dispatch remote CI; this interface does not mutate Git.
      direct_io:
        network: []
        reads:
        - {id: repository, medium: local-filesystem, system: filesystem, access: read, path: <repo-root>/**, path_match: glob, content: repository runner, formats: [python], sensitivity: user-private}
        writes:
        - {id: result, medium: stdout, system: agent-runtime, access: write, content: runner matrix report, formats: [json], sensitivity: derived-private}
        - {id: diagnostics, medium: stderr, system: agent-runtime, access: write, content: runner diagnostics, formats: [text], sensitivity: derived-private}
        - {id: reports, medium: local-filesystem, system: filesystem, access: write, path: <output-dir>/**, path_match: glob, content: runner-owned reports, formats: [json, text, xml], sensitivity: derived-private}
      execution:
        consistency: {snapshot: One invocation is bound to the supplied exact candidate SHA.}
        effects:
        - action: update
          confirmation_evidence: {direct_io_ref: reports, kind: direct-io}
          direct_io_ref: reports
          id: write-reports
          may_occur_in_outcomes: [reported]
          reversibility: {reversible: Remove the runner-owned output directory.}
          value_source: {argument_ref: output-dir, kind: argument}
        lifecycle: finite
        state_effect: mutating
        mutation_safety:
          atomicity: {non_atomic: The delegated remote run and report writes are separate effects.}
          concurrent_invocations: {unsafe: Callers coordinate duplicate full-CI dispatches.}
          idempotency: {non_idempotent: Repeating may dispatch another remote run.}
          on_uncertain_completion: {verify_then_decide: Inspect the runner output directory before dispatching again.}
          partial_effects_on_failure: {possible: A remote run may continue after local interruption.}
          rollback_on_failure: {unavailable: The interface does not cancel or delete remote runs.}
        verification: [{method: output-schema, output_ref: result}]
      helpers: []
      interaction: {mode: unattended}
      outcomes:
      - {id: reported, class: partial, effects: [write-reports], outputs: [result], caller_action: Use the returned matrix failures or accept green only when the complete report says green.}
      outputs:
      - {id: result, audience: both, cardinality: {minimum: 1, maximum: 1}, description: Canonical runner matrix report., direct_io_ref: result, empty: Never empty on a completed runner invocation., ordering: stable, pagination: {kind: none}, truncation: {kind: none}, type: {kind: string, sensitivity: derived-private}}
      preconditions: []
    description: Run the complete remote CI matrix for an exact pushed candidate.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        min_positionals: 0
        max_positionals: 0
        allowed_flags: [--repo-root, --ref, --expected-sha, --output-dir, --timeout]
        required_flags: [--repo-root, --ref, --expected-sha, --output-dir]
        flag_patterns: {--repo-root: '^.+$', --ref: '^.+$', --expected-sha: '^[0-9a-f]{40}$', --output-dir: '^.+$', --timeout: '^[1-9][0-9]*$'}
    usage: --repo-root REPO --ref REF --expected-sha SHA --output-dir DIR [--timeout SECONDS]
    version: 1
node_type: behavioral_source
platform_support: {linux: true, macos: true, windows: true}
runtime_dependencies: []
schema_version: 6
uses_interfaces: []
version: 1
