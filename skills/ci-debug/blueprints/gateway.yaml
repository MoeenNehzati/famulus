content: [SKILL\.md]
dependencies: []
description: Routes CI history analysis, exact-SHA qualification, and assigned matrix repair without mixing their authority boundaries.
gateway: {language: Markdown, path: SKILL.md}
id: ci-debug.source.gateway
interfaces:
  ci-debug.source.gateway.interface.default:
    content: [SKILL\.md]
    uses_interfaces:
    - {interface: ci-debug.source.instructions-analyze-ci.interface.analyze-ci, version: 1}
    - {interface: ci-debug.source.instructions-qualify-ci.interface.qualify-ci, version: 2}
    - {interface: ci-debug.source.instructions-repair-element.interface.repair-element, version: 1}
    contract:
      arguments:
        request: {description: CI request and available evidence used only to select a route., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}
      caller_warnings:
      - external-side-effect: Qualification and repair routes may dispatch CI or mutate invocation-owned Git state; analysis only creates the selected private evidence tree.
      direct_io:
        network: []
        reads:
        - {id: request, medium: prompt, system: agent-runtime, access: read, content: CI request and evidence, formats: [text], sensitivity: user-private}
        writes:
        - {id: response, medium: prompt, system: agent-runtime, access: write, content: Selected route or clarification, formats: [markdown], sensitivity: derived-private}
      execution:
        consistency: {live: Routing uses the current structured request and never infers mutation authority from benchmark or cost language.}
        lifecycle: finite
        state_effect: read-only
        verification: [{method: output-schema, output_ref: response}]
      helpers: []
      interaction: {mode: interactive, channel: tty, unattended_outcome: clarification-required}
      outcomes:
      - {id: analysis-routed, class: success, effects: [], outputs: [response], caller_action: Follow analyze-ci with its complete structured arguments.}
      - {id: qualification-routed, class: success, effects: [], outputs: [response], caller_action: Follow qualify-ci and its Git authority boundaries.}
      - {id: repair-routed, class: success, effects: [], outputs: [response], caller_action: Follow repair-element for the assigned matrix element only.}
      - {id: clarification-required, class: refusal, effects: [], outputs: [response], caller_action: "Resolve mixed-operation or controlled-benchmark intent before continuing."}
      - {id: failed, class: error, effects: [], outputs: [response], caller_action: Resolve the reported routing-contract failure.}
      outputs:
      - {id: response, audience: human, cardinality: {minimum: 1, maximum: 1}, description: Selected route or exact clarification requirement., direct_io_ref: response, empty: Never empty., ordering: stable, pagination: {kind: none}, truncation: {kind: none}, type: {kind: string, sensitivity: derived-private}}
      preconditions: []
    description: Route one CI request to historical analysis, exact-SHA qualification, assigned-element repair, or clarification while keeping mutation authority explicit.
    usage: request=<CI request and available evidence>
    version: 3
node_type: behavioral_source
