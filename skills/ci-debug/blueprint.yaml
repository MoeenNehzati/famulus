authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|prevention\.md|instructions/(?:analyze-ci|qualify-ci|repair-element)\.md|tests/test_ci_debug_instructions\.py)
description: Routes CI history analysis, exact-SHA qualification, and isolated matrix-element repair with separate authority boundaries.
discovery:
  mechanism: skill
  catalog:
    domain: software-development
    topics:
    - repository-workflow
    - task-automation
    - assistant-assurance
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  ci-debug.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: ci-debug.source.gateway.interface.default
  ci-debug.interface.analyze-ci:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: ci-debug.source.instructions-analyze-ci.interface.analyze-ci
  ci-debug.interface.qualify-ci:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: ci-debug.source.instructions-qualify-ci.interface.qualify-ci
  ci-debug.interface.repair-element:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: ci-debug.source.instructions-repair-element.interface.repair-element
gateway:
  language: Markdown
  path: SKILL.md
id: ci-debug
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        ci-debug._rtx.interface.fetch-github-actions-history: 1
        ci-debug._rtx.interface.report-test-failures-between-green-runs: 1
        ci-debug._rtx.interface.report-ci-runtime-hotspots: 1
        ci-debug._rtx.interface.run-ci: 2
        ci-debug._rtx.interface.run-targeted-tests: 1
    interface_access:
      ci-debug._rtx.interface.fetch-github-actions-history:
        allow_all_modules: false
        allowed_callers: []
      ci-debug._rtx.interface.report-test-failures-between-green-runs:
        allow_all_modules: false
        allowed_callers: []
      ci-debug._rtx.interface.report-ci-runtime-hotspots:
        allow_all_modules: false
        allowed_callers: []
      ci-debug._rtx.interface.run-ci:
        allow_all_modules: false
        allowed_callers: []
      ci-debug._rtx.interface.run-targeted-tests:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  ci-debug.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  ci-debug.source.instructions-analyze-ci:
    blueprint:
      base: module-root
      path: blueprints/instructions-analyze-ci.yaml
  ci-debug.source.instructions-qualify-ci:
    blueprint:
      base: module-root
      path: blueprints/instructions-qualify-ci.yaml
  ci-debug.source.instructions-repair-element:
    blueprint:
      base: module-root
      path: blueprints/instructions-repair-element.yaml
version: 1
maturity: stable
installation_tier: core
personal_preference:
  applies: false
