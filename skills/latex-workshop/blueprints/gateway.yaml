content:
- SKILL\.md
dependencies: []
description: Implements workspace-first LaTeX Workshop configuration discovery, recipe
  reconstruction, fallback compilation, and output-directory-aware troubleshooting.
gateway:
  language: Markdown
  path: SKILL.md
id: latex-workshop.source.gateway
interfaces:
  latex-workshop.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Target TeX document and request to compile, rebuild, or troubleshoot
            using effective LaTeX Workshop behavior.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Compilation executes the configured recipe or latexmk
          fallback and writes artifacts in the resolved output directory.
      direct_io:
        network: []
        reads:
        - access: read
          content: LaTeX Workshop build or troubleshooting request.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: TeX sources, workspace files, build scripts, and workspace or user
            VS Code settings.
          formats:
          - tex
          - json
          - shell
          - makefile
          - text
          id: latex-inputs
          medium: local-filesystem
          reason: Resolve recipe, arguments, and output directory.
          sensitivity: user-private
        - access: read
          content: PDF, log, auxiliary, and bibliography artifacts in the resolved
            output directory.
          formats:
          - pdf
          - log
          - text
          - binary
          id: artifact-read
          medium: local-filesystem
          reason: Diagnose and verify the build.
          sensitivity: user-private
        writes:
        - access: write
          content: Build diagnosis and verified result.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
        - access: execute
          content: Reconstructed build command.
          formats:
          - argv
          - text
          id: build-command
          medium: subprocess
          reason: Compile with effective behavior.
          sensitivity: user-private
          system: configured LaTeX Workshop recipe or latexmk
        - access: write
          content: PDF, log, auxiliary, and bibliography build artifacts.
          formats:
          - pdf
          - log
          - text
          - binary
          id: artifact-write
          medium: local-filesystem
          reason: Materialize outputs in the resolved directory.
          sensitivity: user-private
      execution:
        consistency:
          snapshot: The recipe and output location are resolved immediately before
            compilation.
        effects:
        - action: execute
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: build-command
          id: build-run
          may_occur_in_outcomes:
          - built
          - build-failed
          reversibility:
            reversible: The build can be rerun after correcting inputs.
          value_source:
            argument_ref: request
            kind: argument
        - action: update
          confirmation_evidence:
            kind: output
            output_ref: response
          direct_io_ref: artifact-write
          id: artifact-update
          may_occur_in_outcomes:
          - built
          - build-failed
          reversibility:
            reversible: Generated artifacts can be rebuilt or removed.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: A recipe can write several artifacts before success or failure.
          concurrent_invocations:
            unsafe: Concurrent builds sharing an output directory can race on auxiliary
              files.
          idempotency:
            non_idempotent: Repeated builds update generated files and reference state.
          on_uncertain_completion:
            verify_then_decide: Inspect the process result and resolved artifacts
              before rerunning.
          partial_effects_on_failure:
            possible: Failed compilation commonly leaves logs and auxiliary files.
          rollback_on_failure:
            unavailable: Preserve logs and rebuild; no automatic rollback is performed.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - direct_io_ref: artifact-read
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the effective settings and reported issue.
        class: success
        effects: []
        id: diagnosed
        outputs:
        - response
      - caller_action: Inspect the reported artifacts in the resolved output directory.
        class: success
        effects:
        - build-run
        - artifact-update
        id: built
        outputs:
        - response
      - caller_action: Fix the first reported error before retrying.
        class: partial
        effects:
        - build-run
        - artifact-update
        id: build-failed
        outputs:
        - response
      - caller_action: Supply a valid target or configure the required build tool.
        class: error
        effects: []
        id: unavailable
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Build result or diagnosis, effective configuration source, artifact
          location, and fallback assumptions.
        direct_io_ref: response
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Resolve effective settings, execute the matching build, inspect the
      correct artifacts, and report the source of truth.
    version: 1
node_type: behavioral_source
schema_version: 5
uses_interfaces: []
version: 1
