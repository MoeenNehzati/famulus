authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - latexmk
      reason: Suggested approval for LaTeX Workshop-compatible builds.
    - command:
      - rg
      reason: Suggested approval for LaTeX Workshop-compatible builds.
    network: []
children: {}
content:
- SKILL\.md
description: Use when a user wants to compile, rebuild, or troubleshoot a TeX/LaTeX
  document and the build should match VS Code LaTeX Workshop settings, recipes,
  and output-directory conventions.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - scholarly-documents
    - research-writing
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  latex-workshop.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: latex-workshop.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: latex-workshop
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  latex-workshop.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
