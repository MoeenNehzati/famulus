authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - latexmk
      reason: Suggested approval for LaTeX Workshop-compatible builds.
    - command:
      - rg
      reason: Suggested approval for LaTeX Workshop-compatible builds.
    network: []
category: research-assistant
children:
  latex-workshop-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- SKILL\.md
description: Reconstructs and runs the effective VS Code LaTeX Workshop build for
  a target TeX document, then reads artifacts from the configured output location.
discovery:
  mechanism: skill
exports:
  latex-workshop.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: latex-workshop.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: latex-workshop
kind: builder
namespace_exports: {}
node_type: module
role: document-processing
schema_version: 5
sources:
  latex-workshop.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
