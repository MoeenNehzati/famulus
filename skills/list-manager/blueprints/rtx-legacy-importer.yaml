content:
- _rtx/_legacy_importer\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: list-manager.source.rtx-init
  version: 1
description: Python source that converts legacy Markdown checklists into validated YAML
  list documents without overwriting an existing destination.
gateway:
  language: Python
  path: _rtx/_legacy_importer.py
id: list-manager.source.rtx-legacy-importer
interfaces:
  list-manager.source.rtx-legacy-importer.interface.migrate-markdown:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: list
          formats:
          - markdown
          id: read-1
          medium: local-filesystem
          path: <source.md>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: list
          formats:
          - yaml
          id: write-1
          medium: local-filesystem
          path: <dest.yaml>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: response
          formats:
          - text
          id: write-2
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-3
          medium: stderr
          sensitivity: derived-private
      arguments:
        source: {description: Legacy Markdown list file to parse, required: true, sensitivity: user-private, direct_io_ref: read-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string}}}
        destination: {description: New YAML list file to create, required: true, sensitivity: user-private, direct_io_ref: write-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: false, access: write, content_type: {kind: string, format: {named: yaml}}}}
        schema: {description: Target list schema name, required: true, sensitivity: public, type: {kind: enum, values: [{value: todo, description: Todo list schema}, {value: triage, description: Triage action schema}, {value: default, description: Default list schema}]}}
        name: {description: Optional display name for the migrated list, required: false, sensitivity: user-private, type: {kind: string}}
      preconditions:
      - {id: readable-source, description: The Markdown source must exist and be readable, check: {kind: direct-io, direct_io_ref: read-1, predicate: readable}, unmet_outcome: error, caller_action: Supply a readable Markdown source file.}
      - {id: unused-destination, description: The destination must not already exist, check: {kind: direct-io, direct_io_ref: write-1, predicate: exists}, unmet_outcome: error, caller_action: Select a new destination path; the importer never overwrites.}
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Creates a validated YAML list file and refuses to overwrite an existing destination.
      outputs:
      - {id: result, audience: both, description: Migration confirmation naming the source and destination., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Always printed after a successful destination write., type: {kind: string, sensitivity: derived-private}}
      - {id: diagnostics, audience: both, description: Missing-deadline warnings or a terminal migration error emitted on stderr., direct_io_ref: write-3, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: bounded, limit: 7}, empty: Empty when migration has no warnings and does not fail., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: migrated, class: success, outputs: [result, diagnostics], effects: [destination-create], caller_action: Use the new YAML list and review any missing-deadline warnings.}
      - {id: error, class: error, outputs: [diagnostics], effects: [], caller_action: "Correct the source, destination, schema, or validation error before retrying."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Parses one snapshot of the Markdown source before writing the destination.}
        effects:
        - {id: destination-create, direct_io_ref: write-1, action: create, value_source: {kind: direct-io, direct_io_ref: read-1}, may_occur_in_outcomes: [migrated], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: Delete the newly created destination file if the migration should be discarded.}}
        mutation_safety:
          atomicity: {per_effect_only: The interface creates one destination file after parsing and validation.}
          concurrent_invocations: {unsafe: Concurrent calls targeting the same absent destination are not serialized.}
          idempotency: {non_idempotent: Repeating a successful call is refused because the destination exists.}
          on_uncertain_completion: {verify_then_decide: Check whether the destination exists and validates before retrying.}
          partial_effects_on_failure: {possible: A filesystem failure can interrupt destination writing.}
          rollback_on_failure: {unavailable: No automatic destination cleanup is guaranteed after a write failure.}
        verification:
        - {method: direct-io-state, direct_io_ref: write-1}
        - {method: output-schema, output_ref: result}
      helpers: []
    description: Migrate a legacy Markdown list to YAML format.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        min_positionals: 3
    usage: <source.md> <dest.yaml> --schema <schema>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: PyYAML
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Writes migrated YAML list files.
  version: '>=6'
- kind: python-package
  name: dateparser
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses natural-language legacy Markdown deadlines.
  version: any
- kind: python-package
  name: jsonschema
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Validates migrated entries before writing.
  version: '>=4'
schema_version: 4
uses_interfaces: []
version: 1
