        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        file: {description: Existing local YAML list file to read, required: true, sensitivity: user-private, direct_io_ref: read-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string, format: {named: yaml}}}}
