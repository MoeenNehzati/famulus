        patches: {description: "YAML sequence of patch objects read from a file or stdin, each with a stable string ID", required: true, sensitivity: user-private, type: {kind: string, format: {named: yaml}}}
        expected_revision: {description: "Optional optimistic-concurrency guard: only apply if the file's current 'revision' field equals this value; rejects with a stale-revision error and writes nothing otherwise.", required: false, sensitivity: user-private, type: {kind: integer}}
      preconditions:
      - {id: readable-list, description: The target list must exist and be readable, check: {kind: direct-io, direct_io_ref: read-1, predicate: readable}, unmet_outcome: error, caller_action: Supply an existing readable YAML list file.}
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Rewrites the local list and automatically stamps modified and first completion dates.
      outputs:
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: updated, class: success, outputs: [], effects: [list-update], caller_action: Re-read the affected IDs when confirmation is needed.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the patch sequence, stable ID, immutable field, field value, or schema error before retrying. A stale-revision error means a concurrent writer saved this file first -- re-read it and retry."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: "Reads one local snapshot, applies every patch, validates it, and rewrites the file."}
        effects:
        - {id: list-update, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: patches}, may_occur_in_outcomes: [updated], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Apply another patch containing known prior field values.}}
        mutation_safety:
          atomicity: {non_atomic: The list file is written directly after validation without a transactional replacement guarantee.}
          concurrent_invocations: {unsafe: "Unsafe by default -- concurrent writers can overwrite one another -- unless the caller passes expected_revision, in which case a concurrent writer that saved first causes this call to be rejected before any write instead of silently clobbering it."}
          idempotency: {idempotent: "Reapplying the same field values converges, although modified is restamped on each touch."}
          on_uncertain_completion: {verify_then_decide: Re-read the affected IDs before retrying.}
          partial_effects_on_failure: {possible: A filesystem failure can interrupt the rewrite.}
          rollback_on_failure: {unavailable: The previous file value is not retained for automatic rollback.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
    description: Update entries in a local YAML list file from a patch file (keyed
      by id) or stdin.
    process_binding:
      args_prefix:
      - update
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --file
        - --expected-revision
        flag_patterns:
          --file: ^.+$
          --expected-revision: ^[0-9]+$
        max_positionals: 1
        min_positionals: 1
        name: file-mode
        notes: Externally supported update mode; caller prepares the patch file.
        required_flags:
        - --file
      - allow_stdin: true
        allowed_flags:
        - --expected-revision
        forbidden_flags:
        - --file
        flag_patterns:
          --expected-revision: ^[0-9]+$
        max_positionals: 1
        min_positionals: 1
        name: stdin-batch
        notes: Internal convenience mode for the owning skill when feeding YAML directly.
    usage: <file> --file /tmp/patch.yaml [--expected-revision N]
    version: 1
