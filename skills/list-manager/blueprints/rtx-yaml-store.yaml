  list-manager.source.rtx-yaml-store.interface.init-list:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: metadata
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: list
          formats:
          - yaml
          id: write-1
          medium: local-filesystem
          path: <file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
        - {access: write, content: response, formats: [text], id: write-3, medium: stdout, sensitivity: derived-private}
      arguments:
        file: {description: New local YAML list path to create, required: true, sensitivity: user-private, direct_io_ref: write-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: false, access: write, content_type: {kind: string, format: {named: yaml}}}}
        schema: {description: Entry schema for the new list, required: true, sensitivity: public, type: {kind: enum, values: [{value: todo, description: Todo list schema}, {value: triage, description: Triage action schema}, {value: default, description: Default list schema}]}}
        name: {description: Optional list display name; defaults to the filename stem, required: false, sensitivity: user-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Creates a new YAML list and refuses to overwrite an existing path.
      outputs:
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      - {id: result, audience: both, description: Success confirmation written to stdout., direct_io_ref: write-3, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A confirmation line is emitted on success., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: created, class: success, outputs: [result], effects: [list-create], caller_action: "Populate the new list through create-entry; todo/triage schemas start pre-seeded with usable default domain categories (Personal, Work) already carrying the schema's required subcategory set, not an empty list."}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: Choose an unused path and valid schema before retrying.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: "Validates a newly constructed list -- pre-seeded with default categories for todo/triage schemas, empty for schemas with no fixed category vocabulary -- before creating the file."}
        effects:
        - {id: list-create, direct_io_ref: write-1, action: create, value_source: {kind: argument, argument_ref: schema}, may_occur_in_outcomes: [created], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: Delete the newly created file while it is no longer needed.}}
        mutation_safety:
          atomicity: {per_effect_only: One validated list file is created as the sole effect.}
          concurrent_invocations: {unsafe: Concurrent callers targeting the same absent path are not serialized.}
          idempotency: {non_idempotent: Repeating a successful call is refused because the file exists.}
          on_uncertain_completion: {verify_then_decide: Check whether the file exists and validates before retrying.}
          partial_effects_on_failure: {possible: A filesystem failure can interrupt file creation.}
          rollback_on_failure: {unavailable: No automatic cleanup is guaranteed after an interrupted write.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
