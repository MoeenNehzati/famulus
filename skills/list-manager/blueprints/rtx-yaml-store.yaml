content:
- _rtx/_yaml_store\.py
- schemas/lists/default\.json
- schemas/lists/task\-list\-personal\.json
- schemas/lists/task\-list\.json
- schemas/lists/todo\.json
- schemas/lists/triage\.json
- schemas/types/action\.json
- schemas/types/entry\.json
- schemas/types/task_entry\.json
- schemas/types/triage_action\.json
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: list-manager.source.rtx-init
  version: 1
description: Python source implementing validated local and cloud-backed YAML list reads,
  initialization, entry creation, updates, deletion, ID generation, and schema description.
gateway:
  language: Python
  path: _rtx/_yaml_store.py
id: list-manager.source.rtx-yaml-store
interfaces:
  list-manager.source.rtx-yaml-store.interface.cloud-create-entry:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: patch
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: <entries-file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: patch
          formats:
          - yaml
          id: read-2
          medium: stdin
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        name: {description: Existing cloud list name to update, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        target: {description: Existing category path or parent entry ID receiving the new entries, required: true, sensitivity: user-private, type: {kind: string}}
        entries: {description: YAML sequence of entries read from a file or stdin, required: true, sensitivity: user-private, type: {kind: string, format: {named: yaml}}}
        expected_revision: {description: "Optional optimistic-concurrency guard: only apply if the downloaded snapshot's 'revision' field equals this value; rejects with a stale-revision error and uploads nothing otherwise.", required: false, sensitivity: user-private, type: {kind: integer}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Replaces the remote list after validating and adding entries to the downloaded snapshot.
      - rate-limited: Cloud read and write helpers consume Google Drive API quota.
      outputs:
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: created, class: success, outputs: [], effects: [cloud-list-update], caller_action: Re-read the affected category when confirmation is needed.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the list, target, entry schema, or cloud error; never upload after local validation failure. A stale-revision error means a concurrent writer saved this list first -- re-read it and retry."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: "Downloads current cloud content, mutates that snapshot, and uploads the validated result."}
        effects:
        - {id: cloud-list-update, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: entries}, may_occur_in_outcomes: [created], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Delete the newly assigned entry IDs with cloud-delete.}}
        mutation_safety:
          atomicity: {per_effect_only: Local mutation is validated before one remote upload; download and upload are not a transaction.}
          concurrent_invocations: {unsafe: "Unsafe by default -- concurrent cloud writers can overwrite changes made after this invocation downloads its snapshot -- unless the caller passes expected_revision, in which case a concurrent writer that saved first causes this call to be rejected before any upload instead of silently clobbering it."}
          idempotency: {non_idempotent: Repeating the request creates additional entries with new IDs.}
          on_uncertain_completion: {verify_then_decide: Re-read the target category and inspect stable IDs before retrying.}
          partial_effects_on_failure: {possible: Remote upload completion can be uncertain after a transport failure.}
          rollback_on_failure: {unavailable: The previous remote value is not retained for automatic rollback.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
    description: Add entries to a cloud list under a category path.
    process_binding:
      args_prefix:
      - create-entry
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: true
        allowed_flags:
        - --cloud
        - --expected-revision
        forbidden_flags:
        - --entries
        flag_patterns:
          --expected-revision: ^[0-9]+$
        max_positionals: 2
        min_positionals: 2
        name: stdin-mode
        positional_patterns:
          '0': ^[a-zA-Z0-9_-]+$
          '1': ^[a-zA-Z0-9_/-]+$
        required_flags:
        - --cloud
      - allow_stdin: false
        allowed_flags:
        - --cloud
        - --entries
        - --expected-revision
        flag_patterns:
          --entries: ^.+$
          --expected-revision: ^[0-9]+$
        max_positionals: 2
        min_positionals: 2
        name: file-mode
        positional_patterns:
          '0': ^[a-zA-Z0-9_-]+$
          '1': ^[a-zA-Z0-9_/-]+$
        required_flags:
        - --cloud
        - --entries
    usage: <name> <category/path> --cloud --entries /tmp/entry.yaml [--expected-revision N]
    version: 1
  list-manager.source.rtx-yaml-store.interface.cloud-delete:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: token
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        name: {description: Existing cloud list name to update, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        ids: {description: One or more stable six-character entry IDs to delete, required: true, sensitivity: user-private, type: {kind: list, element_type: {kind: string, format: {regex: {pattern: '^[0-9a-f]{6}$', dialect: python, matching: full, example: 010b76}}}}}
        expected_revision: {description: "Optional optimistic-concurrency guard: only apply if the downloaded snapshot's 'revision' field equals this value; rejects with a stale-revision error and uploads nothing otherwise.", required: false, sensitivity: user-private, type: {kind: integer}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Deletes each selected entry and its nested subtree from the remote list.
      - rate-limited: Cloud read and write helpers consume Google Drive API quota.
      outputs:
      - id: deleted
        audience: both
        description: One confirmation line per deleted stable ID.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: derived-private}
        cardinality: {minimum: 1, maximum: 1}
        ordering: sorted
        pagination: {kind: none}
        truncation: {kind: none}
        empty: A successful deletion always prints at least one confirmation line.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [deleted], effects: [cloud-list-update], caller_action: Use the confirmation lines as evidence of the requested deletions.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Re-read the list when any ID is missing; no deletion is uploaded in that case. A stale-revision error means a concurrent writer saved this list first -- re-read it and retry."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: "Downloads current cloud content, removes all requested IDs, validates, and uploads the result."}
        effects:
        - {id: cloud-list-update, direct_io_ref: write-1, action: delete, value_source: {kind: argument, argument_ref: ids}, may_occur_in_outcomes: [success], confirmation_evidence: {kind: output, output_ref: deleted}, reversibility: {irreversible: Deleted entry subtrees are not archived by this interface.}}
        mutation_safety:
          atomicity: {per_effect_only: "All IDs are checked before one validated remote upload, but download and upload are not transactional."}
          concurrent_invocations: {unsafe: "Unsafe by default -- concurrent cloud writers can overwrite changes made after this invocation downloads its snapshot -- unless the caller passes expected_revision, in which case a concurrent writer that saved first causes this call to be rejected before any upload instead of silently clobbering it."}
          idempotency: {non_idempotent: Repeating a successful deletion fails because the IDs are absent.}
          on_uncertain_completion: {verify_then_decide: Re-read the list and check whether every requested ID is absent before retrying.}
          partial_effects_on_failure: {possible: Remote upload completion can be uncertain after a transport failure.}
          rollback_on_failure: {unavailable: Deleted entries are not retained for automatic restoration.}
        verification: [{method: output-schema, output_ref: deleted}]
      helpers: []
    description: Delete one or more entries by id from a cloud list. Ids come after
      --cloud.
    process_binding:
      args_prefix:
      - delete
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        allowed_flags:
        - --cloud
        - --expected-revision
        flag_patterns:
          --expected-revision: ^[0-9]+$
        min_positionals: 2
        notes: Delete one or more entries by ID from a cloud list.
        positional_patterns:
          '0': ^[a-zA-Z0-9_-]+$
          '1': ^[0-9a-f]{6}$
        required_flags:
        - --cloud
    usage: <name> --cloud <id> [<id>...] [--expected-revision N]
    version: 1
  list-manager.source.rtx-yaml-store.interface.cloud-init:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: metadata
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        name: {description: New cloud list name, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        schema: {description: Entry schema for the new list, required: true, sensitivity: public, type: {kind: enum, values: [{value: todo, description: Todo list schema}, {value: triage, description: Triage action schema}, {value: default, description: Default list schema}]}}
        display-name: {description: Optional list display name; defaults to the cloud list name, required: false, sensitivity: user-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Uploads a new empty list document under the selected cloud name.
      - rate-limited: The cloud write helper consumes Google Drive API quota.
      outputs:
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      - {id: result, audience: both, description: Success confirmation written to stdout., direct_io_ref: write-1, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: A confirmation line is emitted on success., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: created, class: success, outputs: [result], effects: [cloud-list-create], caller_action: "Add entries through the supported list interfaces; todo/triage schemas start pre-seeded with usable default domain categories (Personal, Work) already carrying the schema's required subcategory set, not an empty list."}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the name, schema, validation, or cloud error before retrying."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: "Builds and validates a new list -- pre-seeded with default categories for todo/triage schemas, empty for schemas with no fixed category vocabulary -- before uploading it to current cloud state."}
        effects:
        - {id: cloud-list-create, direct_io_ref: write-1, action: create, value_source: {kind: argument, argument_ref: name}, may_occur_in_outcomes: [created], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Remove the uploaded list through the cloud storage owner if it is no longer wanted.}}
        mutation_safety:
          atomicity: {per_effect_only: One validated list document is uploaded as the sole remote effect.}
          concurrent_invocations: {unsafe: Concurrent creation under the same cloud name is not serialized.}
          idempotency: {non_idempotent: Repeating the call can replace or conflict with the same remote path depending on cloud storage state.}
          on_uncertain_completion: {verify_then_decide: Read the named cloud list before retrying an interrupted upload.}
          partial_effects_on_failure: {possible: Remote completion can be uncertain after a transport failure.}
          rollback_on_failure: {unavailable: No automatic remote deletion is attempted after an uncertain upload.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
    description: Create a new list in cloud storage.
    process_binding:
      args_prefix:
      - init
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --cloud
        - --schema
        - --name
        flag_patterns:
          --name: ^.+$
          --schema: ^.+$
        max_positionals: 1
        min_positionals: 1
        notes: Create a new list in cloud storage.
        positional_patterns:
          '0': ^[a-zA-Z0-9_-]+$
        required_flags:
        - --cloud
        - --schema
    usage: <name> --cloud --schema <schema>
    version: 1
  list-manager.source.rtx-yaml-store.interface.cloud-read:
    contract:
      direct_io:
        network: []
        reads: []
        writes:
        - access: write
          content: list
          formats:
          - yaml
          id: write-1
          medium: stdout
          sensitivity: user-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        name: {description: Cloud list name to read, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        filters: {description: Optional exact or regular-expression entry filters, required: false, default: [], sensitivity: user-private, type: {kind: list, element_type: {kind: string}}}
        sort: {description: Optional entry field used to sort matching branches, required: false, sensitivity: user-private, type: {kind: string}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - may-wait: Downloads and parses the named cloud list before filtering.
      - rate-limited: The cloud read helper consumes Google Drive API quota.
      outputs:
      - id: list
        audience: machine
        description: Raw YAML list document or ancestor-preserving filtered tree.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: user-private, format: {named: yaml}}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: No matching entries produces an empty pruned YAML result.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [list], effects: [], caller_action: Preserve the returned tree shape; do not flatten filtered results.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the list name, filter, sort field, schema, or cloud error."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: Downloads one current remote snapshot and filters only that snapshot.}
        verification: [{method: output-schema, output_ref: list}]
      helpers: []
    description: 'Read a cloud list by name (raw YAML), optionally filtered. A filtered
      read preserves structure: same shape as the full doc, pruned to only branches
      containing a match -- ancestor categories/parent entries are kept, and a match
      is never duplicated as both a nested child and a top-level result.'
    process_binding:
      args_prefix:
      - read
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        allowed_flags:
        - --cloud
        - --sort
        - -o
        - --output
        min_positionals: 1
        notes: Read cloud list by name (raw YAML), optionally filtered. Filtered output
          is a pruned tree, not a flat list of matches -- do not assume flat-list
          shape.
        positional_patterns:
          '0': ^[a-zA-Z0-9_-]+$
        required_flags:
        - --cloud
    usage: <name> [filters] --cloud
    version: 1
  list-manager.source.rtx-yaml-store.interface.cloud-update:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: patch
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: <patch-file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: patch
          formats:
          - yaml
          id: read-2
          medium: stdin
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - text
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        name: {description: Existing cloud list name to update, required: true, sensitivity: user-private, type: {kind: string, format: {named: identifier}}}
        patches: {description: YAML sequence of patch objects with quoted string IDs, required: true, sensitivity: user-private, type: {kind: string, format: {named: yaml}}}
        expected_revision: {description: "Optional optimistic-concurrency guard: only apply if the downloaded snapshot's 'revision' field equals this value; rejects with a stale-revision error and uploads nothing otherwise.", required: false, sensitivity: user-private, type: {kind: integer}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Replaces the remote list with the validated patched snapshot.
      - rate-limited: Cloud read and write helpers consume Google Drive API quota.
      outputs:
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: updated, class: success, outputs: [], effects: [cloud-list-update], caller_action: Re-read the affected entries when confirmation is needed.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the patch sequence, quoted ID, field value, list state, or cloud error; never upload after local validation failure. A stale-revision error means a concurrent writer saved this list first -- re-read it and retry."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {live: "Downloads current cloud content, patches and validates that snapshot, and uploads the result."}
        effects:
        - {id: cloud-list-update, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: patches}, may_occur_in_outcomes: [updated], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Apply another patch containing known prior values.}}
        mutation_safety:
          atomicity: {per_effect_only: All patches are validated before one remote upload; download and upload are not a transaction.}
          concurrent_invocations: {unsafe: "Unsafe by default -- concurrent cloud writers can overwrite changes made after this invocation downloads its snapshot -- unless the caller passes expected_revision, in which case a concurrent writer that saved first causes this call to be rejected before any upload instead of silently clobbering it."}
          idempotency: {idempotent: "Reapplying the same field values converges, although modified is restamped on each touch."}
          on_uncertain_completion: {verify_then_decide: Re-read the affected IDs before retrying an interrupted upload.}
          partial_effects_on_failure: {possible: Remote upload completion can be uncertain after a transport failure.}
          rollback_on_failure: {unavailable: The previous remote list is not retained for automatic rollback.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
    description: Update cloud-list entries from a YAML list of patch objects, each
      with a quoted string `id`; input is not a mapping keyed by id.
    process_binding:
      args_prefix:
      - update
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --cloud
        - --file
        - --expected-revision
        flag_patterns:
          --file: ^.+$
          --expected-revision: ^[0-9]+$
        max_positionals: 1
        min_positionals: 1
        name: file-mode
        notes: Patch file must contain a YAML list of objects; quote every id string.
        positional_patterns:
          '0': ^[a-zA-Z0-9_-]+$
        required_flags:
        - --cloud
        - --file
      - allow_stdin: true
        allowed_flags:
        - --cloud
        - --expected-revision
        forbidden_flags:
        - --file
        flag_patterns:
          --expected-revision: ^[0-9]+$
        max_positionals: 1
        min_positionals: 1
        name: stdin-mode
        notes: Stdin patch must contain a YAML list of objects; quote every id string.
        positional_patterns:
          '0': ^[a-zA-Z0-9_-]+$
        required_flags:
        - --cloud
    usage: <name> --cloud --file /tmp/patch.yaml [--expected-revision N]
    version: 1
  list-manager.source.rtx-yaml-store.interface.create-entry:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: list
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: <file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: patch
          formats:
          - yaml
          id: read-2
          medium: local-filesystem
          path: <entries-file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: patch
          formats:
          - yaml
          id: read-3
          medium: stdin
          sensitivity: user-private
        writes:
        - access: write
          content: list
          formats:
          - yaml
          id: write-1
          medium: local-filesystem
          path: <file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - {access: write, content: diagnostic-report, formats: [text], id: write-2, medium: stderr, sensitivity: derived-private}
      arguments:
        file: {description: Existing local YAML list file to modify, required: true, sensitivity: user-private, direct_io_ref: read-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read-write, content_type: {kind: string, format: {named: yaml}}}}
        target: {description: Existing category path or parent entry ID receiving the new entries, required: true, sensitivity: user-private, type: {kind: string}}
        entries: {description: YAML sequence of entries read from a file or stdin, required: true, sensitivity: user-private, type: {kind: string, format: {named: yaml}}}
        expected_revision: {description: "Optional optimistic-concurrency guard: only apply if the file's current 'revision' field equals this value; rejects with a stale-revision error and writes nothing otherwise.", required: false, sensitivity: user-private, type: {kind: integer}}
      preconditions:
      - {id: readable-list, description: The target list must exist and be readable, check: {kind: direct-io, direct_io_ref: read-1, predicate: readable}, unmet_outcome: error, caller_action: Supply an existing readable YAML list file.}
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Rewrites the local list after assigning missing IDs and schema-aware defaults.
      outputs:
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: created, class: success, outputs: [], effects: [list-update], caller_action: Re-read the affected category when confirmation is needed.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the file, target, entry shape, required fields, or schema error before retrying. A stale-revision error means a concurrent writer saved this file first -- re-read it and retry."}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: "Reads one local snapshot, mutates it in memory, validates it, and rewrites the file."}
        effects:
        - {id: list-update, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: entries}, may_occur_in_outcomes: [created], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {compensatable: Delete the newly assigned stable IDs if the additions should be undone.}}
        mutation_safety:
          atomicity: {non_atomic: The list file is written directly after validation without a transactional replacement guarantee.}
          concurrent_invocations: {unsafe: "Unsafe by default -- concurrent writers can overwrite one another -- unless the caller passes expected_revision, in which case a concurrent writer that saved first causes this call to be rejected before any write instead of silently clobbering it."}
          idempotency: {non_idempotent: Repeating the request creates additional entries with new IDs.}
