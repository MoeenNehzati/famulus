      preconditions:
      - {id: readable-list, description: The list file must exist and be readable, check: {kind: direct-io, direct_io_ref: read-1, predicate: readable}, unmet_outcome: error, caller_action: Supply an existing readable YAML list file.}
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - id: list
        audience: machine
        description: Raw YAML list document or ancestor-preserving filtered tree.
        direct_io_ref: write-1
        type: {kind: string, sensitivity: user-private, format: {named: yaml}}
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: No matching entries produces an empty pruned YAML result.
      - {id: diagnostic, audience: both, description: Caller-visible warning or error text written to stderr., direct_io_ref: write-2, cardinality: {minimum: 0, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: No stderr is emitted on paths without diagnostics., type: {kind: string, sensitivity: derived-private}}
      outcomes:
      - {id: success, class: success, outputs: [list], effects: [], caller_action: Preserve the returned tree shape; do not flatten filtered results.}
      - {id: error, class: error, outputs: [diagnostic], effects: [], caller_action: "Correct the file, filter, sort field, or schema error."}
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {snapshot: Reads and filters one local list snapshot.}
        verification: [{method: output-schema, output_ref: list}]
      helpers: []
    description: 'Read a local YAML list file, optionally filtered (raw YAML output).
      A filtered read preserves structure: it returns the same shape as the input
      (full doc with categories, or a bare list) pruned to only branches containing
      a match -- every ancestor category and parent entry of a match is kept for context,
      and a match is never duplicated as both a nested child and an independent top-level
      result.'
    process_binding:
      args_prefix:
      - read
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        min_positionals: 1
        notes: First positional is the local YAML file; remaining positionals are
          filters. Filtered output is a pruned tree (or pruned list, if the input
          itself was a bare list), not a flat list of matches -- do not assume flat-list
          shape.
    usage: <file> [filters]
    version: 1
