content:
- SKILL\.md
dependencies: []
description: LLM-facing routing and safety instructions for reading and mutating personal
  lists through the module's machine interfaces.
gateway:
  language: Markdown
  path: SKILL.md
id: list-manager.source.gateway
interfaces:
  list-manager.source.gateway.interface.default:
    contract:
      direct_io:
        network: []
        reads:
        - access: read
          content: document
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      arguments: {}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings: []
      outputs:
      - id: response
        audience: human
        description: A response that routes list work through the declared interfaces and
          relays rendered list output when requested.
        direct_io_ref: write-1
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: The response is nonempty on successful handling.
        type: {kind: string, sensitivity: derived-private, description: Markdown response}
      outcomes:
      - id: success
        class: success
        outputs: [response]
        effects: []
        caller_action: Present the response to the user.
      - id: blocked
        class: refusal
        outputs: [response]
        effects: []
        caller_action: Supply a missing required value or resolve the reported ambiguity before retrying.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency: {live: The response is based on the prompt and any interface results obtained during this invocation.}
        verification: [{method: direct-io-state, direct_io_ref: write-1}]
      helpers: []
    description: Primary LLM-facing skill instructions.
    version: 1
node_type: behavioral_source
schema_version: 4
uses_interfaces: []
version: 1
