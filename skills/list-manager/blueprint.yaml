authority:
  owns_filesystem: []
category: productivity-general-assistant
children:
  list-manager-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:SKILL\.md|lessons\.md|references/action\-structure\.md|references/list\-structure\.md)
description: Manage schema-validated local and cloud-backed personal lists through
  a Markdown LLM gateway and bounded Python interfaces for reading, rendering, creating,
  updating, deleting, and migrating list data.
discovery:
  mechanism: skill
exports:
  list-manager.interface.beautify-list:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.beautify-list
      version: 1
  list-manager.interface.cloud-create-entry:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.cloud-create-entry
      version: 1
  list-manager.interface.cloud-delete:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.cloud-delete
      version: 1
  list-manager.interface.cloud-init:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.cloud-init
      version: 1
  list-manager.interface.cloud-list-categories:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.cloud-list-categories
      version: 1
  list-manager.interface.cloud-read:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.cloud-read
      version: 1
  list-manager.interface.cloud-read-beautify:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.cloud-read-beautify
      version: 1
  list-manager.interface.cloud-update:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.cloud-update
      version: 1
  list-manager.interface.create-entry:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.create-entry
      version: 1
  list-manager.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: list-manager.source.gateway.interface.default
  list-manager.interface.describe-schema:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.describe-schema
      version: 1
  list-manager.interface.generate-id:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.generate-id
      version: 1
  list-manager.interface.init-list:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.init-list
      version: 1
  list-manager.interface.migrate-markdown:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: list-manager-rtx.interface.migrate-markdown
      version: 1
  list-manager.interface.read-beautify:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan-rtx
    facade_interface:
      interface: list-manager-rtx.interface.read-beautify
      version: 1
  list-manager.interface.read-list:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
    facade_interface:
      interface: list-manager-rtx.interface.read-list
      version: 1
  list-manager.interface.update-list:
    access:
      allow_all_modules: false
      allowed_callers:
      - daily-plan
      - daily-plan-rtx
    facade_interface:
      interface: list-manager-rtx.interface.update-list
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: list-manager
kind: state-manager
namespace_exports: {}
node_type: module
role: productivity
schema_version: 5
sources:
  list-manager.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
