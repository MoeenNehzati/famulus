authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|lessons\.md|references/action\-structure\.md|references/list\-structure\.md)
description: Manage schema-validated local and cloud-backed personal lists through
  a Markdown LLM gateway and bounded Python interfaces for reading, rendering, creating,
  updating, deleting, and migrating list data.
discovery:
  mechanism: skill
  catalog:
    domain: personal-assistance
    topics:
    - personal-organization
    - storage-and-sync
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  list-manager.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: list-manager.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: list-manager
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        list-manager._rtx.interface.beautify-list: 1
        list-manager._rtx.interface.cloud-create-entry: 1
        list-manager._rtx.interface.cloud-delete: 1
        list-manager._rtx.interface.cloud-init: 1
        list-manager._rtx.interface.cloud-list-categories: 1
        list-manager._rtx.interface.cloud-read: 1
        list-manager._rtx.interface.cloud-read-beautify: 1
        list-manager._rtx.interface.cloud-update: 1
        list-manager._rtx.interface.create-entry: 1
        list-manager._rtx.interface.describe-schema: 1
        list-manager._rtx.interface.generate-id: 1
        list-manager._rtx.interface.init-list: 1
        list-manager._rtx.interface.migrate-markdown: 1
        list-manager._rtx.interface.read-beautify: 1
        list-manager._rtx.interface.read-list: 1
        list-manager._rtx.interface.update-list: 1
    interface_access:
      list-manager._rtx.interface.beautify-list:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.cloud-create-entry:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.cloud-delete:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.cloud-init:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.cloud-list-categories:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.cloud-read:
        allow_all_modules: false
        allowed_callers:
        - email-triage
        - email-triage._rtx
      list-manager._rtx.interface.cloud-read-beautify:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.cloud-update:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.create-entry:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.describe-schema:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.generate-id:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.init-list:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.migrate-markdown:
        allow_all_modules: false
        allowed_callers: []
      list-manager._rtx.interface.read-beautify:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
        - daily-plan._rtx
      list-manager._rtx.interface.read-list:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
      list-manager._rtx.interface.update-list:
        allow_all_modules: false
        allowed_callers:
        - daily-plan
        - daily-plan._rtx
node_type: module
schema_version: 6
sources:
  list-manager.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: stable
installation_tier: core
personal_preference:
  applies: false
