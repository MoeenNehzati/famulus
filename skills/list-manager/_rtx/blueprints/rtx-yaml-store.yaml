      A filtered read preserves structure: it returns the same shape as the input
      (full doc with categories, or a bare list) pruned to only branches containing
      a match -- every ancestor category and parent entry of a match is kept for context,
      and a match is never duplicated as both a nested child and an independent top-level
      result.'
    process_binding:
      args_prefix:
      - read
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        allow_stdin: false
        min_positionals: 1
        notes: First positional is the local YAML file; remaining positionals are
          filters. Filtered output is a pruned tree (or pruned list, if the input
          itself was a bare list), not a flat list of matches -- do not assume flat-list
          shape.
    usage: <file> [filters] [--sort FIELD]
    version: 1
  list-manager._rtx.source.rtx-yaml-store.interface.update-list:
    content:
    - _yaml_store\.py
    - schemas/lists/default\.json
    - schemas/lists/task\-list\-personal\.json
    - schemas/lists/task\-list\.json
    - schemas/lists/todo\.json
    - schemas/lists/triage\.json
    - schemas/types/action\.json
    - schemas/types/entry\.json
    - schemas/types/task_entry\.json
    - schemas/types/triage_action\.json
    uses_interfaces:
    - interface: cloud-files._rtx.interface.lists-read
      version: 1
    - interface: cloud-files._rtx.interface.lists-write
      version: 1
    contract:
      arguments:
        file:
          description: Existing local YAML list file to patch
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            access: read-write
            content_type:
              format:
                named: yaml
              kind: string
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        patches:
          description: YAML sequence of patch objects read from a file or stdin, each
            with a stable string ID
          required: true
          sensitivity: user-private
          type:
            format:
              named: yaml
            kind: string
        expected_revision:
          description: 'Optional optimistic-concurrency guard: only apply if the file''s
            current ''revision'' field equals this value; rejects with a stale-revision
            error and writes nothing otherwise.'
          required: false
          sensitivity: user-private
          type:
            kind: integer
      caller_warnings:
      - external-side-effect: Rewrites the local list and automatically stamps modified
          and first completion dates.
      direct_io:
        network: []
        reads:
        - access: read
          content: list
          formats:
          - yaml
          id: read-1
          medium: local-filesystem
          path: <file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: patch
          formats:
          - yaml
          id: read-2
          medium: local-filesystem
          path: <patch-file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: patch
          formats:
          - yaml
          id: read-3
          medium: stdin
          sensitivity: user-private
        writes:
        - access: write
          content: list
          formats:
          - yaml
          id: write-1
          medium: local-filesystem
          path: <file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Reads one local snapshot, applies every patch, validates it, and
            rewrites the file.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: list-update
          may_occur_in_outcomes:
          - updated
          reversibility:
            compensatable: Apply another patch containing known prior field values.
          value_source:
            argument_ref: patches
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            non_atomic: The list file is written directly after validation without
              a transactional replacement guarantee.
          concurrent_invocations:
            unsafe: Unsafe by default -- concurrent writers can overwrite one another
              -- unless the caller passes expected_revision, in which case a concurrent
              writer that saved first causes this call to be rejected before any write
              instead of silently clobbering it.
          idempotency:
            idempotent: Reapplying the same field values converges, although modified
              is restamped on each touch.
          on_uncertain_completion:
            verify_then_decide: Re-read the affected IDs before retrying.
          partial_effects_on_failure:
            possible: A filesystem failure can interrupt the rewrite.
          rollback_on_failure:
            unavailable: The previous file value is not retained for automatic rollback.
        state_effect: mutating
        verification:
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Re-read the affected IDs when confirmation is needed.
        class: success
        effects:
        - list-update
        id: updated
        outputs: []
      - caller_action: Correct the patch sequence, stable ID, immutable field, field
          value, or schema error before retrying. A stale-revision error means a concurrent
          writer saved this file first -- re-read it and retry.
        class: error
        effects: []
        id: error
        outputs:
        - diagnostic
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions:
      - caller_action: Supply an existing readable YAML list file.
        check:
          direct_io_ref: read-1
          kind: direct-io
          predicate: readable
        description: The target list must exist and be readable
        id: readable-list
        unmet_outcome: error
    description: Update entries in a local YAML list file using a YAML sequence of
      patch objects supplied by file or stdin.
    process_binding:
      args_prefix:
      - update
      entry: Interface
      kind: process
      patterns:
      - allow_stdin: false
        allowed_flags:
        - --file
        - --expected-revision
        flag_patterns:
          --file: ^.+$
          --expected-revision: ^[0-9]+$
        max_positionals: 1
        min_positionals: 1
        name: file-mode
        notes: Externally supported update mode; caller prepares the patch file.
        required_flags:
        - --file
      - allow_stdin: true
        forbidden_flags:
        - --file
        max_positionals: 1
        min_positionals: 1
        name: stdin-batch
        notes: Internal convenience mode for the owning skill when feeding YAML directly.
        allowed_flags:
        - --expected-revision
        flag_patterns:
          --expected-revision: ^[0-9]+$
    usage: <file> --file /tmp/patch.yaml [--expected-revision N]
    version: 1
