content:
- SKILL\.md
- references/audience\-familiarity\.md
- references/document\-types/conference\-article/cs\.md
- references/document\-types/conference\-article/econ\.md
- references/document\-types/conference\-article/general\.md
- references/document\-types/conference\-article/math\.md
- references/document\-types/journal\-article/cs\.md
- references/document\-types/journal\-article/econ\.md
- references/document\-types/journal\-article/general\.md
- references/document\-types/journal\-article/math\.md
- references/document\-types/research\-notes/cs\.md
- references/document\-types/research\-notes/econ\.md
- references/document\-types/research\-notes/general\.md
- references/document\-types/research\-notes/math\.md
- references/document\-types/research\-presentation/cs\.md
- references/document\-types/research\-presentation/econ\.md
- references/document\-types/research\-presentation/general\.md
- references/document\-types/research\-presentation/math\.md
dependencies: []
description: Implements profile-aware structural review using the canonical document
  schema and only the closest applicable genre, field, and audience baselines.
gateway:
  language: Markdown
  path: SKILL.md
id: technical-flow-review.source.gateway
interfaces:
  technical-flow-review.source.gateway.interface.default:
    contract:
      arguments:
        request:
          description: Technical-flow review request plus the target document and
            any known purpose, audience, field, genre, or length constraints.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: Flow-review request and supplied document-profile context.
          formats:
          - text
          id: request
          medium: prompt
          sensitivity: user-private
          system: agent-runtime
        - access: read
          content: Target technical document, top-of-document profile comment, and
            relevant companion context when files are named.
          formats:
          - tex
          - markdown
          - text
          - html
          id: document
          medium: local-filesystem
          reason: Diagnose actual whole-document and section-level reader flow.
          sensitivity: user-private
        - access: read
          content: Canonical document-profile fields and normalization rules.
          formats:
          - markdown
          id: profile-standard
          medium: repository-filesystem
          path: references/document-standards/document-profile.md
          path_match: exact
          reason: Identify the document profile before judging flow.
          sensitivity: public
        - access: read
          content: Closest general document-type baseline, field-specific deviations,
            and conditional audience-familiarity overlay.
          formats:
          - markdown
          id: local-baselines
          medium: repository-filesystem
          path: skills/technical-flow-review/references/**
          path_match: glob
          reason: Calibrate flow expectations without loading or merging irrelevant
            conventions.
          sensitivity: public
        writes:
        - access: write
          content: Profile-aware technical-flow diagnosis and candidate structural
            direction.
          formats:
          - markdown
          id: response
          medium: prompt
          sensitivity: derived-private
          system: agent-runtime
      execution:
        consistency:
          snapshot: The review reflects the document, inferred profile, selected baselines,
            and constraints available in this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the profile-dependent structural diagnosis before requesting
          any rewrite or file edit.
        class: success
        effects: []
        id: reviewed
        outputs:
        - response
      - caller_action: Supply the target document or the profile fields that cannot
          be inferred reliably.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Concise document profile and diagnosis of big-picture flow, section
          roles, ordering, bridges, milestones, detail allocation, and a smallest
          useful restructure.
        direct_io_ref: response
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Diagnose technical-document flow relative to its inferred profile
      and propose structural direction without unapproved rewriting.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces: []
version: 1
