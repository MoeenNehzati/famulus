content:
- instructions/extract\.md
dependencies: []
description: Owns semantic extraction of direct mathematical dependencies into a
  draft, then delegates self-contained canonical JSON finalization and optional
  rendering.
gateway:
  language: Markdown
  path: instructions/extract.md
id: math-dependency-graph.source.instructions-extract
interfaces:
  math-dependency-graph.source.instructions-extract.interface.extract:
    uses_interfaces:
    - interface: math-dependency-graph._rtx.interface.scripts-finalize-extraction
      version: 1
    - interface: math-dependency-graph._rtx.interface.scripts-build-math-dependency-graph
      version: 2
    content:
    - instructions/extract\.md
    contract:
      arguments:
        request:
          description: Included mathematical content, requested scope, semantic-draft
            and canonical output paths, the distinct root TeX entrypoint, optional
            label map, and optional HTML destination.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Writes a semantic draft, atomically finalizes canonical
          JSON, and writes HTML only when rendering is requested.
      direct_io:
        network: []
        reads:
        - access: read
          content: included mathematical source and extraction request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: semantic mathematical dependency draft
          formats:
          - json
          id: write-1
          medium: local-filesystem
          sensitivity: derived-private
        - access: write
          content: finalized self-contained canonical mathematical dependency graph
          formats:
          - json
          id: write-2
          medium: local-filesystem
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Semantic extraction uses the included source snapshot, while
            finalization uses the explicitly identified root TeX tree and optional
            label map from the same run.
        effects:
        - action: create
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: draft-write
          may_occur_in_outcomes:
          - extracted
          - extracted-with-gaps
          reversibility:
            reversible: Delete the draft after retaining the finalized canonical
              JSON.
          value_source:
            argument_ref: request
            kind: argument
        - action: update
          confirmation_evidence:
            direct_io_ref: write-2
            kind: direct-io
          direct_io_ref: write-2
          id: canonical-write
          may_occur_in_outcomes:
          - extracted
          - extracted-with-gaps
          reversibility:
            reversible: Regenerate the canonical graph from the draft and root TeX
              inputs.
          value_source:
            argument_ref: request
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: The draft is a separate artifact; delegated finalization
              validates before atomically replacing canonical JSON.
          concurrent_invocations:
            unsafe: Concurrent extraction to the same requested paths is not serialized.
          idempotency:
            idempotent: Re-extracting the same source snapshots and scope produces
              equivalent semantic and canonical graph artifacts.
          on_uncertain_completion:
            verify_then_decide: Validate the requested canonical JSON path before
              retrying extraction or rendering.
          partial_effects_on_failure:
            possible: The semantic draft may remain when finalization or optional
              rendering fails; a failed finalization preserves prior canonical JSON.
          rollback_on_failure:
            unavailable: The separate semantic draft is not removed automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: graph-json
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the self-contained canonical JSON directly or optionally
          render it.
        class: success
        effects:
        - draft-write
        - canonical-write
        id: extracted
        outputs:
        - graph-json
      - caller_action: Report unresolved evidence gaps without inventing dependencies;
          the canonical JSON remains render-ready.
        class: success
        effects:
        - draft-write
        - canonical-write
        id: extracted-with-gaps
        outputs:
        - graph-json
      - caller_action: Correct the source, root entrypoint, or output-path request
          before retrying.
        class: error
        effects: []
        id: invalid-request
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: Filesystem path to a schema-version-2, self-contained canonical
          graph plus evidence gaps and optional render or browser-diagnostics status.
        direct_io_ref: write-2
        empty: Never empty on success.
        id: graph-json
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Extract a notation-faithful semantic graph draft, finalize it as
      self-contained canonical JSON, and optionally render it.
    version: 2
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: math-dependency-graph._rtx.interface.scripts-finalize-extraction
  version: 1
- interface: math-dependency-graph._rtx.interface.scripts-build-math-dependency-graph
  version: 2
version: 2
maturity: stable
