content:
- _rtx/_graph_builder\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: math-dependency-graph.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-tex-macro-reader.yaml
  reason: Imports Python source from _rtx/_tex_macro_reader.py.
  source: math-dependency-graph.source.rtx-tex-macro-reader
  version: 1
description: Validates canonical graph JSON and writes an interactive HTML dependency graph that loads ELK and MathJax from jsDelivr when opened.
gateway:
  language: Python
  path: _rtx/_graph_builder.py
id: math-dependency-graph.source.rtx-graph-builder
interfaces:
  math-dependency-graph.source.rtx-graph-builder.interface.scripts-build-math-dependency-graph:
    contract:
      arguments:
        source: {description: Canonical dependency-graph JSON file., required: true, sensitivity: user-private, direct_io_ref: read-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string, sensitivity: user-private, format: {named: json}}}}
        tex-entry: {description: Optional TeX entrypoint used to extract MathJax macros., required: false, sensitivity: user-private, direct_io_ref: read-2, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string, sensitivity: user-private}}}
        html-out: {description: Optional standalone HTML destination., required: false, sensitivity: user-private, direct_io_ref: write-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: false, access: write, content_type: {kind: string, sensitivity: derived-private}}}
        macro-file: {description: Optional existing MathJax macro JSON to merge., required: false, sensitivity: user-private, direct_io_ref: read-3, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string, sensitivity: user-private, format: {named: json}}}}
        refresh-macros: {description: Regenerate the default macro file from the TeX entrypoint., required: false, default: false, sensitivity: public, type: {kind: flag}}
        reduce-transitive-edges: {description: Remove graph-theoretically redundant edges from the rendered view., required: false, default: false, sensitivity: public, type: {kind: flag}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Writes standalone HTML and may refresh a MathJax macro JSON file.
      - may-wait: Opening the generated HTML downloads ELK and MathJax from cdn.jsdelivr.net before browser layout and typesetting are fully available.
      outputs:
      - {id: report, audience: machine, description: JSON report with HTML path and graph counts and macro details., direct_io_ref: write-3, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty., type: {kind: string, sensitivity: derived-private, format: {named: json}}}
      outcomes:
      - {id: rendered, class: success, outputs: [report], effects: [html-file], caller_action: Open the reported HTML path for inspection.}
      - {id: invalid, class: refusal, outputs: [], effects: [], caller_action: Correct the canonical graph or TeX and macro inputs.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Report the file or rendering error and preserve existing artifacts.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Rendering uses the JSON and macro and TeX content read during this invocation.}
        effects:
        - {id: html-file, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: source}, may_occur_in_outcomes: [rendered], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: The generated HTML can be deleted or regenerated from source.}}
        mutation_safety:
          atomicity: {per_effect_only: HTML and optional macro JSON are written as separate files.}
          concurrent_invocations: {unsafe: Concurrent renders to the same paths are not serialized.}
          idempotency: {idempotent: Unchanged inputs and options produce equivalent artifacts.}
          on_uncertain_completion: {verify_then_decide: Inspect the reported HTML and macro paths before retrying.}
          partial_effects_on_failure: {possible: A refreshed macro file may remain when later HTML rendering fails.}
          rollback_on_failure: {unavailable: Prior artifacts are not retained automatically.}
        verification: [{method: output-schema, output_ref: report}]
      helpers: []
      direct_io:
        network:
        - {id: network-1, medium: network-request, access: download, system: jsdelivr-cdn, endpoint: https://cdn.jsdelivr.net/npm/elkjs/lib/elk.bundled.js, content: ELK browser library, formats: [javascript], sensitivity: public, reason: The generated HTML requests this script when opened.}
        - {id: network-2, medium: network-request, access: download, system: jsdelivr-cdn, endpoint: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js, content: MathJax browser library, formats: [javascript], sensitivity: public, reason: The generated HTML requests this script when opened.}
        reads:
        - {id: read-1, medium: local-filesystem, access: read, system: filesystem, content: canonical dependency graph, formats: [json], sensitivity: user-private, path: <source.json>, path_match: exact}
        - {id: read-2, medium: local-filesystem, access: read, system: filesystem, content: reachable TeX source tree, formats: [tex], sensitivity: user-private, path: <entrypoint.tex> and reachable input or include files, path_match: glob}
        - {id: read-3, medium: local-filesystem, access: read, system: filesystem, content: MathJax macro definitions, formats: [json], sensitivity: user-private, path: <macro-file>, path_match: exact}
        writes:
        - {id: write-1, medium: local-filesystem, access: write, system: filesystem, content: standalone interactive dependency graph, formats: [html], sensitivity: derived-private, path: <html-out> or <source-dir>/_build/<source>.html, path_match: exact}
        - {id: write-2, medium: local-filesystem, access: write, system: filesystem, content: refreshed MathJax macro definitions, formats: [json], sensitivity: derived-private, path: <tex-dir>/_build/<entry>-mathjax-macros.json, path_match: exact}
        - {id: write-3, medium: stdout, access: write, content: render report, formats: [json], sensitivity: derived-private}
    description: Render an interactive HTML math dependency graph from canonical JSON;
      the saved document loads ELK and MathJax from jsDelivr when opened.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --html-out
        - --tex-entry
        - --macro-file
        - --refresh-macros
        - --reduce-transitive-edges
        flag_patterns:
          --html-out: ^.+$
          --macro-file: ^.+$
          --tex-entry: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <source.json> [--tex-entry <entrypoint.tex>] [--html-out <path>] [--macro-file
      <path>] [--refresh-macros] [--reduce-transitive-edges]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
