schema_version: 6
node_type: behavioral_source
id: math-dependency-graph.source.instructions-inventory-voyages
version: 10
description: Initializes one run-prefixed inventory Voyage collection from a document entrypoint, introduces each Voyage's inventory instruction and cumulative packet-file path once before applying Compass to its packet reports, collects completed inventory and cumulative source-packet paths, and preserves pre-reference decision bases and terminal attributed debug diagnoses through release.
gateway:
  language: Markdown
  path: instructions/inventory-voyages.md
content:
- instructions/inventory-voyages\.md
dependencies: []
uses_interfaces:
- interface: math-dependency-graph._rtx.interface.inventory-voyage-dispenser
  version: 10
- interface: using-compass.interface.default
  version: 11
interfaces:
  math-dependency-graph.source.instructions-inventory-voyages.interface.inventory-voyages:
    version: 10
    description: Discover and initialize one run-prefixed inventory Voyage collection, acknowledge each Voyage's one-time inventory instruction and cumulative_packets_file introduction, apply Compass to only its subsequent packet reports, collect completed inventory and cumulative source-packet paths, and release terminal Voyages while retaining those artifacts, debug pre-reference decision bases, and attributed diagnostic reckonings under the run artifacts.
    content:
    - instructions/inventory-voyages\.md
    uses_interfaces:
    - interface: math-dependency-graph._rtx.interface.inventory-voyage-dispenser
      version: 10
    - interface: using-compass.interface.default
      version: 11
    contract:
      arguments:
        request:
          description: Document entrypoint, requested positive chunk count, optional run prefix, and any explicit mode selection with its required arguments.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
      preconditions: []
      caller_warnings:
      - external-side-effect: Initialization creates module-owned durable Voyages and Compass advancement appends cumulative source-packet text and writes completed inventory fragments beside it.
      - external-side-effect: Releasing a terminal debug Voyage deletes its working directory after archiving the complete diagnostic reckoning under that run's artifacts.
      interaction: {mode: unattended}
      outputs:
      - id: inventory-paths
        audience: machine
        description: Ordered completed inventory fragment and cumulative source-packet paths, one pair per terminal Voyage.
        direct_io_ref: write-1
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty on success.
        type: {kind: string, sensitivity: derived-private}
      outcomes:
      - id: completed
        class: success
        outputs: [inventory-paths]
        effects: []
        caller_action: Pool the returned inventory fragments in their stable Voyage order.
      - id: failed
        class: error
        outputs: []
        effects: []
        caller_action: Preserve the reported Voyage status and repair only that Voyage before retrying.
      execution:
        state_effect: read-only
        lifecycle: finite
        consistency:
          snapshot: Every worker is bound to exactly one immutable Voyage created under the same run prefix from one document snapshot and initialization mode.
        verification:
        - {method: output-schema, output_ref: inventory-paths}
      helpers: []
      direct_io:
        reads:
        - {id: read-1, medium: prompt, access: read, content: Inventory Voyage request and authorized dispenser binding, formats: [text], sensitivity: user-private}
        writes:
        - {id: write-1, medium: prompt, access: write, content: Ordered completed inventory and cumulative source-packet paths, formats: [markdown], sensitivity: derived-private}
        network: []
maturity: stable
