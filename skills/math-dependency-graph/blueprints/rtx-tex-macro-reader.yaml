content:
- _rtx/_tex_macro_reader\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: math-dependency-graph.source.rtx-init
  version: 1
description: Recursively reads the TeX entrypoint's local input and class closure and prints extracted MathJax macro definitions as JSON.
gateway:
  language: Python
  path: _rtx/_tex_macro_reader.py
id: math-dependency-graph.source.rtx-tex-macro-reader
interfaces:
  math-dependency-graph.source.rtx-tex-macro-reader.interface.scripts-extract-mathjax-macros:
    contract:
      arguments:
        entrypoint: {description: TeX entrypoint whose reachable input and include tree is scanned., required: true, sensitivity: user-private, direct_io_ref: read-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read, content_type: {kind: string, sensitivity: user-private}}}
        out: {description: Optional MathJax macro JSON destination., required: false, sensitivity: user-private, direct_io_ref: write-1, type: {kind: file, syntax: literal, relative_to: caller-cwd, must_exist: false, access: write, content_type: {kind: string, sensitivity: derived-private, format: {named: json}}}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Writes or replaces the selected macro JSON file.
      outputs:
      - {id: report, audience: machine, description: JSON object containing entrypoint and output path and extracted macro count., direct_io_ref: write-2, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty., type: {kind: string, sensitivity: derived-private, format: {named: json}}}
      outcomes:
      - {id: extracted, class: success, outputs: [report], effects: [macro-file], caller_action: Use the reported macro JSON path for graph rendering.}
      - {id: missing, class: refusal, outputs: [], effects: [], caller_action: Supply an existing TeX entrypoint.}
      - {id: failed, class: error, outputs: [], effects: [], caller_action: Correct unreadable includes or an unwritable output path.}
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency: {snapshot: Extraction uses the reachable TeX content read during this invocation.}
        effects:
        - {id: macro-file, direct_io_ref: write-1, action: update, value_source: {kind: argument, argument_ref: entrypoint}, may_occur_in_outcomes: [extracted], confirmation_evidence: {kind: direct-io, direct_io_ref: write-1}, reversibility: {reversible: The generated macro JSON can be deleted or regenerated.}}
        mutation_safety:
          atomicity: {non_atomic: The JSON file is written directly after creating its parent directory.}
          concurrent_invocations: {unsafe: Concurrent writers to the same path are not serialized.}
          idempotency: {idempotent: Unchanged reachable TeX sources produce equivalent sorted JSON.}
          on_uncertain_completion: {verify_then_decide: Parse the selected output JSON before retrying.}
          partial_effects_on_failure: {possible: A direct write can leave incomplete output if interrupted.}
          rollback_on_failure: {unavailable: Prior output content is not retained.}
        verification: [{method: output-schema, output_ref: report}]
      helpers: []
      direct_io:
        network: []
        reads:
        - {id: read-1, medium: local-filesystem, access: read, system: filesystem, content: TeX entrypoint and reachable input or include files, formats: [tex], sensitivity: user-private, path: <entrypoint.tex> and reachable source files, path_match: glob}
        writes:
        - {id: write-1, medium: local-filesystem, access: write, system: filesystem, content: extracted MathJax macro definitions, formats: [json], sensitivity: derived-private, path: <out> or <entry-dir>/_build/<entry>-mathjax-macros.json, path_match: exact}
        - {id: write-2, medium: stdout, access: write, content: extraction report, formats: [json], sensitivity: derived-private}
    description: Extract MathJax macro definitions from a TeX entrypoint, recursively
      following \input/\include.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --out
        flag_patterns:
          --out: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <entrypoint.tex> [--out <path>]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
