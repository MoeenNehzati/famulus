schema_version: 6
node_type: behavioral_source
id: math-dependency-graph.source.instructions-proof-reconciliation
version: 1
maturity: experimental
description: Reconciles registered proof-centered evidence into exhaustive semantic
  decisions for deterministic proof normalization.
gateway:
  language: Markdown
  path: instructions/proof-reconciliation.md
content:
- instructions/proof-reconciliation\.md
dependencies: []
uses_interfaces: []
interfaces:
  math-dependency-graph.source.instructions-proof-reconciliation.interface.proof-reconciliation:
    version: 1
    description: Group complementary proof fragments, preserve alternative proofs,
      resolve source-grounded targets, and exhaustively decide every registered proof.
    content:
    - instructions/proof-reconciliation\.md
    uses_interfaces: []
    contract:
      arguments:
        request:
          description: Exact bounded proof-reconciliation assignment and output-path request.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        packet:
          description: Bounded proof-centered packet containing registered proof candidates,
            proposed targets, incident relationships, exact source ranges, and necessary identities.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: user-private
        semantic-ir:
          description: Matching schema-valid transitional semantic IR containing the proof entities
            and incident relationships to decide.
          direct_io_ref: read-2
          required: true
          sensitivity: derived-private
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: derived-private
        normalization-schema:
          description: Skill-owned proof-normalization decisions and provenance schema.
          direct_io_ref: read-3
          required: true
          sensitivity: public
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: public
        decisions-output:
          description: Destination for the schema-valid exhaustive proof-normalization decisions.
          direct_io_ref: write-1
          required: true
          sensitivity: derived-private
          type:
            kind: file
            access: write
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: derived-private
        progress-sidecar:
          description: Stable append-only path for bounded actual-clock reconciliation milestones
            and integer counters.
          direct_io_ref: write-2
          required: true
          sensitivity: derived-private
          type:
            kind: file
            access: write
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: derived-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - id: read-1
          medium: local-filesystem
          access: read
          content: bounded registered proof candidates, targets, incident relationships,
            exact evidence ranges, and necessary neighboring identities
          formats: [json]
          path: <packet>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - id: read-2
          medium: local-filesystem
          access: read
          content: matching schema-valid transitional semantic IR
          formats: [json]
          path: <semantic-ir>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - id: read-3
          medium: local-filesystem
          access: read
          content: skill-owned proof-normalization decision and report schema
          formats: [json]
          path: <normalization-schema>
          path_match: exact
          sensitivity: public
          system: filesystem
        - id: read-4
          medium: prompt
          access: read
          content: proof-reconciliation scope and output-path request
          formats: [text]
          sensitivity: user-private
          system: prompt
        writes:
        - id: write-1
          medium: local-filesystem
          access: write
          content: exhaustive proof-normalization decisions
          formats: [json]
          path: <decisions-output>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - id: write-2
          medium: local-filesystem
          access: write
          content: bounded actual-clock proof-reconciliation milestones and counters
          formats: [markdown]
          path: <progress-sidecar>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
      execution:
        consistency:
          snapshot: Every decision uses one bounded proof-centered packet and its matching
            transitional semantic IR; no unregistered source range, entity, dependency,
            or target enters the judgment boundary.
        effects:
        - id: decisions-write
          action: create
          direct_io_ref: write-1
          may_occur_in_outcomes: [reconciled]
          value_source:
            kind: argument
            argument_ref: packet
          confirmation_evidence:
            kind: output
            output_ref: proof-decisions
          reversibility:
            reversible: Delete the generated decisions without changing source or semantic IR.
        - id: progress-sidecar-append
          action: update
          direct_io_ref: write-2
          may_occur_in_outcomes: [reconciled]
          value_source:
            kind: argument
            argument_ref: progress-sidecar
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-2
          reversibility:
            reversible: Delete the derived progress sidecar with the fresh run directory.
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: The schema-valid decisions artifact is completed before return;
              bounded progress lines are appended separately as judgments advance.
          concurrent_invocations:
            unsafe: Concurrent reconciliation to the same destination can overwrite an artifact.
          idempotency:
            idempotent: Reconciliation of the same bounded packet and semantic IR produces
              an equivalent exhaustive decision partition.
          on_uncertain_completion:
            verify_then_decide: Validate the requested decisions path before retrying.
          partial_effects_on_failure:
            possible: An incomplete decisions artifact or progress sidecar may remain if writing is interrupted.
          rollback_on_failure:
            available: Remove only the incomplete artifacts created by this invocation.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: proof-decisions
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - id: reconciled
        class: success
        caller_action: Submit the decisions with the same transitional semantic IR to deterministic proof normalization.
        effects: [decisions-write, progress-sidecar-append]
        outputs: [proof-decisions]
      - id: invalid-or-ambiguous
        class: error
        caller_action: Preserve the immutable inputs and return the ambiguity or contract failure for correction.
        effects: []
        outputs: []
      outputs:
      - id: proof-decisions
        audience: machine
        cardinality:
          minimum: 1
          maximum: 1
        description: Filesystem path to one schema-valid exhaustive proof-normalization decisions object.
        direct_io_ref: write-1
        empty: Never empty on success.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
