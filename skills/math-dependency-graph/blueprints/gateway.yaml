content:
- SKILL\.md
dependencies: []
description: Defines the LLM workflow for extracting a notation-faithful direct mathematical
  dependency graph, finalizing self-contained canonical JSON, and optionally rendering
  it.
gateway:
  language: Markdown
  path: SKILL.md
id: math-dependency-graph.source.gateway
interfaces:
  math-dependency-graph.source.gateway.interface.default:
    uses_interfaces:
    - interface: math-dependency-graph.interface.extract
      version: 2
    - interface: math-dependency-graph._rtx.interface.scripts-finalize-extraction
      version: 1
    - interface: math-dependency-graph._rtx.interface.scripts-build-math-dependency-graph
      version: 2
    - interface: math-dependency-graph._rtx.interface.scripts-read-tex-labels
      version: 1
    - interface: math-dependency-graph._rtx.interface.scripts-serve-graph
      version: 1
    content:
    - SKILL\.md
    contract:
      arguments:
        request:
          description: User request, included mathematical content, distinct root TeX
            entrypoint, and artifact destinations for extracting or optionally rendering
            a mathematical dependency graph.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: graph request and source context
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: graph analysis response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Semantic results use the included source snapshot; deterministic
            finalization uses the explicitly identified root TeX tree and optional
            label map from the same run.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the self-contained canonical graph, optional presentation,
          and unresolved evidence gaps.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Correct the included content, root TeX entrypoint, or canonical
          graph input before retrying.
        class: error
        effects: []
        id: invalid-source
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Graph-analysis result, semantic and canonical artifact locations,
          optional render location, and diagnostics status only when browser validation
          occurred.
        direct_io_ref: write-1
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Primary LLM-facing extraction, finalization, and optional-render workflow.
    version: 3
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: math-dependency-graph.interface.extract
  version: 2
