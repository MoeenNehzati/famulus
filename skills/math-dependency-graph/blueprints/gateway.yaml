content:
- SKILL\.md
dependencies: []
description: Defines the LLM workflow for extracting a notation-faithful direct mathematical
  dependency graph and producing its canonical artifacts.
gateway:
  language: Markdown
  path: SKILL.md
id: math-dependency-graph.source.gateway
interfaces:
  math-dependency-graph.source.gateway.interface.default:
    uses_interfaces: []
    content:
    - SKILL\.md
    contract:
      arguments:
        request:
          description: User request and source document for extracting or rendering
            a mathematical dependency graph.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: graph request and source context
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: graph analysis response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: The result is derived from the source content supplied for this
            run.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the graph artifacts and unresolved evidence gaps.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Correct the source document or canonical graph input before
          retrying.
        class: error
        effects: []
        id: invalid-source
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Graph-analysis result and artifact locations or requested review
          findings.
        direct_io_ref: write-1
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 2
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: math-dependency-graph.interface.extract
  version: 1
- interface: math-dependency-graph._rtx.interface.scripts-build-math-dependency-graph
  version: 1
- interface: math-dependency-graph._rtx.interface.scripts-extract-mathjax-macros
  version: 1
- interface: math-dependency-graph._rtx.interface.scripts-serve-graph
  version: 1
version: 2
maturity: stable
