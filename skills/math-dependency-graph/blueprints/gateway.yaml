    contract:
      arguments:
        request:
          description: User request, TeX entrypoint, and optional HTML destination
            for one fresh measured mathematical graph run.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: graph request and source context
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: graph analysis response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: The result is derived from one fresh source snapshot whose inventory
            workers consume only durable iterator responses, while every setup and next
            public wrapper call returns controlled-child timing recorded through diagnostics.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Review the graph artifacts, durable diagnostics summary, and
          unresolved evidence gaps.
        class: success
        effects: []
        id: completed
        outputs:
        - response
      - caller_action: Correct the source document or canonical graph input before
          retrying.
        class: error
        effects: []
        id: invalid-source
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Graph artifact locations, run-diagnostics path and summary,
          represented source scope, exact worker models and retries, timings, ratios,
          record counts, and genuine unresolved gaps.
        direct_io_ref: write-1
        empty: Never empty on success.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Orchestrate a measured inventory, extract, compile, and render run.
