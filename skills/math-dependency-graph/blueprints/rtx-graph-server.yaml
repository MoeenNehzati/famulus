content:
- _rtx/_graph_server\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: math-dependency-graph.source.rtx-init
  version: 1
description: Serves one graph directory through a no-cache local HTTP server until interrupted.
gateway:
  language: Python
  path: _rtx/_graph_server.py
id: math-dependency-graph.source.rtx-graph-server
interfaces:
  math-dependency-graph.source.rtx-graph-server.interface.scripts-serve-graph:
    contract:
      arguments:
        directory: {description: Directory served over local HTTP and defaulting to the caller working directory., required: false, sensitivity: user-private, direct_io_ref: read-1, type: {kind: dir, syntax: literal, relative_to: caller-cwd, must_exist: true, access: read}}
        host: {description: Host or interface to bind and defaulting to 127.0.0.1., required: false, default: 127.0.0.1, sensitivity: public, type: {kind: string}}
        port: {description: TCP port to bind and defaulting to 8765., required: false, default: 8765, sensitivity: public, type: {kind: integer, minimum: 1, maximum: 65535}}
      preconditions: []
      interaction: {mode: unattended}
      caller_warnings:
      - external-side-effect: Binding a non-loopback host exposes every readable file beneath directory to reachable clients.
      outputs:
      - {id: ready, audience: machine, description: JSON object containing served directory and URL and cache policy., direct_io_ref: write-1, cardinality: {minimum: 1, maximum: 1}, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, empty: Never empty after successful bind., type: {kind: string, sensitivity: derived-private, format: {named: json}}}
      outcomes:
      - {id: serving, class: success, outputs: [ready], effects: [], caller_action: Open the reported URL and cancel the process when inspection is complete.}
      - {id: bind-failed, class: error, outputs: [], effects: [], caller_action: Select an available host and port or correct directory access.}
      execution:
        state_effect: read-only
        lifecycle: long-running
        consistency: {live: Each HTTP request reads current files from the served directory.}
        long_running:
          ready_when: {kind: output-match, output_ref: ready, matcher: {kind: regex, pattern: '"url"', dialect: python, matching: prefix}}
          startup_failure_outcome: bind-failed
        verification: [{method: output-schema, output_ref: ready}]
      helpers: []
      direct_io:
        network:
        - {id: network-1, medium: network, access: configure, system: local-http-server, content: graph files and directory listings, formats: [http], sensitivity: user-private, endpoint: 'http://<host>:<port>/'}
        reads:
        - {id: read-1, medium: local-filesystem, access: read, system: filesystem, content: files beneath served directory, formats: [binary], sensitivity: user-private, path: <directory>/**, path_match: glob}
        writes:
        - {id: write-1, medium: stdout, access: write, content: server readiness metadata, formats: [json], sensitivity: derived-private}
    description: Serve graph HTML from a local directory with no-cache headers for
      repeated browser inspection.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allow_extra_positionals: true
        name: owner
    usage: '[--directory <path>] [--host <host>] [--port <port>]'
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 4
uses_interfaces: []
version: 1
