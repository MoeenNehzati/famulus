schema_version: 6
node_type: behavioral_source
id: math-dependency-graph.source.instructions-inventory
version: 32
maturity: stable
description: Authors one recall-first mathematical discovery fragment by consuming
  a durable source-unit iterator in order and validating before every acknowledgement.
gateway:
  language: Markdown
  path: instructions/inventory.md
content:
- instructions/inventory\.md
dependencies: []
uses_interfaces:
- interface: math-dependency-graph._rtx.interface.scripts-next-inventory-unit
  version: 2
interfaces:
  math-dependency-graph.source.instructions-inventory.interface.inventory:
    version: 32
    description: Author one concise recall-first graph inventory fragment through
      a validated iterator acknowledgement loop.
    content:
    - instructions/inventory\.md
    uses_interfaces:
    - interface: math-dependency-graph._rtx.interface.scripts-next-inventory-unit
      version: 2
    contract:
      arguments:
        request:
          description: Existing iterator state directory, assigned worker index,
            inventory schema path, stable progress path, and fragment destination.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        progress-sidecar:
          description: Worker-owned progress path for concise validated advancement
            and completion evidence.
          direct_io_ref: write-2
          required: true
          sensitivity: derived-private
          type:
            kind: file
            access: write
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: derived-private
        inventory-fragment:
          description: Worker-owned initialized version-3 inventory fragment updated
            and validated before every acknowledgement.
          direct_io_ref: write-1
          required: true
          sensitivity: derived-private
          type:
            kind: file
            access: write
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: derived-private
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - id: read-1
          medium: prompt
          access: read
          content: iterator assignment and output-path request
          formats:
          - text
          sensitivity: user-private
        - id: read-2
          medium: local-filesystem
          access: read
          content: skill-owned version-3 inventory schema
          formats:
          - json
          path: $skill/inventory.schema.json
          path_match: exact
          sensitivity: public
          system: filesystem
        writes:
        - id: write-1
          medium: local-filesystem
          access: write
          content: concise mathematical inventory fragment
          formats:
          - json
          path: <inventory-fragment>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - id: write-2
          medium: local-filesystem
          access: write
          content: concise validated iterator advancement and completion evidence
          formats:
          - markdown
          path: <progress-sidecar>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
      execution:
        consistency:
          snapshot: The worker invokes next only as state directory, worker index,
            optional acknowledgement, and optional wrap; its bound inventory,
            schema, and progress paths remain file responsibilities, never next-call
            arguments. The worker consumes only source units returned in order by its
            assigned iterator index, retains cross-unit ownership context, records
            recall-first graph candidates and direct dependency leads, validates
            its cumulative fragment before acknowledging every unit, closes each
            attention sequence with wrap, retains the controlled-child timing
            returned by every actual next call, and finishes only when acknowledgement
            returns complete.
        effects:
        - id: inventory-fragment-write
          action: update
          direct_io_ref: write-1
          may_occur_in_outcomes:
          - inventoried
          - inventoried-with-gaps
          value_source:
            kind: argument
            argument_ref: inventory-fragment
          confirmation_evidence:
            kind: output
            output_ref: inventory-fragment-output
          reversibility:
            reversible: Delete the generated inventory fragment without changing source files.
        - id: progress-sidecar-append
          action: update
          direct_io_ref: write-2
          may_occur_in_outcomes:
          - inventoried
          - inventoried-with-gaps
          value_source:
            kind: argument
            argument_ref: progress-sidecar
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-2
          reversibility:
            reversible: Delete the derived progress sidecar with the fresh run directory.
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: Each iterator acknowledgement validates the complete
              current fragment before atomically advancing durable iterator state.
          concurrent_invocations:
            unsafe: Concurrent workers using the same worker index or destination
              can conflict.
          idempotency:
            idempotent: Retrying the same acknowledgement with unchanged validated
              inventory and wrap intent returns the same durable response.
          on_uncertain_completion:
            verify_then_decide: Invoke next without acknowledgement to recover the
              outstanding unit or complete state before retrying.
          partial_effects_on_failure:
            possible: The worker fragment may contain validated work for already
              acknowledged units.
          rollback_on_failure:
            available: Resume from the durable outstanding iterator lease and repair
              only the worker-owned fragment.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: inventory-fragment-output
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - id: inventoried
        class: success
        caller_action: Retain the completed worker fragment for authenticated pooling.
        effects:
        - inventory-fragment-write
        - progress-sidecar-append
        outputs:
        - inventory-fragment-output
      - id: inventoried-with-gaps
        class: success
        caller_action: Retain the fragment and its source-grounded gaps for extraction reconciliation.
        effects:
        - inventory-fragment-write
        - progress-sidecar-append
        outputs:
        - inventory-fragment-output
      - id: invalid-request
        class: error
        caller_action: Correct the assignment or worker-owned paths before retrying.
        effects: []
        outputs: []
      outputs:
      - id: inventory-fragment-output
        audience: machine
        cardinality:
          minimum: 1
          maximum: 1
        description: Supplied filesystem path to one schema-valid completed version-3
          inventory fragment plus bounded numeric controlled-child process-dispatch
          and total measurements for every actual next call.
        direct_io_ref: write-1
        empty: Never empty on success.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
