authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _inventory_pipeline/_voyage_dispenser.py
      - Interface
      reason: Set up and operate one durable inventory Voyage per immutable chunk.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _inventory_pipeline/_chunk_pooler.py
      - Interface
      reason: Validate and pool completed inventories from disjoint worker chunks.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _semantic_pipeline/_to_canonical_json.py
      - Interface
      reason: Compile resolved mathematical semantic IR into canonical graph JSON.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _semantic_pipeline/_apply_proof_digest.py
      - Interface
      reason: Normalize transitional proof entities into proof-free semantic IR.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _inventory_pipeline/_chunk_extractor.py
      - Interface
      reason: Extract immutable worker chunks containing source-ordered packets.
    network: []
children: {}
content:
- _inventory_pipeline/(?!artifacts(?:/.*)?$|voyages(?:/.*)?$).*
- _semantic_pipeline/.*
- __init__\.py
- tests/.*
description: Code module for the math-dependency-graph skill.
