authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _inventory_unit_iterator.py
      - Interface
      reason: Set up or atomically advance durable inventory source units.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _extraction_phase_driver.py
      - Interface
      reason: Advance deterministic inventory and extract finalization boundaries.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _run_diagnostics.py
      - Interface
      reason: Atomically record durable worker and deterministic-stage run diagnostics.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _extraction_chunk_planner.py
      - Interface
      reason: Plan bounded extraction chunks and materialize exact worker packets.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _batch_ir_merger.py
      - Interface
      reason: Validate and merge disjoint extraction batch fragments.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _graph_builder.py
      - Interface
      reason: Render math dependency graph HTML from canonical JSON.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _semantic_graph_compiler.py
      - Interface
      reason: Compile resolved mathematical semantic IR into canonical graph JSON.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _source_packet.py
      - Interface
      reason: Prepare source-ordered TeX packets for LLM semantic extraction.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _tex_macro_reader.py
      - Interface
      reason: Extract MathJax macro definitions from TeX sources.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _graph_server.py
      - Interface
      reason: Serve graph HTML locally for inspection.
    network: []
children: {}
content:
- _batch_ir_merger\.py
- _extraction_chunk_planner\.py
- _extraction_phase_driver\.py
- _graph_builder\.py
- _graph_server\.py
- _inventory_unit_iterator\.py
- _run_diagnostics\.py
- __init__\.py
- _semantic_graph_compiler\.py
- _source_packet\.py
- _tex_macro_reader\.py
- tests/.*
