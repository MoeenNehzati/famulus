schema_version: 6
node_type: behavioral_source
id: math-dependency-graph._rtx.source.rtx-inquisitive-inventory-rutter
version: 7
description: Presents authenticated iterator-sequence text as finite inventory interactions,
  then compares each accepted inventory with its indexed adjudicated gold through a TransitionHook.
gateway:
  language: Python>=3.11
  path: _inquisitive_inventory_rutter.py
content:
- _inquisitive_inventory_rutter\.py
dependencies:
- source: math-dependency-graph._rtx.source.rtx-inventory-unit-iterator
  version: 7
  blueprint:
    base: module-root
    path: blueprints/rtx-inventory-unit-iterator.yaml
  reason: Reads immutable authenticated before/after sequence artifacts for one completed iterator worker.
- source: common.source.atomic-files
  version: 1
  blueprint:
    base: repository-root
    path: src/officina/common/blueprints/atomic-files.yaml
  reason: Confines immutable machine-ID-keyed ledger rows and strict ledger reads.
- source: rutter.source.diagnostic
  version: 3
  blueprint:
    base: repository-root
    path: src/officina/rutter/blueprints/diagnostic.yaml
  reason: Constructs diagnostic cases, the DiagnoseAnswer child, and its sequence TransitionHook.
- source: rutter.source.model
  version: 2
  blueprint:
    base: repository-root
    path: src/officina/rutter/blueprints/model.yaml
  reason: Constructs public Rutter evolutions, callback contexts, validators, records, and results.
- source: rutter.source.runtime
  version: 3
  blueprint:
    base: repository-root
    path: src/officina/rutter/blueprints/runtime.yaml
  reason: Creates and reopens one exact registry-bound durable voyage.
uses_interfaces:
- interface: common.interface.atomic-files
  version: 1
- interface: rutter.interface.binding
  version: 3
- interface: rutter.interface.diagnostic
  version: 3
- interface: rutter.interface.model
  version: 2
interfaces:
  math-dependency-graph._rtx.source.rtx-inquisitive-inventory-rutter.interface.experiment-lifecycle:
    version: 7
    description: Seal finite text interactions, current iterator artifacts, or authenticated
      reconstructed iterator history with indexed gold answers into an experiment.
    usage: <setup|setup-iterator|setup-frozen-gold|open|ledger> <inputs...> <experiment-dir>
    content:
    - _inquisitive_inventory_rutter\.py
    uses_interfaces:
    - interface: common.interface.atomic-files
      version: 1
    - interface: rutter.interface.binding
      version: 3
    - interface: rutter.interface.diagnostic
      version: 3
    - interface: rutter.interface.model
      version: 2
    contract:
      arguments:
        operation:
          description: Exact lifecycle operation.
          required: true
          sensitivity: public
          type:
            kind: enum
            values:
            - value: setup
              description: Create a new experiment from separately supplied frozen cases.
            - value: setup-iterator
              description: Create a new experiment from one completed iterator worker's authenticated sequence artifacts.
            - value: setup-frozen-gold
              description: Reconstruct one legacy frozen worker from authenticated fragments and map the bundled or explicitly supplied corrected full gold graph by source span.
            - value: open
              description: Reopen an existing experiment.
            - value: ledger
              description: Read and validate sorted machine-ID-keyed ledger rows.
        source-cases:
          description: Controller-frozen source text, prior inventory, and authenticated historical snapshot used only by setup.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Finite JSON-compatible Python array.
            sensitivity: user-private
        iterator-state-dir:
          description: Durable iterator state containing immutable sequence delta artifacts.
          direct_io_ref: iterator-state
          required: false
          sensitivity: user-private
          type:
            kind: dir
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        worker-index:
          description: Positive completed iterator worker whose sequences become cases.
          required: false
          sensitivity: public
          type:
            kind: integer
            minimum: 1
            sensitivity: public
        gold-cases:
          description: Separately adjudicated semantic answers used only by setup.
          required: false
          sensitivity: secret
          type:
            kind: string
            description: Finite JSON-compatible Python array.
            sensitivity: secret
        inventory-fragments:
          description: Authenticated final worker fragments used to reconstruct legacy sequence snapshots.
          required: false
          sensitivity: user-private
          type:
            kind: string
            description: Finite array of exact fragment paths.
            sensitivity: user-private
        gold-annotation-path:
          description: Optional override for the bundled frozen full-graph gold annotation used by setup-frozen-gold.
          direct_io_ref: gold-annotation
          required: false
          sensitivity: secret
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: secret
        gold-overlay-path:
          description: Optional override for the bundled accepted correction overlay authenticating the base gold file.
          direct_io_ref: gold-overlay
          required: false
          sensitivity: secret
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: secret
        experiment-dir:
          description: Exact experiment directory created by setup or read by open.
          direct_io_ref: experiment-state
          required: true
          sensitivity: user-private
          type:
            kind: dir
            access: read-write
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
      preconditions: []
      interaction:
        mode: unattended
      caller_warnings:
      - external-side-effect: Setup creates a durable Reckoning and ledger directory;
          open only reads current authority.
      outputs:
      - id: result
        audience: machine
        description: Exact public Voyage instance or validated ledger-row array.
        direct_io_ref: return-value
        cardinality:
          minimum: 1
          maximum: 1
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        empty: Never empty on success.
        type:
          kind: string
          description: Public Python Voyage instance or finite ledger-row array.
          sensitivity: user-private
      outcomes:
      - id: created
        class: success
        outputs:
        - result
        effects:
        - experiment-create
        caller_action: Operate only the returned public voyage.
      - id: opened
        class: success
        outputs:
        - result
        effects: []
        caller_action: Resume from the returned current authority.
      - id: ledger
        class: success
        outputs:
        - result
        effects: []
        caller_action: Consume the validated sorted ledger rows.
      - id: rejected
        class: refusal
        outputs: []
        effects: []
        caller_action: Correct the frozen case arrays or exact path before retrying.
      - id: failed
        class: error
        outputs: []
        effects:
        - experiment-create
        caller_action: Inspect the selected directory before choosing a fresh setup path.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          live: Setup seals exact inputs once; open reads the current durable Reckoning.
        effects:
        - id: experiment-create
          direct_io_ref: experiment-state
          action: create
          value_source:
            kind: argument
            argument_ref: experiment-dir
          may_occur_in_outcomes:
          - created
          - failed
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: experiment-state
          reversibility:
            irreversible: The lifecycle helper never removes an experiment directory.
        mutation_safety:
          atomicity:
            per_effect_only: Reckoning and ledger files use their own confined atomic boundaries.
          concurrent_invocations:
            unsafe: Concurrent setup invocations for one absent directory are not coordinated.
          idempotency:
            non_idempotent: Setup rejects an existing directory; open is read-only.
          on_uncertain_completion:
            verify_then_decide: Attempt strict open before selecting a fresh setup path.
          partial_effects_on_failure:
            possible: A directory can exist if binding fails after directory creation.
          rollback_on_failure:
            unavailable: No cleanup or rollback is authorized.
        verification:
        - method: direct-io-state
          direct_io_ref: experiment-state
      helpers: []
      direct_io:
        network: []
        reads:
        - id: iterator-state
          medium: local-filesystem
          access: read
          system: filesystem
          content: Iterator SQLite state and immutable authenticated sequence delta artifacts.
          formats:
          - sqlite
          path: <iterator-state-dir>/iterator.sqlite3
          path_match: exact
          sensitivity: user-private
        - id: gold-annotation
          medium: local-filesystem
          access: read
          system: filesystem
          content: Frozen full-graph gold annotation.
          formats:
          - json
          path: <gold-annotation-path>
          path_match: exact
          sensitivity: secret
        - id: gold-overlay
          medium: local-filesystem
          access: read
          system: filesystem
          content: Accepted adjudicated correction overlay.
          formats:
          - json
          path: <gold-overlay-path>
          path_match: exact
          sensitivity: secret
        - id: experiment-state
          medium: local-filesystem
          access: read-write
          system: filesystem
          content: Durable Reckoning, lock, and machine-ID-keyed ledger rows.
          formats:
          - json
          path: <experiment-dir>/**
          path_match: glob
          sensitivity: secret
        writes:
        - id: experiment-state
          medium: local-filesystem
          access: read-write
          system: filesystem
          content: Durable Reckoning, lock, and machine-ID-keyed ledger rows.
          formats:
          - json
          path: <experiment-dir>/**
          path_match: glob
          sensitivity: secret
        - id: return-value
          medium: local-system
          access: write
          content: Public Voyage instance or validated ledger-row array.
          formats:
          - python-object
          sensitivity: user-private
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
maturity: experimental
