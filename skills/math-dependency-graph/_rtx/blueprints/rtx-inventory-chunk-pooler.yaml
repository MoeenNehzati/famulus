content:
- _inventory_pipeline/_chunk_pooler\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: math-dependency-graph._rtx.source.rtx-init
  version: 2
description: Safely rejects malformed worker artifacts, validates version-3 discovery
  fragments, checks hidden environment-anchor coverage, and deterministically normalizes
  inline nodes, edges, endpoints, and gaps into one qualified version-2 pooled inventory
  IR while authenticating source ownership; size remains a controller-facing diagnostic.
gateway:
  language: Python>=3.11
  path: _inventory_pipeline/_chunk_pooler.py
id: math-dependency-graph._rtx.source.rtx-inventory-chunk-pooler
interfaces:
  math-dependency-graph._rtx.source.rtx-inventory-chunk-pooler.interface.scripts-pool-inventory-chunks:
    content:
    - _inventory_pipeline/_chunk_pooler\.py
    uses_interfaces: []
    contract:
      arguments:
        chunk-manifest:
          description: Inventory chunk manifest defining complete source ownership.
          direct_io_ref: read-3
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              format:
                named: json
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        fragment-manifest:
          description: JSON object listing completed chunk inventory paths in source order.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              format:
                named: json
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        out:
          description: Required merged JSON destination.
          direct_io_ref: write-1
          required: true
          sensitivity: user-private
          type:
            access: write
            content_type:
              format:
                named: json
              kind: string
              sensitivity: derived-private
            kind: file
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
      caller_warnings:
      - external-side-effect: Atomically writes or replaces the merged extraction
          artifact.
      direct_io:
        network: []
        reads:
        - access: read
          content: ordered fragment manifest
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: <fragment-manifest>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: extraction fragments named by the manifest
          formats:
          - json
          id: read-2
          medium: local-filesystem
          path: paths listed by <fragment-manifest>
          path_match: glob
          sensitivity: user-private
          system: filesystem
        - access: read
          content: inventory chunk manifest defining source ownership
          formats:
          - json
          id: read-3
          medium: local-filesystem
          path: <chunk-manifest>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: immutable chunk files named by chunk_path values in the chunk
            manifest and authenticated against their extracted identities
          formats:
          - text
          id: read-5
          medium: local-filesystem
          path: chunk_path values listed by <chunk-manifest>
          path_match: glob
          sensitivity: user-private
          system: filesystem
        - access: read
          content: inventory fragment schema
          formats:
          - json
          id: read-4
          medium: local-filesystem
          path: $skill/schemas/inventory.schema.json
          path_match: exact
          sensitivity: public
          system: filesystem
        writes:
        - access: write
          content: pooled inventory IR
          formats:
          - json
          id: write-1
          medium: local-filesystem
          path: <out>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: chunk inventory pooling report
          formats:
          - json
          id: write-2
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Pooling uses the fragment and inventory chunk manifests during
            this invocation.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: merged-artifact
          may_occur_in_outcomes:
          - merged
          reversibility:
            reversible: Delete or regenerate the merged artifact from unchanged fragments.
          value_source:
            argument_ref: fragment-manifest
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: The destination is replaced only after every fragment validates.
          concurrent_invocations:
            unsafe: Concurrent writers to the same destination are not serialized.
          idempotency:
            idempotent: Unchanged ordered fragments produce equivalent merged JSON.
          on_uncertain_completion:
            verify_then_decide: Inspect the destination and report before retrying.
          partial_effects_on_failure:
            impossible: Invalid fragments fail before atomic destination replacement.
          rollback_on_failure:
            available: The previous destination remains until atomic replacement.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: report
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Pass the pooled inventory IR to extract packet planning.
        class: success
        effects:
        - merged-artifact
        id: merged
        outputs:
        - report
      - caller_action: Regenerate only the overlapping, missing, or invalid chunk inventory.
        class: refusal
        effects: []
        id: invalid-fragments
        outputs: []
      - caller_action: Correct unreadable inputs or the selected destination.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON report containing fragment count and pooled inventory output
          path.
        direct_io_ref: write-2
        empty: Never empty on success.
        id: report
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Validate and pool disjoint inventory fragments.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --chunk-manifest
        - --out
        required_flags:
        - --chunk-manifest
        - --out
        flag_patterns:
          --chunk-manifest: ^.+$
          --out: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <fragment-manifest.json> --chunk-manifest <inventory-chunks.json> --out
      <inventory-ir.json>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: jsonschema
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Validates completed chunk inventories against the skill-owned schema.
  version: '>=4,<5'
schema_version: 6
uses_interfaces: []
version: 23
maturity: stable
