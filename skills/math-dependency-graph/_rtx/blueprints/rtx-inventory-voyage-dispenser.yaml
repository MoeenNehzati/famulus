schema_version: 6
node_type: behavioral_source
id: math-dependency-graph._rtx.source.rtx-inventory-voyage-dispenser
version: 10
description: Defines default and debug inventory Rutter modes, initializes one durable module-owned Voyage per immutable chunk, introduces the frozen instruction plus cumulative packet and worker-owned inventory paths once, appends each packet before delivering that exact string, validates packet-local report deltas against the cumulative inventory, and maps coordinates at finalization.
gateway:
  language: Python>=3.11
  path: _inventory_pipeline/_voyage_dispenser.py
content:
- _inventory_pipeline/_voyage_dispenser\.py
- _inventory_pipeline/_voyage_support\.py
dependencies:
- source: common.source.atomic-files
  version: 1
  blueprint: {base: repository-root, path: src/officina/common/blueprints/atomic-files.yaml}
  reason: Writes cumulative source packets and chunk inventories atomically.
- source: rutter.source.engine
  version: 3
  blueprint: {base: repository-root, path: src/officina/rutter/blueprints/engine.yaml}
  reason: Creates and operates each durable inventory Voyage.
- source: rutter.source.model
  version: 2
  blueprint: {base: repository-root, path: src/officina/rutter/blueprints/model.yaml}
  reason: Declares the Rutter, LLM step, machine step, and terminal result.
- source: rutter.source.dispenser
  version: 4
  blueprint: {base: repository-root, path: src/officina/rutter/blueprints/dispenser.yaml}
  reason: Routes standard operations to authorized chunk Voyages by ID.
- source: rutter.source.diagnostic
  version: 4
  blueprint: {base: repository-root, path: src/officina/rutter/blueprints/diagnostic.yaml}
  reason: Attaches the supplied-answer inventory-diagnosis child Rutter in debug mode.
- source: math-dependency-graph._rtx.source.rtx-inventory-chunk-extractor
  version: 9
  blueprint: {base: module-root, path: blueprints/rtx-inventory-chunk-extractor.yaml}
  reason: Resolves and packets the supplied document entrypoint into internal immutable chunks.
uses_interfaces:
- {interface: common.interface.atomic-files, version: 1}
- {interface: rutter.interface.bound-operations, version: 6}
- {interface: rutter.interface.model, version: 2}
- {interface: rutter.interface.dispenser, version: 4}
- {interface: math-dependency-graph._rtx.source.rtx-inventory-chunk-extractor.interface.scripts-extract-inventory-chunks, version: 1}
interfaces:
  math-dependency-graph._rtx.source.rtx-inventory-voyage-dispenser.interface.inventory-voyages:
    version: 10
    description: Discover and initialize inventory Voyages, introduce the frozen instruction plus cumulative_packets_file and inventory_file paths once, append each packet before delivering its exact source string, validate each packet-local report delta against the worker-owned cumulative inventory, and map row coordinates at finalization.
    usage: <help|modes> | list [--run-prefix <prefix>] | initiate [default] [--run-prefix <prefix>] --doc-entrypoint <path> --chunk-count <positive-integer> | initiate debug [--run-prefix <prefix>] --doc-entrypoint <path> --chunk-count <positive-integer> --inventory-gold-standard <path> --inventory-source-aliases <path> | <status|validate|advance> <voyage-id> [--response-file <path> --responding-to <entry-id>] | release <voyage-id> [--force]
    content:
    - _inventory_pipeline/_voyage_dispenser\.py
    - _inventory_pipeline/_voyage_support\.py
    uses_interfaces:
    - {interface: common.interface.atomic-files, version: 1}
    - {interface: rutter.interface.bound-operations, version: 6}
    - {interface: rutter.interface.model, version: 2}
    - {interface: rutter.interface.dispenser, version: 4}
    - {interface: math-dependency-graph._rtx.source.rtx-inventory-chunk-extractor.interface.scripts-extract-inventory-chunks, version: 1}
    process_binding:
      kind: process
      entry: Interface
      patterns:
      - name: discovery
        min_positionals: 1
        max_positionals: 1
        positional_patterns: {'0': ^(help|modes)$}
        allowed_flags: []
        required_flags: []
        flag_patterns: {}
      - name: list
        min_positionals: 1
        max_positionals: 1
        positional_patterns: {'0': ^list$}
        allowed_flags: [--run-prefix]
        required_flags: []
        flag_patterns: {--run-prefix: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
      - name: initiate-default-implicit
        min_positionals: 1
        max_positionals: 1
        positional_patterns: {'0': ^initiate$}
        allowed_flags: [--run-prefix, --doc-entrypoint, --chunk-count]
        required_flags: [--doc-entrypoint, --chunk-count]
        flag_patterns: {--run-prefix: '^[A-Za-z0-9][A-Za-z0-9._-]*$', --doc-entrypoint: '^.+\.(?:tex|md)$', --chunk-count: '^[1-9][0-9]*$'}
      - name: initiate-default-explicit
        min_positionals: 2
        max_positionals: 2
        positional_patterns: {'0': ^initiate$, '1': ^default$}
        allowed_flags: [--run-prefix, --doc-entrypoint, --chunk-count]
        required_flags: [--doc-entrypoint, --chunk-count]
        flag_patterns: {--run-prefix: '^[A-Za-z0-9][A-Za-z0-9._-]*$', --doc-entrypoint: '^.+\.(?:tex|md)$', --chunk-count: '^[1-9][0-9]*$'}
      - name: initiate-debug
        min_positionals: 2
        max_positionals: 2
        positional_patterns: {'0': ^initiate$, '1': ^debug$}
        allowed_flags: [--run-prefix, --doc-entrypoint, --chunk-count, --inventory-gold-standard, --inventory-source-aliases]
        required_flags: [--doc-entrypoint, --chunk-count, --inventory-gold-standard, --inventory-source-aliases]
        flag_patterns: {--run-prefix: '^[A-Za-z0-9][A-Za-z0-9._-]*$', --doc-entrypoint: '^.+\.(?:tex|md)$', --chunk-count: '^[1-9][0-9]*$', --inventory-gold-standard: ^.+$, --inventory-source-aliases: ^.+$}
      - name: operation
        min_positionals: 2
        max_positionals: 2
        positional_patterns: {'0': ^(status|validate|advance)$}
        allowed_flags: [--response-file, --responding-to]
        required_flags: []
        flag_patterns: {--response-file: ^.+$, --responding-to: ^.+$}
      - name: release
        min_positionals: 2
        max_positionals: 2
        positional_patterns: {'0': ^release$}
        allowed_flags: [--force]
        required_flags: []
        flag_patterns: {}
    contract:
      arguments:
        operation:
          description: Discovery, initialization, or one standard dispenser operation.
          required: true
          sensitivity: public
          type: {kind: string, sensitivity: public}
        doc-entrypoint:
          description: Root TeX or Markdown document to read and partition internally.
          direct_io_ref: read-1
          required: false
          sensitivity: user-private
          type: {kind: file, access: read, must_exist: true, relative_to: caller-cwd, syntax: literal, content_type: {kind: string, sensitivity: user-private}}
        chunk-count:
          description: Requested positive number of nonempty inventory chunks; fewer are returned when the document has fewer packets.
          required: false
          sensitivity: public
          type: {kind: integer, minimum: 1, sensitivity: public}
        inventory-gold-standard:
          description: Inventory schema-v3 gold JSON frozen into every debug Voyage and used by inventory-diagnosis hooks; required only for debug initiation.
          direct_io_ref: read-2
          required: false
          sensitivity: user-private
          type: {kind: file, access: read, must_exist: true, relative_to: caller-cwd, syntax: literal, content_type: {kind: string, sensitivity: user-private, format: {named: json}}}
        inventory-source-aliases:
          description: JSON object mapping gold source paths to inventory-manifest source paths, frozen into every debug Voyage; use an empty object when paths already align.
          direct_io_ref: read-3
          required: false
          sensitivity: user-private
          type: {kind: file, access: read, must_exist: true, relative_to: caller-cwd, syntax: literal, content_type: {kind: string, sensitivity: user-private, format: {named: json}}}
        run-prefix:
          description: Safe run name used as the storage namespace and Voyage ID prefix; defaults to the selected mode.
          required: false
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        voyage-id:
          description: Opaque chunk Voyage ID returned by list.
          required: false
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
      preconditions: []
      caller_warnings:
      - external-side-effect: Setup creates durable Voyages, advance appends cumulative source text and may write a completed chunk inventory, and release deletes one terminal Voyage working directory; --force explicitly permits deleting a nonterminal Voyage. Debug release first archives its diagnostic reckoning under the run artifacts.
      interaction: {mode: unattended}
      outputs:
      - id: result
        audience: machine
        description: Finite JSON initialization or standard dispenser result.
        direct_io_ref: stdout
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty on success.
        type: {kind: string, sensitivity: derived-private, format: {named: json}}
      outcomes:
      - id: completed
        class: success
        outputs: [result]
        effects: [voyage-state]
        caller_action: Retain each returned terminal inventory path, then release its Voyage; debug release preserves the complete diagnostic reckoning under the run artifacts.
      - id: invalid-input
        class: error
        outputs: []
        effects: []
        caller_action: Correct the document entrypoint, chunk count, Voyage ID, or correlated response.
      execution:
        state_effect: mutating
        lifecycle: finite
        consistency:
          snapshot: Initialization reads one document snapshot and freezes its chunks, inventory instruction, and inventory schema under one isolated run prefix; one introductory LLM turn receives the frozen instruction and cumulative_packets_file path and acknowledges them, then before every report a repeat-safe machine step verifies and appends the current packet's raw text to the exact cumulative immutable-packet prefix and the report receives the packet as raw content without source-coordinate metadata or repeated run-wide fields. Debug also freezes the supplied gold standard, source aliases, validated gold-to-inventory source map, and each report's decision basis before revealing the projected gold answer.
        effects:
        - id: voyage-state
          direct_io_ref: voyage-state
          action: update
          value_source: {kind: output, output_ref: result}
          may_occur_in_outcomes: [completed]
          confirmation_evidence: {kind: output, output_ref: result}
          reversibility: {reversible: Release each terminal Voyage working directory after retaining its derived inventory; debug release also retains its diagnostic reckoning under run artifacts.}
        mutation_safety:
          atomicity: {per_effect_only: Each Voyage and cumulative inventory owns its atomic write boundary.}
          concurrent_invocations: {safe: Distinct Voyage IDs may be assigned to distinct workers.}
          idempotency: {non_idempotent: Advance appends one correlated Voyage evolution.}
          on_uncertain_completion: {verify_then_decide: Read status before retrying an advance.}
          partial_effects_on_failure: {possible: A completed machine step may precede a later caller failure.}
          rollback_on_failure: {unavailable: Voyage history is append-only.}
        verification: [{method: output-schema, output_ref: result}]
      helpers: []
      direct_io:
        reads:
        - {id: read-1, medium: local-filesystem, access: read, system: filesystem, content: Root TeX or Markdown document and its locally included TeX sources, formats: [text], sensitivity: user-private, path: <doc-entrypoint>, path_match: exact}
        - {id: read-2, medium: local-filesystem, access: read, system: filesystem, content: Inventory gold standard used only by debug diagnosis hooks, formats: [json], sensitivity: user-private, path: <inventory-gold-standard>, path_match: exact}
        - {id: read-3, medium: local-filesystem, access: read, system: filesystem, content: Gold-to-inventory source aliases used only to validate and project debug gold records, formats: [json], sensitivity: user-private, path: <inventory-source-aliases>, path_match: exact}
        writes:
        - {id: voyage-state, medium: local-filesystem, access: write, system: filesystem, content: 'Run-prefixed durable inventory Voyages, cumulative raw source-packet text, completed chunk inventories, pre-reference debug decision bases, and terminal attributed diagnostic reckonings', formats: [json, text], sensitivity: derived-private, path: '<module-root>/_inventory_pipeline/{voyages,artifacts}/<run-prefix>', path_match: glob}
        - {id: stdout, medium: stdout, access: write, content: Operation result, formats: [json], sensitivity: derived-private}
        network: []
platform_support: {linux: true, macos: true, windows: true}
runtime_dependencies: []
maturity: stable
