content:
- _graph_builder\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: math-dependency-graph._rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-tex-macro-reader.yaml
  reason: Imports Python source from _rtx/_tex_macro_reader.py.
  source: math-dependency-graph._rtx.source.rtx-tex-macro-reader
  version: 1
description: Validates canonical graph JSON and writes a self-contained interactive HTML
  dependency graph with bundled ELK and MathJax assets.
gateway:
  language: Python
  path: _graph_builder.py
id: math-dependency-graph._rtx.source.rtx-graph-builder
interfaces:
  math-dependency-graph._rtx.source.rtx-graph-builder.interface.scripts-build-math-dependency-graph:
    contract:
      arguments:
        html-out:
          description: Optional standalone HTML destination.
          direct_io_ref: write-1
          required: false
          sensitivity: user-private
          type:
            access: write
            content_type:
              kind: string
              sensitivity: derived-private
            kind: file
            must_exist: false
            relative_to: caller-cwd
            syntax: literal
        macro-file:
          description: Optional existing MathJax macro JSON to merge.
          direct_io_ref: read-3
          required: false
          sensitivity: user-private
          type:
            access: read
            content_type:
              format:
                named: json
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        reduce-transitive-edges:
          default: false
          description: Remove graph-theoretically redundant edges from the rendered
            view.
          required: false
          sensitivity: public
          type:
            kind: flag
        refresh-macros:
          default: false
          description: Regenerate the default macro file from the TeX entrypoint.
          required: false
          sensitivity: public
          type:
            kind: flag
        source:
          description: Canonical dependency-graph JSON file.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              format:
                named: json
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        semantic-ir:
          description: Exact semantic IR compiled into the canonical graph; its SHA-256 must match compiler provenance.
          direct_io_ref: read-5
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              format:
                named: json
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        tex-entry:
          description: Optional TeX entrypoint used to extract MathJax macros.
          direct_io_ref: read-2
          required: false
          sensitivity: user-private
          type:
            access: read
            content_type:
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
      caller_warnings:
      - external-side-effect: Writes standalone HTML and may refresh a MathJax macro
          JSON file.
      direct_io:
        network: []
        reads:
        - access: read
          content: canonical dependency graph
          formats:
          - json
          id: read-1
          medium: local-filesystem
          path: <source.json>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: reachable TeX source tree
          formats:
          - tex
          id: read-2
          medium: local-filesystem
          path: <entrypoint.tex> and reachable input or include files
          path_match: glob
          sensitivity: user-private
          system: filesystem
        - access: read
          content: MathJax macro definitions
          formats:
          - json
          id: read-3
          medium: local-filesystem
          path: <macro-file>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - access: read
          content: skill-owned mathematical graph vocabulary and presentation base
          formats:
          - json
          id: read-4
          medium: local-filesystem
          path: $skill/base.json
          path_match: exact
          sensitivity: public
          system: filesystem
        - access: read
          content: resolved semantic graph used to compile the canonical JSON
          formats:
          - json
          id: read-5
          medium: local-filesystem
          path: <semantic-ir.json>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: standalone interactive dependency graph
          formats:
          - html
          id: write-1
          medium: local-filesystem
          path: <html-out> or <source-dir>/_build/<source>.html
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: refreshed MathJax macro definitions
          formats:
          - json
          id: write-2
          medium: local-filesystem
          path: <tex-dir>/_build/<entry>-mathjax-macros.json
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: render report
          formats:
          - json
          id: write-3
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Rendering uses the JSON and macro and TeX content read during
            this invocation.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: html-file
          may_occur_in_outcomes:
          - rendered
          reversibility:
            reversible: The generated HTML can be deleted or regenerated from source.
          value_source:
            argument_ref: source
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            per_effect_only: HTML and optional macro JSON are written as separate
              files.
          concurrent_invocations:
            unsafe: Concurrent renders to the same paths are not serialized.
          idempotency:
            idempotent: Unchanged inputs and options produce equivalent artifacts.
          on_uncertain_completion:
            verify_then_decide: Inspect the reported HTML and macro paths before retrying.
          partial_effects_on_failure:
            possible: A refreshed macro file may remain when later HTML rendering
              fails.
          rollback_on_failure:
            unavailable: Prior artifacts are not retained automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: report
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Open the reported HTML path for inspection.
        class: success
        effects:
        - html-file
        id: rendered
        outputs:
        - report
      - caller_action: Correct the canonical graph or TeX and macro inputs.
        class: refusal
        effects: []
        id: invalid
        outputs: []
      - caller_action: Report the file or rendering error and preserve existing artifacts.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON report with HTML path and graph counts and macro details.
        direct_io_ref: write-3
        empty: Never empty.
        id: report
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Render an interactive HTML math dependency graph from canonical JSON;
      the saved document loads ELK and MathJax from jsDelivr when opened.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --html-out
        - --tex-entry
        - --macro-file
        - --semantic-ir
        - --refresh-macros
        - --reduce-transitive-edges
        required_flags:
        - --semantic-ir
        flag_patterns:
          --html-out: ^.+$
          --macro-file: ^.+$
          --semantic-ir: ^.+$
          --tex-entry: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <source.json> --semantic-ir <semantic-ir.json> [--tex-entry <entrypoint.tex>]
      [--html-out <path>] [--macro-file <path>] [--refresh-macros] [--reduce-transitive-edges]
    version: 4
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces: []
version: 4
