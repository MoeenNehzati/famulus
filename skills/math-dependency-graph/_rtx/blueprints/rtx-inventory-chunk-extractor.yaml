content:
- _inventory_pipeline/_chunk_extractor\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: math-dependency-graph._rtx.source.rtx-init
  version: 2
description: Resolves a TeX entrypoint and partitions its active source into immutable
  worker chunks containing ordered packets without extracting mathematical semantics.
gateway:
  language: Python>=3.11
  path: _inventory_pipeline/_chunk_extractor.py
id: math-dependency-graph._rtx.source.rtx-inventory-chunk-extractor
interfaces:
  math-dependency-graph._rtx.source.rtx-inventory-chunk-extractor.interface.scripts-extract-inventory-chunks:
    content:
    - _inventory_pipeline/_chunk_extractor\.py
    uses_interfaces: []
    contract:
      arguments:
        entrypoint:
          description: Root TeX document whose authored input/include tree is prepared.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              kind: string
              sensitivity: user-private
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        out-dir:
          description: Fresh directory for the chunk manifest and immutable chunk files.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Writes the inventory chunk manifest and immutable chunks.
      direct_io:
        network: []
        reads:
        - access: read
          content: TeX entrypoint and reachable authored input/include files
          formats:
          - tex
          id: read-1
          medium: local-filesystem
          path: <entrypoint.tex> and reachable local source files
          path_match: glob
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: inventory chunk manifest and immutable chunks with ordered packets
          formats:
          - text
          id: write-1
          medium: local-filesystem
          path: <out-dir>
          path_match: glob
          sensitivity: derived-private
          system: filesystem
        - access: write
          content: source preparation report
          formats:
          - json
          id: write-2
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: The packet preserves active authored source with original line
            provenance in deterministic TeX expansion order.
        effects:
        - action: update
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: inventory-chunks
          may_occur_in_outcomes:
          - prepared
          reversibility:
            reversible: Delete or regenerate the derived chunks without changing the
              TeX sources.
          value_source:
            argument_ref: entrypoint
            kind: argument
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: A temporary sibling is atomically replaced only after the complete
              packet is written and all authored includes resolve.
          concurrent_invocations:
            unsafe: Concurrent writers to the same selected output are not serialized.
          idempotency:
            idempotent: Unchanged reachable TeX sources produce equivalent packet
              content and discovery counts.
          on_uncertain_completion:
            verify_then_decide: Inspect the report and selected packet before retrying.
          partial_effects_on_failure:
            impossible: Missing inputs are rejected before writing and temporary files
              are removed on write failure.
          rollback_on_failure:
            available: The preexisting selected packet remains until atomic replacement.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: report
        - direct_io_ref: write-1
          method: direct-io-state
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Set up one inventory Voyage per reported chunk.
        class: success
        effects:
        - inventory-chunks
        id: prepared
        outputs:
        - report
      - caller_action: Supply an existing TeX entrypoint.
        class: refusal
        effects: []
        id: missing
        outputs: []
      - caller_action: Resolve every reported authored input before semantic extraction.
        class: error
        effects: []
        id: unresolved-input
        outputs: []
      - caller_action: Correct unreadable sources or the selected output path.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: JSON report containing entrypoint and packet paths, file, line,
          and byte counts, unresolved inputs, cycles, and elapsed preparation time.
        direct_io_ref: write-2
        empty: Never empty on success.
        id: report
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Prepare a complete source-ordered TeX packet with exact provenance
      and a non-semantic visible-environment begin/end coverage checklist.
    process_binding:
      entry: Interface
      kind: process
      patterns:
      - allowed_flags:
        - --out-dir
        - --workers
        - --packet-chars
        required_flags:
        - --out-dir
        flag_patterns:
          --out-dir: ^.+$
          --workers: ^[1-9][0-9]*$
          --packet-chars: ^[1-9][0-9]*$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <entrypoint.tex> --out-dir <path> [--workers <count>] [--packet-chars <count>]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
schema_version: 6
uses_interfaces: []
version: 8
maturity: stable
