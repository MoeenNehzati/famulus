schema_version: 6
node_type: behavioral_source
id: math-dependency-graph._rtx.source.rtx-inventory-unit-iterator
version: 7
maturity: experimental
description: Sets up durable, source-ordered inventory units once, advances one
  worker cursor atomically, and records immutable authenticated attention-sequence
  deltas without making mathematical graph decisions.
gateway:
  language: Python>=3.11
  path: _inventory_unit_iterator.py
content:
- _inventory_unit_iterator\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-init.yaml
  reason: Loads Python package support from _rtx/__init__.py.
  source: math-dependency-graph._rtx.source.rtx-init
  version: 1
- blueprint:
    base: module-root
    path: blueprints/rtx-batch-ir-merger.yaml
  reason: Reuses inventory JSON canonicalization, schema validation, and canonical
    source-span ownership validation.
  source: math-dependency-graph._rtx.source.rtx-batch-ir-merger
  version: 22
uses_interfaces: []
interfaces:
  math-dependency-graph._rtx.source.rtx-inventory-unit-iterator.interface.scripts-setup-inventory-iterator:
    version: 5
    description: Create or verify one durable source-unit iterator state directory and
      publish its effective worker assignments atomically.
    usage: <source-packet> <state-dir> --workers <positive-int> --window-chars <positive-int>
    content:
    - _inventory_unit_iterator\.py
    uses_interfaces: []
    process_binding:
      kind: process
      entry: Interface
      args_prefix:
      - setup
      patterns:
      - name: owner
        min_positionals: 2
        max_positionals: 2
        allow_stdin: false
        allowed_flags:
        - --workers
        - --window-chars
        required_flags:
        - --workers
        - --window-chars
        flag_patterns:
          --workers: ^[1-9][0-9]*$
          --window-chars: ^[1-9][0-9]*$
    contract:
      arguments:
        source-packet:
          description: Expanded source-ordered packet whose numbered rows are unitized once.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            kind: file
            access: read
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
            content_type:
              kind: string
              sensitivity: user-private
        state-dir:
          description: State directory to create atomically or verify against the same source and configuration.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        workers:
          description: Positive maximum number of contiguous worker ranges.
          required: true
          sensitivity: public
          type:
            kind: integer
            minimum: 1
        window-chars:
          description: Positive maximum target size for a source unit in characters.
          required: true
          sensitivity: public
          type:
            kind: integer
            minimum: 1
      caller_warnings:
      - external-side-effect: Creates the selected iterator state directory or verifies a matching existing state.
      direct_io:
        network: []
        reads:
        - id: read-1
          medium: local-filesystem
          access: read
          content: Expanded source packet with source markers and numbered source rows.
          formats:
          - text
          path: <source-packet>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - id: write-1
          medium: local-filesystem
          access: write
          content: Durable iterator SQLite state, assignments, worker fragments, progress files, and controller packets.
          formats:
          - sqlite
          - json
          - markdown
          path: <state-dir>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - id: write-2
          medium: stdout
          access: write
          content: JSON setup report naming the state directory, durable configuration
            identity and internal timings, bounded worker assignments, and prose-free
            coordinate coverage.
          formats:
          - json
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Setup scans the supplied source packet once and publishes complete iterator state only after validation.
        effects:
        - id: iterator-state
          action: update
          direct_io_ref: write-1
          may_occur_in_outcomes:
          - setup
          value_source:
            kind: argument
            argument_ref: state-dir
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-1
          reversibility:
            reversible: Delete or regenerate derived iterator state without modifying the source packet.
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: A complete temporary sibling directory is renamed into place only after validation.
          concurrent_invocations:
            unsafe: Concurrent setup calls for the same state directory are not coordinated.
          idempotency:
            idempotent: Repeating setup with identical source identity and configuration returns the existing summary.
          on_uncertain_completion:
            verify_then_decide: Inspect inventory-assignments.json before retrying setup.
          partial_effects_on_failure:
            impossible: Failed setup removes its temporary state and leaves the selected state directory unchanged.
          rollback_on_failure:
            available: The previous matching state remains available until successful publication.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: report
        - method: direct-io-state
          direct_io_ref: write-1
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - id: setup
        class: success
        caller_action: Launch only the reported effective worker indices.
        effects:
        - iterator-state
        outputs:
        - report
      - id: mismatched-state
        class: refusal
        caller_action: Select a fresh state directory or restore the matching source and configuration.
        effects: []
        outputs: []
      - id: failed
        class: error
        caller_action: Correct unreadable source input or state-directory access and retry.
        effects: []
        outputs: []
      outputs:
      - id: report
        audience: machine
        cardinality:
          minimum: 1
          maximum: 1
        description: JSON setup report with durable input and version identity, requested
          and effective configuration, persisted internal timings, assignment boundaries
          and worker-owned paths, ordered assignable and structural-only coordinates,
          measured child dispatch/total timing, and publication timing only when atomic
          replacement occurred; it contains no source text or controller-only paths.
        direct_io_ref: write-2
        empty: Never empty on success.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          format:
            named: json
          sensitivity: derived-private
      preconditions: []
  math-dependency-graph._rtx.source.rtx-inventory-unit-iterator.interface.scripts-next-inventory-unit:
    version: 4
    description: Atomically lease one worker's next source unit or validate schema
      and source-span ownership before acknowledging its outstanding unit and returning
      the next unit or complete state.
    usage: <state-dir> <worker-index> [--ack <unit-id>] [--wrap] [--retry-code validation-failed]
    content:
    - _inventory_unit_iterator\.py
    uses_interfaces: []
    process_binding:
      kind: process
      entry: Interface
      args_prefix:
      - next
      patterns:
      - name: lease
        min_positionals: 2
        max_positionals: 2
        allow_stdin: false
        allowed_flags: []
        flag_patterns: {}
      - name: acknowledge
        min_positionals: 2
        max_positionals: 2
        allow_stdin: false
        allowed_flags:
        - --ack
        - --wrap
        - --retry-code
        required_flags:
        - --ack
        flag_patterns:
          --ack: ^u[0-9]{6}$
          --retry-code: ^validation-failed$
    contract:
      arguments:
        state-dir:
          description: Existing durable iterator state directory shared by the worker ranges.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
        worker-index:
          description: One-based assigned worker index.
          required: true
          sensitivity: public
          type:
            kind: integer
            minimum: 1
        ack:
          description: Outstanding unit ID to validate and acknowledge before advancement.
          required: false
          sensitivity: derived-private
          type:
            kind: string
            sensitivity: derived-private
        wrap:
          description: Close the consecutive attention sequence at the acknowledged unit.
          required: false
          sensitivity: public
          type:
            kind: boolean
            sensitivity: public
        retry-code:
          description: Controller-authorized validation retry for a corrected completed-worker artifact.
          required: false
          sensitivity: public
          type:
            kind: string
            sensitivity: public
      caller_warnings:
      - external-side-effect: A valid acknowledgement atomically updates shared iterator state after validating the worker inventory fragment.
      direct_io:
        network: []
        reads:
        - id: read-1
          medium: local-filesystem
          access: read
          content: Iterator SQLite state, assigned unit text, and the selected worker inventory fragment.
          formats:
          - sqlite
          - json
          path: <state-dir>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - id: write-1
          medium: local-filesystem
          access: write
          content: Atomically advanced iterator SQLite cursor and acknowledgement audit state.
          formats:
          - sqlite
          path: <state-dir>
          path_match: exact
          sensitivity: derived-private
          system: filesystem
        - id: write-2
          medium: stdout
          access: write
          content: JSON response with unit, complete, or structured failure state
            plus measured child dispatch and total timing.
          formats:
          - json
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: Each next call reads, validates, acknowledges, closes sequences, and leases under one SQLite transaction.
        effects:
        - id: iterator-advance
          action: update
          direct_io_ref: write-1
          may_occur_in_outcomes:
          - unit
          - complete
          value_source:
            kind: argument
            argument_ref: state-dir
          confirmation_evidence:
            kind: direct-io
            direct_io_ref: write-1
          reversibility:
            reversible: Durable acknowledgements are audit records; recovery requires a fresh matching iterator setup.
        lifecycle: finite
        mutation_safety:
          atomicity:
            atomic: Validation, acknowledgement, sequence update, and next lease commit together or leave state unchanged.
          concurrent_invocations:
            safe: SQLite serializes state changes while workers retain disjoint inventory fragments.
          idempotency:
            idempotent: Repeating a lease returns the outstanding unit, an exact latest acknowledgement retry returns its recorded response, and a consumed controller-authorized correction replays only while its replacement hash remains unchanged.
          on_uncertain_completion:
            verify_then_decide: Retry the same call and inspect the returned unit or complete state.
          partial_effects_on_failure:
            impossible: Rejected acknowledgements do not advance cursor or acknowledgement state.
          rollback_on_failure:
            available: SQLite rolls back an uncommitted transition automatically.
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
        - method: direct-io-state
          direct_io_ref: write-1
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - id: unit
        class: success
        caller_action: Inspect the returned unit and call next again with its ID after updating the worker fragment.
        effects:
        - iterator-advance
        outputs:
        - response
      - id: complete
        class: success
        caller_action: Do not issue further iterator calls for this worker.
        effects:
        - iterator-advance
        outputs:
        - response
      - id: rejected-acknowledgement
        class: refusal
        caller_action: Correct the worker-local inventory fragment or acknowledgement ID and retry without changing source order; a completed-worker correction requires the controller authorization created by its failed public pooling attempt.
        effects: []
        outputs:
        - response
      - id: failed
        class: error
        caller_action: Correct inaccessible iterator state and retry the same atomic operation.
        effects: []
        outputs:
        - response
      outputs:
      - id: response
        audience: machine
        cardinality:
          minimum: 1
          maximum: 1
        description: JSON object containing state and the leased unit or structured failure details.
        direct_io_ref: write-2
        empty: Never empty.
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          format:
            named: json
          sensitivity: derived-private
      preconditions: []
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies: []
