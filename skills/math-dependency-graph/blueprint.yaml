authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- SKILL\.md
- resources/graph-base\.json
- schemas/(?:inventory|semantic-graph|semantic-repair|proof-normalization)\.schema\.json
- instructions/(?:inventory|inventory-voyages|extract|proof-reconciliation)\.md
- references/(?:experimental-improvement|gold-standard-extraction)\.md
description: Extracts a direct dependency graph from a mathematical TeX or Markdown
  document and emits canonical graph JSON for the shared visualization layer.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - mathematical-reasoning
    - visualization
    - scholarly-documents
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  math-dependency-graph.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: math-dependency-graph.source.gateway.interface.default
  math-dependency-graph.interface.extract:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-extract.interface.extract
  math-dependency-graph.interface.inventory:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-inventory.interface.inventory
  math-dependency-graph.interface.inventory-voyages:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-inventory-voyages.interface.inventory-voyages
  math-dependency-graph.interface.proof-reconciliation:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-proof-reconciliation.interface.proof-reconciliation
gateway:
  language: Markdown
  path: SKILL.md
id: math-dependency-graph
namespace_exports:
  _rtx:
    version: 75
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        math-dependency-graph._rtx.interface.inventory-voyage-dispenser: 2
        math-dependency-graph._rtx.interface.scripts-apply-proof-digest: 1
        math-dependency-graph._rtx.interface.scripts-extract-inventory-chunks: 1
        math-dependency-graph._rtx.interface.scripts-pool-inventory-chunks: 1
        math-dependency-graph._rtx.interface.scripts-semantic-to-canonical-json: 1
    interface_access:
      math-dependency-graph._rtx.interface.inventory-voyage-dispenser:
        allow_all_modules: false
        allowed_callers: []
      math-dependency-graph._rtx.interface.scripts-apply-proof-digest:
        allow_all_modules: false
        allowed_callers: []
      math-dependency-graph._rtx.interface.scripts-extract-inventory-chunks:
        allow_all_modules: false
        allowed_callers: []
      math-dependency-graph._rtx.interface.scripts-pool-inventory-chunks:
        allow_all_modules: false
        allowed_callers: []
      math-dependency-graph._rtx.interface.scripts-semantic-to-canonical-json:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  math-dependency-graph.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  math-dependency-graph.source.instructions-extract:
    blueprint:
      base: module-root
      path: blueprints/instructions-extract.yaml
  math-dependency-graph.source.instructions-inventory:
    blueprint:
      base: module-root
      path: blueprints/instructions-inventory.yaml
  math-dependency-graph.source.instructions-inventory-voyages:
    blueprint:
      base: module-root
      path: blueprints/instructions-inventory-voyages.yaml
  math-dependency-graph.source.instructions-proof-reconciliation:
    blueprint:
      base: module-root
      path: blueprints/instructions-proof-reconciliation.yaml
version: 102
maturity: stable
installation_tier: core
personal_preference:
  applies: false
