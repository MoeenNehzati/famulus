authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|base\.json|inventory\.schema\.json|chunk-plan\.schema\.json|run-diagnostics\.schema\.json|semantic-(?:graph|repair)\.schema\.json|instructions/(?:inventory|extract)\.md|references/(?:experimental-improvement|gold-standard-extraction)\.md)
description: Extracts a direct dependency graph from mathematical LaTeX, renders canonical
  graph JSON as interactive HTML, and serves the result locally for inspection.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - mathematical-reasoning
    - visualization
    - scholarly-documents
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  math-dependency-graph.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: math-dependency-graph.source.gateway.interface.default
  math-dependency-graph.interface.extract:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-extract.interface.extract
  math-dependency-graph.interface.inventory:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-inventory.interface.inventory
gateway:
  language: Markdown
  path: SKILL.md
