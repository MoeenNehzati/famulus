authority:
  owns_filesystem: []
children:
  math-dependency-graph-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:SKILL\.md|instructions/extract\.md)
description: Extracts a direct dependency graph from mathematical LaTeX, renders canonical
  graph JSON as interactive HTML, and serves the result locally for inspection.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - mathematical-reasoning
    - visualization
    - scholarly-documents
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  math-dependency-graph.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: math-dependency-graph.source.gateway.interface.default
  math-dependency-graph.interface.extract:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-extract.interface.extract
  math-dependency-graph.interface.scripts-build-math-dependency-graph:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: math-dependency-graph-rtx.interface.scripts-build-math-dependency-graph
      version: 1
  math-dependency-graph.interface.scripts-extract-mathjax-macros:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: math-dependency-graph-rtx.interface.scripts-extract-mathjax-macros
      version: 1
  math-dependency-graph.interface.scripts-serve-graph:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: math-dependency-graph-rtx.interface.scripts-serve-graph
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: math-dependency-graph
namespace_exports: {}
node_type: module
schema_version: 5
sources:
  math-dependency-graph.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  math-dependency-graph.source.instructions-extract:
    blueprint:
      base: module-root
      path: blueprints/instructions-extract.yaml
version: 3
