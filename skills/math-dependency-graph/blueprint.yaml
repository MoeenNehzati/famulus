authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|instructions/extract\.md)
description: Extracts a direct dependency graph from mathematical LaTeX, renders canonical
  graph JSON as interactive HTML, and serves the result locally for inspection.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - mathematical-reasoning
    - visualization
    - scholarly-documents
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  math-dependency-graph.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: math-dependency-graph.source.gateway.interface.default
  math-dependency-graph.interface.extract:
    access:
      allow_all_modules: false
      allowed_callers:
      - math-dependency-graph
    source_interface: math-dependency-graph.source.instructions-extract.interface.extract
gateway:
  language: Markdown
  path: SKILL.md
id: math-dependency-graph
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        math-dependency-graph._rtx.interface.scripts-build-math-dependency-graph: 1
        math-dependency-graph._rtx.interface.scripts-extract-mathjax-macros: 1
        math-dependency-graph._rtx.interface.scripts-serve-graph: 1
    interface_access:
      math-dependency-graph._rtx.interface.scripts-build-math-dependency-graph:
        allow_all_modules: false
        allowed_callers: []
      math-dependency-graph._rtx.interface.scripts-extract-mathjax-macros:
        allow_all_modules: false
        allowed_callers: []
      math-dependency-graph._rtx.interface.scripts-serve-graph:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  math-dependency-graph.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  math-dependency-graph.source.instructions-extract:
    blueprint:
      base: module-root
      path: blueprints/instructions-extract.yaml
version: 3
