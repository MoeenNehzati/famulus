content:
- SKILL\.md
- test/test_biblatex\.bib
- test/test_modification\.bib
- test/test_modification\.tex
- test/test_multifile_main\.tex
- test/test_multifile_section\.tex
- test/test_natbib\.bib
- test/test_natbib_commands\.tex
dependencies: []
description: Directs conservative bibliography auditing, backend-specific validation,
  external metadata review, duplicate analysis, and approval-gated corrections.
gateway:
  language: Markdown
  path: SKILL.md
id: bib-audit.source.gateway
interfaces:
  bib-audit.source.gateway.interface.default:
    content:
    - SKILL\.md
    - test/test_biblatex\.bib
    - test/test_modification\.bib
    - test/test_modification\.tex
    - test/test_multifile_main\.tex
    - test/test_multifile_section\.tex
    - test/test_natbib\.bib
    - test/test_natbib_commands\.tex
    uses_interfaces:
    - interface: bib-audit._rtx.interface.scripts-bib-similarity
      version: 1
    - interface: bib-audit._rtx.interface.scripts-bib-validate-bibtex
      version: 1
    contract:
      arguments:
        request:
          description: Bibliography audit request with the required bibliography file
            and any optional project files or style preferences.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Approved transformations can rewrite bibliography entries
          and project citation commands; audit-only requests do not modify files.
      direct_io:
        network: []
        reads:
        - access: read
          content: bibliography-audit-request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: bibliography-audit-response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: The response reflects the bibliography and project context inspected
            during this run.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        channel: tty
        mode: interactive
        unattended_outcome: clarification-required
      outcomes:
      - caller_action: Present the report and its prioritized suggested actions.
        class: success
        effects: []
        id: audited
        outputs:
        - response
      - caller_action: Present the diff, change log, and any key or merge maps for
          the approved changes.
        class: success
        effects: []
        id: transformed
        outputs:
        - response
      - caller_action: Supply the missing backend, project context, or transformation
          approval.
        class: refusal
        effects: []
        id: clarification-required
        outputs:
        - response
      - caller_action: Report the failed validation or lookup without treating unverified
          entries as fabricated.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: human
        cardinality:
          maximum: 1
          minimum: 1
        description: Structured bibliography audit, clarification request, or approved-change
          report.
        direct_io_ref: write-1
        empty: Never empty.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Primary LLM-facing skill instructions.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- interface: bib-audit._rtx.interface.scripts-bib-similarity
  version: 1
- interface: bib-audit._rtx.interface.scripts-bib-validate-bibtex
  version: 1
version: 1
