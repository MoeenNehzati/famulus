authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - biber
      reason: Suggested approval for bibliography audit helpers.
    - command:
      - bibtex-check
      reason: Suggested approval for bibliography audit helpers.
    - command:
      - bibtex-update
      reason: Suggested approval for bibliography audit helpers.
    - args_prefix:
      - --caller-skill
      - bib-audit
      - bib-audit.machine.scripts-bib-similarity
      command:
      - dispatcher
      reason: Runs the local bib-audit duplicate/version candidate detector through
        the shared dispatcher runtime.
    - args_prefix:
      - --caller-skill
      - bib-audit
      - bib-audit.machine.scripts-bib-validate-bibtex
      command:
      - dispatcher
      reason: Runs the local bib-audit BibTeX/natbib validator through the shared
        dispatcher runtime.
    network: []
category: research-assistant
content:
- SKILL\.md
- _rtx/_reference_pairs\.py
- _rtx/_syntax_checker\.py
- test/test_biblatex\.bib
- test/test_modification\.bib
- test/test_modification\.tex
- test/test_multifile_main\.tex
- test/test_multifile_section\.tex
- test/test_natbib\.bib
- test/test_natbib_commands\.tex
description: Audits bibliography files for local validity, metadata conflicts, duplicate or version relationships, and explicitly approved project-aware corrections.
discovery:
  mechanism: skill
exports:
  bib-audit.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: bib-audit.source.gateway.interface.default
  bib-audit.interface.scripts-bib-similarity:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: bib-audit.source.rtx-reference-pairs.interface.scripts-bib-similarity
  bib-audit.interface.scripts-bib-validate-bibtex:
    access:
      allow_all_modules: false
      allowed_callers: []
    source_interface: bib-audit.source.rtx-syntax-checker.interface.scripts-bib-validate-bibtex
gateway:
  language: Markdown
  path: SKILL.md
id: bib-audit
kind: auditor
node_type: module
role: document-processing
schema_version: 4
sources:
  bib-audit.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  bib-audit.source.rtx-reference-pairs:
    blueprint:
      base: module-root
      path: blueprints/rtx-reference-pairs.yaml
  bib-audit.source.rtx-syntax-checker:
    blueprint:
      base: module-root
      path: blueprints/rtx-syntax-checker.yaml
version: 1
