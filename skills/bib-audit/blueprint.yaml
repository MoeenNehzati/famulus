authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|test/test_biblatex\.bib|test/test_modification\.bib|test/test_modification\.tex|test/test_multifile_main\.tex|test/test_multifile_section\.tex|test/test_natbib\.bib|test/test_natbib_commands\.tex)
description: Audits bibliography files for local validity, metadata conflicts, duplicate
  or version relationships, and explicitly approved project-aware corrections.
discovery:
  mechanism: skill
  catalog:
    domain: research
    topics:
    - scholarly-documents
    - research-writing
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  bib-audit.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: bib-audit.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: bib-audit
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: true
      allowed_callers: []
    surface:
      only:
        bib-audit._rtx.interface.scripts-bib-similarity: 1
        bib-audit._rtx.interface.scripts-bib-validate-bibtex: 1
    interface_access:
      bib-audit._rtx.interface.scripts-bib-similarity:
        allow_all_modules: false
        allowed_callers: []
      bib-audit._rtx.interface.scripts-bib-validate-bibtex:
        allow_all_modules: false
        allowed_callers: []
node_type: module
schema_version: 6
sources:
  bib-audit.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
maturity: stable
installation_tier: core
personal_preference:
  applies: false
