authority:
  owns_filesystem: []
category: research-assistant
children:
  bib-audit-rtx:
    base: module-root
    path: _rtx/blueprint.yaml
content:
- (?:SKILL\.md|test/test_biblatex\.bib|test/test_modification\.bib|test/test_modification\.tex|test/test_multifile_main\.tex|test/test_multifile_section\.tex|test/test_natbib\.bib|test/test_natbib_commands\.tex)
description: Audits bibliography files for local validity, metadata conflicts, duplicate
  or version relationships, and explicitly approved project-aware corrections.
discovery:
  mechanism: skill
exports:
  bib-audit.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: bib-audit.source.gateway.interface.default
  bib-audit.interface.scripts-bib-similarity:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: bib-audit-rtx.interface.scripts-bib-similarity
      version: 1
  bib-audit.interface.scripts-bib-validate-bibtex:
    access:
      allow_all_modules: false
      allowed_callers: []
    facade_interface:
      interface: bib-audit-rtx.interface.scripts-bib-validate-bibtex
      version: 1
gateway:
  language: Markdown
  path: SKILL.md
id: bib-audit
kind: auditor
namespace_exports: {}
node_type: module
role: document-processing
schema_version: 5
sources:
  bib-audit.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 2
