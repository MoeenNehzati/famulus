content:
- _reference_pairs\.py
dependencies: []
description: Parses bibliography entries and ranks every pair by shared identifiers
  and weighted title, author, year, and venue similarity.
gateway:
  language: Python
  path: _reference_pairs.py
id: bib-audit._rtx.source.rtx-reference-pairs
interfaces:
  bib-audit._rtx.source.rtx-reference-pairs.interface.scripts-bib-similarity:
    contract:
      arguments:
        bibfile:
          description: BibTeX bibliography file whose entries are compared pairwise.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              description: BibTeX bibliography text.
              kind: string
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
        threshold:
          default: 0.3
          description: Minimum weighted similarity score included in the candidate
            list.
          required: false
          sensitivity: public
          type:
            kind: number
            maximum: 1
            minimum: 0
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: bibliography
          formats:
          - bibtex
          id: read-1
          medium: local-filesystem
          path: <bibfile>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: duplicate-candidate-report
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: derived-private
        - access: write
          content: diagnostic-report
          formats:
          - text
          id: write-2
          medium: stderr
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: All pair scores are derived from one read of the bibliography
            during this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: candidates
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Treat the ranked pairs as candidates for review, not automatic
          duplicate verdicts.
        class: success
        effects: []
        id: completed
        outputs:
        - candidates
        - diagnostic
      - caller_action: Report the parse or file-access failure and do not infer pair
          results.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: One JSON document containing entry count, threshold, and candidate
          pairs sorted by descending score.
        direct_io_ref: write-1
        empty: The JSON document is emitted even when its pairs array is empty.
        id: candidates
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: derived-private
      - audience: both
        cardinality:
          maximum: 1
          minimum: 0
        description: Caller-visible warning or error text written to stderr.
        direct_io_ref: write-2
        empty: No stderr is emitted on paths without diagnostics.
        id: diagnostic
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Detect duplicate and version-pair candidates in a .bib file by scoring
      all entry pairs.
    process_binding:
      entry: SimilarityInterface
      kind: process
      patterns:
      - allowed_flags:
        - --threshold
        flag_patterns:
          --threshold: ^.+$
        max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <file.bib> [--threshold 0.3]
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: bibtexparser
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses BibTeX entries more accurately than the fallback parser.
  version: any
schema_version: 6
uses_interfaces: []
version: 1
