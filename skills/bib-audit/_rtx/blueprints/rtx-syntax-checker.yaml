content:
- _syntax_checker\.py
dependencies: []
description: Parses a BibTeX or natbib bibliography and reports syntax, required-field,
  duplicate-key, and field-format issues without modifying the file.
gateway:
  language: Python
  path: _syntax_checker.py
id: bib-audit._rtx.source.rtx-syntax-checker
interfaces:
  bib-audit._rtx.source.rtx-syntax-checker.interface.scripts-bib-validate-bibtex:
    contract:
      arguments:
        bibfile:
          description: BibTeX or natbib bibliography file to validate.
          direct_io_ref: read-1
          required: true
          sensitivity: user-private
          type:
            access: read
            content_type:
              description: BibTeX bibliography text.
              kind: string
            kind: file
            must_exist: true
            relative_to: caller-cwd
            syntax: literal
      caller_warnings: []
      direct_io:
        network: []
        reads:
        - access: read
          content: bibliography
          formats:
          - bibtex
          id: read-1
          medium: local-filesystem
          path: <bibfile>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        writes:
        - access: write
          content: bibliography-validation-report
          formats:
          - json
          id: write-1
          medium: stdout
          sensitivity: derived-private
      execution:
        consistency:
          snapshot: The report is derived from the bibliography content read during
            this invocation.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: validation-report
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Read parse_errors before entries and report all ERROR and WARNING
          issues.
        class: success
        effects: []
        id: completed
        outputs:
        - validation-report
      - caller_action: Report the parse or file-access failure and do not claim validation
          succeeded.
        class: error
        effects: []
        id: failed
        outputs: []
      outputs:
      - audience: machine
        cardinality:
          maximum: 1
          minimum: 1
        description: One JSON document with parse errors, per-entry issues, and ERROR,
          WARNING, and INFO counts.
        direct_io_ref: write-1
        empty: A JSON report is emitted even when the bibliography has no issues.
        id: validation-report
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          format:
            named: json
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Validate a BibTeX/natbib .bib file for syntax errors and missing
      required fields (not for biblatex projects).
    process_binding:
      entry: ValidateBibtexInterface
      kind: process
      patterns:
      - max_positionals: 1
        min_positionals: 1
        name: owner
    usage: <file.bib>
    version: 1
node_type: behavioral_source
platform_support:
  linux: true
  macos: true
  windows: true
runtime_dependencies:
- kind: python-package
  name: bibtexparser
  platforms:
    linux: true
    macos: true
    windows: true
  reason: Parses BibTeX entries more accurately than the fallback parser.
  version: any
schema_version: 6
uses_interfaces: []
version: 1
