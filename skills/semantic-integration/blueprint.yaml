authority:
  owns_filesystem: []
  suggested_permissions:
    bash: []
    network: []
children: {}
content:
- (?:SKILL\.md|references/git/run\-ledger\-template\.md)
description: Handles complicated, high-divergence Git integrations by reconstructing
  and auditing source intent against the target's current architecture; ordinary
  conflict-free merges and rebases remain normal Git operations.
discovery:
  mechanism: skill
  catalog:
    domain: software-development
    topics:
    - repository-workflow
    visibility: featured
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  semantic-integration.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: semantic-integration.source.gateway.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: semantic-integration
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  semantic-integration.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
version: 1
maturity: stable
installation_tier: core
personal_preference:
  applies: false
