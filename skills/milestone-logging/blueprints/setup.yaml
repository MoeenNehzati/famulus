content: [setup\.md]
dependencies:
- blueprint: {base: repository-root, path: src/officina/common/blueprints/famulus-paths-get.yaml}
  reason: Resolve the sole logging directory that setup may create.
  source: common.source.famulus-paths-get
  version: 1
description: Creates the getter-projected milestone logging directory without using MCP readiness state.
gateway: {language: Markdown, path: setup.md}
id: milestone-logging.source.setup
interfaces:
  milestone-logging.source.setup.interface.default:
    content: [setup\.md]
    uses_interfaces:
    - {interface: common.interface.famulus-paths-get, version: 1}
    contract:
      arguments: {}
      caller_warnings:
      - external-side-effect: Creates the getter-projected logging directory and missing parents while retaining existing contents.
      direct_io:
        network: []
        reads: []
        writes:
        - access: write
          content: getter-projected logging directory and missing parents
          formats: [directory]
          id: logging-directory
          medium: local-filesystem
          path: <getter-projected-logging-path>
          path_match: exact
          sensitivity: user-private
          system: filesystem
        - {access: write, content: setup result, formats: [markdown], id: response-write, medium: prompt, sensitivity: derived-private, system: agent-runtime}
      execution:
        consistency: {live: The result reflects directory creation attempted during this invocation.}
        effects:
        - action: create
          confirmation_evidence: {kind: direct-io, direct_io_ref: logging-directory}
          direct_io_ref: logging-directory
          id: logging-directory-created
          may_occur_in_outcomes: [completed, failed]
          reversibility: {compensatable: Teardown intentionally retains the logging directory and records; removal requires a separately authorized retention action.}
          value_source: {kind: direct-io, direct_io_ref: logging-directory}
        lifecycle: finite
        mutation_safety:
          atomicity: {per_effect_only: Each missing directory component may be created separately.}
          concurrent_invocations: {safe: Idempotent directory creation tolerates cooperating concurrent calls.}
          idempotency: {idempotent: Repeating setup preserves existing contents and accepts an existing directory.}
          on_uncertain_completion: {verify_then_decide: Invoke the declared setup verifier before retrying.}
          partial_effects_on_failure: {possible: Some missing parent directories may exist after a later creation failure.}
          rollback_on_failure: {unavailable: Created directories and existing records are retained.}
        state_effect: mutating
        verification: [{method: direct-io-state, direct_io_ref: logging-directory}, {method: output-schema, output_ref: response}]
      helpers: []
      interaction: {mode: unattended}
      outcomes:
      - {id: completed, class: success, outputs: [response], effects: [logging-directory-created], caller_action: Proceed to the independent setup verifier.}
      - id: failed
        class: error
        outputs: [response]
        effects: [logging-directory-created]
        caller_action: Resolve the getter failure or directory-creation error, then verify before retrying.
      outputs:
      - id: response
        audience: human
        description: The completed setup result or bounded failure.
        direct_io_ref: response-write
        cardinality: {minimum: 1, maximum: 1}
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        empty: Never empty.
        type: {kind: string, sensitivity: derived-private}
      preconditions: []
    description: Idempotently create only the getter-projected milestone logging directory.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- {interface: common.interface.famulus-paths-get, version: 1}
version: 1
maturity: stable
