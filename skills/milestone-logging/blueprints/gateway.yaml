content:
- SKILL\.md
dependencies: []
description: Defines the LLM-facing protocol for recording durable agent milestones and reading timeline diagnostics.
gateway:
  language: Markdown
  path: SKILL.md
id: milestone-logging.source.gateway
interfaces:
  milestone-logging.source.gateway.interface.default:
    content:
    - SKILL\.md
    uses_interfaces:
    - &record_progress {interface: milestone-logging._rtx.interface.record-progress, version: 1}
    - &record_completion {interface: milestone-logging._rtx.interface.record-completion, version: 1}
    - &session_path {interface: milestone-logging._rtx.interface.session-path, version: 1}
    - &run_path {interface: milestone-logging._rtx.interface.run-path, version: 1}
    - &list_sessions {interface: milestone-logging._rtx.interface.list-sessions, version: 1}
    - &show_latest {interface: milestone-logging._rtx.interface.show-latest-session, version: 1}
    - &show_session {interface: milestone-logging._rtx.interface.show-session, version: 1}
    - &show_run {interface: milestone-logging._rtx.interface.show-run, version: 1}
    - &read_run_json {interface: milestone-logging._rtx.interface.read-run-json, version: 1}
    contract:
      arguments:
        request:
          description: Request to record or inspect agent milestone progress.
          required: true
          sensitivity: user-private
          type:
            kind: string
            sensitivity: user-private
      caller_warnings:
      - external-side-effect: Recording appends a durable local progress record.
      direct_io:
        network: []
        reads:
        - access: read
          content: request
          formats:
          - text
          id: read-1
          medium: prompt
          sensitivity: user-private
        writes:
        - access: write
          content: response
          formats:
          - markdown
          id: write-1
          medium: prompt
          sensitivity: derived-private
      execution:
        consistency:
          live: The response reflects records observed or appended during this invocation.
        effects:
        - {action: append, confirmation_evidence: {kind: output, output_ref: response}, direct_io_ref: write-1, id: append-milestone, may_occur_in_outcomes: [completed, failed], reversibility: {irreversible: Appended progress records are intentionally retained.}, value_source: {kind: argument, argument_ref: request}}
        lifecycle: finite
        mutation_safety: {atomicity: {non_atomic: Session and optional run-journal appends are separate writes.}, concurrent_invocations: {safe: Each record is one bounded append write per target.}, idempotency: {non_idempotent: Repeating a record request can append another event.}, on_uncertain_completion: {stop: Inspect the selected log before deciding whether to append again.}, partial_effects_on_failure: {possible: A session append can precede a run-journal failure.}, rollback_on_failure: {unavailable: Appended records are retained.}}
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: response
      helpers: []
      interaction:
        mode: unattended
      outcomes:
      - caller_action: Use the resulting record or diagnostic output.
        class: success
        effects: [append-milestone]
        id: completed
        outputs:
        - response
      - caller_action: Report the exact logging or reading failure and continue the task.
        class: error
        effects: [append-milestone]
        id: failed
        outputs:
        - response
      outputs:
      - audience: both
        cardinality:
          maximum: 1
          minimum: 1
        description: Logging protocol guidance or the selected diagnostic result.
        direct_io_ref: write-1
        empty: The interface always returns a response.
        id: response
        ordering: stable
        pagination:
          kind: none
        truncation:
          kind: none
        type:
          kind: string
          sensitivity: derived-private
      preconditions: []
    description: Append a role-labelled milestone through an explicit record interface or read records through an explicit path, list, session, or run interface.
    version: 1
node_type: behavioral_source
schema_version: 6
uses_interfaces:
- *record_progress
- *record_completion
- *session_path
- *run_path
- *list_sessions
- *show_latest
- *show_session
- *show_run
- *read_run_json
version: 1
maturity: stable
