authority:
  owns_filesystem: []
children:
  _rtx: {}
content:
- (?:SKILL\.md|setup\.md|teardown\.md)
description: Owns durable agent-progress logging instructions and the compatible writer and timeline interfaces.
discovery:
  mechanism: skill
  catalog:
    domain: assistant-operations
    topics:
    - task-automation
    - assistant-assurance
    visibility: listed
  activated_by:
  - user-request
  - skill-workflow
  persistent_modifier: false
exports:
  milestone-logging.interface.default:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: milestone-logging.source.gateway.interface.default
  milestone-logging.interface.setup:
    access:
      allow_all_modules: true
      allowed_callers: []
    setup_requires_setup_of: []
    setup_management:
      setup_verifier:
        interface: milestone-logging._rtx.interface.setup-status
        version: 1
      teardown:
        interface: milestone-logging.interface.teardown
        version: 1
        verifier:
          interface: milestone-logging._rtx.interface.teardown-status
          version: 1
    source_interface: milestone-logging.source.setup.interface.default
  milestone-logging.interface.teardown:
    access:
      allow_all_modules: true
      allowed_callers: []
    source_interface: milestone-logging.source.teardown.interface.default
gateway:
  language: Markdown
  path: SKILL.md
id: milestone-logging
namespace_exports:
  _rtx:
    version: 1
    access:
      allow_all_modules: false
      allowed_callers:
      - milestone-logging
      - setup-interface-manager._rtx
    surface:
      only:
        milestone-logging._rtx.interface.record: 1
        milestone-logging._rtx.interface.setup-status: 1
        milestone-logging._rtx.interface.teardown-status: 1
        milestone-logging._rtx.interface.timeline: 1
    interface_access:
      milestone-logging._rtx.interface.record:
        allow_all_modules: false
        allowed_callers:
        - milestone-logging
      milestone-logging._rtx.interface.timeline:
        allow_all_modules: false
        allowed_callers:
        - milestone-logging
      milestone-logging._rtx.interface.setup-status:
        allow_all_modules: false
        allowed_callers:
        - milestone-logging
        - setup-interface-manager._rtx
      milestone-logging._rtx.interface.teardown-status:
        allow_all_modules: false
        allowed_callers:
        - milestone-logging
        - setup-interface-manager._rtx
node_type: module
schema_version: 6
sources:
  milestone-logging.source.gateway:
    blueprint:
      base: module-root
      path: blueprints/gateway.yaml
  milestone-logging.source.setup:
    blueprint:
      base: module-root
      path: blueprints/setup.yaml
  milestone-logging.source.teardown:
    blueprint:
      base: module-root
      path: blueprints/teardown.yaml
version: 1
maturity: stable
installation_tier: core
personal_preference:
  applies: false
