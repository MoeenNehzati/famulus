content:
- _timeline_interface\.py
- _agent_timeline\.py
dependencies:
- blueprint:
    base: module-root
    path: blueprints/rtx-milestone-writer.yaml
  reason: Reuses the writer-owned durable run-id validation rule when reading run journals.
  source: milestone-logging._rtx.source.rtx-milestone-writer
  version: 1
description: Reads milestone session logs and durable run journals into human or JSON timeline diagnostics.
gateway:
  language: Python
  path: _timeline_interface.py
id: milestone-logging._rtx.source.rtx-agent-timeline
interfaces:
  milestone-logging._rtx.source.rtx-agent-timeline.interface.show-latest-session:
    content: &content
    - _timeline_interface\.py
    - _agent_timeline\.py
    uses_interfaces: []
    contract: &timeline_contract
      arguments:
        slow: &slow
          description: Optional positive finite seconds threshold that adds slow-gap annotations only; omission adds none.
          required: false
          sensitivity: public
          type: {kind: number}
      caller_warnings: &warnings []
      direct_io: &timeline_io
        network: []
        reads:
        - &log_read
          access: read
          content: milestone logs and durable run journals
          formats: [jsonl]
          id: read-1
          medium: local-filesystem
          path: <selected-milestone-log-root>/**
          path_match: glob
          reason: A plugin MCP projects logging-path through ASSISTANT_LOGS;
            direct runs use a non-empty ASSISTANT_LOGS or $HOME/.assistant-logs.
          sensitivity: user-private
          system: filesystem
        - &claude_read
          access: read
          content: Claude project and subagent transcripts
          formats: [jsonl, json]
          id: read-2
          medium: home-filesystem
          path: $HOME/.claude/projects/**
          path_match: glob
          reason: Joins milestone intent with Claude tool-call timestamps when
            a matching session transcript exists.
          sensitivity: user-private
          system: filesystem
        - &codex_read
          access: read
          content: Codex session rollout transcripts
          formats: [jsonl]
          id: read-3
          medium: local-filesystem
          path: <selected-codex-home>/sessions/**
          path_match: glob
          reason: Uses CODEX_HOME when it is defined; otherwise uses $HOME/.codex,
            then joins matching rollouts with milestone intent.
          sensitivity: user-private
          system: filesystem
        - access: read
          content: Dispatcher timing spans
          formats: [json]
          id: read-4
          medium: local-filesystem
          path: <selected-milestone-log-root>/dispatch/**
          path_match: glob
          reason: Joins an exact trace_id returned in a Codex tool result.
          sensitivity: derived-private
          system: filesystem
        writes:
        - &stdout_write
          access: write
          content: timeline diagnostic
          formats: [text, json]
          id: write-1
          medium: stdout
          sensitivity: derived-private
          system: agent-runtime
      execution: &timeline_execution
        consistency:
          snapshot: The report is derived from logs observed while the command runs.
        lifecycle: finite
        state_effect: read-only
        verification:
        - method: output-schema
          output_ref: timeline
      helpers: &helpers []
      interaction: &interaction {mode: unattended}
      outcomes: &timeline_outcomes
      - caller_action: Use the listed session or rendered timeline diagnostic.
        class: success
        effects: []
        id: rendered
        outputs: [timeline]
      - caller_action: Report the exact unavailable or invalid-log diagnostic.
        class: error
        effects: []
        id: failed
        outputs: [timeline]
      outputs: &timeline_outputs
      - audience: both
        cardinality: {minimum: 0, maximum: 1}
        description: Timeline, session list, or durable-run reconstruction.
        direct_io_ref: write-1
        empty: Empty only when a successful session listing finds no records.
        id: timeline
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        type: {kind: string, sensitivity: derived-private}
      preconditions: &preconditions []
    description: Render the latest session and all retained typed metadata; optional slow adds annotations only.
    process_binding:
      entry: ShowLatestSession
      kind: process
      patterns:
      - name: show-latest-session
        min_positionals: 0
        max_positionals: 0
        allow_stdin: false
        notes: Omitting --slow adds no annotations; a positive finite value adds annotations without changing selection.
        allowed_flags: &slow_flags [--help, -h, --slow]
        flag_patterns: &slow_patterns
          --slow: '^(?=.*[1-9])(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)$'
    usage: '[--slow SECONDS]'
    version: 1
  milestone-logging._rtx.source.rtx-agent-timeline.interface.list-sessions:
    content: *content
    uses_interfaces: []
    contract: {arguments: {}, caller_warnings: *warnings, direct_io: &log_io {network: [], reads: [*log_read], writes: [*stdout_write]}, execution: *timeline_execution, helpers: *helpers, interaction: *interaction, outcomes: *timeline_outcomes, outputs: *timeline_outputs, preconditions: *preconditions}
    description: List known milestone sessions and label counts as log files.
    process_binding: {entry: ListSessions, kind: process, patterns: [{name: list-sessions, min_positionals: 0, max_positionals: 0, allow_stdin: false}]}
    usage: ''
    version: 1
  milestone-logging._rtx.source.rtx-agent-timeline.interface.show-session:
    content: *content
    uses_interfaces: []
    contract: {arguments: {session: &session {description: Exact session identifier to render., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}, slow: *slow}, caller_warnings: *warnings, direct_io: *timeline_io, execution: *timeline_execution, helpers: *helpers, interaction: *interaction, outcomes: *timeline_outcomes, outputs: *timeline_outputs, preconditions: *preconditions}
    description: Render one exact session and retained typed metadata; optional slow adds annotations only.
    process_binding: {entry: ShowSession, kind: process, patterns: [{name: show-session, min_positionals: 1, max_positionals: 1, allow_stdin: false, allowed_flags: *slow_flags, flag_patterns: *slow_patterns}]}
    usage: 'SESSION [--slow SECONDS]'
    version: 1
  milestone-logging._rtx.source.rtx-agent-timeline.interface.show-run:
    content: *content
    uses_interfaces: []
    contract: {arguments: {run: &run {description: Safe durable run identifier to reconstruct., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}}, caller_warnings: *warnings, direct_io: *log_io, execution: *timeline_execution, helpers: *helpers, interaction: *interaction, outcomes: *timeline_outcomes, outputs: *timeline_outputs, preconditions: *preconditions}
    description: Render one durable run as text with all retained typed metadata.
    process_binding: {entry: ShowRun, kind: process, patterns: [{name: show-run, min_positionals: 1, max_positionals: 1, allow_stdin: false, positional_patterns: {'0': '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}}]}
    usage: RUN
    version: 1
  milestone-logging._rtx.source.rtx-agent-timeline.interface.read-run-json:
    content: *content
    uses_interfaces: []
    contract: {arguments: {run: *run}, caller_warnings: *warnings, direct_io: *log_io, execution: *timeline_execution, helpers: *helpers, interaction: *interaction, outcomes: *timeline_outcomes, outputs: *timeline_outputs, preconditions: *preconditions}
    description: Return one durable run as structured JSON with all retained typed metadata.
    process_binding: {entry: ReadRunJson, kind: process, patterns: [{name: read-run-json, min_positionals: 1, max_positionals: 1, allow_stdin: false, positional_patterns: {'0': '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}}]}
    usage: RUN
    version: 1
node_type: behavioral_source
platform_support: {linux: true, macos: true, windows: true}
runtime_dependencies: []
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
