content:
- _milestone_interface\.py
- _milestone_writer\.py
dependencies: []
description: Appends one role-labelled session milestone and optionally mirrors it into a durable run journal.
gateway:
  language: Python
  path: _milestone_interface.py
id: milestone-logging._rtx.source.rtx-milestone-writer
interfaces:
  milestone-logging._rtx.source.rtx-milestone-writer.interface.record-progress:
    content: &content
    - _milestone_interface\.py
    - _milestone_writer\.py
    uses_interfaces: []
    contract: &record_contract
      arguments:
        doing:
          description: Work now starting; independently limited to 220 serialized JSON bytes.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        prev:
          default: ''
          description: How preceding work ended; independently limited to 220 serialized JSON bytes.
          required: false
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        role: &role
          description: Non-empty agent task label; independently limited to 220 serialized JSON bytes.
          required: true
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        run: &run
          description: Optional safe run ID; adds identity fields and an identical journal mirror without changing session metadata.
          required: false
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        event: &event
          default: ''
          description: Session-retained typed event with an independent 80-byte serialized JSON limit.
          required: false
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        step: &step
          description: Session-retained non-negative typed step with independent validation.
          required: false
          sensitivity: public
          type: {kind: integer}
        task: &task
          default: ''
          description: Session-retained typed task with an independent 128-byte serialized JSON limit.
          required: false
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        state: &state
          default: ''
          description: Session-retained typed state with an independent 64-byte serialized JSON limit.
          required: false
          sensitivity: user-private
          type: {kind: string, sensitivity: user-private}
        attempt: &attempt
          description: Session-retained non-negative typed attempt with independent validation.
          required: false
          sensitivity: public
          type: {kind: integer}
        evidence: &evidence
          default: []
          description: Session-retained evidence; at most 20 independent 220-byte values and 1400 serialized JSON bytes in aggregate.
          required: false
          sensitivity: user-private
          type:
            kind: list
            element_type: {kind: string, sensitivity: user-private}
      caller_warnings: &warnings
      - external-side-effect: Appends a durable local milestone record.
      direct_io: &record_io
        network: []
        reads: []
        writes:
        -
          access: write
          content: milestone record
          formats: [jsonl]
          id: write-1
          medium: local-filesystem
          path: <selected-milestone-log-root>/**
          path_match: glob
          reason: A plugin MCP projects logging-path through ASSISTANT_LOGS;
            direct runs use a non-empty ASSISTANT_LOGS or $HOME/.assistant-logs.
          sensitivity: user-private
          system: filesystem
        - &stdout_write
          access: write
          content: record path or error
          formats: [text]
          id: write-2
          medium: stdout
          sensitivity: derived-private
          system: agent-runtime
      execution: &record_execution
        consistency:
          live: Appends each accepted record to the selected current log root.
        effects:
        - action: append
          confirmation_evidence:
            direct_io_ref: write-1
            kind: direct-io
          direct_io_ref: write-1
          id: append-milestone
          may_occur_in_outcomes: [recorded, failed]
          reversibility:
            irreversible: Appended progress records are intentionally retained.
          value_source: {direct_io_ref: write-1, kind: direct-io}
        lifecycle: finite
        mutation_safety:
          atomicity: {non_atomic: Session and run-journal appends are separate writes.}
          concurrent_invocations: {safe: Each record is one bounded append write per target.}
          idempotency: {non_idempotent: Repeating a record appends another event.}
          on_uncertain_completion: {stop: Inspect the selected log before deciding whether to append again.}
          partial_effects_on_failure: {possible: A session append can succeed before the matching run-journal append fails.}
          rollback_on_failure: {unavailable: Appended progress records are intentionally retained.}
        state_effect: mutating
        verification:
        - method: output-schema
          output_ref: record-path
      helpers: &helpers []
      interaction: &interaction {mode: unattended}
      outcomes: &record_outcomes
      - caller_action: Continue after the record is appended.
        class: success
        effects: [append-milestone]
        id: recorded
        outputs: [record-path]
      - caller_action: Report the exact write or argument error once and continue without fabricating a record.
        class: error
        effects: [append-milestone]
        id: failed
        outputs: [record-path]
      outputs: &record_outputs
      - audience: both
        cardinality: {minimum: 0, maximum: 1}
        description: Empty after append success or one error diagnostic.
        direct_io_ref: write-2
        empty: Empty after a successful append.
        id: record-path
        ordering: stable
        pagination: {kind: none}
        truncation: {kind: none}
        type: {kind: string, sensitivity: derived-private}
      preconditions: &preconditions []
    description: Append progress with typed metadata retained in the session; run only adds identity fields and an identical journal mirror.
    process_binding:
      entry: RecordProgress
      kind: process
      patterns:
      - name: record-progress
        min_positionals: 1
        max_positionals: 2
        allow_stdin: false
        notes: Every metadata field is independently validated and remains in the session record; --run only adds a mirror.
        required_flags: [--role]
        allowed_flags: &record_flags [--help, -h, --role, --run, --event, --step, --task, --state, --attempt, --evidence]
        flag_patterns: &record_patterns
          --role: '(?s).+'
          --run: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          --event: '(?s).*'
          --step: '^[0-9]+$'
          --task: '(?s).*'
          --state: '(?s).*'
          --attempt: '^[0-9]+$'
          --evidence: '(?s).*'
    usage: 'DOING [PREV] --role ROLE [--run ID] [--event EVENT] [--step STEP] [--task TASK] [--state STATE] [--attempt ATTEMPT] [--evidence PATH]'
    version: 1
  milestone-logging._rtx.source.rtx-milestone-writer.interface.record-completion:
    content: *content
    uses_interfaces: []
    contract:
      arguments: {result: {description: Closing result independently limited to 220 serialized JSON bytes., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}, role: *role, run: *run, event: *event, step: *step, task: *task, state: *state, attempt: *attempt, evidence: *evidence}
      caller_warnings: *warnings
      direct_io: *record_io
      execution: *record_execution
      helpers: *helpers
      interaction: *interaction
      outcomes: *record_outcomes
      outputs: *record_outputs
      preconditions: *preconditions
    description: Append completion with session-retained typed metadata and an optional additive run mirror.
    process_binding: {entry: RecordCompletion, kind: process, patterns: [{name: record-completion, min_positionals: 1, max_positionals: 1, allow_stdin: false, required_flags: [--role], allowed_flags: *record_flags, flag_patterns: *record_patterns}]}
    usage: 'RESULT --role ROLE [--run ID] [--event EVENT] [--step STEP] [--task TASK] [--state STATE] [--attempt ATTEMPT] [--evidence PATH]'
    version: 1
  milestone-logging._rtx.source.rtx-milestone-writer.interface.session-path:
    content: *content
    uses_interfaces: []
    contract: {arguments: {}, caller_warnings: &path_warnings [], direct_io: &path_io {network: [], reads: [], writes: [*stdout_write]}, execution: &path_execution {consistency: {live: Reports the selected path.}, lifecycle: finite, state_effect: read-only, verification: [{method: output-schema, output_ref: path}]}, helpers: *helpers, interaction: *interaction, outcomes: &path_outcomes [{caller_action: Use the path., class: success, effects: [], id: reported, outputs: [path]}, {caller_action: Report the exact path error., class: error, effects: [], id: failed, outputs: [path]}], outputs: &path_outputs [{audience: both, cardinality: {minimum: 1, maximum: 1}, description: Selected milestone path., direct_io_ref: write-2, empty: Never empty., id: path, ordering: stable, pagination: {kind: none}, truncation: {kind: none}, type: {kind: string, sensitivity: derived-private}}], preconditions: *preconditions}
    description: Print the selected session path without appending.
    process_binding: {entry: SessionPath, kind: process, patterns: [{name: session-path, min_positionals: 0, max_positionals: 0, allow_stdin: false}]}
    usage: ''
    version: 1
  milestone-logging._rtx.source.rtx-milestone-writer.interface.run-path:
    content: *content
    uses_interfaces: []
    contract: {arguments: {run: {description: Safe durable run identifier to locate., required: true, sensitivity: user-private, type: {kind: string, sensitivity: user-private}}}, caller_warnings: *path_warnings, direct_io: *path_io, execution: *path_execution, helpers: *helpers, interaction: *interaction, outcomes: *path_outcomes, outputs: *path_outputs, preconditions: *preconditions}
    description: Validate a run identifier and print its journal path without appending.
    process_binding: {entry: RunPath, kind: process, patterns: [{name: run-path, min_positionals: 1, max_positionals: 1, allow_stdin: false, positional_patterns: {'0': '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}}]}
    usage: RUN
    version: 1
node_type: behavioral_source
platform_support: {linux: true, macos: true, windows: true}
runtime_dependencies: []
schema_version: 6
uses_interfaces: []
version: 1
maturity: stable
