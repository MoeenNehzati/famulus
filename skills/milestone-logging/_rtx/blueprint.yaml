authority:
  owns_filesystem: []
  suggested_permissions:
    bash:
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _milestone_interface.py
      - Interface
      reason: Append one durable role-labelled milestone record.
    - command:
      - python3
      - -m
      - officina.runtime.python_machine_interface_runner
      - _timeline_interface.py
      - Interface
      reason: Read recorded milestone sessions or durable run journals.
    network: []
children: {}
content:
- __init__\.py
- _milestone_interface\.py
- _milestone_writer\.py
- _timeline_interface\.py
- _agent_timeline\.py
- tests/.*
description: Private Python runtime for milestone records and agent timeline diagnostics.
exports:
  milestone-logging._rtx.interface.record:
    access:
      allow_all_modules: false
      allowed_callers:
      - milestone-logging
    source_interface: milestone-logging._rtx.source.rtx-milestone-writer.interface.record
  milestone-logging._rtx.interface.timeline:
    access:
      allow_all_modules: false
      allowed_callers:
      - milestone-logging
    source_interface: milestone-logging._rtx.source.rtx-agent-timeline.interface.timeline
gateway:
  language: Python>=3.11
  path: __init__.py
id: milestone-logging._rtx
namespace_exports: {}
node_type: module
schema_version: 6
sources:
  milestone-logging._rtx.source.rtx-milestone-writer:
    blueprint:
      base: module-root
      path: blueprints/rtx-milestone-writer.yaml
  milestone-logging._rtx.source.rtx-agent-timeline:
    blueprint:
      base: module-root
      path: blueprints/rtx-agent-timeline.yaml
version: 1
maturity: stable
