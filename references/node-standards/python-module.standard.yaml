standards:
- kind: family
  id: skill-guidelines.validator-test-conventions
  title: Validator and test conventions
  applies_when:
    fact: node.is-repository-validator
    equals: true
  children:
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-002
    statement: The repository check runner discovers repo-wide validators under `validators/` and
      skill-system validators under `validators/skill/`.
  - kind: rule
    id: skill-guidelines.validator-test-conventions.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: '`repo_checks.py` is the sole public execution path for repository validators. Hooks and
        certification select canonical validator IDs through that runner. Pytest collects validator items
        from the staged Git index mirror; validators must not independently enumerate the live worktree
        or index.'
      atomicity: pending
- kind: family
  id: skill-guidelines.adding-validator
  title: Adding a new validator
  applies_when:
    fact: node.is-repository-validator
    equals: true
  children:
  - kind: rule
    id: node-standards.add-validator.requirement
    assertions:
    - id: canonical-entrypoint
      modality: required
      statement: 'A repository validator exposes the canonical `validate(repo_root: Path) -> list[str]`
        entrypoint from an auto-discovered validator package.'
    - id: focused-tests
      modality: required
      statement: A repository validator has focused pass and fail tests using isolated repository state.
    - id: runner-discovery
      modality: required
      statement: The repository validator runner discovers the validator without manual registration.
  - kind: procedure
    id: node-standards.procedures.add-validator
    title: Add one repository validator
    ordered: true
    steps:
    - kind: step
      id: create-validator
      instruction: 'Create `validators/<name>.py` or `validators/skill/<name>.py` and export exactly
        `validate(repo_root: Path) -> list[str]`; add `main()` only for standalone use.'
    - kind: step
      id: add-focused-tests
      instruction: Add `tests/validate_<name>.py` with a pass case and a fail case using plain pytest
        functions and `tmp_path`; load the validator with `importlib.util.spec_from_file_location`.
      requires: [create-validator]
    - kind: step
      id: verify-discovery
      instruction: Run the repository validator runner and confirm automatic discovery without manual
        registration.
      requires: [add-focused-tests]
    invariants:
    - id: canonical-entrypoint
      statement: The validator exposes one canonical `validate` entrypoint through an allowed package.
    completion_conditions:
    - id: pass-and-fail-covered
      statement: Focused tests demonstrate both accepted and rejected input and runner discovery succeeds.
    risk:
      level: low
      statement: Incorrect placement or entrypoint shape prevents discovery.
artifacts:
  artifact.module-standard:
    path: references/node-standards/module.standard.yaml
    format: yaml
    roles:
    - other
  artifact.python-node-standard:
    path: references/node-standards/python-node.standard.yaml
    format: yaml
    roles:
    - other
domain_facts:
  node.present: true
  node.structure: module
  gateway.language: python
  node.skill-owned: true
links:
  validator-conventions-remedy: {source: {kind: family, ref: skill-guidelines.validator-test-conventions}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
  add-validator-procedure: {source: {kind: family, ref: skill-guidelines.adding-validator}, relation: remedied-by, target: {kind: procedure, ref: node-standards.procedures.add-validator}, lifecycle: active, resolution: {state: resolved}}
