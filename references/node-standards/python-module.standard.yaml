purpose: Add requirements specific to Python gateway modules.
imports:
  module:
    standard_id: node-standards.module
    standard_version: 2.0.0
    revision: 15
    digest: sha256:e46301f68e1002ad175ddc755e0b692bc4a3c8fb6ae9e225618b84edbb98e04c
    artifact:
      kind: artifact
      ref: artifact.module-standard
  python-node:
    standard_id: node-standards.python-node
    standard_version: 1.0.0
    revision: 19
    digest: sha256:2ebb7047c6f8fe7cf125f3d5260d3935f55b8d79a9fc6df82371b7a71a836b01
    artifact:
      kind: artifact
