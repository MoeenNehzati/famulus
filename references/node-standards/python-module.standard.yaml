standards:
- kind: family
  id: skill-guidelines.validator-test-conventions
  title: Validator and test conventions
  applies_when:
    fact: node.is-repository-validator
    equals: true
  children:
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-001
    statement: '## Validator and test conventions'
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-002
    statement: 'Mechanical repository checks run on every commit via `validators/runner.py` (called from

      `.githooks/pre-commit`). The runner auto-discovers two packages:'
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-003
    statement: '- **`validators/`** — repo-wide checks'
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-004
    statement: '- **`validators/skill/`** — skill-system checks'
  - kind: rule
    id: skill-guidelines.validator-test-conventions.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: '`validators/runner.py` is the sole execution path for repository validators. Hooks and
        certification select canonical validator IDs through that runner. The runner discovers and imports
        validators and their repository dependencies from the staged Git index mirror; validators must
        not independently enumerate the live worktree or index.'
      atomicity: pending
- kind: family
  id: skill-guidelines.adding-validator
  title: Adding a new validator
  applies_when:
    fact: node.is-repository-validator
    equals: true
  children:
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-001
    statement: '### Adding a new validator'
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-002
    statement: "1. Create `validators/<name>.py` or\n   `validators/skill/<name>.py`."
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-003
    statement: '2. Export exactly one function: `validate(repo_root: Path) -> list[str]`.'
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-004
    statement: 3. Optionally add a `main()` so it can be run standalone.
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-005
    statement: "4. Add a `tests/validate_<name>.py` with at least a pass case and a fail case.\n   Use\
      \ `pytest` conventions (plain functions, `tmp_path` fixture for\n   isolation). Load the validator\
      \ via `importlib.util.spec_from_file_location`\n   rather than importing it as a package."
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-006
    statement: The runner picks up the new file automatically — no registration needed.
