research_basis:
  python-ood:
    audited_on: 2026-08-03
    primary_sources:
    - url: https://docs.python.org/3/reference/datamodel.html
      coverage: descriptors, slots, weak references, inheritance, and special-method lookup
    - url: https://docs.python.org/3/howto/descriptor.html
      coverage: data and non-data descriptor precedence and attribute operations
    - url: https://docs.python.org/3/library/dataclasses.html
      coverage: generated methods, signatures, hashing, freezing, slots, weak references,
        pattern matching, and inheritance
    - url: https://docs.python.org/3/library/typing.html
      coverage: structural Protocols, runtime-checkable limitations, and nominal contracts
    - url: https://docs.python.org/3/library/unittest.mock.html#where-to-patch
      coverage: patching names where the system under test looks them up
    skill_baselines:
    - url: https://github.com/openai/skills/blob/main/skills/.system/skill-creator/SKILL.md
      adopted: Keep deterministic resolution in runtime code and keep the model-facing wrapper concise.
    - url: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
      adopted: Use progressive disclosure and move detailed reusable knowledge out of the gateway.
    search_outcome: No maintained specialized Python OOD refactoring skill was found that was
      authoritative enough to replace the Python documentation; public skills informed interface
      economy, while Python's documentation remained the technical authority.
