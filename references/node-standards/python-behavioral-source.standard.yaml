domain_facts:
  node.present: true
  node.structure: behavioral-source
  gateway.language: python
  node.skill-owned: true
checks:
  python-source.dispatcher-usage:
    artifact:
      kind: artifact
      ref: artifact.dispatcher-usage-validator
    selector:
      kind: python-symbol
      symbol: validate
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
  python-source.private-runtime-layout:
    artifact:
      kind: artifact
      ref: artifact.skill-runtime-files-validator
    selector:
      kind: python-symbol
      symbol: validate_with_graph
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
tests:
  python-source.dispatcher-usage-tests:
    artifact:
      kind: artifact
      ref: artifact.dispatcher-usage-tests
    selector:
      kind: pytest-node
      node_id: tests/validate_dispatcher_usage.py
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
    targets:
    - target:
        kind: check
        ref: python-source.dispatcher-usage
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises declared dispatch, prohibited raw dispatcher imports and CLI calls,
        sys.path workarounds, and registered-child test exceptions.
  python-source.private-runtime-layout-tests:
    artifact:
      kind: artifact
      ref: artifact.validate-skill-runtime-files-pytest-file
    selector:
      kind: pytest-node
      node_id: tests/validate_skill_runtime_files.py
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
    targets:
    - target:
        kind: check
        ref: python-source.private-runtime-layout
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises valid and invalid runtime stems, suffixes, locations, graph-owned
        artifacts, and case collisions.
assurances:
  python-source.no-raw-dispatch:
    assertion:
      kind: assertion
      ref: skill-guidelines.canonical-interface-names.requirement-003#source-block
    mechanism:
      kind: check
      ref: python-source.dispatcher-usage
    relation: enforces
    strength: full
    aspects:
    - dispatcher-import
    - dispatcher-cli
    - sys-path
    coverage_description: Rejects raw dispatcher imports, CLI subprocess calls, and sys.path workarounds
      in governed Python runtime code.
    lifecycle: active
    resolution:
      state: resolved
  python-source.runtime-implementation-location:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-001#runtime-implementation-location
    mechanism:
      kind: check
      ref: python-source.private-runtime-layout
    relation: enforces
    strength: partial
    aspects:
    - legacy-scripts-location
    coverage_description: Rejects Python runtime files placed in a legacy skill scripts directory.
    limitation: The check does not classify every arbitrary file outside `_rtx` as implementation; it
      detects allowed-suffix files under the legacy scripts location.
    lifecycle: active
    resolution:
      state: resolved
  python-source.private-runtime-layout:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-002#source-block
    mechanism:
      kind: check
      ref: python-source.private-runtime-layout
    relation: enforces
    strength: partial
    aspects:
    - runtime-stem
    coverage_description: Checks traversed non-exempt runtime files and directory components against the
      private multi-part naming rule.
    limitation: Empty directories are not traversed, and registered child artifacts are intentionally
      exempt under graph-aware classification.
    lifecycle: active
    resolution:
      state: resolved
  python-source.runtime-case-collision:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-004#case-collision
    mechanism: {kind: check, ref: python-source.private-runtime-layout}
    relation: enforces
    strength: partial
    aspects: [case-insensitive-collision]
    coverage_description: Rejects case-only collisions among traversed sibling runtime paths.
    limitation: Empty directories are not traversed.
    lifecycle: active
    resolution: {state: resolved}
  python-source.runtime-suffix:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-004#runtime-suffix
    mechanism: {kind: check, ref: python-source.private-runtime-layout}
    relation: enforces
    strength: full
    aspects: [runtime-suffix]
    coverage_description: Rejects non-exempt runtime implementation files outside the declared suffix list.
    lifecycle: active
    resolution: {state: resolved}
