standards:
- kind: family
  id: skill-guidelines.module-boundary
  title: A skill is a software module.
  children:
  - kind: guidance
    id: skill-guidelines.module-boundary.guidance-001
    statement: '# Skill Module Standards'
  - kind: guidance
    id: skill-guidelines.module-boundary.guidance-002
    statement: '**A skill is a software module.** The standards below define the module

      boundary: identity, interfaces, allowed dependencies, runtime ownership, and

      import discipline. They are structural requirements, not style preferences.'
- kind: family
  id: skill-guidelines.identity-contract
  title: 1. Skill identity and contract come first
  children:
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-001
    statement: '**1. Skill identity and contract come first** — every skill has a stable

      dash-separated name and declares its dependency and interface contract before

      workflow instructions.'
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'The skill directory name and frontmatter `name:` must match exactly. Skill names

        must be lower-case, dash-separated, and at least two words:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.identity-contract.example-001
    statement: '```text

      list-manager

      get-weather

      email-client

      ```'
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: Do not create one-word skill names such as `lists`, `weather`, or `email`.
      atomicity: pending
- kind: family
  id: skill-guidelines.injection-lifecycle
  title: Injection lifecycle
  children:
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-001
    statement: '**Injection lifecycle**'
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-002
    statement: '`../../skills/skill-maker/_rtx/_blueprint_syncer.py` injects and refreshes the

      generated artifacts for autodiscoverable modules:'
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-003
    statement: "- the generated contract block placed immediately after the YAML frontmatter in\n  `SKILL.md`"
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-004
    statement: "- the generated owner-facing interface sections placed immediately after the\n  contract\
      \ block"
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-005
    statement: "- repo-level manifests such as\n  `references/blueprint/runtime_dependencies.json`"
  - kind: rule
    id: skill-guidelines.injection-lifecycle.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'That generated content is not user-authored. Do not edit it by hand. These

        checks are enforced on every commit by `validators/runner.py` (called from

        `.githooks/pre-commit`) via the skill-maker validators.'
      atomicity: pending
- kind: family
  id: skill-guidelines.skill-taxonomy
  title: 2. Skill taxonomy
  children:
  - kind: rule
    id: skill-guidelines.skill-taxonomy.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: '**2. Skill catalog** — autodiscoverable parent modules declare

        `discovery.catalog`, `discovery.activated_by`, and `discovery.persistent_modifier`

        in `blueprint.yaml` using the configured fields in

        `references/blueprint/module.schema.json`. These fields provide user-facing

        discovery and documentation metadata; they do not grant authorization.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.skill-taxonomy.guidance-001
    applies_when:
      fact: node.catalog.domain
      equals: research
    statement: 'For research-domain skills applied to `.tex` files: check whether a

      top-of-document profile comment exists before proceeding; if not, use

      `make-tex-docstring` first.'
- kind: family
  id: skill-guidelines.personal-override-structure
  title: 3. `my-X` naming and structure
  applies_when:
    fact: node.is-personal-override
    equals: true
  children:
  - kind: rule
    id: skill-guidelines.personal-override-structure.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: '**3. `my-X` naming and structure** — a personal override of upstream skill `X`

        is named `my-X`. Every `my-X` skill must follow this layout:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.personal-override-structure.guidance-001
    statement: '- Personal overrides and additions at the top.'
  - kind: rule
    id: skill-guidelines.personal-override-structure.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: "- Then a **REQUIRED — NON-NEGOTIABLE** instruction to invoke the original `X`\n  skill\
        \ at the bottom."
      atomicity: pending
- kind: family
  id: skill-guidelines.trigger-description
  title: 5. Frontmatter `description:` is a trigger declaration, not a summary
  children:
  - kind: rule
    id: skill-guidelines.trigger-description.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: '**5. Frontmatter `description:` is a trigger declaration, not a summary** —

        write it as "Use when..." followed by the triggering conditions and symptoms

        that signal this skill applies. Never summarize the workflow, steps, or outputs

        in the description.'
      atomicity: pending
- kind: family
  id: skill-guidelines.change-publication-workflow
  title: 8. Commit and push after every skill change
  applies_when:
    fact: task.kind
    equals: publish-skill-change
  children:
  - kind: guidance
    id: skill-guidelines.change-publication-workflow.guidance-001
    statement: '**8. Commit and push after every skill change** — when a skill is created or

      modified and the result is complete, show the user the diff and ask for

      confirmation before committing. Once confirmed, stage the changed files,

      commit, and push to `origin`.'
- kind: procedure
  id: node-standards.remedies.migrate-instruction-module-identity
  title: Migrate an instruction module to a canonical identity
  ordered: true
  steps:
  - kind: step
    id: inventory-identity-consumers
    instruction: Inventory discovery metadata, directory and frontmatter names, registered child IDs,
      exports, namespace routes, caller allowlists, dependencies, generated views, and external callers.
  - kind: step
    id: choose-canonical-identity
    instruction: Determine the schema-valid lower-case dash-separated identity that matches the module's
      responsibility; stop if identity intent or external caller coverage is unknown.
    requires: [inventory-identity-consumers]
  - kind: step
    id: migrate-registration-and-contract
    instruction: Update the directory, module blueprint, frontmatter, child IDs, exports, routes, and exact
      caller or dependency references as one reviewed migration.
    requires: [choose-canonical-identity]
  - kind: step
    id: regenerate-and-verify-identity
    instruction: Regenerate derived views and run discovery, graph, dispatch, caller, and skill validators.
    requires: [migrate-registration-and-contract]
  invariants:
  - id: no-partial-public-rename
    statement: The old and new identities are never left split across canonical declarations and callers.
  completion_conditions:
  - id: one-discoverable-identity
    statement: Directory, frontmatter, graph identity, generated views, and authorized callers agree on
      the canonical module identity.
  risk:
    level: high
    statement: Public identity migration can break discovery, dispatch, dependencies, and external callers.
artifacts:
  artifact.module-standard:
    path: references/node-standards/module.standard.yaml
    format: yaml
    roles:
    - other
  artifact.instruction-node-standard:
    path: references/node-standards/instruction-node.standard.yaml
    format: yaml
    roles:
    - other
domain_facts:
  node.present: true
  node.structure: module
  gateway.language: markdown
  node.skill-owned: true
links:
  identity-remedy: {source: {kind: family, ref: skill-guidelines.identity-contract}, relation: remedied-by, target: {kind: procedure, ref: node-standards.remedies.migrate-instruction-module-identity}, lifecycle: active, resolution: {state: resolved}}
  injection-remedy: {source: {kind: family, ref: skill-guidelines.injection-lifecycle}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
  taxonomy-remedy: {source: {kind: family, ref: skill-guidelines.skill-taxonomy}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
  override-remedy: {source: {kind: family, ref: skill-guidelines.personal-override-structure}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
  trigger-remedy: {source: {kind: family, ref: skill-guidelines.trigger-description}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
