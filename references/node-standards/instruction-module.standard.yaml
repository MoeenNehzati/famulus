title: Instruction Module Standard
purpose: Add requirements specific to instruction-language gateway modules.
imports:
  refactoring:
    standard_id: node-standards.refactoring
    standard_version: 2.0.0
    revision: 7
    digest: sha256:755593fe48002bc32880cda05267086aa82ce4ccef292e4b9d5781f9f8af5af1
