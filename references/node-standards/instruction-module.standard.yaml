      kind: artifact
      ref: artifact.refactoring-standard
  module:
    standard_id: node-standards.module
    standard_version: 1.0.0
    revision: 15
    digest: sha256:c09c9832542dad3b02c1215ededb95272df0d542b713997add3b3cc6666886da
    artifact:
      kind: artifact
      ref: artifact.module-standard
  instruction-node:
    standard_id: node-standards.instruction-node
    standard_version: 1.0.0
    revision: 16
    digest: sha256:6f02166b1af1133ef940eead9d7e00a1020cf593d52eefd5d3a433a83111e3b0
    artifact:
      kind: artifact
      ref: artifact.instruction-node-standard
standards:
- kind: family
  id: skill-guidelines.identity-contract
  title: Skill identity and contract
  children:
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: The skill directory name and frontmatter `name:` must match exactly; skill names are
        lower-case, dash-separated, and contain at least two words.
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.identity-contract.example-001
    statement: '```text

      list-manager

      get-weather

      email-client

      ```'
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: Do not create one-word skill names such as `lists`, `weather`, or `email`.
      atomicity: pending
- kind: family
  id: skill-guidelines.injection-lifecycle
  title: Injection lifecycle
  children:
  - kind: rule
    id: skill-guidelines.injection-lifecycle.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Generated interface blocks and repository manifests are derived; do not edit them by
        hand.
      atomicity: pending
- kind: family
  id: skill-guidelines.skill-taxonomy
  title: Skill discovery catalog
  children:
  - kind: rule
    id: skill-guidelines.skill-taxonomy.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Autodiscoverable parent modules declare `discovery.catalog`, `discovery.activated_by`,
        and `discovery.persistent_modifier` in `blueprint.yaml`. These fields provide discovery metadata;
        they do not grant authorization.
      atomicity: pending
- kind: family
  id: skill-guidelines.personal-override-structure
  title: Personal override naming and structure
  applies_when:
    fact: node.is-personal-override
    equals: true
  children:
  - kind: rule
    id: skill-guidelines.personal-override-structure.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: A personal override of upstream skill `X` is named `my-X`.
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.personal-override-structure.guidance-001
    statement: '- Personal overrides and additions at the top.'
  - kind: rule
    id: skill-guidelines.personal-override-structure.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: A personal override ends with a required instruction to invoke the original `X` skill.
      atomicity: pending
- kind: family
  id: skill-guidelines.trigger-description
  title: Frontmatter description declares triggers
  children:
  - kind: rule
    id: skill-guidelines.trigger-description.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Start frontmatter `description:` with a standalone, sentence-terminated "Use when..."
        trigger summary suitable for the generated catalog; additional trigger detail may follow, but
        omit workflow steps and outputs.
      atomicity: pending
- kind: procedure
  id: node-standards.remedies.migrate-instruction-module-identity
  title: Migrate an instruction module to a canonical identity
  ordered: true
  steps:
  - kind: step
    id: inventory-identity-consumers
    instruction: Inventory discovery metadata, directory and frontmatter names, registered child IDs,
      exports, namespace routes, caller allowlists, dependencies, generated views, and external callers.
  - kind: step
    id: choose-canonical-identity
    instruction: Determine the schema-valid lower-case dash-separated identity that matches the module's
      responsibility; stop if identity intent or external caller coverage is unknown.
    requires: [inventory-identity-consumers]
  - kind: step
    id: migrate-registration-and-contract
    instruction: Update the directory, module blueprint, frontmatter, child IDs, exports, routes, and exact
      caller or dependency references as one reviewed migration.
    requires: [choose-canonical-identity]
  - kind: step
    id: regenerate-and-verify-identity
    instruction: Regenerate derived views and run discovery, graph, dispatch, caller, and skill validators.
    requires: [migrate-registration-and-contract]
  invariants:
  - id: no-partial-public-rename
    statement: The old and new identities are never left split across canonical declarations and callers.
  completion_conditions:
  - id: one-discoverable-identity
    statement: Directory, frontmatter, graph identity, generated views, and authorized callers agree on
      the canonical module identity.
  risk:
    level: high
    statement: Public identity migration can break discovery, dispatch, dependencies, and external callers.
artifacts:
  artifact.refactoring-standard:
    path: references/node-standards/refactoring.standard.yaml
    format: yaml
    roles:
    - other
  artifact.module-standard:
    path: references/node-standards/module.standard.yaml
    format: yaml
    roles:
    - other
  artifact.instruction-node-standard:
    path: references/node-standards/instruction-node.standard.yaml
    format: yaml
    roles:
    - other
  artifact.docs-catalog-tests:
    path: tests/test_docs_catalog.py
    format: python
    roles:
    - test
domain_facts:
  node.present: true
  node.structure: module
  gateway.language: markdown
  node.skill-owned: true
tests:
  instruction-module.catalog-summary-tests:
    artifact: {kind: artifact, ref: artifact.docs-catalog-tests}
    selector: {kind: pytest-node, node_id: tests/test_docs_catalog.py::test_multiline_description_uses_standalone_first_sentence_as_summary}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
    targets:
    - target: {kind: assertion, ref: skill-guidelines.trigger-description.requirement-001#source-block}
      relation: tests-behavior
      polarity: positive
      coverage_description: Exercises a multiline trigger description and verifies that generated catalog
        output uses only its standalone first sentence, excluding detailed triggers and exclusions.
  instruction-module.repository-catalog-summary-regression:
    artifact: {kind: artifact, ref: artifact.docs-catalog-tests}
    selector: {kind: pytest-node, node_id: tests/test_docs_catalog.py::test_repository_multiline_skill_summaries_remain_catalog_safe}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
    targets:
    - target: {kind: assertion, ref: skill-guidelines.trigger-description.requirement-001#source-block}
      relation: tests-behavior
      polarity: positive
      coverage_description: Locks the public summaries for representative multiline skill descriptions so
        removing their standalone first sentence reintroduces a failing flattened-list regression.
links:
  identity-remedy: {source: {kind: family, ref: skill-guidelines.identity-contract}, relation: remedied-by, target: {kind: procedure, ref: node-standards.remedies.migrate-instruction-module-identity}, lifecycle: active, resolution: {state: resolved}}
  injection-remedy: {source: {kind: family, ref: skill-guidelines.injection-lifecycle}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
  taxonomy-remedy: {source: {kind: family, ref: skill-guidelines.skill-taxonomy}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
  override-remedy: {source: {kind: family, ref: skill-guidelines.personal-override-structure}, relation: remedied-by, target: {kind: procedure, document: module, ref: node-standards.remedies.restore-local-module-conformance}, lifecycle: active, resolution: {state: resolved}}
  trigger-remedy: {source: {kind: family, ref: skill-guidelines.trigger-description}, relation: remedied-by, target: {kind: procedure, document: refactoring, ref: skill-refactoring.remedies.tighten-description}, lifecycle: active, resolution: {state: resolved}}
