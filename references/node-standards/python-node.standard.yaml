domain_facts:
  node.present: true
  gateway.language: python
  node.skill-owned: true
checks:
  python-node.toml-io-boundary:
    artifact: {kind: artifact, ref: artifact.toml-io-validator}
    selector: {kind: python-symbol, symbol: validate}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
  python-node.subprocess-text-encoding:
    artifact: {kind: artifact, ref: artifact.subprocess-text-validator}
    selector: {kind: python-symbol, symbol: validate}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
  python-node.portable-dates:
    artifact: {kind: artifact, ref: artifact.portable-dates-validator}
    selector: {kind: python-symbol, symbol: validate}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
  python-node.cross-platform:
    artifact: {kind: artifact, ref: artifact.cross-platform-validator}
    selector: {kind: python-symbol, symbol: validate_with_graph}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
tests:
  python-node.toml-io-boundary-tests:
    artifact: {kind: artifact, ref: artifact.toml-io-tests}
    selector: {kind: pytest-node, node_id: tests/validate_toml_io_boundary.py}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
    targets:
    - target: {kind: check, ref: python-node.toml-io-boundary}
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises direct and constructed TOML paths, literal filenames through
        `toml_io.open`, and shared-helper exemptions.
  python-node.subprocess-text-encoding-tests:
    artifact: {kind: artifact, ref: artifact.subprocess-text-tests}
    selector: {kind: pytest-node, node_id: tests/validate_subprocess_text_encoding.py}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
    targets:
    - target: {kind: check, ref: python-node.subprocess-text-encoding}
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises binary subprocess use and text calls with missing or explicit encoding
        and error policies.
  python-node.portable-dates-tests:
    artifact: {kind: artifact, ref: artifact.portable-dates-tests}
    selector: {kind: pytest-node, node_id: tests/validate_portable_dates.py}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
    targets:
    - target: {kind: check, ref: python-node.portable-dates}
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises portable date formatting and rejects GNU/POSIX-only and Windows-only
        padding modifiers.
  python-node.cross-platform-tests:
    artifact: {kind: artifact, ref: artifact.cross-platform-tests}
    selector: {kind: pytest-node, node_id: tests/validate_cross_platform.py}
    integration: {state: resolved, points: [precommit]}
    lifecycle: active
    resolution: {state: resolved}
    targets:
    - target: {kind: check, ref: python-node.cross-platform}
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises raw-Git annotations, platform-specific process use, registered-child
        artifacts, and live composite process targets.
assurances:
  python-node.toml-io-use:
    assertion: {kind: assertion, ref: skill-guidelines.toml-io-boundary.requirement-001#source-block}
    mechanism: {kind: check, ref: python-node.toml-io-boundary}
    relation: enforces
    strength: partial
    aspects: [direct-toml-io]
    coverage_description: Rejects direct TOML construction and IO patterns in governed production Python.
    limitation: The check recognizes enumerated syntax patterns and does not prove semantic absence of every
      dynamically constructed path.
    lifecycle: active
    resolution: {state: resolved}
  python-node.toml-filename-boundary:
    assertion: {kind: assertion, ref: skill-guidelines.toml-io-boundary.requirement-002#literal-filename-boundary}
    mechanism: {kind: check, ref: python-node.toml-io-boundary}
    relation: enforces
    strength: partial
    aspects: [literal-filename, direct-file-io]
    coverage_description: Accepts literal filenames passed directly to `toml_io.open` and rejects covered
      variable, concatenation, path, and direct-IO forms.
    limitation: Static syntax checks do not prove the behavior of arbitrary dynamic helpers.
    lifecycle: active
    resolution: {state: resolved}
  python-node.subprocess-text-encoding:
    assertion: {kind: assertion, ref: skill-guidelines.subprocess-text-boundaries.requirement-001#source-block}
    mechanism: {kind: check, ref: python-node.subprocess-text-encoding}
    relation: enforces
    strength: full
    aspects: [encoding, errors]
    coverage_description: Rejects text-mode subprocess calls that omit either explicit encoding or errors.
    lifecycle: active
    resolution: {state: resolved}
  python-node.portable-dates:
    assertion: {kind: assertion, ref: skill-guidelines.cross-platform-tools.requirement-003#source-block}
    mechanism: {kind: check, ref: python-node.portable-dates}
    relation: enforces
    strength: partial
    aspects: [strftime-padding]
    coverage_description: Rejects known host-specific strftime padding modifiers in governed Python code.
    limitation: The check does not enforce reuse of the shared date helper or evaluate dynamically assembled
      format strings.
    lifecycle: active
    resolution: {state: resolved}
  python-node.raw-git-annotation:
    assertion: {kind: assertion, ref: skill-guidelines.test-file-conventions.requirement-001#raw-git-annotation}
    mechanism: {kind: check, ref: python-node.cross-platform}
    relation: enforces
    strength: full
    aspects: [annotation-placement, category, reason]
    coverage_description: Requires a statement-local annotation with an allowed category and nonempty reason
      for covered raw Git calls.
    lifecycle: active
    resolution: {state: resolved}
  python-node.separate-process-target:
    assertion: {kind: assertion, ref: skill-guidelines.cross-platform-tools.requirement-004#separate-process-target}
    mechanism: {kind: check, ref: python-node.cross-platform}
    relation: enforces
    strength: partial
    aspects: [gateway-path, process-entry]
    coverage_description: Rejects live composite Python targets in blueprints, projections, and permission arrays.
    limitation: The check validates declared target shapes; it does not inspect every transient in-memory value.
    lifecycle: active
    resolution: {state: resolved}
  python-node.composite-target-migration-only:
    assertion: {kind: assertion, ref: skill-guidelines.cross-platform-tools.requirement-004#composite-target-migration-only}
    mechanism: {kind: check, ref: python-node.cross-platform}
    relation: enforces
    strength: full
    aspects: [live-target-prohibition, migration-input]
    coverage_description: Allows composite targets only through migration parsing and rejects live declarations.
    lifecycle: active
    resolution: {state: resolved}
