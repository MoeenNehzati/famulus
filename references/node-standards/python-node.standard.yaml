standards:
- kind: family
  id: skill-guidelines.import-discipline
  title: Import discipline
  children:
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-001
    statement: '**Import discipline**'
  - kind: rule
    id: skill-guidelines.import-discipline.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Skill Python files may import only:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-002
    statement: '- relative modules from their own skill-local `_rtx/` package'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-003
    statement: '- first-party shared packages under `src/officina/`'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-004
    statement: '- stdlib and approved third-party packages'
  - kind: rule
    id: skill-guidelines.import-discipline.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'They must not import:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-005
    statement: '- another skill''s Python modules directly'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-006
    statement: '- repo-maintainer packages outside `src/officina/`'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-007
    statement: "- another skill's runtime directory through `sys.path`, path loading, or\n  dynamic module\
      \ tricks"
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-008
    statement: 'This is the intended model:'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-009
    statement: '- local reuse inside one skill: relative imports'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-010
    statement: '- generic shared infrastructure: `officina.*`'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-011
    statement: "- cross-skill behavior: declared `DispatchCall` entries plus\n  `PythonMachineInterface.dispatch()`"
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-012
    statement: 'The dispatch discipline is mechanically checked by

      `validators/skill/dispatcher_usage.py`.'
  - kind: rule
    id: skill-guidelines.import-discipline.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Because Python behavioral-source gateways run with the module root on

        `PYTHONPATH`, files

        under `_rtx/` may use relative imports to share same-skill helpers. Nested

        runtime packages are allowed only when their directory names and file stems

        follow the cascading private `_rtx/` naming rule above.'
      atomicity: pending
- kind: family
  id: skill-guidelines.toml-io-boundary
  title: TOML IO boundary
  children:
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.guidance-001
    statement: '**TOML IO boundary**'
  - kind: rule
    id: skill-guidelines.toml-io-boundary.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Production Python code must not construct, read, write, or parse TOML files

        directly. TOML filenames are a controlled boundary because host-specific paths

        and TOML string escaping interact badly when callers hand-roll config text.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.guidance-002
    statement: 'Use the shared TOML IO boundary:'
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.example-001
    statement: "```python\nfrom officina.common import toml_io\n\nwith toml_io.open(base_dir, \"settings.toml\"\
      , \"r\") as f:\n    settings_text = f.read()\n\nwith toml_io.open(base_dir, f\"{name}.settings.toml\"\
      , \"w\") as f:\n    f.write(settings_text)\n```"
  - kind: rule
    id: skill-guidelines.toml-io-boundary.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Outside `src/officina/common/toml_io.py`, a `.toml` filename may appear only as

        the direct filename argument to `toml_io.open(...)`. Do not build TOML filenames

        through variables, concatenation, `Path(...)`, `/` path joins, `open(...)`,

        `.read_text(...)`, `.write_text(...)`, `tomllib`, or ad hoc regex/string

        rewrites. If a caller needs a reusable TOML filename or discovery rule, add a

        named helper under `src/officina/common/` and keep filename construction there.

        When the helper is specific to a host or platform, give the helper file a

        matching platform name and include `toml` in the filename, such as

        `codex_toml.py`, so both the TOML boundary and platform-neutral boundary stay

        explicit.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.guidance-003
    statement: '`toml_io.open(...)` owns UTF-8 text mode, filename validation, and parse

      validation after writes. This rule is enforced by

      `validators/toml_io_boundary.py`, with behavior tests in

      `tests/validate_toml_io_boundary.py`.'
- kind: family
  id: skill-guidelines.subprocess-text-boundaries
  title: Subprocess text boundaries
  children:
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.guidance-001
    statement: '**Subprocess text boundaries**'
  - kind: rule
    id: skill-guidelines.subprocess-text-boundaries.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Production Python code that asks `subprocess` for text must set both

        `encoding` and `errors` explicitly on that call. Binary subprocess use is fine

        when callers intentionally handle bytes themselves.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.guidance-002
    statement: 'Use UTF-8 strict for project-owned/user-facing text:'
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.example-001
    statement: "```python\nsubprocess.run(\n    cmd,\n    capture_output=True,\n    text=True,\n    encoding=\"\
      utf-8\",\n    errors=\"strict\",\n    check=False,\n)\n```"
  - kind: rule
    id: skill-guidelines.subprocess-text-boundaries.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'For byte streams whose contract is not ordinary text, keep binary mode and

        decode explicitly at the boundary with the correct error policy. For git

        path-list output, use UTF-8 with `surrogateescape` so unusual filenames remain

        round-trippable.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.guidance-003
    statement: 'The shared dispatcher owns this boundary for process-bound exports: text-mode

      dispatcher invocations use UTF-8 strict in the parent process, and Python module

      runtimes get `PYTHONIOENCODING=utf-8:strict` in the child environment. This is

      enforced by `validators/subprocess_text_encoding.py`, with behavior tests in

      `tests/test_officina_dispatcher.py` and

      `tests/validate_subprocess_text_encoding.py`.'
- kind: family
  id: skill-guidelines.test-file-conventions
  title: Test file conventions
  children:
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-001
    statement: '### Test file conventions'
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-002
    statement: '- Validator tests live in `tests/validate_<name>.py`.'
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-003
    statement: '- Behavior tests live in `skills/<skill-name>/tests/`.'
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-004
    statement: "- Use `importlib.util.spec_from_file_location` to load validators in tests —\n  avoids\
      \ package naming collisions and works regardless of working directory."
  - kind: rule
    id: skill-guidelines.test-file-conventions.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Ordinary Git-backed tests under `tests/**` and `skills/*/tests/**` use `test_support.git_repository.GitTestRepository`
        for deterministic identity, branch, line endings, file mode, and isolated Git execution. A test
        whose subject requires raw Git or direct `run_git` must annotate the immediately following AST
        statement with `# famulus-raw-git: category=<category>; reason=<nonempty reason>`, where category
        is one of `ambient-config`, `hooks`, `object-format`, `index-stages`, `validator-isolation`, or
        `run-git-contract`. This is mechanically checked by `validators/cross_platform.py`.'
      atomicity: pending
- kind: family
  id: node-standards.python-portability
  title: Python portability boundaries
  children:
  - kind: rule
    id: skill-guidelines.cross-platform-tools.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Shared code under `src/officina/common/` must be host-neutral by default. Put

        repo-wide policy there only when more than one skill can plausibly need the

        same boundary, and keep the surface thin: validation, naming, error

        normalization, and test seams are appropriate; product-specific behavior is

        not. Prefer a mature cross-platform adapter over per-host in-house

        implementations when the adapter delegates to the host facility. For example,

        `officina.common.secret_store` owns the repo contract for small local secrets

        and delegates storage to Python `keyring`; skills should call that wrapper

        instead of importing `keyring` directly or shelling out to host-specific

        credential commands.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.cross-platform-tools.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Date and time formatting at IO boundaries must avoid host-specific formatting

        extensions. In Python, do not use GNU/POSIX-only or Windows-only `strftime`

        padding modifiers such as `%-m`, `%-d`, `%#m`, or `%#d`. Put shared date/time

        storage and display formats in the first-party helpers under

        `officina.common.dates` instead of retyping ad hoc formatting logic in each

        skill. This is mechanically checked by `validators/portable_dates.py`.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.cross-platform-tools.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: Repository-relative path conversion must use `officina.common.repository_paths`; do not
        duplicate containment or equivalent-root logic. Python process targets must carry the `_rtx/*.py`
        gateway path and process-entry identifier as separate values through dispatch, tracing, runner
        arguments, and permission arrays. Composite `path.py:Entry` targets are migration input only.
        These boundaries are mechanically checked by `validators/cross_platform.py`.
      atomicity: pending
- kind: family
  id: node-standards.python-cross-module-boundaries
  title: Python cross-module boundaries
  children:
  - kind: rule
    id: skill-guidelines.system-evolution.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: "- **Do not introduce new cross-module Python imports.** If behavior should be\n  shared\
        \ across modules, expose it through a module gateway, module export, or a\n  first-party shared\
        \ package under `src/officina/`."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.system-evolution.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: '- **Do not reach into another skill''s runtime directory from local runtime code.**'
      atomicity: pending
  - kind: guidance
    id: node-standards.python-cross-module-boundaries.dispatch-call-guidance
    statement: Python behavioral sources may use a declared DispatchCall through PythonMachineInterface.dispatch().
- kind: family
  id: node-standards.python-platform-neutrality
  title: Python platform neutrality
  children:
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-002
    assertions:
    - id: generic-runtime-file-neutrality
      modality: required
      statement: A generically named runtime file must not name a specific assistant host or operating
        system.
  - kind: guidance
    id: skill-guidelines.assistant-neutrality.guidance-001
    statement: "- If a skill or shared package genuinely needs platform-specific logic, put\n  that logic\
      \ in a file whose own filename names the platform, such as\n  `claude`, `codex`, `windows`, `osx`,\
      \ or `linux`."
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-005
    assertions:
    - id: source-block
      modality: required
      statement: "- A small cross-platform adapter may temporarily dispatch to platform-specific\n  commands\
        \ while a backend split is pending, but new platform-specific command\n  bodies should live in\
        \ platform-named files."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-006
    assertions:
    - id: source-block
      modality: required
      statement: "- `__init__.py` remains the conventional aggregation seam for\n  platform-specific modules.\
        \ It may import platform-named files and re-export\n  a host-neutral API for the rest of the codebase."
      atomicity: pending
- kind: procedure
  id: node-standards.remedies.replace-cross-module-python-dependency
  title: Replace a cross-module Python dependency with an authorized interface
  ordered: true
  steps:
  - kind: step
    id: characterize-imported-capability
    instruction: Identify the imported capability, its inputs, outputs, errors, effects, ordering, callers,
      and every private module or runtime path currently used.
  - kind: step
    id: choose-authorized-boundary
    instruction: Use an existing public module export or appropriate first-party shared package; if neither
      boundary honestly owns the capability, stop for an explicit interface or ownership decision.
    requires: [characterize-imported-capability]
  - kind: step
    id: declare-interface-edge
    instruction: Declare the exact interface dependency and, for Python runtime dispatch, the exact DispatchCall
      menu entry before replacing the private import or path access.
    requires: [choose-authorized-boundary]
  - kind: step
    id: migrate-one-caller
    instruction: Replace one caller at a time while preserving public behavior, process errors, effects,
      and authorization.
    requires: [declare-interface-edge]
  - kind: step
    id: verify-and-remove-private-edge
    instruction: Run graph, dispatcher-usage, import-discipline, and behavior tests, then remove the proven-unused
      private dependency.
    requires: [migrate-one-caller]
  invariants:
  - id: no-sys-path-or-private-import
    statement: No cross-module runtime path, dynamic loader, sys.path modification, or direct private Python
      import replaces the original dependency.
  completion_conditions:
  - id: authorized-boundary-only
    statement: All callers use the declared interface or appropriate shared package and the private edge is gone.
  risk:
    level: high
    statement: A local import can become a process boundary with different errors, serialization, and effects.
