    artifact:
      kind: artifact
      ref: artifact.skill-body-execution-tests
    selector:
      kind: pytest-node
      node_id: tests/validate_skill_body_execution.py
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
    targets:
    - target:
        kind: check
        ref: instruction-source.skill-body-execution
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises clean instruction sources, executable references, generated blocks,
        and opaque runtime paths.
  instruction-source.private-runtime-reference-tests:
    artifact:
      kind: artifact
      ref: artifact.validate-skill-runtime-doc-references-pytest-file
    selector:
      kind: pytest-node
      node_id: tests/validate_skill_runtime_doc_references.py
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
    targets:
    - target:
        kind: check
        ref: instruction-source.private-runtime-references
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises public interface names, private directory tokens, filenames, normalized
        stems, nested packages, exclusions, and graph-owned artifacts.
assurances:
  instruction-source.no-executable-references:
    assertion:
      kind: assertion
      ref: skill-guidelines.runtime-code-boundary.requirement-001#no-executable-references
    mechanism:
      kind: check
      ref: instruction-source.skill-body-execution
    relation: enforces
    strength: partial
    aspects:
    - execution-context-file-reference
    coverage_description: Rejects executable filenames when authored prose directs execution.
    lifecycle: active
    resolution:
      state: resolved
    limitation: The validator recognizes a fixed executable-suffix list and selected lexical execution
      contexts; other executable references require semantic review.
  instruction-source.no-opaque-runtime-paths:
    assertion:
      kind: assertion
      ref: skill-guidelines.runtime-code-boundary.requirement-001#no-opaque-runtime-paths
    mechanism:
      kind: check
      ref: instruction-source.skill-body-execution
    relation: enforces
    strength: full
    aspects:
    - opaque-runtime-path
    coverage_description: Rejects `_cx/` and `_rtx/` paths in hand-authored instruction prose.
    lifecycle: active
    resolution:
      state: resolved
  instruction-source.private-runtime-directory-token:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-005#no-private-runtime-directory-token
    mechanism:
      kind: check
      ref: instruction-source.private-runtime-references
    relation: enforces
    strength: full
    aspects:
    - private-runtime-directory-token
    coverage_description: Rejects the literal `_rtx` token in scanned public Markdown.
    limitation: Coverage is limited to UTF-8 skill-facing Markdown; tests, assets, `_rtx`, `.system`,
      and generated SKILL.md blocks are intentionally excluded.
    lifecycle: active
    resolution:
      state: resolved
  instruction-source.same-skill-runtime-filename:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-005#no-same-skill-runtime-filename
    mechanism:
      kind: check
      ref: instruction-source.private-runtime-references
    relation: enforces
    strength: full
    aspects:
    - same-skill-runtime-filename
    coverage_description: Rejects inventoried same-skill runtime filenames with an allowed suffix.
    limitation: Coverage is limited to UTF-8 skill-facing Markdown; tests, assets, `_rtx`, `.system`,
      and generated SKILL.md blocks are intentionally excluded.
    lifecycle: active
    resolution:
      state: resolved
  instruction-source.normalized-private-runtime-stem:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-005#no-normalized-private-runtime-stem
    mechanism:
      kind: check
      ref: instruction-source.private-runtime-references
    relation: enforces
    strength: full
    aspects:
    - normalized-private-runtime-stem
    coverage_description: Rejects four declared normalized forms derived from inventoried same-skill runtime
      stems.
    limitation: Coverage is limited to UTF-8 skill-facing Markdown; tests, assets, `_rtx`, `.system`,
      and generated SKILL.md blocks are intentionally excluded.
    lifecycle: active
    resolution:
      state: resolved
  instruction-source.legacy-runtime-path:
    assertion:
      kind: assertion
      ref: skill-guidelines.private-runtime-files.requirement-005#no-legacy-runtime-path
    mechanism:
      kind: check
      ref: instruction-source.private-runtime-references
    relation: enforces
    strength: full
    aspects:
    - legacy-runtime-path
    coverage_description: Rejects legacy scripts paths ending in an allowed runtime suffix.
    limitation: Coverage is limited to UTF-8 skill-facing Markdown; tests, assets, `_rtx`, `.system`,
      and generated SKILL.md blocks are intentionally excluded.
    lifecycle: active
    resolution:
      state: resolved
