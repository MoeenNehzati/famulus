schema_version: 6
standard_version: 1.0.0
revision: 12
id: node-standards.node
canonical_path: references/node-standards/node.standard.yaml
title: Node Standard
purpose: Define requirements common to registered skill-system graph nodes.
imports:
  refactoring:
    standard_id: node-standards.refactoring
    standard_version: 2.0.0
    revision: 4
    digest: sha256:bce7f4d94bb60c90f04cca76fd40b1adda053a2a3b1d0bc5c2e84b8fea4e454e
    artifact:
      kind: artifact
      ref: artifact.refactoring-standard
standards:
- kind: family
  id: skill-guidelines.module-behavioral-source-v5
  title: Version 5 nested modules and behavioral sources
  summary: This family is the sole live blueprint and interface authoring authority.
  children:
  - kind: rule
    id: skill-guidelines.module-behavioral-source-v5.node-kinds
    assertions:
    - id: blueprint-node-type
      modality: required
      statement: "Every new or edited blueprint uses `schema_version: 5` and exactly one live `node_type`,
        either `module` or `behavioral_source`."
    - id: optional-implementation-child
      modality: required
      statement: "A repository-managed discoverable skill may have at most one direct non-discoverable
        implementation child; a skill without owned executable code need not declare one."
    - id: implementation-child-contract
      modality: required
      statement: "A discoverable skill's implementation child, when present, has global ID `<skill-id>-rtx`,
        marker `_rtx/blueprint.yaml`, gateway `_rtx/__init__.py`, no `discovery`, and no version-5 module below it."
  - kind: rule
    id: skill-guidelines.module-behavioral-source-v5.ownership
    assertions:
    - id: direct-ownership
      modality: required
      statement: Ownership selects the deepest registered module first and then its matching behavioral
        source. Parent content prunes registered child roots. Each node hashes only directly owned inputs.
        Hash what you own; certify what you depend on.
      atomicity: pending
- kind: family
  id: skill-guidelines.blueprint-authoring
  title: 'Blueprint authoring — REQUIRED: Use the version 5 schemas'
  children:
  - kind: rule
    id: skill-guidelines.blueprint-authoring.requirement-002
    assertions:
    - id: schema-driven-authoring
      modality: required
      statement: Author version-5 blueprints from the current schema and canonical templates rather than
        inferring fields from older examples.
- kind: family
  id: skill-guidelines.state-ownership
  title: State ownership
  children:
  - kind: rule
    id: skill-guidelines.state-ownership.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Store persistent node state under the owning skill directory, not in system directories
        or elsewhere outside the skills tree.
      atomicity: pending
- kind: family
  id: skill-guidelines.sensitive-configs
  title: Secret and sensitive configuration boundaries
  children:
  - kind: rule
    id: skill-guidelines.sensitive-configs.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Sensitive non-secret configuration may live under `~/.config/<skill-name>/`.
        Passwords, API keys, OAuth tokens, and equivalent secret values must use the
        repository-approved secret-store interface and must never be stored under the
        skill directory or in ordinary configuration files.
      atomicity: pending
- kind: family
  id: skill-guidelines.cross-platform-tools
  title: Cross-platform tools
  children:
  - kind: rule
    id: skill-guidelines.cross-platform-tools.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Use widely available cross-platform languages, runtimes, and external tools; skills must
        work across Linux, macOS, and Windows on machines other than the author's.
      atomicity: pending
- kind: family
  id: skill-guidelines.system-evolution
  title: Evolution and reuse
  children:
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-002
    statement: "- **Reuse, don't reimplement.** Before writing new behavior, check whether an\n  existing\
      \ skill already covers it. If yes, invoke or extend that skill."
  - kind: rule
    id: skill-guidelines.system-evolution.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Cross-module dependencies must use the dependency module's public gateway or an authorized
        exported interface; they must not depend on another module's internals.
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-005
    statement: "- **Make your own interface explicit.** State what inputs your module expects\n  and what\
      \ outputs it produces:"
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-006
    statement: '  - the module blueprint declares sources, exports, and export access'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-007
    statement: '  - each behavioral source declares its own interfaces and direct dependencies'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-008
    statement: '  - `uses_interfaces` records exact sibling or exported interface dependencies'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-009
    statement: '  - each interface contract describes its immediate semantic IO'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-010
    statement: '  - `content` declares the files owned by each node'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-011
    statement: '  - dependency and interface versions are exact'
- kind: family
  id: skill-guidelines.canonical-blueprint-ownership
  title: Canonical blueprint ownership
  children:
  - kind: rule
    id: skill-guidelines.canonical-blueprint-ownership.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: The canonical blueprint graph owns module facts, source containment, exports, access,
        source content, dependencies, and interface contracts. A node must not repeat a neighbor's intrinsic
        information.
      atomicity: pending
  - kind: rule
    id: skill-guidelines.canonical-blueprint-ownership.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: A source interface owns its contract and optional process binding; a module export names
        that interface and access policy without copying either.
      atomicity: pending
- kind: family
  id: skill-guidelines.assistant-neutrality
  title: Assistant and platform neutrality
  children:
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: Shared node content must remain neutral about assistant hosts and operating systems except
        where a narrower platform metadata or platform-named implementation rule permits them.
      atomicity: pending
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: Authored blueprints may name operating systems only in structured `platform_support`
        and dependency `platforms` metadata, not in generic prose fields.
      atomicity: pending
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: Blueprint schema documentation and validation or synchronization tooling may name allowed
        platform keys when defining or enforcing that metadata.
      atomicity: pending
- kind: procedure
  id: node-standards.remedies.restore-local-node-conformance
  title: Restore one node requirement safely
  ordered: true
  steps:
  - kind: step
    id: diagnose-exact-violation
    instruction: Identify the exact violated assertion, its applicable exceptions, the owned files involved,
      and the evidence that the current state violates it.
  - kind: step
    id: choose-smallest-compliant-change
    instruction: Choose the smallest owner-local change that directly satisfies the assertion using only
      the returned standard closure and query-resolved ownership; stop if it would move data or secrets,
      rename a public identity, change dependencies, ownership, authorization, or platform support, or
      if required facts or a unique safe remedy are missing.
    requires: [diagnose-exact-violation]
  - kind: step
    id: apply-one-repair
    instruction: Apply one bounded repair without changing unrelated behavior, public interfaces, effects,
      authorization, or user-owned work.
    requires: [choose-smallest-compliant-change]
  - kind: step
    id: verify-conformance
    instruction: Run every returned relevant check and focused test, then inspect the exact diff against
      the assertion and recorded baseline.
    requires: [apply-one-repair]
  invariants:
  - id: standards-only-policy
    statement: The repair introduces no repository policy not present in the returned closure.
  - id: secrets-never-copied
    statement: Secret material is never displayed, copied into ordinary files, or moved without an approved
      secret-store destination.
  completion_conditions:
  - id: assertion-restored
    statement: The selected assertion is satisfied and relevant verification passes, or work stops with
      the unresolved fact or decision stated explicitly.
  risk:
    level: high
    statement: A generic node repair can affect ownership, authorization, portability, or sensitive state;
      ambiguity requires stopping rather than inventing policy.
- kind: procedure
  id: node-standards.remedies.repair-node-registration-and-ownership
  title: Repair node registration and direct ownership
  ordered: true
  steps:
  - kind: step
    id: inventory-registered-graph
    instruction: Resolve the canonical node inventory, deepest owning modules, direct behavioral sources,
      registered child roots, declared content, exports, and all overlapping ownership evidence.
  - kind: step
    id: choose-canonical-owner
    instruction: Determine the single schema-valid direct owner and registration edge from actual containment
      and responsibility; stop if ownership intent or child identity is ambiguous.
    requires: [inventory-registered-graph]
  - kind: step
    id: update-one-ownership-edge
    instruction: Update one registration, content declaration, or source boundary at a time without moving
      unrelated content or widening access.
    requires: [choose-canonical-owner]
  - kind: step
    id: validate-ownership-graph
    instruction: Run canonical blueprint inventory, ownership, graph, and currentness checks and verify
      every affected file has exactly one direct owner.
    requires: [update-one-ownership-edge]
  invariants:
  - id: child-roots-pruned
    statement: Parent ownership excludes every registered child root and no content is multiply owned.
  completion_conditions:
  - id: unique-direct-ownership
    statement: Registration and direct ownership are schema-valid, unambiguous, and verified for the affected
      graph.
  risk:
    level: high
    statement: Ownership changes affect hashing, authorization, dispatch, and certification boundaries.
- kind: procedure
  id: node-standards.remedies.repair-blueprint-from-schema
  title: Repair a node blueprint from its canonical schema
  ordered: true
  steps:
  - kind: step
    id: select-node-schema
    instruction: Resolve the node type, canonical schema and template, current ownership, and existing
      behavior and interface contract from the query result.
  - kind: step
    id: author-existing-contract
    instruction: Add or correct only the schema fields required to represent the existing node, source,
      interfaces, dependencies, content, and access; stop if the existing contract is ambiguous.
    requires: [select-node-schema]
  - kind: step
    id: regenerate-contract-views
    instruction: Regenerate derived contract and interface views from the corrected blueprint.
    requires: [author-existing-contract]
  - kind: step
    id: validate-blueprint-equivalence
    instruction: Run schema, graph, ownership, contract-sync, dispatch, and focused behavior checks.
    requires: [regenerate-contract-views]
  invariants:
  - id: records-existing-contract-only
    statement: Blueprint repair does not invent new interfaces, dependencies, access, effects, or behavior.
  completion_conditions:
  - id: canonical-blueprint-valid
    statement: The blueprint is schema-valid, generated views are current, and behavior remains equivalent.
  risk:
    level: high
    statement: Incorrectly inferring an existing contract can change ownership, access, or dispatch.
- kind: procedure
  id: node-standards.remedies.restore-blueprint-authority
  title: Restore the canonical blueprint as the single source of interface truth
  ordered: true
  steps:
  - kind: step
    id: locate-duplicated-fact
    instruction: Identify the intrinsic module, source, export, access, dependency, content, contract, or
      binding fact duplicated outside its canonical blueprint owner.
  - kind: step
    id: preserve-canonical-declaration
    instruction: Correct or establish the fact at its schema-authorized blueprint location; stop if competing
      declarations disagree and intent cannot be proven.
    requires: [locate-duplicated-fact]
  - kind: step
    id: replace-duplicates-with-references
    instruction: Replace authored copies with generated views or exact references to the canonical owner,
      preserving public names and caller behavior.
    requires: [preserve-canonical-declaration]
  - kind: step
    id: regenerate-and-validate
    instruction: Regenerate derived contract views and run blueprint, interface, ownership, and behavior checks.
    requires: [replace-duplicates-with-references]
  invariants:
  - id: no-competing-authority
    statement: Each intrinsic fact has exactly one canonical blueprint owner; generated views remain derived.
  completion_conditions:
  - id: single-source-restored
    statement: Duplicated intrinsic facts are removed and generated views match the canonical graph.
  risk:
    level: high
    statement: Choosing the wrong authority can silently change interfaces or authorization.
- kind: procedure
  id: node-standards.remedies.restore-cross-platform-boundary
  title: Restore a declared cross-platform boundary
  ordered: true
  steps:
  - kind: step
    id: characterize-platform-contract
    instruction: Record supported platforms, public behavior, paths, process IO, dependencies, and current
      platform-specific branches for the violated requirement.
  - kind: step
    id: choose-portable-or-explicit-adapter
    instruction: Prefer a supported portable facility; otherwise isolate the smallest platform-specific
      adapter behind a host-neutral interface and declare its platform support. Stop before dropping support.
    requires: [characterize-platform-contract]
  - kind: step
    id: migrate-one-boundary
    instruction: Replace one nonportable path, process, dependency, or implementation boundary without
      changing public behavior.
    requires: [choose-portable-or-explicit-adapter]
  - kind: step
    id: verify-supported-platforms
    instruction: Run available platform-neutral tests and each returned platform-specific check; report
      any supported platform that cannot be verified.
    requires: [migrate-one-boundary]
  invariants:
  - id: support-not-silently-reduced
    statement: A refactor never removes declared platform support without explicit user approval.
  completion_conditions:
  - id: platform-boundary-explicit
    statement: The implementation is portable or platform-specific logic is isolated and declared with
      verified host-neutral behavior.
  risk:
    level: high
    statement: Platform changes can pass locally while breaking other supported hosts.
artifacts:
