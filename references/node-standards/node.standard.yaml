    path: references/node-standards/refactoring.standard.yaml
    format: yaml
    roles:
    - other
  artifact.platform-neutral-validator:
    path: validators/platform_neutral.py
    format: python
    roles:
    - validator
  artifact.platform-neutral-tests:
    path: tests/validate_platform_neutral.py
    format: python
    roles:
    - test
  artifact.blueprint-validator:
    path: validators/skill/blueprints.py
    format: python
    roles:
    - validator
  artifact.blueprint-validator-tests:
    path: tests/validate_blueprints.py
    format: python
    roles:
    - test
  artifact.blueprint-inventory-tests:
    path: tests/test_blueprint_inventory.py
    format: python
    roles:
    - test
  artifact.semantic-review-instructions:
    path: references/node-standards/semantic-review.md
    format: markdown
    roles:
    - other
domain_facts:
  node.present: true
  node.skill-owned: true
checks:
  node.blueprint-contract:
    artifact:
      kind: artifact
      ref: artifact.blueprint-validator
    selector:
      kind: python-symbol
      symbol: validate_with_graph
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
  node.shared-platform-neutrality:
    artifact:
      kind: artifact
      ref: artifact.platform-neutral-validator
    selector:
      kind: python-symbol
      symbol: validate_with_graph
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
tests:
  node.blueprint-contract-tests:
    artifact:
      kind: artifact
      ref: artifact.blueprint-validator-tests
    selector:
      kind: pytest-node
      node_id: tests/validate_blueprints.py
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
    targets:
    - target:
        kind: check
        ref: node.blueprint-contract
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises schema-version selection, node types, canonical module markers,
        and generated blueprint views.
  node.blueprint-inventory-tests:
    artifact:
      kind: artifact
      ref: artifact.blueprint-inventory-tests
    selector:
      kind: pytest-node
      node_id: tests/test_blueprint_inventory.py
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
    targets:
    - target:
        kind: check
        ref: node.blueprint-contract
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises registered-child ownership, optional implementation children,
        derived implementation identities, and invalid nested registrations.
  node.shared-platform-neutrality-tests:
    artifact:
      kind: artifact
      ref: artifact.platform-neutral-tests
    selector:
      kind: pytest-node
      node_id: tests/validate_platform_neutral.py
    integration:
      state: resolved
      points:
      - precommit
    lifecycle: active
    resolution:
      state: resolved
    targets:
    - target:
        kind: check
        ref: node.shared-platform-neutrality
      relation: tests-check
      polarity: mixed
      coverage_description: Exercises neutral and non-neutral shared content, platform-named files,
        blueprint metadata, graph-owned artifacts, and case handling.
assurances:
  node.blueprint-node-type:
    assertion:
      kind: assertion
      ref: skill-guidelines.module-behavioral-source-v5.node-kinds#blueprint-node-type
    mechanism:
      kind: check
      ref: node.blueprint-contract
    relation: enforces
    strength: full
    aspects:
    - schema-version
    - node-type
    coverage_description: Validates version-5 blueprints against the selected module or behavioral-source
      schema and rejects incompatible canonical markers.
    lifecycle: active
    resolution:
      state: resolved
  node.optional-implementation-child:
    assertion:
      kind: assertion
      ref: skill-guidelines.module-behavioral-source-v5.node-kinds#optional-implementation-child
    mechanism:
      kind: check
      ref: node.blueprint-contract
    relation: enforces
    strength: partial
    aspects:
    - optional-child
    - child-cardinality
    coverage_description: Validates registered child topology and accepts managed skills without an
      implementation child.
    limitation: The check validates declarations and owned paths; it cannot infer whether undeclared files
      constitute intended executable behavior.
    lifecycle: active
    resolution:
      state: resolved
  node.implementation-child-contract:
    assertion:
      kind: assertion
      ref: skill-guidelines.module-behavioral-source-v5.node-kinds#implementation-child-contract
    mechanism:
      kind: check
      ref: node.blueprint-contract
    relation: enforces
    strength: full
    aspects:
    - derived-child-id
    - canonical-marker
    - discovery-boundary
    - nesting
    coverage_description: Validates the derived implementation-child identity, canonical locator,
      non-discoverability, and registration topology.
    lifecycle: active
    resolution:
      state: resolved
  node.shared-platform-neutrality:
    assertion:
      kind: assertion
      ref: skill-guidelines.assistant-neutrality.requirement-001#source-block
    mechanism:
      kind: check
      ref: node.shared-platform-neutrality
    relation: enforces
    strength: partial
    aspects:
    - assistant-host-names
    - operating-system-names
    coverage_description: Scans shared owned content for named assistant hosts and operating systems
      while honoring declared platform metadata and platform-named implementation boundaries.
    limitation: Filename-based exceptions and explicitly excluded policy or platform-specific modules
      remain outside this text check; blueprint graph validation supplies their structural boundary.
    lifecycle: active
    resolution:
      state: resolved
semantic_reviews:
  node.identity:
    coverage:
    - target: {kind: family, ref: skill-guidelines.module-behavioral-source-v5}
      strength: supporting
      aspects: [naming, discovery, taxonomy, compatibility, permissions]
      scope: node-and-descendants
    reason: Identity and permission semantics require contextual review beyond schema validity.
    question: Are naming, discovery, taxonomy, compatibility, and permission semantics coherent for the node?
    procedure: Apply review-identity to the target, its registered descendants, and the returned evidence.
    trigger: {kind: on-change, detail: "When node identity, discovery, taxonomy, compatibility, or permissions change."}
    lifecycle: active
    resolution: {state: resolved}
    reviewer_kinds: [human, llm]
    instructions: {artifact: {kind: artifact, ref: artifact.semantic-review-instructions}, instruction_id: review-identity}
  node.blueprint:
    coverage:
    - target: {kind: family, ref: skill-guidelines.blueprint-authoring}
      strength: supporting
      aspects: [graph-authority, ownership, hashing, certification]
      scope: node-and-descendants
    reason: Blueprint meaning can be semantically wrong while remaining schema-valid.
    question: Do graph authority, ownership, hashing, and certification claims match actual behavior?
    procedure: Apply review-blueprint to the target graph, direct ownership, and declared evidence.
    trigger: {kind: on-change, detail: "When blueprints, ownership, hashing, or certification claims change."}
    lifecycle: active
    resolution: {state: resolved}
    reviewer_kinds: [human, llm]
    instructions: {artifact: {kind: artifact, ref: artifact.semantic-review-instructions}, instruction_id: review-blueprint}
  node.interfaces:
    coverage:
    - target: {kind: family, ref: skill-guidelines.canonical-blueprint-ownership}
      strength: supporting
      aspects: [public-contract, immediate-io, abstraction-boundary]
      scope: node-and-descendants
    reason: Interface descriptions and IO can leak internals or misstate public behavior without violating structure.
    question: Do source-owned interfaces state their actual public contracts and immediate IO without leaking internals?
    procedure: Apply review-interfaces to every selected source interface and its observable implementation behavior.
    trigger: {kind: on-change, detail: "When an interface, export, binding, dependency, or observable IO changes."}
    lifecycle: active
    resolution: {state: resolved}
    reviewer_kinds: [human, llm]
    instructions: {artifact: {kind: artifact, ref: artifact.semantic-review-instructions}, instruction_id: review-interfaces}
  node.runtime:
    coverage:
    - target: {kind: family, ref: skill-guidelines.system-evolution}
      strength: supporting
      aspects: [runtime-boundary, imports, injection, public-reference]
      scope: node-and-descendants
    reason: Runtime layering and dependency direction require repository-context judgment.
    question: Are runtime boundaries, imports, injection lifecycle, and prose references aligned with public interfaces?
    procedure: Apply review-runtime to runtime owners, dependency edges, lifecycle behavior, and authored references.
    trigger: {kind: on-change, detail: "When runtime files, imports, injection, dependencies, or prose references change."}
    lifecycle: active
    resolution: {state: resolved}
    reviewer_kinds: [human, llm]
    instructions: {artifact: {kind: artifact, ref: artifact.semantic-review-instructions}, instruction_id: review-runtime}
  node.state-security:
    coverage:
    - target: {kind: family, ref: skill-guidelines.state-ownership}
      strength: supporting
      aspects: [state-ownership, filesystem-effects]
      scope: node-and-descendants
    - target: {kind: family, ref: skill-guidelines.sensitive-configs}
      strength: supporting
      aspects: [credential-placement, sensitive-config]
      scope: node-and-descendants
    reason: State and credential placement can be unsafe even when declarations are structurally valid.
    question: Do state ownership, credential placement, and declared filesystem effects match actual behavior?
    procedure: Apply review-state-security without displaying or relocating secret material.
    trigger: {kind: on-change, detail: "When persistent state, secrets, sensitive config, or filesystem effects change."}
    lifecycle: active
    resolution: {state: resolved}
    reviewer_kinds: [human, llm]
    instructions: {artifact: {kind: artifact, ref: artifact.semantic-review-instructions}, instruction_id: review-state-security}
  node.portability:
    coverage:
    - target: {kind: family, ref: skill-guidelines.cross-platform-tools}
      strength: supporting
      aspects: [host-neutrality, platform-isolation, support-truthfulness]
      scope: node-and-descendants
    - target: {kind: family, ref: skill-guidelines.assistant-neutrality}
      strength: supporting
      aspects: [assistant-neutrality, platform-metadata]
      scope: node-and-descendants
    reason: Local success does not establish truthful cross-platform or host-neutral behavior.
    question: Are neutrality claims true and platform-specific behavior isolated and explicitly declared?
    procedure: Apply review-portability across supported platforms, adapters, metadata, and shared prose.
    trigger: {kind: on-change, detail: "When dependencies, platform support, adapters, or host-facing prose change."}
    lifecycle: active
    resolution: {state: resolved}
    reviewer_kinds: [human, llm]
    instructions: {artifact: {kind: artifact, ref: artifact.semantic-review-instructions}, instruction_id: review-portability}
  node.instructions:
    coverage:
    - target: {kind: family, ref: skill-guidelines.assistant-neutrality}
      strength: supporting
      aspects: [trigger-quality, terseness, neutrality, behavior-shaping]
      scope: node-and-descendants
    reason: Instruction quality and trigger behavior are semantic properties not fully captured by text checks.
    question: Are triggers precise and instructions terse, neutral, and limited to behavior-shaping guidance?
    procedure: Apply review-instructions to every selected instruction gateway and reference.
    trigger: {kind: on-change, detail: "When instruction-language gateways or references change."}
    lifecycle: active
    resolution: {state: resolved}
    reviewer_kinds: [human, llm]
    instructions: {artifact: {kind: artifact, ref: artifact.semantic-review-instructions}, instruction_id: review-instructions}
  node.workflow:
    coverage:
    - target: {kind: family, ref: skill-guidelines.system-evolution}
      strength: supporting
      aspects: [coordination, change-scope, validation, publication]
      scope: node-and-descendants
    reason: Workflow correctness depends on the requested scope and current repository state.
    question: Do coordination, change scope, validation, and publication instructions fit the requested workflow?
    procedure: Apply review-workflow to the requested operation, current diff, dependencies, and publication boundary.
    trigger: {kind: on-change, detail: "When coordination, validation, or publication workflow changes."}
    lifecycle: active
    resolution: {state: resolved}
