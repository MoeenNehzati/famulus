  duplicated-inline: {source: {kind: family, ref: skill-refactoring.smells.duplicated-guidelines}, relation: remedied-by, target: {kind: procedure, ref: skill-refactoring.remedies.inline-to-reference}, lifecycle: active, resolution: {state: resolved}}
