  abstraction-script: {source: {kind: family, ref: skill-refactoring.smells.mixed-abstraction-levels}, relation: remedied-by, target: {kind: procedure, ref: skill-refactoring.remedies.extract-script}, lifecycle: active, resolution: {state: resolved}}
  dead-purge: {source: {kind: family, ref: skill-refactoring.smells.dead-content}, relation: remedied-by, target: {kind: procedure, ref: skill-refactoring.remedies.purge-dead-content}, lifecycle: active, resolution: {state: resolved}}
  undeclared-clarify: {source: {kind: family, ref: skill-refactoring.smells.undeclared-interface}, relation: remedied-by, target: {kind: procedure, ref: skill-refactoring.remedies.clarify-interface}, lifecycle: active, resolution: {state: resolved}}
