  contract-sync: {source: {kind: family, ref: skill-refactoring.smells.missing-contract-artifacts}, relation: remedied-by, target: {kind: procedure, ref: skill-refactoring.remedies.sync-generated-contract-artifacts}, lifecycle: active, resolution: {state: resolved}}
