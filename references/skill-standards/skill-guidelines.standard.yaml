schema_version: 6
standard_version: 1.0.0
revision: 2
id: skill-guidelines
canonical_path: references/skill-standards/skill-guidelines.standard.yaml
render_mode: source-faithful
title: Skill Module Standards
purpose: Source-faithful repository standards for skill identity, interfaces, runtime boundaries, state, portability, instruction design, workflow, and validation.
standards:
- kind: family
  id: skill-guidelines.module-boundary
  title: A skill is a software module.
  children:
  - kind: guidance
    id: skill-guidelines.module-boundary.guidance-001
    statement: '# Skill Module Standards'
  - kind: guidance
    id: skill-guidelines.module-boundary.guidance-002
    statement: '**A skill is a software module.** The standards below define the module

      boundary: identity, interfaces, allowed dependencies, runtime ownership, and

      import discipline. They are structural requirements, not style preferences.'
- kind: family
  id: skill-guidelines.identity-contract
  title: 1. Skill identity and contract come first
  children:
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-001
    statement: "**1. Skill identity and contract come first** \u2014 every skill has a stable\ndash-separated name and declares its dependency and interface contract before\nworkflow instructions."
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'The skill directory name and frontmatter `name:` must match exactly. Skill names

        must be lower-case, dash-separated, and at least two words:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.identity-contract.example-001
    statement: '```text

      list-manager

      get-weather

      email-client

      ```'
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: Do not create one-word skill names such as `lists`, `weather`, or `email`.
      atomicity: pending
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Historical legacy skills may keep a hand-authored dependency block in

        `SKILL.md`:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.identity-contract.example-002
    statement: '```markdown

      Category: automation


      Dependencies:

      - list-manager

      - g-calendar

      - get-weather

      ```'
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: 'Use `Dependencies: none` when the skill must not invoke other skills. List only

        skill names, not paths, files, or implementation details.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-002
    statement: 'In this repository, local skills use one canonical `blueprint.yaml` graph root

      next to `SKILL.md`. Generate its initial values from `skill.schema.json`, then

      define its default LLM interface inline and create typed hidden sidecars for

      additional interfaces and behavior sources from their concrete schemas. The committed

      `references/blueprint/template.yaml` is an artifact-layout manifest, not a

      copyable root blueprint. The canonical root plus the subordinate files

      reachable through its locators are the source of truth for:'
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-003
    statement: '- `category`'
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-004
    statement: '- `role`'
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-005
    statement: '- `kind`'
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-006
    statement: '- `suggested_permissions`'
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-007
    statement: '- `skill_interface`'
  - kind: guidance
    id: skill-guidelines.identity-contract.guidance-008
    statement: '- interface locators and interface-local contracts'
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-005
    assertions:
    - id: source-block
      modality: required
      statement: 'For blueprint skills, the top-of-file contract block in `SKILL.md` is generated

        from the canonical graph. Authored root and subordinate blueprints are

        canonical; generated blocks, pooled reviews, health records, and repo-level

        manifests are not graph authority and must match the authored graph exactly.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.identity-contract.requirement-006
    assertions:
    - id: source-block
      modality: required
      statement: 'Cross-skill use is declared on the interface that performs it, through

        `uses_interfaces`. Do not add top-level skill dependency lists. If an LLM

        surface delegates to another skill, point to that skill''s LLM interface. If a

        machine interface calls another machine interface, declare that exact

        version-pinned machine interface edge.

        In schema-version-2 LLM-interface and behavior-source bodies, use canonical

        `skill.llm.name` or `skill.machine.name` IDs, never bare cross-skill names.

        Every interface ID named in the body must be declared by that same node''s

        `uses_interfaces`.'
      atomicity: pending
- kind: family
  id: skill-guidelines.blueprint-authoring
  title: "Blueprint authoring \u2014 REQUIRED: Use the concrete schema"
  children:
  - kind: rule
    id: skill-guidelines.blueprint-authoring.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**Blueprint authoring \u2014 REQUIRED: Use the concrete schema**"
      atomicity: pending
  - kind: rule
    id: skill-guidelines.blueprint-authoring.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Generate each new root or subordinate blueprint from its concrete type schema.

        Do not copy `references/blueprint/template.yaml` into a skill. The complete

        type-specific authoring, creation, hash, and validator traceability rules live

        in `references/blueprint/*.schema.json` and `schema-meta.json`; the manifest

        only demonstrates deterministic filenames and generated outputs.'
      atomicity: pending
- kind: family
  id: skill-guidelines.blueprint-authoring-notes
  title: Blueprint authoring notes
  children:
  - kind: guidance
    id: skill-guidelines.blueprint-authoring-notes.guidance-001
    statement: '**Blueprint authoring notes**'
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "- `category`: required single string from the typed enum in\n  `references/blueprint/schema.json`."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: "- `role`: required single string from the typed enum in\n  `references/blueprint/schema.json`; it names the primary user-facing domain\n  for generated docs and graph clustering."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: "- `kind`: required single string from the typed enum in\n  `references/blueprint/schema.json`; it names the primary shape of help the\n  skill provides for generated docs and filters."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: "- `suggested_permissions`: advisory mapping with `bash` and `network` lists.\n  Every entry must include a `reason`."
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.blueprint-authoring-notes.guidance-002
    statement: "- `skill_interface`: three plain-language lists (`inputs`, `outputs`,\n  `side_effects`) that describe the skill's high-level contract."
  - kind: guidance
    id: skill-guidelines.blueprint-authoring-notes.guidance-003
    statement: "- `default_interface`: the inline contract for canonical\n  `skill.llm.default`; its identity and `SKILL.md` binding are implicit."
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-005
    assertions:
    - id: source-block
      modality: required
      statement: "- `interfaces`: version-pinned locators for additional LLM and machine\n  interface sidecars. Existing typed skills may retain a default-interface\n  sidecar during compatibility migration, but must not declare both forms."
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.blueprint-authoring-notes.guidance-004
    statement: "- `blueprint_type`: one of `skill`, `llm-interface`, `machine-interface`, or\n  `behavior-source`. A typed file states its own type instead of wrapping its\n  facts in another interface-name mapping."
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-006
    assertions:
    - id: source-block
      modality: required
      statement: 'Every subordinate blueprint binds exactly one existing regular file and is

        hidden beside it. A single node bound to `foo.py` uses

        `.foo.py.blueprint.yaml`; multiple nodes on the same file use qualified names

        such as `.foo.py.read.blueprint.yaml`. Generated health uses the corresponding

        `.health.json` suffix. The skill root alone keeps `blueprint.yaml` and

        `.last_audit.json`. The inline default is part of the root rather than a

        subordinate sidecar. Directories never receive blueprints.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-007
    assertions:
    - id: source-block
      modality: required
      statement: 'In schema version 3, every node declares `content`: case-sensitive regular

        expressions that resolve to the behavior-defining files owned by that node.

        Exactly one resolved content file is the node''s `gateway`. Content ownership is

        exclusive across the repository: two nodes must not claim the same file, and an

        `owns_filesystem` entry must not overlap content owned by another node.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.blueprint-authoring-notes.requirement-008
    assertions:
    - id: source-block
      modality: required
      statement: '`skill-audit` generates node health bottom-up and may generate

        `.pooled-blueprint-review.yaml` plus its health file for review. Pooled files

        are never graph inputs. The schema family defines canonical health fields,

        SHA-256 projections, HMAC-SHA-256 authentication, and which authored fields

        participate in contract hashes. Health, pool, and key files are ignored local

        state. The inline default and `SKILL.md` are certified by root skill health;

        they do not receive a second health identity. Do not hand-author health files.'
      atomicity: pending
- kind: family
  id: skill-guidelines.canonical-interface-names
  title: Canonical interface names
  children:
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.guidance-001
    statement: '**Canonical interface names**'
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.guidance-002
    statement: 'Every blueprint interface has a canonical fully qualified name:'
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.guidance-003
    statement: '- machine interface: `skill.machine.name`'
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.guidance-004
    statement: '- llm interface: `skill.llm.name`'
  - kind: rule
    id: skill-guidelines.canonical-interface-names.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'The local `<name>` is the final component of the subordinate blueprint''s `id`.

        It must be dash-separated and must **not** contain `.`.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.guidance-005
    statement: 'The canonical invocation form for machine interfaces is:'
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.example-001
    statement: '```bash

      dispatcher --caller-skill daily-plan list-manager.machine.read-list /tmp/todo.yaml

      ```'
  - kind: rule
    id: skill-guidelines.canonical-interface-names.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'For Python skill code, every machine-interface class that may invoke another

        skill must define a declared dispatch menu on the interface. Runtime code calls

        only entries from that menu, never raw dispatcher APIs:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.example-002
    statement: "```python\nfrom officina.runtime.python_machine_interface import DispatchCall, PythonMachineInterface\n\n\nclass Interface(PythonMachineInterface):\n    dispatches = {\n        \"read-list\": DispatchCall(\n            caller_skill=\"daily-plan\",\n            target_skill=\"list-manager\",\n            interface=\"read-list\",\n        )\n    }\n```"
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.guidance-006
    statement: 'Then execute by key:'
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.example-003
    statement: '```python

      self.dispatch("read-list", args=["/tmp/todo.yaml"])

      ```'
  - kind: rule
    id: skill-guidelines.canonical-interface-names.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Do not import or call `officina.dispatcher` from skill runtime code. Do not

        invoke the `dispatcher` CLI from Python skill code, and do not modify `sys.path`

        to reach dispatcher internals.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.canonical-interface-names.guidance-007
    statement: 'This is mechanically checked by

      `skills/skill-maker/validators/dispatcher_usage.py`, which rejects raw

      dispatcher imports and CLI dispatch from skill runtime code, and

      `skills/skill-maker/validators/dispatch_caller_skill.py`, which verifies every

      `DispatchCall(caller_skill=...)` statically resolves to the owning skill name.'
- kind: family
  id: skill-guidelines.machine-interfaces
  title: Machine interfaces
  children:
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-001
    statement: '**Machine interfaces**'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-002
    statement: 'A `machine-interface` sidecar is the dispatcher-executable contract. It owns:'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-003
    statement: "- `version` \u2014 the major version of this interface contract"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-004
    statement: "- `description` \u2014 what the interface does"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-005
    statement: "- `usage` \u2014 complete invocation argument template"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-006
    statement: "- `patterns` \u2014 positional/flag/stdin constraints"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-007
    statement: "- `allow_all_skills` / `allowed_callers` \u2014 access control"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-008
    statement: "- `platform_support` \u2014 explicit Linux/macOS/Windows support booleans for this\n  machine interface"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-009
    statement: "- `binding` \u2014 one private Python entrypoint under `_rtx` or directly executed\n  command file under `_cx`"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-010
    statement: "- `dependencies` \u2014 factual runtime package and executable requirements"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-011
    statement: "- `behavior_sources` \u2014 edges to typed file-backed behavior-source nodes"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-012
    statement: "- `direct_io` \u2014 immediate semantic IO for generated docs, search, graphs, and\n  safety summaries"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-013
    statement: "- `owns_filesystem` \u2014 interface-owned filesystem paths and explicitly allowed\n  reader interfaces"
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: '`binding` is **internal metadata**. Python interfaces use `kind:

        python-entrypoint`, a `_rtx/*.py` path, and a symbol. Command interfaces use

        `kind: command-file` and a tracked executable under `_cx`. The dispatcher

        executes command files directly as argv; inline shell strings, direct Bash

        declarations, and `bash -c` are forbidden. Public interface IDs remain

        `skill.machine.name` for both binding kinds.

        Binding paths must be relative, contain no parent traversal, and remain inside

        the corresponding `_rtx` or `_cx` directory after symlink resolution.

        Hand-authored LLM-facing text must never expose `_cx/...`; name the canonical

        machine interface instead.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Every executable `machine-interface` sidecar must declare `dependencies`.

        Use `dependencies: []` when the interface has no non-stdlib Python package or

        external executable requirements. Otherwise list one object per requirement:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.machine-interfaces.example-001
    statement: "```yaml\nplatform_support:\n  linux: true\n  macos: true\n  windows: false\n\ndependencies:\n  - kind: python-package\n    name: PyYAML\n    version: \">=6\"\n    platforms:\n      linux: true\n      macos: true\n      windows: false\n    reason: \"Reads YAML input files.\"\n  - kind: binary\n    name: curl\n    version: any\n    platforms:\n      linux: true\n      macos: true\n      windows: false\n    reason: \"Fetches remote JSON from the API.\"\n```"
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: '`platform_support` is required on every machine interface. It is an explicit

        three-boolean object, not a free-form OS list:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-014
    statement: '- `linux`'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-015
    statement: '- `macos`'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-016
    statement: '- `windows`'
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: 'Set each boolean deliberately. Do not omit unsupported platforms. Use `macos`,

        not `osx`.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-005
    assertions:
    - id: source-block
      modality: required
      statement: 'Do not declare skill-level platform support. Skill-level summaries for docs,

        graphs, installers, and validators must be derived from

        reachable machine sidecar `platform_support`. A skill may have both portable and

        platform-specific machine interfaces.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-006
    assertions:
    - id: source-block
      modality: required
      statement: 'Every dependency must declare `kind`, `name`, `version`, `platforms`, and

        `reason`. `platforms` uses the same required booleans as `platform_support` and

        must not claim a platform that the owning interface does not support. Use

        `version: any` only when there is no known lower bound, exact version, or useful

        human-readable constraint.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-017
    statement: 'Allowed dependency kinds are closed and non-overlapping:'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-018
    statement: "- `python-package` \u2014 installable Python package requirement. `name` is the\n  package/runtime requirement name, not necessarily the import name."
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-019
    statement: "- `binary` \u2014 executable expected on `PATH`."
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-020
    statement: "- `system-service` \u2014 service manager or daemon facility such as `systemd` or\n  `launchd`."
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-021
    statement: "- `system-library` \u2014 native/shared library requirement outside Python."
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-022
    statement: "- `external-application` \u2014 installed GUI or full application such as Chrome or\n  Audiveris."
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-023
    statement: "- `runtime` \u2014 language/runtime requirement such as Python, Node, Java, or a\n  shell runtime."
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-007
    assertions:
    - id: source-block
      modality: required
      statement: "- `model-data` \u2014 local model, checkpoint, cache, or other required data bundle."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-008
    assertions:
    - id: source-block
      modality: required
      statement: 'Where a dependency subfield has a bounded vocabulary, use the schema''s finite

        options rather than inventing adjacent names. For `kind: system-service`,

        `name` must be one of:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-024
    statement: '- `systemd-user`'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-025
    statement: '- `launchd`'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-026
    statement: '- `task-scheduler`'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-027
    statement: '- `cron`'
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-009
    assertions:
    - id: source-block
      modality: required
      statement: 'Do not encode APIs, OAuth, credentials, or network access as dependency kinds.

        Represent those through `direct_io.network`, auth metadata, and setup

        interfaces. Runtime dependencies are factual environment requirements. They are

        separate from top-level `suggested_permissions`, which remains developer

        judgment about a good baseline approval set and must not be inferred from code.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-010
    assertions:
    - id: source-block
      modality: required
      statement: 'The blueprint sync tool generates `references/blueprint/runtime_dependencies.json`

        from these declarations. Installers and other non-YAML consumers should read

        that JSON manifest instead of parsing blueprint YAML at runtime.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-011
    assertions:
    - id: source-block
      modality: required
      statement: Every interface must declare `behavior_sources` directly.
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-012
    assertions:
    - id: source-block
      modality: required
      statement: 'Behavior sources are regular files that the interface reads as

        instructions, rules, schemas, templates, examples, parser tables, checklists, or

        other behavior-shaping material. They are not the user''s subject input. A

        Markdown interface should list the Markdown files it points to and loads. A

        Python machine interface should list non-code files such as JSON schemas,

        prompt templates, examples, policy files, and config files that affect behavior.

        Python imports, `_rtx/` entrypoint files, and dispatcher targets are discovered

        mechanically; do not duplicate them in behavior sources.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-013
    assertions:
    - id: source-block
      modality: required
      statement: 'Use `behavior_sources: []` only after checking that the interface has no

        non-code behavior-shaping files. Each edge points to a typed behavior-source

        sidecar, carries the consumer-local `reason`, and pins a version. The target

        node owns its binding, content, format, description, and any edges to other

        behavior sources. All binding paths are relative to the skill root. Directory

        bindings are forbidden; bind a concrete dispatcher, manifest, index, or README

        file when a collection needs graph identity.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-014
    assertions:
    - id: source-block
      modality: required
      statement: 'Every machine and LLM interface must declare `version`. Bump it only when that

        interface''s exported contract changes in a breaking way. A skill''s version is

        the version of its `llm.default` interface; there is no separate top-level skill

        version field.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-015
    assertions:
    - id: source-block
      modality: required
      statement: 'Every machine and LLM interface must also declare `direct_io` with `reads`,

        `writes`, and `network` lists. `direct_io` is immediate-only: describe only the

        IO performed by that interface itself, and never copy IO from interfaces listed

        in `uses_interfaces`. Generated documentation and graphs derive transitive IO by

        recursively following `uses_interfaces`.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-016
    assertions:
    - id: source-block
      modality: required
      statement: '`direct_io.content` must stay coarse and user-meaningful. It names the object

        for docs, search, and graphs, not internal fields. Use values such as `email`,

        `calendar-event`, `proof`, `report`, or `credential`; do not introduce

        field-level values such as `email-subject`, `email-body`, `event-title`, or

        `document-id`.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-017
    assertions:
    - id: source-block
      modality: required
      statement: 'Use `direct_io.format` for one known format and `direct_io.formats` for a

        finite family of possible formats. Never set both on the same entry. When a path

        describes a family of files, set `path_match: glob` and use the documented

        minimal glob syntax: `*` within a segment, `**` as a complete segment, and a

        final extension family such as `*.{md,pdf}`. Prefer this over broad values such

        as `mixed`. Do not use nonstandard forms such as `*.[md|pdf]`. Use

        `path_match: regex` only when a glob cannot express the family; regex paths

        must compile and should declare explicit `format` or `formats` values.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-018
    assertions:
    - id: source-block
      modality: required
      statement: 'Every machine and LLM interface must declare `owns_filesystem`. Use `[]` when

        the interface owns no filesystem paths. If an interface owns a path, only that

        interface may write matching `direct_io.writes` entries; only that interface and

        the canonical interfaces named in `allowed_readers` may read matching

        `direct_io.reads` entries. Ownership paths can be exact strings or regexes.

        Two different interfaces must not own overlapping filesystem paths.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-019
    assertions:
    - id: source-block
      modality: required
      statement: "Filesystem write validation treats resolved node `content` and declared\n`owns_filesystem` paths as one ownership domain. A node's content contributes\nimplicit exact ownership claims; `owns_filesystem` contributes additional\nexplicit exact or regex claims. No ownership claims may overlap across nodes,\nand no node may declare a local-filesystem `direct_io.writes` entry\u2014whether\nexact, glob, or regex\u2014that matches content or an `owns_filesystem` path owned by\nanother node. Keep `content` separate because it defines the files included in\nnode hashing and certification; `owns_filesystem` does not become content."
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-028
    statement: 'For `kind: python-entrypoint`, health dependency exploration combines

      three surfaces:'
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-029
    statement: "- typed `behavior_sources` for non-code behavior-shaping files, including\n  schemas, templates, examples, policy files, and parser tables;"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-030
    statement: "- class-level `dispatches = {...}` entries made of `DispatchCall(...)` for\n  cross-skill machine-interface dependencies, followed recursively through\n  dispatcher resolution;"
  - kind: guidance
    id: skill-guidelines.machine-interfaces.guidance-031
    statement: "- `route_smoke()` for same-skill dynamic Python imports that normal execution\n  performs lazily."
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-020
    assertions:
    - id: source-block
      modality: required
      statement: 'If a Python file can affect behavior and is not otherwise covered by declared

        imports or `DispatchCall`, the interface''s `route_smoke()` must import the code

        path cheaply and without real side effects. Non-code behavior files must be

        declared through typed behavior-source nodes. Health exploration does not execute

        normal `run(...)` just to discover dependencies.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.machine-interfaces.requirement-021
    assertions:
    - id: source-block
      modality: required
      statement: 'Pattern semantics are per interface, not per grouped command. Every

        `machine-interface` sidecar is one canonical callable interface. Do not

        reintroduce grouped parent interfaces with hidden subinterface ids.'
      atomicity: pending
- kind: family
  id: skill-guidelines.llm-interfaces
  title: LLM interfaces
  children:
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-001
    statement: '**LLM interfaces**'
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-002
    statement: 'An `llm-interface` is not callable through the dispatcher. It documents a

      skill-owned prompt surface routed by higher-level skill logic. The default

      interface is embedded in the root; additional named interfaces use sidecars.

      An LLM interface owns:'
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-003
    statement: '- `version`'
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-004
    statement: '- `description`'
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-005
    statement: "- `binding` \u2014 where the interface definition lives"
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-006
    statement: "- `behavior_sources` \u2014 additional non-code files that shape prompt behavior"
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-007
    statement: '- `direct_io`'
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-008
    statement: '- `owns_filesystem`'
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-009
    statement: "- `allow_all_skills` / `allowed_callers` \u2014 access control for other skills"
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-010
    statement: '- optional routing or documentation metadata'
  - kind: rule
    id: skill-guidelines.llm-interfaces.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Sidecar LLM bindings use `kind: instruction-file` and one regular local file.

        The mandatory `skill.llm.default` identity and its `SKILL.md` binding are

        implied by `default_interface`; another LLM interface may bind a file such as

        `llm_interfaces/summarize.md`. URI and directory bindings are forbidden. All

        explicit binding paths are relative to the skill root.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-011
    statement: 'Local LLM interface Markdown beyond `SKILL.md` lives under

      `skills/<skill-name>/llm_interfaces/`. It is the Markdown counterpart to

      `_rtx/`: use `llm_interfaces/` for local LLM-facing instruction surfaces, and

      use `references/` for supporting behavior sources such as checklists, examples,

      parser notes, templates, or policy material loaded by those interfaces.

      For decomposition guidance, see

      `references/skill-standards/llm-interface-design.md`.'
  - kind: rule
    id: skill-guidelines.llm-interfaces.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Use `binding`, not `invocation`, because LLM interfaces are descriptive routing

        surfaces rather than dispatcher-executed programs. `invocation` is forbidden under

        named `llm-interface` sidecars.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.llm-interfaces.guidance-012
    statement: 'Every new typed skill root defines its default interface inline:'
  - kind: guidance
    id: skill-guidelines.llm-interfaces.example-001
    statement: "```yaml\ndefault_interface:\n  version: 1\n  description: Primary LLM-facing skill instructions.\n  behavior_sources: []\n  direct_io:\n    reads: []\n    writes: []\n    network: []\n  owns_filesystem: []\n```"
  - kind: rule
    id: skill-guidelines.llm-interfaces.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'This defines `example-skill.llm.default` and binds `SKILL.md` without a

        `.SKILL.md.blueprint.yaml` file. For short skills it may contain the complete

        workflow; for larger skills it may route to named LLM interfaces.'
      atomicity: pending
- kind: family
  id: skill-guidelines.dispatcher-role
  title: Dispatcher role
  children:
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-001
    statement: '**Dispatcher role**'
  - kind: rule
    id: skill-guidelines.dispatcher-role.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'The installed `dispatcher` command and the shared dispatcher runtime are the

        only sanctioned local cross-skill machine boundaries for blueprint-migrated

        skills. Python skill runtime code must reach that boundary through declared

        `DispatchCall` entries and `PythonMachineInterface.dispatch()`. The

        dispatcher runtime''s job is to:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-002
    statement: 1. Parse the target canonical name `skill.machine.name`
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-003
    statement: 2. Resolve the callee `blueprint.yaml`
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-004
    statement: 3. Follow the root edge to the target `machine-interface` sidecar
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-005
    statement: 4. Verify `allow_all_skills` / `allowed_callers`
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-006
    statement: 5. Match caller argv against declared `patterns`
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-007
    statement: 6. Resolve the private file `binding`
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-008
    statement: 7. Execute the interface without depending on the caller's working directory
  - kind: rule
    id: skill-guidelines.dispatcher-role.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'The pattern-based approach enables compile-time validation: git hooks verify

        that only allowed skills can export restricted interfaces, catching misuse

        before deployment rather than only at runtime.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.dispatcher-role.guidance-009
    statement: 'Use `--dry-run` to inspect the resolved invocation without executing it:'
  - kind: guidance
    id: skill-guidelines.dispatcher-role.example-001
    statement: "```bash\ndispatcher --dry-run --caller-skill daily-plan \\\n  list-manager.machine.read-list /tmp/todo.yaml\n```"
  - kind: rule
    id: skill-guidelines.dispatcher-role.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Every `DispatchCall(...)` declaration must include `caller_skill` set to the

        owning skill''s exact name; that value must be a string literal or a module-level

        string constant that resolves statically.'
      atomicity: pending
- kind: family
  id: skill-guidelines.private-runtime-files
  title: Private runtime files
  children:
  - kind: guidance
    id: skill-guidelines.private-runtime-files.guidance-001
    statement: '**Private runtime files**'
  - kind: rule
    id: skill-guidelines.private-runtime-files.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Skill implementation files live under the private runtime-execution package

        `skills/<skill-name>/_rtx/`. `_rtx` is an implementation namespace, not public

        documentation vocabulary. Public skill docs must describe interfaces, not

        runtime files.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.private-runtime-files.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Every non-exempt file or package directory under `_rtx/` must use a private

        multi-part stem. The rule cascades through nested packages: every directory

        component below `_rtx/` and every runtime filename stem must match the same

        private naming convention.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.private-runtime-files.example-001
    statement: '```text

      _rtx/_Calendar_Gateway.py

      _rtx/_mail_transport.py

      _rtx/_install_launcher/_windows_launcher.py

      ```'
  - kind: rule
    id: skill-guidelines.private-runtime-files.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Every private directory name and every runtime filename stem must match:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.private-runtime-files.example-002
    statement: '```regex

      ^_[A-Za-z0-9]+(?:_[A-Za-z0-9]+)+$

      ```'
  - kind: rule
    id: skill-guidelines.private-runtime-files.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: 'That means each private runtime path component starts with `_` and has at

        least two underscore-separated segments after it. Case is allowed, but

        case-only path collisions are forbidden among siblings. `__init__.py` is the

        only exempt package marker; package directories themselves are not exempt. The

        allowed runtime file suffix list currently contains `.py`; add to that list

        deliberately only if this policy is relaxed later.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.private-runtime-files.requirement-005
    assertions:
    - id: source-block
      modality: required
      statement: 'Skill-facing Markdown (`SKILL.md` and skill-local Markdown outside tests and

        assets) must not mention:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.private-runtime-files.guidance-002
    statement: '- `_rtx`'
  - kind: guidance
    id: skill-guidelines.private-runtime-files.guidance-003
    statement: '- runtime filenames ending in an allowed runtime suffix such as `.py`'
  - kind: guidance
    id: skill-guidelines.private-runtime-files.guidance-004
    statement: "- normalized forms of private runtime stems, such as `_Calendar_Gateway`,\n  `Calendar_Gateway`, `calendar gateway`, or `calendar-gateway`"
  - kind: rule
    id: skill-guidelines.private-runtime-files.requirement-006
    assertions:
    - id: source-block
      modality: required
      statement: 'Blueprints bind public interface names to private runtime modules. Tests,

        validators, and migration/design docs may mention runtime file details when

        they are defining or checking the convention.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.private-runtime-files.guidance-005
    statement: 'This is mechanically checked by `validators/skill_runtime_files.py` and

      `validators/skill_runtime_doc_references.py`, plus

      `skills/skill-maker/validators/skill_body_execution.py` for executable-file

      references used in execution contexts in hand-authored `SKILL.md` bodies, with

      behavior tests in

      `tests/validate_skill_runtime_files.py` and

      `tests/validate_skill_runtime_doc_references.py`, and

      `tests/validate_skill_body_execution.py`.'
- kind: family
  id: skill-guidelines.import-discipline
  title: Import discipline
  children:
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-001
    statement: '**Import discipline**'
  - kind: rule
    id: skill-guidelines.import-discipline.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Skill Python files may import only:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-002
    statement: '- relative modules from their own skill-local `_rtx/` package'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-003
    statement: '- first-party shared packages under `src/officina/`'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-004
    statement: '- stdlib and approved third-party packages'
  - kind: rule
    id: skill-guidelines.import-discipline.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'They must not import:'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-005
    statement: '- another skill''s Python modules directly'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-006
    statement: '- repo-maintainer packages outside `src/officina/`'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-007
    statement: "- another skill's runtime directory through `sys.path`, path loading, or\n  dynamic module tricks"
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-008
    statement: 'This is the intended model:'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-009
    statement: '- local reuse inside one skill: relative imports'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-010
    statement: '- generic shared infrastructure: `officina.*`'
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-011
    statement: "- cross-skill behavior: declared `DispatchCall` entries plus\n  `PythonMachineInterface.dispatch()`"
  - kind: guidance
    id: skill-guidelines.import-discipline.guidance-012
    statement: 'The dispatch discipline is mechanically checked by

      `skills/skill-maker/validators/dispatcher_usage.py` and

      `skills/skill-maker/validators/dispatch_caller_skill.py`.'
  - kind: rule
    id: skill-guidelines.import-discipline.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Because machine interfaces run with the skill root on `PYTHONPATH`, modules

        under `_rtx/` may use relative imports to share same-skill helpers. Nested

        runtime packages are allowed only when their directory names and file stems

        follow the cascading private `_rtx/` naming rule above.'
      atomicity: pending
- kind: family
  id: skill-guidelines.toml-io-boundary
  title: TOML IO boundary
  children:
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.guidance-001
    statement: '**TOML IO boundary**'
  - kind: rule
    id: skill-guidelines.toml-io-boundary.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Production Python code must not construct, read, write, or parse TOML files

        directly. TOML filenames are a controlled boundary because host-specific paths

        and TOML string escaping interact badly when callers hand-roll config text.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.guidance-002
    statement: 'Use the shared TOML IO boundary:'
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.example-001
    statement: "```python\nfrom officina.common import toml_io\n\nwith toml_io.open(base_dir, \"settings.toml\", \"r\") as f:\n    settings_text = f.read()\n\nwith toml_io.open(base_dir, f\"{name}.settings.toml\", \"w\") as f:\n    f.write(settings_text)\n```"
  - kind: rule
    id: skill-guidelines.toml-io-boundary.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Outside `src/officina/common/toml_io.py`, a `.toml` filename may appear only as

        the direct filename argument to `toml_io.open(...)`. Do not build TOML filenames

        through variables, concatenation, `Path(...)`, `/` path joins, `open(...)`,

        `.read_text(...)`, `.write_text(...)`, `tomllib`, or ad hoc regex/string

        rewrites. If a caller needs a reusable TOML filename or discovery rule, add a

        named helper under `src/officina/common/` and keep filename construction there.

        When the helper is specific to a host or platform, give the helper file a

        matching platform name and include `toml` in the filename, such as

        `codex_toml.py`, so both the TOML boundary and platform-neutral boundary stay

        explicit.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.toml-io-boundary.guidance-003
    statement: '`toml_io.open(...)` owns UTF-8 text mode, filename validation, and parse

      validation after writes. This rule is enforced by

      `validators/toml_io_boundary.py`, with behavior tests in

      `tests/validate_toml_io_boundary.py`.'
- kind: family
  id: skill-guidelines.subprocess-text-boundaries
  title: Subprocess text boundaries
  children:
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.guidance-001
    statement: '**Subprocess text boundaries**'
  - kind: rule
    id: skill-guidelines.subprocess-text-boundaries.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'Production Python code that asks `subprocess` for text must set both

        `encoding` and `errors` explicitly on that call. Binary subprocess use is fine

        when callers intentionally handle bytes themselves.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.guidance-002
    statement: 'Use UTF-8 strict for project-owned/user-facing text:'
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.example-001
    statement: "```python\nsubprocess.run(\n    cmd,\n    capture_output=True,\n    text=True,\n    encoding=\"utf-8\",\n    errors=\"strict\",\n    check=False,\n)\n```"
  - kind: rule
    id: skill-guidelines.subprocess-text-boundaries.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'For byte streams whose contract is not ordinary text, keep binary mode and

        decode explicitly at the boundary with the correct error policy. For git

        path-list output, use UTF-8 with `surrogateescape` so unusual filenames remain

        round-trippable.'
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.subprocess-text-boundaries.guidance-003
    statement: 'The shared dispatcher owns this boundary for machine-interface calls: text-mode

      dispatcher invocations use UTF-8 strict in the parent process, and Python module

      runtimes get `PYTHONIOENCODING=utf-8:strict` in the child environment. This is

      enforced by `validators/subprocess_text_encoding.py`, with behavior tests in

      `tests/test_officina_dispatcher.py` and

      `tests/validate_subprocess_text_encoding.py`.'
- kind: family
  id: skill-guidelines.injection-lifecycle
  title: Injection lifecycle
  children:
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-001
    statement: '**Injection lifecycle**'
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-002
    statement: '`../../skills/skill-maker/_rtx/_blueprint_syncer.py` injects and refreshes the

      generated artifacts for blueprint skills:'
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-003
    statement: "- the generated contract block placed immediately after the YAML frontmatter in\n  `SKILL.md`"
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-004
    statement: "- the generated owner-facing interface sections placed immediately after the\n  contract block"
  - kind: guidance
    id: skill-guidelines.injection-lifecycle.guidance-005
    statement: "- repo-level manifests such as\n  `references/blueprint/runtime_dependencies.json`"
  - kind: rule
    id: skill-guidelines.injection-lifecycle.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: 'That generated content is not user-authored. Do not edit it by hand. These

        checks are enforced on every commit by `validators/runner.py` (called from

        `.githooks/pre-commit`) via the skill-maker validators.'
      atomicity: pending
- kind: family
  id: skill-guidelines.skill-taxonomy
  title: 2. Skill taxonomy
  children:
  - kind: rule
    id: skill-guidelines.skill-taxonomy.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**2. Skill taxonomy** \u2014 declare `category`, `role`, and `kind` in\n`blueprint.yaml`. Each must be one of the typed enum values in\n`references/blueprint/schema.json`. `category` remains compatibility metadata\nduring the migration; `role` and `kind` are the user-facing documentation and\ngraph taxonomy."
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.skill-taxonomy.guidance-001
    statement: 'For `research-assistant` skills applied to `.tex` files: check whether a

      top-of-document profile comment exists before proceeding; if not, use

      `make-tex-docstring` first.'
- kind: family
  id: skill-guidelines.personal-override-structure
  title: 3. `my-X` naming and structure
  children:
  - kind: rule
    id: skill-guidelines.personal-override-structure.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**3. `my-X` naming and structure** \u2014 a personal override of upstream skill `X`\nis named `my-X`. Every `my-X` skill must follow this layout:"
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.personal-override-structure.guidance-001
    statement: '- Personal overrides and additions at the top.'
  - kind: rule
    id: skill-guidelines.personal-override-structure.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: "- Then a **REQUIRED \u2014 NON-NEGOTIABLE** instruction to invoke the original `X`\n  skill at the bottom."
      atomicity: pending
- kind: family
  id: skill-guidelines.suggested-permissions
  title: 4. `suggested_permissions`
  children:
  - kind: rule
    id: skill-guidelines.suggested-permissions.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**4. `suggested_permissions`** \u2014 permission suggestions live in\n`blueprint.yaml`, not in per-skill sidecar files. `suggested_permissions` is\nadvisory, not a grant. It should explain what is safe and useful to pre-approve\nfor smoother execution. Do not cascade another skill's suggested permissions\nhere; declare the actual interface edge in `uses_interfaces` and let permission\ntooling derive transitive grants from the interface graph."
      atomicity: pending
- kind: family
  id: skill-guidelines.trigger-description
  title: 5. Frontmatter `description:` is a trigger declaration, not a summary
  children:
  - kind: rule
    id: skill-guidelines.trigger-description.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**5. Frontmatter `description:` is a trigger declaration, not a summary** \u2014\nwrite it as \"Use when...\" followed by the triggering conditions and symptoms\nthat signal this skill applies. Never summarize the workflow, steps, or outputs\nin the description."
      atomicity: pending
- kind: family
  id: skill-guidelines.output-focused-writing
  title: 6. Output-focused, terse writing
  children:
  - kind: guidance
    id: skill-guidelines.output-focused-writing.guidance-001
    statement: "**6. Output-focused, terse writing** \u2014 specify what to invoke and how to\ninterpret output. Implementation internals belong in tool/script docs, not\n`SKILL.md`. Every line earns its place."
- kind: family
  id: skill-guidelines.canonical-blueprint-ownership
  title: 7. The canonical blueprint graph owns all interface definitions
  children:
  - kind: rule
    id: skill-guidelines.canonical-blueprint-ownership.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**7. The canonical blueprint graph owns all interface definitions** \u2014 the root\nowns skill-level facts and points to neighbors; every subordinate blueprint\nowns its own facts and points to its direct neighbors. A node never repeats a\nneighbor's intrinsic information. The generated interface blocks in `SKILL.md`\nare derived views of that graph. The skill body must not restate, re-explain,\nor re-invoke any interface. Specifically:"
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.canonical-blueprint-ownership.guidance-001
    statement: "- a machine sidecar's `description` describes what the machine interface\n  does."
  - kind: guidance
    id: skill-guidelines.canonical-blueprint-ownership.guidance-002
    statement: "- its `usage` provides the complete invocation argument\n  template."
  - kind: guidance
    id: skill-guidelines.canonical-blueprint-ownership.guidance-003
    statement: "- `patterns[*].notes` gives mode-specific detail where multiple calling modes\n  exist."
  - kind: rule
    id: skill-guidelines.canonical-blueprint-ownership.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: "- an additional LLM sidecar documents its bound instruction file and\n  description, but never a dispatcher invocation; the default interface is\n  documented by the root's `default_interface`."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.canonical-blueprint-ownership.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: "- The skill body references interface names only \u2014 it never shows\n  `dispatcher --caller-skill` invocations or runtime file paths."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.canonical-blueprint-ownership.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: The generated blocks must be sufficient for a first-attempt correct invocation.
      atomicity: pending
  - kind: rule
    id: skill-guidelines.canonical-blueprint-ownership.requirement-005
    assertions:
    - id: source-block
      modality: required
      statement: '**Interfaces that require runtime state should say so explicitly in the skill

        body.** When an operation depends on information only available at call time,

        the skill body must instruct the model to read that state first.'
      atomicity: pending
- kind: family
  id: skill-guidelines.change-publication-workflow
  title: 8. Commit and push after every skill change
  children:
  - kind: guidance
    id: skill-guidelines.change-publication-workflow.guidance-001
    statement: "**8. Commit and push after every skill change** \u2014 when a skill is created or\nmodified and the result is complete, show the user the diff and ask for\nconfirmation before committing. Once confirmed, stage the changed files,\ncommit, and push to `origin`."
- kind: family
  id: skill-guidelines.system-evolution
  title: "9. Skills are components in an evolving system \u2014 design accordingly."
  children:
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-001
    statement: "**9. Skills are components in an evolving system \u2014 design accordingly.**"
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-002
    statement: "- **Reuse, don't reimplement.** Before writing new behavior, check whether an\n  existing skill already covers it. If yes, invoke or extend that skill."
  - kind: rule
    id: skill-guidelines.system-evolution.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "- **Depend on interfaces, not internals.** There are only two valid\n  cross-skill boundaries:"
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-003
    statement: '  - invoke the dependency skill as a skill'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-004
    statement: "  - call the dependency skill's exported machine interface through `dispatcher`\n    or a declared `DispatchCall` used by `PythonMachineInterface.dispatch()`"
  - kind: rule
    id: skill-guidelines.system-evolution.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: "- **Do not introduce new cross-skill Python imports.** If behavior should be\n  shared across skills, expose it through a skill invocation, exported machine\n  interface, or a first-party shared package under `src/officina/`."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.system-evolution.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: '- **Do not reach into another skill''s runtime directory from local runtime code.**'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.system-evolution.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: "- **Keep SKILL.md references local.** Paths in `SKILL.md` must be relative. A\n  skill may refer to files under its own directory, to shared `../references/`\n  material, and to shared repo tools under `../../tools/`. It must not mention\n  parent-path addresses such as `../other-skill/...`, `../../skills/...`, or\n  any absolute filesystem path to another skill."
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-005
    statement: "- **Make your own interface explicit.** State what inputs your skill expects\n  and what outputs it produces. For blueprint skills:"
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-006
    statement: '  - `skill_interface` describes the skill-level contract'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-007
    statement: '  - `machine-interface` sidecars describe dispatcher-callable interfaces'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-008
    statement: "  - root `default_interface` describes the default LLM-facing interface, while\n    `llm-interface` sidecars describe additional named LLM-facing interfaces"
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-009
    statement: '  - `direct_io` describes immediate semantic IO for each interface'
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-010
    statement: "  - `owns_filesystem` declares interface-owned filesystem paths and permitted\n    readers"
  - kind: guidance
    id: skill-guidelines.system-evolution.guidance-011
    statement: '  - `version` on each interface is the major version of that public contract'
- kind: family
  id: skill-guidelines.runtime-code-boundary
  title: "10. No code in SKILL.md \u2014 runtime files only, with one exception"
  children:
  - kind: rule
    id: skill-guidelines.runtime-code-boundary.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**10. No code in SKILL.md \u2014 runtime files only, with one exception** \u2014 skill files\nmust not contain executable code logic. Any logic belongs in a dedicated file\nunder `_rtx/`, except when the skill's purpose is to provide an interface to\na specific external tool and that tool is declared in frontmatter `tools:`.\nHand-authored `SKILL.md` bodies must also avoid executable-file names and paths\nin execution contexts, such as `run tmp.py`, `python helper.py`, `use\ninstall.sh`, or `launch tool.exe`. If normal operation requires execution, put\nthe mechanics behind a blueprint machine interface and refer to the interface\nname and outcome in prose. Generated blueprint interface blocks may contain\ninvocation details because they are owned by `blueprint.yaml`.\nOpaque `_cx/...` paths are forbidden anywhere in the hand-authored body, even\noutside an explicit execution sentence."
      atomicity: pending
- kind: family
  id: skill-guidelines.state-ownership
  title: 11. State data lives under the skill's directory
  children:
  - kind: rule
    id: skill-guidelines.state-ownership.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**11. State data lives under the skill's directory** \u2014 any persistent state a\nskill writes must be stored under the skill's own directory, not under system\ndirectories or elsewhere outside the skills tree."
      atomicity: pending
- kind: family
  id: skill-guidelines.sensitive-configs
  title: 12. Sensitive configs live under `~/.config/<skill-name>/`
  children:
  - kind: rule
    id: skill-guidelines.sensitive-configs.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**12. Sensitive configs live under `~/.config/<skill-name>/`** \u2014 passwords,\nAPI keys, OAuth tokens, and credentials must go there, never under the skill\ndirectory."
      atomicity: pending
- kind: family
  id: skill-guidelines.cross-platform-tools
  title: 13. Prefer widely available, cross-platform tools at every layer
  children:
  - kind: rule
    id: skill-guidelines.cross-platform-tools.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: "**13. Prefer widely available, cross-platform tools at every layer** \u2014\nlanguage, runtime, and any external tools invoked. Skills must work out of the\nbox across Linux, macOS, and Windows on machines other than your own."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.cross-platform-tools.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: 'Shared code under `src/officina/common/` must be host-neutral by default. Put

        repo-wide policy there only when more than one skill can plausibly need the

        same boundary, and keep the surface thin: validation, naming, error

        normalization, and test seams are appropriate; product-specific behavior is

        not. Prefer a mature cross-platform adapter over per-host in-house

        implementations when the adapter delegates to the host facility. For example,

        `officina.common.secret_store` owns the repo contract for small local secrets

        and delegates storage to Python `keyring`; skills should call that wrapper

        instead of importing `keyring` directly or shelling out to host-specific

        credential commands.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.cross-platform-tools.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: 'Date and time formatting at IO boundaries must avoid host-specific formatting

        extensions. In Python, do not use GNU/POSIX-only or Windows-only `strftime`

        padding modifiers such as `%-m`, `%-d`, `%#m`, or `%#d`. Put shared date/time

        storage and display formats in the first-party helpers under

        `officina.common.dates` instead of retyping ad hoc formatting logic in each

        skill. This is mechanically checked by `validators/portable_dates.py`.'
      atomicity: pending
- kind: family
  id: skill-guidelines.assistant-neutrality
  title: 14. Shared skill content must stay neutral about which specific AI-assistant host it runs under, and must mention operating systems only in explicit platform-support metadata or platform-named implementation files.
  children:
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-001
    assertions:
    - id: source-block
      modality: required
      statement: '**14. Shared skill content must stay neutral about which specific AI-assistant

        host it runs under, and must mention operating systems only in explicit

        platform-support metadata or platform-named implementation files.** Enforced by

        `validators/platform_neutral.py`.'
      atomicity: pending
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-002
    assertions:
    - id: source-block
      modality: required
      statement: "- `SKILL.md` and any generically named runtime file must not name a specific\n  host or operating system."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-003
    assertions:
    - id: source-block
      modality: required
      statement: "- authored blueprint files may name operating systems only in structured\n  `platform_support` and dependency `platforms` metadata. Do not put\n  platform-specific prose or implementation guidance in generic blueprint\n  fields."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-004
    assertions:
    - id: source-block
      modality: required
      statement: "- Blueprint schema documentation and blueprint validation/sync tooling may name\n  the allowed platform keys because they define and enforce that metadata."
      atomicity: pending
  - kind: guidance
    id: skill-guidelines.assistant-neutrality.guidance-001
    statement: "- If a skill or shared package genuinely needs platform-specific logic, put\n  that logic in a file whose own filename names the platform, such as\n  `claude`, `codex`, `windows`, `osx`, or `linux`."
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-005
    assertions:
    - id: source-block
      modality: required
      statement: "- A small cross-platform adapter may temporarily dispatch to platform-specific\n  commands while a backend split is pending, but new platform-specific command\n  bodies should live in platform-named files."
      atomicity: pending
  - kind: rule
    id: skill-guidelines.assistant-neutrality.requirement-006
    assertions:
    - id: source-block
      modality: required
      statement: "- `__init__.py` remains the conventional aggregation seam for\n  platform-specific modules. It may import platform-named files and re-export\n  a host-neutral API for the rest of the codebase."
      atomicity: pending
- kind: family
  id: skill-guidelines.validator-test-conventions
  title: Validator and test conventions
  children:
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-001
    statement: '## Validator and test conventions'
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-002
    statement: 'Conformance checks run on every commit via `validators/runner.py` (called from

      `.githooks/pre-commit`). The runner auto-discovers two packages:'
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-003
    statement: "- **`validators/`** \u2014 repo-wide checks"
  - kind: guidance
    id: skill-guidelines.validator-test-conventions.guidance-004
    statement: "- **`skills/skill-maker/validators/`** \u2014 skill-system checks"
- kind: family
  id: skill-guidelines.adding-validator
  title: Adding a new validator
  children:
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-001
    statement: '### Adding a new validator'
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-002
    statement: "1. Create `validators/<name>.py` or\n   `skills/skill-maker/validators/<name>.py`."
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-003
    statement: '2. Export exactly one function: `validate(repo_root: Path) -> list[str]`.'
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-004
    statement: 3. Optionally add a `main()` so it can be run standalone.
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-005
    statement: "4. Add a `tests/validate_<name>.py` with at least a pass case and a fail case.\n   Use `pytest` conventions (plain functions, `tmp_path` fixture for\n   isolation). Load the validator via `importlib.util.spec_from_file_location`\n   rather than importing it as a package."
  - kind: guidance
    id: skill-guidelines.adding-validator.guidance-006
    statement: "The runner picks up the new file automatically \u2014 no registration needed."
- kind: family
  id: skill-guidelines.test-file-conventions
  title: Test file conventions
  children:
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-001
    statement: '### Test file conventions'
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-002
    statement: '- Validator tests live in `tests/validate_<name>.py`.'
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-003
    statement: '- Behavior tests live in `skills/<skill-name>/tests/`.'
  - kind: guidance
    id: skill-guidelines.test-file-conventions.guidance-004
    statement: "- Use `importlib.util.spec_from_file_location` to load validators in tests \u2014\n  avoids package naming collisions and works regardless of working directory."
