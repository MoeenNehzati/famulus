# Human-readable format contract consumed by `officina.docstring`.
# Canonical policy filename for docstring controls.
#
# Purpose
#   This file contains only semantic policy (what code and docs should assert).
#   Syntax and parsing constraints are enforced in `docstring.standard.lark`.
#   It is intentionally declarative so repository-specific enforcement can be
#   changed without editing parser/validator logic where possible.
#
# Naming and versioning
#   `docstring_format_version` should be bumped whenever this policy shape
#   changes in a way that can affect docstring quality checks.
#   `name` is used as an identifier in diagnostics and docs.
docstring_format_version: 31
# Stable contract identifier used by tooling outputs and diagnostics.
name: docstring_format
# If true, required settings are enforced and surface as warnings.
# If false, required settings are treated as defaults.
strict: true

# Cookbook and validation examples.
#
# Examples are not required by the schema validator and are retained for docs only.
examples: {}

# Settings for callable/class/function/method docstrings.
callable:
  # A short top-of-docstring explanation is required.
  required_summary: true
  # Keep summaries concise but meaningful for quick intent.
  summary_min_chars: 20
  summary_max_chars: 240
  # Rationale should carry semantic purpose, not just a restatement.
  rationale_min_chars: 45
  rationale_max_chars: 1200
  # Catch placeholder phrases that do not help readers understand behavior.
  forbidden_summary_phrases:
    - "what does this do"
    - "todo"
    - "tbd"
    - "placeholder"
    - "implement me"
    - "to be implemented"
    - "documents the certifier control point"
    - "repo-visible dependencies"
    - "performs or represents the certification operation described by its inputs and outputs"
    - "operation described by its inputs and outputs"
    - "data carried between certification stages"
    - "handles certification data or control flow for this module"
  forbidden_intent_phrases:
    - "dependency declarations that the docstring graph can parse"
    - "docstring graph can parse"
    - "static dependency validation"
    - "compact docstrings whose declared calls and product dependencies stay aligned"
    - "operation described by its inputs and outputs"
    - "data carried between certification stages"
    - "boundary keeps its certification responsibility separate from adjacent repository steps"
  forbidden_rationale_phrases:
    - "this callable exists to implement the behavior described in its contract documentation"
    - "this callable exists to implement the behavior described in the contract documentation"
    - "implemented as described in the contract documentation"
    - "implemented as described in contract documentation"
    - "callable semantics explicit and auditable"
    - "dependency declarations that the docstring graph can parse"
    - "docstring graph can parse"
    - "static dependency validation"
    - "compact docstrings whose declared calls and product dependencies stay aligned"
    - "operation described by its inputs and outputs"
    - "combines repository evidence and helper results to produce or validate certification state"
    - "keeps repository evidence checks separate from payload assembly and signing"
  forbidden_pseudocode_phrases:
    - "execute the implementation steps described in source code"
    - "implementation steps described in source code"
    - "same as source code"
    - "return result"
    - "immutable_record = constructor_fields"
    - "value = @"
    - "out = @"
    - "(args)"
    - "(state)"

  # Sections that must be present for every validated callable docstring.
  # `Intent` is the behavioral goal, and `Rationale` is the reason it does it
  # (preferred over older `Graph`/`Role` naming).
  required_sections:
    - Intent
    - Rationale
    - Pseudocode
    - Wraps

  # Additional optional callable sections that are retained by parser/validator tooling.
  optional_sections:
    - Graph
    - Role
    - Phase
    - NonInferableCalls
    - Wraps
    - Owns
    - Parameters
    - Returns
    - Raises
    - Attributes
    - Pseudocode
    - Resources
    - Dataflow
    - CallsFromRepo
    - InstantiationsFromRepo
    - Dispatches

  pseudocode:
    section: Pseudocode
    min_steps: 1
    max_steps: 16
    max_step_chars: 140
    max_total_chars: 640
  # Strict Pseudocode is a compact execution sketch language, not prose.
  # Every bullet is one graph node; every sigil resolves to one declared
  # dependency; every indent creates a control edge.
  #
  # Supported operation forms:
  #   - ``name = @ref(args)`` or ``@ref(args)`` for CallsFromRepo
  #   - ``name = #ref(args)`` or ``#ref(args)`` for Dispatches
  #   - ``name = Ref(args)``, ``return Ref(args)``, ``raise Ref(args)``,
  #     or ``yield Ref(args)`` for InstantiationsFromRepo product edges
  #   - ``set name = expression`` for local computation
  #   - ``read resource_id`` / ``write resource_id`` for Resources
  #   - ``if condition:``, ``while condition:``, ``for name in expression:``,
  #     and ``else:`` for control structure
  #   - ``return expression``, ``raise expression``, ``continue``, ``break``
  #
  # Dependency refs use exact match first, then unique dot-segment suffix match
  # inside the sigil-selected bucket. Old ``@Section:name`` markers are invalid.
  dependency_reference_sections: []

  # Dependency section names and local portability roots are loaded from
  # `src/officina/docstring/config.yaml`. The standard names below are
  # canonical defaults; config produces the effective runtime policy.
  #
  # Canonical dependency sections use YAML-like trees with `why:` leaves.
  # CallsFromRepo and InstantiationsFromRepo are repo-only sections: stdlib and
  # third-party helpers must be omitted rather than documented as repo
  # dependencies. Dependency paths/ids must either start with `.` for relative
  # repo paths or start with an allowed absolute root from config.allowed_abs.
  #
  # CallsFromRepo documents operational dependencies. InstantiationsFromRepo
  # documents product dependencies: dependencies whose returned/raised value is
  # carried forward as a semantic value, result, error, copy, serialization, or
  # container. It is not limited to class constructors. Small-function profiles
  # may enable `docstring.instantiation-product-unshown` to require every
  # declared product edge to appear in constructor/product pseudocode form; large
  # orchestration functions can remain compact by documenting the product edge
  # in InstantiationsFromRepo without listing every product in Pseudocode.
  module_dependencies:
    calls_section: CallsFromRepo
    instantiates_section: InstantiationsFromRepo
    dispatches_section: Dispatches
    allow_implicit: true
    require_why: true
    dependency_why:
      misc_min_chars: 80
      actions:
        - reads
        - writes
        - transforms
        - validates
        - constructs
        - dispatches
        - serializes
        - parses
        - computes
        - orchestrates
        - raises
        - misc
      # Logical section keys used after section-name config is applied.
      section_actions:
        calls:
          - reads
          - writes
          - validates
          - parses
          - computes
          - orchestrates
          - transforms
          - dispatches
          - serializes
          - misc
        instantiations:
          - constructs
          - raises
          - transforms
          - serializes
          - misc
        dispatches:
          - dispatches
    pseudocode_quality:
      forbidden_variables:
        - value
        - out
        - state
        - args
        - data
      require_assigned_dependency_output_use: false
    repeated_template_detection:
      enabled: false
      min_repetitions: 3
      min_normalized_chars: 40
    forbidden_why_phrases:
      - "observed call dependency"
      - "observed product dependency"
      - "observed dependency"
      - "docstring graph can parse"
      - "repo-visible dependencies"
      - "static dependency validation"
      - "provides the named helper operation needed by function"
      - "supplies the dependency result used by function"
      - "to complete its certification step"
      - "creates the value or error object required by function"
      - "creates the value or error object required by method"
      - "creates the typed object needed to carry this operation's structured result or failure"
      - "checks the relevant certification invariant before the next phase proceeds"
    validate_declared_calls: true
    validate_declared_instantiations: true
    validate_declared_dispatches: true
    report_unlisted_calls: true
    report_unlisted_instantiations: true
    ignore_non_external: true
    validate_dependency_targets_resolved: true
    enforce_declared_dependency_pseudocode_coverage: false
    enforce_observed_dependency_pseudocode_coverage: false

  # Wrapper-exposure policy for ``Wraps`` entries.
  # Accepted example:
  #   target -> preprocess: <text>; postprocess: <text>; fixed_arguments: <text>
  # Use ``none`` when a callable is not a wrapper.
  # A callable that directly returns or forwards one repo call must declare that
  # edge here; one-repo-call bodies that are not clear wrappers are reviewer
  # warnings so authors explicitly decide whether a wrapper edge is missing.
  wraps:

  # Ownership policy for ``Owns`` entries.
  ownership:
    # Docstring section that lists ownership.
    section: Owns
    # If true, ownership missing causes validation warning.
    section_required: false
    # If false, only one ownership entry is expected per callable.
    allows_multiple: false
    # If true, ownership implies primary semantic responsibility.
    single_owner_per_callable: true
    # How owner ids are resolved (`module:Ownable`).
    owner_resolution: module:Ownable
    # Cross-file ownership support configuration.
    cross_file:
      # Toggle cross-file owner resolution.
      enabled: true

# Settings for module-level pipeline metadata (`GraphPipeline`).
pipeline:
  # If true, module docstrings must define a `GraphPipeline` block.
  required: false
  # Required pipeline sections.
  required_sections:
    - Phases
    - PhaseMembers
  # Optional pipeline sections used by visualization and audit.
  optional_sections:
    - PhaseEdges
    - NonInferableCalls
    - Description

# Settings for module-level metadata and ownership registry.
module:
  # If true, module metadata is required to pass strict checks.
  required: false
  # Module summary required under strict module checks.
  required_summary: true
  # Required sections that describe module composition.
  required_sections:
    - Includes
  # Optional sections used for module orchestration and traceability.
  optional_sections:
    - Workflow
    - Traces
    - Description
    - Ownable

  # Optional table of owner definitions available for the module.
  ownership_registry:
    # Section that lists owned capabilities.
    section: Ownable
    # Multiple owner entries may be declared in this section.
    allows_multiple: true

# Checks are enforced by checker code; this catalog is for reviewer orientation.
check_categories:
  formatting:
    - code: docstring.formatting
      intent: Generic parser/syntax-level warning bucket.
    - code: docstring.empty
      intent: Docstring body is empty.
    - code: docstring.invalid-owns
      intent: Owns section is malformed.
    - code: docstring.owns-too-many
      intent: Too many ownership declarations were provided.
    - code: docstring.invalid-edge
      intent: Edge expression does not match expected syntax.
    - code: docstring.invalid-section
      intent: Docstring section header is malformed or unknown.
    - code: docstring.invalid-section-header
      intent: Known section was written as a YAML key instead of a docstring section header.
    - code: docstring.duplicate-section
      intent: Duplicate section declaration was found.
    - code: docstring.invalid-wraps
      intent: Wraps line could not be parsed.
    - code: docstring.invalid-module-dependency
      intent: Dependency declaration tree or non-structured dependency reference cannot be parsed.
    - code: docstring.invalid-resource
      intent: Resources section declaration cannot be parsed or lacks required fields.
    - code: docstring.invalid-dataflow
      intent: Dataflow section declaration cannot be parsed or lacks required fields.
    - code: docstring.absolute-dependency-not-allowed
      intent: Dependency path/id is neither leading-dot relative nor rooted in config.allowed_abs.
    - code: docstring.dependency-why-action
      intent: Dependency rationale lacks exactly one graphable action key.
    - code: docstring.instantiation-why-action
      intent: InstantiationsFromRepo rationale uses an operation action instead of a product action.
    - code: docstring.instantiation-product-unshown
      intent: InstantiationsFromRepo target is not shown in Pseudocode as an assigned/returned/raised/yielded product.
    - code: docstring.dependency-section-overlap
      intent: One dependency target appears in multiple priority-ranked dependency sections.
    - code: docstring.repeated-template
      intent: Repeated normalized prose template appears across callable docstrings.
    - code: docstring.invalid-pseudocode
      intent: Pseudocode line is not in a parser-recognized format.
    - code: docstring.pseudocode-control-empty
      intent: Pseudocode control line has no indented body.
    - code: docstring.pseudocode-else-unmatched
      intent: Pseudocode else block does not immediately follow a matching if block.
    - code: docstring.pseudocode-loop-control-outside-loop
      intent: Pseudocode break/continue appears outside a for/while block.
    - code: docstring.pseudocode-ref-unresolved
      intent: Typed pseudocode dependency ref matches no declared dependency.
    - code: docstring.pseudocode-ref-ambiguous
      intent: Typed pseudocode dependency ref matches multiple declared dependencies.
    - code: docstring.pseudocode-resource-unresolved
      intent: Pseudocode read/write references an undeclared resource.
    - code: docstring.pseudocode-placeholder-variable
      intent: Pseudocode dependency output uses a generic placeholder variable.
    - code: docstring.pseudocode-placeholder-argument
      intent: Pseudocode dependency call uses generic placeholder inputs.
    - code: docstring.pseudocode-output-unused
      intent: Pseudocode dependency output is not used by later pseudocode.
    - code: docstring.pseudocode-step-min
      intent: Pseudocode has too few steps.
    - code: docstring.pseudocode-step-length
      intent: Pseudocode step is too long.
    - code: docstring.pseudocode-step-cap
      intent: Too many pseudocode steps.
    - code: docstring.pseudocode-total-length
      intent: Total pseudocode block is too long.
    - code: docstring.section-missing
      intent: A required docstring section is missing.
    - code: docstring.summary-missing
      intent: Summary text is missing.
    - code: docstring.summary-forbidden
      intent: Summary contains placeholder or prohibited phrasing.
    - code: docstring.intent-forbidden
      intent: Intent contains placeholder, tooling-facing, or prohibited phrasing.
    - code: docstring.summary-length
      intent: Summary length is outside the configured bounds.
    - code: docstring.rationale-forbidden
      intent: Rationale contains placeholder or prohibited phrasing.
    - code: docstring.rationale-length
      intent: Rationale length is outside the configured bounds.
    - code: docstring.pseudocode-forbidden
      intent: Pseudocode uses placeholder or prohibited phrasing.
    - code: docstring.dependency-why-forbidden
      intent: Dependency rationale contains placeholder or mechanical phrasing.
    - code: docstring.missing-graphpipeline
      intent: Pipeline docstring block is required but missing.
  behavioral:
    - code: docstring.invalid-wraps
      intent: Wraps line could not be parsed.
    - code: docstring.missing
      intent: Callable/class/function body has no docstring.
    - code: docstring.module-missing
      intent: Module docstring is missing.
    - code: docstring.unknown-owner
      intent: Owns declaration resolves to no known owner.
    - code: docstring.crossfile-owner-disabled
      intent: Owns declaration points to another module while cross-file ownership is off.
    - code: docstring.module-dependency-not-observed
      intent: Declared dependency is not seen in function body.
    - code: docstring.module-dependency-undocumented
      intent: Observed dependency is not declared in docs.
    - code: docstring.module-dependency-unresolved
      intent: Declared dependency cannot be resolved to imports/local symbols.
    - code: docstring.dispatch-not-observed
      intent: Declared dispatch id is not seen in dispatcher call literals.
    - code: docstring.dispatch-undocumented
      intent: Observed dispatcher call literal is not declared in Dispatches.
    - code: docstring.dispatch-unresolved
      intent: Declared dispatch id does not match a known public interface id.
    - code: docstring.absolute-dependency-not-allowed
      intent: Dependency path/id is neither leading-dot relative nor rooted in config.allowed_abs.
    - code: docstring.repo-dependency-not-repo
      intent: CallsFromRepo or InstantiationsFromRepo names stdlib/third-party code instead of repo-local logical dependencies.
    - code: docstring.wraps-missing-thin-wrapper
      intent: Callable directly delegates to one repo call but declares no Wraps edge.
    - code: docstring.single-repo-call-review
      intent: Callable has exactly one repo call and should be reviewed for a possible missing Wraps edge or stronger local-work explanation.
    - code: docstring.instantiation-why-action
      intent: InstantiationsFromRepo rationale uses an operation action instead of a product action.
    - code: docstring.instantiation-product-unshown
      intent: InstantiationsFromRepo target is not shown in Pseudocode as an assigned/returned/raised/yielded product.
    - code: docstring.dependency-section-overlap
      intent: One dependency target appears in multiple priority-ranked dependency sections.
    - code: docstring.wraps-incomplete
      intent: Wraps entry lacks required semantic details.
    - code: docstring.wraps-unresolved-target
      intent: Wraps target cannot be grounded to imports/local symbols/observed calls.
    - code: docstring.owning-single
      intent: Callable declares multiple owners while only one is allowed.
    - code: docstring.pseudocode-dependency-missing
      intent: Declared module dependency is not mentioned in pseudocode.
    - code: docstring.pseudocode-dependency-undocumented
      intent: Observed dependency is not mentioned in pseudocode.
