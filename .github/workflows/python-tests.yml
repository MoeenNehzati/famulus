name: Python Tests
run-name: >-
  Python Tests / ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.sha }}

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      mode:
        description: Run the complete matrix or one targeted probe.
        required: true
        type: choice
        options: [matrix, probe]
      request_id:
        description: Correlation identifier generated by the repository runner.
        required: true
        type: string
      expected_sha:
        description: Exact 40-hex commit expected after checkout.
        required: true
        type: string
      os:
        description: Probe operating system.
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
      task:
        description: Probe repository-check task.
        required: false
        default: 'tests:shared'
        type: choice
        options:
          - combined
          - 'native:keyring'
          - 'native:scheduler'
          - validators
          - 'tests:shared'
          - 'tests:github'
          - 'tests:install'
          - 'tests:browser'
          - 'tests:docstrings'
          - 'tests:portability'
          - 'tests:performance'
      selector:
        description: Optional repository-relative pytest file or node.
        required: false
        type: string
      jobs:
        description: Probe pytest worker count.
        required: false
        default: 4
        type: number
      profile:
        description: Probe worker profile.
        required: false
        default: default
        type: choice
        options: [default, serial]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'matrix'
    name: test (${{ matrix.os }}, ${{ matrix.task }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: combined
            artifact: ubuntu-combined
          - os: macos-latest
            task: validators
            jobs: 4
            artifact: macos-validators
          - os: macos-latest
            task: 'tests:shared'
            jobs: 4
            artifact: macos-tests-shared
          - os: macos-latest
            task: 'tests:performance'
            jobs: 4
            artifact: macos-tests-performance
          - os: windows-latest
            task: validators
            jobs: 4
            artifact: windows-validators
          - os: windows-latest
            task: 'tests:shared'
            jobs: 4
            artifact: windows-tests-shared
          - os: windows-latest
            task: 'tests:performance'
            jobs: 4
            artifact: windows-tests-performance
          - os: windows-latest
            task: 'tests:browser'
            jobs: 1
            artifact: windows-tests-browser
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify dispatched candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          REPO_CHECKS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: python
        run: |
          import os
          import subprocess
          import sys

          expected = os.environ["REPO_CHECKS_EXPECTED_SHA"]
          actual = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="strict",
          ).stdout.strip()
          if len(expected) != 40 or any(ch not in "0123456789abcdefABCDEF" for ch in expected):
              raise SystemExit("invalid expected SHA")
          if actual.casefold() != expected.casefold():
              raise SystemExit("checked-out commit does not match expected SHA")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Install Claude and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Run repository checks
        if: matrix.task == 'combined'
        env:
          FAMULUS_REQUIRE_BROWSER: '1'
        run: python3 repo_checks.py --suite full --verbose --jobs 1 --timing-output .repo-checks/timing.json

      - name: Run repository check shard
        if: matrix.task != 'combined'
        env:
          FAMULUS_REQUIRE_BROWSER: ${{ matrix.task == 'tests:browser' && '1' || '0' }}
        run: python3 repo_checks.py --suite full --task "${{ matrix.task }}" --verbose --jobs "${{ matrix.jobs }}" --timing-output .repo-checks/timing.json

      - name: Run portability sentinel
        if: >-
          always() &&
          (matrix.task == 'combined' || matrix.task == 'tests:shared')
        run: python3 repo_checks.py --suite full --task tests:portability --jobs 1 --timing-output .repo-checks/portability.json

      - name: Run published GitHub install smoke
        if: >-
          always() &&
          matrix.os == 'ubuntu-latest' && matrix.task == 'combined'
        run: python3 repo_checks.py --suite full --task tests:github --jobs 1 --timing-output .repo-checks/github.json

      - name: Run native keyring smoke
        if: >-
          always() &&
          ((matrix.os == 'macos-latest' && matrix.task == 'tests:performance') ||
          (matrix.os == 'windows-latest' && matrix.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:keyring --jobs 1 --timing-output .repo-checks/native-keyring.json

      - name: Run native recurring scheduler smoke
        if: >-
          always() &&
          ((matrix.os == 'macos-latest' && matrix.task == 'tests:performance') ||
          (matrix.os == 'windows-latest' && matrix.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:scheduler --jobs 1 --timing-output .repo-checks/native-scheduler.json

      - name: Upload repository-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-checks-${{ matrix.artifact }}-${{ github.run_id }}
          path: .repo-checks/*.json
          include-hidden-files: true
          if-no-files-found: warn

  unified-installation-lifecycle:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'matrix'
    name: unified installation lifecycle (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ubuntu-unified-installation
            platform: linux
            evidence_os: linux
          - os: macos-latest
            artifact: macos-unified-installation
            platform: darwin
            evidence_os: macos
          - os: windows-latest
            artifact: windows-unified-installation
            platform: win32
            evidence_os: windows
    runs-on: ${{ matrix.os }}
    env:
      FAMULUS_RUN_CLAUDE_ACCESS_SMOKE: ${{ vars.FAMULUS_RUN_CLAUDE_ACCESS_SMOKE || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Install pinned Claude and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code@2.1.237 @openai/codex@0.149.0

      - name: Run lifecycle renderer and migration evidence
        run: python3 repo_checks.py --suite full --task tests:shared --exclude-validator repo/docstrings --jobs 1 --selector tests/test_officina_install_context.py --selector tests/test_officina_development_activation.py --selector tests/test_officina_runtime_pointer.py --selector tests/test_officina_managed_runtime.py --selector tests/test_officina_install_doctor.py --selector tests/test_officina_recurring_managed.py --selector tests/test_officina_recurring_state.py --selector tests/test_install_context_consumers.py --selector skills/recurring-tasks/_rtx/tests/test_schedule_context_descriptor.py --selector skills/recurring-tasks/_rtx/tests/test_installation_namespaces.py --selector skills/install-assistant-tools/_rtx/tests/test_install.py --selector skills/install-assistant-tools/_rtx/tests/test_uninstall.py --selector skills/install-assistant-tools/_rtx/tests/test_doctor.py --selector skills/install-assistant-tools/_rtx/tests/test_e2e_lifecycle.py --selector skills/install-assistant-tools/_rtx/tests/test_assistant_access_e2e.py --timing-output .repo-checks/unified-shared.json

      - name: Run lifecycle installer evidence
        run: python3 repo_checks.py --suite full --task tests:install --exclude-validator repo/docstrings --jobs 1 --timing-output .repo-checks/unified-install.json

      # The live smoke self-skips with an explicit reason when a hosted runner
      # cannot expose its per-user scheduler. Renderer and migration evidence
      # above remains mandatory on every operating system.
      - name: Run lifecycle native scheduler evidence where available
        env:
          FAMULUS_RUN_SCHEDULER_SMOKE: '1'
        run: python3 repo_checks.py --suite full --task native:scheduler --exclude-validator repo/docstrings --jobs 1 --timing-output .repo-checks/unified-native-scheduler.json

      - name: Resolve external assistant access control root
        id: assistant-access-control
        shell: python
        env:
          FAMULUS_ACCESS_CONTROL_SUFFIX: ${{ github.run_id }}-${{ matrix.evidence_os }}
        run: |
          import os
          from pathlib import Path

          control = Path.home() / (
              ".famulus-assistant-access-control-"
              + os.environ["FAMULUS_ACCESS_CONTROL_SUFFIX"]
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              print(f"control_root={control}", file=stream)

      - name: Prepare assistant access configuration fixture
        env: &assistant-access-env
          HOME: ${{ runner.temp }}/famulus-assistant-access/home
          USERPROFILE: ${{ runner.temp }}/famulus-assistant-access/home
          CODEX_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/famulus-assistant-access/home/.claude
          XDG_CONFIG_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.local/share
          XDG_STATE_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.local/state
          APPDATA: ${{ runner.temp }}/famulus-assistant-access/home/AppData/Roaming
          LOCALAPPDATA: ${{ runner.temp }}/famulus-assistant-access/home/AppData/Local
        run: python3 skills/install-assistant-tools/_rtx/tests/assistant_access_probe.py prepare --platform "${{ matrix.platform }}" --source-root "${{ github.workspace }}" --home "${{ runner.temp }}/famulus-assistant-access/home" --state "${{ runner.temp }}/famulus-assistant-access/probe-state.json" --evidence ".repo-checks/assistant-access-${{ matrix.evidence_os }}.json" --control-root "${{ steps.assistant-access-control.outputs.control_root }}"

      - name: Run deterministic assistant config and OS-write probes
        env: *assistant-access-env
        run: python3 skills/install-assistant-tools/_rtx/tests/assistant_access_probe.py config-os-write --state "${{ runner.temp }}/famulus-assistant-access/probe-state.json" --evidence ".repo-checks/assistant-access-${{ matrix.evidence_os }}.json"

      - name: Run Claude client-install-health
        env: *assistant-access-env
        run: python3 skills/install-assistant-tools/_rtx/tests/assistant_access_probe.py client-install-health --client claude --state "${{ runner.temp }}/famulus-assistant-access/probe-state.json" --evidence ".repo-checks/assistant-access-${{ matrix.evidence_os }}.json"

      - name: Require pinned Linux Codex client
        if: matrix.os == 'ubuntu-latest'
        env: *assistant-access-env
        run: python3 skills/install-assistant-tools/_rtx/tests/assistant_access_probe.py client-install-health --client codex --state "${{ runner.temp }}/famulus-assistant-access/probe-state.json" --evidence ".repo-checks/assistant-access-${{ matrix.evidence_os }}.json"

      - name: Run Linux Codex host-enforcement
        if: matrix.os == 'ubuntu-latest'
        env: *assistant-access-env
        run: codex sandbox -- python3 skills/install-assistant-tools/_rtx/tests/assistant_access_probe.py host-enforcement --state "${{ runner.temp }}/famulus-assistant-access/probe-state.json" --evidence ".repo-checks/assistant-access-${{ matrix.evidence_os }}.json"

      - name: Run authenticated Claude access smoke when opted in
        if: env.FAMULUS_RUN_CLAUDE_ACCESS_SMOKE == '1'
        env:
          HOME: ${{ runner.temp }}/famulus-assistant-access/home
          USERPROFILE: ${{ runner.temp }}/famulus-assistant-access/home
          CODEX_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/famulus-assistant-access/home/.claude
          XDG_CONFIG_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.local/share
          XDG_STATE_HOME: ${{ runner.temp }}/famulus-assistant-access/home/.local/state
          APPDATA: ${{ runner.temp }}/famulus-assistant-access/home/AppData/Roaming
          LOCALAPPDATA: ${{ runner.temp }}/famulus-assistant-access/home/AppData/Local
          ANTHROPIC_API_KEY: ${{ secrets.FAMULUS_CLAUDE_ACCESS_SMOKE_API_KEY }}
        run: python3 skills/install-assistant-tools/_rtx/tests/assistant_access_probe.py claude-authenticated --state "${{ runner.temp }}/famulus-assistant-access/probe-state.json" --evidence ".repo-checks/assistant-access-${{ matrix.evidence_os }}.json"

      - name: Restore assistant configuration
        if: always()
        env: *assistant-access-env
        run: python3 skills/install-assistant-tools/_rtx/tests/assistant_access_probe.py restore --state "${{ runner.temp }}/famulus-assistant-access/probe-state.json" --evidence ".repo-checks/assistant-access-${{ matrix.evidence_os }}.json"

      - name: Upload assistant access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-access-${{ matrix.evidence_os }}-${{ github.run_id }}
          path: .repo-checks/assistant-access-${{ matrix.evidence_os }}.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload unified installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-checks-${{ matrix.artifact }}-${{ github.run_id }}
          path: .repo-checks/unified-*.json
          include-hidden-files: true
          if-no-files-found: warn

  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    name: probe (${{ inputs.os }}, ${{ inputs.task }})
    timeout-minutes: 10
    runs-on: ${{ inputs.os }}
    env:
      FAMULUS_REQUIRE_BROWSER: ${{ (inputs.task == 'tests:browser' || inputs.task == 'combined') && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify dispatched candidate
        env:
          REPO_CHECKS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["REPO_CHECKS_EXPECTED_SHA"]
          actual = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="strict",
          ).stdout.strip()
          if len(expected) != 40 or any(ch not in "0123456789abcdefABCDEF" for ch in expected):
              raise SystemExit("invalid expected SHA")
          if actual.casefold() != expected.casefold():
              raise SystemExit("checked-out commit does not match expected SHA")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Install Claude and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Run selected repository checks
        env:
          REPO_CHECKS_TASK: ${{ inputs.task }}
          REPO_CHECKS_SELECTOR: ${{ inputs.selector }}
          REPO_CHECKS_JOBS: ${{ inputs.jobs }}
          REPO_CHECKS_PROFILE: ${{ inputs.profile }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          jobs = "1" if os.environ["REPO_CHECKS_PROFILE"] == "serial" else os.environ["REPO_CHECKS_JOBS"]
          task = os.environ["REPO_CHECKS_TASK"]
          command = [
              sys.executable,
              "repo_checks.py",
              "--suite",
              "full",
              "--jobs",
              jobs,
              "--timing-output",
              ".repo-checks/timing.json",
          ]
          if task != "combined":
              command.extend(["--task", task])
          raw_selectors = os.environ.get("REPO_CHECKS_SELECTOR", "")
          selectors = (
              json.loads(raw_selectors)
              if raw_selectors.startswith("[")
              else [raw_selectors] if raw_selectors else []
          )
          if not isinstance(selectors, list) or not all(isinstance(item, str) for item in selectors):
              raise SystemExit("invalid selector list")
          for selector in selectors:
              command.extend(["--selector", selector])
          raise SystemExit(subprocess.run(command, check=False).returncode)

      - name: Run probe portability sentinel
        if: >-
          always() &&
          (inputs.selector == '' || inputs.selector == '[]') &&
          (inputs.task == 'combined' || inputs.task == 'tests:shared')
        run: python3 repo_checks.py --suite full --task tests:portability --jobs 1 --timing-output .repo-checks/portability.json

      - name: Run probe native keyring smoke
        if: >-
          always() &&
          (inputs.selector == '' || inputs.selector == '[]') &&
          ((inputs.os == 'macos-latest' && inputs.task == 'combined') ||
          (inputs.os == 'windows-latest' && inputs.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:keyring --jobs 1 --timing-output .repo-checks/native-keyring.json

      - name: Run probe native recurring scheduler smoke
        if: >-
          always() &&
          (inputs.selector == '' || inputs.selector == '[]') &&
          ((inputs.os == 'macos-latest' && inputs.task == 'combined') ||
          (inputs.os == 'windows-latest' && inputs.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:scheduler --jobs 1 --timing-output .repo-checks/native-scheduler.json

      - name: Upload repository-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-checks-probe-${{ github.run_id }}
          path: .repo-checks/*.json
          include-hidden-files: true
          if-no-files-found: warn
