name: Python Tests
run-name: >-
  Python Tests / ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.sha }}

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      mode:
        description: Run the complete matrix or one targeted probe.
        required: true
        type: choice
        options: [matrix, probe]
      request_id:
        description: Correlation identifier generated by the repository runner.
        required: true
        type: string
      expected_sha:
        description: Exact 40-hex commit expected after checkout.
        required: true
        type: string
      os:
        description: Probe operating system.
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
      task:
        description: Probe repository-check task.
        required: false
        default: 'tests:shared'
        type: choice
        options:
          - combined
          - 'native:keyring'
          - 'native:scheduler'
          - validators
          - 'tests:shared'
          - 'tests:github'
          - 'tests:install'
          - 'tests:browser'
          - 'tests:docstrings'
          - 'tests:portability'
          - 'tests:performance'
      selector:
        description: Optional repository-relative pytest file or node.
        required: false
        type: string
      jobs:
        description: Probe pytest worker count.
        required: false
        default: 4
        type: number
      profile:
        description: Probe worker profile.
        required: false
        default: default
        type: choice
        options: [default, serial]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'matrix'
    name: test (${{ matrix.os }}, ${{ matrix.task }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: combined
            artifact: ubuntu-combined
          - os: macos-latest
            task: combined
            artifact: macos-combined
          - os: windows-latest
            task: validators
            jobs: 4
            artifact: windows-validators
          - os: windows-latest
            task: 'tests:shared'
            jobs: 4
            artifact: windows-tests-shared
          - os: windows-latest
            task: 'tests:performance'
            jobs: 4
            artifact: windows-tests-performance
          - os: windows-latest
            task: 'tests:browser'
            jobs: 1
            artifact: windows-tests-browser
    runs-on: ${{ matrix.os }}
    # Browser jobs must execute browser assertions rather than pass by skipping
    # them. Wall-clock benchmarks stay opt-in because hosted-runner load is not
    # a stable regression signal; structural performance invariants still run.
    env:
      FAMULUS_REQUIRE_BROWSER: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify dispatched candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          REPO_CHECKS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: python
        run: |
          import os
          import subprocess
          import sys

          expected = os.environ["REPO_CHECKS_EXPECTED_SHA"]
          actual = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="strict",
          ).stdout.strip()
          if len(expected) != 40 or any(ch not in "0123456789abcdefABCDEF" for ch in expected):
              raise SystemExit("invalid expected SHA")
          if actual.casefold() != expected.casefold():
              raise SystemExit("checked-out commit does not match expected SHA")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Install Claude and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Run repository checks
        if: matrix.task == 'combined'
        run: python3 repo_checks.py --suite full --verbose --sequential --timing-output .repo-checks/timing.json

      - name: Run repository check shard
        if: matrix.task != 'combined'
        run: python3 repo_checks.py --suite full --task-id "${{ matrix.task }}" --verbose --jobs "${{ matrix.jobs }}" --timing-output .repo-checks/timing.json

      - name: Run portability sentinel
        if: >-
          always() &&
          (matrix.task == 'combined' || matrix.task == 'tests:shared')
        run: python3 repo_checks.py --suite full --task tests:portability --jobs 1 --timing-output .repo-checks/portability.json

      - name: Run published GitHub install smoke
        if: >-
          always() &&
          matrix.os == 'ubuntu-latest' && matrix.task == 'combined'
        run: python3 repo_checks.py --suite full --task tests:github --jobs 1 --timing-output .repo-checks/github.json

      - name: Run native keyring smoke
        if: >-
          always() &&
          ((matrix.os == 'macos-latest' && matrix.task == 'combined') ||
          (matrix.os == 'windows-latest' && matrix.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:keyring --jobs 1 --timing-output .repo-checks/native-keyring.json

      - name: Run native recurring scheduler smoke
        if: >-
          always() &&
          ((matrix.os == 'macos-latest' && matrix.task == 'combined') ||
          (matrix.os == 'windows-latest' && matrix.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:scheduler --jobs 1 --timing-output .repo-checks/native-scheduler.json

      - name: Upload repository-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-checks-${{ matrix.artifact }}-${{ github.run_id }}
          path: .repo-checks/*.json
          include-hidden-files: true
          if-no-files-found: warn

  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    name: probe (${{ inputs.os }}, ${{ inputs.task }})
    timeout-minutes: 10
    runs-on: ${{ inputs.os }}
    # A browser probe promises real browser coverage. Wall-clock benchmarks
    # remain an explicit diagnostic rather than a hosted-runner gate.
    env:
      FAMULUS_REQUIRE_BROWSER: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify dispatched candidate
        env:
          REPO_CHECKS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: python
        run: |
          import os
          import subprocess

          expected = os.environ["REPO_CHECKS_EXPECTED_SHA"]
          actual = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="strict",
          ).stdout.strip()
          if len(expected) != 40 or any(ch not in "0123456789abcdefABCDEF" for ch in expected):
              raise SystemExit("invalid expected SHA")
          if actual.casefold() != expected.casefold():
              raise SystemExit("checked-out commit does not match expected SHA")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Install Claude and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Run selected repository checks
        env:
          REPO_CHECKS_TASK: ${{ inputs.task }}
          REPO_CHECKS_SELECTOR: ${{ inputs.selector }}
          REPO_CHECKS_JOBS: ${{ inputs.jobs }}
          REPO_CHECKS_PROFILE: ${{ inputs.profile }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys

          jobs = "1" if os.environ["REPO_CHECKS_PROFILE"] == "serial" else os.environ["REPO_CHECKS_JOBS"]
          task = os.environ["REPO_CHECKS_TASK"]
          command = [
              sys.executable,
              "repo_checks.py",
              "--suite",
              "full",
              "--jobs",
              jobs,
              "--timing-output",
              ".repo-checks/timing.json",
          ]
          if task != "combined":
              command.extend(["--task", task])
          raw_selectors = os.environ.get("REPO_CHECKS_SELECTOR", "")
          selectors = (
              json.loads(raw_selectors)
              if raw_selectors.startswith("[")
              else [raw_selectors] if raw_selectors else []
          )
          if not isinstance(selectors, list) or not all(isinstance(item, str) for item in selectors):
              raise SystemExit("invalid selector list")
          for selector in selectors:
              command.extend(["--selector", selector])
          raise SystemExit(subprocess.run(command, check=False).returncode)

      - name: Run probe portability sentinel
        if: >-
          always() &&
          (inputs.selector == '' || inputs.selector == '[]') &&
          (inputs.task == 'combined' || inputs.task == 'tests:shared')
        run: python3 repo_checks.py --suite full --task tests:portability --jobs 1 --timing-output .repo-checks/portability.json

      - name: Run probe native keyring smoke
        if: >-
          always() &&
          (inputs.selector == '' || inputs.selector == '[]') &&
          ((inputs.os == 'macos-latest' && inputs.task == 'combined') ||
          (inputs.os == 'windows-latest' && inputs.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:keyring --jobs 1 --timing-output .repo-checks/native-keyring.json

      - name: Run probe native recurring scheduler smoke
        if: >-
          always() &&
          (inputs.selector == '' || inputs.selector == '[]') &&
          ((inputs.os == 'macos-latest' && inputs.task == 'combined') ||
          (inputs.os == 'windows-latest' && inputs.task == 'tests:performance'))
        run: python3 repo_checks.py --suite full --task native:scheduler --jobs 1 --timing-output .repo-checks/native-scheduler.json

      - name: Upload repository-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-checks-probe-${{ github.run_id }}
          path: .repo-checks/*.json
          include-hidden-files: true
          if-no-files-found: warn
